<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지도 DB 관리</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--line:#e2d9c6;--ink:#3a3226;--sub:#7a6e5c;--accent:#a8552b}
*{box-sizing:border-box}body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
header h1{margin:0;font-size:20px}header span{color:var(--sub);font-size:13px}
main{display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px;height:calc(100vh - 56px)}
@media(max-width:820px){main{grid-template-columns:1fr;height:auto}#map{height:60vh}}
.col{display:flex;flex-direction:column;gap:12px;overflow:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv b{font-weight:600;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td{padding:3px 4px;border-bottom:1px solid #f0e9da}td.n{text-align:right;font-variant-numeric:tabular-nums}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}
#log{font-family:Consolas,monospace;font-size:12px;background:#2b2722;color:#e9e2d2;border-radius:6px;padding:8px;max-height:180px;overflow:auto;white-space:pre-wrap;margin-top:8px;display:none}
.res{font-size:13px;max-height:280px;overflow:auto}.res div{padding:5px 4px;border-bottom:1px solid #f0e9da;cursor:pointer}.res div:hover{background:#f6efe0}
.res small{color:var(--sub)}#map{border-radius:10px;border:1px solid var(--line);min-height:400px}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
</style></head><body>
<header><h1>🗄️ 지도 DB 관리</h1><span>한국 OpenStreetMap 지명·도로·하천·등산로를 NAS에 담아 지도 도구들이 바로 꺼내 쓰는 곳</span></header>
<main>
<div class="col">
  <div class="card"><h2>현황</h2><div id="stat" class="kv">불러오는 중…</div></div>
  <div class="card"><h2>데이터 갱신</h2>
    <div style="font-size:13px">OSM 한국 최신 데이터(약 290MB)를 받아 DB를 새로 만듭니다. NAS에서 10분 안팎 걸리며, 그동안에도 기존 DB로 계속 동작합니다.</div>
    <div style="margin-top:10px"><button id="btnRefresh">🔄 데이터 갱신</button> <span id="jobState" class="hint"></span></div>
    <div id="log"></div></div>
  <div class="card"><h2>검색</h2>
    <div style="display:flex;gap:6px"><input id="q" placeholder="예: 함백산, 만항재" style="flex:1"><select id="kind"><option value="">전체</option></select></div>
    <div id="res" class="res"></div></div>
  <div class="card"><h2>종류별 개수</h2><div id="kinds">—</div></div>
</div>
<div id="map"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const KIND={'natural=peak':'봉우리','natural=saddle':'고개','natural=spring':'샘','natural=cave_entrance':'동굴',
 'place=city':'시','place=town':'읍','place=village':'마을','place=hamlet':'작은마을','place=suburb':'동·면','place=neighbourhood':'동네','place=quarter':'구역','place=borough':'구','place=county':'군',
 'railway=station':'역','amenity=school':'학교','amenity=place_of_worship':'사찰·교회','amenity=parking':'주차장','amenity=shelter':'쉼터',
 'tourism=viewpoint':'전망대','tourism=information':'안내소','tourism=alpine_hut':'대피소','tourism=camp_site':'야영장',
 'highway=motorway':'고속도로','highway=trunk':'간선도로','highway=primary':'국도','highway=secondary':'지방도','highway=tertiary':'군도','highway=unclassified':'소로','highway=residential':'마을길',
 'highway=track':'임도','highway=path':'등산로','highway=footway':'보행로','highway=steps':'계단','admin=4':'시·도','admin=6':'시·군·구','admin=7':'일반구','admin=8':'읍·면·동','waterway=river':'강','waterway=stream':'계곡·하천','natural=water':'호수·저수지','railway=rail':'철도'};
const kname=k=>KIND[k]||k;
const fmt=n=>Number(n).toLocaleString('ko-KR');
async function loadStats(){
  let s;try{s=await (await fetch('api/stats')).json();}catch(e){$('stat').textContent='서버에 연결하지 못했습니다.';return;}
  if(!s.ready){$('stat').innerHTML='<span>아직 DB가 없습니다. 「데이터 갱신」을 눌러 처음 만들어 주세요.</span>';return;}
  const m=s.meta;$('stat').innerHTML=`<b>DB 생성</b><span>${m.built_at}</span><b>OSM 원본</b><span>${m.source_date?new Date(m.source_date).toLocaleString('ko-KR'):'—'}</span>
   <b>점</b><span>${fmt(m.poi_count)}개</span><b>선</b><span>${fmt(m.line_count)}개</span><b>면</b><span>${m.area_count?fmt(m.area_count)+'개':'— (갱신 필요)'}</span><b>갈림길</b><span>${fmt(s.junctions)}개</span><b>크기</b><span>${fmt(s.size_mb)}MB</span>`;
  const rows=(o)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${kname(k)}</td><td style="color:#aaa">${k}</td><td class="n">${fmt(v)}</td></tr>`).join('');
  $('kinds').innerHTML=`<table><tr><td colspan=3><b>점</b></td></tr>${rows(s.kinds.poi)}<tr><td colspan=3 style="padding-top:8px"><b>선</b></td></tr>${rows(s.kinds.line)}<tr><td colspan=3 style="padding-top:8px"><b>면</b></td></tr>${rows(s.kinds.area||{})}</table>`;
  $('kind').innerHTML='<option value="">전체</option>'+Object.keys(s.kinds.poi).map(k=>`<option value="${k}">${kname(k)}</option>`).join('');
}
// 갱신
let poll=0;
async function jobStatus(){
  const j=await (await fetch('api/refresh')).json();
  $('btnRefresh').disabled=j.running;
  $('jobState').textContent=j.running?`진행 중 (시작 ${j.started})`:j.ended?(j.ok?`✅ 완료 ${j.ended}`:`⚠️ 실패 ${j.ended}`):'';
  if(j.log.length){$('log').style.display='block';$('log').textContent=j.log.join('\n');$('log').scrollTop=1e9;}
  clearTimeout(poll);if(j.running)poll=setTimeout(jobStatus,3000);else if(j.ended)loadStats();
}
$('btnRefresh').onclick=async()=>{if(!confirm('OSM 최신 데이터를 받아 DB를 새로 만들까요? (10분 안팎)'))return;await fetch('api/refresh',{method:'POST'});jobStatus();};
// 지도
const map=L.map('map').setView([36.4,127.9],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);const info=L.control({position:'topright'});
info.onAdd=()=>{const d=L.DomUtil.create('div');d.style.cssText='background:#fffdf8;padding:6px 10px;border-radius:6px;font-size:12px;border:1px solid #e2d9c6';return d;};info.addTo(map);
const COLOR=k=>k.startsWith('waterway')||k==='natural=water'?'#3d8fd6':k==='highway=path'||k==='highway=footway'||k==='highway=steps'?'#e8892a':k==='highway=track'?'#a07a52':k.startsWith('railway')?'#333':'#888';
let vt=0;
async function view(){
  const b=map.getBounds(),s=b.getSouth(),w=b.getWest(),n=b.getNorth(),e=b.getEast();
  layer.clearLayers();
  if(map.getZoom()<12){info.getContainer().textContent='확대(12단계 이상)하면 DB에 든 지명·선을 표시합니다';return;}
  info.getContainer().textContent='불러오는 중…';const t0=performance.now();
  let j;try{const r=await fetch(`api/bbox?s=${s}&w=${w}&n=${n}&e=${e}`);j=await r.json();if(!r.ok)throw new Error(j.error);}catch(err){info.getContainer().textContent='⚠️ '+err.message;return;}
  let np=0,nl=0;
  for(const x of j.elements){
    if(x.type==='area'){const ad=x.tags.boundary==='administrative';
      x.rings.forEach(r=>L.polygon(r,{color:ad?'#b4473a':'#3d8fd6',weight:ad?1.5:1,dashArray:ad?'6 4':null,fill:!ad,fillOpacity:.35}).bindTooltip(`${x.tags.name||'(이름 없음)'} · ${ad?'행정구역 '+x.tags.admin_level:'호수·저수지'}`).addTo(layer));nl++;continue;}
    if(x.type==='way'){const k=x.tags.highway?'highway='+x.tags.highway:x.tags.waterway?'waterway='+x.tags.waterway:x.tags.natural==='water'?'natural=water':'railway=rail';
      L.polyline(x.geometry.map(p=>[p.lat,p.lon]),{color:COLOR(k),weight:k==='highway=path'?3:2,opacity:.85}).bindTooltip(`${x.tags.name||'(이름 없음)'} · ${kname(k)}`).addTo(layer);nl++;}
    else{const t=x.tags,k=Object.keys(KIND).find(kk=>{const[a,v]=kk.split('=');return t[a]===v;})||'';
      L.circleMarker([x.lat,x.lon],{radius:k==='natural=peak'?5:4,color:k==='natural=peak'?'#2f6b2a':'#a8552b',weight:2,fillOpacity:.8})
       .bindTooltip(`${t['name:ko']||t.name}${t.ele?' '+t.ele+'m':''} · ${kname(k)}`).addTo(layer);np++;}
  }
  info.getContainer().textContent=`점 ${fmt(np)} · 선 ${fmt(nl)} · ${Math.round(performance.now()-t0)}ms`;
}
map.on('moveend',()=>{clearTimeout(vt);vt=setTimeout(view,250);});
// 검색
let st=0;
async function doSearch(){const q=$('q').value.trim();if(!q){$('res').innerHTML='';return;}
  const r=await (await fetch(`api/search?q=${encodeURIComponent(q)}&kind=${encodeURIComponent($('kind').value)}`)).json();
  $('res').innerHTML=r.length?r.map((p,i)=>`<div data-i="${i}">${p.name} <small>${kname(p.kind)}${p.ele?' · '+fmt(p.ele)+'m':''} · ${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</small></div>`).join(''):'<div style="cursor:default">결과 없음</div>';
  $('res').querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{const p=r[+d.dataset.i];map.setView([p.lat,p.lon],14);L.popup().setLatLng([p.lat,p.lon]).setContent(p.name).openOn(map);});}
$('q').oninput=()=>{clearTimeout(st);st=setTimeout(doSearch,250);};$('kind').onchange=doSearch;
loadStats();jobStatus();
</script>
</body></html>
