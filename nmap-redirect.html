<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">산행 경로 보기</title>
<meta id="og-title" property="og:title" content="산행 경로 보기">
<meta id="og-description" property="og:description" content="네이버지도 앱에서 산행 경로를 확인하세요.">
<meta property="og:type" content="website">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #f0f4f8; color: #2d3748; text-align: center; padding: 24px; }
  .box { max-width: 420px; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  p { font-size: 13.5px; color: #718096; line-height: 1.6; }
  .btn { display: inline-block; margin-top: 16px; background: #2b6cb0; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-weight: 700; font-size: 14px; }
  .btn:hover { background: #2c5282; }
  .warn { display: none; background: #fff3cd; border: 1px solid #ffc107; color: #7a5c00; font-size: 12.5px; font-weight: 700; padding: 10px 14px; border-radius: 8px; margin-top: 16px; }
  .closed-box { display: none; }
</style>
<script>
(function() {
  function isMobile() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  var params = new URLSearchParams(location.search);
  var query = params.get('q');
  var title = params.get('title');

  if (title) {
    document.title = title + ' 산행 경로';
  }

  if (query && isMobile()) {
    var isAndroid = /Android/i.test(navigator.userAgent);
    var nmapUrl = 'nmap://route/walk?' + query;
    var intentUrl = 'intent://route/walk?' + query + '#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end';
    var targetUrl = isAndroid ? intentUrl : nmapUrl;

    // 앱에서 이 탭으로 돌아오면(visibilitychange) 탭을 바로 닫아버린다.
    // 스크립트로 연 탭이 아니면 대부분의 모바일 브라우저가 close()를 막으므로,
    // 그 경우엔 body의 "닫아도 됩니다" 안내로 넘어가 최소한 헷갈리지 않게 한다.
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        window.close();
        var closedBox = document.getElementById('closed-box');
        var mainBox = document.getElementById('main-box');
        if (closedBox && mainBox) {
          mainBox.style.display = 'none';
          closedBox.style.display = 'block';
        }
      }
    });

    location.replace(targetUrl);
  }
  // PC(데스크톱)에는 nmap:// 앱 스킴을 처리할 프로그램이 없어 그대로 두면
  // 아무 반응 없이 실패한다. 네이버지도 앱 전용 다중 경유지 길찾기를 PC 웹에서
  // 그대로 재현하려면 네이버 내부 좌표계(EPSG:3857) 변환이 필요해 GPX
  // 위도/경도만으로는 정확히 만들 수 없으므로, 대신 확실히 동작하는
  // 들머리(출발지) 위치 표시 링크(map.naver.com/p?lat=&lng=)로 자동 이동한다.
  // 아래 body 하단 스크립트가 이 PC 분기를 처리한다.
})();
</script>
</head>
<body>
  <div class="box" id="main-box">
    <h1 id="main-title">📱 네이버지도 앱으로 이동 중...</h1>
    <p id="main-desc">자동으로 이동하지 않으면 아래 버튼을 눌러주세요.<br>네이버지도 앱이 설치되어 있어야 합니다.</p>
    <a class="btn" id="btn-open" href="#">네이버지도 앱 열기</a>
    <div class="warn" id="warn-box">⚠ 링크 정보가 없습니다. 이 페이지는 gpx-map.html에서 생성한 링크로만 접속해야 합니다.</div>
  </div>
  <div class="box closed-box" id="closed-box">
    <h1>✅ 네이버지도 앱을 확인하셨나요?</h1>
    <p>이 탭은 이제 닫으셔도 됩니다.</p>
  </div>

<script>
(function() {
  function isMobile() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  var params = new URLSearchParams(location.search);
  var query = params.get('q');
  var title = params.get('title');
  var warnBox = document.getElementById('warn-box');
  var btn = document.getElementById('btn-open');
  var titleEl = document.getElementById('main-title');
  var descEl = document.getElementById('main-desc');

  if (title) {
    document.getElementById('og-title').setAttribute('content', title + ' 산행 경로');
    document.getElementById('og-description').setAttribute('content', title + ' 산행 경로를 네이버지도 앱에서 확인하세요.');
  }

  if (!query) {
    warnBox.style.display = 'block';
    btn.style.display = 'none';
    return;
  }

  if (isMobile()) {
    if (title) titleEl.textContent = '📱 ' + title + ' 경로 - 네이버지도 앱으로 이동 중...';
    var isAndroid = /Android/i.test(navigator.userAgent);
    var nmapUrl = 'nmap://route/walk?' + query;
    var intentUrl = 'intent://route/walk?' + query + '#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end';
    var targetUrl = isAndroid ? intentUrl : nmapUrl;
    btn.href = targetUrl;
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      location.href = targetUrl;
    });
    return;
  }

  // PC: 네이버지도 앱 전용 다중 경유지 도보 길찾기는 웹에서 그대로 재현할 수
  // 없으므로(네이버 내부 좌표계 변환 필요), 확실히 동작하는 들머리(출발지)
  // 위치 표시 링크로 대체한다. 경유지/날머리를 잇는 자동 도보 경로가 아니라
  // 출발 지점 하나만 지도에 표시된다는 점을 안내에 명시한다.
  var qParams = new URLSearchParams(query);
  var slat = qParams.get('slat');
  var slng = qParams.get('slng');
  var sname = qParams.get('sname') || (title ? title + ' 들머리' : '들머리');

  if (slat && slng) {
    if (title) titleEl.textContent = '🖥️ ' + title + ' 들머리 위치 - 네이버지도로 이동 중...';
    descEl.innerHTML = 'PC에서는 네이버지도 앱의 다중 경유지 도보 경로를 열 수 없어, 대신 들머리(출발지) 위치를 네이버지도 웹에서 보여드립니다.<br>전체 경로가 필요하면 모바일 기기에서 이 링크를 열어 네이버지도 앱을 이용해주세요.';
    var webUrl = 'https://map.naver.com/p?title=' + encodeURIComponent(sname) +
      '&lat=' + encodeURIComponent(slat) + '&lng=' + encodeURIComponent(slng);
    btn.textContent = '네이버지도(웹)에서 들머리 보기';
    btn.href = webUrl;
    btn.target = '_blank';
    btn.rel = 'noopener';
    location.href = webUrl;
  } else {
    warnBox.style.display = 'block';
    warnBox.textContent = '⚠ 들머리 좌표 정보가 없어 PC에서는 위치를 표시할 수 없습니다.';
    btn.style.display = 'none';
  }
})();
</script>
</body>
</html>
