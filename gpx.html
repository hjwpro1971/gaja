<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 등산로 지도로 이동 중...</title>
  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const gpxUrl = urlParams.get('url') || urlParams.get('file') || '';
      const courseName = urlParams.get('name') || '';

      if (gpxUrl) {
        window.location.replace(`track_viewer.html?name=${encodeURIComponent(courseName)}&url=${encodeURIComponent(gpxUrl)}`);
      } else {
        window.location.replace('track_viewer.html');
      }
    })();
  </script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f8faf8; }
    .box { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🗺️ 스마트 등산로 지도로 연결하고 있습니다...</h2>
    <p>잠시만 기다려 주세요.</p>
  </div>
</body>
</html>
