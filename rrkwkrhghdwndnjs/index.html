<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>가자(GAJA) - 작업 대시보드</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            background-color: #f4f6f9;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }

        /* 왼쪽 사이드바 스타일 */
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: #c2c7d0;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 10;
        }
        
        .sidebar.collapsed {
            width: 60px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #2c3136;
            border-bottom: 1px solid #4b545c;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.3s;
        }

        .sidebar.collapsed .sidebar-header h2 {
            opacity: 0;
            width: 0;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #c2c7d0;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
        }

        .toggle-btn:hover {
            color: white;
        }
        
        .sidebar.collapsed .toggle-btn {
            margin: 0 auto;
        }

        /* 메뉴 리스트 영역 */
        .menu-list {
            list-style: none;
            padding: 10px 0;
            margin: 0;
            flex-grow: 1;
            overflow-y: auto;
        }
        
        .child-list {
            list-style: none;
            padding: 0 0 0 15px; /* 들여쓰기 */
            margin: 0;
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(0,0,0,0.1); /* 약간 어둡게 */
        }

        .menu-item {
            display: flex;
            flex-direction: column;
        }

        .item-content {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .item-content:hover {
            background-color: #4b545c;
            color: white;
        }

        .menu-icon {
            margin-right: 10px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
        }

        .item-content a, .item-content .folder-title {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.95rem;
            color: inherit;
            text-decoration: none;
            
            /* 모바일 텍스트 선택 방지 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .sidebar.collapsed .item-content a, 
        .sidebar.collapsed .item-content .folder-title,
        .sidebar.collapsed .child-list {
            display: none;
        }

        .sidebar.collapsed .item-content {
            justify-content: center;
            padding: 15px 0;
        }

        .sidebar.collapsed .menu-icon {
            margin-right: 0;
        }

        /* 액션 버튼 (수정/삭제/추가) */
        .menu-actions {
            display: none; 
            gap: 5px;
            position: absolute;
            right: 15px;
            background-color: #4b545c;
            padding: 2px 5px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 5;
        }

        .item-content.show-actions .menu-actions {
            display: flex;
        }
        
        .sidebar.collapsed .item-content.show-actions .menu-actions {
            display: none;
        }

        .menu-actions button {
            background: none;
            border: none;
            color: #d1d5db;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 5px;
            transition: color 0.2s, background-color 0.2s;
        }

        .menu-actions button:hover {
            color: white;
            background-color: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        /* 하단 관리 메뉴 */
        .sidebar-footer {
            border-top: 1px solid #4b545c;
            background-color: #2c3136;
        }

        .footer-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            cursor: pointer;
            color: #c2c7d0;
            transition: background-color 0.2s, color 0.2s;
        }

        .footer-header:hover {
            background-color: #4b545c;
            color: white;
        }

        .gear-icon {
            font-size: 1.1rem;
        }

        .footer-title {
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            transition: opacity 0.3s;
        }

        .sidebar.collapsed .footer-title {
            opacity: 0;
            width: 0;
            display: none;
        }

        .sidebar.collapsed .footer-header {
            justify-content: center;
            padding: 12px 0;
        }

        /* 메뉴 추가 컨트롤 영역 */
        .menu-controls {
            padding: 0 15px 15px 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .menu-controls.active {
            display: flex;
        }

        .sidebar.collapsed .menu-controls {
            display: none !important;
        }

        .menu-controls input {
            padding: 6px 8px;
            border: 1px solid #4b545c;
            border-radius: 4px;
            background-color: #3f474e;
            color: white;
            font-size: 0.75rem;
            box-sizing: border-box;
        }
        
        .menu-controls input::placeholder {
            color: #869099;
        }

        .menu-controls button {
            padding: 6px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            transition: background-color 0.2s;
        }

        .menu-controls button:hover {
            background-color: #0056b3;
        }
        
        .help-text {
            font-size: 0.65rem;
            color: #869099;
            margin-top: -2px;
            text-align: center;
        }

        /* 드래그로 순서 바꾸기 */
        .item-content[draggable="true"] { cursor: grab; }
        .item-content.dragging {
            opacity: 0.4;
            cursor: grabbing;
        }
        /* 드롭 위치 표시: 위/아래 경계선, 폴더 안이면 테두리 */
        .item-content.drop-before { box-shadow: inset 0 3px 0 0 #007bff; }
        .item-content.drop-after  { box-shadow: inset 0 -3px 0 0 #007bff; }
        .item-content.drop-inside {
            background-color: #0d6efd33;
            box-shadow: inset 0 0 0 2px #007bff;
        }

        /* 우측 프레임 창 */
        .content-frame {
            flex-grow: 1;
            border: none;
            background-color: #ffffff;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 id="sidebar-title">가자(GAJA)</h2>
            <button class="toggle-btn" id="toggle-btn" title="메뉴 확대/축소">☰</button>
        </div>
        
        <ul class="menu-list" id="menu-list">
            <!-- 동적으로 메뉴 추가 -->
        </ul>

        <div class="sidebar-footer">
            <div class="footer-header" id="gear-btn" title="관리 메뉴 열기/닫기">
                <span class="gear-icon">⚙️</span>
                <span class="footer-title">관리 메뉴</span>
            </div>
            
            <div class="menu-controls" id="menu-controls">
                <input type="text" id="menu-name" placeholder="메뉴 이름" />
                
                <!-- 파일 탐색 및 URL 입력 영역 -->
                <div style="display: flex; gap: 5px; width: 100%;">
                    <input type="text" id="menu-url" placeholder="URL (비워두면 폴더)" style="flex-grow: 1; width: 10px;" />
                    <button type="button" id="browse-btn" style="background-color: #6c757d; padding: 0 8px; white-space: nowrap;">📁 파일</button>
                    <!-- 실제 파일 선택 창 (숨김 처리) -->
                    <input type="file" id="file-input" style="display: none;" />
                </div>
                
                <div class="help-text">💡 URL을 비워두면 하위 메뉴를 넣을 수 있는 '폴더'가 만들어집니다.</div>
                <button id="add-btn">추가</button>
            </div>
        </div>
    </div>

    <iframe class="content-frame" name="contentFrame" id="content-frame" src="builder.html"></iframe>
</div>

<script>
    // 상태 관리: 다단계 구조 지원
    // 처음 열었을 때 보일 기본 메뉴 = gaja 도구 6개.
    // 한 번이라도 메뉴를 편집하면 그 결과가 localStorage('savedMenus')에
    // 저장되고, 이후로는 저장된 쪽이 우선한다. 기본값으로 되돌리려면
    // 브라우저에서 savedMenus 항목을 지우면 된다.
    const DEFAULT_MENUS = [
        { id: 1, name: '산행가이드',       type: 'link', url: 'builder.html' },
        { id: 2, name: '블로그헤더',       type: 'link', url: 'bloghead.html' },
        { id: 3, name: '산행가이드표지',   type: 'link', url: 'guide_prompt.html' },
        { id: 4, name: 'GPX 경로 생성',    type: 'link', url: 'gpx-map.html' },
        { id: 5, name: '산행요약 생성',    type: 'link', url: 'hiking_summary.html' },
        { id: 6, name: '100대명산 데이터', type: 'link', url: 'hundred_mountains.html' },
        { id: 7, name: '메모 · 자료',       type: 'link', url: 'notes.html' }
    ];

    let menus = JSON.parse(localStorage.getItem('savedMenus')) || DEFAULT_MENUS;

    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');
    const menuList = document.getElementById('menu-list');
    const addBtn = document.getElementById('add-btn');
    const menuNameInput = document.getElementById('menu-name');
    const menuUrlInput = document.getElementById('menu-url');
    const gearBtn = document.getElementById('gear-btn');
    const menuControls = document.getElementById('menu-controls');
    
    // 파일 탐색기 요소
    const browseBtn = document.getElementById('browse-btn');
    const fileInput = document.getElementById('file-input');

    // ─────────────────────────────────────────────────────────────
    // 드래그로 순서 바꾸기
    //
    // 트리(폴더 중첩)를 다루므로 "몇 번째"가 아니라 id로 항목을 찾는다.
    // 드롭 위치는 세로 위치로 판정한다: 위 25%면 앞, 아래 25%면 뒤,
    // 가운데는 대상이 폴더일 때 그 안으로 넣는다(폴더가 아니면 뒤로).
    // ─────────────────────────────────────────────────────────────
    let dragSourceId = null;

    // id로 항목과 그것이 담긴 배열을 찾는다(재귀).
    function findMenu(id, list = menus) {
        for (const m of list) {
            if (m.id === id) return { menu: m, parent: list };
            if (m.children) {
                const hit = findMenu(id, m.children);
                if (hit) return hit;
            }
        }
        return null;
    }

    // 폴더를 자기 자신이나 자기 자손 안으로 넣으면 트리가 끊어진다.
    function isDescendant(ancestorId, targetId) {
        const found = findMenu(ancestorId);
        if (!found || !found.menu.children) return false;
        const walk = (list) => list.some(m =>
            m.id === targetId || (m.children && walk(m.children)));
        return walk(found.menu.children);
    }

    function moveMenu(sourceId, targetId, position) {
        if (sourceId === targetId) return;
        if (isDescendant(sourceId, targetId)) {
            alert('폴더를 자기 하위로는 옮길 수 없습니다.');
            return;
        }

        const src = findMenu(sourceId);
        const tgt = findMenu(targetId);
        if (!src || !tgt) return;

        // 먼저 원래 자리에서 뺀다.
        src.parent.splice(src.parent.indexOf(src.menu), 1);

        if (position === 'inside') {
            if (!tgt.menu.children) tgt.menu.children = [];
            tgt.menu.children.push(src.menu);
            tgt.menu.isOpen = true;
        } else {
            // 제거 후 인덱스가 밀릴 수 있으므로 여기서 다시 구한다.
            const at = tgt.parent.indexOf(tgt.menu);
            tgt.parent.splice(position === 'before' ? at : at + 1, 0, src.menu);
        }
        renderMenus();
    }

    function clearDropMarks() {
        document.querySelectorAll('.drop-before,.drop-after,.drop-inside')
            .forEach(el => el.classList.remove('drop-before','drop-after','drop-inside'));
    }

    function saveMenus() {
        localStorage.setItem('savedMenus', JSON.stringify(menus));
    }

    // [📁 파일] 버튼 클릭 시 숨겨진 input type="file" 실행
    browseBtn.addEventListener('click', () => {
        fileInput.click();
    });

    // 파일을 선택했을 때의 동작
    fileInput.addEventListener('change', function() {
        if (this.files && this.files.length > 0) {
            const fileName = this.files[0].name;
            
            // 브라우저 보안 정책상 전체 절대경로(C:\...)는 알 수 없고 파일명만 가져옵니다.
            // 같은 폴더에 있는 파일을 고를 때 유용합니다.
            menuUrlInput.value = fileName; 
            
            // 메뉴 이름이 비어있다면, 선택한 파일명(확장자 제외)으로 자동 입력해 줍니다.
            if (!menuNameInput.value) {
                const nameWithoutExt = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
                menuNameInput.value = nameWithoutExt;
            }
            
            // 같은 파일을 다시 선택할 수 있도록 값 초기화
            this.value = ''; 
        }
    });

    // 빈 곳 클릭 시 액션 버튼 닫기
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.menu-actions')) {
            document.querySelectorAll('.item-content.show-actions').forEach(el => {
                el.classList.remove('show-actions');
            });
        }
    });

    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        if (sidebar.classList.contains('collapsed')) {
            menuControls.classList.remove('active');
        }
    });

    gearBtn.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
            sidebar.classList.remove('collapsed');
            setTimeout(() => {
                menuControls.classList.toggle('active');
            }, 300);
        } else {
            menuControls.classList.toggle('active');
        }
    });

    // 재귀적으로 메뉴 트리를 그리는 함수
    function buildNode(menu, parentArray) {
        const li = document.createElement('li');
        li.className = 'menu-item';
        
        const itemContent = document.createElement('div');
        itemContent.className = 'item-content';
        
        // 1. 아이콘 설정 (폴더 열림/닫힘, 링크)
        const iconSpan = document.createElement('span');
        iconSpan.className = 'menu-icon';
        if (menu.type === 'folder') {
            iconSpan.textContent = menu.isOpen ? '📂' : '📁';
        } else {
            iconSpan.textContent = '🔗';
        }

        // 2. 제목/링크 엘리먼트 생성
        let clickableElem;
        if (menu.type === 'folder') {
            clickableElem = document.createElement('div');
            clickableElem.className = 'folder-title';
            clickableElem.textContent = menu.name;
        } else {
            clickableElem = document.createElement('a');
            clickableElem.href = menu.url;
            clickableElem.target = 'contentFrame'; 
            clickableElem.textContent = menu.name;
        }

        itemContent.appendChild(iconSpan);
        itemContent.appendChild(clickableElem);

        // 3. 우측 액션 버튼 (길게 누를 때 보임)
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'menu-actions';

        // 폴더인 경우 '하위 메뉴 추가' 버튼 지원
        if (menu.type === 'folder') {
            const addSubBtn = document.createElement('button');
            addSubBtn.textContent = '➕';
            addSubBtn.title = '하위 메뉴 추가';
            addSubBtn.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                addChildMenu(menu);
            };
            actionsDiv.appendChild(addSubBtn);
        }

        const editBtn = document.createElement('button');
        editBtn.textContent = '✏️';
        editBtn.title = '수정';
        editBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            editMenu(menu, parentArray);
        };

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '❌';
        deleteBtn.title = '삭제';
        deleteBtn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            deleteMenu(menu, parentArray);
        };

        actionsDiv.appendChild(editBtn);
        actionsDiv.appendChild(deleteBtn);
        itemContent.appendChild(actionsDiv);
        li.appendChild(itemContent);

        // 4. 길게 누르기 이벤트 및 클릭 제어
        let pressTimer;
        let isLongPress = false;

        const startPress = (e) => {
            if (e.type === 'mousedown' && e.button !== 0) return;
            isLongPress = false;
            pressTimer = setTimeout(() => {
                isLongPress = true;
                document.querySelectorAll('.item-content.show-actions').forEach(el => el.classList.remove('show-actions'));
                itemContent.classList.add('show-actions');
            }, 500); 
        };

        const cancelPress = () => clearTimeout(pressTimer);

        itemContent.addEventListener('mousedown', startPress);
        itemContent.addEventListener('touchstart', startPress, {passive: true});
        itemContent.addEventListener('mouseup', cancelPress);
        itemContent.addEventListener('mouseleave', cancelPress);
        itemContent.addEventListener('touchend', cancelPress);
        itemContent.addEventListener('touchcancel', cancelPress);
        
        itemContent.addEventListener('contextmenu', e => e.preventDefault());

        // ── 드래그로 순서 바꾸기 ──────────────────────────────
        itemContent.draggable = true;

        itemContent.addEventListener('dragstart', (e) => {
            cancelPress();                     // 드래그 시작 = 롱프레스 취소
            dragSourceId = menu.id;
            itemContent.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            // Firefox는 데이터가 있어야 드래그가 시작된다.
            e.dataTransfer.setData('text/plain', String(menu.id));
        });

        itemContent.addEventListener('dragend', () => {
            itemContent.classList.remove('dragging');
            clearDropMarks();
            dragSourceId = null;
        });

        itemContent.addEventListener('dragover', (e) => {
            if (dragSourceId === null || dragSourceId === menu.id) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            const r = itemContent.getBoundingClientRect();
            const ratio = (e.clientY - r.top) / r.height;
            const pos = ratio < 0.25 ? 'before'
                      : ratio > 0.75 ? 'after'
                      : (menu.type === 'folder' ? 'inside' : 'after');

            clearDropMarks();
            itemContent.classList.add('drop-' + pos);
            itemContent.dataset.dropPos = pos;
        });

        itemContent.addEventListener('dragleave', () => {
            itemContent.classList.remove('drop-before','drop-after','drop-inside');
        });

        itemContent.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const pos = itemContent.dataset.dropPos || 'after';
            clearDropMarks();
            if (dragSourceId !== null) moveMenu(dragSourceId, menu.id, pos);
            dragSourceId = null;
        });

        // 클릭 이벤트 (폴더 열고닫기 또는 링크 이동)
        itemContent.addEventListener('click', (e) => {
            if (isLongPress) {
                e.preventDefault();
                e.stopPropagation(); // 롱프레스 후 클릭 이벤트 전파를 막아 바로 닫히는 현상 방지
                return;
            }
            
            // 롱프레스가 아닐 경우의 정상 동작
            if (menu.type === 'folder') {
                menu.isOpen = !menu.isOpen;
                renderMenus();
            }
            // 링크(a태그)는 브라우저가 알아서 href로 이동시킵니다.
        });

        // 5. 자식(하위) 노드 렌더링
        if (menu.type === 'folder' && menu.isOpen && menu.children && menu.children.length > 0) {
            const childUl = document.createElement('ul');
            childUl.className = 'child-list';
            menu.children.forEach(child => {
                childUl.appendChild(buildNode(child, menu.children));
            });
            li.appendChild(childUl);
        }

        return li;
    }

    function renderMenus() {
        menuList.innerHTML = '';
        menus.forEach(menu => {
            menuList.appendChild(buildNode(menu, menus));
        });
        saveMenus();
    }

    // 최상단 메뉴/폴더 추가
    addBtn.addEventListener('click', () => {
        const name = menuNameInput.value.trim();
        const url = menuUrlInput.value.trim();

        if (!name) {
            alert('메뉴 이름을 입력해주세요.');
            return;
        }

        const isFolder = url === '';
        
        const newMenu = {
            id: Date.now(),
            name: name,
            type: isFolder ? 'folder' : 'link',
            url: isFolder ? undefined : url,
            isOpen: true,
            children: isFolder ? [] : undefined
        };

        menus.push(newMenu);
        menuNameInput.value = '';
        menuUrlInput.value = '';
        renderMenus();
    });

    // 폴더 내 하위 메뉴 추가
    function addChildMenu(parentMenu) {
        const name = prompt(`'${parentMenu.name}' 폴더에 추가할 메뉴 이름을 입력하세요:`);
        if (!name) return;
        
        const url = prompt('URL을 입력하세요:\n(비워두면 이 또한 폴더로 생성되어 무한 중첩이 가능합니다.)');
        
        const isFolder = !url || url.trim() === '';
        
        if (!parentMenu.children) parentMenu.children = [];
        
        parentMenu.children.push({
            id: Date.now(),
            name: name.trim(),
            type: isFolder ? 'folder' : 'link',
            url: isFolder ? undefined : url.trim(),
            isOpen: true,
            children: isFolder ? [] : undefined
        });
        
        parentMenu.isOpen = true;
        renderMenus();
    }

    // 메뉴 수정
    function editMenu(menu, parentArray) {
        const newName = prompt('새 이름을 입력하세요:', menu.name);
        if (newName === null) return; 
        
        if (menu.type === 'link') {
            const newUrl = prompt('새 URL을 입력하세요:', menu.url);
            if (newUrl !== null) {
                menu.url = newUrl.trim();
            }
        }
        
        menu.name = newName.trim() || menu.name;
        renderMenus();
    }

    // 메뉴 삭제
    function deleteMenu(menu, parentArray) {
        if (confirm(`'${menu.name}'을(를) 삭제하시겠습니까?`)) {
            const idx = parentArray.findIndex(m => m.id === menu.id);
            if (idx > -1) {
                parentArray.splice(idx, 1);
                renderMenus();
            }
        }
    }

    // 목록 아래 빈 공간에 떨구면 최상위 맨 끝으로 옮긴다.
    // (폴더 안에 들어간 항목을 다시 밖으로 빼낼 때 필요하다.)
    menuList.addEventListener('dragover', (e) => {
        if (dragSourceId === null) return;
        if (e.target !== menuList) return;   // 항목 위는 각자 처리
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    });

    menuList.addEventListener('drop', (e) => {
        if (dragSourceId === null) return;
        if (e.target !== menuList) return;
        e.preventDefault();
        const src = findMenu(dragSourceId);
        if (src) {
            src.parent.splice(src.parent.indexOf(src.menu), 1);
            menus.push(src.menu);
            renderMenus();
        }
        clearDropMarks();
        dragSourceId = null;
    });

    // 초기 화면 구성 시 렌더링 실행
    renderMenus();
</script>

</body>
</html>
