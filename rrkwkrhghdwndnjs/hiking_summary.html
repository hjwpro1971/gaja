<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산행 요약 텍스트 생성기</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --bg-color: #f4f7f6;
            --border-color: #ccc;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }

        /* 초기화 버튼 스타일 */
        .reset-btn-top {
            position: absolute;
            top: 20px;
            right: 30px;
            background-color: #f5f5f5;
            color: #555;
            border: 1px solid #ddd;
            padding: 8px 15px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .reset-btn-top:hover {
            background-color: #e0e0e0;
            color: #d32f2f;
            border-color: #d32f2f;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-top: 0;
        }

        .layout {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .input-section, .preview-section {
            flex: 1;
            min-width: 300px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 0.9rem;
        }

        .input-group input[type="text"],
        .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .input-group textarea {
            height: 100px;
            resize: vertical;
        }

        .style-controls {
            display: flex;
            gap: 15px;
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
        }
        
        .memo-style-controls {
            display: flex;
            gap: 15px;
            background-color: #fff3e0;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            align-items: center;
            border: 1px solid #ffe0b2;
        }

        .style-controls input[type="color"],
        .memo-style-controls input[type="color"] {
            cursor: pointer;
            height: 35px;
            border: none;
            background: none;
        }

        .style-controls input[type="number"],
        .memo-style-controls input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .preview-box {
            border: 2px dashed #4caf50;
            padding: 20px;
            border-radius: 8px;
            background-color: #fff;
            min-height: 200px;
            margin-bottom: 15px;
        }

        button.action-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button.action-btn:hover {
            background-color: #1b5e20;
        }

        button.action-btn.success {
            background-color: #004d40;
        }
    </style>
    <script src="hundred_mountains_data.js"></script>
</head>
<body>

<div class="container">
    <button id="resetAllBtn" class="reset-btn-top">🔄 텍스트 초기화</button>

    <h1>산행 요약 텍스트 생성기</h1>

    <div class="layout">
        <!-- 입력 영역 -->
        <div class="input-section">
            
            <!-- 기본 텍스트 서식 -->
            <div class="style-controls">
                <div>
                    <label style="font-size:0.85rem; font-weight:bold;">기본 글자 색상</label><br>
                    <input type="color" id="textColor" value="#0d0c0c">
                </div>
                <div>
                    <label style="font-size:0.85rem; font-weight:bold;">기본 크기 (px)</label><br>
                    <input type="number" id="textSize" value="16" min="10" max="50">
                </div>
                <div>
                    <label style="font-size:0.85rem; font-weight:bold;">줄간격</label><br>
                    <input type="number" id="lineHeight" value="1.6" step="0.1" min="1" max="3">
                </div>
            </div>

            <div class="input-group">
                <label>산행지 (산 이름만 입력해도 지역 자동 완성)</label>
                <input type="text" id="mountain" placeholder="예: 연인산" value="">
            </div>
            <div class="input-group">
                <label>주봉 높이 (예: 남덕유산 (1,507m))</label>
                <input type="text" id="peakSummary" placeholder="예: 남덕유산 (1,507m)" value="">
            </div>
            <div class="input-group">
                <label>산행일자 (예: 26.4.5 자동변환)</label>
                <input type="text" id="date" placeholder="예: 26.4.5" value="">
            </div>
            <div class="input-group">
                <label>산행거리 & 시간 (예: 12.86 5.05 자동변환)</label>
                <input type="text" id="distTime" placeholder="예: 12.8 5.3" value="">
            </div>
            <div class="input-group">
                <label>코스(GPX) (쉼표나 하이픈으로 입력 시 화살표로 자동변환)</label>
                <input type="text" id="course" placeholder="예: 백무동, 소지봉, 장터목" value="">
            </div>
            
            <div class="input-group">
                <label>추가 메모 (줄바꿈 가능)</label>
                <div class="memo-style-controls">
                    <div>
                        <label style="font-size:0.8rem; font-weight:bold; color:#e65100;">메모 글자 색상</label>
                        <input type="color" id="memoColor" value="#1b1e79">
                    </div>
                    <div>
                        <label style="font-size:0.8rem; font-weight:bold; color:#e65100;">메모 크기 (px)</label>
                        <input type="number" id="memoSize" value="15" min="10" max="50">
                    </div>
                </div>
                <textarea id="memo" placeholder="기타 코멘트를 입력하세요."></textarea>
            </div>
        </div>

        <!-- 미리보기 및 출력 영역 -->
        <div class="preview-section">
            <div style="margin-bottom: 5px; font-weight: bold; color: #555;">미리보기 (블로그용 서식 적용됨)</div>
            <div id="previewBox" class="preview-box"></div>
            <button id="copyBtn" class="action-btn">복사하기 (블로그/카페 붙여넣기)</button>
        </div>
    </div>
</div>

<script>
    const inputs = ['mountain', 'peakSummary', 'date', 'distTime', 'course', 'memo'];
    const styles = ['textColor', 'textSize', 'lineHeight', 'memoColor', 'memoSize'];
    const previewBox = document.getElementById('previewBox');
    const copyBtn = document.getElementById('copyBtn');
    const resetBtn = document.getElementById('resetAllBtn');

    // 개별 입력창 요소들
    const mountainInput = document.getElementById('mountain');
    const peakSummaryInput = document.getElementById('peakSummary');
    const dateInput = document.getElementById('date');
    const distTimeInput = document.getElementById('distTime');
    const courseInput = document.getElementById('course');

    // === 산행지 지역 자동완성 사전 ===
    const mountainDB = {
        // [서울/경기/인천]
        "북한산": "서울 강북", "도봉산": "서울 도봉", "관악산": "서울 관악", "수락산": "서울 노원", "불암산": "서울 노원", "청계산": "서울 서초", "삼성산": "서울 관악",
        "명지산": "경기 가평", "화악산": "경기 가평", "연인산": "경기 가평", "운악산": "경기 가평", "유명산": "경기 가평", "호명산": "경기 가평",
        "축령산": "경기 남양주", "천마산": "경기 남양주", "예봉산": "경기 남양주", "용문산": "경기 양평", "유명산": "경기 양평",
        "백운산": "경기 포천", "명성산": "경기 포천", "소요산": "경기 동두천", "감악산": "경기 파주", "광교산": "경기 수원", "수리산": "경기 군포",
        "남한산": "경기 광주", "검단산": "경기 하남", "마니산": "인천 강화", "계양산": "인천 계양",

        // [강원]
        "설악산": "강원 속초", "오대산": "강원 평창", "태백산": "강원 태백", "치악산": "강원 원주", "가리왕산": "강원 정선", "민둥산": "강원 정선",
        "방태산": "강원 인제", "점봉산": "강원 인제", "대암산": "강원 양구", "삼악산": "강원 춘천", "오봉산": "강원 춘천", "가리산": "강원 홍천",
        "팔봉산": "강원 홍천", "계방산": "강원 평창", "발왕산": "강원 평창", "두타산": "강원 동해", "청옥산": "강원 동해",
        "함백산": "강원 태백", "노추산": "강원 강릉", "백덕산": "강원 영월", "태기산": "강원 횡성",

        // [충청/대전]
        "계룡산": "충남 공주", "속리산": "충북 보은", "월악산": "충북 제천", "소백산": "충북 단양", "금수산": "충북 제천", "도락산": "충북 단양",
        "민주지산": "충북 영동", "천태산": "충북 영동", "구병산": "충북 보은", "희양산": "충북 괴산", "대둔산": "충남 금산", "칠갑산": "충남 청양",
        "광덕산": "충남 천안", "용봉산": "충남 홍성", "오서산": "충남 보령", "가야산": "충남 예산", "식장산": "대전 동구", "보문산": "대전 중구",

        // [경상/대구/부산/울산]
        "지리산": "경남 산청", "황매산": "경남 합천", "주왕산": "경북 청송", "금오산": "경북 구미", "팔공산": "대구 동구", "비슬산": "대구 달성",
        "내연산": "경북 포항", "주흘산": "경북 문경", "조령산": "경북 문경", "대야산": "경북 문경", "청량산": "경북 봉화", "일월산": "경북 영양", "응봉산": "경북 울진",
        "남산": "경북 경주", "성인봉": "경북 울릉", "가지산": "울산 울주", "신불산": "울산 울주", "간월산": "울산 울주", "영축산": "경남 양산",
        "천성산": "경남 양산", "재약산": "경남 밀양", "천황산": "경남 밀양", "운문산": "경북 청도", "금정산": "부산 금정", "장산": "부산 해운대",
        "신어산": "경남 김해", "연화산": "경남 고성", "무학산": "경남 창원", "화왕산": "경남 창녕", "미륵산": "경남 통영", "금산": "경남 남해",

        // [전라/광주]
        "무등산": "광주 북구", "내장산": "전북 정읍", "덕유산": "전북 무주", "적상산": "전북 무주", "마이산": "전북 진안", "운장산": "전북 진안",
        "장안산": "전북 장수", "모악산": "전북 완주", "선운산": "전북 고창", "변산": "전북 부안", "강천산": "전북 순창", "월출산": "전남 영암",
        "조계산": "전남 순천", "두륜산": "전남 해남", "달마산": "전남 해남", "천관산": "전남 장흥", "제암산": "전남 장흥", "팔영산": "전남 고흥",
        "백암산": "전남 장성", "방장산": "전남 장성", "추월산": "전남 담양", "백운산": "전남 광양",

        // [제주]
        "한라산": "제주"
    };

    // 100대명산 데이터(hundred_mountains_data.js의 원본 + 관리 화면에서
    // 사용자가 고친 내용)의 지역 정보를 mountainDB에 병합한다. 병합 로직은
    // 그 파일이 단독으로 갖고 있어 세 화면이 같은 목록을 본다. mountainDB는
    // const로 재할당은 안 되지만 프로퍼티 추가는 가능하므로 그대로 채워
    // 넣는다. 위 mountainDB에 이미 있는 산은 기존 값을 유지하고, 지역 값이
    // 비어 있는 항목은 자동완성에 쓸 수 없어 건너뛴다.
    (function mergeHundredMountainRegions() {
        try {
            const list = window.loadHundredMountains ? window.loadHundredMountains() : [];
            list.forEach(m => {
                if (m && m.name && m.region && !mountainDB[m.name]) {
                    mountainDB[m.name] = m.region;
                }
            });
        } catch (e) {
            // 실패는 조용히 무시(핵심 기능인 산행지 입력 자체에는 영향 없음)
        }
    })();

    // 저장된 스타일 불러오기
    function loadSavedStyles() {
        const defaultValues = {
            textColor: '#0d0c0c',
            textSize: '16',
            lineHeight: '1.6',
            memoColor: '#1b1e79',
            memoSize: '15'
        };
        styles.forEach(id => {
            const savedValue = localStorage.getItem('gaja_' + id);
            document.getElementById(id).value = savedValue ? savedValue : defaultValues[id];
        });
    }

    // 다른 사이트를 오가다 브라우저가 탭을 새로고침/재사용해도 입력값이 사라지지 않도록
    // 텍스트 입력값을 자동 저장한다. "텍스트 초기화" 버튼을 누르기 전까지 유지된다.
    function saveDraftText() {
        inputs.forEach(id => {
            localStorage.setItem('gaja_draft_' + id, document.getElementById(id).value);
        });
    }

    function loadDraftText() {
        inputs.forEach(id => {
            const saved = localStorage.getItem('gaja_draft_' + id);
            if (saved !== null) document.getElementById(id).value = saved;
        });
    }

    function clearDraftText() {
        inputs.forEach(id => localStorage.removeItem('gaja_draft_' + id));
    }

    // GPX 경로 생성 화면(gpx-map.html)에서 계산한 총거리/소요시간/산행날짜와,
    // 산행 가이드 생성 화면(builder.html)의 "코스 흐름"·"주봉 높이"를 넘겨받아
    // 자동으로 채운다. 서로 다른 iframe에서 로드되는 별개 페이지라 localStorage를
    // 매개로 전달받으며, 한 번 적용한 뒤에는 지워서 다음에 이 페이지를 다시
    // 열었을 때 같은 값이 중복 적용되지 않게 한다.
    const GPX_HANDOFF_KEY = 'gajaGpxToSummaryHandoff';

    function applyGpxHandoffIfAny() {
        let raw;
        try {
            raw = localStorage.getItem(GPX_HANDOFF_KEY);
        } catch (e) {
            return;
        }
        if (!raw) return;
        try {
            const data = JSON.parse(raw);
            if (data.mountain) {
                mountainInput.value = data.mountain;
                autoFormatMountain();
            }
            if (data.peakSummary) peakSummaryInput.value = data.peakSummary;
            if (data.date) dateInput.value = data.date;
            if (data.distTime) distTimeInput.value = data.distTime;
            if (data.course) courseInput.value = data.course;
            localStorage.removeItem(GPX_HANDOFF_KEY);
        } catch (e) {
            // handoff 데이터가 깨져 있으면 무시
        }
    }

    // 산행지 자동 변환
    function autoFormatMountain() {
        let val = mountainInput.value.trim();
        if (!val) return;

        for (let mnt in mountainDB) {
            if (val.includes(mnt)) {
                let region = mountainDB[mnt];
                let regionFirstWord = region.split(' ')[0];
                if (!val.includes(regionFirstWord)) {
                    mountainInput.value = `${region} ${val}`;
                    updatePreview();
                }
                break;
            }
        }
    }

    // 날짜 자동 변환
    function autoFormatDate() {
        let val = dateInput.value.replace(/\s+/g, '').replace(/[.\/\-]$/, ''); 
        const regex = /^(\d{2}|\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})$/;
        const match = val.match(regex);

        if (match) {
            let year = parseInt(match[1], 10);
            let month = parseInt(match[2], 10);
            let day = parseInt(match[3], 10);
            if (year < 100) year += 2000;

            const dateObj = new Date(year, month - 1, day);
            if (dateObj.getFullYear() === year && dateObj.getMonth() === month - 1 && dateObj.getDate() === day) {
                const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
                dateInput.value = `${year}년 ${month}월 ${day}일 ${weekdays[dateObj.getDay()]}요일`;
                updatePreview(); 
            }
        }
    }

    // 거리/시간 자동 변환
    function autoFormatDistTime() {
        let val = distTimeInput.value.trim();
        const parts = val.split(/\s+/);
        
        if (parts.length === 2) {
            let distPart = parts[0];
            let timePart = parts[1];

            if (!isNaN(distPart)) {
                let hours = timePart;
                let minutes = "";
                if (timePart.includes('.')) {
                    const timeSplit = timePart.split('.');
                    hours = timeSplit[0];
                    minutes = timeSplit[1];
                }

                if (!isNaN(hours)) {
                    let formatted = `${distPart}Km & ${hours}시간`;
                    if (minutes && !isNaN(minutes)) {
                        formatted += ` ${parseInt(minutes, 10)}분`;
                    }
                    distTimeInput.value = formatted;
                    updatePreview();
                }
            }
        }
    }

    // 코스 화살표 자동 변환 (쉼표, 하이픈 등을 화살표로 치환)
    function autoFormatCourse() {
        let val = courseInput.value.trim();
        if (!val) return;

        // 쉼표(,) 하이픈(-) 기존 화살표(->, ➔) 등을 기준으로 문자를 나눈 뒤 화살표 기호로 다시 결합
        // 빈 항목들은 filter(Boolean)으로 자동 제거됨
        const formattedVal = val.split(/\s*,\s*|\s*-\s*|\s*➔\s*|\s*->\s*/).filter(Boolean).join(' ➔ ');
        
        if (val !== formattedVal) {
            courseInput.value = formattedVal;
            updatePreview();
        }
    }

    // blur(입력창 빠져나갈 때) 이벤트 등록
    mountainInput.addEventListener('blur', autoFormatMountain);
    dateInput.addEventListener('blur', autoFormatDate);
    distTimeInput.addEventListener('blur', autoFormatDistTime);
    courseInput.addEventListener('blur', autoFormatCourse);

    function updatePreview() {
        const mountain = document.getElementById('mountain').value;
        const peakSummary = document.getElementById('peakSummary').value;
        const date = document.getElementById('date').value;
        const distTime = document.getElementById('distTime').value;
        const course = document.getElementById('course').value;
        const memo = document.getElementById('memo').value.replace(/\n/g, '<br>');

        const color = document.getElementById('textColor').value;
        const size = document.getElementById('textSize').value;
        const lineHeight = document.getElementById('lineHeight').value;
        const memoColor = document.getElementById('memoColor').value;
        const memoSize = document.getElementById('memoSize').value;

        // 스타일 로컬 스토리지에 저장
        localStorage.setItem('gaja_textColor', color);
        localStorage.setItem('gaja_textSize', size);
        localStorage.setItem('gaja_lineHeight', lineHeight);
        localStorage.setItem('gaja_memoColor', memoColor);
        localStorage.setItem('gaja_memoSize', memoSize);

        saveDraftText();

        const htmlContent = `
            <div style="color: ${color}; font-size: ${size}px; line-height: ${lineHeight}; font-family: sans-serif;">
                <strong>산행지:</strong> ${mountain}<br>
                <strong>주봉 높이:</strong> ${peakSummary}<br>
                <strong>산행일자:</strong> ${date}<br>
                <strong>산행거리& 시간:</strong> ${distTime}<br>
                <strong>코스(GPX):</strong> ${course}<br>
                <br>
                <div style="color: ${memoColor}; font-size: ${memoSize}px;">
                    ${memo}
                </div>
            </div>
        `;
        previewBox.innerHTML = htmlContent;
    }

    [...inputs, ...styles].forEach(id => {
        document.getElementById(id).addEventListener('input', updatePreview);
    });

    loadSavedStyles();
    loadDraftText();
    applyGpxHandoffIfAny();
    updatePreview();

    resetBtn.addEventListener('click', () => {
        if(confirm('작성 중인 텍스트 내용을 지우시겠습니까?\\n(글자 색상, 크기 등 서식 설정은 그대로 유지됩니다.)')) {
            document.getElementById('mountain').value = '';
            document.getElementById('peakSummary').value = '';
            document.getElementById('date').value = '';
            document.getElementById('distTime').value = '';
            document.getElementById('course').value = '';
            document.getElementById('memo').value = '';
            clearDraftText();
            updatePreview();
        }
    });

    copyBtn.addEventListener('click', () => {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(previewBox);
        selection.removeAllRanges();
        selection.addRange(range);

        try {
            document.execCommand('copy');
            copyBtn.innerText = '✅ 복사 완료! (블로그에 Ctrl+V 하세요)';
            copyBtn.classList.add('success');
            setTimeout(() => {
                copyBtn.innerText = '복사하기 (블로그/카페 붙여넣기)';
                copyBtn.classList.remove('success');
            }, 2000);
        } catch (err) {
            copyBtn.innerText = '❌ 복사 실패 (직접 드래그해서 복사해주세요)';
            setTimeout(() => {
                copyBtn.innerText = '복사하기 (블로그/카페 붙여넣기)';
            }, 2000);
        }
        selection.removeAllRanges(); 
    });
</script>

</body>
</html>
