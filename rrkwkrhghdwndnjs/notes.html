<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메모 · 자료</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #f7fafc; color: #2d3748; padding: 20px; line-height: 1.6;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  .head { display: flex; align-items: center; justify-content: space-between;
          flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
          padding-bottom: 16px; border-bottom: 2px solid #e2e8f0; }
  .head h1 { font-size: 22px; font-weight: 700; color: #1a202c; letter-spacing: -0.5px; }
  .stats { font-size: 12px; color: #718096; margin-top: 2px; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, textarea {
    font-family: inherit; font-size: 14px; padding: 8px 12px;
    border: 1px solid #cbd5e0; border-radius: 8px; background: #fff; color: #2d3748;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #3182ce; }
  #search { width: 180px; }

  .btn { font-family: inherit; font-size: 13px; font-weight: 700; padding: 8px 14px;
         border: none; border-radius: 8px; cursor: pointer; transition: all .15s; }
  .btn-primary { background: #3182ce; color: #fff; }
  .btn-primary:hover { background: #2b6cb0; }
  .btn-ghost { background: #edf2f7; color: #4a5568; }
  .btn-ghost:hover { background: #e2e8f0; }

  /* 작성 폼 */
  #form { display: none; background: #fff; border: 1px solid #e2e8f0;
          border-radius: 12px; padding: 16px; margin-bottom: 20px;
          box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  #form.on { display: block; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .row > input[type=text] { flex: 1; min-width: 180px; }
  #body { width: 100%; min-height: 110px; resize: vertical; margin-bottom: 10px; }
  .hide { display: none !important; }

  /* 목록 */
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
          padding: 14px 16px; margin-bottom: 10px; }
  .card:hover { border-color: #cbd5e0; }
  .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .card-title { font-size: 15px; font-weight: 700; color: #1a202c; }
  .kind { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .kind-memo { background: #fefcbf; color: #744210; }
  .kind-link { background: #bee3f8; color: #2a4365; }
  .kind-file { background: #c6f6d5; color: #22543d; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 5px;
         background: #edf2f7; color: #4a5568; }
  .card-body { font-size: 13.5px; color: #4a5568; margin-top: 6px;
               white-space: pre-wrap; word-break: break-word; }
  .card-url { font-size: 12.5px; color: #3182ce; word-break: break-all; }
  .card-url:hover { text-decoration: underline; }
  .card-path { font-size: 12px; color: #2f855a; font-family: Consolas, monospace; word-break: break-all; }
  .card-date { font-size: 11px; color: #a0aec0; margin-top: 6px; }
  .acts { display: flex; gap: 4px; flex-shrink: 0; }
  .icon { width: 28px; height: 28px; border: none; border-radius: 7px;
          background: #edf2f7; color: #718096; cursor: pointer; font-size: 12px; }
  .icon:hover { background: #e2e8f0; color: #2d3748; }
  .icon.del:hover { background: #fed7d7; color: #c53030; }

  .empty { text-align: center; color: #a0aec0; font-size: 14px; padding: 50px 0; }

  @media (max-width: 640px) {
    body { padding: 12px; }
    #search { width: 100%; }
    .tools { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>📝 메모 · 자료</h1>
      <div class="stats" id="stats">&nbsp;</div>
    </div>
    <div class="tools">
      <input type="text" id="search" placeholder="검색...">
      <select id="filter">
        <option value="">전체</option>
        <option value="memo">메모</option>
        <option value="link">링크</option>
        <option value="file">문서</option>
      </select>
      <button class="btn btn-ghost" onclick="exportCsv()" title="현재 검색 결과를 엑셀로 받기">⬇ CSV</button>
      <button class="btn btn-primary" onclick="openForm()">+ 새로 쓰기</button>
    </div>
  </div>

  <div id="form">
    <input type="hidden" id="editId">
    <div class="row">
      <select id="kind" onchange="onKindChange()">
        <option value="memo">메모</option>
        <option value="link">링크</option>
        <option value="file">문서</option>
      </select>
      <input type="text" id="title" placeholder="제목">
    </div>
    <div class="row">
      <input type="text" id="url" placeholder="https://..." class="hide" style="width:100%">
      <input type="text" id="filePath" placeholder="/share/CACHEDEV1_DATA/Public/..." class="hide" style="width:100%">
    </div>
    <textarea id="body" placeholder="내용 (Ctrl+Enter로 저장)"></textarea>
    <div class="row">
      <input type="text" id="tags" placeholder="태그 (쉼표로 구분)">
      <button class="btn btn-primary" onclick="save()">저장</button>
      <button class="btn btn-ghost" onclick="closeForm()">취소</button>
    </div>
  </div>

  <div id="list"></div>

</div>

<script>
// 이 페이지는 대문(8443, https)에서 iframe으로 열린다. 메모 서버는 8991(http)에
// 따로 있는데, https 페이지에서 http를 직접 부르면 브라우저가 '혼합 콘텐츠'로
// 막는다. 그래서 대문 Apache가 /api/ 요청을 뒤로 넘겨주도록 해 두었고,
// 여기서는 같은 출처의 상대 경로만 쓴다.
const KIND = {
  memo: { label: '메모', cls: 'kind-memo' },
  link: { label: '링크', cls: 'kind-link' },
  file: { label: '문서', cls: 'kind-file' },
};
let items = [];
let searchTimer = null;

// 사용자가 넣은 문자열을 그대로 innerHTML에 넣으면 마크업으로 해석된다.
// 메모에 <script>나 깨진 태그를 써도 화면이 망가지지 않게 이스케이프한다.
function esc(t) {
  const d = document.createElement('div');
  d.textContent = t == null ? '' : String(t);
  return d.innerHTML;
}

async function load() {
  const q = encodeURIComponent(document.getElementById('search').value || '');
  const kind = document.getElementById('filter').value || '';
  try {
    const res = await fetch('/api/notes?q=' + q + '&kind=' + kind);
    const data = await res.json();
    items = data.items || [];

    const st = data.stats || {}, by = st.by_kind || {};
    document.getElementById('stats').textContent =
      '총 ' + (st.total || 0) + '건 · 메모 ' + (by.memo || 0) +
      ' · 링크 ' + (by.link || 0) + ' · 문서 ' + (by.file || 0);

    const list = document.getElementById('list');
    if (!items.length) {
      list.innerHTML = '<div class="empty">저장된 내용이 없습니다.</div>';
      return;
    }
    list.innerHTML = items.map(function (it) {
      const k = KIND[it.kind] || KIND.memo;
      let extra = '';
      if (it.kind === 'link' && it.url) {
        extra = '<a class="card-url" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.url) + '</a>';
      } else if (it.kind === 'file' && it.file_path) {
        extra = '<div class="card-path">' + esc(it.file_path) + '</div>';
      }
      const tags = (it.tags || '').split(',').map(function (t) { return t.trim(); })
        .filter(Boolean)
        .map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(' ');
      return '<div class="card"><div class="card-top">' +
        '<div style="min-width:0;flex:1">' +
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
            '<span class="kind ' + k.cls + '">' + k.label + '</span>' +
            '<span class="card-title">' + (esc(it.title) || '(제목 없음)') + '</span>' + tags +
          '</div>' + extra +
          (it.body ? '<div class="card-body">' + esc(it.body) + '</div>' : '') +
          '<div class="card-date">' + esc(it.updated_at) + '</div>' +
        '</div>' +
        '<div class="acts">' +
          '<button class="icon" onclick="edit(' + it.id + ')" title="수정">✎</button>' +
          '<button class="icon del" onclick="del(' + it.id + ')" title="삭제">🗑</button>' +
        '</div></div></div>';
    }).join('');
  } catch (err) {
    document.getElementById('list').innerHTML =
      '<div class="empty">불러오지 못했습니다. 메모 서버가 실행 중인지 확인해 주세요.<br><small>' + esc(err) + '</small></div>';
  }
}

function onKindChange() {
  const k = document.getElementById('kind').value;
  document.getElementById('url').classList.toggle('hide', k !== 'link');
  document.getElementById('filePath').classList.toggle('hide', k !== 'file');
}

function openForm() {
  document.getElementById('form').classList.add('on');
  document.getElementById('editId').value = '';
  ['title', 'body', 'url', 'filePath', 'tags'].forEach(function (id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('kind').value = 'memo';
  onKindChange();
  document.getElementById('title').focus();
}

function closeForm() {
  document.getElementById('form').classList.remove('on');
}

function edit(id) {
  const it = items.find(function (n) { return n.id === id; });
  if (!it) return;
  openForm();
  document.getElementById('editId').value = it.id;
  document.getElementById('kind').value = it.kind;
  document.getElementById('title').value = it.title || '';
  document.getElementById('body').value = it.body || '';
  document.getElementById('url').value = it.url || '';
  document.getElementById('filePath').value = it.file_path || '';
  document.getElementById('tags').value = it.tags || '';
  onKindChange();
  document.getElementById('form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function save() {
  const id = document.getElementById('editId').value;
  const payload = {
    kind: document.getElementById('kind').value,
    title: document.getElementById('title').value,
    body: document.getElementById('body').value,
    url: document.getElementById('url').value,
    file_path: document.getElementById('filePath').value,
    tags: document.getElementById('tags').value,
  };
  if (id) payload.id = Number(id);
  try {
    const res = await fetch(id ? '/api/notes/update' : '/api/notes/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify(payload),
    });
    const r = await res.json();
    if (!r.ok) { alert(r.message); return; }
    closeForm();
    load();
  } catch (err) {
    alert('저장하지 못했습니다: ' + err);
  }
}

async function del(id) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  try {
    await fetch('/api/notes/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ id: id }),
    });
    load();
  } catch (err) {
    alert('삭제하지 못했습니다: ' + err);
  }
}

// 화면에 걸린 검색어·종류 필터를 그대로 넘겨, 보고 있는 목록만 받는다.
// 전체를 받고 싶으면 검색창을 비우고 누르면 된다.
function exportCsv() {
  const q = encodeURIComponent(document.getElementById('search').value || '');
  const kind = document.getElementById('filter').value || '';
  window.location.href = '/api/notes/export?q=' + q + '&kind=' + kind;
}

document.getElementById('search').addEventListener('input', function () {
  // 글자마다 요청하면 낭비다. 잠깐 멈췄을 때만 보낸다.
  clearTimeout(searchTimer);
  searchTimer = setTimeout(load, 300);
});
document.getElementById('filter').addEventListener('change', load);
document.getElementById('body').addEventListener('keydown', function (e) {
  if (e.ctrlKey && e.key === 'Enter') save();
});

load();
</script>
</body>
</html>
