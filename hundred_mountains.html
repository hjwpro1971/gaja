<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100대명산 데이터 관리</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #f0f4f8; color: #2d3748; padding: 24px; }
  .page { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: #718096; margin: 0 0 20px; }
  fieldset { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px; padding: 14px; background: #fff; }
  legend { font-size: 13px; font-weight: 700; color: #2b6cb0; padding: 0 6px; }
  label { display: block; font-size: 12px; font-weight: 700; color: #4a5568; margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number] {
    width: 100%; padding: 7px 9px; font-size: 13px; border: 1px solid #cbd5e0; border-radius: 6px;
    font-family: inherit; background: #fff; color: #2d3748;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  .org-checks { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .org-checks label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; color: #2d3748; margin: 0; }
  .org-checks input { width: auto; }
  .btn { display: inline-block; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e0; background: #fff; color: #2d3748; cursor: pointer; }
  .btn:hover { background: #f7fafc; }
  .btn-primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; font-size: 14px; padding: 10px 18px; }
  .btn-primary:hover { background: #2c5282; }
  .btn-danger { color: #e53e3e; border-color: #feb2b2; font-size: 11.5px; padding: 4px 10px; }
  .btn-danger:hover { background: #fff5f5; }
  .action-bar { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .warn-box { display: none; background: #fff3cd; border: 1px solid #ffc107; color: #7a5c00; font-size: 12.5px; font-weight: 700; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; white-space: pre-line; }
  .info-box { display: none; background: #ebf8ff; border: 1px solid #90cdf4; color: #2c5282; font-size: 12px; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; white-space: pre-line; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; font-size: 12.5px; border-bottom: 1px solid #edf2f7; }
  th { background: #f7fafc; color: #4a5568; font-weight: 700; }
  tr:last-child td { border-bottom: none; }
  .org-badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .org-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #ebf8ff; color: #2c5282; border: 1px solid #90cdf4; }
  .empty-row td { text-align: center; color: #a0aec0; padding: 20px; }
  .charcount { font-size: 11.5px; color: #718096; margin: 4px 0 0; }
</style>
</head>
<body>
<div class="page">
  <h1>🏔️ 100대명산 데이터 관리</h1>
  <p class="sub">여기서 추가한 산 정보는 산행가이드(builder.html)의 100대명산 배지 판정과, 산행요약 생성(hiking_summary.html)의 산행지 지역 자동완성에 함께 반영됩니다. builder.html에 이미 내장된 기존 목록과는 별도로, 여기서 추가한 산만 이 목록에 쌓입니다.</p>

  <fieldset>
    <legend>산 정보 추가</legend>
    <label>산 이름</label>
    <input type="text" id="mountainName" placeholder="예: 응봉산">

    <div class="row">
      <div>
        <label>정상석</label>
        <input type="text" id="peakStone" placeholder="예: 응봉산 정상석">
      </div>
      <div>
        <label>최고 높이</label>
        <input type="text" id="height" placeholder="예: 999m">
      </div>
    </div>

    <label>지역</label>
    <input type="text" id="region" placeholder="예: 강원 삼척시·경북 울진군">

    <label>배치 (100대명산으로 인증할 기관, 복수 선택 가능)</label>
    <div class="org-checks">
      <label><input type="checkbox" id="org-forest" value="forest"> 산림청</label>
      <label><input type="checkbox" id="org-blackyak" value="blackyak"> 블랙야크</label>
      <label><input type="checkbox" id="org-wolgansan" value="wolgansan"> 월간산</label>
      <label><input type="checkbox" id="org-hanguksanha" value="hanguksanha"> 한국의산하</label>
    </div>
    <div class="charcount">기관을 하나도 선택하지 않으면 배지 없이 자동완성(산 이름/지역)에만 반영됩니다.</div>

    <div class="action-bar">
      <button class="btn btn-primary" id="btn-add" type="button">+ 추가</button>
      <button class="btn" id="btn-reset-form" type="button">입력 초기화</button>
    </div>
    <div class="warn-box" id="warn-box"></div>
    <div class="info-box" id="info-box"></div>
  </fieldset>

  <fieldset>
    <legend>추가한 산 목록 (<span id="mountain-count">0</span>개)</legend>
    <table>
      <thead>
        <tr>
          <th>산 이름</th>
          <th>정상석</th>
          <th>높이</th>
          <th>지역</th>
          <th>배치</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="mountain-list-body">
        <tr class="empty-row"><td colspan="6">아직 추가한 산이 없습니다.</td></tr>
      </tbody>
    </table>
  </fieldset>
</div>

<script>

// 그대로 옮긴 초기 데이터. 각 기관 정확히 100개(마지막 검증행 "100,100,100"과

const SEED_APPLIED_KEY = 'gajaHundredMountainsSeedApplied';

function loadMountains() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw === null) {
      // 이 브라우저에서 한 번도 저장한 적 없으면 초기 데이터를 시드한다.
      // 이후에는 SEED_APPLIED_KEY가 남아 있어 사용자가 전부 지워도 다시
      // 채워지지 않는다(사용자의 삭제 결정을 존중).
      if (!localStorage.getItem(SEED_APPLIED_KEY)) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
          localStorage.setItem(SEED_APPLIED_KEY, '1');
        } catch (e) {}
        return SEED_DATA;
      }
      return [];
    }
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function saveMountains(list) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  } catch (e) {
    // localStorage 실패는 조용히 무시(용량 초과 등) — 화면 목록 자체는 그대로 유지됨
  }
}

function renderList() {
  const list = loadMountains();
  document.getElementById('mountain-count').textContent = list.length;
  const tbody = document.getElementById('mountain-list-body');
  if (!list.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">아직 추가한 산이 없습니다.</td></tr>';
    return;
  }
  tbody.innerHTML = list.map((m, i) => `
    <tr>
      <td>${escapeHtml(m.name)}</td>
      <td>${escapeHtml(m.peakStone || '')}</td>
      <td>${escapeHtml(m.height || '')}</td>
      <td>${escapeHtml(m.region || '')}</td>
      <td><div class="org-badges">${(m.orgs || []).map(o => `<span class="org-badge">${ORG_LABELS[o] || o}</span>`).join('') || '-'}</div></td>
      <td><button class="btn btn-danger" type="button" onclick="removeMountain(${i})">삭제</button></td>
    </tr>
  `).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function removeMountain(index) {
  const list = loadMountains();
  list.splice(index, 1);
  saveMountains(list);
  renderList();
}

function resetInputForm() {
  document.getElementById('mountainName').value = '';
  document.getElementById('peakStone').value = '';
  document.getElementById('height').value = '';
  document.getElementById('region').value = '';
  Object.keys(ORG_LABELS).forEach(key => {
    document.getElementById('org-' + key).checked = false;
  });
  document.getElementById('warn-box').style.display = 'none';
  document.getElementById('info-box').style.display = 'none';
}

function addMountain() {
  const warnBox = document.getElementById('warn-box');
  const infoBox = document.getElementById('info-box');
  warnBox.style.display = 'none';
  infoBox.style.display = 'none';

  const name = document.getElementById('mountainName').value.trim();
  if (!name) {
    warnBox.style.display = 'block';
    warnBox.textContent = '⚠ 산 이름을 입력하세요.';
    return;
  }

  const peakStone = document.getElementById('peakStone').value.trim();
  const height = document.getElementById('height').value.trim();
  const region = document.getElementById('region').value.trim();
  const orgs = Object.keys(ORG_LABELS).filter(key => document.getElementById('org-' + key).checked);

  const list = loadMountains();
  const existingIdx = list.findIndex(m => m.name === name);
  if (existingIdx >= 0) {
    list[existingIdx] = { name, peakStone, height, region, orgs };
    infoBox.style.display = 'block';
    infoBox.textContent = `ℹ "${name}" 정보를 덮어썼습니다.`;
  } else {
    list.push({ name, peakStone, height, region, orgs });
    infoBox.style.display = 'block';
    infoBox.textContent = `✅ "${name}"을(를) 추가했습니다.`;
  }
  saveMountains(list);
  renderList();
  resetInputForm();
  infoBox.style.display = 'block';
}

document.getElementById('btn-add').addEventListener('click', addMountain);
document.getElementById('btn-reset-form').addEventListener('click', resetInputForm);

renderList();
</script>
