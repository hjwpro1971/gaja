<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100대명산 데이터 관리</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #f0f4f8; color: #2d3748; padding: 24px; }
  .page { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: #718096; margin: 0 0 20px; }
  fieldset { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px; padding: 14px; background: #fff; }
  legend { font-size: 13px; font-weight: 700; color: #2b6cb0; padding: 0 6px; }
  label { display: block; font-size: 12px; font-weight: 700; color: #4a5568; margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number] {
    width: 100%; padding: 7px 9px; font-size: 13px; border: 1px solid #cbd5e0; border-radius: 6px;
    font-family: inherit; background: #fff; color: #2d3748;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  .org-checks { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .org-checks label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; color: #2d3748; margin: 0; }
  .org-checks input { width: auto; }
  .btn { display: inline-block; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e0; background: #fff; color: #2d3748; cursor: pointer; }
  .btn:hover { background: #f7fafc; }
  .btn-primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; font-size: 14px; padding: 10px 18px; }
  .btn-primary:hover { background: #2c5282; }
  .btn-danger { color: #e53e3e; border-color: #feb2b2; font-size: 11.5px; padding: 4px 10px; }
  .btn-danger:hover { background: #fff5f5; }
  .action-bar { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .warn-box { display: none; background: #fff3cd; border: 1px solid #ffc107; color: #7a5c00; font-size: 12.5px; font-weight: 700; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; white-space: pre-line; }
  .info-box { display: none; background: #ebf8ff; border: 1px solid #90cdf4; color: #2c5282; font-size: 12px; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; white-space: pre-line; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; font-size: 12.5px; border-bottom: 1px solid #edf2f7; }
  th { background: #f7fafc; color: #4a5568; font-weight: 700; }
  tr:last-child td { border-bottom: none; }
  .org-badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .org-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: #ebf8ff; color: #2c5282; border: 1px solid #90cdf4; }
  .empty-row td { text-align: center; color: #a0aec0; padding: 20px; }
  .charcount { font-size: 11.5px; color: #718096; margin: 4px 0 0; }
  .edit-indicator { display: none; font-size: 12px; font-weight: 700; color: #b7791f; background: #fffaf0; border: 1px solid #f6e05e; border-radius: 6px; padding: 6px 10px; margin: 8px 0 0; }
  .edit-indicator.active { display: block; }
  .btn-edit { color: #2b6cb0; border-color: #90cdf4; font-size: 11.5px; padding: 4px 10px; margin-right: 4px; }
  .btn-edit:hover { background: #ebf8ff; }
  .hidden { display: none; }
</style>
<script src="hundred_mountains_data.js"></script>
</head>
<body>
<div class="page">
  <h1>🏔️ 100대명산 데이터 관리</h1>
  <p class="sub">여기서 추가한 산 정보는 산행가이드(builder.html)의 100대명산 배지 판정과, 산행요약 생성(hiking_summary.html)의 산행지 지역 자동완성에 함께 반영됩니다. builder.html에 이미 내장된 기존 목록과는 별도로, 여기서 추가한 산만 이 목록에 쌓입니다.</p>

  <fieldset>
    <legend>산 정보 추가</legend>
    <label>산 이름</label>
    <input type="text" id="mountainName" list="mountainNameList" placeholder="예: 응봉산" autocomplete="off">
    <datalist id="mountainNameList"></datalist>
    <div class="edit-indicator" id="edit-indicator"></div>

    <div class="row">
      <div>
        <label>정상석</label>
        <input type="text" id="peakStone" placeholder="예: 응봉산 정상석">
      </div>
      <div>
        <label>최고 높이</label>
        <input type="text" id="height" placeholder="예: 999m">
      </div>
    </div>

    <label>지역</label>
    <input type="text" id="region" placeholder="예: 강원 삼척시·경북 울진군">

    <label>배치 (100대명산으로 인증할 기관, 복수 선택 가능)</label>
    <div class="org-checks">
      <label><input type="checkbox" id="org-forest" value="forest"> 산림청</label>
      <label><input type="checkbox" id="org-blackyak" value="blackyak"> 블랙야크</label>
      <label><input type="checkbox" id="org-wolgansan" value="wolgansan"> 월간산</label>
      <label><input type="checkbox" id="org-hanguksanha" value="hanguksanha"> 한국의산하</label>
    </div>
    <div class="charcount">기관을 하나도 선택하지 않으면 배지 없이 자동완성(산 이름/지역)에만 반영됩니다.</div>

    <div class="action-bar">
      <button class="btn btn-primary" id="btn-add" type="button">+ 추가</button>
      <button class="btn btn-primary hidden" id="btn-update" type="button">✎ 수정</button>
      <button class="btn" id="btn-reset-form" type="button">입력 초기화</button>
    </div>
    <div class="warn-box" id="warn-box"></div>
    <div class="info-box" id="info-box"></div>
  </fieldset>

  <fieldset>
    <legend>추가한 산 목록 (<span id="mountain-count">0</span>개)</legend>
    <table>
      <thead>
        <tr>
          <th>산 이름</th>
          <th>정상석</th>
          <th>높이</th>
          <th>지역</th>
          <th>배치</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="mountain-list-body">
        <tr class="empty-row"><td colspan="6">아직 추가한 산이 없습니다.</td></tr>
      </tbody>
    </table>
  </fieldset>
</div>

<script>
const ORG_LABELS = { forest: '산림청', blackyak: '블랙야크', wolgansan: '월간산', hanguksanha: '한국산하' };

// 원본 100대명산 데이터는 hundred_mountains_data.js(<script src>로 위에서
// 로드)의 window.HundredMountainsSeedData가 단일 진실 공급원이다. 이
// 페이지와 builder.html이 같은 파일을 나눠 쓰므로 두 화면이 서로 다른
// 산 목록을 보여주는 일이 없다. 이 배열은 화면에 항상 그대로 반영되며
// (캐시되지 않음), 사용자가 이 페이지에서 값을 고치거나 삭제한 내용만
// 별도 저장소(OVERRIDES_KEY)에 쌓인다 — 아래 loadMountains()/
// saveMountains() 참고.
const SEED_DATA = window.HundredMountainsSeedData || [];

// SEED_DATA(코드 안의 원본 100대명산)와 사용자가 이 페이지에서 추가·수정·
// 삭제한 내용을 완전히 분리해서 관리한다. localStorage에는 "사용자가 손댄
// 내용"만 이름 기준으로 저장하고(OVERRIDES_KEY), 화면에는 매번 SEED_DATA
// 위에 그 오버라이드를 얹어서 보여준다. 이렇게 하면:
//   - SEED_DATA를 코드에서 고치면(예: 높이 정정) 다음 로드에 바로 반영된다
//     — "예전 버전이 캐시돼 있어서 새 값이 안 보이는" 문제 자체가 없어진다.
//   - 사용자가 SEED_DATA에 있는 산의 값을 고치면 그 산 이름으로 된
//     override 항목이 생겨, SEED_DATA가 나중에 또 바뀌어도 사용자가 직접
//     고친 값은 override로 유지된다(원치 않으면 다시 편집해서 지우면 됨).
//   - 사용자가 SEED_DATA에 있는 산을 삭제하면 override에 deleted:true로
//     표시해 숨긴다(SEED_DATA 배열 자체를 건드릴 수 없으므로).
//   - 사용자가 SEED_DATA에 없는 새 산을 추가하면 override에 그대로 쌓인다.
// 읽기(병합)는 hundred_mountains_data.js의 공유 API를 그대로 쓴다 —
// builder.html·hiking_summary.html도 같은 함수를 쓰므로 세 화면이 항상
// 같은 목록을 본다. 쓰기(saveMountains)는 이 관리 화면에서만 필요해서
// 여기에 둔다.
const OVERRIDES_KEY = window.HundredMountainsOverridesKey;
const loadMountains = window.loadHundredMountains;

function saveOverrides(overrides) {
  try {
    localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides));
  } catch (e) {
    // localStorage 실패는 조용히 무시(용량 초과 등) — 화면 목록 자체는 그대로 유지됨
  }
}

// 화면에서 편집된 전체 목록(list)을 SEED_DATA와 비교해 "달라진 부분"만
// overrides로 추출해 저장한다. SEED_DATA와 완전히 같은 값으로 되돌리면
// 그 산의 override는 자동으로 사라진다(다시 SEED_DATA 그대로를 따름).
function saveMountains(list) {
  const seedByName = new Map(SEED_DATA.map(m => [m.name, m]));
  const overrides = {};

  const presentNames = new Set();
  list.forEach(m => {
    presentNames.add(m.name);
    const seedMountain = seedByName.get(m.name);
    if (!seedMountain) {
      // SEED_DATA에 없는 사용자 추가 산: 그대로 override로 저장.
      overrides[m.name] = { peakStone: m.peakStone, height: m.height, region: m.region, orgs: m.orgs };
      return;
    }
    // SEED_DATA에 있는 산: 원본과 다른 필드가 하나라도 있으면 override로 저장.
    const changed = seedMountain.peakStone !== (m.peakStone || '')
      || seedMountain.height !== (m.height || '')
      || seedMountain.region !== (m.region || '')
      || JSON.stringify(seedMountain.orgs || []) !== JSON.stringify(m.orgs || []);
    if (changed) {
      overrides[m.name] = { peakStone: m.peakStone, height: m.height, region: m.region, orgs: m.orgs };
    }
  });

  // SEED_DATA에는 있지만 화면 목록(list)에는 없는 산 = 사용자가 삭제한 것.
  SEED_DATA.forEach(seedMountain => {
    if (!presentNames.has(seedMountain.name)) {
      overrides[seedMountain.name] = { deleted: true };
    }
  });

  saveOverrides(overrides);
}

function renderList() {
  const list = loadMountains();
  document.getElementById('mountain-count').textContent = list.length;
  const tbody = document.getElementById('mountain-list-body');
  if (!list.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">아직 추가한 산이 없습니다.</td></tr>';
  } else {
    tbody.innerHTML = list.map((m, i) => `
      <tr>
        <td>${escapeHtml(m.name)}</td>
        <td>${escapeHtml(m.peakStone || '')}</td>
        <td>${escapeHtml(m.height || '')}</td>
        <td>${escapeHtml(m.region || '')}</td>
        <td><div class="org-badges">${(m.orgs || []).map(o => `<span class="org-badge">${ORG_LABELS[o] || o}</span>`).join('') || '-'}</div></td>
        <td>
          <button class="btn btn-edit" type="button" onclick="editMountain(${i})">편집</button>
          <button class="btn btn-danger" type="button" onclick="removeMountain(${i})">삭제</button>
        </td>
      </tr>
    `).join('');
  }
  renderNameDatalist(list);
}

// 산 이름 입력창에 자동완성 후보를 채운다. 이름을 선택하면 change 이벤트에서
// 기존 데이터를 찾아 나머지 필드(정상석/높이/지역/기관)를 자동으로 채워준다.
function renderNameDatalist(list) {
  const datalist = document.getElementById('mountainNameList');
  datalist.innerHTML = list.map(m => `<option value="${escapeHtml(m.name)}"></option>`).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function removeMountain(index) {
  const list = loadMountains();
  list.splice(index, 1);
  saveMountains(list);
  renderList();
}

// 편집 중인 항목의 목록 인덱스. null이면 "새로 추가" 모드.
let editingIndex = null;

function resetInputForm() {
  document.getElementById('mountainName').value = '';
  document.getElementById('peakStone').value = '';
  document.getElementById('height').value = '';
  document.getElementById('region').value = '';
  Object.keys(ORG_LABELS).forEach(key => {
    document.getElementById('org-' + key).checked = false;
  });
  document.getElementById('warn-box').style.display = 'none';
  document.getElementById('info-box').style.display = 'none';
  exitEditMode();
}

function fillFormFromMountain(m) {
  document.getElementById('mountainName').value = m.name || '';
  document.getElementById('peakStone').value = m.peakStone || '';
  document.getElementById('height').value = m.height || '';
  document.getElementById('region').value = m.region || '';
  Object.keys(ORG_LABELS).forEach(key => {
    document.getElementById('org-' + key).checked = (m.orgs || []).includes(key);
  });
}

function enterEditMode(index, name) {
  editingIndex = index;
  document.getElementById('btn-add').classList.add('hidden');
  document.getElementById('btn-update').classList.remove('hidden');
  const indicator = document.getElementById('edit-indicator');
  indicator.classList.add('active');
  indicator.textContent = `✎ "${name}"을(를) 편집 중입니다. 값을 고친 뒤 [수정] 버튼을 누르세요.`;
}

function exitEditMode() {
  editingIndex = null;
  document.getElementById('btn-add').classList.remove('hidden');
  document.getElementById('btn-update').classList.add('hidden');
  const indicator = document.getElementById('edit-indicator');
  indicator.classList.remove('active');
  indicator.textContent = '';
}

// 목록 "편집" 버튼: 해당 행 데이터를 폼에 로드하고 수정 모드로 전환한다.
function editMountain(index) {
  const list = loadMountains();
  const m = list[index];
  if (!m) return;
  fillFormFromMountain(m);
  enterEditMode(index, m.name);
  document.getElementById('warn-box').style.display = 'none';
  document.getElementById('info-box').style.display = 'none';
  document.getElementById('mountainName').focus();
}

// 산 이름 입력창에서 기존 목록에 있는 이름을 그대로 선택/입력하면(자동완성
// 클릭 또는 정확히 일치하는 이름 직접 입력) 나머지 필드를 자동으로 채워
// 수정하기 편하게 한다. 새 산을 추가하는 중이라면 아무 매칭이 없어 그대로 둔다.
function handleNameInput() {
  const name = document.getElementById('mountainName').value.trim();
  if (!name) return;
  const list = loadMountains();
  const idx = list.findIndex(m => m.name === name);
  if (idx >= 0) {
    fillFormFromMountain(list[idx]);
    enterEditMode(idx, name);
  } else if (editingIndex !== null) {
    // 편집 중이던 이름을 다른(목록에 없는) 이름으로 바꾸면 새 항목 추가로 취급.
    exitEditMode();
  }
}

function addMountain() {
  const warnBox = document.getElementById('warn-box');
  const infoBox = document.getElementById('info-box');
  warnBox.style.display = 'none';
  infoBox.style.display = 'none';

  const name = document.getElementById('mountainName').value.trim();
  if (!name) {
    warnBox.style.display = 'block';
    warnBox.textContent = '⚠ 산 이름을 입력하세요.';
    return;
  }

  const peakStone = document.getElementById('peakStone').value.trim();
  const height = document.getElementById('height').value.trim();
  const region = document.getElementById('region').value.trim();
  const orgs = Object.keys(ORG_LABELS).filter(key => document.getElementById('org-' + key).checked);

  const list = loadMountains();
  const existingIdx = list.findIndex(m => m.name === name);
  if (existingIdx >= 0) {
    warnBox.style.display = 'block';
    warnBox.textContent = `⚠ "${name}"은(는) 이미 목록에 있습니다. 목록에서 [편집]을 눌러 수정하세요.`;
    return;
  }
  list.push({ name, peakStone, height, region, orgs });
  saveMountains(list);
  renderList();
  resetInputForm();
  infoBox.style.display = 'block';
  infoBox.textContent = `✅ "${name}"을(를) 추가했습니다.`;
}

function updateMountain() {
  const warnBox = document.getElementById('warn-box');
  const infoBox = document.getElementById('info-box');
  warnBox.style.display = 'none';
  infoBox.style.display = 'none';

  if (editingIndex === null) return;

  const name = document.getElementById('mountainName').value.trim();
  if (!name) {
    warnBox.style.display = 'block';
    warnBox.textContent = '⚠ 산 이름을 입력하세요.';
    return;
  }

  const peakStone = document.getElementById('peakStone').value.trim();
  const height = document.getElementById('height').value.trim();
  const region = document.getElementById('region').value.trim();
  const orgs = Object.keys(ORG_LABELS).filter(key => document.getElementById('org-' + key).checked);

  const list = loadMountains();
  // 편집 중 이름을 다른 산의 이름으로 바꾼 경우, 그 산과 중복되지 않는지 확인.
  const conflictIdx = list.findIndex((m, i) => m.name === name && i !== editingIndex);
  if (conflictIdx >= 0) {
    warnBox.style.display = 'block';
    warnBox.textContent = `⚠ "${name}"은(는) 이미 목록의 다른 항목에 있습니다.`;
    return;
  }

  list[editingIndex] = { name, peakStone, height, region, orgs };
  saveMountains(list);
  renderList();
  resetInputForm();
  infoBox.style.display = 'block';
  infoBox.textContent = `ℹ "${name}" 정보를 수정했습니다.`;
}

document.getElementById('btn-add').addEventListener('click', addMountain);
document.getElementById('btn-update').addEventListener('click', updateMountain);
document.getElementById('btn-reset-form').addEventListener('click', resetInputForm);
// datalist 옵션 클릭은 브라우저에 따라 'change'가 아니라 'input'만 발생시키는
// 경우가 있어(특히 Chrome 계열) 두 이벤트 모두에 걸어야 자동완성 선택 시
// 확실히 필드가 채워진다.
document.getElementById('mountainName').addEventListener('input', handleNameInput);
document.getElementById('mountainName').addEventListener('change', handleNameInput);

renderList();
</script>
</body>
</html>
