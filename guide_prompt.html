<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 산행 파노라마 프롬프트 디자이너</title>
    <style>
        :root {
            --primary-color: #2e7d32; 
            --secondary-color: #fce4ec; 
            --bg-color: #fafafa;
            --text-color: #333;
            --border-color: #ccc;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2.2rem;
        }

        header p {
            margin: 5px 0 0;
            color: #666;
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #fff;
        }

        legend {
            font-weight: bold;
            color: var(--primary-color);
            padding: 0 10px;
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.3s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #1b5e20;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: #880e4f;
            border: 1px solid #f8bbd0;
        }

        .btn-secondary:hover {
            background-color: #f8bbd0;
        }

        .info-box {
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }

        .prompt-result {
            background-color: #333;
            color: #f1f1f1;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            position: relative;
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        #jsonError {
            color: #d32f2f;
            background-color: #ffcdd2;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI 산행 파노라마 프롬프트 디자이너</h1>
        <p>자연스럽게 이어지는 하나의 긴 파노라마 뷰를 생성합니다</p>
        <button type="button" id="resetFormBtn" class="btn-secondary" style="margin-top: 10px; width: auto; padding: 8px 18px;">폼 초기화</button>
    </header>

    <fieldset>
        <legend>1단계: 산행 가이드 JSON 입력</legend>
        <textarea id="jsonInput">{
  "mountainName": "가리왕산",
  "courseRouteFlow": [
    "장구목이시작점",
    "임도",
    "가리왕산정상",
    "어은골계곡",
    "자연휴양림"
  ],
  "totalTime": "5.5h~6.0h",
  "overallDifficulty": "보통",
  "sections": [
    {
      "cardTitle": "이끼폭포계곡",
      "features": ["이끼폭포비경", "냉골바람지대", "미끄러운돌길"]
    },
    {
      "cardTitle": "가리왕산정상",
      "features": ["넓은고원평지", "360도조망터", "백두대간조망"]
    }
  ]
}</textarea>
        <div id="jsonError">올바른 JSON 형식이 아닙니다. 형식을 확인해 주세요.</div>
        <button id="parseJsonBtn" class="btn-primary" style="margin-top: 15px;">JSON 분석</button>
    </fieldset>

    <fieldset id="step3Area" class="hidden">
        <legend>2단계: 산행 코스 요약 확인</legend>
        <div id="basicInfoResult" class="info-box"></div>
    </fieldset>

    <fieldset id="step4Area" class="hidden">
        <legend>3단계: 주요 설정 및 최종 프롬프트 생성</legend>
        <p style="font-size: 0.9rem; color: #666; margin-top: 0;">배경과 캐릭터의 위치를 원하시는 대로 자유롭게 설정해 주세요.</p>
        
        <div class="input-group">
            <label for="bgLocationEntry">배경에 사용할 핵심 장소 (한국어):</label>
            <input type="text" id="bgLocationEntry" placeholder="예: 이끼계곡과 정상으로 가는 주목나무 숲길 (2씬)">
        </div>

        <div class="input-group">
            <label for="bgSeasonEntry">계절 및 날씨 (한국어):</label>
            <input type="text" id="bgSeasonEntry" placeholder="예: 한여름 맑고 쾌청한 날씨, 한낮은 뜨거운 햇살">
        </div>

        <div class="input-group">
            <label for="charPositionEntry">반달곰 커플의 화면 내 위치 (한국어):</label>
            <input type="text" id="charPositionEntry" placeholder="예: 곰돌이는 화면 좌측 하단의 이끼 계곡, 곰순이는 화면 우측 상단의 주목나무 숲길">
        </div>
        
        <div class="input-group">
            <label for="charActionEntry">반달곰 커플의 행동 정의 (한국어):</label>
            <input type="text" id="charActionEntry" placeholder="예: 곰돌이는 사진기를 들고 사진을 찍고, 곰순이는 귀여운 포즈를 취하고 있어">
        </div>
        
        <button id="generateFinalBtn" class="btn-primary">최종 영문 이미지 프롬프트 생성</button>
    </fieldset>

    <fieldset id="finalArea" class="hidden" style="background-color: #fffde7; border-color: #fff59d;">
        <legend style="color: #f57f17;">최종 결과: 완성형 영문 프롬프트</legend>
        <div class="prompt-result">
            <button class="copy-btn btn-secondary" onclick="copyPrompt()">복사</button>
            <span id="finalPromptResult"></span>
        </div>
    </fieldset>

</div>

<script>
    const nodes = {
        jsonInput: document.getElementById('jsonInput'),
        jsonError: document.getElementById('jsonError'),
        parseBtn: document.getElementById('parseJsonBtn'),
        step3: document.getElementById('step3Area'),
        infoResult: document.getElementById('basicInfoResult'),
        step4: document.getElementById('step4Area'),
        bgLocation: document.getElementById('bgLocationEntry'),
        bgSeason: document.getElementById('bgSeasonEntry'),
        charPosition: document.getElementById('charPositionEntry'), 
        actionEntry: document.getElementById('charActionEntry'),
        generateBtn: document.getElementById('generateFinalBtn'),
        finalArea: document.getElementById('finalArea'),
        finalResult: document.getElementById('finalPromptResult')
    };

    let hikingData = {};

    // --- JSON 입력창 포커스 시 자동 비우기 ---
    const defaultJsonText = nodes.jsonInput.value;
    nodes.jsonInput.addEventListener('focus', function() {
        if (this.value === defaultJsonText) this.value = '';
    });
    nodes.jsonInput.addEventListener('blur', function() {
        if (this.value.trim() === '') this.value = defaultJsonText;
    });

    // --- 다른 사이트를 오가다 브라우저가 탭을 새로고침/재사용해도 입력값이 사라지지 않도록
    //     텍스트 폼 데이터를 자동 저장한다. "폼 초기화" 버튼을 누르기 전까지 유지된다.
    //     index.html의 iframe 안에서 쓰일 때 다른 메뉴로 전환하면 iframe이 즉시 파기되어
    //     beforeunload/디바운스 타이머가 실행되지 않을 수 있으므로, 지연 없이 매번 즉시 저장한다. ---
    const DRAFT_STORAGE_KEY = 'guidePromptBuilderDraft';

    function collectDraftData() {
        return {
            jsonInput: nodes.jsonInput.value === defaultJsonText ? '' : nodes.jsonInput.value,
            bgLocation: nodes.bgLocation.value,
            bgSeason: nodes.bgSeason.value,
            charPosition: nodes.charPosition.value,
            actionEntry: nodes.actionEntry.value,
            // 1단계(JSON 분석) 결과와 최종 영문 프롬프트까지 그대로 보관해
            // 다시 열었을 때 처음부터 다시 생성하지 않아도 되게 한다.
            hikingData: hikingData,
            infoResultText: nodes.infoResult.innerText,
            finalPromptText: nodes.finalResult.innerText,
            step3Visible: !nodes.step3.classList.contains('hidden'),
            step4Visible: !nodes.step4.classList.contains('hidden'),
            finalAreaVisible: !nodes.finalArea.classList.contains('hidden')
        };
    }

    function saveDraftNow() {
        try {
            localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(collectDraftData()));
        } catch (e) {
            // localStorage 용량 초과 등은 자동저장 실패로 조용히 넘어감
        }
    }

    function scheduleDraftSave() {
        saveDraftNow();
    }

    function clearDraft() {
        localStorage.removeItem(DRAFT_STORAGE_KEY);
    }

    function restoreDraftIfAny() {
        let raw;
        try {
            raw = localStorage.getItem(DRAFT_STORAGE_KEY);
        } catch (e) {
            return;
        }
        if (!raw) return;
        try {
            const data = JSON.parse(raw);
            if (data.jsonInput) nodes.jsonInput.value = data.jsonInput;
            if (data.bgLocation) nodes.bgLocation.value = data.bgLocation;
            if (data.bgSeason) nodes.bgSeason.value = data.bgSeason;
            if (data.charPosition) nodes.charPosition.value = data.charPosition;
            if (data.actionEntry) nodes.actionEntry.value = data.actionEntry;

            if (data.hikingData) hikingData = data.hikingData;
            if (data.infoResultText) nodes.infoResult.innerText = data.infoResultText;
            if (data.finalPromptText) nodes.finalResult.innerText = data.finalPromptText;
            if (data.step3Visible) nodes.step3.classList.remove('hidden');
            if (data.step4Visible) nodes.step4.classList.remove('hidden');
            if (data.finalAreaVisible) nodes.finalArea.classList.remove('hidden');
        } catch (e) {
            // 저장된 draft가 깨져 있으면 무시(폼은 기본 상태로 시작)
        }
    }

    function resetForm() {
        nodes.jsonInput.value = defaultJsonText;
        nodes.bgLocation.value = '';
        nodes.bgSeason.value = '';
        nodes.charPosition.value = '';
        nodes.actionEntry.value = '';
        nodes.jsonError.style.display = 'none';
        nodes.step3.classList.add('hidden');
        nodes.step4.classList.add('hidden');
        nodes.finalArea.classList.add('hidden');
        hikingData = {};
        clearDraft();
    }

    document.getElementById('resetFormBtn').addEventListener('click', resetForm);
    [nodes.jsonInput, nodes.bgLocation, nodes.bgSeason, nodes.charPosition, nodes.actionEntry].forEach(el => {
        el.addEventListener('input', scheduleDraftSave);
    });
    window.addEventListener('beforeunload', saveDraftNow);

    restoreDraftIfAny();

    // --- 동적 캐릭터 정의 생성 함수 (스마트 소품 전환) ---
    function getCharDefinitions(actionText) {
        let blackBearPole = "Holding exactly one trekking pole in right paw and one in left paw (total 2 poles).";
        let pinkBearPole = "Holding exactly one trekking pole in right paw and one in left paw (total 2 poles).";
        
        // 사진기/카메라 키워드 인식 시 등산스틱 해제
        if (actionText.includes("사진기") || actionText.includes("카메라")) {
            if (actionText.includes("곰돌이")) blackBearPole = "Holding a camera and taking pictures (no trekking poles).";
            if (actionText.includes("곰순이")) pinkBearPole = "Holding a camera and taking pictures (no trekking poles).";
            if (!actionText.includes("곰돌이") && !actionText.includes("곰순이")) {
                blackBearPole = "Holding a camera (no trekking poles).";
            }
        }

        return `
[BLACK MOON BEAR]: Premium cinematic 3D animated mascot, ultra-cute, lovable collectible plush-toy proportions, soft fluffy black fur, clear natural white crescent marking on chest, round baby-face proportions, oversized sparkling eyes, round chubby cheeks, warm friendly smile, small black nose. Wearing beige wide-brim hiking hat, olive green functional layering hiking outfit, olive green large hiking backpack with small water bottle, brown sturdy hiking boots. ${blackBearPole}
[PINK MOON BEAR]: Extremely adorable 3D animated mascot, lovable plush-toy proportions, soft cotton-candy pink fluffy fur, clear white crescent marking on chest, round baby-face proportions, oversized sparkling eyes with soft eyelashes, round chubby cheeks, bright lovable smile, tiny nose. Wearing light pink wide-brim hiking hat, light pink and beige functional layering hiking outfit, light pink hiking backpack with small water bottle, brown sturdy hiking boots. ${pinkBearPole}
The couple is depicted sharing a warm, joyful bond. They are naturally integrated into the scenic environment based on the specified position.
[CHARACTER SCALE - STRICT]: Both bears are SMALL, distant figures within the vast panoramic landscape — the background scenery is the true subject of this wallpaper, not the characters. Each bear's height must occupy no more than 15-18% of the total frame height. Render them at a scale consistent with two small hikers seen from a distance on a mountain trail, fully surrounded by open landscape on all sides. Do not crop, zoom into, or fill the frame with the characters.`;
    }

    const STYLE_DEFINITIONS_EN = `
[BACKGROUND STYLE]: Photorealistic high-resolution mountain landscape, professional outdoor travel photography quality, authentic national park scenery, cinematic natural lighting, realistic atmospheric perspective with layered ridges fading into the distance, detailed textures for rocks, trees, and ground.
[MASCOT RENDER]: Polished feature-animation quality rendering, soft global illumination, detailed but gentle fur texture, naturally integrated with proper contact shadows and lighting matching the environment.`;

    // --- 동적 네거티브 프롬프트 (스틱 규칙 유연화) ---
    function getNegativePrompt(actionText) {
        let baseNeg = `No text, no readable letters, no labels, no captions, no numbers, no infographic, no artificial section dividers, no split-screen, no collage, no separate framed scenes, no map layout, no disconnected trail sections. No flat illustration. No scary bear, no realistic wildlife bear, no sharp teeth, no visible claws. No extra arms, no extra legs, no floating characters. No empty space, no black borders. No oversized characters, no close-up character shot, no characters filling or dominating the frame, no characters larger than 20% of frame height.`;
        
        // 카메라를 안 들고 있으면 스틱 필수 규칙 추가
        if (!(actionText.includes("사진기") || actionText.includes("카메라"))) {
             baseNeg += " No missing poles. Each bear uses exactly two poles.";
        }
        return baseNeg;
    }

    // --- 강력해진 한국어-영어 번역 사전 ---
    function translateKeyword(text) {
        if (!text) return "";
        const map = {
            "곰돌이는": "The Black Moon Bear is",
            "곰순이는": "The Pink Moon Bear is",
            "곰돌이": "Black Moon Bear",
            "곰순이": "Pink Moon Bear",
            "사진기를 들고": "holding a camera",
            "사진기": "camera",
            "사진을 찍고": "taking a picture",
            "귀여운 포즈를 취하고 있어": "striking a cute pose",
            "포즈를 취하고": "striking a cute pose",
            "좌측 하단": "bottom-left",
            "우측 상단": "top-right",
            "화면 좌측 하단의": "in the bottom-left foreground of",
            "화면 우측 상단의": "in the top-right background of",
            "(2씬)": "(A dynamic composition showing both locations connected naturally in one panoramic view)",
            "2씬": "dynamic composition",
            "이끼계곡": "mossy valley",
            "이끼 계곡": "mossy valley",
            "주목나무 숲길": "ancient yew tree forest trail",
            "주목나무": "ancient yew tree",
            "한여름": "midsummer",
            "뜨거운 햇살": "bright hot sunlight",
            "이끼": "mossy", "폭포": "waterfall", "돌길": "rocky path",
            "정상으로 가는": "leading to the summit",
            "정상": "summit", "고원": "plateau", "조망": "panoramic view", 
            "산그리메": "layered mountain silhouettes", "원시림": "primeval forest",
            "계곡": "valley stream", "가을": "Autumn", "봄": "Spring", 
            "여름": "Summer", "겨울": "Winter", "맑은": "clear", "따뜻한": "warm", "쾌청한": "crisp and clear"
        };
        let translated = text;
        // 긴 단어부터 순차적으로 치환
        Object.keys(map).sort((a,b) => b.length - a.length).forEach(k => {
            translated = translated.replaceAll(k, map[k]);
        });
        return translated;
    }

    nodes.parseBtn.addEventListener('click', () => {
        const rawJson = nodes.jsonInput.value.trim();
        nodes.jsonError.style.display = 'none';

        if (!rawJson) {
            alert('JSON 데이터를 입력해 주세요.');
            return;
        }

        try {
            const parsed = JSON.parse(rawJson);
            
            let allFeaturesSet = new Set();
            if(parsed.sections) {
                parsed.sections.forEach(sec => {
                    if(sec.features) sec.features.forEach(f => allFeaturesSet.add(f));
                });
            }

            hikingData = {
                mountainName: parsed.mountainName || "명산",
                routeFlow: parsed.courseRouteFlow ? parsed.courseRouteFlow.join(" ➔ ") : "경로 정보 없음",
                allFeatures: Array.from(allFeaturesSet).join(", ")
            };

            const summaryKo = `
산명: ${hikingData.mountainName}
전체 흐름: ${hikingData.routeFlow}
코스 주요 특징: ${hikingData.allFeatures || '정보 없음'}
`;
            nodes.infoResult.innerText = summaryKo;
            nodes.step3.classList.remove('hidden');
            nodes.step4.classList.remove('hidden');
            nodes.finalArea.classList.add('hidden');
            nodes.finalResult.innerText = '';
            nodes.step4.scrollIntoView({ behavior: 'smooth' });
            saveDraftNow();

        } catch (e) {
            nodes.jsonError.style.display = 'block';
            nodes.step3.classList.add('hidden');
            nodes.step4.classList.add('hidden');
            nodes.finalArea.classList.add('hidden');
        }
    });

    nodes.generateBtn.addEventListener('click', () => {
        const locationText = nodes.bgLocation.value.trim();
        const seasonWeather = nodes.bgSeason.value.trim();
        const positionText = nodes.charPosition.value.trim(); 
        const actionText = nodes.actionEntry.value.trim();

        if (!locationText || !seasonWeather || !positionText || !actionText) {
            alert('모든 설정값을 입력해 주세요.');
            return;
        }

        let finalPrompt = `[COMPOSITION RULE - STRICT]: A premium ultrawide 21:9 panoramic desktop wallpaper showing ONE seamless, continuous hiking trail. The entire route is connected as one coherent, photorealistic mountain landscape. The scenery must flow naturally from foreground to background without any artificial section dividers, collage, or split-screen.\n\n`;

        finalPrompt += `[SCENE & ENVIRONMENT]: The background landscape features ${translateKeyword(locationText)} at ${hikingData.mountainName}. Lighting and atmosphere: ${translateKeyword(seasonWeather)}. A long, single hiking trail winds naturally through this magnificent scenery.\n\n`;

        finalPrompt += `[CHARACTERS POSITION & ACTION]:\n`;
        finalPrompt += `Position: ${translateKeyword(positionText)}.\n`;
        finalPrompt += `Action: ${translateKeyword(actionText)}.\n`;
        // 행동(카메라 유무 등)에 따라 동적으로 생성된 캐릭터 룰 적용
        finalPrompt += getCharDefinitions(actionText) + `\n\n`;

        finalPrompt += `[STYLE]:\n${STYLE_DEFINITIONS_EN}\n\n`;
        // 행동(카메라 유무 등)에 따라 동적으로 생성된 네거티브 룰 적용
        finalPrompt += `[NEGATIVE PROMPT]:\n${getNegativePrompt(actionText)}`;

        nodes.finalResult.innerText = finalPrompt;
        nodes.finalArea.classList.remove('hidden');
        nodes.finalArea.scrollIntoView({ behavior: 'smooth' });
        saveDraftNow();
    });

    function copyPrompt() {
        const textToCopy = nodes.finalResult.innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert('최종 영문 프롬프트가 복사되었습니다!');
        }).catch(err => {
