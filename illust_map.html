<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>산행 일러스트 지도</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#f6f1e6;--panel:#fffdf8;--ink:#3d2b1f;--sub:#7a6450;--line:#e2d6c2;--accent:#a4522a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:6px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
header h1{font-size:17px;margin:0}
header span{color:var(--sub);font-size:13px}
main{display:grid;grid-template-columns:330px 1fr;flex:1;min-height:0}
@media(max-width:900px){body{height:auto;overflow:auto}main{grid-template-columns:1fr}.panel,.view{height:auto!important}#cvBox{height:70vh!important}}
.panel{background:var(--panel);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;height:100%;overflow-y:auto}
.step{font-weight:700;font-size:14px;color:var(--accent)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
input[type=text]{border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:14px;background:#fff;color:var(--ink);width:100%}
.drop{border:2px dashed #cdb898;border-radius:10px;padding:18px;text-align:center;cursor:pointer;font-size:14px;color:var(--sub);background:#fffaf0}
.drop.on{background:#f3e5cc}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:1px solid #b9875f;background:#fff;color:var(--ink);border-radius:7px;padding:8px 12px;font-size:14px;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
.chk{font-size:13px;display:flex;gap:5px;align-items:center}
#wpList{display:flex;flex-direction:column;gap:5px;max-height:330px;overflow:auto}
.wp{display:grid;grid-template-columns:22px 26px 1fr 64px;gap:5px;align-items:center;font-size:13px}
.wp .no{font-weight:700;text-align:center;color:var(--accent)}
.wp input[type=text]{padding:4px 6px;font-size:13px}
.view{background:#e9e4d8;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;height:100%;min-height:0}
canvas{width:100%;height:auto;border-radius:6px;background:#efe6cf;display:block}
textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;line-height:1.55;font-family:inherit;color:var(--ink);background:#fff;resize:vertical}
.hint{font-size:12px;color:var(--sub);line-height:1.5}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
#status:empty{display:none}
#zoomBar button{padding:5px 9px;font-size:13px}
.panel>*{flex-shrink:0} /* 메뉴 칸이 눌려 사라지지 않게 — 넘치면 메뉴 전체가 스크롤 */
</style></head><body>
<header><h1>🗺️ 산행 일러스트 지도</h1><div id="zoomBar" class="row" style="display:none;align-items:center;gap:6px;margin-left:auto">
    <button id="btnZoomIn">＋ 확대</button><button id="btnZoomOut">－ 축소</button><button id="btnZoomReset">⤢ 화면에 맞게</button>
    <button id="btnEdit">✏️ 지명 편집</button><button id="btnEdReset" title="이 코스에서 지우거나 옮긴 지명을 모두 원래대로">↺ 편집 되돌리기</button>
    <span class="hint" id="zoomHint">휠: 확대·축소 · 끌기: 이동</span>
  </div></header>
<main>
<section class="panel">
  <div class="step">① GPX 불러오기</div>
  <div class="drop" id="drop">GPX 파일을 끌어다 놓거나 눌러서 선택<input type="file" id="file" accept=".gpx" hidden></div>
  <button id="btnPicker" type="button">📂 보관된 코스에서 가져오기 (gpx-map에서 편집한 지명 그대로)</button>
  <div id="nameSrc" class="hint"></div>
  <label class="field">산행지 메인 제목<input type="text" id="title" placeholder="GPX 이름이 자동으로 들어갑니다"></label>
  <label class="field">코스 설명 (부제목)<input type="text" id="subtitle" placeholder="지점 이름으로 자동 작성 — 직접 고칠 수 있어요"></label>
  <div class="row">
    <label class="field" style="flex:1">총 거리<input type="text" id="dist"></label>
    <label class="field" style="flex:1">소요 시간<input type="text" id="time" placeholder="예: 약 6시간"></label>
  </div>

  <div class="step">② 지점 (번호 = 지도 위 마커)</div>
  <div class="hint">체크 해제하면 지도에서 빠집니다. 이름·고도는 직접 고칠 수 있어요.</div>
  <div id="wpList"><div class="hint">GPX를 불러오면 지점 목록이 나타납니다.</div></div>

  <div class="step">③ 바탕 지도</div>
  <label class="field">스타일
    <select id="optStyle" style="border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:14px;background:#fff">
      <option value="real" selected>실제 지도 (실제 지형·지명, 신문형)</option>
      <option value="news">등산지도 (신문형, 가상 지형)</option>
      <option value="water">수채화 바탕</option>
    </select></label>
  <div class="row" id="waterOpts">
    <label class="chk"><input type="checkbox" id="optNum" checked>번호 마커</label>
    <label class="chk"><input type="checkbox" id="optContour" checked>등고선</label>
    <label class="chk"><input type="checkbox" id="optMtn" checked>산 그림</label>
    <label class="chk"><input type="checkbox" id="optTree" checked>나무</label>
  </div>
  <div id="realOpts" style="display:flex;flex-direction:column;gap:8px">
    <label class="field">화면 비율
      <select id="optAspect" style="border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:14px;background:#fff">
        <option value="fill" selected>화면 꽉 차게</option><option value="auto">코스 모양에 맞춤</option>
        <option value="a4l">A4 가로</option><option value="a4p">A4 세로</option><option value="169">16:9 와이드</option><option value="11">1:1 정방형</option>
      </select></label>
    <div class="step" style="font-size:13px">▦ 안내판 구성 요소 표시</div>
    <label class="chk"><input type="checkbox" id="optBoard" checked>상단 메인 타이틀 명판</label>
    <label class="chk"><input type="checkbox" id="optStats" checked>산행 통계 카드 (거리/고도/시간)</label>
    <label class="chk"><input type="checkbox" id="optProfile">하단 고도 프로필 단면도</label>
    <label class="chk"><input type="checkbox" id="optLegend" checked>관광안내도 범례 (Legend)</label>
  </div>
  <div class="row">
    <button id="btnSeed" disabled>🎲 다른 모양으로</button>
    <button id="btnPng" class="main" disabled>⬇ 바탕 지도 PNG</button>
    <button id="btnRetryOsm" style="display:none">🔄 지명 다시 받기</button>
  </div>
</section>

<section class="view">
  <div id="emptyMsg" class="empty">왼쪽에서 GPX 파일을 불러오세요.</div>
  <div id="status" class="hint"></div>

  <div id="cvBox" style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">
  <div id="cvWrap" style="position:relative;overflow:hidden;border-radius:6px;touch-action:none;width:fit-content;max-width:100%">
  <div id="edBox" style="position:absolute;display:none;border:2px dashed #d7262e;background:rgba(215,38,46,.08);pointer-events:none;z-index:2"></div>
  <div id="edMenu" style="position:absolute;display:none;z-index:3;gap:4px"><button id="edDel" style="padding:4px 8px;font-size:13px;background:#d7262e;color:#fff;border-color:#d7262e">🗑 지우기</button></div><canvas id="cv" width="1920" height="1080" hidden style="transform-origin:0 0;display:block"></canvas></div></div>
</section>
</main>

<div id="pickerOv" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;align-items:center;justify-content:center">
  <div style="background:#fffdf8;border-radius:12px;padding:18px;width:min(460px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:10px">
    <div class="step">📂 보관된 코스 (GitHub tracks/)</div>
    <input type="text" id="pickerQ" placeholder="파일명으로 검색 (예: 운장산)">
    <div id="pickerList" style="overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px;font-size:14px"></div>
    <button id="pickerClose" type="button">닫기</button>
  </div>
</div>
<script>
'use strict';
let W=1920,H=1080;
const SC=2;
// 지명 편집: 코스마다 지운 지명(hid)과 옮긴 거리(off, 지도 논리 px)를 브라우저에 저장
let ED={hid:new Set(),off:{}},EDIT=false;
const edKey=()=>'illust_ed_'+(G&&G.name||'');
function edLoad(){ED={hid:new Set(),off:{}};try{const j=JSON.parse(localStorage.getItem(edKey())||'null');if(j){ED.hid=new Set(j.hid||[]);ED.off=j.off||{};}}catch(e){}}
function edSave(){try{localStorage.setItem(edKey(),JSON.stringify({hid:[...ED.hid],off:ED.off}));}catch(e){}}
// 지점 아이콘(그림 파일: illust_icons/) — 샘터·절·암자·쉼터·폭포. 다 읽히면 다시 그림
const ICON={};['spring','temple','hermitage','rest','waterfall'].forEach(k=>{const im=new Image();im.onload=()=>{let g=null;try{g=G;}catch(e){}if(g&&typeof render==='function'){clearTimeout(window._ir);window._ir=setTimeout(render,200);}};im.src='illust_icons/'+k+'.png';ICON[k]=im;});
// 이름으로 지점 종류: peak(산) / spring / hermitage / temple / rest / waterfall / pass(고개) / dot(그 밖)
function poiKind(n){n=n||'';
  if(/폭포|용추/.test(n))return'waterfall';
  if(/샘|약수|용출수/.test(n))return'spring';
  if(/암자|[가-힣]암$/.test(n))return'hermitage';
  if(/사찰|선원|[가-힣]사$|절$/.test(n))return'temple';
  if(/쉼터|정자|대피소|산장|휴게소/.test(n))return'rest';
  if(/산$|봉$|봉우리|정상|[가-힣]대$/.test(n))return'peak';
  if(isPass(n))return'pass';
  return'dot';}
// 아이콘 그리기: (x,y) 지점 바로 위에 밑변이 오도록, 크기 sz(논리 px)
function drawIcon(k,x,y,sz){const im=ICON[k];if(!im||!im.complete||!im.naturalWidth)return false;const r=im.naturalWidth/im.naturalHeight,h=sz,w=sz*r;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=4;ctx.shadowOffsetY=1;ctx.drawImage(im,x-w/2,y-h-4,w,h);ctx.restore();return true;} // 실제 지도는 논리 크기의 2배 픽셀로 그려 선명하게 (PNG도 2배 해상도)
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let G=null;          // {pts:[{lat,lon,ele,t}], wps:[...], name}
let seed=1;

/* ---------- 난수/노이즈 ---------- */
function rng(s){let a=s>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function hash(ix,iy){let h=Math.imul(ix,374761393)+Math.imul(iy,668265263)+Math.imul(seed,1442695041);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;}
function fbm(x,y){let v=0,amp=.5,f=1;for(let i=0;i<4;i++){v+=amp*vnoise(x*f,y*f);f*=2;amp*=.5;}return v/0.9375;}

/* ---------- GPX 읽기 ---------- */
function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){return new TextDecoder('euc-kr').decode(buf);}}
function parseGPX(text,fname){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  const num=(n,tag)=>{const e=n.getElementsByTagName(tag)[0];return e?parseFloat(e.textContent):null;};
  let nodes=[...doc.getElementsByTagName('trkpt')];
  if(!nodes.length)nodes=[...doc.getElementsByTagName('rtept')];
  const pts=nodes.map(n=>{const te=n.getElementsByTagName('time')[0];return{lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),ele:num(n,'ele'),t:te?Date.parse(te.textContent):null};}).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
  if(pts.length<2)throw new Error('GPX에 트랙 좌표가 없습니다.');
  const wps=[...doc.getElementsByTagName('wpt')].map(n=>{const ne=n.getElementsByTagName('name')[0];return{lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon'),ele:num(n,'ele'),name:ne?ne.textContent.trim():''};});
  const nm=doc.querySelector('metadata > name, trk > name');
  return{pts,wps,name:(nm&&nm.textContent.trim())||fname.replace(/\.gpx$/i,'')};
}
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;const s=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(s));}

/* 지점 목록 만들기: GPX 웨이포인트 → 트랙 순서로 정렬, 없으면 고도 극대점 자동 추출 */
function buildWaypoints(g){
  const {pts}=g;
  // 고도 결측 보정
  let last=null;pts.forEach(p=>{if(p.ele==null)p.ele=last;else last=p.ele;});
  const first=pts.find(p=>p.ele!=null);pts.forEach(p=>{if(p.ele==null)p.ele=first?first.ele:0;});
  const nearest=w=>{let bi=0,bd=Infinity;for(let i=0;i<pts.length;i++){const d=(pts[i].lat-w.lat)**2+(pts[i].lon-w.lon)**2;if(d<bd){bd=d;bi=i;}}return bi;};
  let list;
  if(g.wps.length){
    list=g.wps.map(w=>{const i=nearest(w);return{idx:i,name:w.name,ele:w.ele!=null?Math.round(w.ele):Math.round(pts[i].ele)};});
  }else{
    // 자동: 전후 ~400m 구간 최고점이면서 주변보다 50m 이상 높은 지점
    const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
    list=[{idx:0,name:'',ele:Math.round(pts[0].ele)}];
    for(let i=1;i<pts.length-1;i++){let isMax=true,lo=Infinity;
      for(let j=i;j>=0&&cum[i]-cum[j]<400;j--){if(pts[j].ele>pts[i].ele){isMax=false;break;}lo=Math.min(lo,pts[j].ele);}
      if(!isMax)continue;let lo2=Infinity;
      for(let j=i;j<pts.length&&cum[j]-cum[i]<400;j++){if(pts[j].ele>pts[i].ele){isMax=false;break;}lo2=Math.min(lo2,pts[j].ele);}
      if(isMax&&pts[i].ele-Math.max(lo,lo2)>=50&&list.every(w=>cum[i]-cum[w.idx]>300))list.push({idx:i,name:'봉우리',ele:Math.round(pts[i].ele)});}
    list.push({idx:pts.length-1,name:'',ele:Math.round(pts[pts.length-1].ele)});
  }
  list.sort((a,b)=>a.idx-b.idx);
  // 들머리/날머리 표기 정리: "들머리 (이화령)" → 이름 "이화령", role 부여
  const loop=hav(pts[0],pts[pts.length-1])<500;
  // 이름에 들머리/날머리가 적힌 지점이 있으면 그게 우선 — 위치(처음/끝)로는 그런 표기가 없을 때만 정함
  const reS=/들머리|출발|시작/,reE=/날머리|도착|종료/;
  const hasS=list.some(w=>reS.test(w.name||'')),hasE=list.some(w=>reE.test(w.name||''));
  list.forEach((w,i)=>{
    let n=w.name||'';let role=null;
    const isS=reS.test(n)||(!hasS&&i===0),isE=reE.test(n)||(!hasE&&i===list.length-1);
    if(isS)role=loop?'들머리·날머리':'들머리';
    else if(isE)role='날머리';
    if(reS.test(n)||reE.test(n)){const m=n.match(/[(（]([^)）]+)[)）]/);n=m?m[1]:n.replace(/들머리|날머리|출발지?|도착지?|시작점?|종료/g,'').trim();}
    w.name=n;w.role=role;w.show=role?true:!/(갈림길|삼거리|사거리|오거리|이정표|갈림)$/.test(n); // 갈림길·○○삼거리 등은 기본 숨김(목록에서 켜기)
  });
  // 원점회귀면 마지막 날머리 지점이 들머리와 겹치므로 숨김
  if(loop&&list.length>2&&list[list.length-1].role==='날머리'&&hav(pts[list[0].idx],pts[list[list.length-1].idx])<300)list[list.length-1].show=false;
  return list;
}

/* ---------- 투영 ---------- */
function project(g){
  const lat0=g.pts.reduce((s,p)=>s+p.lat,0)/g.pts.length,k=Math.cos(lat0*Math.PI/180);
  const raw=g.pts.map(p=>[p.lon*k,-p.lat]);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;raw.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
  const bw=W*0.66,bh=H*0.64,s=Math.min(bw/(x1-x0||1e-9),bh/(y1-y0||1e-9));
  const ox=W/2-(x0+x1)/2*s,oy=H*0.53-(y0+y1)/2*s;
  return raw.map(([x,y])=>[x*s+ox,y*s+oy]);
}
function resample(xy,step){const out=[xy[0]];let acc=0;for(let i=1;i<xy.length;i++){const [ax,ay]=xy[i-1],[bx,by]=xy[i];let d=Math.hypot(bx-ax,by-ay);
  let t=0;while(acc+d*(1-t)>=step){const need=step-acc;t+=need/d*(1);if(t>1)break;out.push([ax+(bx-ax)*t,ay+(by-ay)*t]);acc=0;d=Math.hypot(bx-ax,by-ay);}
  acc+=d*(1-t);}out.push(xy[xy.length-1]);return out;}
function smoothPath(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;c.quadraticCurveTo(p[i][0],p[i][1],mx,my);}c.lineTo(p[p.length-1][0],p[p.length-1][1]);}

/* ---------- 지형 높이장 ---------- */
function buildField(samples,eles,R,bumps){
  const step=6,gw=Math.ceil(W/step)+1,gh=Math.ceil(H/step)+1;
  const emin=Math.min(...eles),emax=Math.max(...eles),range=Math.max(emax-emin,150);
  const fall=range/(Math.min(W,H)*0.28); // px당 하강량
  const f=new Float32Array(gw*gh);
  for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){
    const x=i*step,y=j*step;let h=emin-range*0.45;
    for(let k=0;k<samples.length;k++){const d=Math.hypot(samples[k][0]-x,samples[k][1]-y);const v=eles[k]-fall*d;if(v>h)h=v;}

async function autoNameFromDB(g){

  const base=MAPDB_URL.replace(/\/bbox$/,'/pois');

    ...(j.kakao||[]).map(p=>({name:p.name,lat:p.lat,lon:p.lon,ele:null,type:p.type==='pass'?'pass':p.type,pri:2}))]
    .filter(c=>c.name&&/[가-힣]/.test(c.name)&&!/삼각점|헬기장|^봉우리$|주차장|화장실|^정자$|^쉼터$/.test(c.name)&&['peak','pass','temple','spring','shelter','view','rest','waterfall'].includes(c.type));
  // 각 후보의 경로 위 위치(가까운 트랙점)와 거리
  const step=Math.max(1,Math.floor(pts.length/1500)),cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
  const lim={peak:150,pass:120,temple:120,spring:100,shelter:150,view:100,rest:80,waterfall:100};
  const hits=[];for(const c of cands){let bi=0,bd=1e9;for(let i=0;i<pts.length;i+=step){const d=hav(pts[i],c);if(d<bd){bd=d;bi=i;}}

 $('cvWrap').addEventListener('pointermove',e=>{if(!drag)return;pv.tx=drag.tx+e.clientX-drag.x;pv.ty=drag.ty+e.clientY-drag.y;applyPreview();});
 const end=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag=null;$('cvWrap').style.cursor='';
   if(Math.abs(dx)+Math.abs(dy)<3){if(pv.sc!==1||pv.tx||pv.ty)scheduleRender(0);return;}
   const k=W/$('cvWrap').clientWidth;panX+=dx*k;panY+=dy*k;scheduleRender(0);};
 $('cvWrap').addEventListener('pointerup',end);$('cvWrap').addEventListener('pointercancel',end);}
$('btnZoomIn').onclick=()=>{const r=$('cvWrap').getBoundingClientRect();zoomAt(1.5,r.width/2,r.height/2);};
$('btnZoomOut').onclick=()=>{const r=$('cvWrap').getBoundingClientRect();zoomAt(1/1.5,r.width/2,r.height/2);};
$('btnZoomReset').onclick=()=>{zoomF=1;panX=0;panY=0;resetPreview();render();};
// ── 지명 편집 ──
document.getElementById('cvWrap').addEventListener('pointermove',e=>{if(EDIT||!G||$('optStyle').value!=='real'||e.buttons)return;let h=null;try{h=edFind(e);}catch(_){}
  $('cvWrap').style.cursor=h&&h.key.startsWith('__')?'move':'grab';});
function edHide(){$('edBox').style.display='none';$('edMenu').style.display='none';}
function edPx(){const r=cv.getBoundingClientRect();return r.width/W;} // 논리 px → 화면 px
function edShow(L,dx=0,dy=0){const k=edPx(),b=$('edBox');b.style.display='block';b.style.left=((L.x+dx)*k-3)+'px';b.style.top=((L.y+dy)*k-3)+'px';b.style.width=(L.w*k+6)+'px';b.style.height=(L.h*k+6)+'px';}
let edSel=null,edDrag=null;
$('btnEdit').onclick=()=>{EDIT=!EDIT;edSel=null;edHide();$('btnEdit').classList.toggle('main',EDIT);$('btnEdit').textContent=EDIT?'✅ 편집 끝내기':'✏️ 지명 편집';
  $('cvWrap').style.cursor=EDIT?'pointer':'';
  $('zoomHint').textContent=EDIT?'누르면 🗑 지우기 · 끌면 옮기기':'휠: 확대·축소 · 끌기: 이동';};
$('btnEdReset').onclick=()=>{if(!G)return;if(!confirm('이 코스에서 지우거나 옮긴 지명을 모두 원래대로 되돌릴까요?'))return;ED={hid:new Set(),off:{}};edSave();edHide();render();};
const edFind=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  const L=(G&&G._lbl)||[];for(let i=L.length-1;i>=0;i--){const b=L[i];if(x>=b.x-4&&x<=b.x+b.w+4&&y>=b.y-4&&y<=b.y+b.h+4)return b;}return null;};
$('cvWrap').addEventListener('pointerdown',e=>{if(!EDIT||!isReal()||e.target.closest('#edMenu'))return;const L=edFind(e);edHide();edSel=null;if(!L)return;
  edDrag={L,x:e.clientX,y:e.clientY};$('cvWrap').setPointerCapture(e.pointerId);edShow(L);});
$('cvWrap').addEventListener('pointermove',e=>{if(!edDrag)return;const k=edPx();edShow(edDrag.L,(e.clientX-edDrag.x)/k,(e.clientY-edDrag.y)/k);});
$('cvWrap').addEventListener('pointerup',e=>{if(!edDrag)return;const {L,x,y}=edDrag;edDrag=null;const k=edPx(),dx=(e.clientX-x)/k,dy=(e.clientY-y)/k;
  if(Math.abs(dx)+Math.abs(dy)<3){if(!EDIT){edHide();return;}edSel=L;edShow(L);const m=$('edMenu');m.style.display='flex';m.style.left=(L.x*k)+'px';m.style.top=Math.max(0,L.y*k-34)+'px';return;}
  const o=ED.off[L.key]||[0,0];ED.off[L.key]=[o[0]+dx,o[1]+dy];edSave();edHide();render();});
const edDelete=()=>{if(!edSel)return;ED.hid.add(edSel.key);edSave();edSel=null;edHide();render();};
$('edDel').onclick=e=>{e.stopPropagation();edDelete();};
document.addEventListener('keydown',e=>{if(EDIT&&edSel&&(e.key==='Delete'||e.key==='Backspace')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();edDelete();}});
// 테스트용: ?gpx=경로 로 바로 불러오기
const q=new URLSearchParams(location.search).get('gpx');
if(q)fetch(q).then(r=>r.blob()).then(b=>load(new File([b],decodeURIComponent(q.split('/').pop())))).catch(()=>{});
