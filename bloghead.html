<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로그 헤더 편집 도구</title>
    
    <!-- Cropper.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            text-align: center;
        }
        .container {
            max-width: 1050px; 
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .instructions {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .canvas-wrapper {
            display: inline-block;
            border: 2px dashed #007bff;
            background-color: #e9ecef;
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn:hover { background-color: #5a6268; }
        .btn-crop { background-color: #17a2b8; }
        .btn-crop:hover { background-color: #138496; }
        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #c82333; }
        
        .save-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .name-input {
            width: 150px;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 5px;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-save:hover { background-color: #218838; }

        .modal {
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); 
            z-index: 1000; 
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            width: 90%; max-width: 600px;
            text-align: center;
        }
        .crop-container {
            width: 100%; height: 50vh; 
            margin-bottom: 20px; background-color: #eee;
        }
        .crop-container img {
            display: block; max-width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📷 블로그 헤더 이미지 편집 (가로형)</h2>
        <p class="instructions">
            원하는 사진을 캔버스 안에서 선택한 뒤, 아래 버튼을 눌러 순서 변경이나 자르기를 해보세요.<br>
            모든 배치가 끝나면 산 이름을 입력하고 저장 버튼을 누르세요.
        </p>
        
        <div class="controls">
            <input type="file" id="uploadImages" accept="image/*" multiple>
        </div>
        
        <div class="controls">
            <button id="bringFrontBtn" class="btn">🔼 맨 앞으로</button>
            <button id="sendBackBtn" class="btn">🔽 맨 뒤로</button>
            <button id="cropBtn" class="btn btn-crop">✂️ 선택한 사진 자르기</button>
            <button id="deleteBtn" class="btn btn-delete">🗑️ 삭제</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="c" width="966" height="300"></canvas>
        </div>

        <div class="save-area">
            <input type="text" id="mountainName" class="name-input" value="" placeholder="예: 지리산">
            <span style="font-size: 16px; font-weight: bold; color: #333;">블러그헤더</span>
            <button id="saveBtn" class="btn-save">💾 저장</button>
        </div>
    </div>

    <div id="cropModal" class="modal">
        <div class="modal-content">
            <h3>사진 자르기</h3>
            <div class="crop-container">
                <img id="cropTarget" src="">
            </div>
            <div>
                <button id="applyCropBtn" class="btn-save">✅ 자르기 적용</button>
                <button id="cancelCropBtn" class="btn btn-delete">❌ 취소</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    
    <script>
        const canvas = new fabric.Canvas('c', {
            backgroundColor: '#ffffff',
            preserveObjectStacking: true
        });

        // 💡 사진 업로드 시 자동 크기 조절 로직 추가
        document.getElementById('uploadImages').addEventListener('change', function(e) {
            const files = e.target.files;
            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(f) {
                    fabric.Image.fromURL(f.target.result, function(img) {
                        const cWidth = canvas.getWidth();
                        const cHeight = canvas.getHeight();
                        
                        // 캔버스의 90% 크기를 최대치로 설정 (여백 확보)
                        const maxWidth = cWidth * 0.9;
                        const maxHeight = cHeight * 0.9;
                        
                        let scale = 1;
                        // 원본 이미지가 캔버스보다 크면 비율에 맞춰 축소
                        if (img.width > maxWidth || img.height > maxHeight) {
                            scale = Math.min(maxWidth / img.width, maxHeight / img.height);
                        }
                        
                        img.set({
                            scaleX: scale, 
                            scaleY: scale,
                            // 캔버스 정중앙 즈음에 배치되도록 위치 계산 (여러 장일 경우 살짝 어긋나게)
                            left: (cWidth - img.width * scale) / 2 + (i * 20),
                            top: (cHeight - img.height * scale) / 2 + (i * 20),
                            cornerColor: '#007bff', 
                            cornerStyle: 'circle', 
                            transparentCorners: false
                        });
                        
                        canvas.add(img);
                        canvas.setActiveObject(img);
                    });
                };
                reader.readAsDataURL(files[i]);
            }
            e.target.value = ''; 
        });

        document.getElementById('bringFrontBtn').addEventListener('click', () => {
            const activeObj = canvas.getActiveObject();
            if (activeObj) canvas.bringToFront(activeObj);
        });

        document.getElementById('sendBackBtn').addEventListener('click', () => {
            const activeObj = canvas.getActiveObject();
            if (activeObj) canvas.sendToBack(activeObj);
        });

        function deleteSelected() {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                canvas.discardActiveObject();
                activeObjects.forEach(obj => canvas.remove(obj));
            }
        }
        document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
        document.addEventListener('keydown', e => {
            if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
        });

        let cropper = null;
        let activeImageToCrop = null;
        const cropModal = document.getElementById('cropModal');
        const cropTarget = document.getElementById('cropTarget');

        document.getElementById('cropBtn').addEventListener('click', () => {
            const activeObj = canvas.getActiveObject();
            if (!activeObj || activeObj.type !== 'image') {
                alert('자르기를 할 사진을 먼저 선택해주세요!');
                return;
            }
            activeImageToCrop = activeObj;
            cropTarget.src = activeObj.getSrc(); 
            cropModal.style.display = 'flex';
            
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropTarget, {
                viewMode: 1,
                autoCropArea: 1,
            });
        });

        document.getElementById('cancelCropBtn').addEventListener('click', () => {
            cropModal.style.display = 'none';
            if (cropper) cropper.destroy();
        });

        // 💡 자르기 완료 후에도 캔버스에 맞게 자동 크기 조절
        document.getElementById('applyCropBtn').addEventListener('click', () => {
            if (!cropper) return;
            const croppedCanvas = cropper.getCroppedCanvas();
            const dataUrl = croppedCanvas.toDataURL('image/png');

            activeImageToCrop.setSrc(dataUrl, function() {
                activeImageToCrop.set({ scaleX: 1, scaleY: 1 });
                
                const cWidth = canvas.getWidth();
                const cHeight = canvas.getHeight();
                const maxWidth = cWidth * 0.9;
                const maxHeight = cHeight * 0.9;
                
                let scale = 1;
                if (activeImageToCrop.width > maxWidth || activeImageToCrop.height > maxHeight) {
                    scale = Math.min(maxWidth / activeImageToCrop.width, maxHeight / activeImageToCrop.height);
                }
                
                activeImageToCrop.set({ scaleX: scale, scaleY: scale });
                canvas.renderAll();
                cropModal.style.display = 'none';
                cropper.destroy();
            });
        });

        document.getElementById('saveBtn').addEventListener('click', function() {
            canvas.discardActiveObject(); 
            canvas.renderAll();

            const dataURL = canvas.toDataURL({
                format: 'jpeg',
                quality: 0.9,
                multiplier: 2 
            });

            let mName = document.getElementById('mountainName').value.trim();
            if (mName === '') {
                mName = '이름없음';
            }

            const link = document.createElement('a');
            link.download = mName + '블러그헤더.jpg'; 
            link.href = dataURL;
            link.click();
        });
    </script>

</body>
</html>
