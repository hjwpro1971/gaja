<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다중 이미지 겹치기 및 16:9 캡처</title>
    
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .instructions {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        /* 16:9 캔버스를 감싸는 영역 */
        .canvas-wrapper {
            display: inline-block;
            border: 2px dashed #007bff;
            background-color: #e9ecef;
            margin-bottom: 20px;
            /* 모바일 화면에서도 비율이 유지되도록 처리 가능하지만, 기본적으로 800x450 크기 유지 */
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-save:hover { background-color: #218838; }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-delete:hover { background-color: #c82333; }
        input[type="file"] {
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📷 다중 사진 합성 (16:9 캡처)</h2>
        <p class="instructions">
            1. <strong>여러 장의 사진</strong>을 한 번에 선택하거나 여러 번 업로드할 수 있습니다.<br>
            2. 사진을 클릭하면 나오는 <strong>모서리 점을 드래그해서 크기를 조절</strong>하거나 회전시킬 수 있습니다.<br>
            3. <strong>파란색 점선 네모 박스(16:9 비율)</strong> 안쪽 영역만 최종적으로 캡처됩니다.
        </p>
        
        <div class="controls">
            <!-- multiple 속성을 추가하여 여러 장 동시 선택 가능 -->
            <input type="file" id="uploadImages" accept="image/*" multiple>
            <button id="deleteBtn" class="btn-delete">🗑️ 선택한 사진 지우기</button>
        </div>

        <!-- Fabric.js가 그림을 그릴 16:9 비율의 캔버스 (화면상 800x450) -->
        <div class="canvas-wrapper">
            <canvas id="c" width="800" height="450"></canvas>
        </div>

        <div>
            <button id="saveBtn" class="btn-save">💾 파란색 박스 영역 캡처 및 저장</button>
        </div>
    </div>

    <!-- Fabric.js 라이브러리 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <script>
        // 1. 캔버스 초기화 (크기는 HTML에서 지정한 800x450, 16:9 비율)
        const canvas = new fabric.Canvas('c', {
            backgroundColor: '#ffffff', // 배경색 흰색
            preserveObjectStacking: true // 클릭한 이미지가 항상 맨 위로 오도록 설정
        });

        // 2. 이미지 업로드 이벤트
        document.getElementById('uploadImages').addEventListener('change', function(e) {
            const files = e.target.files;
            
            // 선택된 모든 파일(사진 2~3장 등)을 순회하며 캔버스에 추가
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                
                reader.onload = function(f) {
                    const data = f.target.result;
                    
                    fabric.Image.fromURL(data, function(img) {
                        // 이미지가 너무 크면 캔버스 너비의 절반 정도로 줄여서 표시
                        if (img.width > 400) {
                            img.scaleToWidth(400);
                        }
                        
                        // 이미지가 겹치지 않게 약간씩 위치를 다르게 배치
                        img.set({
                            left: 50 + (i * 30),
                            top: 50 + (i * 30),
                            cornerColor: '#007bff', // 조절점 색상
                            cornerStyle: 'circle',
                            transparentCorners: false
                        });
                        
                        canvas.add(img);
                        canvas.setActiveObject(img); // 방금 추가한 이미지를 선택 상태로 만듦
                    });
                };
                reader.readAsDataURL(file);
            }
            
            // 파일 입력창 초기화 (같은 파일을 다시 올릴 수 있도록)
            e.target.value = '';
        });

        // 3. 선택한 사진 삭제 기능 (버튼 클릭 또는 Delete 키)
        function deleteSelected() {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                canvas.discardActiveObject();
                activeObjects.forEach(function(object) {
                    canvas.remove(object);
                });
            }
        }
        document.getElementById('deleteBtn').addEventListener('click', deleteSelected);
        
        // 키보드 Delete 또는 Backspace 키로도 삭제 가능
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                deleteSelected();
            }
        });

        // 4. 최종 16:9 캡처 및 저장 이벤트
        document.getElementById('saveBtn').addEventListener('click', function() {
            // 저장할 때 이미지 주변의 조절점(네모 박스)이 보이지 않게 선택 해제
            canvas.discardActiveObject();
            canvas.renderAll();

            // 캔버스 영역 추출
            // 화면상으론 800x450 이지만, 저장할 때는 화질을 높이기 위해 multiplier를 2.4로 설정 (1920x1080 출력)
            const dataURL = canvas.toDataURL({
                format: 'jpeg',
                quality: 0.9,
                multiplier: 2.4 
            });

            const link = document.createElement('a');
            link.download = 'collage_16x9_' + new Date().getTime() + '.jpg';
            link.href = dataURL;
            link.click();
        });
    </script>

</body>
</html>
