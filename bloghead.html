<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 이동 및 확대/축소 캡쳐</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .img-container {
            width: 100%;
            height: 50vh;
            background-color: #eee;
            margin-bottom: 20px;
            overflow: hidden;
        }
        img {
            display: block;
            max-width: 100%;
        }
        .toolbar {
            display: none; /* 사진 업로드 전에는 숨김 */
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            margin: 5px;
        }
        .btn:hover { background-color: #0056b3; }
        .btn-save {
            background-color: #28a745;
            font-size: 16px;
            padding: 10px 20px;
            margin-top: 10px;
        }
        .btn-save:hover { background-color: #218838; }
        input[type="file"] { margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📷 사진 구도 맞추기 (16:9)</h2>
        
        <input type="file" id="uploadImage" accept="image/*">

        <!-- 사진 조작 툴바 -->
        <div class="toolbar" id="toolbar">
            <div>
                <button class="btn" id="zoomIn">🔍 확대 (+)</button>
                <button class="btn" id="zoomOut">🔍 축소 (-)</button>
            </div>
            <div>
                <button class="btn" id="moveUp">⬆️ 상</button>
                <button class="btn" id="moveDown">⬇️ 하</button>
                <button class="btn" id="moveLeft">⬅️ 좌</button>
                <button class="btn" id="moveRight">➡️ 우</button>
            </div>
            <button id="cropAndSaveBtn" class="btn btn-save">💾 현재 화면 캡쳐 및 저장</button>
        </div>

        <div class="img-container">
            <img id="image" src="" style="display: none;">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    
    <script>
        let cropper;
        const image = document.getElementById('image');
        const uploadImage = document.getElementById('uploadImage');
        const toolbar = document.getElementById('toolbar');

        // 이미지 업로드
        uploadImage.addEventListener('change', function(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    image.src = event.target.result;
                    image.style.display = 'block';
                    toolbar.style.display = 'block';

                    if (cropper) cropper.destroy();

                    cropper = new Cropper(image, {
                        aspectRatio: 16 / 9,
                        viewMode: 1, 
                        dragMode: 'move', // 마우스 드래그 시 사진이 움직이도록 설정
                        cropBoxMovable: false, // 자르기 영역(액자) 이동 불가 (가운데 고정)
                        cropBoxResizable: false, // 자르기 영역(액자) 크기 조절 불가
                        guides: true,
                        center: true,
                        toggleDragModeOnDblclick: false,
                    });
                };
                reader.readAsDataURL(files[0]);
            }
        });

        // 툴바 버튼 이벤트 (확대/축소)
        document.getElementById('zoomIn').addEventListener('click', () => cropper.zoom(0.1));
        document.getElementById('zoomOut').addEventListener('click', () => cropper.zoom(-0.1));

        // 툴바 버튼 이벤트 (이동: x, y 좌표)
        document.getElementById('moveUp').addEventListener('click', () => cropper.move(0, -10));
        document.getElementById('moveDown').addEventListener('click', () => cropper.move(0, 10));
        document.getElementById('moveLeft').addEventListener('click', () => cropper.move(-10, 0));
        document.getElementById('moveRight').addEventListener('click', () => cropper.move(10, 0));

        // 최종 캡쳐 및 저장
        document.getElementById('cropAndSaveBtn').addEventListener('click', function() {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({
                width: 1920,
                height: 1080,
            });
            if (canvas) {
                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                const link = document.createElement('a');
                link.download = 'captured_' + new Date().getTime() + '.jpg';
                link.href = dataUrl;
                link.click();
            }
        });
    </script>

</body>
</html>
