  <meta name="apple-mobile-web-app-title" id="appleAppTitle" content="아토-가자go">
  <title>아토-가자go</title>
  <script>

    

    

    
    (function() {
      try {
        const ua = navigator.userAgent || '';
        const isInApp = /KAKAOTALK|NAVER|Line\/|FBAN|FBAV|Instagram|Snapchat|Twitter/i.test(ua);
        if (!isInApp) return;

        const isAndroid = /Android/i.test(ua);
        if (isAndroid) {
          if (/KAKAOTALK/i.test(ua)) {
            
            window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(window.location.href);
          } else {
            const target = window.location.href;
            const noScheme = target.replace(/^https?:\/\//, '');
            window.location.href = 'intent://' + noScheme +
              '#Intent;scheme=https;package=com.android.chrome;end';
          }
        } else {
          
          
          window.__gajaShowOpenInBrowserBanner = true;
        }
      } catch(e) {}
    })();


    

    

    
    
    const CACHE_NAME = 'gaja-trail-cache-v215';
    window.__GAJA_CACHE_NAME = CACHE_NAME;

    
    (function() {
      const APP_BUILD = 'v20261004_auto_end_hike_on_arrival';
      try {
        if (localStorage.getItem('gajago_app_build') !== APP_BUILD) {
          localStorage.setItem('gajago_app_build', APP_BUILD);
          if ('caches' in window) {
            caches.keys().then(keys => {
              keys.filter(k => k !== CACHE_NAME).forEach(k => caches.delete(k));
            });
          }
          if (!sessionStorage.getItem('gajago_reloaded_flag')) {
            sessionStorage.setItem('gajago_reloaded_flag', '1');
            window.location.reload();
            return;
          }
        }
      } catch(e) {}
    })();

    (function() {
      try {
        const p = new URLSearchParams(window.location.search);
        let n = p.get('name') || p.get('title');
        let u = p.get('url') || p.get('file');
        if (!n && u) {
          const m = decodeURIComponent(u).match(/([^\/\?#&=:"']+\.gpx)/i);
          if (m && m[1]) {
            n = m[1].replace(/\.gpx$/i, '').replace(/_\d{8}$/, '').replace(/_{2,}/g, ' ').replace(/_/g, ' ').trim();
          }
        }
        if (n) {
          let name = decodeURIComponent(n).trim();
          if (!name.includes('등산지도') && !name.includes('등산로') && !name.includes('지도')) {
            name = name + ' 등산지도';
          }
          document.title = name;
          const meta = document.getElementById('appleAppTitle');
          if (meta) meta.content = name;
        }
      } catch(e) {}
    })();
  </script>

  
  <link rel="stylesheet" href="./leaflet.css">

  <style>

    <button type="button" class="btn-install" id="installBtn" onclick="showInstallGuide()" title="홈 화면에 추가 (v116)" style="flex-shrink: 0;">
      📲<span class="btn-text"> 바로가기</span>

    <button type="button" class="btn-route-list" onclick="showSavedRouteList()" title="저장된 등산로 코스 목록 보기" style="flex-shrink: 0;">

    <button class="sim-speed-btn" onclick="setSimSpeed(5, event)">5x</button>
    <button class="sim-speed-btn" onclick="setSimSpeed(4, event)">4x</button>
    <button class="sim-speed-btn" onclick="setSimSpeed(3, event)">3x</button>
    <button class="sim-speed-btn" onclick="setSimSpeed(2, event)">2x</button>
    <button class="sim-speed-btn active" id="simSpeed1x" onclick="setSimSpeed(1, event)">1x</button>
    <button class="sim-speed-btn" onclick="setSimSpeed(0.5, event)">0.5x</button>

    <button class="fab-btn" id="simPauseBtn" onclick="toggleSimulationPause()" title="일시정지" style="background: rgba(255,255,255,0.9); display: none;">⏸️</button>
  </div>

  const MotionState = Object.freeze({
    MOVING: 'MOVING',
    STOPPING: 'STOPPING',               
    STOPPED: 'STOPPED',
    MOVING_CANDIDATE: 'MOVING_CANDIDATE' 
  });

  class GpsFilterEngine {
    constructor(config = {}) {
      this.config = {
        MAX_ACCURACY: 15.0,      
        MIN_INTERVAL_MS: 400,    
        MIN_DISTANCE: 1.5,       
        
        STOP_SPEED_CUTOFF_KMH: 0.3, 
        MOVE_SPEED_CUTOFF_KMH: 1.0, 
        STOPPING_CONFIRM_MS: 2000,  
        MOVE_CONFIRM_STREAK: 2,     
        BEARING_THRESHOLD: 15.0,
        CLUSTER_WINDOW_SEC: 15,  
        CLUSTER_RADIUS_M: 7.0,   
        ...config
      };
      this.lastConfirmed = null;
      this.totalDistance = 0;
      this.recentPoints = [];
      this.recentSpeeds = [];       
      this.state = MotionState.MOVING;
      this.stoppingEnteredAt = null;      
      this.movingCandidateStreak = 0;     
    }

    
    reset() {
      this.lastConfirmed = null;
      this.totalDistance = 0;
      this.recentPoints = [];
      this.recentSpeeds = [];
      this.state = MotionState.MOVING;
      this.stoppingEnteredAt = null;
      this.movingCandidateStreak = 0;
    }


    forceStopped() {
      this.state = MotionState.STOPPED;
      this.stoppingEnteredAt = null;
      this.movingCandidateStreak = 0;
    }

    
    
    _isTrappedInRadius(latestRaw) {
      const windowStart = latestRaw.timestamp - (this.config.CLUSTER_WINDOW_SEC * 1000);
      this.recentPoints = this.recentPoints.filter(p => p.timestamp >= windowStart);
      this.recentPoints.push({ latitude: latestRaw.latitude, longitude: latestRaw.longitude, timestamp: latestRaw.timestamp });

      if (this.recentPoints.length < 3) return false;
      const timeSpan = (this.recentPoints[this.recentPoints.length - 1].timestamp - this.recentPoints[0].timestamp) / 1000;
      if (timeSpan < this.config.CLUSTER_WINDOW_SEC * 0.8) return false;

      const anchor = this.recentPoints[0];
      return this.recentPoints.every(p => haversineMeters(anchor.latitude, anchor.longitude, p.latitude, p.longitude) <= this.config.CLUSTER_RADIUS_M);
    }

    
    process(raw) {
      
      if (raw.accuracy > this.config.MAX_ACCURACY) return null;
      if (this.lastConfirmed && (raw.timestamp - this.lastConfirmed.timestamp < this.config.MIN_INTERVAL_MS)) {
        return null;
      }

      
      if (!this.lastConfirmed) {
        this.lastConfirmed = { latitude: raw.latitude, longitude: raw.longitude, bearing: null, isStopped: false, timestamp: raw.timestamp };
        return {
          latitude: raw.latitude, longitude: raw.longitude,
          bearing: null, totalDistance: 0, isStopped: false,
          state: this.state, stateChanged: false, timestamp: raw.timestamp
        };
      }

      
      const rawDist = haversineMeters(this.lastConfirmed.latitude, this.lastConfirmed.longitude, raw.latitude, raw.longitude);
      const elapsedSec = Math.max((raw.timestamp - this.lastConfirmed.timestamp) / 1000, 0.001); 
      const calculatedSpeedMps = rawDist / elapsedSec; 
      const calculatedSpeedKmh = calculatedSpeedMps * 3.6; 


      
      
      const isBelowMinDistance = rawDist < this.config.MIN_DISTANCE;

      
      if (!isBelowMinDistance) {
        this.recentSpeeds.push(calculatedSpeedKmh);
        if (this.recentSpeeds.length > 3) {
          this.recentSpeeds.shift();
        }
      }
      const avgSpeedKmh = this.recentSpeeds.length > 0
        ? this.recentSpeeds.reduce((a, b) => a + b, 0) / this.recentSpeeds.length
        : 0;

      
      const isTrapped = this._isTrappedInRadius(raw);

      
      const isWalkingVibration = (typeof walkVibrationLevel !== 'undefined') && (walkVibrationLevel > 0.8);

      const prevState = this.state;

      
      if (this.state === MotionState.MOVING) {
        
        
        if ((calculatedSpeedKmh <= this.config.STOP_SPEED_CUTOFF_KMH || isBelowMinDistance) && !isWalkingVibration) {
          this.state = MotionState.STOPPING;
          this.stoppingEnteredAt = raw.timestamp;
        }
      } else if (this.state === MotionState.STOPPING) {
        
        if (!((calculatedSpeedKmh <= this.config.STOP_SPEED_CUTOFF_KMH || isBelowMinDistance) && !isWalkingVibration)) {
          this.state = MotionState.MOVING;
          this.stoppingEnteredAt = null;
        } else {
          
          
          const stoppingElapsedMs = raw.timestamp - this.stoppingEnteredAt;
          if (stoppingElapsedMs >= this.config.STOPPING_CONFIRM_MS || (isTrapped && !isWalkingVibration)) {
            this.state = MotionState.STOPPED;
            this.stoppingEnteredAt = null;
          }
        }
      } else if (this.state === MotionState.STOPPED) {

        
        
        const highSpeedCount = this.recentSpeeds.filter(s => s >= this.config.MOVE_SPEED_CUTOFF_KMH).length;
        if (isWalkingVibration && !isTrapped) {
          this.state = MotionState.MOVING;
          this.movingCandidateStreak = 0;
        } else if ((avgSpeedKmh >= this.config.MOVE_SPEED_CUTOFF_KMH || highSpeedCount >= 2) && !isTrapped) {
          this.state = MotionState.MOVING_CANDIDATE;
          this.movingCandidateStreak = 1;
        }
      } else if (this.state === MotionState.MOVING_CANDIDATE) {

        const highSpeedCount = this.recentSpeeds.filter(s => s >= this.config.MOVE_SPEED_CUTOFF_KMH).length;
        if (isWalkingVibration && !isTrapped) {
          this.state = MotionState.MOVING;
          this.movingCandidateStreak = 0;
        } else if ((avgSpeedKmh >= this.config.MOVE_SPEED_CUTOFF_KMH || highSpeedCount >= 2) && !isTrapped) {
          this.movingCandidateStreak++;
          if (this.movingCandidateStreak >= this.config.MOVE_CONFIRM_STREAK) {
            this.state = MotionState.MOVING;
            this.movingCandidateStreak = 0;
          }
        } else {
          this.state = MotionState.STOPPED;
          this.movingCandidateStreak = 0;
        }
      }

      const stateChanged = this.state !== prevState;
      
      
      const isStopped = this.state === MotionState.STOPPED;

      if (isStopped) {
        
        this.lastConfirmed = { ...this.lastConfirmed, isStopped: true, timestamp: raw.timestamp };
        return {
          latitude: this.lastConfirmed.latitude, longitude: this.lastConfirmed.longitude,
          bearing: this.lastConfirmed.bearing, totalDistance: this.totalDistance,
          isStopped: true, state: this.state, stateChanged, timestamp: raw.timestamp
        };
      }

      
      
      if (isBelowMinDistance) {
        return {
          latitude: this.lastConfirmed.latitude, longitude: this.lastConfirmed.longitude,
          bearing: this.lastConfirmed.bearing, totalDistance: this.totalDistance,
          isStopped: false, state: this.state, stateChanged, timestamp: raw.timestamp
        };
      }


      
      
      
      const smoothLat = raw.latitude;
      const smoothLon = raw.longitude;


      

      

      const coordinateBearing = calculateBearing(this.lastConfirmed.latitude, this.lastConfirmed.longitude, smoothLat, smoothLon);
      let newBearing;
      
      
      const stopSpeedCutoffMps = this.config.STOP_SPEED_CUTOFF_KMH / 3.6;
      const hasValidHeading = raw.heading !== undefined && raw.heading !== null && !isNaN(raw.heading)
        && raw.speed !== null && raw.speed >= stopSpeedCutoffMps;

      const HEADING_DISAGREEMENT_THRESHOLD = 45.0; 

      if (hasValidHeading) {
        const disagreement = Math.abs(shortestAngleDiff(raw.heading, coordinateBearing));
        if (disagreement >= HEADING_DISAGREEMENT_THRESHOLD) {
          
          
          console.warn(`⚠️ heading 불일치 감지: raw.heading=${raw.heading.toFixed(1)}° vs coordinateBearing=${coordinateBearing.toFixed(1)}° (차이 ${disagreement.toFixed(1)}°) → 좌표계산 채택`);
          newBearing = coordinateBearing;
        } else {
          newBearing = raw.heading;
        }
      } else {
        newBearing = coordinateBearing;
      }


      console.log(`[GPS] speed=${raw.speed} accuracy=${raw.accuracy} rawHeading=${hasValidHeading ? raw.heading.toFixed(1) : 'N/A'} coordBearing=${coordinateBearing.toFixed(1)} chosenBearing=${newBearing.toFixed(1)}`);

      if (this.lastConfirmed.bearing !== null) {
        const bearingDelta = Math.abs(shortestAngleDiff(newBearing, this.lastConfirmed.bearing));
        if (bearingDelta < this.config.BEARING_THRESHOLD) {
          newBearing = this.lastConfirmed.bearing;
        }
      }

      
      const stepDist = haversineMeters(this.lastConfirmed.latitude, this.lastConfirmed.longitude, smoothLat, smoothLon);
      this.totalDistance += stepDist;

      this.lastConfirmed = { latitude: smoothLat, longitude: smoothLon, bearing: newBearing, isStopped: false, timestamp: raw.timestamp };

      return {
        latitude: smoothLat, longitude: smoothLon,
        bearing: newBearing, totalDistance: this.totalDistance,
        isStopped: false, state: this.state, stateChanged, timestamp: raw.timestamp
      };
    }
  }

  const gpsFilterEngine = new GpsFilterEngine();
  

  let map = null;

  let markers = [];

  function calculateBearing(lat1, lon1, lat2, lon2) {
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
              Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
    let brng = Math.atan2(y, x) * 180 / Math.PI;
    return (brng + 360) % 360;
  }

  function shortestAngleDiff(target, current) {

  }

  let walkVibrationLevel = 0;
  window.addEventListener('devicemotion', (e) => {

  let audioCtx = null;

  async function playTwoToneBeep(freqHz) {
    try {

      if (!audioCtx || audioCtx.state === 'closed') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      

      
      
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if (audioCtx.state !== 'running') {
        throw new Error('AudioContext not running after resume (state=' + audioCtx.state + ')');
      }

      [0, 0.35].forEach(delay => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.value = freqHz;
        const t = audioCtx.currentTime + delay;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        osc.start(t);
        osc.stop(t + 0.25);
      });

      
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      } else {
        console.warn('⚠️ 이 기기/브라우저는 진동(vibrate)을 지원하지 않습니다 — 소리와 화면 깜빡임에만 의존합니다.');
      }
    } catch (e) {

      
      console.warn('⚠️ 비프음 재생 실패:', e);
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e2) {}
    }
  }


  

  

  

  let ttsEnabled = true;
  let lastTtsUtterance = '';
  let lastTtsTime = 0;
  function speakGuidance(text) {
    return; 
    if (!ttsEnabled || !('speechSynthesis' in window)) return;

    
    const now = Date.now();

  function haversineMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }


  

  

  function pointToSegmentMeters(plat, plon, alat, alon, blat, blon) {
    const latRef = plat * Math.PI / 180;
    const mPerDegLat = 111320;
    const mPerDegLon = 111320 * Math.cos(latRef);

    const px = (plon - alon) * mPerDegLon;
    const py = (plat - alat) * mPerDegLat;
    const bx = (blon - alon) * mPerDegLon;
    const by = (blat - alat) * mPerDegLat;

    const segLenSq = bx * bx + by * by;
    let t = segLenSq > 0 ? (px * bx + py * by) / segLenSq : 0;
    t = Math.max(0, Math.min(1, t));

    const closestX = bx * t;
    const closestY = by * t;
    const dx = px - closestX;
    const dy = py - closestY;
    return Math.sqrt(dx * dx + dy * dy);
  }


  
  
  
  function pointToSegmentMetersWithT(plat, plon, alat, alon, blat, blon) {
    const latRef = plat * Math.PI / 180;
    const mPerDegLat = 111320;
    const mPerDegLon = 111320 * Math.cos(latRef);

    const px = (plon - alon) * mPerDegLon;
    const py = (plat - alat) * mPerDegLat;
    const bx = (blon - alon) * mPerDegLon;
    const by = (blat - alat) * mPerDegLat;

    const segLenSq = bx * bx + by * by;
    let t = segLenSq > 0 ? (px * bx + py * by) / segLenSq : 0;
    t = Math.max(0, Math.min(1, t));

    const closestX = bx * t;
    const closestY = by * t;
    const dx = px - closestX;
    const dy = py - closestY;
    return { distance: Math.sqrt(dx * dx + dy * dy), t, segLenM: Math.sqrt(segLenSq) };
  }

  function findNearestInRange(lat, lon, points, startIdx, endIdx) {
    let minScore = Infinity; 
    let nearestActualDist = Infinity; 
    let nearestPoint = points[startIdx] || points[0];
    let nearestIdx = startIdx;

    

    

    let rawMinDist = Infinity;
    let rawNearestIdx = startIdx;


    
    for (let i = startIdx; i < endIdx; i++) {
      const a = points[i];
      const b = points[i + 1];

      const d = pointToSegmentMeters(lat, lon, a.lat, a.lon, b.lat, b.lon);

      

      

      

      
      
      
      const RAW_TIE_EPSILON_M = 0.01;
      if (d < rawMinDist + RAW_TIE_EPSILON_M) {
        rawMinDist = Math.min(d, rawMinDist);
        rawNearestIdx = i;
      }

      

      
      
      const score = d;


      
      const SCORE_TIE_EPSILON_M = 0.01;
      if (score < minScore + SCORE_TIE_EPSILON_M) {
        minScore = Math.min(score, minScore);
        nearestActualDist = d;
        nearestIdx = i;
        const dA = haversineMeters(lat, lon, a.lat, a.lon);
        const dB = haversineMeters(lat, lon, b.lat, b.lon);
        nearestPoint = dA <= dB ? a : b;
      }
    }

    return { distance: nearestActualDist, point: nearestPoint, index: nearestIdx, rawIndex: rawNearestIdx };
  }

  function buildMilestones(points, waypoints, cumDistances) {
    if (!points || !points.length) return [];
    const totalDistM = (cumDistances && cumDistances.length) ? cumDistances[cumDistances.length - 1] : 0;
    const list = [];

    

    
    const seen = new Set();

    if (waypoints && waypoints.length > 0) {
      waypoints.forEach(w => {
        const n = (w.name || '').trim();
        if (!n) return;
        const coordKey = w.lat.toFixed(5) + ',' + w.lon.toFixed(5); 
        if (seen.has(coordKey)) return;
        seen.add(coordKey);


        

        

        const WAYPOINT_MATCH_RADIUS_M = 30;
        
        

        let globalMinD = Infinity;
        for (let i = 0; i < points.length - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = pointToSegmentMeters(w.lat, w.lon, a.lat, a.lon, b.lat, b.lon);
          if (d < globalMinD) globalMinD = d;
        }
        
        
        if (globalMinD > 100 && !n.includes('들머리') && !n.includes('날머리')) {
          return;
        }


        

        

        

        

        
        const matchThreshold = WAYPOINT_MATCH_RADIUS_M;

        

        

        
        
        const candidates = [];
        for (let i = 0; i < points.length - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const r = pointToSegmentMetersWithT(w.lat, w.lon, a.lat, a.lon, b.lat, b.lon);
          if (r.distance <= matchThreshold) candidates.push({ idx: i, dist: r.distance, t: r.t, segLenM: r.segLenM });
        }

        

        

        

        

        
        const ROUNDTRIP_CLUSTER_INDEX_GAP = 10; 
        candidates.sort((c1, c2) => c1.idx - c2.idx);
        const clusters = [];
        candidates.forEach(c => {
          const lastCluster = clusters[clusters.length - 1];
          if (lastCluster && (c.idx - lastCluster.lastIdx) <= ROUNDTRIP_CLUSTER_INDEX_GAP) {
            lastCluster.lastIdx = c.idx;
            if (c.dist < lastCluster.best.dist) lastCluster.best = c;
          } else {
            clusters.push({ best: c, lastIdx: c.idx });
          }
        });

        let icon = '📍';
        let color = '#2e7d32';

        

        
        const isPeak = n.endsWith('봉') || n.endsWith('산') || n.includes('정상') || n.includes('최고지점');
        if (n.includes('들머리') || n.includes('출발')) {
          icon = '🚩'; color = '#1976d2';
        } else if (n.includes('날머리') || n.includes('도착')) {
          icon = '🏁'; color = '#d32f2f';
        } else if (isPeak) {
          icon = '⛰️'; color = '#e65100';
        } else if (n.endsWith('재') || n.endsWith('령') || n.endsWith('고개')) {
          icon = '🏔️'; color = '#00838f';
        } else if (n.endsWith('사') || n.endsWith('암') || n.includes('절')) {
          icon = '⛩️'; color = '#c2185b';
        } else if (n.includes('삼거리') || n.includes('사거리') || n.includes('갈림길') || n.includes('분기')) {
          icon = '🔀'; color = '#6a1b9a';
        }


        

        

        

        

        
        let selectedClusters = clusters;
        if (n.includes('들머리') || n.includes('출발')) {
          selectedClusters = clusters.length
            ? [clusters.reduce((a, b) => (cumDistances[a.best.idx] || 0) <= (cumDistances[b.best.idx] || 0) ? a : b)]
            : clusters;
        } else if (n.includes('날머리') || n.includes('도착')) {
          selectedClusters = clusters.length
            ? [clusters.reduce((a, b) => (cumDistances[a.best.idx] || 0) >= (cumDistances[b.best.idx] || 0) ? a : b)]
            : clusters;
        }
        selectedClusters.forEach(cluster => {
          const nearestIdx = cluster.best.idx;
          const t = cluster.best.t || 0;
          const segLenM = cluster.best.segLenM || 0;

          
          const distM = (cumDistances && cumDistances[nearestIdx] !== undefined) ? cumDistances[nearestIdx] + t * segLenM : 0;
          const segA = points[nearestIdx];
          const segB = points[nearestIdx + 1] || segA;
          const trailLat = segA.lat + (segB.lat - segA.lat) * t;
          const trailLon = segA.lon + (segB.lon - segA.lon) * t;
          list.push({
            name: n, lat: w.lat, lon: w.lon, ele: w.ele, distanceM: distM, icon, color,
            trailLat, trailLon, isPeak,
          });
        });
      });
    }

    const hasAnyWaypoint = waypoints && waypoints.length > 0;


    

    const hasPeak = list.some(m => m.name.endsWith('봉') || m.name.endsWith('산') || m.name.includes('정상') || m.name.includes('최고지점'));
    if (!hasPeak) {
      const withEle = points.filter(p => p.ele !== null && !isNaN(p.ele));
      if (withEle.length > 0) {
        const peak = withEle.reduce((a, b) => b.ele > a.ele ? b : a);
        const peakIdx = points.indexOf(peak);
        const peakDistM = (cumDistances && cumDistances[peakIdx] !== undefined) ? cumDistances[peakIdx] : (totalDistM / 2);
        list.push({
          name: `정상 (${Math.round(peak.ele)}m)`,
          lat: peak.lat,
          lon: peak.lon,
          ele: peak.ele,
          distanceM: peakDistM,
          icon: '⛰️',
          color: '#e65100',
          trailLat: peak.lat, 
          trailLon: peak.lon,
          isPeak: true,
        });
      }
    }

    if (!hasAnyWaypoint) {
      
      if (!list.some(m => m.name.includes('들머리') || m.name.includes('출발'))) {

  let currentMilestoneIdx = 0;

  function getCurrentSection() {

  function peekNextSection(section) {
    if (!section) return null;
    const bIdx = currentMilestones.indexOf(section.toMilestone);
    if (bIdx < 0) return null;
    const dir = section.isForward ? 1 : -1;
    let cIdx = bIdx + dir;
    let nextDir = dir;
    if (cIdx < 0 || cIdx >= currentMilestones.length) { nextDir = -dir; cIdx = bIdx + nextDir; }
    const C = currentMilestones[cIdx];
    if (!C) return null;
    return { fromMilestone: section.toMilestone, toMilestone: C, isForward: nextDir > 0 };
  }


  
  function advanceSection(arrivedAtIdx) {
    const wasForward = nextMilestoneIdx > currentMilestoneIdx;
    currentMilestoneIdx = arrivedAtIdx;
    let dir = wasForward ? 1 : -1;
    let next = currentMilestoneIdx + dir;
    if (next < 0 || next >= currentMilestones.length) dir = -dir; 
    nextMilestoneIdx = currentMilestoneIdx + dir;

  function findPointsIndexAtDistance(distances, targetDistM) {
    let idx = 0;
    for (let i = 0; i < distances.length; i++) {

    }
    return idx;

  function getSectionIndexRange(section) {
    const dFrom = section.fromMilestone.distanceM;
    const dTo = section.toMilestone.distanceM;
    const lo = Math.max(0, Math.min(dFrom, dTo) - SECTION_ADVANCE_MARGIN_M);
    const totalDist = cumulativeDistances[cumulativeDistances.length - 1] || 0;
    const hi = Math.min(totalDist, Math.max(dFrom, dTo) + SECTION_ADVANCE_MARGIN_M);
    const idxLo = findPointsIndexAtDistance(cumulativeDistances, lo);
    let idxHi = Math.max(idxLo + 1, findPointsIndexAtDistance(cumulativeDistances, hi));
    while (idxHi < cumulativeDistances.length - 1 && cumulativeDistances[idxHi] < hi) {
      idxHi++;
    }
    return { idxLo, idxHi };
  }


  
  
  
  function projectOntoCurrentSection(lat, lon, section) {
    const { idxLo, idxHi } = getSectionIndexRange(section);
    if (!currentPoints || idxHi <= idxLo) return null;
    let best = null;
    for (let i = idxLo; i < idxHi; i++) {
      const a = currentPoints[i], b = currentPoints[i + 1];
      if (!a || !b) continue;
      const r = pointToSegmentMetersWithT(lat, lon, a.lat, a.lon, b.lat, b.lon);
      if (!best || r.distance < best.distance) best = { ...r, segmentIndex: i };
    }
    if (!best) return null;
    const routeDistance = (cumulativeDistances[best.segmentIndex] || 0) + best.t * best.segLenM;
    const a = currentPoints[best.segmentIndex], b = currentPoints[best.segmentIndex + 1];
    return {
      segmentIndex: best.segmentIndex,
      projectionRatio: best.t,
      projectedLat: a.lat + (b.lat - a.lat) * best.t,
      projectedLon: a.lon + (b.lon - a.lon) * best.t,
      routeDistance,
      distance: best.distance,
    };
  }

    let best = null;
    for (let i = 0; i < currentMilestones.length - 1; i++) {
      const candidateSection = { fromMilestone: currentMilestones[i], toMilestone: currentMilestones[i + 1], isForward: true };
      const proj = projectOntoCurrentSection(lat, lon, candidateSection);
      if (proj && (!best || proj.distance < best.proj.distance)) {
        best = { idx: i, proj };
      }
    }
    if (!best) {
      currentMilestoneIdx = 0;
      nextMilestoneIdx = Math.min(1, currentMilestones.length - 1);
      return;
    }
    currentMilestoneIdx = best.idx;
    nextMilestoneIdx = best.idx + 1;
  }

    if (totalDistM <= 0) return null;
    const lookaheadM = (maxLookaheadM === undefined) ? ROTATION_TARGET_MAX_LOOKAHEAD_M : maxLookaheadM;

    
    const maxLookaheadDistM = isReversing
      ? Math.max(0, originDist - lookaheadM)
      : Math.min(totalDistM, originDist + lookaheadM);

    
    
    let nearestMilestone = null;
    if (currentMilestones && currentMilestones.length > 0) {
      currentMilestones.forEach(m => {
        const isAheadInDirection = isReversing
          ? (m.distanceM < originDist && m.distanceM >= maxLookaheadDistM)
          : (m.distanceM > originDist && m.distanceM <= maxLookaheadDistM);
        if (!isAheadInDirection) return;
        if (!nearestMilestone || Math.abs(m.distanceM - originDist) < Math.abs(nearestMilestone.distanceM - originDist)) {
          nearestMilestone = m;
        }
      });
    }
    if (nearestMilestone) {
      return { name: nearestMilestone.name, distanceM: nearestMilestone.distanceM, lat: nearestMilestone.trailLat, lon: nearestMilestone.trailLon, isMilestone: true };
    }

    
    const pt = pointAtCumulativeDistance(currentPoints, cumulativeDistances, maxLookaheadDistM);
    if (!pt) return null;
    return { name: '@' + lookaheadM + 'm', distanceM: maxLookaheadDistM, lat: pt.lat, lon: pt.lon, isMilestone: false };
  }

      if (source[i].distanceM <= routeDistance) prevM = source[i];
      if (source[i].distanceM > routeDistance) { nextM = source[i]; break; }

  function findNextMilestone(traveledDist, isReversing, graceM) {

    let prevM = source[0];

    for (let i = 0; i < source.length; i++) {

  function computeMovementVectorHeading(prevLat, prevLon, currLat, currLon) {

  function smoothPolylinePoints(points) {
    if (!points || points.length < 3) return (points || []).map(p => [p.lat, p.lon]);

    const SMOOTH_SKIP_DIST_M = 8;   
    const SMOOTH_SEGMENTS = 6;      

    const catmullRom = (p0, p1, p2, p3, t) => {
      const t2 = t * t, t3 = t2 * t;
      return 0.5 * (
        (2 * p1) +
        (-p0 + p2) * t +
        (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
        (-p0 + 3 * p1 - 3 * p2 + p3) * t3
      );
    };

    const result = [];
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? 0 : i - 1];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2 < points.length ? i + 2 : points.length - 1];

      result.push([p1.lat, p1.lon]);

      const segDist = haversineMeters(p1.lat, p1.lon, p2.lat, p2.lon);
      if (segDist < SMOOTH_SKIP_DIST_M) continue; 

      for (let s = 1; s < SMOOTH_SEGMENTS; s++) {
        const t = s / SMOOTH_SEGMENTS;
        const lat = catmullRom(p0.lat, p1.lat, p2.lat, p3.lat, t);
        const lon = catmullRom(p0.lon, p1.lon, p2.lon, p3.lon, t);
        result.push([lat, lon]);
      }
    }
    const last = points[points.length - 1];
    result.push([last.lat, last.lon]);
    return result;
  }


  
  
  function findPointAheadByDistance(points, distances, fromIdx, targetMeters) {
    if (!points || points.length === 0 || fromIdx < 0) return null;
    const fromDist = distances[fromIdx];
    const targetDist = fromDist + targetMeters;

    for (let i = fromIdx; i < points.length - 1; i++) {
      if (distances[i + 1] >= targetDist) {
        
        const segStart = distances[i];
        const segEnd = distances[i + 1];
        const segLen = segEnd - segStart;
        const t = segLen > 0 ? (targetDist - segStart) / segLen : 0;
        return {
          lat: points[i].lat + (points[i+1].lat - points[i].lat) * t,
          lon: points[i].lon + (points[i+1].lon - points[i].lon) * t
        };
      }
    }
    
    return points[points.length - 1];
  }

  function pointAtCumulativeDistanceBehind(points, distances, targetDistM) {

        const segStart = distances[i - 1];
        const segEnd = distances[i];
        const segLen = segEnd - segStart;
        const t = segLen > 0 ? (targetDistM - segStart) / segLen : 0;
        return {
          lat: points[i - 1].lat + (points[i].lat - points[i - 1].lat) * t,
          lon: points[i - 1].lon + (points[i].lon - points[i - 1].lon) * t

      }
    }
    return points[0];
  }

  const GPS_RELIABILITY = { NORMAL: 'NORMAL', SUSPECT: 'SUSPECT', REJECTED: 'REJECTED' };

  
  const GPS_MAX_WALK_SPEED_MPS = 5.0;
  
  
  const GPS_REJECT_SPEED_MULTIPLIER = 3.0;
  
  
  const GPS_SUSPECT_SECTION_DIST_M = 60;
  let lastConfirmedGpsPos = null;

  function classifyGpsReliability(lat, lon, accuracy, timestamp, proj) {

    
    
    if (isGpsReplayMode) return GPS_RELIABILITY.NORMAL;
    if (!lastConfirmedGpsPos) return GPS_RELIABILITY.NORMAL; 

    
    if (timestamp === undefined || timestamp === null) return GPS_RELIABILITY.NORMAL;

    const distFromLast = haversineMeters(lastConfirmedGpsPos.lat, lastConfirmedGpsPos.lon, lat, lon);
    const elapsedSec = Math.max((timestamp - lastConfirmedGpsPos.timestamp) / 1000, 0.001);
    const speedMps = distFromLast / elapsedSec;

    
    const sectionDistSuspect = proj ? proj.distance >= GPS_SUSPECT_SECTION_DIST_M : false;
    const accuracySuspect = (accuracy !== undefined && accuracy !== null && !isNaN(accuracy)) ? accuracy > 30 : false;

    
    
    if (speedMps >= GPS_MAX_WALK_SPEED_MPS * GPS_REJECT_SPEED_MULTIPLIER) {
      return GPS_RELIABILITY.REJECTED;
    }
    if (speedMps >= GPS_MAX_WALK_SPEED_MPS) {
      
      
      return (sectionDistSuspect && accuracySuspect) ? GPS_RELIABILITY.REJECTED : GPS_RELIABILITY.SUSPECT;
    }

    if (sectionDistSuspect && accuracySuspect) {
      return GPS_RELIABILITY.SUSPECT;
    }
    return GPS_RELIABILITY.NORMAL;

  function maybeAdvanceSection(section, proj, reliability) {
    if (!section || !proj) return false;
    const targetDist = section.toMilestone.distanceM;
    const passedForward = section.isForward && proj.routeDistance >= targetDist - SECTION_ADVANCE_MARGIN_M;
    const passedBackward = !section.isForward && proj.routeDistance <= targetDist + SECTION_ADVANCE_MARGIN_M;
    if (!passedForward && !passedBackward) {
      sectionAdvanceConfirmStreak = 0;
      return false;
    }
    if (reliability === GPS_RELIABILITY.REJECTED) {
      return false; 
    }
    if (reliability === GPS_RELIABILITY.SUSPECT) {
      sectionAdvanceConfirmStreak++;
      if (sectionAdvanceConfirmStreak < SECTION_ADVANCE_CONFIRM_STREAK) return false;
    }
    
    sectionAdvanceConfirmStreak = 0;
    const arrivedMilestoneIdx = currentMilestones.findIndex(m => m === section.toMilestone);

  function updateGajaMap(gpsLat, gpsLon, accuracy, timestamp) {

    const reliability = classifyGpsReliability(gpsLat, gpsLon, accuracy, timestamp, proj);
    if (reliability === GPS_RELIABILITY.NORMAL) {
      lastConfirmedGpsPos = { lat: gpsLat, lon: gpsLon, timestamp };

    if (maybeAdvanceSection(section, proj, reliability)) {
      sectionApproachState = null;
      lastAppliedFarBearing = null;
      farDriftStreak = 0;
      lastAppliedFarRouteDistance = null;
      const newSection = getCurrentSection();

      
      if (!newSection) return { section, proj, recentered: false, advanced: true, arrivedMilestone: section.toMilestone, reliability };
      const newProj = projectOntoCurrentSection(gpsLat, gpsLon, newSection);
      if (!newProj) return { section: newSection, proj, recentered: false, advanced: true, arrivedMilestone: section.toMilestone, reliability };
      const coreResult = updateGajaMapCore(newSection, newProj, gpsLat, gpsLon, reliability);
      return Object.assign(coreResult, { advanced: true, arrivedMilestone: section.toMilestone, reliability });

    return Object.assign(updateGajaMapCore(section, proj, gpsLat, gpsLon, reliability), { advanced: false, arrivedMilestone: null, reliability });

    previewLastRotatedRouteDistance = null;

  const PREVIEW_LOOKAHEAD_M = 300;
  function computePreviewBearing(lat, lon, section, proj) {
    const remainingToB = section.isForward
      ? section.toMilestone.distanceM - proj.routeDistance
      : proj.routeDistance - section.toMilestone.distanceM;
    if (remainingToB <= PREVIEW_LOOKAHEAD_M) {
      return calculateBearing(lat, lon, section.toMilestone.trailLat, section.toMilestone.trailLon);
    }
    const targetPt = section.isForward
      ? pointAtCumulativeDistance(currentPoints, cumulativeDistances, proj.routeDistance + PREVIEW_LOOKAHEAD_M)
      : pointAtCumulativeDistanceBehind(currentPoints, cumulativeDistances, proj.routeDistance - PREVIEW_LOOKAHEAD_M);
    return calculateBearing(lat, lon, targetPt.lat, targetPt.lon);
  }

  function updateGajaMapForPreview(lat, lon) {
    const section = getCurrentSection();
    if (!section) return null;
    const proj = projectOntoCurrentSection(lat, lon, section);
    if (!proj) return null;

    const advanced = maybeAdvanceSection(section, proj, GPS_RELIABILITY.NORMAL);
    if (advanced) {
      const arrivedMilestone = section.toMilestone;
      const newSection = getCurrentSection();
      if (!newSection) return { section, proj, recentered: false, advanced: true, arrivedMilestone };
      const newProj = projectOntoCurrentSection(lat, lon, newSection);
      if (!newProj) return { section: newSection, proj, recentered: false, advanced: true, arrivedMilestone };
      
      applySegmentRotation(computePreviewBearing(lat, lon, newSection, newProj));
      previewLastRotatedRouteDistance = newProj.routeDistance;
      return { section: newSection, proj: newProj, recentered: true, advanced: true, arrivedMilestone };
    }


    

    
    
    const PREVIEW_DRIFT_THRESHOLD_DEG = 30;
    const bearing = computePreviewBearing(lat, lon, section, proj);
    const driftDeg = Math.abs(shortestAngleDiff(bearing, mapRotationDeg));

    
    if (previewLastRotatedRouteDistance === null
        || Math.abs(proj.routeDistance - previewLastRotatedRouteDistance) >= PREVIEW_ROTATION_REFRESH_DISTANCE_M
        || driftDeg >= PREVIEW_DRIFT_THRESHOLD_DEG) {
      applySegmentRotation(bearing);
      previewLastRotatedRouteDistance = proj.routeDistance;
      return { section, proj, recentered: true, advanced: false, arrivedMilestone: null };
    }

    return { section, proj, recentered: false, advanced: false, arrivedMilestone: null };
  }

  function updateGajaMapCore(section, proj, gpsLat, gpsLon, reliability) {
    const approach = computeSectionApproachBearing(gpsLat, gpsLon, section, proj);
    if (!approach) return { section, proj, recentered: false };


    

    

    

    const isFirstJudgement = sectionApproachState === null;


    

    
    let driftConfirmed = false;
    if (approach.state === 'far' && !isFirstJudgement && lastAppliedFarBearing !== null) {
      const drift = Math.abs(shortestAngleDiff(approach.bearing, lastAppliedFarBearing));
      if (drift >= FAR_STATE_DRIFT_THRESHOLD_DEG) {
        farDriftStreak++;
        if (farDriftStreak >= FAR_STATE_DRIFT_CONFIRM_STREAK) {
          driftConfirmed = true;
          farDriftStreak = 0;
        }
      } else {
        farDriftStreak = 0;
      }
    } else {
      farDriftStreak = 0;
    }


    

    
    let distanceRefreshDue = false;
    if (approach.state === 'far' && !isFirstJudgement && lastAppliedFarRouteDistance !== null) {
      if (Math.abs(proj.routeDistance - lastAppliedFarRouteDistance) >= getFarStateRefreshDistanceM()) {
        distanceRefreshDue = true;
      }
    }


    
    
    const shouldApply = isFirstJudgement || driftConfirmed || distanceRefreshDue;

    if (!shouldApply) {
      sectionApproachState = approach.state;
      return { section, proj, recentered: false, bearing: approach.bearing };
    }


    

    

    

    

    

    
    
    if (reliability !== undefined && reliability !== GPS_RELIABILITY.NORMAL) {
      return { section, proj, recentered: false, bearing: approach.bearing };
    }

    applySegmentRotation(approach.bearing); 
    sectionApproachState = approach.state; 
    if (approach.state === 'far') {
      lastAppliedFarBearing = approach.bearing;
      lastAppliedFarRouteDistance = proj.routeDistance;
    } else {
      lastAppliedFarRouteDistance = null; 
    }
    return { section, proj, recentered: true, bearing: approach.bearing };
  }

    if (norm >= 15 && norm < 45) return { clock: '1시 방향', arrow: '↗️' };

    if (norm >= 75 && norm < 105) return { clock: '3시 방향 (우회전)', arrow: '➡️' };
    if (norm >= 105 && norm < 135) return { clock: '4시 방향', arrow: '↘️' };
    if (norm >= 135 && norm < 165) return { clock: '5시 방향', arrow: '↘️' };
    if (norm >= 165 && norm < 195) return { clock: '6시 방향 (되돌아가기)', arrow: '⬇️' };
    if (norm >= 195 && norm < 225) return { clock: '7시 방향', arrow: '↙️' };
    if (norm >= 225 && norm < 255) return { clock: '8시 방향', arrow: '↙️' };
    if (norm >= 255 && norm < 285) return { clock: '9시 방향 (좌회전)', arrow: '⬅️' };

  function latLonToTile(lat, lon, zoom) {
    const latRad = lat * Math.PI / 180;
    const n = Math.pow(2, zoom);
    const x = Math.floor((lon + 180) / 360 * n);
    const y = Math.floor((1 - Math.asinh(Math.tan(latRad)) / Math.PI) / 2 * n);
    return { x, y };
  }

  function getTilesForBounds(minLat, maxLat, minLon, maxLon, zoom) {
    const p1 = latLonToTile(maxLat, minLon, zoom);
    const p2 = latLonToTile(minLat, maxLon, zoom);
    const minX = Math.min(p1.x, p2.x);
    const maxX = Math.max(p1.x, p2.x);
    const minY = Math.min(p1.y, p2.y);
    const maxY = Math.max(p1.y, p2.y);

    const tiles = [];
    for (let x = minX; x <= maxX; x++) {
      for (let y = minY; y <= maxY; y++) {
        tiles.push({ z: zoom, x, y });
      }
    }
    return tiles;
  }

  
  function parseGPX(xmlText) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, 'application/xml');
    const trkpts = Array.from(xml.getElementsByTagName('trkpt'));
    if (!trkpts.length) throw new Error('트랙 좌표를 찾을 수 없습니다.');

    const points = trkpts.map(pt => {
      const lat = parseFloat(pt.getAttribute('lat'));
      const lon = parseFloat(pt.getAttribute('lon'));
      const eleEl = pt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      const timeEl = pt.getElementsByTagName('time')[0];
      const time = timeEl ? new Date(timeEl.textContent) : null;
      return { lat, lon, ele, time };
    }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));

    const cleanedPoints = removeGpxSpikes(points);
    const wpts = Array.from(xml.getElementsByTagName('wpt')).map(wpt => {
      const lat = parseFloat(wpt.getAttribute('lat'));
      const lon = parseFloat(wpt.getAttribute('lon'));
      const nameEl = wpt.getElementsByTagName('name')[0];
      const name = nameEl ? nameEl.textContent.trim() : '';
      const eleEl = wpt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      return { lat, lon, name, ele };
    }).filter(w => !isNaN(w.lat) && !isNaN(w.lon) && w.name);
    cleanedPoints.waypoints = wpts;
    return cleanedPoints;
  }


  

  
  
  
  function removeGpxSpikes(points) {
    if (!points || points.length < 3) return points;

    const SPIKE_ANGLE_THRESHOLD = 150; 
    const SPIKE_MAX_AC_DIST_M = 15;    

    const result = [points[0]];
    for (let i = 1; i < points.length - 1; i++) {
      const a = result[result.length - 1];
      const b = points[i];
      const c = points[i + 1];

      const bearingAB = calculateBearing(a.lat, a.lon, b.lat, b.lon);
      const bearingBC = calculateBearing(b.lat, b.lon, c.lat, c.lon);
      const turnAngle = Math.abs(shortestAngleDiff(bearingBC, bearingAB));
      const distAC = haversineMeters(a.lat, a.lon, c.lat, c.lon);

      const isSpike = turnAngle >= SPIKE_ANGLE_THRESHOLD && distAC <= SPIKE_MAX_AC_DIST_M;
      if (isSpike) {
        console.warn(`⚠️ GPX 스파이크 감지 및 제거: 인덱스 ${i}, 꺾인각 ${turnAngle.toFixed(1)}°, A-C거리 ${distAC.toFixed(1)}m`);
        continue; 
      }
      result.push(b);
    }
    result.push(points[points.length - 1]);
    return result;
  }

  function extractGpxFileName(str) {
    if (!str) return '';
    try { str = decodeURIComponent(str); } catch(e) {}
    const m = str.match(/([^\/\?#&=:"']+\.gpx)/i);
    return m ? m[1].toLowerCase().replace(/\.gpx$/i, '').trim() : '';
  }

  function normalizeCourseKey(name, url) {
    const file = extractGpxFileName(url) || extractGpxFileName(name);
    if (file) {
      return file.replace(/[_-\s]+/g, '').toLowerCase();
    }
    if (name) {
      let n = name;
      try { n = decodeURIComponent(n); } catch(e) {}
      return n.replace(/^🚩\s*/, '')
              .replace(/등산지도|등산로|지도/g, '')
              .replace(/[_-\s]+/g, '')
              .toLowerCase()
              .trim();
    }
    return '';
  }

  function isSameRoute(a, b) {
    if (!a || !b) return false;
    if (a.sourceUrl && b.sourceUrl && a.sourceUrl === b.sourceUrl) return true;
    const keyA = normalizeCourseKey(a.name, a.sourceUrl);
    const keyB = normalizeCourseKey(b.name, b.sourceUrl);
    if (keyA && keyB && keyA === keyB) return true;
    return false;
  }

  function loadSavedRoutes() {
    try {
      const raw = localStorage.getItem(SAVED_ROUTES_KEY);
      const list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) return [];

      
      const unique = [];
      list.forEach(item => {
        if (!unique.some(u => isSameRoute(u, item))) {
          unique.push(item);
        }
      });
      let isModified = unique.length !== list.length;
      if (unique.length > MAX_SAVED_ROUTES) {
        unique.length = MAX_SAVED_ROUTES;
        isModified = true;
      }
      
      if (isModified) {
        localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(unique));
        
        if (typeof cleanupEvictedCourseTiles === 'function') {
          cleanupEvictedCourseTiles().catch(() => {});
        }
      }
      return unique;
    } catch(e) { return []; }
  }

  async function cleanupEvictedCourseTiles() {
    if (!('caches' in window)) return;

    let tileStatusMap;
    try {
      const raw = localStorage.getItem(TILES_SAVED_KEY);
      tileStatusMap = raw ? JSON.parse(raw) : {};
    } catch(e) { return; }

    const trackedKeys = Object.keys(tileStatusMap);
    if (trackedKeys.length === 0) return;

    const activeKeys = new Set(
      loadSavedRoutes().map(r => getTileCourseKey(r.name, r.sourceUrl))
    );
    const evictedKeys = trackedKeys.filter(k => !activeKeys.has(k));
    if (evictedKeys.length === 0) return;

    try {
      const cache = await caches.open(TILE_CACHE_NAME);
      for (const key of evictedKeys) {
        const entry = tileStatusMap[key];
        const urls = (entry && entry.tileUrls) || [];
        for (const url of urls) {
          await cache.delete(url).catch(() => {});
        }
        delete tileStatusMap[key];
      }

  let isSavingCache = false;
  async function autoSaveOfflineMap(points, courseKey) {
    if (isSavingCache || !points || !points.length) return;


    

    
    
    let retryOnlyUrls = null;
    if (courseKey) {
      const existing = getTileSaveStatus(courseKey);
      if (existing && existing.status === 'complete') {

        return;
      }
      if (existing && existing.status === 'partial' && existing.failedTileUrls && existing.failedTileUrls.length) {
        retryOnlyUrls = existing.failedTileUrls;
      }
    }

    
    if (navigator.onLine === false) {
      console.log('📡 오프라인 상태 — 타일 다운로드 시도 안 함');
      return;
    }

    isSavingCache = true;

    
    let badge = document.getElementById('offlineAutoBadge');
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'offlineAutoBadge';
      badge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#ffffff; font-size:12px; font-weight:700; padding:8px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.2); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.6s ease;';
      document.body.appendChild(badge);
    }
    badge.style.opacity = '1';
    badge.innerText = '💾 오프라인 등산지도 자동 저장 중... (0%)';

    
    let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
    points.forEach(p => {
      if (p.lat < minLat) minLat = p.lat;
      if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon;
      if (p.lon > maxLon) maxLon = p.lon;
    });

    const centerLat = (minLat + maxLat) / 2;
    const centerLon = (minLon + maxLon) / 2;

    
    const latDistKm = (maxLat - minLat) * 111.0;
    const lonDistKm = (maxLon - minLon) * 111.0 * Math.cos(centerLat * Math.PI / 180);

    
    const maxHalfKm = Math.max(latDistKm, lonDistKm) / 2.0;
    const padKm = 1.6; 
    const radiusKm = maxHalfKm + padKm;

    const dLat = radiusKm / 111.0;
    const dLon = radiusKm / (111.0 * Math.cos(centerLat * Math.PI / 180));

    const symMinLat = centerLat - dLat;
    const symMaxLat = centerLat + dLat;
    const symMinLon = centerLon - dLon;
    const symMaxLon = centerLon + dLon;

    
    const allTileUrls = [];
    for (let z = 13; z <= 17; z++) {
      const tiles = getTilesForBounds(symMinLat, symMaxLat, symMinLon, symMaxLon, z);
      tiles.forEach(t => {
        allTileUrls.push(`https://map.pstatic.net/nrb/styles/terrain/${naverTileVersion}/${t.z}/${t.x}/${t.y}.png`);
      });
    }

    
    const urlsToFetch = retryOnlyUrls || allTileUrls;

    const total = urlsToFetch.length;

    try {
      const cache = await caches.open(TILE_CACHE_NAME);
      await cache.addAll(['./track_viewer.html', './leaflet.js', './leaflet.css']).catch(() => {});

      let completed = 0;
      const stillFailedUrls = [];
      const batchSize = 12;

      

      async function fetchOneTile(url) {
        const match = await cache.match(url);
        if (match) return true;
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const res = await fetch(url, { mode: 'cors' });
            if (res.ok) {
              await cache.put(url, res);
              return true;
            }
          } catch (e) {  }
        }
        return false;
      }
      for (let i = 0; i < urlsToFetch.length; i += batchSize) {
        const batch = urlsToFetch.slice(i, i + batchSize);
        await Promise.all(batch.map(async url => {
          const ok = await fetchOneTile(url);
          if (!ok) stillFailedUrls.push(url);
          completed++;
        }));
        const pct = Math.round((completed / total) * 100);
        badge.innerText = `💾 오프라인 등산지도 자동 저장 중... (${pct}%)`;
      }
      const failedCount = stillFailedUrls.length;

      if (failedCount === 0) {
        badge.innerText = '✅ 오프라인 등산지도 저장 완료! (산속 통신두절 대비)';
        badge.style.background = 'rgba(46,125,50,0.95)';

        if (courseKey) {
          setTileSaveStatus(courseKey, { status: 'complete', savedAt: Date.now(), tileCount: allTileUrls.length, failedCount: 0, tileUrls: allTileUrls });
        }
      } else {
        badge.innerText = `⚠️ 오프라인 저장 완료 (일부 타일 ${failedCount}개 실패 — 오프라인 시 해당 구간 미표시될 수 있음)`;
        badge.style.background = 'rgba(230,81,0,0.95)';

        

        if (courseKey) {
          setTileSaveStatus(courseKey, { status: 'partial', savedAt: Date.now(), tileCount: allTileUrls.length, failedCount, tileUrls: allTileUrls, failedTileUrls: stillFailedUrls });
        }
      }

      cleanupEvictedCourseTiles().catch(() => {});
      setTimeout(() => {
        badge.style.opacity = '0';
        setTimeout(() => badge.remove(), 600);
      }, 3000);
    } catch(err) {
      console.warn('오프라인 캐시 자동 저장 실패:', err);
      badge.remove();
    } finally {
      isSavingCache = false;
    }
  }

    const toast = document.getElementById('gpsToast');
    const distStr = minDistanceM >= 1000 ? (minDistanceM / 1000).toFixed(2) + 'km' : Math.round(minDistanceM) + 'm';

    if (minDistanceM > TRAIL_APPROACH_MAX_M) {

  function updateOffTrailHysteresis(minDistanceM, accuracy, isNearTrailhead) {
    const acc = (accuracy !== undefined && accuracy !== null && !isNaN(accuracy)) ? accuracy : 0;
    
    const slack = Math.max(0, acc - 15);
    const baseEnter = isNearTrailhead ? TRAILHEAD_ENTER_M : OFFTRAIL_BASE_ENTER_M;
    const maxEnter = isNearTrailhead ? TRAILHEAD_MAX_ENTER_M : OFFTRAIL_MAX_ENTER_M;
    const enterThreshold = Math.min(maxEnter, baseEnter + slack);
    const returnThreshold = Math.min(OFFTRAIL_MAX_RETURN_M, OFFTRAIL_BASE_RETURN_M + slack);
    if (!isOffTrailState && minDistanceM > enterThreshold) {
      enterStreakCount++;
      if (enterStreakCount >= ENTER_CONFIRM_STREAK) {
        isOffTrailState = true;
        enterStreakCount = 0;
        returnStreakCount = 0;
      }
    } else if (!isOffTrailState) {

      enterStreakCount = 0;
    } else if (isOffTrailState && minDistanceM < returnThreshold) {
      returnStreakCount++;
      if (returnStreakCount >= RETURN_CONFIRM_STREAK) {
        isOffTrailState = false;
        offTrailStreakCount = 0;
        returnStreakCount = 0;

  }

  function updateTrackDirectionForSim(nearestIdx) {
    if (simLastConfirmedTrackIdx === null) {
      simLastConfirmedTrackIdx = nearestIdx;
      return;
    }
    const rawDelta = nearestIdx - simLastConfirmedTrackIdx;
    simLastConfirmedTrackIdx = nearestIdx;
    if (Math.abs(rawDelta) < MIN_INDEX_DELTA) return;
    const candidate = rawDelta > 0 ? 'forward' : 'backward';
    if (candidate === simTrackDirectionCandidate) {

    } else {

      simTrackDirectionCandidateStreak = 1;

  function nearestPointOnTrailForSim(idx, points) {
    if (!points || points.length === 0) {
      simLastNearestIdx = -1;
      return { distance: 0, point: null, index: -1 };
    }
    const maxIdx = points.length - 2;
    const bestIdx = Math.max(0, Math.min(idx, Math.max(maxIdx, 0)));

    
    
    if (simLastMoveDirectionIdx === null) {
      simLastMoveDirectionIdx = bestIdx;
    } else {
      const delta = bestIdx - simLastMoveDirectionIdx;
      simLastMoveDirectionIdx = bestIdx;
      if (delta !== 0) simMoveDirectionSign = delta > 0 ? 1 : -1;
    }
    simLastNearestIdx = bestIdx;
    return { distance: 0, point: points[bestIdx], index: bestIdx };
  }

    if (!currentPoints || nearestIdx < 0 || !cumulativeDistances || cumulativeDistances.length < 2) return null;
    const dist = (traveledDist !== undefined && traveledDist !== null) ? traveledDist : (cumulativeDistances[nearestIdx] || 0);
    const targetDist = dist + simMoveDirectionSign * ARROW_LOOKAHEAD_M;
    const aheadPt = findPointAheadByDistance(currentPoints, cumulativeDistances, 0, Math.max(0, targetDist));
    if (!aheadPt) return null;

  const SIM_BASE_INTERVAL_MS = 250;


  

  

  

  function startSimInterval() {
    function tick() {
      if (!currentPoints || simIndex >= currentPoints.length) {
        toggleSimulation();
        return;
      }
      renderSimFrame(simIndex, { animate: true, duration: 0.25 });
      updateSimScrubHandle();


      

      let stepDistanceM = 4;
      if (simSpeed === 0.5) stepDistanceM = 2;
      else if (simSpeed === 2) stepDistanceM = 10;
      else if (simSpeed === 3) stepDistanceM = 20;
      else if (simSpeed === 4) stepDistanceM = 40;
      else if (simSpeed === 5) stepDistanceM = 80;


      

      
      
      
      const SIM_DECEL_START_M = 60;
      const SIM_DECEL_SLOW_M = 50;
      const SIM_SLOW_STEP_M = 2; 
      let decelSpeedRatio = 1; 
      if (currentMilestones && currentMilestones.length >= 2) {
        const traveledDist = cumulativeDistances[simIndex] || 0;
        const milestoneResult = findNextMilestone(traveledDist, isReversingOnTrail);
        if (milestoneResult) {
          const distToNext = isReversingOnTrail
            ? Math.max(0, traveledDist - milestoneResult.nextM.distanceM)
            : Math.max(0, milestoneResult.nextM.distanceM - traveledDist);
          const slowStepDistanceM = Math.max(SIM_SLOW_STEP_M, stepDistanceM); 
          let targetStepDistanceM = stepDistanceM;
          if (distToNext <= SIM_DECEL_SLOW_M) {
            targetStepDistanceM = SIM_SLOW_STEP_M;
          } else if (distToNext <= SIM_DECEL_START_M) {
            
            const decelRatio = (distToNext - SIM_DECEL_SLOW_M) / (SIM_DECEL_START_M - SIM_DECEL_SLOW_M);
            targetStepDistanceM = SIM_SLOW_STEP_M + (stepDistanceM - SIM_SLOW_STEP_M) * decelRatio;
          }

          
          decelSpeedRatio = stepDistanceM / Math.max(targetStepDistanceM, 0.001);
        }
      }

      let nextIndex = simIndex + 1;
      const startDist = cumulativeDistances[simIndex] || 0;
      while (nextIndex < currentPoints.length) {
        const currentDist = cumulativeDistances[nextIndex] || 0;
        if (currentDist - startDist >= stepDistanceM) break;
        nextIndex++;
      }
      simIndex = nextIndex;


      
      
      const SIM_MAX_DELAY_MS = 1500;
      const delayMs = Math.min(SIM_BASE_INTERVAL_MS * decelSpeedRatio, SIM_MAX_DELAY_MS);
      simInterval = setTimeout(tick, delayMs);
    }
    simInterval = setTimeout(tick, SIM_BASE_INTERVAL_MS);
  }

  async function updatePoiProximity(lat, lon) {
    const signs = await fetchCoursePoiSignposts();
    if (!signs || signs.length === 0) return;

    
    
    if (_activeProximityPoi) {
      const d = haversineMeters(lat, lon, _activeProximityPoi.lat, _activeProximityPoi.lon);
      if (d > POI_PROXIMITY_EXIT_M) {
        hidePoiProximityModalOnExit();
      } else {
        return; 
      }
    }

    
    
    let nearest = null, nearestD = Infinity;
    for (const s of signs) {
      const d = haversineMeters(lat, lon, s.lat, s.lon);
      if (d <= POI_PROXIMITY_ENTER_M && d < nearestD) {
        nearest = s; nearestD = d;
      }
    }
    if (!nearest) return;

    const key = nearest.id != null ? String(nearest.id) : (nearest.lat + ',' + nearest.lon);
    if (key === _poiModalManuallyDismissedKey) return; 

    _activeProximityPoi = nearest;
    showPoiProximityModal(nearest);
  }

  const SLEEP_WATCHDOG_CHECK_MS = 8000;

  function runSleepWatchdogCheck() {
    if (!isGpsSleeping) return; 
    sleepCheckPos = null;
    sleepCheckStartedAt = Date.now();

    const checkWatchId = navigator.geolocation.watchPosition(
      pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (!sleepCheckPos) {
          sleepCheckPos = { lat, lon };
          return;
        }
        const movedM = haversineMeters(sleepCheckPos.lat, sleepCheckPos.lon, lat, lon);
        if (movedM >= SLEEP_WATCHDOG_MOVE_THRESHOLD_M) {
          navigator.geolocation.clearWatch(checkWatchId);
          exitGpsSleep('watchdog 이동 확인');
        }
      },
      () => {  },
      { enableHighAccuracy: true, maximumAge: 0, timeout: SLEEP_WATCHDOG_CHECK_MS }
    );

    
    
    setTimeout(() => {
      if (isGpsSleeping) {
        navigator.geolocation.clearWatch(checkWatchId);
      }
    }, SLEEP_WATCHDOG_CHECK_MS + 500);
  }

  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();

    } finally {
      clearTimeout(timer);

  async function fetchGPXFile(targetUrl) {
    let cleanUrl = targetUrl.trim();
    
    for (let i = 0; i < 3; i++) {
      try {
        const next = decodeURIComponent(cleanUrl);
        if (next === cleanUrl) break;
        cleanUrl = next;
      } catch(e) { break; }
    }
    try {
      cleanUrl = encodeURI(cleanUrl);
    } catch(e) {}

    const errors = [];

    
    try {
      const res = await fetchWithTimeout(cleanUrl, 5000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`1) 직접 다운로드: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`1) 직접 다운로드 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`1) 직접 다운로드 실패: ${e.message || '네트워크/CORS 제한'}`);
    }

    
    
    try {
      const match = cleanUrl.match(/([^\/\?#&=:"']+\.gpx)/i);
      if (match && match[1]) {
        let fname = match[1];
        try { fname = decodeURIComponent(fname); } catch(e) {}
        const fallbacks = [
          `./tracks/${encodeURIComponent(fname)}`,
          `https://hjwpro1971.github.io/gaja/tracks/${encodeURIComponent(fname)}`,
          `https://raw.githubusercontent.com/hjwpro1971/gaja/main/tracks/${encodeURIComponent(fname)}`
        ];
        for (const fb of fallbacks) {
          try {
            const res = await fetchWithTimeout(fb, 5000);
            if (res.ok) {
              const text = await res.text();
              if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
                console.log('대체 트랙 저장소에서 복구 성공:', fb);
                return text;
              }
            }
          } catch(e) {}
        }
        errors.push(`2) 저장소 대체 복구: '${fname}' 파일 없음`);
      } else {
        errors.push(`2) 저장소 대체 복구: 파일명 추출 불가`);
      }
    } catch(e) {
      errors.push(`2) 저장소 대체 복구 실패: ${e.message}`);
    }

    
    try {
      const res = await fetchWithTimeout('https://api.allorigins.win/raw?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`3) 공개 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`3) 공개 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`3) 공개 프록시 실패: ${e.message || '타임아웃'}`);
    }

    
    try {
      const res = await fetchWithTimeout('/api/gpx-proxy?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`4) 로컬 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`4) 로컬 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`4) 로컬 프록시 실패: ${e.message || '연결 불가'}`);
    }

    throw new Error('모든 방식으로 등산로 파일을 불러오지 못했습니다.\n[상세 사유]\n' + errors.join('\n'));
  }

      const loadingEl = document.createElement('div');
      loadingEl.id = 'gpxLoadingBadge';
      loadingEl.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.25); backdrop-filter:blur(4px); pointer-events:none;';
      loadingEl.innerText = '🔄 등산 코스 불러오는 중...';
      document.body.appendChild(loadingEl);

      try {
        
        const xml = await fetchGPXFile(gpxUrl);
        const points = parseGPX(xml);
        drawRoute(points, decodedCourseName, gpxUrl);
      } catch(err) {
        console.warn('원격 GPX 다운로드 실패. 오프라인 캐시 폴백 시도:', err);
        
        const cached = findSavedRoute(decodedCourseName, gpxUrl);
        if (cached) {
          console.log('오프라인 캐시에서 등산로 복원 완료:', cached.name);
          if (cached.waypoints) cached.points.waypoints = cached.waypoints;
          drawRoute(cached.points, cached.name, cached.sourceUrl || gpxUrl, true);
          
          const fastBadge = document.createElement('div');
          fastBadge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:99999; background:rgba(27,94,32,0.95); color:#ffffff; font-size:13px; font-weight:800; padding:10px 20px; border-radius:24px; box-shadow:0 4px 16px rgba(0,0,0,0.3); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.5s;';
          fastBadge.innerHTML = '⚡ 오프라인 저장된 코스를 열었습니다';
          document.body.appendChild(fastBadge);
          setTimeout(() => {
            fastBadge.style.opacity = '0';
            setTimeout(() => fastBadge.remove(), 500);
          }, 1800);
        } else {
          alert('등산로를 불러오지 못했습니다.\n\n인터넷 연결을 확인하고 다시 시도해 주세요.\n(또는 내 코스 목록에서 열어보세요)');
          showSavedRouteList('저장된 GPX 목록을 불러왔습니다.');
        }
      } finally {
        const badge = document.getElementById('gpxLoadingBadge');
        if (badge) badge.remove();
      }

      

    } else if (!hadGpxUrl) {
      showSavedRouteList();
    }


  });
</script>

</body>
</html>
