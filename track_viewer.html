            clusters.push({ best: c, lastDist: cDist });
          }
        });

        let icon = '📍';
        let color = '#2e7d32';
        if (n.includes('들머리') || n.includes('출발')) {
          icon = '🚩'; color = '#1976d2';
        } else if (n.includes('날머리') || n.includes('도착')) {
          icon = '🏁'; color = '#d32f2f';
        } else if (n.endsWith('봉') || n.endsWith('산') || n.includes('정상') || n.includes('최고지점')) {
          icon = '⛰️'; color = '#e65100';
        } else if (n.endsWith('재') || n.endsWith('령') || n.endsWith('고개')) {
          icon = '🏔️'; color = '#00838f';
        } else if (n.endsWith('사') || n.endsWith('암') || n.includes('절')) {
          icon = '⛩️'; color = '#c2185b';
        } else if (n.includes('삼거리') || n.includes('사거리') || n.includes('갈림길') || n.includes('분기')) {
          icon = '🔀'; color = '#6a1b9a';
        }

        // 방향 안내(하단 화살표/텍스트)는 웨이포인트의 원본 좌표가 아니라
        // 트랙에 매칭된 좌표(trailLat/trailLon)를 써야 한다 — 웨이포인트가
        // 실제 등산로에서 떨어진 지점(정상석, 전망대 등)이면 원본 좌표로
        // 직선 방향을 계산했을 때 실제 등산로 진행 방향과 다른 방향을
        // 가리킬 수 있다. name/거리 표시용 lat/lon은 원본을 유지하되,
        // 방향 계산 전용 필드를 별도로 둔다.
        clusters.forEach(cluster => {
          const nearestIdx = cluster.best.idx;
          const distM = (cumDistances && cumDistances[nearestIdx] !== undefined) ? cumDistances[nearestIdx] : 0;
          const trailPt = points[nearestIdx];
          list.push({
            name: n, lat: w.lat, lon: w.lon, ele: w.ele, distanceM: distM, icon, color,
            trailLat: trailPt.lat, trailLon: trailPt.lon,
          });
        });
      });
    }

    const hasAnyWaypoint = waypoints && waypoints.length > 0;

    // 최고지점(정상) 자동 감지 — 예전엔 웨이포인트가 아예 없는 GPX에서만
    // 동작했는데, 웨이포인트는 있지만(예: 들머리/갈림길만 찍혀있고)
    // "정상"이 빠진 왕복 코스가 실제로 있었다. 왕복 코스에서 정상은
    // U턴 지점이라 turnAngle이 180도(급회전)로 계산되어야 "여기서
    // 되돌아가세요" 화살표가 뜨는데, 마일스톤 자체가 없으면 애초에
    // turnAngle 계산 대상에서 빠진다 — 웨이포인트 유무와 무관하게
    // "정상" 계열 이름이 하나도 없으면 항상 자동 보완한다.
    const hasPeak = list.some(m => m.name.endsWith('봉') || m.name.endsWith('산') || m.name.includes('정상') || m.name.includes('최고지점'));
    if (!hasPeak) {
      const withEle = points.filter(p => p.ele !== null && !isNaN(p.ele));
      if (withEle.length > 0) {
        const peak = withEle.reduce((a, b) => b.ele > a.ele ? b : a);
        const peakIdx = points.indexOf(peak);
        const peakDistM = (cumDistances && cumDistances[peakIdx] !== undefined) ? cumDistances[peakIdx] : (totalDistM / 2);
        list.push({
          name: `정상 (${Math.round(peak.ele)}m)`,
          lat: peak.lat,
          lon: peak.lon,
          ele: peak.ele,
          distanceM: peakDistM,
          icon: '⛰️',
          color: '#e65100',
          trailLat: peak.lat, // 트랙 자체의 점이라 원본 좌표가 곧 트랙 좌표
          trailLon: peak.lon,
        });
      }
    }

    if (!hasAnyWaypoint) {
      // 들머리 / 날머리가 없으면 기본 추가
      if (!list.some(m => m.name.includes('들머리') || m.name.includes('출발'))) {
        const startPt = points[0];
        list.push({ name: '들머리', lat: startPt.lat, lon: startPt.lon, distanceM: 0, icon: '🚩', color: '#1976d2', trailLat: startPt.lat, trailLon: startPt.lon });
      }
      if (!list.some(m => m.name.includes('날머리') || m.name.includes('도착'))) {
        const endPt = points[points.length - 1];
        list.push({ name: '날머리', lat: endPt.lat, lon: endPt.lon, distanceM: totalDistM, icon: '🏁', color: '#d32f2f', trailLat: endPt.lat, trailLon: endPt.lon });
      }
    }
    
    // 원점회귀 처리: 기존에 웨이포인트로 들어있든, 방금 자동으로 추가되었든
    // 들머리와 날머리가 50m 이내로 매우 가깝다면 하나로 합쳐서 화면 겹침 방지
    const startM = list.find(m => m.name.includes('들머리') || m.name.includes('출발'));
    const endM = list.find(m => m.name.includes('날머리') || m.name.includes('도착'));
    
    if (startM && endM && startM !== endM) {
      const dist = haversineMeters(startM.lat, startM.lon, endM.lat, endM.lon);
      if (dist < 50) {
        startM.name = '들·날머리 (원점회귀)';
        startM.icon = '🔄';
        startM.color = '#7b1fa2'; // 겹침 방지용 보라색 통합 마커
        
        // 날머리를 리스트에서 빼버리면 끝 지점 길안내가 마비되므로, 
        // 화면에서 마커(아이콘)만 겹치지 않게 숨김 처리한다.
        endM.hideMarker = true;
      }
    }

    list.sort((a, b) => a.distanceM - b.distanceM);

    // ⭐ 전면 재설계(2026-09-14): "미리 안내" 방식 — GPX가 경로 전체를
    // 이미 알고 있으므로, 이 갈림길에서 "들어오는 방향"과 "나가는 방향"
    // 이 이루는 회전각(turnAngle)을 지금(코스 로드 시점) 미리 계산해
    // 저장해둔다. 실시간으로는 "내가 지금 보는 방향"을 나침반/GPS로
    // 알아낼 필요가 전혀 없다 — 실제 내비게이션 앱(카카오내비 등)처럼
    // "이 지점은 원래 좌회전/우회전/직진"이라는 사실 자체가 좌표만으로
    // 고정되어 있기 때문이다. GPS는 "내가 이 지점에 얼마나 가까워졌나"
    // 판정에만 쓰인다.
    const TURN_LOOKBACK_M = 15;  // 진입 방향 계산에 쓸 "갈림길 이전 지점" 거리
    const TURN_LOOKAHEAD_M = 15; // 이탈 방향 계산에 쓸 "갈림길 이후 지점" 거리
    // 짧은 코스에서는 갈림길이 들머리/날머리에서 15m 이내로 가까운 경우가
    // 흔한데, 예전엔 이럴 때 회전각 계산을 통째로 포기(null)해 실제
    // 갈림길인데도 안내가 전혀 안 뜨는 결함이 있었다. behindDistM/
    // aheadDistM을 코스 경계(0~totalDistM) 안에서 가능한 만큼만이라도
    // 확보되면 계산을 시도하도록 완화한다 — lookback/lookahead 거리가
    // 15m보다 짧아져도(예: 갈림길이 들머리에서 8m 지점이면 8m만 사용)
    // 방향 자체는 여전히 유효하게 구할 수 있다. 진짜로 방향을 구할 수
    // 없는 경우(들머리/날머리 그 자체, 즉 behind/ahead 거리가 0)만 null.
    list.forEach(m => {
      const behindDistM = Math.max(0, m.distanceM - TURN_LOOKBACK_M);
      const aheadDistM = Math.min(totalDistM, m.distanceM + TURN_LOOKAHEAD_M);
      const behindPt = pointAtCumulativeDistance(points, cumDistances, behindDistM);
      const aheadPt = pointAtCumulativeDistance(points, cumDistances, aheadDistM);
      if (behindPt && aheadPt && (behindDistM < m.distanceM) && (aheadDistM > m.distanceM)) {
        const inBearing = calculateBearing(behindPt.lat, behindPt.lon, m.trailLat, m.trailLon);
        const outBearing = calculateBearing(m.trailLat, m.trailLon, aheadPt.lat, aheadPt.lon);
        m.turnAngle = shortestAngleDiff(outBearing, inBearing); // -180~180, 양수=우회전, 음수=좌회전
        m.turnLabel = classifyTurnAngle(m.turnAngle);
      } else {
        // 들머리/날머리 그 자체(behind==distanceM 또는 ahead==distanceM,
        // 즉 코스 맨 끝이라 진입/이탈 방향 중 하나가 아예 없음)만 계산 불가.
        m.turnAngle = null;
        m.turnLabel = null;
      }
    });

    return list;
  }

  // 회전각(도, 양수=우회전/음수=좌회전)을 사람이 읽는 안내 문구로 변환.
  // 직진(5도 미만)만 별도 안내가 필요 없으므로 갈림길 알람 대상에서
  // 자연히 제외된다(showUpcomingTurnAlert에서 turnLabel==='직진'이면
  // 스킵) — 예전엔 30도 문턱이라 완만하게 벌어지는 갈림길(Y자형 등)이
  // "직진"으로 분류돼 조용히 넘어갔는데, 실제로는 반대쪽 갈래로 잘못
  // 들어서기 쉬운 지점이라 안내가 필요했다.
  function classifyTurnAngle(angle) {
    const abs = Math.abs(angle);
    if (abs < 5) return '직진';
    if (angle > 0) return abs >= 120 ? '급우회전' : (abs >= 30 ? '우회전' : '약간우회전');
    return abs >= 120 ? '급좌회전' : (abs >= 30 ? '좌회전' : '약간좌회전');
  }

  // 현재 위치(누적거리 기준 traveledDist)를 기준으로 "다음 마일스톤"과
  // "직전 마일스톤"을 찾는다. updateNavigationToast의 기존 로직과
  // 동일한 15m 여유값을 그대로 써서, 이동 중 구간 재정렬이 화면에 보이는
  // 텍스트 안내("갈림길1 → 갈림길2")와 항상 같은 목적지를 가리키도록
  // 통일한다.
  // isReversing=true면 "코스를 거꾸로(날머리 쪽에서 들머리 쪽으로) 걷는
  // 중"이라는 뜻 — 원점회귀/왕복 코스에서 정상까지 갔다가 같은 길로
  // 되돌아올 때 실제로 벌어지는 상황이다. 이때는 traveledDist 기준
  // "코스 순서상 다음"이 아니라 "코스 순서상 이전" 마일스톤이 사용자가
  // 실제로 다음에 만날 갈림길이므로, prevM/nextM을 뒤바꿔 반환한다.
  function findNextMilestone(traveledDist, isReversing) {
    if (!currentMilestones || currentMilestones.length < 2) return null;
    let prevM = currentMilestones[0];
    let nextM = currentMilestones[currentMilestones.length - 1];
    for (let i = 0; i < currentMilestones.length; i++) {
      if (currentMilestones[i].distanceM <= traveledDist + 15) {
        prevM = currentMilestones[i];
      }
      if (currentMilestones[i].distanceM > traveledDist + 15) {
        nextM = currentMilestones[i];
        break;
      }
    }
    if (isReversing) {
      // 코스 순서상 "이전" 마일스톤(prevM)이 되돌아가는 방향으로는
      // "다음" 목표가 된다 — 그 지점의 turnAngle도 진입/이탈 방향이
      // 뒤바뀌므로 화면 표시 시점에 180도 반전해서 써야 한다(호출부
      // showUpcomingTurnAlert 쪽에서 처리).
      return { prevM: nextM, nextM: prevM };
    }
    return { prevM, nextM };
  }

  function buildCumulativeDistances(points) {
    const dists = [0];
    for (let i = 1; i < points.length; i++) {
      const d = haversineMeters(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon);
      dists.push(dists[i-1] + d);
    }
    return dists;
  }

  // 지그재그(헤어핀) 구간 오안내 방지용 전방 지점 탐색.
  // "다음 N번째 인덱스"가 아니라 "궤적을 따라 실제로 targetMeters만큼
  // 앞선 좌표"를 찾는다. 인덱스 기준으로는 GPX 점 간격에 따라 5m 앞일
  // 수도 200m 앞일 수도 있고, 급하게 꺾이는 구간에서는 산 반대편 궤적을
  // 가리킬 수 있다 — 누적거리 기준이면 이 문제가 없다.
  function findPointAheadByDistance(points, distances, fromIdx, targetMeters) {
    if (!points || points.length === 0 || fromIdx < 0) return null;
    const fromDist = distances[fromIdx];
    const targetDist = fromDist + targetMeters;

    for (let i = fromIdx; i < points.length - 1; i++) {
      if (distances[i + 1] >= targetDist) {
        // i와 i+1 사이 어딘가 — 선형 보간으로 정확한 지점을 만든다.
        const segStart = distances[i];
        const segEnd = distances[i + 1];
        const segLen = segEnd - segStart;
        const t = segLen > 0 ? (targetDist - segStart) / segLen : 0;
        return {
          lat: points[i].lat + (points[i+1].lat - points[i].lat) * t,
          lon: points[i].lon + (points[i+1].lon - points[i].lon) * t
        };
      }
    }
    // 코스 끝까지 targetMeters가 안 나오면 마지막 점을 반환 (거의 다 왔다는 뜻)
    return points[points.length - 1];
  }

  // 누적거리 기준 절대 위치(코스 시작점부터 targetDistM 지점)의 좌표를 구한다.
  // findPointAheadByDistance(fromIdx=0, targetMeters=targetDistM)와 동일하지만,
  // "현재 위치에서 앞으로 N미터"가 아니라 "코스 시작부터 N미터 지점"이라는
  // 의도를 명확히 하기 위해 별도 이름으로 감싼다 — 이동 중 구간 재정렬의
  // 구간 시작/끝 좌표를 구할 때 쓴다.
  function pointAtCumulativeDistance(points, distances, targetDistM) {
    return findPointAheadByDistance(points, distances, 0, targetDistM);
  }

  // 🧭 구간(prevM→nextM) 진행방향 계산 — GPX 좌표만 사용, 센서 없음.
  // trailLat/trailLon은 buildMilestones가 이미 트랙에 매칭해둔 좌표라
  // 원본 웨이포인트 좌표(예: 전망대처럼 트랙에서 벗어난 지점)의 왜곡이 없다.
  // 두 마일스톤이 너무 가까우면(30m 미만) 직선 방향이 GPS 오차에 취약해
  // 흔들릴 수 있으므로, nextM 지점에서 15m 더 앞선 지점을 대신 쓴다.
  function computeSegmentHeading(prevM, nextM) {
    if (!prevM || !nextM) return null;
    const segLen = nextM.distanceM - prevM.distanceM;
    if (segLen < 30) {
      const ahead = pointAtCumulativeDistance(currentPoints, cumulativeDistances, nextM.distanceM + 15);
      if (ahead) return calculateBearing(prevM.trailLat, prevM.trailLon, ahead.lat, ahead.lon);
    }
    return calculateBearing(prevM.trailLat, prevM.trailLon, nextM.trailLat, nextM.trailLon);
  }

  // 출발 좌표(lat, lon)에서 방위각(bearingDeg)으로 distanceM미터 이동한
  // 지점의 좌표를 구한다 — calculateBearing의 역연산. 지도 중심을 내
  // 위치에서 살짝 뒤로 오프셋시킬 때 사용한다.
  function destinationPoint(lat, lon, bearingDeg, distanceM) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
    const brng = toRad(bearingDeg);
    const lat1 = toRad(lat), lon1 = toRad(lon);
    const angDist = distanceM / R;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(angDist) + Math.cos(lat1) * Math.sin(angDist) * Math.cos(brng));
    const lon2 = lon1 + Math.atan2(
      Math.sin(brng) * Math.sin(angDist) * Math.cos(lat1),
      Math.cos(angDist) - Math.sin(lat1) * Math.sin(lat2)
    );
    return { lat: toDeg(lat2), lon: ((toDeg(lon2) + 540) % 360) - 180 };
  }

  // 🧭 구간회전 모드에서 "내 위치는 화면 하단(30~40% 지점)에 고정되고,
  // 그 위쪽(화면 대부분)에 앞으로 가야 할 경로가 넓게 보이는" 실제
  // 내비게이션 앱 표준 배치를 만든다. 지도 중심(=Leaflet이 항상 화면
  // 정중앙에 놓는 좌표)을 내 위치 그대로 쓰면 내 위치가 화면 정중앙에
  // 와버린다 — 내 위치를 화면 정중앙보다 아래(하단)로 밀어내려면,
  // 반대로 "지도 중심 자체"를 내 위치보다 앞쪽(진행방향)으로 옮겨야
  // 한다. 지도가 mapRotationDeg를 화면 위쪽으로 향하도록 회전되어
  // 있으므로, 화면상 "위쪽(앞쪽/진행방향)"은 실제 좌표계에서
  // mapRotationDeg 방향 그대로다 — 그 방향으로 이동한 지점을 지도
  // 중심으로 삼으면, 내 위치는 상대적으로 화면 중앙보다 아래(하단)에
  // 오게 된다.
  // OFFSET_RATIO는 "현재 줌에서 화면 세로 절반 거리 대비 오프셋 비율".
  // 값이 클수록 내 위치가 화면 더 아래쪽으로 내려간다 — 0.35는 내
  // 위치를 화면 하단 약 30~35% 지점에 두도록 실측 튜닝한 값.
  const MAP_CENTER_OFFSET_RATIO = 0.35;
  function computeMapCenterForOffset(lat, lon, zoom) {
    if (!isSegmentRotationMode) return { lat, lon };
    // 줌 레벨에서 화면 세로 절반(픽셀)에 해당하는 지상거리(미터)를
    // 추정 — Web Mercator 근사식: 미터/픽셀 = 156543.03392 * cos(lat) / 2^zoom.
    const metersPerPixel = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
    const screenHalfHeightPx = (typeof window !== 'undefined' && window.innerHeight) ? window.innerHeight / 2 : 400;
    const offsetM = screenHalfHeightPx * metersPerPixel * MAP_CENTER_OFFSET_RATIO;
    return destinationPoint(lat, lon, mapRotationDeg, offsetM);
  }

  // 지도(#map)를 bearingDeg가 화면 위쪽을 향하도록 CSS 회전시킨다.
  // 부호는 이 함수 한 곳에서만 결정한다 — #map은 항상 rotate(-mapRotationDeg)로
  // 걸리고, 드래그 보정(rotateDragDelta)과 내 위치 화살표 보정
  // (handleGpsPositionUpdate 내부)은 이 mapRotationDeg 값을 참조만 할 뿐
  // 부호를 다시 결정하지 않는다("반전 후 다시 반전"하는 이중 계산을 피하기
  // 위해 과거 구현(커밋 4305106 이전)이 명시했던 원칙을 그대로 따른다).
  // CSS의 rotate()는 "최단 경로"라는 개념이 없다 — 이전 값이 -10deg이고
  // 새 값이 -350deg면, 실제로는 반대방향으로 20도만 돌면 되는데도
  // 브라우저는 산술적으로 340도를 그대로 돌아버린다(구간이 바뀔 때마다
  // 거의 한 바퀴씩 회전하는 것처럼 보였던 원인). CSS에 대입하는 각도
  // 자체를 "누적값"으로 관리해, 매번 이전 각도에서 최단 경로(-180~180
  // 범위 내 차이)만큼만 더해지도록 한다.
  let appliedMapRotationDeg = 0; // CSS에 실제로 대입해온 누적 회전값(360도 넘게 쌓일 수 있음)
  function applySegmentRotation(bearingDeg) {
    const mapEl = document.getElementById('map');
    if (!mapEl || bearingDeg === null || isNaN(bearingDeg)) return;
    const delta = shortestAngleDiff(bearingDeg, mapRotationDeg);
    appliedMapRotationDeg += delta; // 이전 CSS값 기준 최단 경로만큼만 누적
    mapEl.style.transform = `translate(-50%, -50%) rotate(${-appliedMapRotationDeg}deg)`;
    mapRotationDeg = bearingDeg;
  }

  // 상대 각도를 시계 방향(1시~12시) 및 방향 화살표로 변환 — 현재는
  // 직접 호출부가 없지만(재설계로 turnLabel/turnAngle 방식으로 대체),
  // 향후 "길찾기 모드"(별도 설계 예정)에서 재사용할 수 있어 남겨둔다.
  function angleDiffToClockDirection(angleDiff) {
    const norm = ((angleDiff % 360) + 360) % 360; // 0 ~ 360도 정규화
    if (norm >= 345 || norm < 15) return { clock: '12시 방향 (직진)', arrow: '⬆️' };
    if (norm >= 15 && norm < 45) return { clock: '1시 방향', arrow: '↗️' };
    if (norm >= 45 && norm < 75) return { clock: '2시 방향', arrow: '↗️' };
    if (norm >= 75 && norm < 105) return { clock: '3시 방향 (우회전)', arrow: '➡️' };
    if (norm >= 105 && norm < 135) return { clock: '4시 방향', arrow: '↘️' };
    if (norm >= 135 && norm < 165) return { clock: '5시 방향', arrow: '↘️' };
    if (norm >= 165 && norm < 195) return { clock: '6시 방향 (되돌아가기)', arrow: '⬇️' };
    if (norm >= 195 && norm < 225) return { clock: '7시 방향', arrow: '↙️' };
    if (norm >= 225 && norm < 255) return { clock: '8시 방향', arrow: '↙️' };
    if (norm >= 255 && norm < 285) return { clock: '9시 방향 (좌회전)', arrow: '⬅️' };
    if (norm >= 285 && norm < 315) return { clock: '10시 방향', arrow: '↖️' };
    if (norm >= 315 && norm < 345) return { clock: '11시 방향', arrow: '↖️' };
    return { clock: '12시 방향', arrow: '⬆️' };
  }

  // 방위각 차이를 "오른쪽/왼쪽" 쉬운 말로 변환 — 이탈 시 복귀 방향 안내용
  function angleDiffToPlainKorean(angleDiff) {
    const abs = Math.abs(angleDiff);
    const side = angleDiff >= 0 ? '오른쪽' : '왼쪽';
    if (abs <= 15) return '그대로 직진하세요';
    if (abs <= 45) return `${side}으로 조금`;
    if (abs <= 100) return `${side}으로`;
    return `${side}으로 많이`;
  }

  // ===================================================================
  // 🧭 길찾기 모드 — 지도 위 나침반 링 오버레이.
  // 지도를 가리는 팝업 대신, 지도(빨간 경로선 포함) 위에 반투명 링을
  // 얹는다. 링에는 회전하는 초록 화살표(▲, 링의 "가리키는 방향")와
  // 화면에 고정된 빨간 기준선(12시)이 있다 — 이 둘이 겹치는 순간이
  // "지금 폰이 향한 방향(또는 사용자가 손으로 지정한 방향)이 경로
  // 진행방향과 일치"한다는 뜻이다. 입력 방식은 나침반(자동)과
  // 손가락 회전(수동) 두 가지를 토글로 전환한다. 확정 버튼/모달
  // 없이 실시간으로 계속 보여주다가 사용자가 닫기(✕)를 누르면 종료.
  const WAYFIND_TARGET_AHEAD_M = 20; // 목표 방위각을 구할 전방 지점 거리

  let isWayfindActive = false;
  let wayfindTargetBearing = null; // 목표 방위각(고정, 켜져 있는 동안 재계산 안 함)
  let wayfindInputMode = 'compass'; // 'compass' | 'manual'

  function computeWayfindTargetBearing() {
    if (!lastKnownPos || !currentPoints || currentPoints.length < 2) return null;
    const nearest = nearestPointOnTrail(lastKnownPos.lat, lastKnownPos.lon, currentPoints);
    if (nearest.index < 0) return null;
    const ahead = findPointAheadByDistance(currentPoints, cumulativeDistances, nearest.index, WAYFIND_TARGET_AHEAD_M);
    if (!ahead) return null;
    return calculateBearing(lastKnownPos.lat, lastKnownPos.lon, ahead.lat, ahead.lon);
  }

  // 링 회전값 = phoneAbsHeading - targetBearing. 폰이 목표 방향을 정확히
  // 향하면 0이 되어, 링의 ▲(항상 링 위쪽에 고정)가 화면 12시의 빨간
  // 기준선과 정확히 겹친다 — "나침반과 경로 방향이 일치"가 그대로
  // 시각적으로 보이는 이유다.
  function renderWayfindRing(rotationDeg) {
    const rotor = document.getElementById('wayfindRingRotor');
    if (rotor) rotor.style.transform = `rotate(${rotationDeg}deg)`;
  }

  function handleWayfindOrientation(e) {
    if (e.alpha === null || isNaN(e.alpha)) return;
    if (wayfindTargetBearing === null) return;

    let phoneAbsHeading = e.webkitCompassHeading;
    if (phoneAbsHeading === undefined || phoneAbsHeading === null) {
      phoneAbsHeading = (360 - e.alpha) % 360;
    }

    renderWayfindRing(shortestAngleDiff(phoneAbsHeading, wayfindTargetBearing));
  }

  function startWayfindCompassSensor() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleWayfindOrientation, true);
          } else {
            alert('나침반 권한이 허용되지 않았어요.\n상단 "손으로 돌리기" 버튼을 눌러 수동으로 맞춰주세요.');
          }
        })
        .catch(() => {});
    } else {
      window.addEventListener('deviceorientationabsolute', handleWayfindOrientation, true);
      window.addEventListener('deviceorientation', handleWayfindOrientation, true);
    }
  }

  function stopWayfindCompassSensor() {
    window.removeEventListener('deviceorientation', handleWayfindOrientation, true);
    window.removeEventListener('deviceorientationabsolute', handleWayfindOrientation, true);
  }

  // --- 손으로 돌리기(수동) — 나침반/자기장 센서를 전혀 쓰지 않는다.
  // MagSafe 자석, 금속 거치대의 자력계 간섭을 피하고 싶을 때 쓴다.
  // 링 자체를 직접 돌리는 각도가 곧 phoneAbsHeading 자리를 대신한다.
  let wayfindManualRotation = 0; // 사용자가 손으로 돌린 각도(도) — targetBearing 기준 상대값
  let wayfindDialDragging = false;
  let wayfindDialDragStartAngle = 0;
  let wayfindDialDragStartRotation = 0;

  function wayfindDialAngleFromEvent(evt, wrapEl) {
    const rect = wrapEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const point = evt.touches ? evt.touches[0] : evt;
    const dx = point.clientX - cx;
    const dy = point.clientY - cy;
    return Math.atan2(dx, -dy) * (180 / Math.PI); // 12시 방향 기준 시계방향 각도
  }

  function handleWayfindDialDragStart(evt) {
    const wrap = document.getElementById('wayfindRingWrap');
    if (!wrap) return;
    wayfindDialDragging = true;
    wayfindDialDragStartAngle = wayfindDialAngleFromEvent(evt, wrap);
    wayfindDialDragStartRotation = wayfindManualRotation;
    evt.preventDefault();
  }

  function handleWayfindDialDragMove(evt) {
    if (!wayfindDialDragging) return;
    const wrap = document.getElementById('wayfindRingWrap');
    if (!wrap) return;
    const currentAngle = wayfindDialAngleFromEvent(evt, wrap);
    const delta = shortestAngleDiff(currentAngle, wayfindDialDragStartAngle);
    wayfindManualRotation = ((wayfindDialDragStartRotation + delta) % 360 + 360) % 360;
    renderWayfindRing(wayfindManualRotation);
    evt.preventDefault();
  }

  function handleWayfindDialDragEnd() {
    wayfindDialDragging = false;
  }

  function initWayfindDialEvents() {
    const wrap = document.getElementById('wayfindRingWrap');
    if (!wrap || wrap._wayfindBound) return;
    wrap._wayfindBound = true;
    wrap.addEventListener('mousedown', handleWayfindDialDragStart);
    window.addEventListener('mousemove', handleWayfindDialDragMove);
    window.addEventListener('mouseup', handleWayfindDialDragEnd);
    wrap.addEventListener('touchstart', handleWayfindDialDragStart, { passive: false });
    window.addEventListener('touchmove', handleWayfindDialDragMove, { passive: false });
    window.addEventListener('touchend', handleWayfindDialDragEnd);
  }

  // --- 입력 방식 전환 ---
  function toggleWayfindInputMode() {
    wayfindInputMode = (wayfindInputMode === 'compass') ? 'manual' : 'compass';
    const btn = document.getElementById('wayfindModeToggleBtn');
    const hint = document.getElementById('wayfindHintBadge');
    if (wayfindInputMode === 'manual') {
      stopWayfindCompassSensor();
      wayfindManualRotation = 0;
      renderWayfindRing(0);
      initWayfindDialEvents();
      if (btn) btn.textContent = '🧭 나침반으로 맞추기';
      if (hint) hint.textContent = '링을 손가락으로 돌려 빨간 경로선과 초록 화살표를 맞춰보세요';
    } else {
      startWayfindCompassSensor();
      if (btn) btn.textContent = '✋ 손으로 돌리기';
      if (hint) hint.textContent = '빨간 경로선이 나침반 기준선과 겹치면 그 방향으로 가면 됩니다';
    }
  }

  function openWayfindMode() {
    wayfindTargetBearing = computeWayfindTargetBearing();
    if (wayfindTargetBearing === null) {
      alert('현재 위치를 아직 확인할 수 없어요.\n[내 위치] 버튼을 먼저 눌러주세요.');
      return;
    }

    // 현재 위치로 확대 — 실제 걸어야 할 길(빨간 경로선)이 화면에 크게
    // 보여야 나침반 링과 겹쳐보는 의미가 있다.
    if (lastKnownPos) {
      map.setView([lastKnownPos.lat, lastKnownPos.lon], Math.max(map.getZoom(), 18), { animate: true });
    }

    const overlay = document.getElementById('wayfindOverlay');
    if (overlay) overlay.style.display = 'block';

    wayfindInputMode = 'compass';
    const btn = document.getElementById('wayfindModeToggleBtn');
    if (btn) btn.textContent = '✋ 손으로 돌리기';
    const hint = document.getElementById('wayfindHintBadge');
    if (hint) hint.textContent = '빨간 경로선이 나침반 기준선과 겹치면 그 방향으로 가면 됩니다';

    wayfindManualRotation = 0;
    initWayfindDialEvents();
    renderWayfindRing(0);

    isWayfindActive = true;
    startWayfindCompassSensor();
  }

  function closeWayfindMode() {
    isWayfindActive = false;
    wayfindTargetBearing = null;
    stopWayfindCompassSensor();
    const overlay = document.getElementById('wayfindOverlay');
    if (overlay) overlay.style.display = 'none';
  }

  // 코스를 새로 열거나 바꿀 때 윈도우 기준점을 초기화한다.
  // 이걸 안 하면 이전 코스에서 남은 인덱스를 기준으로 새 코스를 윈도우
  // 탐색하게 되어 엉뚱한 결과가 나올 수 있다.
  function resetTrailSearchWindow() {
    lastNearestIdx = -1;
  }

  // 타일 좌표 계산 함수
  function latLonToTile(lat, lon, zoom) {
    const latRad = lat * Math.PI / 180;
    const n = Math.pow(2, zoom);
    const x = Math.floor((lon + 180) / 360 * n);
    const y = Math.floor((1 - Math.asinh(Math.tan(latRad)) / Math.PI) / 2 * n);
    return { x, y };
  }

  function getTilesForBounds(minLat, maxLat, minLon, maxLon, zoom) {
    const p1 = latLonToTile(maxLat, minLon, zoom);
    const p2 = latLonToTile(minLat, maxLon, zoom);
    const minX = Math.min(p1.x, p2.x);
    const maxX = Math.max(p1.x, p2.x);
    const minY = Math.min(p1.y, p2.y);
    const maxY = Math.max(p1.y, p2.y);

    const tiles = [];
    for (let x = minX; x <= maxX; x++) {
      for (let y = minY; y <= maxY; y++) {
        tiles.push({ z: zoom, x, y });
      }
    }
    return tiles;
  }

  // GPX 파싱
  function parseGPX(xmlText) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, 'application/xml');
    const trkpts = Array.from(xml.getElementsByTagName('trkpt'));
    if (!trkpts.length) throw new Error('트랙 좌표를 찾을 수 없습니다.');

    const points = trkpts.map(pt => {
      const lat = parseFloat(pt.getAttribute('lat'));
      const lon = parseFloat(pt.getAttribute('lon'));
      const eleEl = pt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      const timeEl = pt.getElementsByTagName('time')[0];
      const time = timeEl ? new Date(timeEl.textContent) : null;
      return { lat, lon, ele, time };
    }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));

    const cleanedPoints = removeGpxSpikes(points);
    const wpts = Array.from(xml.getElementsByTagName('wpt')).map(wpt => {
      const lat = parseFloat(wpt.getAttribute('lat'));
      const lon = parseFloat(wpt.getAttribute('lon'));
      const nameEl = wpt.getElementsByTagName('name')[0];
      const name = nameEl ? nameEl.textContent.trim() : '';
      const eleEl = wpt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      return { lat, lon, name, ele };
    }).filter(w => !isNaN(w.lat) && !isNaN(w.lon) && w.name);
    cleanedPoints.waypoints = wpts;
    return cleanedPoints;
  }

  // 개선 5: GPX 파일 자체에 기록 당시 GPS 오차로 생긴 "스파이크"(실제
  // 등산로는 완만한데 좌표 하나가 뾰족하게 튀어나온 지점)를 걸러낸다.
  // 이런 스파이크는 실시간 GPS 노이즈와 달리 파일에 이미 박제되어 있어
  // 매번 그 지점을 지날 때마다 방향 계산이 똑같이 틀어지는 원인이었다.
  //
  // 판정 기준: 연속된 세 점(A-B-C)에서 A→B 방향과 B→C 방향이 급격히
  // 꺾이면서(150도 이상, 거의 되돌아오는 수준) 동시에 B가 A-C 직선에서
  // 비정상적으로 멀리 떨어져 있으면(스파이크 폭 대비 A-C 거리가 매우
  // 짧음) 스파이크로 간주해 B를 제거한다. 실제 등산로의 급한 코너(정상,
  // 갈림길 등)는 A-C 거리 자체가 어느 정도 되므로 이 조건에 잘 안 걸린다.
  function removeGpxSpikes(points) {
    if (!points || points.length < 3) return points;

    const SPIKE_ANGLE_THRESHOLD = 150; // 이 각도(deg) 이상 급격히 꺾이면 의심
    const SPIKE_MAX_AC_DIST_M = 15;    // A-C 거리가 이보다 짧으면 "제자리에서 튄" 스파이크로 판정

    const result = [points[0]];
    for (let i = 1; i < points.length - 1; i++) {
      const a = result[result.length - 1];
      const b = points[i];
      const c = points[i + 1];

      const bearingAB = calculateBearing(a.lat, a.lon, b.lat, b.lon);
      const bearingBC = calculateBearing(b.lat, b.lon, c.lat, c.lon);
      const turnAngle = Math.abs(shortestAngleDiff(bearingBC, bearingAB));
      const distAC = haversineMeters(a.lat, a.lon, c.lat, c.lon);

      const isSpike = turnAngle >= SPIKE_ANGLE_THRESHOLD && distAC <= SPIKE_MAX_AC_DIST_M;
      if (isSpike) {
        console.warn(`⚠️ GPX 스파이크 감지 및 제거: 인덱스 ${i}, 꺾인각 ${turnAngle.toFixed(1)}°, A-C거리 ${distAC.toFixed(1)}m`);
        continue; // b를 건너뛰고 result에 넣지 않음
      }
      result.push(b);
    }
    result.push(points[points.length - 1]);
    return result;
  }

  // 산에서 여러 코스를 오프라인으로 골라볼 수 있도록 배열로 보관하되,
  // 같은 GPX 파일이나 같은 코스는 반드시 1개만 유지하며 최신 내용으로 갱신(upsert)한다.
  const SAVED_ROUTES_KEY = 'saved_hiking_routes_v2';
  const MAX_SAVED_ROUTES = 3;

  function extractGpxFileName(str) {
    if (!str) return '';
    try { str = decodeURIComponent(str); } catch(e) {}
    const m = str.match(/([^\/\?#&=:"']+\.gpx)/i);
    return m ? m[1].toLowerCase().replace(/\.gpx$/i, '').trim() : '';
  }

  function normalizeCourseKey(name, url) {
    const file = extractGpxFileName(url) || extractGpxFileName(name);
    if (file) {
      return file.replace(/[_-\s]+/g, '').toLowerCase();
    }
    if (name) {
      let n = name;
      try { n = decodeURIComponent(n); } catch(e) {}
      return n.replace(/^🚩\s*/, '')
              .replace(/등산지도|등산로|지도/g, '')
              .replace(/[_-\s]+/g, '')
              .toLowerCase()
              .trim();
    }
    return '';
  }

  function isSameRoute(a, b) {
    if (!a || !b) return false;
    if (a.sourceUrl && b.sourceUrl && a.sourceUrl === b.sourceUrl) return true;
    const keyA = normalizeCourseKey(a.name, a.sourceUrl);
    const keyB = normalizeCourseKey(b.name, b.sourceUrl);
    if (keyA && keyB && keyA === keyB) return true;
    return false;
  }

  function loadSavedRoutes() {
    try {
      const raw = localStorage.getItem(SAVED_ROUTES_KEY);
      const list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) return [];

      // 기존 저장 목록에 동일 코스가 중복 누적된 경우 최신 1개만 남기고 자동 정리
      const unique = [];
      list.forEach(item => {
        if (!unique.some(u => isSameRoute(u, item))) {
          unique.push(item);
        }
      });
      let isModified = unique.length !== list.length;
      if (unique.length > MAX_SAVED_ROUTES) {
        unique.length = MAX_SAVED_ROUTES;
        isModified = true;
      }
      
      if (isModified) {
        localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(unique));
        // 정리된 초과 코스가 있다면 캐시된 지도 타일(이미지)도 비워줌
        if (typeof cleanupEvictedCourseTiles === 'function') {
          cleanupEvictedCourseTiles().catch(() => {});
        }
      }
      return unique;
    } catch(e) { return []; }
  }

  function saveRouteToStorage(courseName, sourceUrl, points) {
    try {
      const newRoute = {
        name: courseName,
        sourceUrl: sourceUrl || null,
        points: points,
        waypoints: points.waypoints || [],
        savedAt: Date.now()
      };
      let list = loadSavedRoutes();
      // 같은 코스가 이미 있으면 기존 항목을 모두 제거하고 최신으로 맨 앞에 1개만 등록
      list = list.filter(r => !isSameRoute(r, newRoute));
      list.unshift(newRoute);
      if (list.length > MAX_SAVED_ROUTES) list = list.slice(0, MAX_SAVED_ROUTES);
      localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(list));
      // 방금 밀려난 코스가 있다면 그 타일도 정리한다(비동기, 결과를 기다리지 않음).
      cleanupEvictedCourseTiles().catch(() => {});
    } catch(e) {
      try {
        let list = loadSavedRoutes();
        list = list.slice(0, Math.ceil(list.length / 2));
        const newRoute = { 
          name: courseName, 
          sourceUrl: sourceUrl || null, 
          points: points, 
          waypoints: points.waypoints || [], 
          savedAt: Date.now() 
        };
        list = list.filter(r => !isSameRoute(r, newRoute));
        list.unshift(newRoute);
        localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(list));
      } catch(e2) {}
    }
  }

  function findSavedRoute(courseName, url) {
    const target = { name: courseName, sourceUrl: url };
    return loadSavedRoutes().find(r => isSameRoute(r, target)) || null;
  }

  // 경로 그리기
  // sourceUrl: 로컬 저장소 키로 쓰는 GPX 원본 주소. 코스명(courseName)만으로는
  // 서로 다른 GPX가 같은 이름으로 뽑혀 캐시가 뒤섞이는 문제가 있었다 —
  // 반드시 원본 URL로 구분해야 한다.
  function drawRoute(points, courseName, sourceUrl, isFromCache) {
    if (!map || !points.length) return;
    currentPoints = points;
    resetTrailSearchWindow(); // 새 코스이므로 이전 코스의 탐색 위치 기억을 초기화
    gpsFilterEngine.reset(); // 이전 위치의 필터 상태가 남아있으면 새 코스 시작 시 엉뚱한 곳으로 수렴하려는 과도기 흔들림이 생길 수 있어 초기화
    cumulativeDistances = buildCumulativeDistances(points); // 5단계: 누적거리 배열 미리 계산
    lastAlertedMilestoneKey = null; // 새 코스이므로 갈림길 알람도 처음부터 다시 트리거

    if (polyline) map.removeLayer(polyline);
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const latlngs = points.map(p => [p.lat, p.lon]);

    // 깔끔하고 선명한 등산로 빨간선
    polyline = L.polyline(latlngs, {
      color: '#d32f2f',
      weight: 5,
      opacity: 0.95
    }).addTo(map);

    fitRoute();

    const makeBadge = (lat, lon, title, bg) => {
      const icon = L.divIcon({
        className: 'custom-badge-icon',
        html: `<div class="route-badge" style="background:${bg};">${title}</div>`,
        iconAnchor: [30, 12]
      });
      return L.marker([lat, lon], { icon }).addTo(map);
    };

    currentMilestones = buildMilestones(points, points.waypoints, cumulativeDistances);
    if (currentMilestones && currentMilestones.length > 0) {
      currentMilestones.forEach(m => {
        if (!m.hideMarker) {
          markers.push(makeBadge(m.lat, m.lon, `${m.icon} ${m.name}`, m.color));
        }
      });
    } else {
      const start = points[0];
      const end = points[points.length - 1];
      markers.push(makeBadge(start.lat, start.lon, '🚩 들머리', '#1976d2'));
      markers.push(makeBadge(end.lat, end.lon, '🏁 날머리', '#d32f2f'));
      const withEle = points.filter(p => p.ele !== null);
      if (withEle.length) {
        const peak = withEle.reduce((a, b) => b.ele > a.ele ? b : a);
        markers.push(makeBadge(peak.lat, peak.lon, `⛰️ 정상 (${Math.round(peak.ele)}m)`, '#e65100'));
      }
    }

    // 거리 및 고도 정보 계산 생략 (지도 화면 극대화)

    if (courseName) {
      document.getElementById('trailName').innerText = '🚩 ' + courseName;
      let cleanTitle = courseName.replace(/^🚩\s*/, '').trim();
      if (!cleanTitle.includes('등산지도') && !cleanTitle.includes('등산로') && !cleanTitle.includes('지도')) {
        cleanTitle += ' 등산지도';
      }
      document.title = cleanTitle;
      const meta = document.getElementById('appleAppTitle');
      if (meta) meta.content = cleanTitle;
    }

    // 로컬 저장소에 코스 좌표 영구 보관 (산속에서 재접속 시 0.01초 만에 즉시 복원,
    // 여러 코스를 동시에 보관해 오프라인 상태에서도 목록에서 골라볼 수 있다)
    saveRouteToStorage(courseName, sourceUrl, points);

    document.getElementById('emptyModal').style.display = 'none';

    // 지도가 열리는 즉시 백그라운드에서 오프라인 등산지도 자동 캐시 저장!
    // 단, 이 코스가 이전에 이미 완전히 저장되어 있다면 autoSaveOfflineMap
    // 내부에서 완료 플래그를 확인해 네트워크 접근 없이 즉시 반환한다.
    const tileCourseKey = getTileCourseKey(courseName, sourceUrl);
    autoSaveOfflineMap(points, tileCourseKey);

    // 등산로 코스가 열리면 길찾기(내 위치 추적)를 기본으로 바로 시작한다.
    // 매번 GPS 버튼을 눌러야 시작되던 이전 방식 대신, 산에서 지도만 켜면
    // 곧바로 방향 안내가 되도록 opt-out 대신 opt-in을 뒤집었다. 이미 GPS가
    // 켜져 있으면(코스를 다시 불러온 경우 등) 중복 시작하지 않는다.
    if (watchId === null) {
      startGpsTracking();
    }
  }

  // 코스를 화면 시각적 정중앙에 정확히 배치 (상단 헤더 여백 보정)
  function fitRoute() {
    if (!map || !polyline) return;
    map.fitBounds(polyline.getBounds(), {
      paddingTopLeft: [40, 85],
      paddingBottomRight: [40, 45]
    });
  }

  // 코스별 타일 다운로드 완료 여부를 기록하는 플래그.
  // 기존에는 좌표(saveRouteToStorage)만 저장됐고 타일 캐싱 성공 여부는
  // 어디에도 남지 않아, 코스를 다시 열 때마다 이미 받은 타일까지
  // cache.match()로 수백 번씩 재확인했다. 완료 플래그가 있으면 이 확인을
  // localStorage 조회 1번으로 끝내고, 온전히 끝난 코스는 네트워크를
  // 아예 건드리지 않는다.
  const TILES_SAVED_KEY = 'gajago_tiles_saved_v1';

  function getTileSaveStatus(courseKey) {
    try {
      const raw = localStorage.getItem(TILES_SAVED_KEY);
      const map = raw ? JSON.parse(raw) : {};
      return map[courseKey] || null; // { status: 'complete'|'partial', savedAt, tileCount, failedCount }
    } catch(e) { return null; }
  }

  function setTileSaveStatus(courseKey, statusObj) {
    try {
      const raw = localStorage.getItem(TILES_SAVED_KEY);
      const map = raw ? JSON.parse(raw) : {};
      map[courseKey] = statusObj;
      localStorage.setItem(TILES_SAVED_KEY, JSON.stringify(map));
    } catch(e) {}
  }

  // 코스명+원본URL로 고유 키 생성 (기존 normalizeCourseKey 재사용)
  function getTileCourseKey(courseName, sourceUrl) {
    return normalizeCourseKey(courseName, sourceUrl) || (sourceUrl || courseName || 'unknown');
  }

  // 저장된 코스 목록(saved_hiking_routes_v1, 최대 MAX_SAVED_ROUTES개)에서
  // 밀려나 더 이상 존재하지 않는 코스의 오프라인 지도 타일을 Cache Storage에서
  // 지운다. 타일 캐시(gaja-trail-cache-v5)에는 자동 삭제가 없어서, 여러
  // 산을 다니며 코스를 계속 열어보면 오래된 코스의 타일이 스마트폰
  // 저장공간에 무한정 쌓이는 문제가 있었다 — 코스 목록에서 밀려나는
  // 시점(=더 이상 이 앱에서 접근할 방법이 없어지는 시점)에 맞춰 정리한다.
  async function cleanupEvictedCourseTiles() {
    if (!('caches' in window)) return;

    let tileStatusMap;
    try {
      const raw = localStorage.getItem(TILES_SAVED_KEY);
      tileStatusMap = raw ? JSON.parse(raw) : {};
    } catch(e) { return; }

    const trackedKeys = Object.keys(tileStatusMap);
    if (trackedKeys.length === 0) return;

    const activeKeys = new Set(
      loadSavedRoutes().map(r => getTileCourseKey(r.name, r.sourceUrl))
    );
    const evictedKeys = trackedKeys.filter(k => !activeKeys.has(k));
    if (evictedKeys.length === 0) return;

    try {
      const cache = await caches.open('gaja-trail-cache-v5');
      for (const key of evictedKeys) {
        const entry = tileStatusMap[key];
        const urls = (entry && entry.tileUrls) || [];
        for (const url of urls) {
          await cache.delete(url).catch(() => {});
        }
        delete tileStatusMap[key];
      }
      localStorage.setItem(TILES_SAVED_KEY, JSON.stringify(tileStatusMap));
      console.log(`🧹 저장 목록에서 밀려난 코스 ${evictedKeys.length}개의 오프라인 타일 정리 완료`);
    } catch(e) {}
  }

  // 지도가 열리면 자동으로 주변 지형도 타일을 백그라운드 캐싱 (산속 통신두절 대비)
  let isSavingCache = false;
  async function autoSaveOfflineMap(points, courseKey) {
    if (isSavingCache || !points || !points.length) return;

    // ⭐ 이미 완전히 저장된 코스면 네트워크 접근 자체를 하지 않는다.
    if (courseKey) {
      const existing = getTileSaveStatus(courseKey);
      if (existing && existing.status === 'complete') {
        console.log('⚡ 이미 오프라인 지도가 완전히 저장된 코스 — 재다운로드 생략:', courseKey);
        return;
      }
    }

    // 산속에서 데이터가 아예 안 터지는 상태라면 시도 자체가 배터리 낭비다.
    if (navigator.onLine === false) {
      console.log('📡 오프라인 상태 — 타일 다운로드 시도 안 함');
      return;
    }

    isSavingCache = true;

    // 상단 자동 저장 미니 알림 뱃지
    let badge = document.getElementById('offlineAutoBadge');
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'offlineAutoBadge';
      badge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#ffffff; font-size:12px; font-weight:700; padding:8px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.2); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.6s ease;';
      document.body.appendChild(badge);
    }
    badge.style.opacity = '1';
    badge.innerText = '💾 오프라인 등산지도 자동 저장 중... (0%)';

    // 경로의 기하학적 중심 계산
    let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
    points.forEach(p => {
      if (p.lat < minLat) minLat = p.lat;
      if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon;
      if (p.lon > maxLon) maxLon = p.lon;
    });

    const centerLat = (minLat + maxLat) / 2;
    const centerLon = (minLon + maxLon) / 2;

    // 위도 및 경도 방향의 실제 거리(km) 계산
    const latDistKm = (maxLat - minLat) * 111.0;
    const lonDistKm = (maxLon - minLon) * 111.0 * Math.cos(centerLat * Math.PI / 180);

    // 한쪽으로 치우치지 않도록 더 긴 축 기준으로 동서남북 사방 동일 반경(정사각형 대칭) 설정
    const maxHalfKm = Math.max(latDistKm, lonDistKm) / 2.0;
    const padKm = 1.6; // 사방 균일 여유 마진 (약 1.6km)
    const radiusKm = maxHalfKm + padKm;

    const dLat = radiusKm / 111.0;
    const dLon = radiusKm / (111.0 * Math.cos(centerLat * Math.PI / 180));

    const symMinLat = centerLat - dLat;
    const symMaxLat = centerLat + dLat;
    const symMinLon = centerLon - dLon;
    const symMaxLon = centerLon + dLon;

    // 사방 대칭 정사각형 영역으로 줌 13~17 타일 목록 생성
    const tileUrls = [];
    for (let z = 13; z <= 17; z++) {
      const tiles = getTilesForBounds(symMinLat, symMaxLat, symMinLon, symMaxLon, z);
      tiles.forEach(t => {
        tileUrls.push(`https://map.pstatic.net/nrb/styles/terrain/${naverTileVersion}/${t.z}/${t.x}/${t.y}.png`);
      });
    }

    const total = tileUrls.length;

    try {
      const cache = await caches.open('gaja-trail-cache-v5');
      await cache.addAll(['./track_viewer.html', './leaflet.js', './leaflet.css']).catch(() => {});

      let completed = 0;
      let failedCount = 0;
      const batchSize = 12;
      for (let i = 0; i < tileUrls.length; i += batchSize) {
        const batch = tileUrls.slice(i, i + batchSize);
        await Promise.all(batch.map(async url => {
          try {
            const match = await cache.match(url);
            if (!match) {
              const res = await fetch(url, { mode: 'cors' });
              if (res.ok) {
                await cache.put(url, res);
              } else {
                failedCount++;
              }
            }
          } catch(e) {
            failedCount++;
          }
          completed++;
        }));
        const pct = Math.round((completed / total) * 100);
        badge.innerText = `💾 오프라인 등산지도 자동 저장 중... (${pct}%)`;
      }

      if (failedCount === 0) {
        badge.innerText = '✅ 오프라인 등산지도 저장 완료! (산속 통신두절 대비)';
        badge.style.background = 'rgba(46,125,50,0.95)';
        // 완전 성공 — 다음부터는 이 코스를 열어도 재다운로드하지 않는다.
        // tileUrls도 함께 저장해둬야, 나중에 이 코스가 저장 목록에서
        // 밀려날 때 정확히 이 타일들만 캐시에서 지울 수 있다(정리 로직 참고).
        if (courseKey) {
          setTileSaveStatus(courseKey, { status: 'complete', savedAt: Date.now(), tileCount: total, failedCount: 0, tileUrls });
        }
      } else {
        badge.innerText = `⚠️ 오프라인 저장 완료 (일부 타일 ${failedCount}개 실패 — 오프라인 시 해당 구간 미표시될 수 있음)`;
        badge.style.background = 'rgba(230,81,0,0.95)';
        // 일부만 성공 — 다음에 다시 열면 실패한 부분을 포함해 재시도할 수 있도록
        // 'partial'로 기록한다 (완전 재다운로드는 아니지만 재시도 여지를 남김).
        if (courseKey) {
          setTileSaveStatus(courseKey, { status: 'partial', savedAt: Date.now(), tileCount: total, failedCount, tileUrls });
        }
      }
      // 밀려난 오래된 코스가 있으면 그 코스의 타일들을 캐시에서 정리한다
      // (저장공간이 무한정 쌓이지 않도록). 실패해도 오프라인 지도 저장
      // 자체는 이미 끝났으므로 조용히 넘어간다.
      cleanupEvictedCourseTiles().catch(() => {});
      setTimeout(() => {
        badge.style.opacity = '0';
        setTimeout(() => badge.remove(), 600);
      }, 3000);
    } catch(err) {
      console.warn('오프라인 캐시 자동 저장 실패:', err);
      badge.remove();
    } finally {
      isSavingCache = false;
    }
  }

  // 모달 닫기
  function closeModal() {
    const modal = document.getElementById('emptyModal');
    if (modal) modal.style.display = 'none';
  }

  // 🌟 저장된 등산로 코스 목록 팝업 열기 (전역 함수로 언제든지 즉시 호출 가능)
  function showSavedRouteList(message) {
    const routes = loadSavedRoutes();
    const modal = document.getElementById('emptyModal');
    if (!modal) return;
    const desc = document.getElementById('modalDesc');
    const listEl = document.getElementById('savedRouteList');

    if (!routes || routes.length === 0) {
      if (desc) desc.innerHTML = message || '현재 오프라인으로 저장된 등산로 코스가 없습니다.<br><br>💡 GPX 파일을 열거나 블로그 등산지도 링크를 누르시면 자동으로 저장됩니다.';
      if (listEl) {
        listEl.innerHTML = '';
        listEl.style.display = 'none';
      }
      modal.style.display = 'flex';
      return;
    }

    if (desc) desc.innerHTML = message || '저장된 코스를 터치하시면 오프라인 지도로 즉시 열립니다.';
    if (listEl) {
      listEl.innerHTML = routes.map((r, i) => {
        const dateStr = r.savedAt ? new Date(r.savedAt).toLocaleDateString('ko-KR') : '';
        const safeName = (r.name || '등산 코스').replace(/</g, '&lt;');
        return `
          <div class="saved-route-item" onclick="openSavedRouteByIndex(${i})">
            <div class="saved-route-info">
              <div class="saved-route-name">⛰️ ${safeName}</div>
              <div class="saved-route-date">저장일: ${dateStr}</div>
            </div>
            <button type="button" class="saved-route-del" onclick="deleteSavedRouteByIndex(event, ${i})" title="이 코스 삭제">
              🗑️
            </button>
          </div>
        `;
      }).join('');
      listEl.style.display = 'flex';
    }
    modal.style.display = 'flex';
  }
  window.showSavedRouteList = showSavedRouteList;

  function openSavedRouteByIndex(index) {
    const routes = loadSavedRoutes();
    const r = routes[index];
    if (!r) return;
    closeModal();
    if (r.waypoints) r.points.waypoints = r.waypoints;
    drawRoute(r.points, r.name, r.sourceUrl);
  }
  window.openSavedRouteByIndex = openSavedRouteByIndex;

  function deleteSavedRouteByIndex(event, index) {
    if (event) event.stopPropagation();
    const routes = loadSavedRoutes();
    const target = routes[index];
    const targetName = target ? target.name : '이 코스';
    if (confirm(`'${targetName}' 코스를 저장 목록에서 삭제하시겠습니까?`)) {
      routes.splice(index, 1);
      localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(routes));
      showSavedRouteList();
    }
  }
  window.deleteSavedRouteByIndex = deleteSavedRouteByIndex;

  // PC 드래그 앤 드롭(Drag & Drop) 파일 열기 지원
  window.addEventListener('dragover', (e) => {
    e.preventDefault();
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      const file = e.dataTransfer.files[0];
      if (file.name.toLowerCase().endsWith('.gpx')) {
        const fakeEvt = { target: { files: [file] } };
        onFileSelected(fakeEvt);
      } else {
        alert('이 파일은 열 수 없어요.\n\n등산로 지도(.gpx) 파일만 불러올 수 있습니다.\n다른 파일을 다시 선택해 주세요.');
      }
    }
  });

  function onFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;

    const courseName = file.name.replace(/\.gpx$/i, '').replace(/_/g, ' ');
    const sourceUrl = 'file:' + file.name;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const points = parseGPX(evt.target.result);
        closeModal();
        drawRoute(points, courseName, sourceUrl);
      } catch(err) {
        console.error('GPX 파싱 실패:', err);
        alert('이 등산로 파일을 읽을 수 없어요.\n\n파일이 손상되었거나 등산로 지도 파일이 아닌 것 같습니다.\n다른 파일로 다시 시도해보세요.');
      }
    };
    reader.readAsText(file);
  }

  // 등산로 진행 및 코스 일탈/역주행 실시간 상태 안내 토스트
  // 히스테리시스: 35m 넘으면 "이탈 상태" 진입, 25m 밑으로 돌아와야 "정상"으로 해제.
  // 경계선(30m 부근)에서 왔다갔다 하며 토스트가 깜빡이는 것을 막는다.
  let isOffTrailState = false;
  let offTrailStreakCount = 0; // GPS 갱신마다 1씩 증가 — 연속 3회(약 3초) 이상일 때만 경고음
  const RETURN_CONFIRM_STREAK = 3; // 복귀음도 이탈 경고음과 대칭으로, 연속 3회(약 3초) 이상 정상 상태가 유지되어야 울린다 — GPS 순간 튐으로 잠깐만 25m 밑으로 들어왔다 다시 이탈해도 오알람이 울리지 않도록 함
  let returnStreakCount = 0; // 25m 미만 조건을 연속으로 만족한 횟수 — 이탈 중일 때만 누적, 이탈 재진입 시 리셋

  // 이탈 히스테리시스 상태만 갱신하는 함수 — updateNavigationToast와
  // 정지 시 방향 고정 로직(watchPosition 콜백) 양쪽에서 공유해서 쓴다.
  // 갱신 시점이 늦으면(예: 이 함수를 안 쓰고 updateNavigationToast 안에서만
  // 갱신하면) 정지 시 방향 고정 로직이 "한 픽스 전"의 낡은 이탈 상태를
  // 참조하게 되는 문제가 있었다.
  function updateOffTrailHysteresis(minDistanceM) {
    if (!isOffTrailState && minDistanceM > 35) {
      isOffTrailState = true;
      returnStreakCount = 0;
    } else if (isOffTrailState && minDistanceM < 25) {
      returnStreakCount++;
      if (returnStreakCount >= RETURN_CONFIRM_STREAK) {
        isOffTrailState = false;
        offTrailStreakCount = 0;
        returnStreakCount = 0;
        resetOffTrailStreak(); // 궤적 복귀 → 다음 이탈은 15초부터 다시 경고, 복귀음 재생
      }
    } else if (isOffTrailState) {
      // 25m 미만 조건이 끊김(다시 25m 이상으로 튐) — 복귀 확정 전 노이즈이므로 카운터 리셋
      returnStreakCount = 0;
    }
  }

  // 화면 안내(시계 방향/좌우 안내)에 쓸 "현재 향한 절대 방위"를 반환한다.
  // 센서(나침반/자이로) 완전 배제 — GPS 좌표만으로 "내가 보는 방향"을
  // 추정한다. 이동 중에는 방금 GPS로 측정된 진행 방향(gpsMovementHeading)을
  // 쓰고, 정지 중에는 그 값을 그대로 유지한다(멈추기 직전 걷던 방향을
  // 계속 "정면"으로 간주) — 정지 시 마지막 값을 지우지 않는 것이 이
  // 함수의 핵심이므로 watchPosition 콜백에서 gpsMovementHeading을
  // 정지 상태에서는 절대 덮어쓰지 않는다.
  function getCurrentAbsHeadingForGuidance() {
    return gpsMovementHeading;
  }

  // 🏁 날머리 도착 자동 GPS 종료 — updateNavigationToast에서 사용.
  const ARRIVAL_DISTANCE_M = 20;       // 날머리까지 이 거리 이내면 "도착"
  const ARRIVAL_MIN_TRAVELED_M = 50;   // 원점회귀 코스 출발 직후 오탐 방지용 최소 이동거리

  // ↩️ 왕복/원점회귀 코스 역주행(되돌아가는 중) 감지 — 정상까지 갔다가
  // 같은 길로 되돌아오는 코스에서, 올라갈 때와 내려갈 때 모두 갈림길
  // 안내가 나와야 한다는 요구사항. 판정 기준은 traveledDist(GPS가
  // GPX 트랙 위에 투영된 코스 순서상 진행거리)의 증감 추이뿐이다 —
  // 나침반/자이로는 전혀 쓰지 않는다.
  // 히스테리시스: "역주행 시작"은 REVERSE_ENTER_STREAK회 연속 감소해야
  // 확정하고, "정방향 복귀"는 단 1회만 증가해도 즉시 해제한다 — 왕복
  // 코스에서 방향을 트는 순간(정상 등)에는 실제로 잠시 제자리에 머물며
  // GPS가 흔들릴 수 있으므로 "역주행 진입"만 신중하게, "복귀"는 민감하게
  // 잡아 빠르게 정상 안내로 돌아오게 한다.
  const REVERSE_ENTER_STREAK = 3;
  let isReversingOnTrail = false;
  let lastTraveledDistForReverse = null;
  let reverseDecreaseStreak = 0;

  function updateReversingState(traveledDist) {
    if (lastTraveledDistForReverse === null) {
      lastTraveledDistForReverse = traveledDist;
      return;
    }
    const delta = traveledDist - lastTraveledDistForReverse;
    lastTraveledDistForReverse = traveledDist;
    if (delta < -0.5) { // 0.5m 이상 감소해야 "뒤로 갔다"로 카운트(GPS 미세 노이즈 무시)
      reverseDecreaseStreak++;
      if (reverseDecreaseStreak >= REVERSE_ENTER_STREAK) isReversingOnTrail = true;
    } else if (delta > 0.5) {
      reverseDecreaseStreak = 0;
      isReversingOnTrail = false; // 정방향 복귀는 즉시 반영
    }
    // delta가 -0.5~0.5m 사이(거의 정지)면 기존 상태를 그대로 유지한다.
  }

  function updateNavigationToast(accuracy, minDistanceM, nearestIdx, nearestPoint) {
    const toast = document.getElementById('gpsToast');
    if (!toast || toast.style.display === 'none') return;
    if (!lastKnownPos) return;

    if (nearestPoint && isOffTrailState) {
      hideBottomDirectionArrow(); // 이탈 안내는 좌/우 상대 방향(angleDiffToPlainKorean)이라 하단 화살표(시계 방향) UI와 별개
      // 숲/계곡 GPS 수신 불안정 시 오알람 방지 (정확도가 25m보다 나쁘면 대기)
      if (accuracy > 25 && offTrailStreakCount < 4) {
        toast.className = 'gps-toast';
        toast.innerText = `📡 숲·계곡 GPS 수신 대기 중 (오차 ±${Math.round(accuracy)}m)`;
        return;
      }
      offTrailStreakCount++;
      // 등산로 복귀 방향은 "북동쪽" 같은 절대 방위가 아니라, 마지막 GPS
      // 진행 방향(getCurrentAbsHeadingForGuidance) 기준 오른쪽/왼쪽
      // 상대 방향으로 안내한다.
      const toTrailBearing = calculateBearing(lastKnownPos.lat, lastKnownPos.lon, nearestPoint.lat, nearestPoint.lon);
      const toTrailAngleDiff = shortestAngleDiff(toTrailBearing, getCurrentAbsHeadingForGuidance());
      toast.className = 'gps-toast warning';
      let distStr = minDistanceM >= 1000 ? (minDistanceM / 1000).toFixed(2) + 'km' : Math.round(minDistanceM) + 'm';
      toast.innerText = `🚨 [이탈] ${distStr} 벗어났어요 ${angleDiffToPlainKorean(toTrailAngleDiff)}`;

      // GPS 순간 튐(수목/계곡 지역 등) 오알람 방지 — 연속 3회(약 3초) 이상
      // 유지될 때만 실제 경고음을 울린다.
      if (offTrailStreakCount >= 3) {
        playOffTrailBeep();
      }
    } else if (nearestIdx >= 0 && currentPoints && currentPoints.length > 3) {
      // 정지 중에는 "정지 중" 안내만, 이동 중에는 남은 거리만 표시한다.
      // (이전에는 여기서 궤적 방향과 실제 이동 방향을 비교해 역주행 여부를
      // 판정했으나, 개선 1로 그 판정 자체를 제거했다 — 녹색 점선과 이탈
      // 경고가 이미 필요한 안내를 제공하므로 더 이상 계산할 필요가 없다.)
      const totalDist = cumulativeDistances[cumulativeDistances.length - 1] || 0;
      const traveledDist = cumulativeDistances[nearestIdx] || 0;
      const remainingDist = Math.max(0, totalDist - traveledDist);
      const remainingStr = remainingDist >= 0 ? `${(remainingDist / 1000).toFixed(2)}km` : '';
      const fmtM = m => `${(m / 1000).toFixed(2)}km`;

      // ⭐ 전면 재설계(2026-09-14) "미리 안내" 방식: GPX가 경로 전체를
      // 이미 알고 있으므로, "내가 지금 어느 방향을 보고 있는가"는 전혀
      // 필요 없다. 다음 갈림길까지 거리만 계속 계산하다가, 일정 거리
      // 이내로 가까워지면 buildMilestones()가 코스 로드 시 미리 계산해둔
      // turnAngle/turnLabel(좌회전/우회전/직진)을 그대로 보여준다.
      // 정지/이동 상태, 나침반, GPS heading 전부 참조하지 않는다.
      //
      // ↩️ 왕복/원점회귀 코스: 정상까지 갔다가 같은 길로 되돌아올 때도
      // 갈림길 안내가 나와야 한다는 요구사항 — traveledDist 증감 추이로
      // "되돌아가는 중"을 판정(updateReversingState)하고, 역방향이면
      // findNextMilestone이 코스 순서상 이전 마일스톤을 다음 목표로
      // 반환하도록 뒤집는다. distToNextM 계산도 방향에 맞게 뒤집어야
      // 하고, turnAngle도 진입/이탈이 반대가 되므로 180도 반전해서
      // 보여준다(showUpcomingTurnAlert에 반전된 값을 직접 넘긴다).
      updateReversingState(traveledDist);
      const milestoneResult = findNextMilestone(traveledDist, isReversingOnTrail);
      if (milestoneResult) {
        const prevM = milestoneResult.prevM;
        const nextM = milestoneResult.nextM;
        const distToNextM = isReversingOnTrail
          ? Math.max(0, traveledDist - nextM.distanceM)
          : Math.max(0, nextM.distanceM - traveledDist);

        // 🧭 구간 heading-up: 현재 구간(prevM→nextM)이 이전과 달라졌을
        // 때만 지도를 스냅 회전시킨다 — 매 GPS 픽스마다 재계산하지 않음.
        if (isSegmentRotationMode) {
          const segKey = prevM.name + '@' + prevM.distanceM + '->' + nextM.name + '@' + nextM.distanceM + (isReversingOnTrail ? '@rev' : '');
          if (segKey !== currentRotationSegmentKey) {
            currentRotationSegmentKey = segKey;
            // 역방향일 때는 구간 방향 자체가 반대이므로 prevM/nextM을
            // 원래 순서(정방향 기준)로 되돌려 넘겨야 computeSegmentHeading이
            // 올바른 진행방향을 계산한다.
            const heading = isReversingOnTrail
              ? computeSegmentHeading(nextM, prevM)
              : computeSegmentHeading(prevM, nextM);
            if (heading !== null) applySegmentRotation(heading);
          }
        }

        // 역방향으로 이 지점을 지날 때는 좌/우가 뒤바뀌므로 turnAngle을
        // 180도 반전한 임시 마일스톤 객체를 만들어 넘긴다 — 원본
        // nextM.turnAngle/turnLabel은 코스 로드 시 정방향 기준으로
        // 고정 계산된 값이라 직접 건드리지 않는다.
        const alertTarget = isReversingOnTrail
          ? Object.assign({}, nextM, {
              turnAngle: (nextM.turnAngle === null) ? null : shortestAngleDiff(nextM.turnAngle + 180, 0),
              turnLabel: (nextM.turnLabel === null || nextM.turnLabel === '직진') ? nextM.turnLabel : classifyTurnAngle(shortestAngleDiff(nextM.turnAngle + 180, 0))
            })
          : nextM;
        showUpcomingTurnAlert(alertTarget, distToNextM);

        toast.className = 'gps-toast';
        toast.innerText = `🧭 ${prevM.name} → ${nextM.name} · ${fmtM(distToNextM)} 남음 (전체 ${remainingStr})`;

        // 🏁 날머리 도착 자동 종료 — 원점회귀 코스(들머리=날머리)는 출발
        // 직후에도 remainingDist가 잠깐 작을 수 있으므로, 최소
        // ARRIVAL_MIN_TRAVELED_M 이상 실제로 이동한 뒤에만 도착 판정을
        // 한다. GPS 오차(보통 ±10~15m)를 감안해 20m 이내를 "도착"으로 본다.
        if (traveledDist >= ARRIVAL_MIN_TRAVELED_M && remainingDist <= ARRIVAL_DISTANCE_M) {
          showToastBadge('🏁 날머리에 도착했습니다.\nGPS 추적을 자동으로 종료합니다.');
          stopGpsTracking();
        }
        return;
      }

      hideBottomDirectionArrow();
      toast.className = 'gps-toast';
      toast.innerText = `🧭 위쪽으로 따라가세요 · 남은 ${remainingStr}`;
    } else {
      hideBottomDirectionArrow();
      toast.className = 'gps-toast';
      toast.innerText = `🧭 위쪽으로 따라가세요`;
    }
  }

  // 다음 갈림길(nextM)까지 남은 거리(distToNextM)를 보고 하단 큰
  // 화살표(좌회전/우회전/직진 아이콘) 표시 여부와 알람 소리를 결정한다.
  // 거리 기준만으로 판정하므로 GPS 오차로 인한 깜빡임 걱정이 없다 —
  // 방향 판정 자체가 없기 때문이다.
  //
  // 단계별 동작(사용자 요청):
  //   60m, 50m, 40m 전 — 각각 짧은 카운트다운 알람음 1회씩(10m
  //     간격으로 끊어서 "점점 가까워지고 있다"는 감각을 준다)
  //   30m 이내 — 소리 없이 화살표만 계속 표시(더 이상 깜짝 알람으로
  //     방해하지 않고, 조용히 방향만 안내)
  //   통과(다음 마일스톤으로 넘어감) — 화살표 자동으로 사라짐
  //   갈림길 근처에서 실제로 궤적을 벗어남(isOffTrailState) — "엉뚱한
  //     방향으로 가고 있다"는 판단은 내 heading을 다시 측정하는 게
  //     아니라, 이미 있는 이탈 감지(updateOffTrailHysteresis)가 대신
  //     맡는다. updateNavigationToast는 isOffTrailState일 때 이 함수
  //     자체를 호출하지 않고 이탈 경고 분기로 빠지므로, 경고음
  //     (playOffTrailBeep)은 자동으로 울린다 — 여기서 따로 처리할 것
  //     없음.
  const TURN_ALERT_DISTANCE_M = 60;   // 화살표가 뜨기 시작하는 거리
  const TURN_ALERT_QUIET_DISTANCE_M = 30; // 이 거리부터는 소리 없이 화살표만
  const TURN_ALERT_BEEP_STEP_M = 10;  // 카운트다운 알람 간격(60/50/40m)
  let lastAlertedMilestoneKey = null;
  let lastBeepedStepKey = null; // "갈림길이름@30m단위구간" — 같은 10m 구간에서 중복 알람 방지

  function showUpcomingTurnAlert(nextM, distToNextM) {
    // key에 방향(isReversingOnTrail)을 포함시켜, 왕복 코스에서 같은
    // 갈림길을 올라갈 때 한 번, 내려갈 때 또 한 번 각각 독립적으로
    // 알람이 울리도록 한다 — 방향 정보 없이 좌표+거리만 쓰면 "이미
    // 알람 울린 지점"으로 오판해 두 번째 통과 시 스킵될 수 있었다.
    const key = nextM.name + '@' + nextM.distanceM + (isReversingOnTrail ? '@rev' : '@fwd');
    // 직진 구간이거나 회전각을 계산할 수 없는 지점(들머리/날머리 등)은
    // 안내할 게 없으므로 화살표를 띄우지 않는다.
    if (!nextM.turnLabel || nextM.turnLabel === '직진' || distToNextM > TURN_ALERT_DISTANCE_M) {
      hideBottomDirectionArrow();
      if (key !== lastAlertedMilestoneKey) {
        lastAlertedMilestoneKey = null; // 다음 갈림길 재진입 대비 리셋
        lastBeepedStepKey = null;
      }
      return;
    }

    const label = `${nextM.name} · ${nextM.turnLabel} (${Math.round(distToNextM)}m 앞)`;
    // showBottomDirectionArrow(angleDiff, ...)의 angleDiff는 화면 회전용
    // 각도가 아니라 turnAngle(미리 계산된 절대 회전각)을 그대로 넘긴다 —
    // 화살표 아이콘 회전 자체가 "이 지점에서 꺾이는 방향"을 고정적으로
    // 보여주는 용도로 바뀌었으므로 내 현재 heading과 무관하다.
    showBottomDirectionArrow(nextM.turnAngle, label, false);
    lastAlertedMilestoneKey = key;

    if (distToNextM > TURN_ALERT_QUIET_DISTANCE_M) {
      // 60/50/40m 구간 — 10m 단위로 끊어 그 구간에 처음 진입했을 때만
      // 짧게 1번 알람. Math.floor로 구간을 묶어 GPS 픽스가 촘촘해도
      // 같은 10m 구간 안에서는 중복으로 울리지 않는다.
      const stepIdx = Math.floor(distToNextM / TURN_ALERT_BEEP_STEP_M);
      const stepKey = key + '@' + stepIdx;
      if (stepKey !== lastBeepedStepKey) {
        lastBeepedStepKey = stepKey;
        playTurnAlertBeep();
      }
    }
    // 30m 이내는 의도적으로 소리를 울리지 않는다 — 화살표만 조용히 표시.
  }

  // 화면 자동 꺼짐 방지 (Wake Lock) — 길찾기 회전 모드(화살표 ON, 2클릭)
  // 동안에는 화면을 계속 봐야 하므로 자동 잠금을 막는다. 지원 안 하는
  // 브라우저(구형 iOS Safari 등)에서는 조용히 무시한다.
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }
  // 화면이 숨겨지면(다른 앱으로 전환, 화면 꺼짐 등) GPS 수신을 완전히
  // 멈춘다. watchPosition을 백그라운드에서도 계속 돌리면 배터리와
  // 메모리를 불필요하게 소모하고, 등산 중 화면을 계속 볼 필요가 없는
  // 순간(주머니에 넣기 등)까지 계산을 이어갈 이유가 없다.
  // 다시 화면이 보이면 GPS를 재시작하고 관련 상태를 전부 초기화해
  // "새로 시작하는 것"처럼 처리한다 — 숨겨진 동안 실제로 이동했을 수
  // 있는데 옛 위치·방향값이 남아있으면 복귀 시 급격한 격차를 좁히려
  // 하면서 지도·나침반·화살표가 한꺼번에 튀는 원인이 되기 때문이다.
  let wasTrackingBeforeHidden = false;

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (watchId !== null) {
        wasTrackingBeforeHidden = true;
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        releaseWakeLock();
        stopCompass();
      }
    } else if (document.visibilityState === 'visible') {
      if (wasTrackingBeforeHidden) {
        wasTrackingBeforeHidden = false;
        gpsFilterEngine.reset();
        gpsMovementHeading = null;
        isCurrentlyStopped = false;
        startGpsTracking(); // GPS 재시작 — 내부에서 initCompass, wakeLock 등도 함께 재요청됨
      }
    }
  });

  // 산행 가기 전 미리보기 (따라가기) 시뮬레이션 모드
  let simInterval = null;
  let simIndex = 0;
  let simMarker = null;
  let simSpeed = 1;

  function setSimSpeed(speed, event) {
    simSpeed = speed;
    if (event) {
      document.querySelectorAll('.sim-speed-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  }

  // 시뮬레이션의 한 프레임(idx 위치)을 화면에 반영한다 — 자동재생
  // 인터벌과 스크럽 바 드래그 양쪽에서 공통으로 쓰는 렌더 함수.
  // mapViewOpts로 자동재생은 부드럽게(animate:true), 스크럽 드래그는
  // 즉시(animate:false) 반영하도록 구분한다.
  function renderSimFrame(idx, mapViewOpts) {
    if (!currentPoints || idx < 0 || idx >= currentPoints.length) return;
    const pt = currentPoints[idx];
    const lat = pt.lat;
    const lon = pt.lon;

    const aheadPt = findPointAheadByDistance(currentPoints, cumulativeDistances, idx, 20);
    if (aheadPt) {
      gpsMovementHeading = calculateBearing(lat, lon, aheadPt.lat, aheadPt.lon);
    }

    // 실제 GPS 추적과 동일한 방향 화살표 마커를 사용한다 — 예전엔
    // 단순 원형 점만 그려서 시뮬레이션 중 "내 위치 화살표가 안
    // 보인다"는 문제가 있었다.
    if (!simMarker) {
      const icon = L.divIcon({
        className: 'custom-gps-icon',
        html: createGpsIconHtml(gpsMovementHeading),
        iconSize: [80, 80],
        iconAnchor: [40, 40]
      });
      simMarker = L.marker([lat, lon], { icon, zIndexOffset: 1000 }).addTo(map);
    } else {
      simMarker.setLatLng([lat, lon]);
    }
    if (gpsMovementHeading !== null) renderGpsArrow(gpsMovementHeading);

    lastKnownPos = { lat, lon };
    isCurrentlyStopped = false;
    isOffTrailState = false;

    // ⚠️ updateNavigationToast를 map.setView보다 먼저 호출해야 한다 —
    // 구간이 바뀌는 프레임에 updateNavigationToast 내부에서
    // applySegmentRotation이 mapRotationDeg를 새 구간 방향으로 갱신하는데,
    // 순서가 반대이면 computeMapCenterForOffset이 아직 옛 mapRotationDeg
    // (한 프레임 지연된 값)로 오프셋을 계산해 지도 회전과 중심 오프셋
    // 방향이 어긋나 구간 시작점이 화면 엉뚱한 곳으로 튀는 버그가 있었다.
    updateNavigationToast(5, 0, idx, pt);

    const currentZoom = Math.max(map.getZoom(), 15);
    const center = computeMapCenterForOffset(lat, lon, currentZoom);
    map.setView([center.lat, center.lon], currentZoom, mapViewOpts);
  }

  // --- 🎬 구간 탐색(스크럽) 바 ---
  let simScrubDragging = false;

  function updateSimScrubHandle() {
    const handle = document.getElementById('simScrubHandle');
    const fill = document.getElementById('simScrubFill');
    if (!handle || !fill || !currentPoints || currentPoints.length < 2) return;
    const progress = simIndex / (currentPoints.length - 1); // 0(들머리) ~ 1(날머리)
    // 트랙 가로축: 왼쪽=들머리(0%), 오른쪽=날머리(100%) — 손가락으로
    // "오른쪽으로 밀수록 코스 뒷부분"이라는 직관과 맞춘다.
    handle.style.left = `${progress * 100}%`;
    fill.style.width = `${progress * 100}%`;
  }

  function simScrubIndexFromClientX(clientX) {
    const track = document.getElementById('simScrubTrack');
    if (!track || !currentPoints || currentPoints.length < 2) return null;
    const rect = track.getBoundingClientRect();
    let progress = (clientX - rect.left) / rect.width;
    progress = Math.max(0, Math.min(1, progress));
    return Math.round(progress * (currentPoints.length - 1));
  }

  function handleSimScrubStart(evt) {
    if (!simInterval) return; // 시뮬레이션이 켜져 있을 때만 동작
    simScrubDragging = true;
    const point = evt.touches ? evt.touches[0] : evt;
    const idx = simScrubIndexFromClientX(point.clientX);
    if (idx !== null) {
      simIndex = idx;
      renderSimFrame(simIndex, { animate: false });
      updateSimScrubHandle();
    }
    evt.preventDefault();
  }

  function handleSimScrubMove(evt) {
    if (!simScrubDragging) return;
    const point = evt.touches ? evt.touches[0] : evt;
    const idx = simScrubIndexFromClientX(point.clientX);
    if (idx !== null) {
      simIndex = idx;
      renderSimFrame(simIndex, { animate: false });
      updateSimScrubHandle();
    }
    evt.preventDefault();
  }

  function handleSimScrubEnd() {
    simScrubDragging = false;
  }

  function initSimScrubEvents() {
    const track = document.getElementById('simScrubTrack');
    if (!track || track._simScrubBound) return;
    track._simScrubBound = true;
    track.addEventListener('touchstart', handleSimScrubStart, { passive: false });
    window.addEventListener('touchmove', handleSimScrubMove, { passive: false });
    window.addEventListener('touchend', handleSimScrubEnd);
    track.addEventListener('mousedown', handleSimScrubStart);
    window.addEventListener('mousemove', handleSimScrubMove);
    window.addEventListener('mouseup', handleSimScrubEnd);
  }

  // 재생 중 "일시정지"인지 여부 — simInterval이 null이어도 이 값이
  // true면 "재생을 잠시 멈춘 것"이고, toggleSimulation()의 종료 처리
  // (마커 제거, 구간회전 해제 등)는 아직 실행하지 않은 상태다.
  let isSimPaused = false;

  function toggleSimulation() {
    if (!currentPoints || currentPoints.length < 2) {
      alert('먼저 등산로 코스를 불러와주세요.');
      return;
    }
    const btn = document.getElementById('simBtn');
    const pauseBtn = document.getElementById('simPauseBtn');
    const speedOpts = document.getElementById('simSpeedOptions');

    // 재생 중이거나(simInterval) 일시정지 중(isSimPaused)이면 완전 종료.
    if (simInterval || isSimPaused) {
      if (simInterval) clearInterval(simInterval);
      simInterval = null;
      isSimPaused = false;
      btn.innerText = '▶️';
      btn.classList.remove('active');
      pauseBtn.style.display = 'none';
      pauseBtn.innerText = '⏸️';
      speedOpts.style.display = 'none';
      if (simMarker) {
        map.removeLayer(simMarker);
        simMarker = null;
      }
      showHeadingArrow = false;
      const toast = document.getElementById('gpsToast');
      toast.style.display = 'none';
      showToastBadge('🛑 따라가기 미리보기 모드를 종료했습니다.');
      const scrubTrack = document.getElementById('simScrubTrack');
      if (scrubTrack) scrubTrack.classList.remove('active');
      // 🧭 구간회전도 시뮬레이션과 함께 종료 — 실제 GPS 켜짐 상태가
      // 아니므로 지도를 북쪽 고정으로 되돌린다.
      const mapEl = document.getElementById('map');
      isSegmentRotationMode = false;
      currentRotationSegmentKey = null;
      mapRotationDeg = 0;
      if (mapEl) { mapEl.classList.remove('heading-up'); mapEl.style.transform = ''; }
      setTimeout(() => map.invalidateSize({ animate: false }), 520);
      return;
    }

    if (watchId !== null) stopGpsTracking(); // 켜져있던 진짜 GPS 중단

    btn.innerText = '⏸️';
    btn.classList.add('active');
    pauseBtn.style.display = 'flex';
    speedOpts.style.display = 'flex';
    simIndex = 0;
    // createGpsIconHtml은 showHeadingArrow가 true일 때만 방향 화살표를
    // 그린다 — 실제 GPS(startGpsTracking)만 이 값을 켰고 시뮬레이션은
    // 전혀 건드리지 않아, 파란 점만 보이고 방향 콘이 안 보이던
    // 근본 원인이었다.
    showHeadingArrow = true;

    // 🧭 구간회전 미리보기 — 실제 GPS를 켜지 않아도 시뮬레이션 중에는
    // 구간 heading-up이 동작해야 배포 전 동작을 확인할 수 있다. 원래
    // isHeadingUp(GPS 켜짐 버튼)에만 연동돼 있었는데, toggleSimulation은
    // 그 버튼을 거치지 않아 이 상태가 켜지지 않던 문제를 수정.
    {
      const mapEl = document.getElementById('map');
      isSegmentRotationMode = true;
      currentRotationSegmentKey = null;
      if (mapEl) mapEl.classList.add('heading-up');
      // #map 크기가 100% -> 120vh로 바뀌는 걸 Leaflet이 자동 감지하지
      // 못해 지도 절반이 빈 회색으로 보이는 문제 — invalidateSize로
      // 강제 재계산(실기기 시뮬레이션에서 실측 확인된 버그).
      setTimeout(() => map.invalidateSize({ animate: false }), 520);
    }
    showToastBadge('▶️ 모의 주행 (따라가기) 시작\n산행 전 전체 경로를 미리 따라가 봅니다.');
    
    const toast = document.getElementById('gpsToast');
    toast.style.display = 'block';
    toast.className = 'gps-toast';

    const scrubTrack = document.getElementById('simScrubTrack');
    if (scrubTrack) scrubTrack.classList.add('active');
    initSimScrubEvents();
    updateSimScrubHandle();

    // 더 부드러운 이동을 위해 250ms 단위 갱신 (초당 4프레임)
    startSimInterval();
  }

  // 250ms 인터벌로 시뮬레이션 프레임을 진행시키는 공용 로직 — 최초
  // 재생 시작(toggleSimulation)과 일시정지 후 재개(toggleSimulationPause)
  // 양쪽에서 동일하게 재사용한다.
  function startSimInterval() {
    simInterval = setInterval(() => {
      if (!currentPoints || simIndex >= currentPoints.length) {
        toggleSimulation();
        return;
      }
      renderSimFrame(simIndex, { animate: true, duration: 0.25 });
      updateSimScrubHandle();

      // 속도 조절 (250ms당 이동 거리 기준)
      // 0.5x: 초당 8m (0.25초당 2m) - 세밀하게 살펴볼 때
      // 1x: 초당 16m (0.25초당 4m) - 편안한 시야
      // 2x: 초당 40m (0.25초당 10m)
      // 3x: 초당 80m (0.25초당 20m)
      // 4x: 초당 160m (0.25초당 40m)
      // 5x: 초당 320m (0.25초당 80m)
      let stepDistanceM = 4;
      if (simSpeed === 0.5) stepDistanceM = 2;
      else if (simSpeed === 2) stepDistanceM = 10;
      else if (simSpeed === 3) stepDistanceM = 20;
      else if (simSpeed === 4) stepDistanceM = 40;
      else if (simSpeed === 5) stepDistanceM = 80;

      let nextIndex = simIndex + 1;
      const startDist = cumulativeDistances[simIndex] || 0;
      while (nextIndex < currentPoints.length) {
        const currentDist = cumulativeDistances[nextIndex] || 0;
        if (currentDist - startDist >= stepDistanceM) break;
        nextIndex++;
      }
      simIndex = nextIndex;
    }, 250);
  }

  // 시뮬레이션 재생 중 "일시정지 ↔ 재개" 토글 — toggleSimulation()의
  // 시작/완전종료와는 별개 상태다. 일시정지 중에는 simInterval을 완전히
  // 지워 CPU를 아끼되, isSimPaused=true로 남겨 마커/구간회전 등은
  // 그대로 유지한다. 재개 시 같은 simIndex부터 startSimInterval()로
  // 인터벌만 다시 건다.
  function toggleSimulationPause() {
    if (!isSimPaused && !simInterval) return; // 재생 중도 일시정지 중도 아니면 무시
    const pauseBtn = document.getElementById('simPauseBtn');

    if (simInterval) {
      // 재생 중 -> 일시정지
      clearInterval(simInterval);
      simInterval = null;
      isSimPaused = true;
      if (pauseBtn) pauseBtn.innerText = '▶️';
      showToastBadge('⏸️ 일시정지했습니다.');
      return;
    }

    // 일시정지 중 -> 재개
    isSimPaused = false;
    if (pauseBtn) pauseBtn.innerText = '⏸️';
    showToastBadge('▶️ 이어서 재생합니다.');
    startSimInterval();
  }
  window.toggleSimulationPause = toggleSimulationPause;

  // 실시간 GPS 내 위치 추적 (확대 지도, 길찾기 회전 모드, 나침반 방향 빔, 등산로 복귀 가이드)
  function toggleGPS() {
    if (simInterval !== null || isSimPaused) toggleSimulation(); // 시뮬레이션 중(재생/일시정지)이면 끄기
    // 🔋 절전 모드 중엔 watchId가 null이라도 "GPS가 완전히 꺼진 것"이
    // 아니다 — 사용자가 버튼을 누르면 절전을 해제하고 즉시 재개한다
    // (startGpsTracking처럼 화면을 통째로 새로 초기화하지 않는다).
    if (isGpsSleeping) {
      exitGpsSleep('사용자가 직접 재개');
      return;
    }
    if (watchId !== null) {
      stopGpsTracking();
    } else {
      startGpsTracking();
    }
  }

  function stopGpsTracking() {
    const btn = document.getElementById('gpsBtn');
    const toast = document.getElementById('gpsToast');
    setHeadingUpMode(false, true);
    showHeadingArrow = false;
    releaseWakeLock();
    stopSleepMonitor(); // 🔋 절전 감시 타이머도 함께 정리 — 안 하면 GPS를 완전히 끈 뒤에도 백그라운드에서 계속 돔
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    stopCompass();
    if (userGpsMarker) { map.removeLayer(userGpsMarker); userGpsMarker = null; }
    if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
    btn.innerText = '📍';
    btn.classList.remove('active');
    toast.style.display = 'none';
    hideBottomDirectionArrow();
    showToastBadge('📍 내 위치 추적을 종료했습니다.');

    // [회전 검증 디버그 로그 자동 저장]
    if (directionDebugLogger.isLogging) {
      directionDebugLogger.stop();
      directionDebugLogger.exportCSV();
    }
  }

  // handleGpsPositionUpdate(아래)와 startGpsTracking 양쪽에서 쓰는
  // "이번이 GPS 시작 후 첫 픽스인가" 플래그 — 콜백을 이름 붙은 함수로
  // 분리하면서 함수 지역변수였던 것을 모듈 스코프로 옮겼다.
  let isFirstFix = true;

  function startGpsTracking() {
    const btn = document.getElementById('gpsBtn');
    const toast = document.getElementById('gpsToast');

    if (!navigator.geolocation) {
      alert('이 브라우저에서는 내 위치 기능을 사용할 수 없어요.\n\n📱 스마트폰 기본 브라우저(예: 삼성 인터넷, 크롬, Safari)로 다시 열어 주세요.');
      return;
    }

    // [회전 검증 디버그 로그 시작]
    directionDebugLogger.start();

    showHeadingArrow = true;

    // GPS를 새로 켤 때마다 필터를 초기화한다. 이전에 종료했던 위치의
    // 필터 상태가 남아있으면, 완전히 새로운 위치에서 다시 시작할 때
    // "예전 위치 → 새 위치"로 수렴하는 과도기 동안 오히려 부자연스럽게
    // 흔들리거나 지연될 수 있다.
    gpsFilterEngine.reset();
    // 방향값도 함께 초기화한다. 이걸 빠뜨리면 이전 세션에서 마지막으로
    // 확정됐던 방향값이 그대로 남아있어, GPS를 껐다 다시 켰을 때 안내가
    // 엉뚱한 각도에서 시작되는 재현성 버그의 원인이 되었다.
    gpsMovementHeading = null;
    isCurrentlyStopped = false;
    lastAlertedMilestoneKey = null;

    // 브라우저는 사용자가 직접 화면을 누른 순간에만 소리 재생을 허용한다.
    // 나중에 산속에서 이탈했을 때 소리가 안 나는 걸 막기 위해,
    // [내 위치] 버튼을 누른 지금 오디오를 미리 열어둔다.
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}

    btn.innerText = '🧭';
    btn.classList.add('active');
    requestWakeLock();
    toast.style.display = 'block';
    toast.className = 'gps-toast';
    toast.innerText = '📡 GPS 수신 중...';
    showToastBadge('📍 [내 위치 켜짐]\n화면이 자동으로 꺼지지 않습니다.');

    isFirstFix = true;

    watchId = navigator.geolocation.watchPosition(
      handleGpsPositionUpdate,
      handleGpsError,
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );

    startSleepMonitor();
  }

  // GPS 위치/에러 콜백을 이름 붙은 함수로 분리해둔다 — startGpsTracking()
  // 최초 시작뿐 아니라, 절전 모드에서 깨어날 때(restartWatchPositionOnly)
  // 도 동일한 콜백을 그대로 재사용해야 하기 때문이다(watchPosition을
  // 호출할 때마다 매번 새 익명 함수를 정의하면 두 경로의 로직이 어긋날
  // 위험이 있다).
  function handleGpsPositionUpdate(pos) {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const accuracy = Math.round(pos.coords.accuracy);
        lastKnownPos = { lat, lon }; // 화면 표시·이탈판정용 — 지연 없는 원시 좌표를 그대로 사용

        // 📡 GpsFilterEngine에 원시 픽스를 넣으면, 표준 파이프라인이
        // (1)오차 필터 → (2)정지/이동 판정 → (3)좌표 스무딩+방위각
        // 히스테리시스를 전부 내부에서 처리한 결과를 반환한다.
        // 반환값이 null이면 이번 픽스는 신뢰할 수 없어(오차 초과 또는
        // 너무 빠른 중복 수신) 버려진 것이므로 이번 갱신은 건너뛴다.
        const result = gpsFilterEngine.process({
          latitude: lat,
          longitude: lon,
          accuracy: accuracy,
          speed: pos.coords.speed,
          heading: pos.coords.heading,
          timestamp: Date.now()
        });

        if (!result) {
          // 신뢰할 수 없는 픽스 — 방향/거리 갱신 없이 다음 수신을 기다린다.
          return;
        }

        const wasStoppedBefore = isCurrentlyStopped;
        isCurrentlyStopped = result.isStopped;

        // 🔋 정지 진입/해제 시각 추적 — 절전 모드 진입 타이머(handleSleepTimerTick)
        // 가 이 시각 기준으로 5분 경과를 판정한다.
        if (isCurrentlyStopped && !wasStoppedBefore) {
          stopEnteredAt = Date.now();
        } else if (!isCurrentlyStopped) {
          stopEnteredAt = null;
        }

        // 줌 자동 전환(정지/이동 상태에 따른 확대/축소)은 제거했다 —
        // 정지 판정이 갈림길 근처에서 불안정하게 흔들리면 줌도 같이
        // 흔들려 오히려 혼란을 줬다. 화면의 확대/축소 버튼으로 사용자가
        // 직접 조절한다. 나중에 별도로 다시 설계할 수 있다.

        // 왕복 겹침 구간에서 올바른 트랙 세그먼트를 찾을 때(nearestPointOnTrail
        // 내부의 방향 하드필터) 쓸 최신 이동 방향.
        latestMovementBearingForTrailMatch = (!result.isStopped && result.bearing !== null)
          ? result.bearing
          : gpsMovementHeading;

        // 등산로(선분)까지의 최단거리 탐색 — 점까지의 거리가 아니라
        // 점들을 이은 산길 자체까지의 거리를 재야 GPX 점 간격이 넓은
        // 구간에서 산길 위에 서 있는데도 이탈로 오판되지 않는다.
        const nearest = nearestPointOnTrail(lat, lon, currentPoints);
        const minDistanceM = nearest.distance;
        const nearestPoint = nearest.point;
        const nearestIdx = nearest.index;

        updateOffTrailHysteresis(minDistanceM);

        // ⭐ 전면 재설계(2026-09-14): GPX가 경로 전체를 이미 알고 있으므로
        // "내가 지금 어느 방향을 보는가"는 더 이상 필요 없다. 정지/이동
        // 여부와 무관하게 GPS 이동방향(result.bearing)이 나올 때만 내 위치
        // 마커 화살표를 갱신하고, 갈림길 안내(다음 갈림길까지 거리 +
        // 미리 계산된 회전각)는 updateNavigationToast가 전담한다.
        if (!result.isStopped && result.bearing !== null) {
          gpsMovementHeading = result.bearing;
          lastGpsMoveTime = Date.now();
          // 내 위치 마커(userGpsMarker)는 Leaflet 마커라 #map의 자식
          // 레이어 안에 있다 — 구간 heading-up이 켜져 #map이
          // rotate(-mapRotationDeg)만큼 이미 돌아가 있으면, 화살표도
          // 그 회전을 부모로부터 그대로 물려받는다(자식 DOM 회전은 부모
          // 회전에 "더해지는" 방식으로 합산된다).
          // 화면상 최종 회전 = 부모(-mapRotationDeg) + 자식(적용할 값).
          // 우리가 원하는 최종 화면 회전은 절대방위 gpsMovementHeading이
          // "지도가 mapRotationDeg만큼 회전한 만큼" 어긋나 보이는 것이므로
          // (gpsMovementHeading - mapRotationDeg)이고, 이를 만족하는
          // 자식 회전값을 역산하면 정확히 gpsMovementHeading 그 자체가
          // 나온다(부모의 -mapRotationDeg와 상쇄됨) — 즉 renderGpsArrow에
          // 넘길 값은 회전 모드 여부와 무관하게 항상 result.bearing으로
          // 동일하다. 순수 계산으로 검증 완료(scratchpad/verify_headingup_rotation.js).
          renderGpsArrow(result.bearing);
        }

        // ⚠️ updateNavigationToast를 마커 생성/지도뷰 갱신보다 먼저
        // 호출해야 한다 — 구간이 바뀌는 프레임에 이 함수 내부에서
        // applySegmentRotation이 mapRotationDeg를 새 구간 방향으로
        // 갱신하는데, 순서가 반대이면 아래 computeMapCenterForOffset이
        // 아직 옛 mapRotationDeg(한 프레임 지연된 값)로 오프셋을 계산해
        // 지도 회전과 중심 오프셋 방향이 어긋나 구간 시작점이 화면
        // 엉뚱한 곳으로 튀는 버그가 있었다.
        updateNavigationToast(accuracy, minDistanceM, nearestIdx, nearestPoint);

        // 마커 생성 또는 이동
        if (!userGpsMarker) {
          const gpsIcon = L.divIcon({
            className: 'custom-gps-icon',
            html: createGpsIconHtml(getCurrentAbsHeadingForGuidance()),
            iconSize: [80, 80],
            iconAnchor: [40, 40]
          });
          userGpsMarker = L.marker([lat, lon], { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);
          {
            const z = Math.max(map.getZoom(), 16);
            const center = computeMapCenterForOffset(lat, lon, z);
            map.setView([center.lat, center.lon], z, { animate: true });
          }
          // 내 위치를 켜는 순간부터 GPS 켜짐 모드(자동 센터링)와 방향 화살표를 함께 시작한다.
          if (!isHeadingUp) {
            setHeadingUpMode(true, true);
          }
        } else {
          userGpsMarker.setLatLng([lat, lon]);
          if (isFirstFix) {
            const z = Math.max(map.getZoom(), 16);
            const center = computeMapCenterForOffset(lat, lon, z);
            map.setView([center.lat, center.lon], z, { animate: true });
          } else if (isHeadingUp && !isMapBeingDragged && !isMapDragReturnPending) {
            // 길찾기 회전 모드에서는 내 위치가 항상 지도 화면 중심에 고정.
            // 단, 사용자가 손가락으로 드래그해 다른 구간을 둘러보는 중이거나
            // (isMapBeingDragged) 손을 뗀 뒤 자동 복귀 유예 시간 중에는
            // (isMapDragReturnPending) GPS 픽스(약 1초 간격)가 화면을 곧바로
            // 원위치로 튕겨버리는 것을 막는다 — 유예 시간이 지나면
            // dragend 핸들러의 타이머가 알아서 복귀시킨다.
            // 🧭 구간 시작점이 화면 하단에, 내 위치가 화면 정중앙에 오도록
            // computeMapCenterForOffset으로 지도 중심을 살짝 뒤로 오프셋.
            const z = map.getZoom();
            const center = computeMapCenterForOffset(lat, lon, z);
            map.setView([center.lat, center.lon], z, { animate: false });
          }
        }
        isFirstFix = false;

        // 갈 방향 안내 (등산로 복귀 가이드 점선)
        if (nearestPoint && minDistanceM > 12) {
          const guideCoords = [[lat, lon], [nearestPoint.lat, nearestPoint.lon]];
          if (!guideLine) {
            guideLine = L.polyline(guideCoords, {
              color: '#00e676',
              weight: 3.5,
              dashArray: '6, 8',
              opacity: 0.95
            }).addTo(map);
          } else {
            guideLine.setLatLngs(guideCoords);
          }
        } else if (guideLine) {
          map.removeLayer(guideLine);
          guideLine = null;
        }
  }

  function handleGpsError() {
    const toast = document.getElementById('gpsToast');
    const btn = document.getElementById('gpsBtn');
    toast.className = 'gps-toast warning';
    toast.innerText = '⚠️ GPS 수신 실패 (위치 권한 확인)';
    btn.innerText = '📍';
    btn.classList.remove('active');
    watchId = null;
    showHeadingArrow = false;
    releaseWakeLock();
    stopCompass();
    if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
    stopSleepMonitor();
  }

  // ════════════════════════════════════════════════════════════════
  // 🔋 배터리 절전 모드
  //
  // 5분 이상 정지 상태가 지속되면(휴식, 식사, 사진 촬영 등) GPS 수신을
  // 잠시 멈춘다. 지도/마커/토스트/웨이크락 등 화면 상태는 그대로 두고
  // navigator.geolocation.watchId만 정리한다 — 사용자가 직접 끄는
  // stopGpsTracking()과 달리 UI 초기화는 하지 않는다.
  //
  // "다시 움직이기 시작했다"는 하이브리드 방식으로 감지한다:
  //  (1) 가속도 센서(devicemotion)의 walkVibrationLevel이 문턱을 넘으면
  //      즉시 GPS 재시작 — 주 경로, 반응이 빠르다.
  //  (2) 센서 권한이 없거나 devicemotion이 멈춘 기기를 위한 안전망으로,
  //      절전 중 SLEEP_WATCHDOG_MS(2분)마다 무조건 한 번씩 GPS를 잠깐
  //      켜서 실제 위치가 바뀌었는지 확인한다. 안 바뀌었으면 다시 절전.
  // ════════════════════════════════════════════════════════════════

  let sleepTickTimerId = null;

  function startSleepMonitor() {
    if (sleepTickTimerId) clearInterval(sleepTickTimerId);
    sleepTickTimerId = setInterval(handleSleepTimerTick, 10000); // 10초마다 정지 지속시간 체크
  }

  function stopSleepMonitor() {
    if (sleepTickTimerId) { clearInterval(sleepTickTimerId); sleepTickTimerId = null; }
    if (sleepWatchdogTimerId) { clearInterval(sleepWatchdogTimerId); sleepWatchdogTimerId = null; }
    isGpsSleeping = false;
    sleepCheckPos = null;
    sleepCheckStartedAt = null;
  }

  function handleSleepTimerTick() {
    if (isGpsSleeping || watchId === null) return; // 이미 절전 중이거나 GPS 자체가 꺼져 있으면 할 일 없음
    if (!isCurrentlyStopped || stopEnteredAt === null) return;
    if (Date.now() - stopEnteredAt >= SLEEP_AFTER_STOPPED_MS) {
      enterGpsSleep();
    }
  }

  function enterGpsSleep() {
    if (isGpsSleeping || watchId === null) return;
    isGpsSleeping = true;
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    showToastBadge('🔋 5분간 움직임이 없어 절전 모드로 전환합니다.\n다시 걸으면 자동으로 위치 추적이 재개됩니다.');

    // watchdog: 진동이 감지되지 않아도 2분마다 한 번씩 스스로 깨어나
    // 실제로 이동했는지 확인한다.
    if (sleepWatchdogTimerId) clearInterval(sleepWatchdogTimerId);
    sleepWatchdogTimerId = setInterval(runSleepWatchdogCheck, SLEEP_WATCHDOG_MS);
  }

  // 진동 감지(devicemotion)로 걷기 시작을 알아챘을 때 호출 — window의
  // devicemotion 리스너(walkVibrationLevel 갱신부)에서 함께 호출한다.
  function wakeGpsFromVibration() {
    if (!isGpsSleeping) return;
    exitGpsSleep('진동 감지');
  }

  // watchdog 주기마다 GPS를 짧게 켜서(약 8초) 실제로 위치가 바뀌었는지
  // 확인한다. 첫 픽스와 비교해 MIN_DISTANCE 이상 벌어지면 "진짜 이동"
  // 으로 보고 절전을 해제하고, 아니면 다시 절전 상태로 돌아간다.
  const SLEEP_WATCHDOG_CHECK_MS = 8000;
  const SLEEP_WATCHDOG_MOVE_THRESHOLD_M = 8;

  function runSleepWatchdogCheck() {
    if (!isGpsSleeping) return; // 이미 진동 감지로 깨어난 경우 등
    sleepCheckPos = null;
    sleepCheckStartedAt = Date.now();

    const checkWatchId = navigator.geolocation.watchPosition(
      pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (!sleepCheckPos) {
          sleepCheckPos = { lat, lon };
          return;
        }
        const movedM = haversineMeters(sleepCheckPos.lat, sleepCheckPos.lon, lat, lon);
        if (movedM >= SLEEP_WATCHDOG_MOVE_THRESHOLD_M) {
          navigator.geolocation.clearWatch(checkWatchId);
          exitGpsSleep('watchdog 이동 확인');
        }
      },
      () => { /* watchdog 확인용 픽스 실패는 조용히 무시 — 다음 주기에 재시도 */ },
      { enableHighAccuracy: true, maximumAge: 0, timeout: SLEEP_WATCHDOG_CHECK_MS }
    );

    // 확인 시간(SLEEP_WATCHDOG_CHECK_MS)이 지나도 못 깨어났으면(정지
    // 유지) 짧게 켰던 GPS를 다시 정리하고 절전 상태를 유지한다.
    setTimeout(() => {
      if (isGpsSleeping) {
        navigator.geolocation.clearWatch(checkWatchId);
      }
    }, SLEEP_WATCHDOG_CHECK_MS + 500);
  }

  // 절전 모드에서 깨어날 때 GPS만 다시 켠다 — startGpsTracking()처럼
  // 마커/토스트/웨이크락/디버그로거까지 전부 새로 초기화하지 않는다
  // (화면은 절전 중에도 그대로 떠 있었으므로 다시 만들 필요가 없다).
  function restartWatchPositionOnly() {
    isFirstFix = false; // 이미 추적 중이던 마커가 있으므로 "최초 진입" 카메라 점프는 하지 않는다
