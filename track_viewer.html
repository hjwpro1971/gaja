    watchId = navigator.geolocation.watchPosition(
      handleGpsPositionUpdate,
      handleGpsError,
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );
  }

  function exitGpsSleep(reason) {
    if (!isGpsSleeping) return;
    isGpsSleeping = false;
    if (sleepWatchdogTimerId) { clearInterval(sleepWatchdogTimerId); sleepWatchdogTimerId = null; }
    sleepCheckPos = null;
    sleepCheckStartedAt = null;
    stopEnteredAt = null; // 다시 정지 상태가 되더라도 5분을 새로 카운트

    if (watchId === null) {
      // startGpsTracking을 그대로 재사용하면 UI 전체가 "새로 켜는"
      // 상태로 리셋돼버리므로(웨이크락 재요청 등은 무해하지만 마커가
      // 다시 생성되며 잠깐 깜빡일 수 있다), 대신 watchPosition만 다시
      // 건다. startGpsTracking 내부의 콜백 로직을 그대로 재사용하기
      // 위해 restartWatchPositionOnly()를 호출한다.
      restartWatchPositionOnly();
    }
    showToastBadge(`📍 위치 추적을 재개합니다. (${reason})`);
  }

  // 느린 프록시에서 무한정 기다리지 않도록 각 시도마다 제한시간을 둔다.
  // 스마트폰 이동통신망에서는 corsproxy.io 응답이 수십 초씩 걸리는 경우가
  // 실제로 있었는데, 타임아웃이 없으면 다음 단계(더 빠를 수 있는 경로)로
  // 못 넘어가고 그 프록시 하나만 계속 기다리게 된다.
  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  // 외부 서버(네이버 등) 및 깃허브 tracks에서 안전하게 GPX를 가져오는 고성능 로더
  async function fetchGPXFile(targetUrl) {
    let cleanUrl = targetUrl.trim();
    // %25EA 등 이중 인코딩된 URL을 완전 해독 후 올바른 1회 인코딩 적용
    for (let i = 0; i < 3; i++) {
      try {
        const next = decodeURIComponent(cleanUrl);
        if (next === cleanUrl) break;
        cleanUrl = next;
      } catch(e) { break; }
    }
    try {
      cleanUrl = encodeURI(cleanUrl);
    } catch(e) {}

    const errors = [];

    // 1. 직접 다운로드 시도 (GitHub Pages, Raw, CORS 허용 서버 등)
    try {
      const res = await fetchWithTimeout(cleanUrl, 5000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`1) 직접 다운로드: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`1) 직접 다운로드 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`1) 직접 다운로드 실패: ${e.message || '네트워크/CORS 제한'}`);
    }

    // 2. 🌟 핵심 복구 기능: 네이버 블로그 링크가 만료(403)되었을 때
    // URL 속 파일명(예: 남덕유산_20250501.gpx)을 추출하여 우리 tracks 저장소에서 즉시 대체 로드!
    try {
      const match = cleanUrl.match(/([^\/\?#&=:"']+\.gpx)/i);
      if (match && match[1]) {
        let fname = match[1];
        try { fname = decodeURIComponent(fname); } catch(e) {}
        const fallbacks = [
          `./tracks/${encodeURIComponent(fname)}`,
          `https://hjwpro1971.github.io/gaja/tracks/${encodeURIComponent(fname)}`,
          `https://raw.githubusercontent.com/hjwpro1971/gaja/main/tracks/${encodeURIComponent(fname)}`
        ];
        for (const fb of fallbacks) {
          try {
            const res = await fetchWithTimeout(fb, 5000);
            if (res.ok) {
              const text = await res.text();
              if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
                console.log('대체 트랙 저장소에서 복구 성공:', fb);
                return text;
              }
            }
          } catch(e) {}
        }
        errors.push(`2) 저장소 대체 복구: '${fname}' 파일 없음`);
      } else {
        errors.push(`2) 저장소 대체 복구: 파일명 추출 불가`);
      }
    } catch(e) {
      errors.push(`2) 저장소 대체 복구 실패: ${e.message}`);
    }

    // 3. allorigins 공개 프록시 시도
    try {
      const res = await fetchWithTimeout('https://api.allorigins.win/raw?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`3) 공개 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`3) 공개 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`3) 공개 프록시 실패: ${e.message || '타임아웃'}`);
    }

    // 4. 나스 서버 로컬 프록시 시도
    try {
      const res = await fetchWithTimeout('/api/gpx-proxy?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`4) 로컬 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`4) 로컬 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`4) 로컬 프록시 실패: ${e.message || '연결 불가'}`);
    }

    throw new Error('모든 방식으로 등산로 파일을 불러오지 못했습니다.\n[상세 사유]\n' + errors.join('\n'));
  }

  window.addEventListener('DOMContentLoaded', async () => {
    initMap();

    const urlParams = new URLSearchParams(window.location.search);
    const hadGpxUrl = !!(urlParams.get('url') || urlParams.get('file'));
    let gpxUrl = urlParams.get('url') || urlParams.get('file');
    const courseName = urlParams.get('name');
    let decodedCourseName = courseName ? decodeURIComponent(courseName) : '';

    if (!decodedCourseName && gpxUrl) {
      const m = decodeURIComponent(gpxUrl).match(/([^\/\?#&=:"']+\.gpx)/i);
      if (m && m[1]) {
        decodedCourseName = m[1].replace(/\.gpx$/i, '').replace(/_\d{8}$/, '').replace(/_{2,}/g, ' ').replace(/_/g, ' ').trim();
      }
    }
    if (!decodedCourseName) decodedCourseName = '등산로 코스';

    // 페이지 진입 즉시 상단 헤더 및 창 타이틀에 산 이름 반영
    const trailEl = document.getElementById('trailName');
    if (trailEl) trailEl.innerText = '🚩 ' + decodedCourseName;
    let pageTitle = decodedCourseName;
    if (!pageTitle.includes('등산지도') && !pageTitle.includes('등산로') && !pageTitle.includes('지도')) {
      pageTitle += ' 등산지도';
    }
    document.title = pageTitle;
    const appleMeta = document.getElementById('appleAppTitle');
    if (appleMeta) appleMeta.content = pageTitle;

    // 같은 코스를 다시 열 때 매번 외부 프록시를 거쳐 GPX를 재다운로드하지
    // 않도록, url 파라미터가 있으면 먼저 localStorage에 같은 원본 GPX
    // 주소(sourceUrl)로 저장된 좌표가 있는지 찾아본다. 코스명이 아니라
    // 반드시 원본 주소로 비교해야 한다 — "남덕유산_20250501.gpx"와
    // "남덕유산_20251217.gpx"처럼 코스명은 같아도 실제로는 전혀 다른 GPX인
    // 경우가 있어, 이름만 보고 캐시를 재사용하면 엉뚱한 지도가 뜨는 버그가
    // 있었다.
    // 🌟 핵심: 다운받기 전에 캐시에 이미 저장되어 있는지 먼저 체크!
    // 동일한 GPX 파일명 또는 코스명이 이미 있으면 외부 다운로드를 하지 않고 캐시에서 즉시 복원 (0.001초 로딩 & 중복 방지)
    if (gpxUrl) {
      const loadingEl = document.createElement('div');
      loadingEl.id = 'gpxLoadingBadge';
      loadingEl.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.25); backdrop-filter:blur(4px); pointer-events:none;';
      loadingEl.innerText = '🔄 등산 코스 불러오는 중...';
      document.body.appendChild(loadingEl);

      try {
        // 항상 원격 최신본 다운로드를 시도하여 에디터 수정사항이 즉시 반영되도록 함.
        const xml = await fetchGPXFile(gpxUrl);
        const points = parseGPX(xml);
        drawRoute(points, decodedCourseName, gpxUrl);
      } catch(err) {
        console.warn('원격 GPX 다운로드 실패. 오프라인 캐시 폴백 시도:', err);
        // 인터넷이 끊긴 산속이거나 서버 오류 시 로컬 캐시에서 꺼내어 그려준다 (완벽한 오프라인 지원).
        const cached = findSavedRoute(decodedCourseName, gpxUrl);
        if (cached) {
          console.log('오프라인 캐시에서 등산로 복원 완료:', cached.name);
          if (cached.waypoints) cached.points.waypoints = cached.waypoints;
          drawRoute(cached.points, cached.name, cached.sourceUrl || gpxUrl, true);
          
          const fastBadge = document.createElement('div');
          fastBadge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:99999; background:rgba(27,94,32,0.95); color:#ffffff; font-size:13px; font-weight:800; padding:10px 20px; border-radius:24px; box-shadow:0 4px 16px rgba(0,0,0,0.3); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.5s;';
          fastBadge.innerHTML = '⚡ 오프라인 저장된 코스를 열었습니다';
          document.body.appendChild(fastBadge);
          setTimeout(() => {
            fastBadge.style.opacity = '0';
            setTimeout(() => fastBadge.remove(), 500);
          }, 1800);
        } else {
          alert('등산로를 불러오지 못했습니다.\n\n인터넷 연결을 확인하고 다시 시도해 주세요.\n(또는 내 코스 목록에서 열어보세요)');
          showSavedRouteList('저장된 GPX 목록을 불러왔습니다.');
        }
      } finally {
        const badge = document.getElementById('gpxLoadingBadge');
        if (badge) badge.remove();
      }
    } else if (!hadGpxUrl) {
      showSavedRouteList();
    }


  });
</script>
