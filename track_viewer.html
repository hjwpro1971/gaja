  // ⚠️ 이유(사용자 재현): "바로가기 아이콘을 클릭해서 산행맵을 보다가
  // 잠시 다른 것[다른 앱으로 전환]. 또는 핸드폰 꺼진 후 다시 켜서
  // 바로가기 아이콘을 클릭하면 산행맵이 처음부터 다시 시작해... 산행지
  // 선택부터 해야하는게 문제야... 홈화면에 있는 아이콘을 클릭하더라도
  // GPS 계산하고 다시 내 위치를 잡아야지 왜 산행지 선택부터 나오냐고."
  //
  // 원인: iOS의 "홈 화면에 추가"는 manifest.json의 start_url을 쓰지
  // 않고, 사용자가 "추가"를 누른 그 순간의 실제 URL을 그대로 고정해
  // 기억한다(Android Chrome과 다른 동작). 사용자가 코스 선택 화면
  // (쿼리 없는 URL)에서 "홈 화면에 추가"를 눌렀다면, 그 아이콘은
  // 영원히 그 쿼리 없는 URL로 열려 매번 "산행지 선택" 화면부터
  // 시작됐다 — GPS 자체는 화면이 다시 보일 때(visibilitychange) 정상
  // 재계산되지만(이건 의도대로 동작), 애초에 "어떤 코스를 보고
  // 있었는지" 자체가 유실되는 게 진짜 문제였다.
  //
  // 해결: 코스를 열 때마다(drawRoute -> 이 함수 호출 지점) 그 코스의
  // 이름/원본 URL을 localStorage에 별도로 기록해두고, 페이지가 쿼리
  // 파라미터 없이 열렸을 때(DOMContentLoaded의 hadGpxUrl===false 분기)
  // 이 기록을 읽어 자동으로 그 코스를 이어서 연다 — 홈 화면 아이콘이
  // 어떤 URL을 가리키든 상관없이 항상 "마지막으로 보던 코스"로
  // 복원된다(다른 일반 앱들이 상태를 이어가는 것과 동일한 체감).
  const LAST_OPENED_COURSE_KEY = 'gajago_last_opened_course_v1';
  function saveLastOpenedCourse(courseName, sourceUrl) {
    if (!sourceUrl) return; // 원본 URL이 없는 코스(파일 직접 업로드 등)는 재접속 시 다시 열 방법이 없으므로 기록하지 않는다
    try {
      localStorage.setItem(LAST_OPENED_COURSE_KEY, JSON.stringify({ name: courseName, sourceUrl }));
    } catch(e) {}
  }
  function loadLastOpenedCourse() {
    try {
      const raw = localStorage.getItem(LAST_OPENED_COURSE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
  }

  function saveRouteToStorage(courseName, sourceUrl, points) {
    try {
      const newRoute = {
        name: courseName,
        sourceUrl: sourceUrl || null,
        points: points,
        waypoints: points.waypoints || [],
        savedAt: Date.now()
      };
      let list = loadSavedRoutes();
      // 같은 코스가 이미 있으면 기존 항목을 모두 제거하고 최신으로 맨 앞에 1개만 등록
      list = list.filter(r => !isSameRoute(r, newRoute));
      list.unshift(newRoute);
      if (list.length > MAX_SAVED_ROUTES) list = list.slice(0, MAX_SAVED_ROUTES);
      localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(list));
      // 방금 밀려난 코스가 있다면 그 타일도 정리한다(비동기, 결과를 기다리지 않음).
      cleanupEvictedCourseTiles().catch(() => {});
    } catch(e) {
      try {
        let list = loadSavedRoutes();
        list = list.slice(0, Math.ceil(list.length / 2));
        const newRoute = { 
          name: courseName, 
          sourceUrl: sourceUrl || null, 
          points: points, 
          waypoints: points.waypoints || [], 
          savedAt: Date.now() 
        };
        list = list.filter(r => !isSameRoute(r, newRoute));
        list.unshift(newRoute);
        localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(list));
      } catch(e2) {}
    }
  }

  function findSavedRoute(courseName, url) {
    const target = { name: courseName, sourceUrl: url };
    return loadSavedRoutes().find(r => isSameRoute(r, target)) || null;
  }

  // 경로 그리기
  // sourceUrl: 로컬 저장소 키로 쓰는 GPX 원본 주소. 코스명(courseName)만으로는
  // 서로 다른 GPX가 같은 이름으로 뽑혀 캐시가 뒤섞이는 문제가 있었다 —
  // 반드시 원본 URL로 구분해야 한다.
  function drawRoute(points, courseName, sourceUrl, isFromCache) {
    if (!map || !points.length) return;
    currentPoints = points;
    resetTrailSearchWindow(); // 새 코스이므로 이전 코스의 탐색 위치 기억을 초기화
    resetGajaMapRotationState(); // 새 코스이므로 지도 회전 기준점(lastRecenterDistance)도 초기화
    gpsFilterEngine.reset(); // 이전 위치의 필터 상태가 남아있으면 새 코스 시작 시 엉뚱한 곳으로 수렴하려는 과도기 흔들림이 생길 수 있어 초기화
    cumulativeDistances = buildCumulativeDistances(points); // 5단계: 누적거리 배열 미리 계산
    currentSegmentBearings = buildSegmentBearings(points); // 내 위치 화살표 전용 — 선분별 GPX 순방향 미리 계산
    lastAlertedMilestoneKey = null; // 새 코스이므로 갈림길 알람도 처음부터 다시 트리거
    remainingBeepThresholds = null;

    if (polyline) map.removeLayer(polyline);
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    routeBadgeEls = []; // 이전 코스의 배지 마커 참조도 함께 비움(markers와 같은 객체들이지만 회전 갱신용으로 별도 보관)

    // 🌊 경로 곡선 스무딩(2026-09-21, #3): GPX 원본 점 간격이 넓은
    // 구간에서 궤적이 꺾인 직선들로 깨져 보이는 문제 — 실제 데이터
    // (currentPoints/cumulativeDistances, GPS 매칭·거리 계산 등)는
    // 원본 그대로 두고, 화면에 그리는 선(latlngs)만 Catmull-Rom
    // 스플라인으로 보간해 시각적으로 부드럽게 만든다. GPX 파일이나
    // 다른 계산 로직에는 전혀 영향 없음.
    const latlngs = smoothPolylinePoints(points);

    // 깔끔하고 선명한 등산로 빨간선
    polyline = L.polyline(latlngs, {
      color: '#d32f2f',
      weight: 5,
      opacity: 0.95
    }).addTo(map);

    fitRoute();

    // 갈림길/봉우리 등 라벨(divIcon)은 지도(#map)의 자식 레이어에 그려지므로
    // 구간회전(heading-up)이 걸리면 부모 회전을 그대로 물려받아 텍스트가
    // 비스듬히 돌아간다 — 밀집 구간(갈림길이 몇 미터 간격으로 몰린 곳)에서
    // 라벨이 서로 겹쳐 알아볼 수 없는 상태로 보이던 원인 중 하나(사용자
    // 실기기 재현). 라벨 DOM에 지도 회전과 반대(+appliedMapRotationDeg)로
    // 미리 역회전을 걸어두면 최종 화면 회전이 0으로 상쇄돼 항상 화면
    // 기준 수평으로 보인다 — applySegmentRotation이 회전할 때마다 아래
    // routeBadgeEls에 등록된 모든 라벨에 이 보정을 다시 걸어준다.
    const makeBadge = (lat, lon, title, bg) => {
      const icon = L.divIcon({
        className: 'custom-badge-icon',
        html: `<div class="route-badge" style="background:${bg}; transform: rotate(${appliedMapRotationDeg}deg);">${title}</div>`,
        iconAnchor: [30, 12]
      });
      const marker = L.marker([lat, lon], { icon }).addTo(map);
      routeBadgeEls.push(marker);
      return marker;
    };

    currentMilestones = buildMilestones(points, points.waypoints, cumulativeDistances);
    if (currentMilestones && currentMilestones.length > 0) {
      currentMilestones.forEach(m => {
        if (!m.hideMarker) {
          markers.push(makeBadge(m.lat, m.lon, `${m.icon} ${m.name}`, m.color));
        }
      });
    } else {
      const start = points[0];
      const end = points[points.length - 1];
      markers.push(makeBadge(start.lat, start.lon, '🚩 들머리', '#1976d2'));
      markers.push(makeBadge(end.lat, end.lon, '🏁 날머리', '#d32f2f'));
      const withEle = points.filter(p => p.ele !== null);
      if (withEle.length) {
        const peak = withEle.reduce((a, b) => b.ele > a.ele ? b : a);
        markers.push(makeBadge(peak.lat, peak.lon, `⛰️ 정상 (${Math.round(peak.ele)}m)`, '#e65100'));
      }
    }

    // 거리 및 고도 정보 계산 생략 (지도 화면 극대화)

    if (courseName) {
      document.getElementById('trailName').innerText = '🚩 ' + courseName;
      let cleanTitle = courseName.replace(/^🚩\s*/, '').trim();
      if (!cleanTitle.includes('등산지도') && !cleanTitle.includes('등산로') && !cleanTitle.includes('지도')) {
        cleanTitle += ' 등산지도';
      }
      document.title = cleanTitle;
      const meta = document.getElementById('appleAppTitle');
      if (meta) meta.content = cleanTitle;
    }

    // 로컬 저장소에 코스 좌표 영구 보관 (산속에서 재접속 시 0.01초 만에 즉시 복원,
    // 여러 코스를 동시에 보관해 오프라인 상태에서도 목록에서 골라볼 수 있다)
    saveRouteToStorage(courseName, sourceUrl, points);
    // 홈 화면 아이콘이 쿼리 없는 URL로 열려도 이 코스를 이어서 열 수
    // 있도록 "마지막으로 연 코스"도 별도로 기록(saveLastOpenedCourse
    // 정의부 주석 참고).
    saveLastOpenedCourse(courseName, sourceUrl);

    document.getElementById('emptyModal').style.display = 'none';

    // 지도가 열리는 즉시 백그라운드에서 오프라인 등산지도 자동 캐시 저장!
    // 단, 이 코스가 이전에 이미 완전히 저장되어 있다면 autoSaveOfflineMap
    // 내부에서 완료 플래그를 확인해 네트워크 접근 없이 즉시 반환한다.
    const tileCourseKey = getTileCourseKey(courseName, sourceUrl);
    autoSaveOfflineMap(points, tileCourseKey);

    // 🚀 등산 시작 확인 버튼(2026-09-25, 사용자 지시): 코스가 열리면
    // GPS를 곧바로 자동 시작하던 이전 방식(opt-in 자동시작) 대신, "등산
    // 시작" 버튼을 띄워 사용자가 직접 눌러야 GPS가 켜지도록 되돌렸다.
    // 진입 경로(외부 링크로 바로 옴 / 메뉴에서 코스 선택)와 무관하게
    // drawRoute()가 호출되는 모든 지점에서 공통으로 뜬다. 5초 안에
    // 누르지 않으면 GPS를 켜지 않은 채 조용히 사라진다(showStartHikeOverlay
    // 정의부 주석 참고). 이미 GPS가 켜져 있으면(코스를 다시 불러온 경우
    // 등) 뜨지 않는다.
    //
    // 저전력 모드 완전 비활성화(2026-09-23) — 예약값이 남아있어도 무시
    lowPowerModeEnabled = false;
    isLowPowerPolling = false;
    try { localStorage.removeItem('gajago_low_power_mode'); } catch(e) {}

    // 🏁 산행 세션 자동 복귀(2026-09-25, 사용자 지시: "등산 시작은 한번
    // 하면 돼. 매번 왜 해? ... 그래서 등산완료 버튼이 필요해") — 같은
    // 코스로 진행 중인 산행 세션이 이미 있으면(바로가기 아이콘 재클릭,
    // 앱 재진입 등) "등산 시작" 확인 버튼을 다시 띄우지 않고 곧바로
    // GPS를 재개한다. 다른 코스를 새로 열었거나 세션이 없으면(진짜 첫
    // 시작) 기존처럼 확인 버튼을 띄운다.
    const routeKey = makeRouteKey(courseName, sourceUrl);
    currentRouteKey = routeKey;
    const session = loadHikingSession();
    if (session && session.routeKey === routeKey) {
      if (watchId === null && !isLowPowerPolling) {
        startGpsTracking();
      }
    } else if (watchId === null && !isLowPowerPolling) {
      showStartHikeOverlay();
    }
  }

  // 코스를 화면 시각적 정중앙에 정확히 배치 (상단 헤더 여백 보정)
  // ⚠️ fitBounds가 유발하는 zoomstart/zoomend는 사용자가 손가락으로
  // 지도를 조작한 게 아니므로, initMap()의 zoomend 핸들러에 걸린
  // "드래그 후 자동복귀 유예"(isMapDragReturnPending, 7초)가 걸리지
  // 않도록 억제한다 — 억제하지 않으면 코스 로드 직후 원점 판정 자체가
  // 7초간 막혀 첫 원점이 지연되거나 엉뚱한 지점에서 잡히는 버그가
  // 있었다(Playwright 시뮬레이션으로 재현·확인).
  function fitRoute() {
    if (!map || !polyline) return;
    isProgrammaticZoomInProgress = true;
    map.fitBounds(polyline.getBounds(), {
      paddingTopLeft: [40, 85],
      paddingBottomRight: [40, 45]
    });
    // fitBounds의 zoom/pan 애니메이션이 모두 끝난 뒤(moveend)에만
    // 플래그를 내린다 — zoomend 직후 바로 내리면 이어지는 panBy 애니메이션
    // 중 또 다른 zoomend가 발생하는 경우를 놓칠 수 있다.
    map.once('moveend', () => {
      isProgrammaticZoomInProgress = false;
    });
  }

  // 코스별 타일 다운로드 완료 여부를 기록하는 플래그.
  // 기존에는 좌표(saveRouteToStorage)만 저장됐고 타일 캐싱 성공 여부는
  // 어디에도 남지 않아, 코스를 다시 열 때마다 이미 받은 타일까지
  // cache.match()로 수백 번씩 재확인했다. 완료 플래그가 있으면 이 확인을
  // localStorage 조회 1번으로 끝내고, 온전히 끝난 코스는 네트워크를
  // 아예 건드리지 않는다.
  const TILES_SAVED_KEY = 'gajago_tiles_saved_v1';
  // window.__GAJA_CACHE_NAME은 head의 인라인 스크립트(파일 최상단)가
  // 파싱 시점에 이미 세팅해두므로 이 시점엔 항상 존재해야 하지만,
  // 혹시라도 undefined면 caches.open(undefined)로 엉뚱한 캐시를 여는
  // 사고를 막기 위해 sw.js의 현재 CACHE_NAME과 동일한 값을 최후
  // fallback으로 둔다(둘 다 매 배포마다 함께 갱신).
  const TILE_CACHE_NAME = window.__GAJA_CACHE_NAME || 'gaja-trail-cache-v154';

  function getTileSaveStatus(courseKey) {
    try {
      const raw = localStorage.getItem(TILES_SAVED_KEY);
      const map = raw ? JSON.parse(raw) : {};
      return map[courseKey] || null; // { status: 'complete'|'partial', savedAt, tileCount, failedCount }
    } catch(e) { return null; }
  }

  function setTileSaveStatus(courseKey, statusObj) {
    try {
      const raw = localStorage.getItem(TILES_SAVED_KEY);
      const map = raw ? JSON.parse(raw) : {};
      map[courseKey] = statusObj;
      localStorage.setItem(TILES_SAVED_KEY, JSON.stringify(map));
    } catch(e) {}
  }

  // 코스명+원본URL로 고유 키 생성 (기존 normalizeCourseKey 재사용)
  function getTileCourseKey(courseName, sourceUrl) {
    return normalizeCourseKey(courseName, sourceUrl) || (sourceUrl || courseName || 'unknown');
  }

  // 저장된 코스 목록(saved_hiking_routes_v1, 최대 MAX_SAVED_ROUTES개)에서
  // 밀려나 더 이상 존재하지 않는 코스의 오프라인 지도 타일을 Cache Storage에서
  // 지운다. 타일 캐시(window.__GAJA_CACHE_NAME, sw.js의 CACHE_NAME과 동일)에는
  // 자동 삭제가 없어서, 여러 산을 다니며 코스를 계속 열어보면 오래된
  // 코스의 타일이 스마트폰 저장공간에 무한정 쌓이는 문제가 있었다 —
  // 코스 목록에서 밀려나는 시점(=더 이상 이 앱에서 접근할 방법이 없어지는
  // 시점)에 맞춰 정리한다.
  async function cleanupEvictedCourseTiles() {
    if (!('caches' in window)) return;

    let tileStatusMap;
    try {
      const raw = localStorage.getItem(TILES_SAVED_KEY);
      tileStatusMap = raw ? JSON.parse(raw) : {};
    } catch(e) { return; }

    const trackedKeys = Object.keys(tileStatusMap);
    if (trackedKeys.length === 0) return;

    const activeKeys = new Set(
      loadSavedRoutes().map(r => getTileCourseKey(r.name, r.sourceUrl))
    );
    const evictedKeys = trackedKeys.filter(k => !activeKeys.has(k));
    if (evictedKeys.length === 0) return;

    try {
      const cache = await caches.open(TILE_CACHE_NAME);
      for (const key of evictedKeys) {
        const entry = tileStatusMap[key];
        const urls = (entry && entry.tileUrls) || [];
        for (const url of urls) {
          await cache.delete(url).catch(() => {});
        }
        delete tileStatusMap[key];
      }
      localStorage.setItem(TILES_SAVED_KEY, JSON.stringify(tileStatusMap));
      console.log(`🧹 저장 목록에서 밀려난 코스 ${evictedKeys.length}개의 오프라인 타일 정리 완료`);
    } catch(e) {}
  }

  // 지도가 열리면 자동으로 주변 지형도 타일을 백그라운드 캐싱 (산속 통신두절 대비)
  let isSavingCache = false;
  async function autoSaveOfflineMap(points, courseKey) {
    if (isSavingCache || !points || !points.length) return;

    // ⭐ 이미 완전히 저장된 코스면 네트워크 접근 자체를 하지 않는다.
    if (courseKey) {
      const existing = getTileSaveStatus(courseKey);
      if (existing && existing.status === 'complete') {
        console.log('⚡ 이미 오프라인 지도가 완전히 저장된 코스 — 재다운로드 생략:', courseKey);
        return;
      }
    }

    // 산속에서 데이터가 아예 안 터지는 상태라면 시도 자체가 배터리 낭비다.
    if (navigator.onLine === false) {
      console.log('📡 오프라인 상태 — 타일 다운로드 시도 안 함');
      return;
    }

    isSavingCache = true;

    // 상단 자동 저장 미니 알림 뱃지
    let badge = document.getElementById('offlineAutoBadge');
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'offlineAutoBadge';
      badge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#ffffff; font-size:12px; font-weight:700; padding:8px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.2); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.6s ease;';
      document.body.appendChild(badge);
    }
    badge.style.opacity = '1';
    badge.innerText = '💾 오프라인 등산지도 자동 저장 중... (0%)';

    // 경로의 기하학적 중심 계산
    let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
    points.forEach(p => {
      if (p.lat < minLat) minLat = p.lat;
      if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon;
      if (p.lon > maxLon) maxLon = p.lon;
    });

    const centerLat = (minLat + maxLat) / 2;
    const centerLon = (minLon + maxLon) / 2;

    // 위도 및 경도 방향의 실제 거리(km) 계산
    const latDistKm = (maxLat - minLat) * 111.0;
    const lonDistKm = (maxLon - minLon) * 111.0 * Math.cos(centerLat * Math.PI / 180);

    // 한쪽으로 치우치지 않도록 더 긴 축 기준으로 동서남북 사방 동일 반경(정사각형 대칭) 설정
    const maxHalfKm = Math.max(latDistKm, lonDistKm) / 2.0;
    const padKm = 1.6; // 사방 균일 여유 마진 (약 1.6km)
    const radiusKm = maxHalfKm + padKm;

    const dLat = radiusKm / 111.0;
    const dLon = radiusKm / (111.0 * Math.cos(centerLat * Math.PI / 180));

    const symMinLat = centerLat - dLat;
    const symMaxLat = centerLat + dLat;
    const symMinLon = centerLon - dLon;
    const symMaxLon = centerLon + dLon;

    // 사방 대칭 정사각형 영역으로 줌 13~17 타일 목록 생성
    const tileUrls = [];
    for (let z = 13; z <= 17; z++) {
      const tiles = getTilesForBounds(symMinLat, symMaxLat, symMinLon, symMaxLon, z);
      tiles.forEach(t => {
        tileUrls.push(`https://map.pstatic.net/nrb/styles/terrain/${naverTileVersion}/${t.z}/${t.x}/${t.y}.png`);
      });
    }

    const total = tileUrls.length;

    try {
      const cache = await caches.open(TILE_CACHE_NAME);
      await cache.addAll(['./track_viewer.html', './leaflet.js', './leaflet.css']).catch(() => {});

      let completed = 0;
      let failedCount = 0;
      const batchSize = 12;
      for (let i = 0; i < tileUrls.length; i += batchSize) {
        const batch = tileUrls.slice(i, i + batchSize);
        await Promise.all(batch.map(async url => {
          try {
            const match = await cache.match(url);
            if (!match) {
              const res = await fetch(url, { mode: 'cors' });
              if (res.ok) {
                await cache.put(url, res);
              } else {
                failedCount++;
              }
            }
          } catch(e) {
            failedCount++;
          }
          completed++;
        }));
        const pct = Math.round((completed / total) * 100);
        badge.innerText = `💾 오프라인 등산지도 자동 저장 중... (${pct}%)`;
      }

      if (failedCount === 0) {
        badge.innerText = '✅ 오프라인 등산지도 저장 완료! (산속 통신두절 대비)';
        badge.style.background = 'rgba(46,125,50,0.95)';
        // 완전 성공 — 다음부터는 이 코스를 열어도 재다운로드하지 않는다.
        // tileUrls도 함께 저장해둬야, 나중에 이 코스가 저장 목록에서
        // 밀려날 때 정확히 이 타일들만 캐시에서 지울 수 있다(정리 로직 참고).
        if (courseKey) {
          setTileSaveStatus(courseKey, { status: 'complete', savedAt: Date.now(), tileCount: total, failedCount: 0, tileUrls });
        }
      } else {
        badge.innerText = `⚠️ 오프라인 저장 완료 (일부 타일 ${failedCount}개 실패 — 오프라인 시 해당 구간 미표시될 수 있음)`;
        badge.style.background = 'rgba(230,81,0,0.95)';
        // 일부만 성공 — 다음에 다시 열면 실패한 부분을 포함해 재시도할 수 있도록
        // 'partial'로 기록한다 (완전 재다운로드는 아니지만 재시도 여지를 남김).
        if (courseKey) {
          setTileSaveStatus(courseKey, { status: 'partial', savedAt: Date.now(), tileCount: total, failedCount, tileUrls });
        }
      }
      // 밀려난 오래된 코스가 있으면 그 코스의 타일들을 캐시에서 정리한다
      // (저장공간이 무한정 쌓이지 않도록). 실패해도 오프라인 지도 저장
      // 자체는 이미 끝났으므로 조용히 넘어간다.
      cleanupEvictedCourseTiles().catch(() => {});
      setTimeout(() => {
        badge.style.opacity = '0';
        setTimeout(() => badge.remove(), 600);
      }, 3000);
    } catch(err) {
      console.warn('오프라인 캐시 자동 저장 실패:', err);
      badge.remove();
    } finally {
      isSavingCache = false;
    }
  }

  // 모달 닫기
  function closeModal() {
    const modal = document.getElementById('emptyModal');
    if (modal) modal.style.display = 'none';
  }

  // 🌟 저장된 등산로 코스 목록 팝업 열기 (전역 함수로 언제든지 즉시 호출 가능)
  function showSavedRouteList(message) {
    const routes = loadSavedRoutes();
    const modal = document.getElementById('emptyModal');
    if (!modal) return;
    const desc = document.getElementById('modalDesc');
    const listEl = document.getElementById('savedRouteList');

    if (!routes || routes.length === 0) {
      if (desc) desc.innerHTML = message || '현재 오프라인으로 저장된 등산로 코스가 없습니다.<br><br>💡 GPX 파일을 열거나 블로그 등산지도 링크를 누르시면 자동으로 저장됩니다.';
      if (listEl) {
        listEl.innerHTML = '';
        listEl.style.display = 'none';
      }
      modal.style.display = 'flex';
      return;
    }

    if (desc) desc.innerHTML = message || '저장된 코스를 터치하시면 오프라인 지도로 즉시 열립니다.';
    if (listEl) {
      listEl.innerHTML = routes.map((r, i) => {
        const dateStr = r.savedAt ? new Date(r.savedAt).toLocaleDateString('ko-KR') : '';
        const safeName = (r.name || '등산 코스').replace(/</g, '&lt;');
        return `
          <div class="saved-route-item" onclick="openSavedRouteByIndex(${i})">
            <div class="saved-route-info">
              <div class="saved-route-name">⛰️ ${safeName}</div>
              <div class="saved-route-date">저장일: ${dateStr}</div>
            </div>
            <button type="button" class="saved-route-del" onclick="deleteSavedRouteByIndex(event, ${i})" title="이 코스 삭제">
              🗑️
            </button>
          </div>
        `;
      }).join('');
      listEl.style.display = 'flex';
    }
    modal.style.display = 'flex';
  }
  window.showSavedRouteList = showSavedRouteList;

  function openSavedRouteByIndex(index) {
    const routes = loadSavedRoutes();
    const r = routes[index];
    if (!r) return;
    closeModal();
    if (r.waypoints) r.points.waypoints = r.waypoints;
    drawRoute(r.points, r.name, r.sourceUrl);
  }
  window.openSavedRouteByIndex = openSavedRouteByIndex;

  // 🏁 날머리 도착 자동 GPS 종료 — updateNavigationToast에서 사용.
  const ARRIVAL_DISTANCE_M = 20;       // 날머리까지 이 거리 이내면 "도착"
  const ARRIVAL_MIN_TRAVELED_M = 50;   // 원점회귀 코스 출발 직후 오탐 방지용 최소 이동거리

  // ↩️ 왕복/원점회귀 코스 역주행(되돌아가는 중) 감지는 이제
  // updateTrackDirection(위, isReversingOnTrail 선언부 근처)이 전담한다.
  // 예전 updateReversingState는 traveledDist 증감에 gpsMovementHeading
  // 보강까지 섞어 별도로 isReversingOnTrail을 갱신했는데, 이게
  // updateTrackDirection(트랙 매칭 확정 시점에만 갱신)과 서로 다른
  // 입력·속도로 같은 변수를 건드리는 두 번째 경로가 되어 "지도는
  // 맞는데 화살표는 반대" 같은 불일치의 원인이었다(gajamap.md 대원칙
  // 2·3번 위반 — GPS 이동방위각이 방향 판정에 섞임). 함수 자체를
  // 제거했다.

  // 🧭 구간회전("원점 잡기") 트리거 — updateNavigationToast 본문과
  // 별도로 분리했다. 원래는 updateNavigationToast의 "온트레일" 분기
  // 안에서만 계산됐는데, 들머리 진입 직후처럼 GPS 정확도가 나쁘거나
  // 위치가 잠깐 튀어 "이탈 상태"로 먼저 분류되면 그 분기가 조기
  // return해버려 회전 판정 자체가 한 번도 실행되지 않는 문제가 있었다
  // (사용자 재현: "들머리 들어갈때 원점이 잘 안 잡혀"). 이탈 여부와
  // 무관하게 traveledDist만 있으면 항상 이 함수를 호출해, "정방향(또는
  // 역방향)이 확정된 구간"이 바뀔 때마다 즉시 원점을 잡는다.
  // 목표 지점에 "도착/통과했다"고 판정할 여유 거리 — GPS 오차를 감안해
  // 정확히 0m가 아니라 이 거리 이내로 들어오면 도착으로 본다(사용자
  // 지시: "GPS 오차률이 있다고 하니 최소한 갈림길 지나서 회전"). 너무
  // 넓으면 실제로 갈림길에 닿기 한참 전에 회전해버려 "미리 회전"
  // 문제가 재발하므로 좁게 잡는다.
  const ROTATION_ARRIVAL_GRACE_M = 12;

  // ════════════════════════════════════════════════════════════════
  // 🧭🧭🧭 이 앱 전체의 핵심 설계 원리(사용자 설명, 매우 중요 — 반드시
  // 읽고 이해한 뒤 이 함수 주변을 수정할 것):
  //
  // "길찾기 모드를 없앨 수 있는 이유가 — 내가 가야 할 경로가 항상
  //  내 앞에 와 있으면 방향을 절대 틀릴 수가 없어. 그래서 없앴어.
  //  그런데 그 경로가 90도 범위에서 너무 많이 벗어나면 방향이 안
  //  맞기 시작해.. 그래서 원점을 계속 강조하는 거야."
  //
  // 풀어서 설명하면: 가야 할 경로(다음 목표 방향)가 항상 화면 정면
  // (12시)을 향하도록 지도를 회전시켜두면(=원점을 정확히 잡으면),
  // 사용자는 "위쪽으로 걸으면 된다"는 것 외에 아무것도 판단할 필요가
  // 없다 — 나침반을 읽거나 손가락으로 방향을 맞추는 길찾기 모드
  // (openWayfindMode, v78에서 설계했다가 이후 단순화 방향으로 전환된
  // 기능) 자체가 원리적으로 불필요해진다. 이게 이 앱이 나침반/자이로
  // 센서를 전혀 쓰지 않고 GPX 좌표 계산만으로 방향을 안내하는 근본
  // 이유다.
  //
  // 단, 이 전제는 "화면이 가리키는 방향(원점) = 실제로 가야 할 방향"
  // 일 때만 성립한다. 원점은 "내 위치 좌표 → 다음에 가야 할 좌표"
  // 두 점만으로 계산하는 순수 기하학 값이라, 내가 실제로 어느 방향을
  // 보고 서 있는지(GPS 실측 이동방향, 역방향, 갈림길 개수)와 무관하게
  // 항상 유일하게 정해진다 — 그래서 GPS 실측 이동방향과 비교해
  // "순방향인지" 재검증하던 예전 로직(2026-09-21 제거)은 이 원리와
  // 애초에 모순이었다(updateSegmentRotationTrigger 정의부 참고).
  // 정확성을 지키는 나머지 장치는 목표 도착 판정(ROTATION_ARRIVAL_GRACE_M),
  // 수동 재설정(resetOriginNow, 드래그 유예 가드까지 우회하도록 수정됨),
  // 회전 목표 탐색 거리(100m/500m)다 — 이 파일의 회전 관련 코드는 전부
  // "원점의 정확성"이라는 이 원리 하나를 지키기 위한 장치들이다. 새
  // 기능을 추가하거나 리팩터링할 때, 이 원리(경로가 항상 화면 정면에
  // 오게 한다)를 깨뜨리지 않는지 항상 먼저 확인할 것.
  // ════════════════════════════════════════════════════════════════
  // 🧭 2026-09-25: 지도 회전(applySegmentRotation 직접 호출)은 이 함수
  // 밖으로 완전히 옮겨졌다(handleGpsPositionUpdate의 applyLiveMapRotation
  // — 화살표와 동일한 값으로 매 픽스 즉시 회전). 그래서 "GPS 재획득
  // 직후 회전 보류 게이트"(gpsReacquireConfirmStreak, hasStartedGpsOnceThisRoute)
  // 도 더 이상 필요 없어 제거했다 — 회전은 이제 국지적 안전장치
  // (ROTATION_MIN_MOVE_M) 하나만으로 떨림을 억제한다. 이 함수
  // (updateSegmentRotationTrigger)는 이제 오직 "원점(currentRotationOriginDist,
  // 하단 경로 알람 기준점) 확정"과 "방향점 통과 비프음"만 담당한다.
  function updateSegmentRotationTrigger(traveledDist, nearestIdx) {
    if (!isSegmentRotationMode) return;
    // ⚠️ 손가락으로 지도를 드래그하는 도중(isMapBeingDragged)에 갈림길을
    // 지나 구간이 바뀌면 applySegmentRotation이 지도 CSS 회전을 즉시
    // 바꿔버린다. 이때 moveManualMapDrag는 매 touchmove의 (dx,dy)를
    // "직전 프레임 대비 이동량"으로 계산해 mapRotationDeg 기준으로
    // 회전 보정하는데, 그 사이 회전각 자체가 바뀌면 다음 프레임의 보정이
    // 어긋나 손가락 방향과 지도 이동 방향이 크게 틀어져 보인다(사용자
    // 재현: "이동 중 드래그 시 지도가 손가락 반대/어긋난 방향으로 감").
    // 드래그 중에는 회전 판정 자체를 보류하고, 드래그가 끝나 자동 복귀
    // 유예까지 지나면(!isMapBeingDragged && !isMapDragReturnPending)
    // 다음 픽스에서 정상적으로 재판정된다 — 기준점을 갱신하지 않으므로
    // 갈림길을 지난 사실 자체는 유실되지 않는다.
    // 🧭 WAYFINDING_MODE 중에는 지도 회전을 손대지 않는다(구간회전과
    // 별개로 동작 — closeWayfindingMode가 종료해도 구간회전 값은 그대로
    // 유지된다, 나침반/손가락 회전 방식은 2026-09-23 완전히 제거됨) —
    // 그 동안 구간회전이 끼어들면 나침반 회전과 충돌해 지도가 제멋대로
    // 움직이는 것처럼 보인다.
    // ⚠️ forceOriginReset(resetOriginNow() 명시적 클릭)은 드래그 유예
    // 가드를 우회한다 — 이 가드가 없으면 "지도를 손가락으로 둘러보고
    // 놓은 직후(자동 복귀 유예 7초 이내)"에 원점 버튼을 눌러도 조용히
    // 아무 일도 안 일어났다(사용자 재현: "원점 다시 잡는 메뉴... 클릭
    // 하면 현재 위치에서 지도를 90도 돌려야 하는데... 눈에는 안
    // 되고있는것 같아" — 실제로는 지도가 잘못된 방향으로 남아있는
    // 상황에서 버튼을 눌렀는데 반응이 없었음). 길찾기 모드는 그동안
    // 나침반/손가락이 회전을 전담하는 완전히 다른 구조이므로 이
    // 예외에서 제외한다(길찾기 중에는 원점 버튼 자체를 쓸 상황이
    // 아니다).
    if ((isMapBeingDragged || isMapDragReturnPending) && !forceOriginReset) return;
    if (isWayfindActive) return;
    // 🚨 경로 이탈 중에는 회전보다 복귀 방향 안내가 우선이어야 한다는
    // 지적(사용자: "경로에서 벗어 났는데 회전보다 내가 가야할 곳을
    // 알려주는게 낫지") — 이탈 상태에서는 회전 자체를 동결(마지막
    // 회전값 유지)하고, updateNavigationToast의 이탈 안내 분기가
    // 복귀 방향을 전담한다. 복귀하면 다음 픽스에서 정상 재개된다.
    // 단, 아직 원점이 한 번도 안 잡힌 상태(currentRotationOriginDist
    // === null)이거나 resetOriginNow()로 명시적 재설정을 요청한 경우
    // (forceOriginReset)는 이탈 여부와 무관하게 계속 판정을 시도한다.
    // ⚠️ v94에서 이 동결을 "원점 확정 여부와 무관하게" 걸었더니, 들머리
    // 진입 직후(아직 트랙 위로 안정적으로 붙기 전이라 이탈 상태로
    // 분류되기 쉬운 구간)에 원점 자체가 영영 안 잡히는 회귀가
    // 생겼다(사용자 재현: "들머리에서 순방향이면 판정이 나는데 원점을
    // 안 잡아 왜?"). 회전이 이미 한 번 확정된 뒤(갈림길 통과 등)에만
    // 이탈 동결을 적용하고, 첫 원점 판정 자체는 계속 열어둔다.
    //
    // ⚠️ 2026-09-21 수정: 예전엔 "이탈 중 회전 동결" 때문에 지명(방향점)
    // 통과 알림까지 통째로 스킵되는 문제가 있어 "통과 여부 확인 + 통과
    // 비프음"과 "회전"을 분리했다. 2026-09-25부터 이 함수는 방향점 도착
    // 판정(비프음)과 원점 확정(하단 알람용 기준점)만 담당한다 — 지도
    // 회전은 handleGpsPositionUpdate의 applyLiveMapRotation이 매 픽스
    // 즉시 전담한다(위 GPS_REACQUIRE_CONFIRM_STREAK 제거 관련 주석 참고).
    // trackDirection(isReversingOnTrail)은 nearestPointOnTrail이 매
    // 픽스마다 자동으로 갱신하므로(updateTrackDirection), 여기서 별도로
    // 다시 갱신하지 않는다.
    if (!lastKnownPos) return;

    const isFirstRotation = currentRotationOriginDist === null;
    // 시뮬레이션 중에는 항상 500m, 실제 GPS는 기본값(100m) — 사용자
    // 지시: "시뮬레이션은 위 조건 무시해. 그냥 500m로 원점 잡는 것으로
    // 해 줘." findNextRotationTarget 정의부의 SIM_ROTATION_TARGET_LOOKAHEAD_M
    // 참고.
    const rotationLookaheadM = isSimulationMode ? SIM_ROTATION_TARGET_LOOKAHEAD_M : undefined;

    if (!isFirstRotation) {
      // 🧭 이미 원점이 있으면: 현재 기준점에서 찾은 목표에 실제로
      // 도착/통과했는지 확인한다. 아직 도착 전이면(접근 중) 아무것도
      // 하지 않고 이전 회전값을 그대로 유지 — "미리 회전" 방지.
      //
      // ⭐ 연쇄 소진(2026-09-21, 사용자 지시: "원점은 마지막 방향점이
      // 지나갈때 잡으면 돼. 대신 방향 알람은 동시에 나오게 해줘"): 방향점
      // (갈림길/봉우리/쉼터 등 지명이 있는 모든 지점) 간격이 10~20m로
      // 촘촘한 구간에서는 GPS 픽스 한 번(약 1초) 사이에 여러 방향점을
      // 동시에 지나칠 수 있다. 예전엔 한 번에 하나만 처리하고 return
      // 했는데, 그 직후 currentRotationOriginDist!==null 상태에서 GPS
      // 오차로 이탈(isOffTrailState) 오판이 겹치면 3700행의 동결 조건에
      // 걸려 바로 옆 방향점이 다음 픽스에서도 영영 못 잡히는 문제가
      // 있었다. while로 도착한 방향점을 모두 순서대로 소진해, 이번
      // 프레임 안에서 마지막(가장 멀리 지나친) 방향점까지 한 번에
      // 원점으로 확정한다. 중간에 지나친 방향점들도 통과 비프음을
      // 순서대로 울려 "9시→11시" 같은 연속 통과를 놓치지 않는다.
      let originDist = currentRotationOriginDist;
      let finalTarget = null;
      let guard = 0; // 무한루프 방지(코스 데이터 이상 등 극단적 상황 대비)
      while (guard++ < 50) {
        const currentTarget = findNextRotationTarget(originDist, isReversingOnTrail, rotationLookaheadM);
        if (!currentTarget) break;
        const arrived = isReversingOnTrail
          ? (traveledDist <= currentTarget.distanceM + ROTATION_ARRIVAL_GRACE_M)
          : (traveledDist >= currentTarget.distanceM - ROTATION_ARRIVAL_GRACE_M);
        if (!arrived) break;
        // 이름 없는 lookahead 지점 통과는 실제 방향점 통과가 아니므로 조용히.
        if (currentTarget.isMilestone) playPassedMilestoneBeep();
        originDist = currentTarget.distanceM;
        finalTarget = currentTarget;
      }
      if (!finalTarget) return; // 도착한 방향점이 하나도 없음(접근 중)

      // 마지막으로 도착한 방향점을 새 기준점으로 삼는다 — 통과 사실
      // 자체(및 비프음)는 이탈 여부와 무관하게 이미 위 while 루프에서
      // 보장됐으므로, 원점 갱신도 그대로 진행해 다음 방향점이 중복
      // 판정되지 않게 한다. 지도 회전은 2026-09-25부터 이 함수가 하지
      // 않는다(handleGpsPositionUpdate의 applyLiveMapRotation 전담) —
      // 여기서는 하단 알람 기준점(currentRotationOriginDist)만 갱신한다.
      currentRotationOriginDist = finalTarget.distanceM;
      return;
    }

    // 🧭 첫 원점(들머리, 하단 경로 알람 전용) — 지도 회전과 무관하게,
    // "GPX 이동방향이 안정된 뒤에야 하단 알람 기준점을 잡는다"는 의미로
    // firstOriginFixCount(3픽스) 대기만 유지한다. 지도/화살표는 이
    // 대기와 무관하게 이미 handleGpsPositionUpdate에서 매 픽스 즉시
    // 갱신되고 있다.
    firstOriginFixCount++;
    if (firstOriginFixCount < FIRST_ORIGIN_MIN_FIXES) return; // 아직 이동방향 미확정 — 하단 알람 원점은 대기

    const target = findNextRotationTarget(traveledDist, isReversingOnTrail, rotationLookaheadM);
    if (!target) return;

    currentRotationOriginDist = traveledDist;
    return;
  }

  // 🔄 수동 "원점 다시 잡기" 버튼 — GPS가 크게 튀거나 원점이 엉뚱하게
  // 잡힌 것 같을 때, 사용자가 직접 지금 위치를 기준으로 원점을 강제
  // 재설정할 수 있는 안전장치. currentRotationOriginDist를 비워 다음
  // updateSegmentRotationTrigger 호출에서 반드시 재계산이 일어나게
  // 하고, forceOriginReset 플래그로 이번 한 번은 "첫 원점" 방향 일치
  // 검사(FIRST_ROTATION_HEADING_TOLERANCE_DEG)를 건너뛴다 — 사용자가
  // 명시적으로 요청한 재설정이므로 이동방향이 아직 안정되지 않았어도
  // 즉시 반영하는 게 맞다.
  //
  // ⚠️ v104: 원래는 원점 관련 상태(currentRotationOriginDist,
  // firstRotationLockedAt)만 리셋했는데, 사용자가 실기기에서 "GPS를
  // 끄고 다시 켜니 들머리에서 제대로 방향을 잡았다"고 재현 — GPS
  // 재시작(startGpsTracking)은 원점뿐 아니라 gpsFilterEngine 내부
  // 상태(잘못 수렴된 좌표/속도/방위각 누적), gpsMovementHeading,
  // isCurrentlyStopped, 이탈(isOffTrailState)·역주행(isReversingOnTrail)
  // 판정까지 전부 초기화한다. 이 버튼도 "GPS를 껐다 켜는 것과 동일한
  // 효과"를 내도록 같은 리셋을 함께 수행해, 산행 중 방향이 이상해지거나
  // 오류가 날 때 GPS를 완전히 재시작하지 않고도 이 버튼 하나로 복구할
  // 수 있게 한다.
  let forceOriginReset = false;
  function resetOriginNow() {
    if (!isSegmentRotationMode || !lastKnownPos) {
      showToastBadge('📍 먼저 [내 위치] 버튼으로 GPS를 켜주세요.');
      return;
    }
    // GPS 필터/방향/이탈/역주행 상태를 GPS 재시작과 동일하게 초기화 —
    // startGpsTracking()의 해당 초기화 블록과 의도적으로 동일하게 맞춘다.
    gpsFilterEngine.reset();
    gpsMovementHeading = null;
    isCurrentlyStopped = false;
    isOffTrailState = false;
    offTrailStreakCount = 0;
    returnStreakCount = 0;
    // 🐛 2026-09-25 수정 — 예전엔 resetTrackDirectionState()만 호출해
    // lastNearestIdx/trailTrackingMode(LOCKED일 수 있음)가 리셋되지
    // 않았다. "다음 index로만 전진" 설계에서는 이 빈틈이 더 크게
    // 작용한다 — LOCKED로 남아있으면 원점 재설정을 눌러도 옛 index
    // 기준 N/N+1만 계속 보게 된다. resetTrailSearchWindow()가 내부에서
    // resetTrackDirectionState()도 함께 호출하므로 중복 호출을 없애고
    // 이걸로 교체한다.
    resetTrailSearchWindow();
    lastAlertedMilestoneKey = null;
    remainingBeepThresholds = null;
    // 🧭 지도 회전각(mapRotationDeg/appliedMapRotationDeg)은 리셋하지
    // 않는다 — applySegmentRotation이 최단경로(shortestAngleDiff) 기준
    // 으로 새 값을 계산하므로, 리셋 없이도 다음 회전이 정확한 방향으로
    // 스냅된다. lastRecenterDistance만 초기화해 "100m 이내는 재중심 안
    // 함"이라는 게이트가 이번 수동 재설정을 막지 않게 한다.
    resetGajaMapRotationState();

    currentRotationOriginDist = null;
    firstOriginFixCount = FIRST_ORIGIN_MIN_FIXES; // 수동 재설정은 대기 없이 즉시 확정
    forceOriginReset = true;
    const nearest = nearestPointOnTrail(lastKnownPos.lat, lastKnownPos.lon, currentPoints);
    const traveledDist = (nearest && cumulativeDistances[nearest.index] !== undefined) ? cumulativeDistances[nearest.index] : 0;
    // 하단 경로 알람 원점(currentRotationOriginDist) 확정만 이 호출이
    // 담당한다 — 지도 회전은 아래에서 직접 즉시 처리한다.
    updateSegmentRotationTrigger(traveledDist, nearest ? nearest.index : undefined);
    forceOriginReset = false;
    // 🗺️ 가자맵 대원칙 재설계(2026-09-25) — "지금 위치 기준 즉시
    // 재설정"을 옛 computeArrowHeading/applySegmentRotation 직접 호출
    // 대신 recalculateGajaMapFromScratch로 통일한다(명세: 홈버튼은
    // 현재GPS위치로 원점이동 + 현재구간→GPX위치→100m목표→GPX방향→12시를
    // 다시 계산한다). 구간이 아직 없으면 이 함수가 nearest를 다시
    // 계산해 자동으로 초기화하므로, 위에서 구한 nearest를 재사용하지
    // 않고 내부에 맡긴다.
    recalculateGajaMapFromScratch('homeButton');
    if (getCurrentSection()) {
      const arrowHeading = computeArrowHeadingV2(lastKnownPos.lat, lastKnownPos.lon, cumulativeDistances[nearest ? nearest.index : 0] || 0);
      if (arrowHeading !== null) {
        renderGpsArrow(arrowHeading);
        lastArrowHeadingForGuidance = arrowHeading;
      }
    }
    showToastBadge('🔄 현재 위치 기준으로 원점을 다시 잡았습니다.');
  }
  window.resetOriginNow = resetOriginNow;

  function updateNavigationToast(accuracy, minDistanceM, nearestIdx, nearestPoint, arrowHeading) {
    // 🚩 경로 접근 모드(2026-09-23 재설계) — 아직 경로(온트레일 기준)
    // 밖에 있으면(산행 시작 직후 집/주차장, 또는 경로 중간으로 바로
    // 진입하는 경우 모두 포함) 트랙 기반 이탈판정·갈림길 안내·구간회전을
    // 건너뛰고 가장 가까운 경로 지점까지 거리/방향만 안내한다.
    //   - 100m 초과: 거리만 표시(isTrailTooFar)
    //   - 온트레일(20m)~100m: 방향 안내 시작(isApproachingTrailhead)
    // GPS 이동방향이 경로 방향과 2~3회 연속 일치해 원점
    // (currentRotationOriginDist)이 확정되는 순간 자동으로 꺼지고 아래
    // 기존 로직(갈림길 안내 등)으로 넘어간다.
    if (lastKnownPos) {
      updateTrailheadApproach(lastKnownPos.lat, lastKnownPos.lon, minDistanceM, nearestPoint, arrowHeading);
      if (isApproachingTrailhead || isTrailTooFar) return;
    }

    // 하단 경로 알람 원점(currentRotationOriginDist) 확정 판정은 텍스트
    // 안내(이탈/온트레일 분기, 토스트 표시 여부)와 무관하게 토스트 표시
    // 여부(toast.style.display==='none')와는 상관없이 항상 먼저
    // 실행한다. 지도 회전 자체는 이 함수가 아니라
    // handleGpsPositionUpdate의 applyLiveMapRotation이 매 픽스 즉시
    // 전담한다(2026-09-25).
    if (currentMilestones && currentMilestones.length >= 2 && nearestIdx >= 0 && cumulativeDistances) {
      updateSegmentRotationTrigger(cumulativeDistances[nearestIdx] || 0, nearestIdx);
    }

    const toast = document.getElementById('gpsToast');
    if (!toast || toast.style.display === 'none') return;
    if (!lastKnownPos) return;

    if (nearestPoint && isOffTrailState) {
      hideBottomDirectionArrow(); // 이탈 안내는 좌/우 상대 방향(angleDiffToPlainKorean)이라 하단 화살표(시계 방향) UI와 별개
      // 숲/계곡 GPS 수신 불안정 시 오알람 방지 (정확도가 25m보다 나쁘면 대기)
      if (accuracy > 25 && offTrailStreakCount < 4) {
        toast.className = 'gps-toast';
        toast.innerText = `📡 숲·계곡 GPS 수신 대기 중 (오차 ±${Math.round(accuracy)}m)`;
        return;
      }
      offTrailStreakCount++;
      // 들머리 근처(첫 원점 미확정 + 코스 시작 30m 이내)에서는 "이탈"이
      // 아니라 "들머리 진입 중"으로 안내한다 — GPS 이동방향이 아직
      // 안정되지 않은 상태에서 갑자기 "이탈했다"는 경고만 뜨면
      // 사용자가 어디로 가야 할지 판단하기 어렵다는 지적(개선 제안).
      const traveledDistForNotice = cumulativeDistances[nearestIdx] || 0;
      const isNearTrailheadNotice = isSegmentRotationMode && currentRotationOriginDist === null && traveledDistForNotice < TRAILHEAD_ENTRY_DISTANCE_M;
      if (isNearTrailheadNotice) {
        toast.className = 'gps-toast';
        let distStr = minDistanceM >= 1000 ? (minDistanceM / 1000).toFixed(2) + 'km' : Math.round(minDistanceM) + 'm';
        toast.innerText = `🚩 들머리 진입 중 · 입구를 따라 조금만 더 이동하세요 (${distStr})`;
        return;
      }
      // 등산로 복귀 방향은 "북동쪽" 같은 절대 방위가 아니라, 마지막 GPS
      // 진행 방향(getCurrentAbsHeadingForGuidance) 기준 오른쪽/왼쪽
      // 상대 방향으로 안내한다.
      const toTrailBearing = calculateBearing(lastKnownPos.lat, lastKnownPos.lon, nearestPoint.lat, nearestPoint.lon);
      const toTrailAngleDiff = shortestAngleDiff(toTrailBearing, getCurrentAbsHeadingForGuidance());
      toast.className = 'gps-toast warning';
      let distStr = minDistanceM >= 1000 ? (minDistanceM / 1000).toFixed(2) + 'km' : Math.round(minDistanceM) + 'm';
      toast.innerText = `🚨 [이탈] 경로에서 ${distStr} 벗어났어요. ${angleDiffToPlainKorean(toTrailAngleDiff)}`;

      // GPS 순간 튐(수목/계곡 지역 등) 오알람 방지 — 연속 3회(약 3초) 이상
      // 유지될 때만 실제 경고음을 울린다.
      if (offTrailStreakCount >= 3) {
        playOffTrailBeep();
        speakGuidance(`경로 이탈. ${distStr} 벗어났습니다. ${angleDiffToPlainKorean(toTrailAngleDiff)}`);
      }
    } else if (nearestIdx >= 0 && currentPoints && currentPoints.length > 3) {
      // 정지 중에는 "정지 중" 안내만, 이동 중에는 남은 거리만 표시한다.
      // (이전에는 여기서 궤적 방향과 실제 이동 방향을 비교해 역주행 여부를
      // 판정했으나, 개선 1로 그 판정 자체를 제거했다 — 녹색 점선과 이탈
      // 경고가 이미 필요한 안내를 제공하므로 더 이상 계산할 필요가 없다.)
      const totalDist = cumulativeDistances[cumulativeDistances.length - 1] || 0;
      const traveledDist = cumulativeDistances[nearestIdx] || 0;
      const remainingDist = Math.max(0, totalDist - traveledDist);
      const remainingStr = remainingDist >= 0 ? `${(remainingDist / 1000).toFixed(2)}km` : '';
      const fmtM = m => `${(m / 1000).toFixed(2)}km`;
      // ⭐ "전체 Nkm" 한 줄에 남은 거리와 전체 거리가 같이 뭉쳐 있어
      // 지금까지 실제로 얼마나 걸었는지 가늠하기 어렵다는 지적(사용자
      // 요청: "(전체1.46km중 1.0km이동)"으로 구분해서 보여달라) —
      // "전체 X중 Y 이동"처럼 전체 거리 대비 이동거리를 별도로 표시한다.
      const totalDistStr = `${(totalDist / 1000).toFixed(2)}km`;
      const traveledDistStr = `${(traveledDist / 1000).toFixed(2)}km`;

      // ⭐ 전면 재설계(2026-09-17 v94, 2026-09-17 v95) "단일 진행방향
      // 소스 + 도착 시점 회전" 방식: turnAngle을 코스 로드 시점에 미리
      // 계산해두던 이전 방식은 지도 회전 기준과 안내 각도 기준이 서로
      // 다른 지점을 봐서 실기기에서 반복적으로 어긋났다(1~4·9·10번
      // 사용자 재현 참고). v95에서는 회전 자체가 "목표 지점 도착/통과"
      // 시에만 일어나므로, nextM에 접근하는 동안 mapRotationDeg는 항상
      // "직전 기준점 → nextM" 방향으로 고정되어 있다(사용자 지시:
      // "미리 회전하면 방향이 헷갈려"). "몇 시 방향"은 실시간으로,
      // 그 "현재 화면이 가리키는 방향(mapRotationDeg)" 대비 "nextM을
      // 지난 뒤 실제로 가야 할 다음 목표 방향"의 상대각으로 계산한다.
      // 회전과 안내가 같은 값(mapRotationDeg)에서 파생되므로 화면과
      // 어긋날 수가 없다.
      //
      // ↩️ 왕복/원점회귀 코스: 정상까지 갔다가 같은 길로 되돌아올 때도
      // 갈림길 안내가 나와야 한다는 요구사항 — nearestIdx 증감 추이로
      // "되돌아가는 중"을 판정(updateTrackDirection, nearestPointOnTrail
      // 이 매 픽스마다 이미 호출함)하고, 역방향이면 findNextMilestone이
      // 코스 순서상 이전 마일스톤을 다음 목표로 반환하도록 뒤집는다.
      // distToNextM 계산도 방향에 맞게 뒤집는다.
      const milestoneResult = findNextMilestone(traveledDist, isReversingOnTrail);
      if (milestoneResult) {
        const prevM = milestoneResult.prevM;
        const nextM = milestoneResult.nextM;
        const distToNextM = isReversingOnTrail
          ? Math.max(0, traveledDist - nextM.distanceM)
          : Math.max(0, nextM.distanceM - traveledDist);

        // nextM을 지난 직후(코스 진행거리 기준 살짝 더 간 지점)에서
        // findNextRotationTarget과 완전히 같은 규칙으로 "그 다음 목표"를
        // 찾는다 — 마일스톤이 있으면 그 지점, 없으면 100m 앞 지점.
        // 이게 "nextM에서 실제로 꺾여 나가는 방향"이다.
        const afterNextMDist = isReversingOnTrail
          ? Math.max(0, nextM.distanceM - 1)
          : nextM.distanceM + 1;
        const afterTarget = findNextRotationTarget(afterNextMDist, isReversingOnTrail, isSimulationMode ? SIM_ROTATION_TARGET_LOOKAHEAD_M : undefined);
        let turnAngle = null;
        let turnLabel = null;
        if (afterTarget) {
          const outBearing = computeGuidanceHeading(nextM.trailLat, nextM.trailLon, afterTarget.lat, afterTarget.lon);
          if (outBearing !== null) {
            // "지금 화면이 가리키는 방향" = nextM을 향해 이미 맞춰진
            // mapRotationDeg. 그 방향 대비 nextM 통과 후 방향의 상대각이
            // 곧 화면 기준 "몇 시로 꺾어야 하는지"다.
            turnAngle = shortestAngleDiff(outBearing, mapRotationDeg);
            turnLabel = classifyTurnAngle(turnAngle);
          }
        }
        // 🧭 노드점(방향점) 통과 직후 POST_MILESTONE_ARROW_HOLD_M(10m)
        // 구간 동안은 하단 화살표를 새 목표(nextM) 기준으로 즉시
        // 갱신하지 않고 직전 화살표를 그대로 유지한다 — 이전에는
        // traveledDist가 prevM.distanceM을 넘는 즉시 nextM 기준으로
        // 재계산되면서, 방금 지난 노드점의 방향 화살표가 통과와 동시에
        // 사라져 확인할 새가 없었다(사용자 지시: "마지막 방향알림을
        // 유지하다가 사라지게"). 상단 토스트(거리/지명 안내)는 이
        // 영향을 받지 않고 기존 그대로 nextM 기준으로 계속 갱신된다.
        const distPastPrevM = (prevM && prevM.distanceM !== undefined)
          ? (isReversingOnTrail ? Math.max(0, prevM.distanceM - traveledDist) : Math.max(0, traveledDist - prevM.distanceM))
          : Infinity;
        if (distPastPrevM > 0 && distPastPrevM <= POST_MILESTONE_ARROW_HOLD_M && lastShownArrowAngle !== null) {
          showBottomDirectionArrow(lastShownArrowAngle, lastShownArrowLabel, false);
        } else {
          showUpcomingTurnAlert({ name: nextM.name, distanceM: nextM.distanceM, turnAngle, turnLabel }, distToNextM);
        }

        toast.className = 'gps-toast';
        // .gps-toast는 white-space:normal이라 innerText의 \n이 줄바꿈으로
        // 렌더링되지 않는다 — 이 메시지만 <br>로 줄을 나눠야 하므로
        // innerHTML을 쓴다. prevM/nextM.name은 GPX 웨이포인트 이름(외부
        // 파일에서 올 수 있음)이라 다른 innerHTML 사용부(저장된 코스
        // 목록의 safeName)와 동일하게 '<'를 이스케이프해 HTML 인젝션을
        // 막는다.
        const escName = s => String(s || '').replace(/</g, '&lt;');
        // 🐛 2026-09-26 수정 — 상단 알림판 표시에만 큰 지명(갈림길 제외)
        // 목록을 쓴다. 방향/화살표(turnAngle, showUpcomingTurnAlert)는
        // 위에서 이미 정밀한 findNextMilestone(갈림길 포함) 결과로 계산을
        // 끝냈으므로 전혀 영향받지 않는다 — 여기서 표시용 이름/거리만
        // 별도로 다시 찾는다. 코스에 큰 지명이 2개 미만이면(웨이포인트가
        // 거의 없는 GPX) 표시용 결과가 없을 수 있으니 그때만 기존
        // prevM/nextM으로 안전하게 폴백한다.
        const bigResult = findNextBigLandmark(traveledDist, isReversingOnTrail);
        const dispPrevM = bigResult ? bigResult.prevM : prevM;
        const dispNextM = bigResult ? bigResult.nextM : nextM;
        const dispDistToNextM = bigResult
          ? (isReversingOnTrail
              ? Math.max(0, traveledDist - dispNextM.distanceM)
              : Math.max(0, dispNextM.distanceM - traveledDist))
          : distToNextM;
        toast.innerHTML = `🧭 ${escName(dispPrevM.name)} → ${escName(dispNextM.name)} · ${fmtM(dispDistToNextM)} 남음<br>(전체 ${totalDistStr}중 ${traveledDistStr}이동)`;

        // 🏁 날머리 도착 자동 종료 — 원점회귀 코스(들머리=날머리)는 출발
        // 직후에도 remainingDist가 잠깐 작을 수 있으므로, 최소
        // ARRIVAL_MIN_TRAVELED_M 이상 실제로 이동한 뒤에만 도착 판정을
        // 한다. GPS 오차(보통 ±10~15m)를 감안해 20m 이내를 "도착"으로 본다.
        if (traveledDist >= ARRIVAL_MIN_TRAVELED_M && remainingDist <= ARRIVAL_DISTANCE_M) {
          showToastBadge('🏁 날머리에 도착했습니다.\nGPS 추적을 자동으로 종료합니다.');
          // 🏁 산행 세션도 함께 종료한다 — 안 하면 다음에 같은 코스를
          // 다시 열었을 때 "이전 세션 복귀"로 잘못 처리되어(등산 시작
          // 확인 버튼 없이 곧바로 GPS가 켜짐) 새 산행을 시작 못 한다.
          endHikingSession();
          stopGpsTracking();
        }
        return;
      }

      hideBottomDirectionArrow();
      toast.className = 'gps-toast';
      toast.innerText = `🧭 위쪽으로 따라가세요 · 남은 ${remainingStr}`;
    } else {
      hideBottomDirectionArrow();
      toast.className = 'gps-toast';
      toast.innerText = `🧭 위쪽으로 따라가세요`;
    }
  }

  // 다음 갈림길(nextM)까지 남은 거리(distToNextM)를 보고 하단 큰
  // 화살표(좌회전/우회전/직진 아이콘) 표시 여부와 알람 소리를 결정한다.
  // 거리 기준만으로 판정하므로 GPS 오차로 인한 깜빡임 걱정이 없다 —
  // 방향 판정 자체가 없기 때문이다.
  //
  // 단계별 동작(사용자 요청, 2026-09-21 재설계):
  //   50m, 30m, 10m 전 — 각 지점을 "이하로 처음 내려간 순간" 1회씩만
  //     알람음(거리가 그 임계값 이하로 진입한 첫 GPS 픽스에서 발화,
  //     정확히 그 값을 찍을 필요 없음)
  //   갈림길에 새로 진입했는데 이미 여러 임계값을 동시에 지난 상태라면
  //     (예: 첫 픽스가 35m — 50m/30m 둘 다 지남) 가장 가까운 단계(30m)
  //     하나만 안내하고 더 먼 단계(50m)는 조용히 건너뛴다.
  //   통과(다음 마일스톤으로 넘어감) — 화살표 자동으로 사라짐. 통과
  //     시점의 비프음은 updateSegmentRotationTrigger의
  //     playPassedMilestoneBeep()가 별도로 담당(여기서 처리 안 함).
  //   갈림길 근처에서 실제로 궤적을 벗어남(isOffTrailState) — "엉뚱한
  //     방향으로 가고 있다"는 판단은 내 heading을 다시 측정하는 게
  //     아니라, 이미 있는 이탈 감지(updateOffTrailHysteresis)가 대신
  //     맡는다. updateNavigationToast는 isOffTrailState일 때 이 함수
  //     자체를 호출하지 않고 이탈 경고 분기로 빠지므로, 경고음
  //     (playOffTrailBeep)은 자동으로 울린다 — 여기서 따로 처리할 것
  //     없음.
  const TURN_ALERT_DISTANCE_M = 60;   // 화살표가 뜨기 시작하는 거리
  // 화살표를 완전히 숨기는 거리는 뜨는 거리보다 더 크게 잡는다(히스테리시스).
  // GPS 오차로 거리값이 순간적으로 60m를 살짝 넘나들 때마다 화살표가
  // 껐다 켰다 깜빡이던 문제(#8, 2026-09-21) — 한 번 떴으면 상당히
  // 멀어져야만 사라지게 해서, 실제로는 계속 근처에 머무는데도 화면이
  // 깜빡이는 것을 막는다.
  const TURN_ALERT_HIDE_DISTANCE_M = 90;
  const TURN_ALERT_BEEP_THRESHOLDS_M = [50, 30, 10]; // 알람 지점(먼→가까운 순)
  let lastAlertedMilestoneKey = null;
  let remainingBeepThresholds = null; // 이 갈림길에서 아직 안 울린 임계값들

  function showUpcomingTurnAlert(nextM, distToNextM) {
    // key에 방향(isReversingOnTrail)을 포함시켜, 왕복 코스에서 같은
    // 갈림길을 올라갈 때 한 번, 내려갈 때 또 한 번 각각 독립적으로
    // 알람이 울리도록 한다 — 방향 정보 없이 좌표+거리만 쓰면 "이미
    // 알람 울린 지점"으로 오판해 두 번째 통과 시 스킵될 수 있었다.
    const key = nextM.name + '@' + nextM.distanceM + (isReversingOnTrail ? '@rev' : '@fwd');
    // 이미 이 갈림길로 화살표가 떠 있는 상태면(같은 key로 한 번이라도
    // 알림이 시작됐으면) 더 관대한 HIDE 임계값을, 아직 안 떴으면 원래
    // 표시 임계값을 쓴다 — 60m 근처에서의 GPS 노이즈로 인한 깜빡임 방지.
    const hideThreshold = (key === lastAlertedMilestoneKey) ? TURN_ALERT_HIDE_DISTANCE_M : TURN_ALERT_DISTANCE_M;
    if (distToNextM > hideThreshold) {
      hideBottomDirectionArrow();
      if (key !== lastAlertedMilestoneKey) {
        lastAlertedMilestoneKey = null; // 다음 갈림길 재진입 대비 리셋
        remainingBeepThresholds = null;
      }
      return;
    }

    // 🧭 "진짜 직진(5도 미만)"과 "회전각 계산 실패(turnAngle=null)"를
    // 구분한다(2026-09-21, 사용자 지시: "GPX 맵에 지명이 있으면 의도된
    // 거야. 무시하면 안 돼"). 예전엔 둘 다 이 함수 자체를 조용히
    // return시켜, 화면 각도 계산이 어쩌다 실패한 지명(들머리/날머리
    // 근처 등)은 화살표는 물론 50/30/10m 비프음까지 통째로 안 울렸다.
    // 이제 화살표(방향 표시)는 계산 가능할 때만 띄우되, 접근 비프음은
    // 실제 진짜 직진일 때만 생략하고 계산 실패 시에는 계속 울린다 —
    // nextM은 항상 currentMilestones 안의 실제 지명이므로(lookahead
    // 대체 없음) "그 지명 자체가 없어서" 안내 못 하는 경우는 없다.
    const isRealStraight = nextM.turnLabel === '직진';
    const hasDirection = nextM.turnLabel && nextM.turnAngle !== null;
    let clockOnly = null; // 음성 안내("NN미터 앞 X시 방향")에서도 재사용

    if (hasDirection) {
      // 좌회전/우회전 텍스트보다 몇 시 방향인지(예: "1시 방향")가 훨씬
      // 직관적으로 보인다는 사용자 피드백 — turnAngle(호출부에서 실시간
      // 계산한, "지금 화면이 가리키는 방향" 대비 상대 회전각)을 시계방향
      // 문구로 변환해 함께 보여준다.
      const clockDir = angleDiffToClockDirection(nextM.turnAngle);
      // "9시 방향 (좌회전)"처럼 clockDir.clock에 괄호로 붙은 회전 설명은
      // "9시방향으로"라는 조사 자체가 이미 회전 의미를 담고 있어 중복
      // 지시로 들린다는 사용자 피드백(2026-09-19) — 괄호 부분은 버리고
      // "OO에서 X시방향으로(NNm앞)" 형식으로만 표기한다.
      clockOnly = clockDir.clock.replace(/\s*\([^)]*\)\s*$/, '').replace(/\s+/g, '');
      const label = `${nextM.name}에서 ${clockOnly}으로(${Math.round(distToNextM)}m앞)`;
      // showBottomDirectionArrow(angleDiff, ...)의 angleDiff는 turnAngle을
      // 그대로 넘긴다 — 화면이 이미 nextM 방향(mapRotationDeg)으로 맞춰진
      // 상태이므로, 이 값은 화면 기준 "몇 시로 꺾어야 하는지"와 정확히
      // 일치한다(updateNavigationToast 호출부 주석 참고).
      showBottomDirectionArrow(nextM.turnAngle, label, false);
    } else {
      // 방향 계산이 실패했어도(화살표는 못 띄우지만) 지명이 다가온다는
      // 사실 자체는 여전히 안내해야 한다.
      hideBottomDirectionArrow();
    }

    // 진짜 직진(5도 미만)만 접근 비프음 대상에서 제외한다 — 실제로
    // 방향이 안 바뀌는 지점까지 굳이 알람으로 방해할 필요는 없다는
    // 원래 취지는 유지하되, 계산 실패는 더 이상 여기 포함되지 않는다.
    if (isRealStraight) {
      if (key !== lastAlertedMilestoneKey) {
        lastAlertedMilestoneKey = null;
        remainingBeepThresholds = null;
      }
      return;
    }

    if (key !== lastAlertedMilestoneKey) {
      // 이 갈림길에 새로 진입하는 시점.
      lastAlertedMilestoneKey = key;
      // "아직 안 지남" = 현재 거리가 그 임계값보다 더 먼 상태(distToNextM > t) —
      // 즉 t가 distToNextM보다 작은 것들만 앞으로 발화할 대상으로 남긴다.
      remainingBeepThresholds = TURN_ALERT_BEEP_THRESHOLDS_M.filter(t => t < distToNextM);
      // "가장 가까운 단계(배열 중 최솟값, 예:10m)까지 이미 지났을 때만"
      // 진입 즉시 1회 안내한다 — 예: 진입 즉시 35m면 50m만 지났고 아직
      // 진짜 가까운 단계(30m)는 안 지났으므로 조용히 대기(다음 픽스가
      // 30m 이하로 내려올 때 else 분기에서 정상 발화). 반대로 진입
      // 즉시 5m처럼 가장 가까운 단계(10m)까지 이미 지났다면, "지나친
      // 단계는 건너뛰고 남은 단계만" 사양에 따라 지금 1회만 안내한다.
      const closestThreshold = Math.min(...TURN_ALERT_BEEP_THRESHOLDS_M);
      if (distToNextM <= closestThreshold) {
        playTurnAlertBeep();
        speakTurnApproach(nextM, closestThreshold, clockOnly);
      }
    } else if (remainingBeepThresholds && remainingBeepThresholds.length > 0) {
      // 이 갈림길에 머무는 동안 — 남은 임계값 중 다음 차례(가장 먼 값)를
      // 막 지났는지 확인. 한 번에 하나씩만 소진하므로 겹쳐 울리지 않는다.
      const nextThreshold = Math.max(...remainingBeepThresholds);
      if (distToNextM <= nextThreshold) {
        playTurnAlertBeep();
        speakTurnApproach(nextM, nextThreshold, clockOnly);
        remainingBeepThresholds = remainingBeepThresholds.filter(t => t !== nextThreshold);
      }
    }
  }

  // 🔊 갈림길 접근 음성 안내 — "30미터 앞 10시 방향"처럼 "임계값 거리 +
  // 몇 시 방향" 순서로 짧게 말한다. 실제 GPS 거리(distToNextM)가 아니라
  // 방금 넘은 임계값(threshold, 50/30/10 중 하나)을 말해야 "정확히 그
  // 단계를 알린다"는 사용자 기대와 맞다 — distToNextM은 48.3처럼 임계값
  // 근처의 애매한 실측값이라 그대로 읽으면 "48미터 앞"처럼 어색하다.
  // clockOnly가 null이면(회전각 계산 실패) 방향 없이 지명과 거리만 말한다.
  //
  // ⚠️ 시뮬레이션 중에는 50/30/10m 3번 다 말하지 않고 50m 1번만 말한다
  // (2026-09-21, 사용자 신고: "비프음만 나와.. 이동속도가 빠르지 소리가
  // 못 마춰" — 시뮬레이션은 감속해도 프레임 간격이 250ms~1.5초인데 TTS
  // 문장 재생엔 1~2초가 걸려, 30m/10m 임계값이 이전 발화가 끝나기도
  // 전에 밀려 들어와 speechSynthesis.cancel()에 계속 잘려나갔다. 실제
  // 산행(GPS)은 실제 이동 속도라 이 문제가 없으므로 그대로 3단계 유지).
  function speakTurnApproach(nextM, threshold, clockOnly) {
    if (isSimulationMode && threshold !== 50) return;
    const text = clockOnly
      ? `${threshold}미터 앞 ${clockOnly}`
      : `${nextM.name} ${threshold}미터 앞`;
    speakGuidance(text);
  }

  // 화면 자동 꺼짐 방지 (Wake Lock) — 길찾기 회전 모드(화살표 ON, 2클릭)
  // 동안에는 화면을 계속 봐야 하므로 자동 잠금을 막는다. 지원 안 하는
  // 브라우저(구형 iOS Safari 등)에서는 조용히 무시한다.
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }
  // 화면이 숨겨지면(다른 앱으로 전환, 화면 꺼짐 등) GPS 수신을 완전히
  // 멈춘다. watchPosition을 백그라운드에서도 계속 돌리면 배터리와
  // 메모리를 불필요하게 소모하고, 등산 중 화면을 계속 볼 필요가 없는
  // 순간(주머니에 넣기 등)까지 계산을 이어갈 이유가 없다.
  // 다시 화면이 보이면 GPS를 재시작하고 관련 상태를 전부 초기화해
  // "새로 시작하는 것"처럼 처리한다 — 숨겨진 동안 실제로 이동했을 수
  // 있는데 옛 위치·방향값이 남아있으면 복귀 시 급격한 격차를 좁히려
  // 하면서 지도·나침반·화살표가 한꺼번에 튀는 원인이 되기 때문이다.
  let wasTrackingBeforeHidden = false;
  // 화면이 꺼졌을 때 저전력 폴링으로 전환했는지 — visible 복귀 시 이
  // 값으로 "일반 GPS로 되돌릴지"를 판단한다(폴링 중이 아니었다면, 즉
  // GPS 자체가 완전히 꺼졌던 것이므로 기존처럼 새로 시작한다).
  let wasPollingBeforeHidden = false;

  document.addEventListener('visibilitychange', () => {
    // 🔌 네이티브 앱(gaja-app)에서는 화면이 꺼져도 Foreground Service가
    // 계속 GPS를 공급하므로(포그라운드서비스_작업매뉴얼.md), 기존
    // 저전력 폴링/GPS 완전 종료 로직을 건너뛴다 — 이게 이 작업의
    // 존재 이유(화면 꺼짐 중에도 이탈 비프음이 즉시 울리게 하는 것)다.
    // 화면이 다시 보일 때의 리셋(아래 'visible' 분기)도 네이티브에선
    // 필요 없다 — watchId가 'native'로 계속 유지되어 위치가 끊긴 적이
    // 없으므로 지도/회전 상태를 다시 초기화할 이유가 없다.
    if (isNativeApp()) return;
    if (document.visibilityState === 'hidden') {
      // 화면이 꺼질 때: 🔔 예약(lowPowerModeEnabled)이 켜져 있으면 일반
      // GPS를 저전력 폴링으로 전환하고, 꺼져 있으면 기존처럼 GPS 자체를
      // 완전히 끈다(2026-09-21 전면 재설계, 사용자 지시: "저전력 모드를
      // on 시키면 화면 꺼졌을때 저전력 모드를 사용한다는 이야기야").
      if (watchId !== null) {
        wasTrackingBeforeHidden = true;
        if (lowPowerModeEnabled) {
          wasPollingBeforeHidden = true;
          startLowPowerPolling(); // 내부에서 watchId clearWatch까지 처리
        } else {
          wasPollingBeforeHidden = false;
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
          releaseWakeLock();
          stopCompass();
        }
      }
      // isLowPowerPolling이 이미 true인 상태로 화면이 또 꺼지는 경우
      // (예: 백그라운드→포그라운드→백그라운드 반복)는 위 watchId 분기에
      // 안 걸리지만, 이미 저전력 폴링 중이므로 추가로 할 일이 없다.
    } else if (document.visibilityState === 'visible') {
      const wasPolling = isLowPowerPolling;
      if (wasTrackingBeforeHidden || wasPolling) {
        wasTrackingBeforeHidden = false;

        // 🔔 화면이 다시 보이면 항상 일반 GPS로 복귀한다 — 저전력
        // 폴링 중이었어도 예외 없이 멈춘다(사용자 지시: "화면이 켜지면
        // 보통 gps 모드가 전환이 되어야 해"). lowPowerModeEnabled(예약)
        // 자체는 건드리지 않으므로 다음에 화면이 또 꺼지면 다시 저전력
        // 으로 전환된다.
        if (wasPolling) stopLowPowerPolling();

        gpsFilterEngine.reset();
        gpsMovementHeading = null;
        isCurrentlyStopped = false;

        // 🔧 왕복(원점회귀) 트랙 매칭/역주행/이탈 판정 상태도 함께
        // 초기화한다(대원칙 6번: GPS를 새로 잡으면 이전 방향 상태를
        // 신뢰하지 않는다) — 여기가 빠져 있으면, 백그라운드에서 돌아온
        // 직후 옛날(화면 끄기 전) 위치 기준으로 남아있던 lastNearestIdx가
        // 엉뚱한 트랙 가닥(왕복 구간이면 반대편 선분)을 계속 우선
        // 탐색하게 되고, trackDirection도 옛 상태 그대로 남아 화살표가
        // 반대로 나오는 원인이 되었다(resetOriginNow()의 리셋 목록과
        // 동일하게 맞춘다). resetTrailSearchWindow가 내부적으로
        // resetTrackDirectionState도 호출하므로 여기서 따로 반복하지
        // 않는다(예전엔 두 리셋이 분리돼 있어 타이밍이 어긋날 수 있었다
        // — 테스트 재현: "포그라운드 복귀 시 180도 회전이 들쭉날쭉").
        resetTrailSearchWindow();
        isOffTrailState = false;
        offTrailStreakCount = 0;
        returnStreakCount = 0;
        lastAlertedMilestoneKey = null;
        remainingBeepThresholds = null;

        // 🧭 지도 중심/회전 상태를 완전히 리셋해 "새로 시작하는 것"처럼
        // 만든다(2026-09-21, 이슈 #5) — 안 그러면 userGpsMarker가 남아있어
        // handleGpsPositionUpdate의 "첫 픽스" 재중심 분기(!userGpsMarker)를
        // 못 타고, isHeadingUp이 이미 true라 setHeadingUpMode(true,...)도
        // 다시 안 불려서, 떠나기 전의 낡은 회전각(mapRotationDeg)이 그대로
        // 유지된 채 위치만 옮겨져 방향이 어긋난 지도가 보인다.
        if (userGpsMarker) { map.removeLayer(userGpsMarker); userGpsMarker = null; }
        isHeadingUp = false;
        mapRotationDeg = 0;
        appliedMapRotationDeg = 0;
        currentRotationOriginDist = null;
        firstOriginFixCount = 0;
        isFirstFix = true;
        hideBottomDirectionArrow(); // 낡은 방향 기준으로 떠 있던 하단 알림도 함께 지운다

        // 🗺️ 가자맵 대원칙 재설계(2026-09-25) — "포그라운드 복귀 직후
        // 기존 map rotation 값을 그대로 신뢰하지 않는다"는 명세에 따라,
        // 새 구간 상태(currentMilestoneIdx/nextMilestoneIdx)와 100m
        // 재중심 게이트(lastRecenterDistance)도 함께 리셋한다 — 다음
        // GPS 픽스(startGpsTracking 이후 handleGpsPositionUpdate)가
        // 구간 미확정 상태에서 자동으로 재탐색해 새로 구간을 확정한다.
        currentMilestoneIdx = 0;
        nextMilestoneIdx = 1;
        lastRecenterDistance = null;

        startGpsTracking(); // 항상 일반 GPS로 재시작 — 내부에서 wakeLock 등도 함께 재요청됨
      }
    }
  });

  // 산행 가기 전 미리보기 (따라가기) 시뮬레이션 모드
  let simInterval = null;
  let simIndex = 0;
  let simMarker = null;
  let simSpeed = 1;
  // 시뮬레이션 재생/일시정지 중 true — updateSegmentRotationTrigger가
  // 회전 목표 탐색 거리를 100m(실제 GPS) 대신 500m로 쓸지 판단하는 데
  // 참조한다(toggleSimulation 시작/종료 지점에서 설정).
  let isSimulationMode = false;

  // ════════════════════════════════════════════════════════════════
  // 🎬 시뮬레이션 전용 트랙 매칭(2026-09-25, 사용자 지시: "시뮬레이션과
  // 실제 하곤 다른 코드지? 내가 실제 코드를 수정하면 시뮬레이션에
  // 영향을 주면 안 돼는데" → "분리해줘. 시뮬레이션 전용 복사본 함수를
  // 만들고 오차 주입버튼은 제거해줘") — 예전엔 시뮬레이션도 실제 GPS와
  // 같은 nearestPointOnTrail()/updateMoveDirection()/lastNearestIdx/
  // moveDirectionSign을 공유했다. 그래서 "시뮬레이션에서 재현된 버그를
  // 고치려고 이 공유 함수를 손보면 실제 GPS 동작도 함께 바뀌는" 구조였고
  // (실제로 배속 재생 중 화살표가 반대로 나오는 문제를 고치다 실제 GPS
  // 쪽 로직까지 여러 차례 건드리게 됐다), 반대로 실제 코드를 고치면
  // 시뮬레이션 검증 결과가 달라질 수도 있었다.
  //
  // 이제 둘을 완전히 분리한다: 이 아래 Sim 접두사가 붙은 함수/변수는
  // 시뮬레이션(renderSimFrame)만 사용하고, 실제 GPS 경로
  // (handleGpsPositionUpdate 등)가 쓰는 nearestPointOnTrail/
  // updateMoveDirection/updateTrackDirection/lastNearestIdx/
  // moveDirectionSign/trailTrackingMode는 전혀 건드리지 않는다.
  // 시뮬레이션 매칭은 원래 GPX 좌표를 오차 없이 그대로 재생하므로(🧪
  // GPS 오차 주입 디버그 기능은 목적을 다해 제거했다 — 실제 GPS 코드가
  // 이제 시뮬레이션과 분리됐으니, GPS 오차 상황은 실기기로 직접
  // 테스트/셋팅해야 한다는 것이 사용자 판단), 매 프레임 단순 전역
  // 최근접 탐색이면 충분하고 LOCKED/SEARCHING 같은 이중 모드나 방향
  // 페널티가 필요 없다.
  let simLastNearestIdx = -1;
  let simMoveDirectionSign = 1;
  let simLastMoveDirectionIdx = null;

  // 🧭 하단 경로 알람(updateNavigationToast/findNextMilestone/
  // findNextRotationTarget)의 "왕복 코스 올라가는중/내려가는중" 판정도
  // 완전히 분리한다 — updateTrackDirection과 동일한 상태 구조
  // (lastConfirmedTrackIdx/trackDirectionCandidate/trackDirectionCandidateStreak)
  // 를 시뮬레이션 전용으로 복제했다. 다만 그 소비처(updateNavigationToast
  // 등)는 전역 isReversingOnTrail 변수를 직접 참조하는 구조라 매개변수화
  // 하지 않았다 — 대신 renderSimFrame이 프레임을 렌더하는 그 순간에만
  // 전역 변수를 시뮬레이션 값으로 잠깐 바꿔 쓰고 끝나면 실제 GPS 값으로
  // 되돌린다(시뮬레이션과 실제 GPS는 동시에 실행되지 않으므로 안전).
  let simTrackDirectionCandidate = null;
  let simTrackDirectionCandidateStreak = 0;
  let simLastConfirmedTrackIdx = null;
  let simIsReversingOnTrail = false;

  function updateTrackDirectionForSim(nearestIdx) {
    if (simLastConfirmedTrackIdx === null) {
      simLastConfirmedTrackIdx = nearestIdx;
      return;
    }
    const rawDelta = nearestIdx - simLastConfirmedTrackIdx;
    simLastConfirmedTrackIdx = nearestIdx;
    if (Math.abs(rawDelta) < MIN_INDEX_DELTA) return;
    const candidate = rawDelta > 0 ? 'forward' : 'backward';
    if (candidate === simTrackDirectionCandidate) {
      simTrackDirectionCandidateStreak++;
    } else {
      simTrackDirectionCandidate = candidate;
      simTrackDirectionCandidateStreak = 1;
    }
    if (simTrackDirectionCandidateStreak >= TRACK_DIRECTION_CONFIRM_STREAK) {
      simIsReversingOnTrail = (simTrackDirectionCandidate === 'backward');
    }
  }
  function resetSimTrackDirectionState() {
    simIsReversingOnTrail = false;
    simTrackDirectionCandidate = null;
    simTrackDirectionCandidateStreak = 0;
    simLastConfirmedTrackIdx = null;
  }

  // 🐛 2026-09-25 수정(사용자 재현: "시뮬레이션 해보면 화살표가 반대로
  // 가는 경우가 많이 생겨") — 근본 원인은 "가장 가까운 점을 다시
  // 찾는 재매칭 자체"였다. 시뮬레이션은 GPX 원본 좌표를 오차 없이
  // 그대로 재생하므로, 재생 중인 idx가 이미 정확한 트랙 위치다(
  // currentPoints[idx] 그 자체가 코스 데이터). 그런데도 "가장 가까운
  // 점 찾기"를 다시 수행하면, 코스가 급하게 꺾이는 구간이나 왕복
  // (원점회귀) 코스에서 좌표가 트랙포인트와 정확히 일치할 때 반대편
  // (들어오는/나가는 선분, 또는 가는 길/오는 길)이 우연히 더 가깝다고
  // 判정될 수 있다 — 이건 GPS 오차와 무관하게 재매칭 로직 자체가
  // 만드는 구조적 문제다. 해법은 애초에 재매칭을 하지 않는 것 —
  // 재생 idx를 그대로 트랙 위치로 신뢰한다.
  function nearestPointOnTrailForSim(idx, points) {
    if (!points || points.length === 0) {
      simLastNearestIdx = -1;
      return { distance: 0, point: null, index: -1 };
    }
    const maxIdx = points.length - 2;
    const bestIdx = Math.max(0, Math.min(idx, Math.max(maxIdx, 0)));

    // 방향 판정: 직전 확정 index와의 delta 부호를 그대로 반영 —
    // idx는 재생 순서 그 자체이므로 반대편으로 튈 일이 구조적으로 없다.
    if (simLastMoveDirectionIdx === null) {
      simLastMoveDirectionIdx = bestIdx;
    } else {
      const delta = bestIdx - simLastMoveDirectionIdx;
      simLastMoveDirectionIdx = bestIdx;
      if (delta !== 0) simMoveDirectionSign = delta > 0 ? 1 : -1;
    }
    simLastNearestIdx = bestIdx;
    return { distance: 0, point: points[bestIdx], index: bestIdx };
  }

  // 실제 GPS용 computeArrowHeading은 전역 moveDirectionSign을 참조한다
  // — 시뮬레이션은 simMoveDirectionSign을 쓰므로 그대로 재사용할 수
  // 없어 동일한 계산을 시뮬레이션 전용 부호로 다시 수행하는 얇은
  // 사본을 둔다(findPointAheadByDistance/calculateBearing 등 순수
  // 헬퍼는 그대로 공유 — 상태가 없는 함수라 분리할 이유가 없다).
  function computeArrowHeadingForSim(lat, lon, nearestIdx, isNearTrailheadNow, traveledDist, nearestOnTrailPoint) {
    if (isNearTrailheadNow) {
      const target = nearestOnTrailPoint || (currentPoints && currentPoints.length > 0 ? currentPoints[0] : null);
      if (!target) return null;
      return calculateBearing(lat, lon, target.lat, target.lon);
    }
    if (!currentPoints || nearestIdx < 0 || !cumulativeDistances || cumulativeDistances.length < 2) return null;
    const dist = (traveledDist !== undefined && traveledDist !== null) ? traveledDist : (cumulativeDistances[nearestIdx] || 0);
    const targetDist = dist + simMoveDirectionSign * ARROW_LOOKAHEAD_M;
    const aheadPt = findPointAheadByDistance(currentPoints, cumulativeDistances, 0, Math.max(0, targetDist));
    if (!aheadPt) return null;
    return calculateBearing(lat, lon, aheadPt.lat, aheadPt.lon);
  }

  function setSimSpeed(speed, event) {
    simSpeed = speed;
    if (event) {
      document.querySelectorAll('.sim-speed-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  }

  // 시뮬레이션의 한 프레임(idx 위치)을 화면에 반영한다 — 자동재생
  // 인터벌과 스크럽 바 드래그 양쪽에서 공통으로 쓰는 렌더 함수.
  // mapViewOpts로 자동재생은 부드럽게(animate:true), 스크럽 드래그는
  // 즉시(animate:false) 반영하도록 구분한다.
  function renderSimFrame(idx, mapViewOpts) {
    if (!currentPoints || idx < 0 || idx >= currentPoints.length) return;
    const pt = currentPoints[idx];
    // 시뮬레이션은 항상 GPX 원본 좌표를 오차 없이 그대로 재생한다
    // (2026-09-25, 사용자 지시: 시뮬레이션/실제 GPS 완전 분리 — 이전에
    // 있던 🧪 GPS 오차 주입 디버그 토글은 목적을 다해 제거했다. GPS
    // 오차가 섞인 상황은 이제 실기기로 직접 테스트/셋팅한다).
    const lat = pt.lat;
    const lon = pt.lon;

    // 🧭 시뮬레이션 전용 매칭/방향 함수 사용(nearestPointOnTrailForSim/
    // computeArrowHeadingForSim, 위 정의부 주석 참고) — 실제 GPS가 쓰는
    // nearestPointOnTrail/moveDirectionSign과 완전히 분리된 상태
    // (simLastNearestIdx/simMoveDirectionSign)를 쓰므로, 어느 한쪽을
    // 고쳐도 다른 쪽에 영향을 주지 않는다. 재생 idx를 그대로 트랙
    // 위치로 신뢰하므로(재매칭 없음), lat/lon이 아니라 idx를 넘긴다.
    const simNearest = nearestPointOnTrailForSim(idx, currentPoints);
    updateTrackDirectionForSim(simNearest.index); // 시뮬레이션 전용 상태만 갱신(simIsReversingOnTrail) — 실제 GPS의 isReversingOnTrail은 안 건드림
    const simTraveledDist = cumulativeDistances[simNearest.index] || 0;
    const simIsNearTrailhead = isSegmentRotationMode && currentRotationOriginDist === null && simTraveledDist < TRAILHEAD_ENTRY_DISTANCE_M;
    const simArrowHeading = computeArrowHeadingForSim(lat, lon, simNearest.index, simIsNearTrailhead, simTraveledDist, simNearest.point);

    // 실제 GPS 추적과 동일한 방향 화살표 마커를 사용한다 — 예전엔
    // 단순 원형 점만 그려서 시뮬레이션 중 "내 위치 화살표가 안
    // 보인다"는 문제가 있었다.
    if (!simMarker) {
      const icon = L.divIcon({
        className: 'custom-gps-icon',
        html: createGpsIconHtml(simArrowHeading),
        iconSize: [80, 80],
        iconAnchor: [40, 40]
      });
      simMarker = L.marker([lat, lon], { icon, zIndexOffset: 1000 }).addTo(map);
    } else {
      simMarker.setLatLng([lat, lon]);
    }
    if (simArrowHeading !== null) renderGpsArrow(simArrowHeading);

    lastKnownPos = { lat, lon };
    isCurrentlyStopped = false;
    isOffTrailState = false;

    // 이정표 근접 모달은 실제 GPS 콜백(handleGpsPositionUpdate)과 동일하게
    // 시뮬레이션(따라가기 재생) 중에도 떠야 한다 — fire-and-forget으로
    // 호출해 시뮬레이션 프레임 진행을 막지 않는다.
    updatePoiProximity(lat, lon);

    // 🧭 지도 회전(시뮬레이션 전용, 2026-09-25 재조정) — 사용자 지시:
    // "시뮬레이션에는 속도가 빨라서 지도가 춤을 추어. 시뮬레이션만
    // 따로 기존 로직 적용하게 해". 실제 GPS는 매 픽스 즉시 회전
    // (applyLiveMapRotation)을 그대로 쓰지만, 시뮬레이션은 배속(최대
    // 5x) 재생이라 짧은 시간에 많은 프레임이 지나가면서 매 프레임
    // 즉시 회전이 오히려 화면을 정신없이 흔든다. 시뮬레이션만 예전
    // 구간회전 방식(방향점 도착/원점 확정 시에만 회전)으로 되돌린다
    // — updateNavigationToast 안에서 이미 원점(currentRotationOriginDist)
    // 확정을 판정하므로, 그 값이 이번 프레임에 바뀌었을 때만 새 목표를
    // 향해 회전시킨다.
    const originBeforeToast = currentRotationOriginDist;

    // 🧭 하단 경로 알람(updateNavigationToast)과 findNextRotationTarget은
    // 전역 isReversingOnTrail을 직접 참조하는 기존 구조를 그대로 둔 채
    // (호출 체인 전체를 매개변수화하는 대공사 대신), 이 프레임을 렌더하는
    // 짧은 구간에만 시뮬레이션 전용 값(simIsReversingOnTrail)으로 잠깐
    // 바꿔 쓰고 끝나면 실제 GPS 값으로 되돌린다 — 시뮬레이션과 실제 GPS
    // 추적은 동시에 실행되지 않으므로(하나를 켜면 다른 하나는 꺼짐,
    // toggleSimulation/startGpsTracking 참고) 안전하다.
    const realIsReversingOnTrailBeforeSim = isReversingOnTrail;
    isReversingOnTrail = simIsReversingOnTrail;

    // ⚠️ updateNavigationToast를 지도뷰 갱신보다 먼저 호출한다 —
    // 기존 순서를 그대로 유지(하단 경로 알람/원점 확정 로직 때문).
    updateNavigationToast(5, 0, idx, pt, simArrowHeading);

    if (currentRotationOriginDist !== null && currentRotationOriginDist !== originBeforeToast) {
      const rotationLookaheadM = isSimulationMode ? SIM_ROTATION_TARGET_LOOKAHEAD_M : undefined;
      const nextTarget = findNextRotationTarget(currentRotationOriginDist, isReversingOnTrail, rotationLookaheadM);
      if (nextTarget) {
        const bearing = computeGuidanceHeading(lat, lon, nextTarget.lat, nextTarget.lon);
        if (bearing !== null) applySegmentRotation(bearing);
      }
    }

    isReversingOnTrail = realIsReversingOnTrailBeforeSim; // 실제 GPS 값 복원

    const currentZoom = Math.max(map.getZoom(), 15);
    applyMapViewWithOffset(lat, lon, currentZoom, mapViewOpts);
  }

  // --- 🎬 구간 탐색(스크럽) 바 ---
  let simScrubDragging = false;

  function updateSimScrubHandle() {
    const handle = document.getElementById('simScrubHandle');
    const fill = document.getElementById('simScrubFill');
    if (!handle || !fill || !currentPoints || currentPoints.length < 2) return;
    const progress = simIndex / (currentPoints.length - 1); // 0(들머리) ~ 1(날머리)
    // 트랙 가로축: 왼쪽=들머리(0%), 오른쪽=날머리(100%) — 손가락으로
    // "오른쪽으로 밀수록 코스 뒷부분"이라는 직관과 맞춘다.
    handle.style.left = `${progress * 100}%`;
    fill.style.width = `${progress * 100}%`;
  }

  function simScrubIndexFromClientX(clientX) {
    const track = document.getElementById('simScrubTrack');
    if (!track || !currentPoints || currentPoints.length < 2) return null;
    const rect = track.getBoundingClientRect();
    let progress = (clientX - rect.left) / rect.width;
    progress = Math.max(0, Math.min(1, progress));
    return Math.round(progress * (currentPoints.length - 1));
  }

  function handleSimScrubStart(evt) {
    if (!simInterval) return; // 시뮬레이션이 켜져 있을 때만 동작
    simScrubDragging = true;
    const point = evt.touches ? evt.touches[0] : evt;
    const idx = simScrubIndexFromClientX(point.clientX);
    if (idx !== null) {
      simIndex = idx;
      renderSimFrame(simIndex, { animate: false });
      updateSimScrubHandle();
    }
    evt.preventDefault();
  }

  function handleSimScrubMove(evt) {
    if (!simScrubDragging) return;
    const point = evt.touches ? evt.touches[0] : evt;
    const idx = simScrubIndexFromClientX(point.clientX);
    if (idx !== null) {
      simIndex = idx;
      renderSimFrame(simIndex, { animate: false });
      updateSimScrubHandle();
    }
    evt.preventDefault();
  }

  function handleSimScrubEnd() {
    simScrubDragging = false;
  }

  function initSimScrubEvents() {
    const track = document.getElementById('simScrubTrack');
    if (!track || track._simScrubBound) return;
    track._simScrubBound = true;
    track.addEventListener('touchstart', handleSimScrubStart, { passive: false });
    window.addEventListener('touchmove', handleSimScrubMove, { passive: false });
    window.addEventListener('touchend', handleSimScrubEnd);
    track.addEventListener('mousedown', handleSimScrubStart);
    window.addEventListener('mousemove', handleSimScrubMove);
    window.addEventListener('mouseup', handleSimScrubEnd);
  }

  // 재생 중 "일시정지"인지 여부 — simInterval이 null이어도 이 값이
  // true면 "재생을 잠시 멈춘 것"이고, toggleSimulation()의 종료 처리
  // (마커 제거, 구간회전 해제 등)는 아직 실행하지 않은 상태다.
  let isSimPaused = false;

  function toggleSimulation() {
    if (!currentPoints || currentPoints.length < 2) {
      alert('먼저 등산로 코스를 불러와주세요.');
      return;
    }
    const btn = document.getElementById('simBtn');
    const pauseBtn = document.getElementById('simPauseBtn');
    const speedOpts = document.getElementById('simSpeedOptions');

    // 재생 중이거나(simInterval) 일시정지 중(isSimPaused)이면 완전 종료.
    if (simInterval || isSimPaused) {
      if (simInterval) clearTimeout(simInterval);
      simInterval = null;
      isSimPaused = false;
      btn.innerText = '▶️';
      btn.classList.remove('active');
      pauseBtn.style.display = 'none';
      pauseBtn.innerText = '⏸️';
      speedOpts.style.display = 'none';
      if (simMarker) {
        map.removeLayer(simMarker);
        simMarker = null;
      }
      showHeadingArrow = false;
      const toast = document.getElementById('gpsToast');
      toast.style.display = 'none';
      showToastBadge('🛑 따라가기 미리보기 모드를 종료했습니다.');
      const scrubTrack = document.getElementById('simScrubTrack');
      if (scrubTrack) scrubTrack.classList.remove('active');
      // 🧭 구간회전도 시뮬레이션과 함께 종료 — 실제 GPS 켜짐 상태가
      // 아니므로 지도를 북쪽 고정으로 되돌린다.
      const mapEl = document.getElementById('map');
      isSegmentRotationMode = false;
      isSimulationMode = false;
      currentRotationOriginDist = null;
      mapRotationDeg = 0;
      appliedMapRotationDeg = 0;
      updateRouteBadgeRotation();
      if (mapEl) { mapEl.classList.remove('heading-up'); mapEl.style.transform = ''; }
      setTimeout(() => map.invalidateSize({ animate: false }), 520);
      return;
    }

    if (watchId !== null) stopGpsTracking(); // 켜져있던 진짜 GPS 중단

    // 🔊 iOS Safari는 AudioContext가 "사용자 제스처를 처리하는 이벤트
    // 핸들러 안에서" 생성/resume되지 않으면 이후 소리를 내지 않는다
    // (안드로이드 크롬보다 훨씬 엄격함). startGpsTracking()에는 이
    // unlock 코드가 있었지만 toggleSimulation()에는 빠져 있어서,
    // 시뮬레이션 재생 중 지명 통과 알람(playPassedMilestoneBeep)이
    // iOS에서만 소리가 안 나는 원인이었다(사용자 재현: "아이폰에서는
    // 소리가 안 나.. 지명 통과시... 시뮬레이션만"). 지금 이 클릭
    // 자체가 사용자 제스처이므로 여기서 미리 열어/재개해둔다.
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}

    // simBtn(왼쪽)은 이제 "완전 종료" 전용 버튼이다 — 일시정지는
    // simPauseBtn이 따로 담당하므로, 재생 중에도 ⏸️가 아니라 종료를
    // 뜻하는 ⏹️(검정 사각형)로 표시해 두 버튼의 아이콘이 겹치지 않게
    // 한다(사용자 요청: 빨간 원형 🛑 대신 검정 사각형으로).
    btn.innerText = '⏹️';
    btn.classList.add('active');
    pauseBtn.style.display = 'flex';
    speedOpts.style.display = 'flex';
    simIndex = 0;
    // 🧭 시뮬레이션 전용 매칭/방향 상태 초기화(2026-09-25, 실제 GPS와
    // 완전 분리 이후) — 이전 시뮬레이션 세션의 simLastNearestIdx가
    // 남아있으면 새 재생이 엉뚱한 지점부터 시작된 것처럼 보일 수 있다.
    // 실제 GPS 상태(lastNearestIdx/trailTrackingMode)는 시뮬레이션과
    // 더 이상 무관하므로 건드리지 않는다 — 예전엔 resetTrailSearchWindow()
    // 를 호출해 실제 GPS 추적 중에 시뮬레이션 버튼을 누르면 실제 GPS
    // 상태까지 함께 리셋되는 부작용이 있었다.
    simLastNearestIdx = -1;
    simMoveDirectionSign = 1;
    simLastMoveDirectionIdx = null;
    resetSimTrackDirectionState(); // 시뮬레이션 전용 isReversingOnTrail(simIsReversingOnTrail)도 함께 초기화 — 실제 GPS 상태는 건드리지 않음
    // createGpsIconHtml은 showHeadingArrow가 true일 때만 방향 화살표를
    // 그린다 — 실제 GPS(startGpsTracking)만 이 값을 켰고 시뮬레이션은
    // 전혀 건드리지 않아, 파란 점만 보이고 방향 콘이 안 보이던
    // 근본 원인이었다.
    showHeadingArrow = true;

    // 🧭 구간회전 미리보기 — 실제 GPS를 켜지 않아도 시뮬레이션 중에는
    // 구간 heading-up이 동작해야 배포 전 동작을 확인할 수 있다. 원래
    // isHeadingUp(GPS 켜짐 버튼)에만 연동돼 있었는데, toggleSimulation은
    // 그 버튼을 거치지 않아 이 상태가 켜지지 않던 문제를 수정.
    {
      const mapEl = document.getElementById('map');
      isSegmentRotationMode = true;
      isSimulationMode = true;
      currentRotationOriginDist = null;
      firstOriginFixCount = FIRST_ORIGIN_MIN_FIXES; // 시뮬레이션은 미리보기이므로 대기 없이 즉시 확정
      if (mapEl) mapEl.classList.add('heading-up');
    }
    showToastBadge('▶️ 모의 주행 (따라가기) 시작\n산행 전 전체 경로를 미리 따라가 봅니다.');

    const toast = document.getElementById('gpsToast');
    toast.style.display = 'block';
    toast.className = 'gps-toast';

    const scrubTrack = document.getElementById('simScrubTrack');
    if (scrubTrack) scrubTrack.classList.add('active');
    initSimScrubEvents();
    updateSimScrubHandle();

    // #map 크기가 100% -> 120vh로 바뀌는 걸 Leaflet이 자동 감지하지
    // 못해 지도 절반이 빈 회색으로 보이는 문제 — invalidateSize로 강제
    // 재계산해야 한다(실기기 시뮬레이션에서 실측 확인된 버그).
    setTimeout(() => map.invalidateSize({ animate: false }), 520);
    // 더 부드러운 이동을 위해 250ms 단위 갱신 (초당 4프레임)
    startSimInterval();
  }

  // 기준 인터벌(감속 없을 때의 프레임 간격) — 아래 SIM_BASE_INTERVAL_MS로 이동.
  const SIM_BASE_INTERVAL_MS = 250;

  // 시뮬레이션 프레임을 진행시키는 공용 로직 — 최초 재생 시작
  // (toggleSimulation)과 일시정지 후 재개(toggleSimulationPause) 양쪽에서
  // 동일하게 재사용한다.
  //
  // ⚠️ setInterval(고정 250ms) 대신 setTimeout 재귀로 바꿨다(2026-09-21,
  // 사용자 신고: "시뮬레이션 안 돼.. 자동으로 속도 조절하는거"). 원인은
  // 이동 단위가 GPX 원본 포인트(인덱스)라는 데 있었다 — 감속 계산 자체는
  // 정상적으로 작은 stepDistanceM을 냈지만, 그 코스의 GPX 포인트 간격이
  // 넓은 구간(예: 30~40m)에서는 "요청한 stepDistanceM만큼만 이동"이
  // 물리적으로 불가능해 결국 다음 포인트까지 강제로 점프해버려 감속이
  // 전혀 체감되지 않았다. 좌표를 선형 보간해도 회전/비프음 판정
  // (updateNavigationToast -> updateSegmentRotationTrigger)이 여전히
  // 정수 인덱스의 누적거리만 참조하므로 근본 해결이 안 된다 — 대신
  // 프레임 "간격"을 감속 비율만큼 늘려, 다음 포인트까지 실제로 더 오래
  // 걸리게 해서 체감 속도를 맞춘다(이동 단위는 그대로 유지, 시간만 조절).
  function startSimInterval() {
    function tick() {
      if (!currentPoints || simIndex >= currentPoints.length) {
        toggleSimulation();
        return;
      }
      renderSimFrame(simIndex, { animate: true, duration: 0.25 });
      updateSimScrubHandle();

      // 속도 조절 (250ms당 이동 거리 기준)
      // 0.5x: 초당 8m (0.25초당 2m) - 세밀하게 살펴볼 때
      // 1x: 초당 16m (0.25초당 4m) - 편안한 시야
      // 2x: 초당 40m (0.25초당 10m)
      // 3x: 초당 80m (0.25초당 20m)
      // 4x: 초당 160m (0.25초당 40m)
      // 5x: 초당 320m (0.25초당 80m)
      let stepDistanceM = 4;
      if (simSpeed === 0.5) stepDistanceM = 2;
      else if (simSpeed === 2) stepDistanceM = 10;
      else if (simSpeed === 3) stepDistanceM = 20;
      else if (simSpeed === 4) stepDistanceM = 40;
      else if (simSpeed === 5) stepDistanceM = 80;

      // 🐢 갈림길 자동 감속(2026-09-21, #4 사용자 지시): 다음 갈림길까지
      // 60m 이내면 사용자가 고른 배속을 상한으로 점진 감속하고, 50m
      // 이내는 항상 0.5배속에 해당하는 배율로 고정한다 — 아무리 빠른
      // 배속을 골라도 갈림길 직전에는 천천히 지나가며 안내를 놓치지
      // 않도록. SIM_DECEL_START_M 밖(60m 초과)에서는 평소 속도 그대로.
      // 감속 시작 거리(SIM_DECEL_START_M)는 하단 화살표가 뜨는 거리
      // (TURN_ALERT_DISTANCE_M=60m, showUpcomingTurnAlert 정의부)와 맞춘다.
      // decelSpeedRatio: 1(감속 없음) ~ SIM_SLOW_STEP_M/stepDistanceM
      // (완전 저속, 0.5배속과 동등)까지의 배율 — 이동 거리가 아니라
      // 프레임 간격(delayMs)에 곱해 "더 천천히" 만드는 데 쓴다.
      const SIM_DECEL_START_M = 60;
      const SIM_DECEL_SLOW_M = 50;
      const SIM_SLOW_STEP_M = 2; // 0.5배속에 해당하는 기준 step(delay 배율 계산용)
      let decelSpeedRatio = 1; // 1 = 정상 속도, 값이 클수록(예: 4) 느려짐(간격을 그만큼 늘림)
      if (currentMilestones && currentMilestones.length >= 2) {
        const traveledDist = cumulativeDistances[simIndex] || 0;
        const milestoneResult = findNextMilestone(traveledDist, isReversingOnTrail);
        if (milestoneResult) {
          const distToNext = isReversingOnTrail
            ? Math.max(0, traveledDist - milestoneResult.nextM.distanceM)
            : Math.max(0, milestoneResult.nextM.distanceM - traveledDist);
          const slowStepDistanceM = Math.max(SIM_SLOW_STEP_M, stepDistanceM); // 목표: 0.5배속과 동등한 stepDistanceM
          let targetStepDistanceM = stepDistanceM;
          if (distToNext <= SIM_DECEL_SLOW_M) {
            targetStepDistanceM = SIM_SLOW_STEP_M;
          } else if (distToNext <= SIM_DECEL_START_M) {
            // 60m -> 50m 구간에서 선형으로 감속(1 -> 0)
            const decelRatio = (distToNext - SIM_DECEL_SLOW_M) / (SIM_DECEL_START_M - SIM_DECEL_SLOW_M);
            targetStepDistanceM = SIM_SLOW_STEP_M + (stepDistanceM - SIM_SLOW_STEP_M) * decelRatio;
          }
          // "이동 거리를 줄이는" 대신 "그만큼 프레임 간격을 늘리는" 배율로
          // 환산한다 — GPX 포인트 간격과 무관하게 항상 체감 속도가 정확히
          // 반영된다(이동 자체는 다음 포인트까지 그대로, 그 포인트에
          // 도달하는 데 걸리는 시간만 느려짐).
          decelSpeedRatio = stepDistanceM / Math.max(targetStepDistanceM, 0.001);
        }
      }

      let nextIndex = simIndex + 1;
      const startDist = cumulativeDistances[simIndex] || 0;
      while (nextIndex < currentPoints.length) {
        const currentDist = cumulativeDistances[nextIndex] || 0;
        if (currentDist - startDist >= stepDistanceM) break;
        nextIndex++;
      }
      simIndex = nextIndex;

      // GPX 포인트 간격이 아주 넓은 구간에서는 decelSpeedRatio가 극단적으로
      // 커질 수 있다(한 스텝 실제 이동거리가 목표 저속보다 훨씬 크면 그
      // 배율만큼 간격이 늘어남) — 프레임이 몇 초씩 멈춘 것처럼 보이는
      // 역효과를 막기 위해 한 프레임당 최대 지연을 SIM_MAX_DELAY_MS로
      // 제한한다(사용자 확인: "최대 1.5초로 제한").
      const SIM_MAX_DELAY_MS = 1500;
      const delayMs = Math.min(SIM_BASE_INTERVAL_MS * decelSpeedRatio, SIM_MAX_DELAY_MS);
      simInterval = setTimeout(tick, delayMs);
    }
    simInterval = setTimeout(tick, SIM_BASE_INTERVAL_MS);
  }

  // 시뮬레이션 재생 중 "일시정지 ↔ 재개" 토글 — toggleSimulation()의
  // 시작/완전종료와는 별개 상태다. 일시정지 중에는 simInterval을 완전히
  // 지워 CPU를 아끼되, isSimPaused=true로 남겨 마커/구간회전 등은
  // 그대로 유지한다. 재개 시 같은 simIndex부터 startSimInterval()로
  // 인터벌만 다시 건다.
  function toggleSimulationPause() {
    if (!isSimPaused && !simInterval) return; // 재생 중도 일시정지 중도 아니면 무시
    const pauseBtn = document.getElementById('simPauseBtn');

    if (simInterval) {
      // 재생 중 -> 일시정지
      clearTimeout(simInterval);
      simInterval = null;
      isSimPaused = true;
      if (pauseBtn) pauseBtn.innerText = '▶️';
      showToastBadge('⏸️ 일시정지했습니다.');
      // ⚠️ clearInterval은 다음 프레임 실행만 막을 뿐, 이미 진행 중이던
      // 지도 회전 CSS 트랜지션(최대 0.5초)은 멈추지 않는다 — 그 상태로
      // 두면 일시정지 직후 잠깐 동안은 화면에 보이는 각도와
      // mapRotationDeg가 어긋나 그 사이 드래그하면 손가락 방향과 지도가
      // 맞지 않았다(finishMapRotationTransitionNow 정의부 참고). 일시정지
      // 시점에 트랜지션을 즉시 완료시켜, "정지 상태 = 지도가 완전히
      // 멈춰 있다"를 항상 보장한다.
      finishMapRotationTransitionNow();
      return;
    }

    // 일시정지 중 -> 재개
    // 🔊 iOS Safari는 일시정지 동안(특히 앱이 잠깐 백그라운드로 갔다
    // 온 경우) AudioContext가 다시 suspended로 전환될 수 있다 — 재개도
    // 명백한 사용자 제스처이므로 여기서 한 번 더 resume을 시도해둔다
    // (toggleSimulation() 시작점의 unlock과 같은 이유).
    try {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
    isSimPaused = false;
    if (pauseBtn) pauseBtn.innerText = '⏸️';
    showToastBadge('▶️ 이어서 재생합니다.');
    startSimInterval();
  }
  window.toggleSimulationPause = toggleSimulationPause;

  // 실시간 GPS 내 위치 추적 (확대 지도, 길찾기 회전 모드, 나침반 방향 빔, 등산로 복귀 가이드)
  function toggleGPS() {
    if (simInterval !== null || isSimPaused) toggleSimulation(); // 시뮬레이션 중(재생/일시정지)이면 끄기
    // 🔋 절전 모드 중엔 watchId가 null이라도 "GPS가 완전히 꺼진 것"이
    // 아니다 — 사용자가 버튼을 누르면 절전을 해제하고 즉시 재개한다
    // (startGpsTracking처럼 화면을 통째로 새로 초기화하지 않는다).
    if (isGpsSleeping) {
      exitGpsSleep('사용자가 직접 재개');
      return;
    }
    // 🔔 저전력 폴링 중에도 watchId는 null이다 — 이 상태를 "GPS가
    // 꺼진 것"으로 오판하면 GPS 버튼을 눌렀을 때 stopGpsTracking 대신
    // startGpsTracking이 실행돼 중복으로 켜지는 버그가 있었다.
    if (watchId !== null || isLowPowerPolling) {
      stopGpsTracking();
    } else {
      // 🏁 산행 세션이 이미 진행 중이면(사용자가 "🏁 등산 완료"를 아직
      // 안 눌렀으면) "등산 시작" 확인 버튼을 다시 띄우지 않고 곧바로
      // GPS를 재개한다 — 등산 중 GPS를 잠깐 껐다 켜는 것은 새 산행이
      // 아니다(사용자 지시: "등산 시작은 한번 하면 돼. 매번 왜 해?").
      // 세션이 없을 때만(진짜 첫 시작, 또는 이미 등산 완료를 누른 뒤)
      // 기존처럼 확인 버튼을 띄운다.
      const session = loadHikingSession();
      if (session && session.routeKey === currentRouteKey) {
        startGpsTracking();
      } else {
        showStartHikeOverlay();
      }
    }
  }

  // 🏁 등산 완료(사용자가 명시적으로 눌렀을 때만 호출) — 산행 세션을
  // 끝내고 GPS도 함께 끈다. 실수로 누르는 걸 막기 위해 확인창을 띄운다
  // — 되돌릴 방법이 없는(다음에 같은 코스를 열면 새 산행으로 처리되는)
  // 조작이므로, 손 닿는 곳에 있는 다른 FAB 버튼들과 달리 확인이
  // 필요하다.
  function confirmEndHike() {
    if (!confirm('🏁 이번 산행을 종료할까요?\n\n다음에 이 코스를 다시 열면 새 산행으로 시작됩니다.')) return;
    endHikingSession();
    stopGpsTracking();
    showToastBadge('🏁 산행을 종료했습니다. 수고하셨습니다!');
  }
  window.confirmEndHike = confirmEndHike;

  function stopGpsTracking() {
    const btn = document.getElementById('gpsBtn');
    const toast = document.getElementById('gpsToast');
    setHeadingUpMode(false, true);
    showHeadingArrow = false;
    releaseWakeLock();
    stopSleepMonitor(); // 🔋 절전 감시 타이머도 함께 정리 — 안 하면 GPS를 완전히 끈 뒤에도 백그라운드에서 계속 돔
    if (isNativeApp()) {
      try { window.AndroidBridge.stopForegroundLocation(); } catch(e) {}
    } else if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
    }
    watchId = null;
    stopCompass();
    if (userGpsMarker) { map.removeLayer(userGpsMarker); userGpsMarker = null; }
    if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
    hidePoiProximityModalOnExit(); // GPS를 끄면 떠 있던 이정표 모달도 함께 정리
    btn.innerText = '📍';
    btn.classList.remove('active');
    toast.style.display = 'none';
    hideBottomDirectionArrow();
    // 📡 첫 픽스를 받기 전에 사용자가 GPS를 바로 꺼버린 경우 대비.
    const waitingOverlayStop = document.getElementById('gpsWaitingOverlay');
    if (waitingOverlayStop) waitingOverlayStop.style.display = 'none';
    showToastBadge('📍 내 위치 추적을 종료했습니다.');

    // 🔔 일반 GPS를 끄면 저전력 예약/실제 폴링도 함께 완전히 정리한다 —
    // GPS 자체가 꺼진 상태에서는 저전력 모드가 선택 불가능해야 하므로
    // (사용자 지시: "일반 gps 가 off 상태면... 저전력모드는 선택도 안
    // 되게 해야해") 예약(lowPowerModeEnabled)까지 함께 끈다.
    stopLowPowerPolling();
    lowPowerModeEnabled = false;
    try { localStorage.removeItem('gajago_low_power_mode'); } catch(e) {}
    updateLowPowerBtnUI();
  }

  // ════════════════════════════════════════════════════════════════
  // 🔋🔔 저전력 모드 — 전면 재설계(2026-09-21, 사용자 지시): "일반 GPS
  // 모드와 저전력 모드는 독립적으로 움직여야 해. 보통 gps 모드를 사용해.
  // 저전력 모드는 화면 꺼졌을 경우에도 gps와 소리를 위해 사용하는
  // 모드야. 저전력 모드를 on 시키면 화면 꺼졌을때 저전력 모드를
  // 사용한다는 이야기야. 화면이 켜지면 보통 gps 모드로 전환이 되어야
  // 해."
  //
  // 🔔 버튼(toggleLowPowerMode)은 GPS를 직접 켜거나 끄지 않는다 — 오직
  // lowPowerModeEnabled(설정값)만 토글한다. 실제로 5초 폴링이 도는지
  // (isLowPowerPolling)는 오직 visibilitychange가 결정한다:
  //   - 화면이 보이는 동안: 항상 일반 GPS(watchPosition, 1초 간격).
  //     lowPowerModeEnabled가 true여도 화면이 켜져 있으면 그냥 일반
  //     GPS처럼 동작한다(사용자 지시: "화면이 켜졌는데 gps가 5초마다
  //     작동을 하면 위치 찾는 유저는 환장하겠지").
  //   - 화면이 꺼질 때: lowPowerModeEnabled가 true면 일반 GPS를 멈추고
  //     5초 폴링으로 전환. false면 기존처럼 GPS 자체를 완전히 끈다.
  //   - 화면이 다시 보이면: 폴링 중이었다면 멈추고 일반 GPS로 복귀.
  // 폴링은 getCurrentPosition을 5초마다 호출하는 방식이라 GPS 칩이
  // 요청 사이에 쉬는 시간이 생겨 watchPosition보다 배터리 절약 효과가
  // 크다. 화면이 완전히 꺼진 상태(PWA 탭이 백그라운드)에서 JS 타이머가
  // 실제로 계속 도는지는 브라우저/OS 정책에 달려 있어 100% 보장은
  // 안 되고, 완전한 백그라운드 동작은 추후 APK 전환 시 네이티브
  // 서비스로 다뤄야 한다 — 지금은 화면이 켜져 있을 때의 스위치 로직만
  // 정확히 맞춘다.
  const LOW_POWER_POLL_INTERVAL_MS = 5000;

  function toggleLowPowerMode() {
    // 🔌 네이티브 앱(gaja-app)에서는 Foreground Service가 화면 꺼짐
    // 중에도 항상 정상 GPS를 공급하므로 저전력 폴링 자체가 무의미하다
    // (오히려 두 위치 소스가 겹치면 혼란만 생김).
    if (isNativeApp()) {
      showToastBadge('📍 이 앱은 화면이 꺼져도 항상 정상 GPS로 동작합니다.');
      return;
    }
    // GPS 자체가 꺼져 있으면(지도만 보는 중) 저전력 모드를 선택할 수
    // 없다(사용자 지시) — 먼저 🎯로 GPS를 켜야 한다.
    if (watchId === null && !isLowPowerPolling) {
      showToastBadge('📍 먼저 [내 위치]로 GPS를 켜주세요.');
      return;
    }
    lowPowerModeEnabled = !lowPowerModeEnabled;
    try {
      if (lowPowerModeEnabled) localStorage.setItem('gajago_low_power_mode', '1');
      else localStorage.removeItem('gajago_low_power_mode');
    } catch(e) {}

    if (lowPowerModeEnabled) {
      showToastBadge('🔔 저전력 모드 예약됨\n화면이 꺼지면 5초 간격으로 전환됩니다.');
      // 🔊 사용자 신고(2026-09-21): "저전력모드에서 화면이 꺼지면 소리도
      // 나야 정상아닌가?" — 화면이 꺼진 뒤(visibilitychange 'hidden')에
      // AudioContext를 처음 만들거나 resume()하면, 화면이 이미 안 보이는
      // 상태라 브라우저/WebView의 오디오 자동재생 정책(사용자 제스처 필요)
      // 에 걸려 조용히 거부될 수 있다. 지금 이 버튼 클릭은 확실한 사용자
      // 제스처이므로, 화면이 꺼지기 전에 여기서 미리 AudioContext를
      // 만들고 완전히 running 상태로 깨워둔다 — 화면이 꺼진 뒤에는
      // resume()을 다시 호출할 필요 없이 이미 살아있는 컨텍스트를 그대로
      // 쓸 수 있다.
      try {
        if (!audioCtx || audioCtx.state === 'closed') {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch(e) {}
    } else {
      showToastBadge('🔕 저전력 모드를 해제했습니다.');
