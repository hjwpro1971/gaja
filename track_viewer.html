  // 등산로 진행 및 코스 일탈/역주행 실시간 상태 안내 토스트
  // 히스테리시스: 20m 넘으면 "이탈 상태" 진입, 12m 밑으로 돌아와야 "정상"으로 해제.
  // 경계선(16m 부근)에서 왔다갔다 하며 토스트가 깜빡이는 것을 막는다.
  let isOffTrailState = false;
  let offTrailStreakCount = 0; // GPS 갱신마다 1씩 증가 — 연속 3회(약 3초) 이상일 때만 경고음
  const RETURN_CONFIRM_STREAK = 3; // 복귀음도 이탈 경고음과 대칭으로, 연속 3회(약 3초) 이상 정상 상태가 유지되어야 울린다 — GPS 순간 튐으로 잠깐만 25m 밑으로 들어왔다 다시 이탈해도 오알람이 울리지 않도록 함
  let returnStreakCount = 0; // 25m 미만 조건을 연속으로 만족한 횟수 — 이탈 중일 때만 누적, 이탈 재진입 시 리셋

  // 이탈 히스테리시스 상태만 갱신하는 함수 — updateNavigationToast와
  // 정지 시 방향 고정 로직(watchPosition 콜백) 양쪽에서 공유해서 쓴다.
  // 갱신 시점이 늦으면(예: 이 함수를 안 쓰고 updateNavigationToast 안에서만
  // 갱신하면) 정지 시 방향 고정 로직이 "한 픽스 전"의 낡은 이탈 상태를
  // 참조하게 되는 문제가 있었다.
  // GPS 정확도(accuracy, 미터)가 나쁠수록 이탈 판정 임계값을 완화한다 —
  // 숲/계곡에서 accuracy가 30~40m까지 나빠지는 경우가 실제로 있는데,
  // 고정된 기준을 그대로 쓰면 GPS 오차만으로도 이탈 오판이 잦다.
  // accuracy가 정상(15m 이하)이면 기존 기준 그대로, 나쁠수록 accuracy에
  // 비례해 진입/복귀 기준을 함께 늘린다 — 상한을 둬 무한정 완화되지
  // 않게 한다.
  // ⚠️ 기준값 축소(사용자 실기기 재현: "40m는 너무 심한 것 아녀..
  // 이탈이면 계속 측정해서 이탈 확정을 빨리 해서 알람을 최대한 빨리
  // 알려주어야지") — 기존 35m/25m(최대 60m/45m)는 산길 폭 대비 넓어
  // 실제로 명확히 벗어난 뒤에도 한참 지나야 경고가 떴다. 20m/12m
  // (최대 35m/25m)로 좁혀 체감 지연을 줄인다. 연속 확인 횟수(약 3초)는
  // 그대로 유지해 GPS 순간 튐으로 인한 오탐은 계속 방지한다.
  const OFFTRAIL_BASE_ENTER_M = 20;
  const OFFTRAIL_BASE_RETURN_M = 12;
  const OFFTRAIL_MAX_ENTER_M = 35;
  const OFFTRAIL_MAX_RETURN_M = 25;
  // 들머리 진입 전용 완화값 — GPS 이동방향이 아직 안정되지 않은 코스
  // 시작 직후(TRAILHEAD_ENTRY_DISTANCE_M 이내, 첫 원점 미확정 상태)는
  // 실제로 등산로 입구를 찾아 몇 걸음 헤매는 경우가 흔한데, 일반
  // 이탈 기준을 그대로 적용하면 이탈 경고가 먼저 떠서 "어디로 가야
  // 하지?"만 반복된다는 지적(개선 제안) — 들머리 근처에서는 기준을
  // 넉넉히 잡아 이탈 경고 자체를 늦춘다. 이 완화값은 위 기준 축소와
  // 별개로 그대로 유지한다(들머리 근처는 여전히 헤맬 수 있으므로).
  const TRAILHEAD_ENTRY_DISTANCE_M = 30;
  const TRAILHEAD_ENTER_M = 60;
  const TRAILHEAD_MAX_ENTER_M = 80;
  function updateOffTrailHysteresis(minDistanceM, accuracy, isNearTrailhead) {
    const acc = (accuracy !== undefined && accuracy !== null && !isNaN(accuracy)) ? accuracy : 0;
    // accuracy가 15m를 넘는 만큼(오차분)을 그대로 임계값에 더한다.
    const slack = Math.max(0, acc - 15);
    const baseEnter = isNearTrailhead ? TRAILHEAD_ENTER_M : OFFTRAIL_BASE_ENTER_M;
    const maxEnter = isNearTrailhead ? TRAILHEAD_MAX_ENTER_M : OFFTRAIL_MAX_ENTER_M;
    const enterThreshold = Math.min(maxEnter, baseEnter + slack);
    const returnThreshold = Math.min(OFFTRAIL_MAX_RETURN_M, OFFTRAIL_BASE_RETURN_M + slack);
    if (!isOffTrailState && minDistanceM > enterThreshold) {
      isOffTrailState = true;
      returnStreakCount = 0;
    } else if (isOffTrailState && minDistanceM < returnThreshold) {
      returnStreakCount++;
      if (returnStreakCount >= RETURN_CONFIRM_STREAK) {
        isOffTrailState = false;
        offTrailStreakCount = 0;
        returnStreakCount = 0;
        resetOffTrailStreak(); // 궤적 복귀 → 다음 이탈은 15초부터 다시 경고, 복귀음 재생
      }
    } else if (isOffTrailState) {
      // 복귀 기준 미만 조건이 끊김(다시 기준 이상으로 튐) — 복귀 확정 전 노이즈이므로 카운터 리셋
      returnStreakCount = 0;
    }
    updateGpsMarkerWarningStyle();
  }

  // 화면 안내(시계 방향/좌우 안내)에 쓸 "현재 향한 절대 방위"를 반환한다.
  // 센서(나침반/자이로) 완전 배제 — GPS 좌표만으로 "내가 보는 방향"을
  // 추정한다. 이동 중에는 방금 GPS로 측정된 진행 방향(gpsMovementHeading)을
  // 쓰고, 정지 중에는 그 값을 그대로 유지한다(멈추기 직전 걷던 방향을
  // 계속 "정면"으로 간주) — 정지 시 마지막 값을 지우지 않는 것이 이
  // 함수의 핵심이므로 watchPosition 콜백에서 gpsMovementHeading을
  // 정지 상태에서는 절대 덮어쓰지 않는다.
  function getCurrentAbsHeadingForGuidance() {
    return gpsMovementHeading;
  }

  // 🏁 날머리 도착 자동 GPS 종료 — updateNavigationToast에서 사용.
  const ARRIVAL_DISTANCE_M = 20;       // 날머리까지 이 거리 이내면 "도착"
  const ARRIVAL_MIN_TRAVELED_M = 50;   // 원점회귀 코스 출발 직후 오탐 방지용 최소 이동거리

  // ↩️ 왕복/원점회귀 코스 역주행(되돌아가는 중) 감지 — 정상까지 갔다가
  // 같은 길로 되돌아오는 코스에서, 올라갈 때와 내려갈 때 모두 갈림길
  // 안내가 나와야 한다는 요구사항. 판정 기준은 traveledDist(GPS가
  // GPX 트랙 위에 투영된 코스 순서상 진행거리)의 증감 추이뿐이다 —
  // 나침반/자이로는 전혀 쓰지 않는다.
  // 히스테리시스: "역주행 시작"은 REVERSE_ENTER_STREAK회 연속 감소해야
  // 확정하고, "정방향 복귀"는 단 1회만 증가해도 즉시 해제한다 — 왕복
  // 코스에서 방향을 트는 순간(정상 등)에는 실제로 잠시 제자리에 머물며
  // GPS가 흔들릴 수 있으므로 "역주행 진입"만 신중하게, "복귀"는 민감하게
  // 잡아 빠르게 정상 안내로 돌아오게 한다.
  const REVERSE_ENTER_STREAK = 3;
  // 누적거리 증감만으로는 GPS 튐(특히 왕복 구간이 겹쳐 있을 때
  // traveledDist 자체가 순간적으로 오판될 수 있음)에 취약하다는
  // 지적(개선 제안) — 실제 이동방향(gpsMovementHeading)이 현재 구간
  // 진행방향(mapRotationDeg, 이미 계산되어 있는 값)과 이 각도 이상
  // 벌어져 있을 때만 "역주행 방향과 일치"로 보고 누적거리 감소 카운트를
  // 추가로 보강한다. 90도 이내(직각 근처, 옆으로 살짝 벗어난 정도)는
  // 판정에 영향 주지 않는다.
  const REVERSE_HEADING_MISMATCH_DEG = 135;
  let isReversingOnTrail = false;
  let lastTraveledDistForReverse = null;
  let reverseDecreaseStreak = 0;

  function updateReversingState(traveledDist) {
    if (lastTraveledDistForReverse === null) {
      lastTraveledDistForReverse = traveledDist;
      return;
    }
    const delta = traveledDist - lastTraveledDistForReverse;
    lastTraveledDistForReverse = traveledDist;
    // 이동방향이 현재 구간 방향과 정반대에 가까운지(135도 이상 차이) —
    // 누적거리 감소와 함께 확인해 단순 GPS 튐으로 인한 오판을 줄인다.
    // 이동방향을 아직 모르면(코스 시작 직후 등) 이 보강 없이 거리
    // 기준만으로 판정한다(기존 동작 유지).
    const headingMismatch = gpsMovementHeading !== null
      ? Math.abs(shortestAngleDiff(gpsMovementHeading, mapRotationDeg))
      : null;
    const headingAgreesWithReverse = headingMismatch === null || headingMismatch >= REVERSE_HEADING_MISMATCH_DEG;
    if (delta < -0.5 && headingAgreesWithReverse) { // 0.5m 이상 감소 + 이동방향도 반대일 때만 카운트(GPS 미세 노이즈 무시)
      reverseDecreaseStreak++;
      if (reverseDecreaseStreak >= REVERSE_ENTER_STREAK) isReversingOnTrail = true;
    } else if (delta > 0.5) {
      reverseDecreaseStreak = 0;
      isReversingOnTrail = false; // 정방향 복귀는 즉시 반영
    }
    // delta가 -0.5~0.5m 사이(거의 정지)거나 이동방향이 반대와 다르면
    // (GPS 튐 의심) 기존 상태를 그대로 유지한다.
    updateGpsMarkerWarningStyle();
  }

  // 🧭 구간회전("원점 잡기") 트리거 — updateNavigationToast 본문과
  // 별도로 분리했다. 원래는 updateNavigationToast의 "온트레일" 분기
  // 안에서만 계산됐는데, 들머리 진입 직후처럼 GPS 정확도가 나쁘거나
  // 위치가 잠깐 튀어 "이탈 상태"로 먼저 분류되면 그 분기가 조기
  // return해버려 회전 판정 자체가 한 번도 실행되지 않는 문제가 있었다
  // (사용자 재현: "들머리 들어갈때 원점이 잘 안 잡혀"). 이탈 여부와
  // 무관하게 traveledDist만 있으면 항상 이 함수를 호출해, "정방향(또는
  // 역방향)이 확정된 구간"이 바뀔 때마다 즉시 원점을 잡는다.
  // 들머리 등 "첫 원점"을 잡을 때, 실제 GPS 이동방향이 그 구간의 GPX
  // 방향과 이만큼 이내로 맞아야 회전을 건다. 너무 좁으면(예: 15도)
  // GPS 오차로 영영 안 맞을 수 있고, 너무 넓으면(예: 150도) 걸러내는
  // 의미가 없어 90도(수직/반대 방향까지만 차단)로 잡았다.
  const FIRST_ROTATION_HEADING_TOLERANCE_DEG = 90;
  // 목표 지점에 "도착/통과했다"고 판정할 여유 거리 — GPS 오차를 감안해
  // 정확히 0m가 아니라 이 거리 이내로 들어오면 도착으로 본다(사용자
  // 지시: "GPS 오차률이 있다고 하니 최소한 갈림길 지나서 회전"). 너무
  // 넓으면 실제로 갈림길에 닿기 한참 전에 회전해버려 "미리 회전"
  // 문제가 재발하므로 좁게 잡는다.
  const ROTATION_ARRIVAL_GRACE_M = 12;

  function updateSegmentRotationTrigger(traveledDist) {
    if (!isSegmentRotationMode) return;
    // ⚠️ 손가락으로 지도를 드래그하는 도중(isMapBeingDragged)에 갈림길을
    // 지나 구간이 바뀌면 applySegmentRotation이 지도 CSS 회전을 즉시
    // 바꿔버린다. 이때 moveManualMapDrag는 매 touchmove의 (dx,dy)를
    // "직전 프레임 대비 이동량"으로 계산해 mapRotationDeg 기준으로
    // 회전 보정하는데, 그 사이 회전각 자체가 바뀌면 다음 프레임의 보정이
    // 어긋나 손가락 방향과 지도 이동 방향이 크게 틀어져 보인다(사용자
    // 재현: "이동 중 드래그 시 지도가 손가락 반대/어긋난 방향으로 감").
    // 드래그 중에는 회전 판정 자체를 보류하고, 드래그가 끝나 자동 복귀
    // 유예까지 지나면(!isMapBeingDragged && !isMapDragReturnPending)
    // 다음 픽스에서 정상적으로 재판정된다 — 기준점을 갱신하지 않으므로
    // 갈림길을 지난 사실 자체는 유실되지 않는다.
    // 🧭 길찾기 모드 중에는 지도 회전을 전적으로 나침반/손가락 값이
    // 담당한다(closeWayfindMode에서 원래 구간회전 값으로 복원) —
    // 그 동안 구간회전이 끼어들면 나침반 회전과 충돌해 지도가 제멋대로
    // 움직이는 것처럼 보인다.
    if (isMapBeingDragged || isMapDragReturnPending || isWayfindActive) return;
    // 🚨 경로 이탈 중에는 회전보다 복귀 방향 안내가 우선이어야 한다는
    // 지적(사용자: "경로에서 벗어 났는데 회전보다 내가 가야할 곳을
    // 알려주는게 낫지") — 이탈 상태에서는 회전 자체를 동결(마지막
    // 회전값 유지)하고, updateNavigationToast의 이탈 안내 분기가
    // 복귀 방향을 전담한다. 복귀하면 다음 픽스에서 정상 재개된다.
    // 단, 아직 원점이 한 번도 안 잡힌 상태(currentRotationOriginDist
    // === null)이거나 resetOriginNow()로 명시적 재설정을 요청한 경우
    // (forceOriginReset)는 이탈 여부와 무관하게 계속 판정을 시도한다.
    // ⚠️ v94에서 이 동결을 "원점 확정 여부와 무관하게" 걸었더니, 들머리
    // 진입 직후(아직 트랙 위로 안정적으로 붙기 전이라 이탈 상태로
    // 분류되기 쉬운 구간)에 원점 자체가 영영 안 잡히는 회귀가
    // 생겼다(사용자 재현: "들머리에서 순방향이면 판정이 나는데 원점을
    // 안 잡아 왜?"). 회전이 이미 한 번 확정된 뒤(갈림길 통과 등)에만
    // 이탈 동결을 적용하고, 첫 원점 판정 자체는 계속 열어둔다.
    if (isOffTrailState && !forceOriginReset && currentRotationOriginDist !== null) return;
    updateReversingState(traveledDist);
    if (!lastKnownPos) return;

    const isFirstRotation = currentRotationOriginDist === null;

    if (!isFirstRotation) {
      // 🧭 이미 원점이 있으면: 현재 기준점에서 찾은 목표에 실제로
      // 도착/통과했는지만 확인한다. 아직 도착 전이면(접근 중) 아무것도
      // 하지 않고 이전 회전값을 그대로 유지 — "미리 회전" 방지.
      const currentTarget = findNextRotationTarget(currentRotationOriginDist, isReversingOnTrail);
      if (!currentTarget) return;
      const arrived = isReversingOnTrail
        ? (traveledDist <= currentTarget.distanceM + ROTATION_ARRIVAL_GRACE_M)
        : (traveledDist >= currentTarget.distanceM - ROTATION_ARRIVAL_GRACE_M);
      if (!arrived) return;

      // 목표에 도착했다 — 그 목표 지점을 새 기준점으로 삼고, 그
      // 지점에서 다음 목표를 찾아 "기준점 → 다음 목표" 방향으로
      // 회전한다(내가 들어가는 벡터 방향이 아니라, 그 구간을 시작하는
      // 바로 그 지점에서 앞으로 나아가는 방향 — 사용자 정의).
      const newOriginDist = currentTarget.distanceM;
      const nextTarget = findNextRotationTarget(newOriginDist, isReversingOnTrail);
      if (!nextTarget) return;
      const heading = computeGuidanceHeading(currentTarget.lat, currentTarget.lon, nextTarget.lat, nextTarget.lon);
      if (heading === null) return;
      currentRotationOriginDist = newOriginDist;
      applySegmentRotation(heading);
      // 이름 없는 300m 지점 통과는 실제 갈림길 통과가 아니므로 조용히.
      if (currentTarget.isMilestone) playPassedMilestoneBeep();
      return;
    }

    // 🧭 첫 원점(들머리) — 아직 기준점이 없으므로, 내 현재 위치를
    // 임시 기준점 삼아 다음 목표를 찾고 그 방향으로 회전한다.
    const target = findNextRotationTarget(traveledDist, isReversingOnTrail);
    if (!target) return;
    const heading = computeGuidanceHeading(lastKnownPos.lat, lastKnownPos.lon, target.lat, target.lon);
    if (heading === null) return;
    // 🧭 "원점"은 갈림길에 도착했다고 무조건 잡는 게 아니라, 실제로
    // 그 방향으로 걷기 시작했다는 확인이 되어야 잡는다 — 들머리에서
    // GPS를 막 켰을 때 아직 가만히 서 있거나 주차장 쪽으로 잠깐
    // 움직이는 등, 코스 진행방향과 무관한 상태에서 첫 원점이 미리
    // 잡혀버리는 걸 막기 위함(사용자 요청: "내가 갈 방향하고 일치되는
    // 순간 원점을 잡는 로직"). 이미 한 번 잡힌 뒤(목표 통과로 인한
    // 재회전)는 통과 자체가 그 방향으로 걸었다는 증거이므로 이 검사를
    // 하지 않는다 — 첫 원점에만 적용.
    if (!forceOriginReset) {
      if (isCurrentlyStopped || gpsMovementHeading === null) return; // 아직 이동방향을 모르면 보류, 다음 픽스에서 재시도
      const mismatch = Math.abs(shortestAngleDiff(gpsMovementHeading, heading));
      if (mismatch > FIRST_ROTATION_HEADING_TOLERANCE_DEG) return; // 반대/엉뚱한 방향으로 걷는 중이면 보류
    }
    currentRotationOriginDist = traveledDist;
    applySegmentRotation(heading);
    // 코스 시작 직후 첫 회전(전 구간이 없어 "통과"라 부를 만한 이전
    // 갈림길이 없음)에는 통과 알람을 울리지 않는다.
  }

  // 🔄 수동 "원점 다시 잡기" 버튼 — GPS가 크게 튀거나 원점이 엉뚱하게
  // 잡힌 것 같을 때, 사용자가 직접 지금 위치를 기준으로 원점을 강제
  // 재설정할 수 있는 안전장치. currentRotationOriginDist를 비워 다음
  // updateSegmentRotationTrigger 호출에서 반드시 재계산이 일어나게
  // 하고, forceOriginReset 플래그로 이번 한 번은 "첫 원점" 방향 일치
  // 검사(FIRST_ROTATION_HEADING_TOLERANCE_DEG)를 건너뛴다 — 사용자가
  // 명시적으로 요청한 재설정이므로 이동방향이 아직 안정되지 않았어도
  // 즉시 반영하는 게 맞다.
  let forceOriginReset = false;
  function resetOriginNow() {
    if (!isSegmentRotationMode || !lastKnownPos) {
      showToastBadge('📍 먼저 [내 위치] 버튼으로 GPS를 켜주세요.');
      return;
    }
    currentRotationOriginDist = null;
    forceOriginReset = true;
    const nearest = nearestPointOnTrail(lastKnownPos.lat, lastKnownPos.lon, currentPoints);
    const traveledDist = (nearest && cumulativeDistances[nearest.index] !== undefined) ? cumulativeDistances[nearest.index] : 0;
    updateSegmentRotationTrigger(traveledDist);
    forceOriginReset = false;
    showToastBadge('🔄 현재 위치 기준으로 원점을 다시 잡았습니다.');
  }
  window.resetOriginNow = resetOriginNow;

  function updateNavigationToast(accuracy, minDistanceM, nearestIdx, nearestPoint) {
    // 회전 판정은 텍스트 안내(이탈/온트레일 분기, 토스트 표시 여부)와
    // 무관하게 토스트 표시 여부(toast.style.display==='none')와는
    // 상관없이 항상 먼저 실행한다. 단 이탈 상태(isOffTrailState) 중에는
    // updateSegmentRotationTrigger 내부에서 회전 자체를 동결한다 —
    // 이탈 중에는 회전보다 복귀 방향 안내가 우선이어야 한다는 지적
    // 참고(updateSegmentRotationTrigger 정의부).
    if (currentMilestones && currentMilestones.length >= 2 && nearestIdx >= 0 && cumulativeDistances) {
      updateSegmentRotationTrigger(cumulativeDistances[nearestIdx] || 0);
    }

    const toast = document.getElementById('gpsToast');
    if (!toast || toast.style.display === 'none') return;
    if (!lastKnownPos) return;

    if (nearestPoint && isOffTrailState) {
      hideBottomDirectionArrow(); // 이탈 안내는 좌/우 상대 방향(angleDiffToPlainKorean)이라 하단 화살표(시계 방향) UI와 별개
      // 숲/계곡 GPS 수신 불안정 시 오알람 방지 (정확도가 25m보다 나쁘면 대기)
      if (accuracy > 25 && offTrailStreakCount < 4) {
        toast.className = 'gps-toast';
        toast.innerText = `📡 숲·계곡 GPS 수신 대기 중 (오차 ±${Math.round(accuracy)}m)`;
        return;
      }
      offTrailStreakCount++;
      // 들머리 근처(첫 원점 미확정 + 코스 시작 30m 이내)에서는 "이탈"이
      // 아니라 "들머리 진입 중"으로 안내한다 — GPS 이동방향이 아직
      // 안정되지 않은 상태에서 갑자기 "이탈했다"는 경고만 뜨면
      // 사용자가 어디로 가야 할지 판단하기 어렵다는 지적(개선 제안).
      const traveledDistForNotice = cumulativeDistances[nearestIdx] || 0;
      const isNearTrailheadNotice = isSegmentRotationMode && currentRotationOriginDist === null && traveledDistForNotice < TRAILHEAD_ENTRY_DISTANCE_M;
      if (isNearTrailheadNotice) {
        toast.className = 'gps-toast';
        let distStr = minDistanceM >= 1000 ? (minDistanceM / 1000).toFixed(2) + 'km' : Math.round(minDistanceM) + 'm';
        toast.innerText = `🚩 들머리 진입 중 · 입구를 따라 조금만 더 이동하세요 (${distStr})`;
        return;
      }
      // 등산로 복귀 방향은 "북동쪽" 같은 절대 방위가 아니라, 마지막 GPS
      // 진행 방향(getCurrentAbsHeadingForGuidance) 기준 오른쪽/왼쪽
      // 상대 방향으로 안내한다.
      const toTrailBearing = calculateBearing(lastKnownPos.lat, lastKnownPos.lon, nearestPoint.lat, nearestPoint.lon);
      const toTrailAngleDiff = shortestAngleDiff(toTrailBearing, getCurrentAbsHeadingForGuidance());
      toast.className = 'gps-toast warning';
      let distStr = minDistanceM >= 1000 ? (minDistanceM / 1000).toFixed(2) + 'km' : Math.round(minDistanceM) + 'm';
      toast.innerText = `🚨 [이탈] ${distStr} 벗어났어요 ${angleDiffToPlainKorean(toTrailAngleDiff)}`;

      // GPS 순간 튐(수목/계곡 지역 등) 오알람 방지 — 연속 3회(약 3초) 이상
      // 유지될 때만 실제 경고음을 울린다.
      if (offTrailStreakCount >= 3) {
        playOffTrailBeep();
      }
    } else if (nearestIdx >= 0 && currentPoints && currentPoints.length > 3) {
      // 정지 중에는 "정지 중" 안내만, 이동 중에는 남은 거리만 표시한다.
      // (이전에는 여기서 궤적 방향과 실제 이동 방향을 비교해 역주행 여부를
      // 판정했으나, 개선 1로 그 판정 자체를 제거했다 — 녹색 점선과 이탈
      // 경고가 이미 필요한 안내를 제공하므로 더 이상 계산할 필요가 없다.)
      const totalDist = cumulativeDistances[cumulativeDistances.length - 1] || 0;
      const traveledDist = cumulativeDistances[nearestIdx] || 0;
      const remainingDist = Math.max(0, totalDist - traveledDist);
      const remainingStr = remainingDist >= 0 ? `${(remainingDist / 1000).toFixed(2)}km` : '';
      const fmtM = m => `${(m / 1000).toFixed(2)}km`;

      // ⭐ 전면 재설계(2026-09-17 v94, 2026-09-17 v95) "단일 진행방향
      // 소스 + 도착 시점 회전" 방식: turnAngle을 코스 로드 시점에 미리
      // 계산해두던 이전 방식은 지도 회전 기준과 안내 각도 기준이 서로
      // 다른 지점을 봐서 실기기에서 반복적으로 어긋났다(1~4·9·10번
      // 사용자 재현 참고). v95에서는 회전 자체가 "목표 지점 도착/통과"
      // 시에만 일어나므로, nextM에 접근하는 동안 mapRotationDeg는 항상
      // "직전 기준점 → nextM" 방향으로 고정되어 있다(사용자 지시:
      // "미리 회전하면 방향이 헷갈려"). "몇 시 방향"은 실시간으로,
      // 그 "현재 화면이 가리키는 방향(mapRotationDeg)" 대비 "nextM을
      // 지난 뒤 실제로 가야 할 다음 목표 방향"의 상대각으로 계산한다.
      // 회전과 안내가 같은 값(mapRotationDeg)에서 파생되므로 화면과
      // 어긋날 수가 없다.
      //
      // ↩️ 왕복/원점회귀 코스: 정상까지 갔다가 같은 길로 되돌아올 때도
      // 갈림길 안내가 나와야 한다는 요구사항 — traveledDist 증감 추이로
      // "되돌아가는 중"을 판정(updateReversingState, 위
      // updateSegmentRotationTrigger에서 이미 호출됨)하고, 역방향이면
      // findNextMilestone이 코스 순서상 이전 마일스톤을 다음 목표로
      // 반환하도록 뒤집는다. distToNextM 계산도 방향에 맞게 뒤집는다.
      const milestoneResult = findNextMilestone(traveledDist, isReversingOnTrail);
      if (milestoneResult) {
        const prevM = milestoneResult.prevM;
        const nextM = milestoneResult.nextM;
        const distToNextM = isReversingOnTrail
          ? Math.max(0, traveledDist - nextM.distanceM)
          : Math.max(0, nextM.distanceM - traveledDist);

        // nextM을 지난 직후(코스 진행거리 기준 살짝 더 간 지점)에서
        // findNextRotationTarget과 완전히 같은 규칙으로 "그 다음 목표"를
        // 찾는다 — 마일스톤이 있으면 그 지점, 없으면 100m 앞 지점.
        // 이게 "nextM에서 실제로 꺾여 나가는 방향"이다.
        const afterNextMDist = isReversingOnTrail
          ? Math.max(0, nextM.distanceM - 1)
          : nextM.distanceM + 1;
        const afterTarget = findNextRotationTarget(afterNextMDist, isReversingOnTrail);
        let turnAngle = null;
        let turnLabel = null;
        if (afterTarget) {
          const outBearing = computeGuidanceHeading(nextM.trailLat, nextM.trailLon, afterTarget.lat, afterTarget.lon);
          if (outBearing !== null) {
            // "지금 화면이 가리키는 방향" = nextM을 향해 이미 맞춰진
            // mapRotationDeg. 그 방향 대비 nextM 통과 후 방향의 상대각이
            // 곧 화면 기준 "몇 시로 꺾어야 하는지"다.
            turnAngle = shortestAngleDiff(outBearing, mapRotationDeg);
            turnLabel = classifyTurnAngle(turnAngle);
          }
        }
        showUpcomingTurnAlert({ name: nextM.name, distanceM: nextM.distanceM, turnAngle, turnLabel }, distToNextM);

        toast.className = 'gps-toast';
        toast.innerText = `🧭 ${prevM.name} → ${nextM.name} · ${fmtM(distToNextM)} 남음 (전체 ${remainingStr})`;

        // 🏁 날머리 도착 자동 종료 — 원점회귀 코스(들머리=날머리)는 출발
        // 직후에도 remainingDist가 잠깐 작을 수 있으므로, 최소
        // ARRIVAL_MIN_TRAVELED_M 이상 실제로 이동한 뒤에만 도착 판정을
        // 한다. GPS 오차(보통 ±10~15m)를 감안해 20m 이내를 "도착"으로 본다.
        if (traveledDist >= ARRIVAL_MIN_TRAVELED_M && remainingDist <= ARRIVAL_DISTANCE_M) {
          showToastBadge('🏁 날머리에 도착했습니다.\nGPS 추적을 자동으로 종료합니다.');
          stopGpsTracking();
        }
        return;
      }

      hideBottomDirectionArrow();
      toast.className = 'gps-toast';
      toast.innerText = `🧭 위쪽으로 따라가세요 · 남은 ${remainingStr}`;
    } else {
      hideBottomDirectionArrow();
      toast.className = 'gps-toast';
      toast.innerText = `🧭 위쪽으로 따라가세요`;
    }
  }

  // 다음 갈림길(nextM)까지 남은 거리(distToNextM)를 보고 하단 큰
  // 화살표(좌회전/우회전/직진 아이콘) 표시 여부와 알람 소리를 결정한다.
  // 거리 기준만으로 판정하므로 GPS 오차로 인한 깜빡임 걱정이 없다 —
  // 방향 판정 자체가 없기 때문이다.
  //
  // 단계별 동작(사용자 요청):
  //   60m, 50m, 40m 전 — 각각 짧은 카운트다운 알람음 1회씩(10m
  //     간격으로 끊어서 "점점 가까워지고 있다"는 감각을 준다)
  //   30m 이내 — 소리 없이 화살표만 계속 표시(더 이상 깜짝 알람으로
  //     방해하지 않고, 조용히 방향만 안내)
  //   통과(다음 마일스톤으로 넘어감) — 화살표 자동으로 사라짐
  //   갈림길 근처에서 실제로 궤적을 벗어남(isOffTrailState) — "엉뚱한
  //     방향으로 가고 있다"는 판단은 내 heading을 다시 측정하는 게
  //     아니라, 이미 있는 이탈 감지(updateOffTrailHysteresis)가 대신
  //     맡는다. updateNavigationToast는 isOffTrailState일 때 이 함수
  //     자체를 호출하지 않고 이탈 경고 분기로 빠지므로, 경고음
  //     (playOffTrailBeep)은 자동으로 울린다 — 여기서 따로 처리할 것
  //     없음.
  const TURN_ALERT_DISTANCE_M = 60;   // 화살표가 뜨기 시작하는 거리
  const TURN_ALERT_QUIET_DISTANCE_M = 30; // 이 거리부터는 소리 없이 화살표만
  const TURN_ALERT_BEEP_STEP_M = 10;  // 카운트다운 알람 간격(60/50/40m)
  let lastAlertedMilestoneKey = null;
  let lastBeepedStepKey = null; // "갈림길이름@30m단위구간" — 같은 10m 구간에서 중복 알람 방지

  function showUpcomingTurnAlert(nextM, distToNextM) {
    // key에 방향(isReversingOnTrail)을 포함시켜, 왕복 코스에서 같은
    // 갈림길을 올라갈 때 한 번, 내려갈 때 또 한 번 각각 독립적으로
    // 알람이 울리도록 한다 — 방향 정보 없이 좌표+거리만 쓰면 "이미
    // 알람 울린 지점"으로 오판해 두 번째 통과 시 스킵될 수 있었다.
    const key = nextM.name + '@' + nextM.distanceM + (isReversingOnTrail ? '@rev' : '@fwd');
    // 직진 구간이거나 회전각을 계산할 수 없는 지점(들머리/날머리 등)은
    // 안내할 게 없으므로 화살표를 띄우지 않는다.
    if (!nextM.turnLabel || nextM.turnLabel === '직진' || distToNextM > TURN_ALERT_DISTANCE_M) {
      hideBottomDirectionArrow();
      if (key !== lastAlertedMilestoneKey) {
        lastAlertedMilestoneKey = null; // 다음 갈림길 재진입 대비 리셋
        lastBeepedStepKey = null;
      }
      return;
    }

    // 좌회전/우회전 텍스트보다 몇 시 방향인지(예: "1시 방향")가 훨씬
    // 직관적으로 보인다는 사용자 피드백 — turnAngle(호출부에서 실시간
    // 계산한, "지금 화면이 가리키는 방향" 대비 상대 회전각)을 시계방향
    // 문구로 변환해 함께 보여준다.
    const clockDir = angleDiffToClockDirection(nextM.turnAngle);
    const label = `${nextM.name} · ${clockDir.clock} (${Math.round(distToNextM)}m 앞)`;
    // showBottomDirectionArrow(angleDiff, ...)의 angleDiff는 turnAngle을
    // 그대로 넘긴다 — 화면이 이미 nextM 방향(mapRotationDeg)으로 맞춰진
    // 상태이므로, 이 값은 화면 기준 "몇 시로 꺾어야 하는지"와 정확히
    // 일치한다(updateNavigationToast 호출부 주석 참고).
    showBottomDirectionArrow(nextM.turnAngle, label, false);
    lastAlertedMilestoneKey = key;

    if (distToNextM > TURN_ALERT_QUIET_DISTANCE_M) {
      // 60/50/40m 구간 — 10m 단위로 끊어 그 구간에 처음 진입했을 때만
      // 짧게 1번 알람. Math.floor로 구간을 묶어 GPS 픽스가 촘촘해도
      // 같은 10m 구간 안에서는 중복으로 울리지 않는다.
      const stepIdx = Math.floor(distToNextM / TURN_ALERT_BEEP_STEP_M);
      const stepKey = key + '@' + stepIdx;
      if (stepKey !== lastBeepedStepKey) {
        lastBeepedStepKey = stepKey;
        playTurnAlertBeep();
      }
    }
    // 30m 이내는 의도적으로 소리를 울리지 않는다 — 화살표만 조용히 표시.
  }

  // 화면 자동 꺼짐 방지 (Wake Lock) — 길찾기 회전 모드(화살표 ON, 2클릭)
  // 동안에는 화면을 계속 봐야 하므로 자동 잠금을 막는다. 지원 안 하는
  // 브라우저(구형 iOS Safari 등)에서는 조용히 무시한다.
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }
  // 화면이 숨겨지면(다른 앱으로 전환, 화면 꺼짐 등) GPS 수신을 완전히
  // 멈춘다. watchPosition을 백그라운드에서도 계속 돌리면 배터리와
  // 메모리를 불필요하게 소모하고, 등산 중 화면을 계속 볼 필요가 없는
  // 순간(주머니에 넣기 등)까지 계산을 이어갈 이유가 없다.
  // 다시 화면이 보이면 GPS를 재시작하고 관련 상태를 전부 초기화해
  // "새로 시작하는 것"처럼 처리한다 — 숨겨진 동안 실제로 이동했을 수
  // 있는데 옛 위치·방향값이 남아있으면 복귀 시 급격한 격차를 좁히려
  // 하면서 지도·나침반·화살표가 한꺼번에 튀는 원인이 되기 때문이다.
  let wasTrackingBeforeHidden = false;

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (watchId !== null) {
        wasTrackingBeforeHidden = true;
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        releaseWakeLock();
        stopCompass();
      }
    } else if (document.visibilityState === 'visible') {
      if (wasTrackingBeforeHidden) {
        wasTrackingBeforeHidden = false;
        gpsFilterEngine.reset();
        gpsMovementHeading = null;
        isCurrentlyStopped = false;
        startGpsTracking(); // GPS 재시작 — 내부에서 initCompass, wakeLock 등도 함께 재요청됨
      }
    }
  });

  // 산행 가기 전 미리보기 (따라가기) 시뮬레이션 모드
  let simInterval = null;
  let simIndex = 0;
  let simMarker = null;
  let simSpeed = 1;

  function setSimSpeed(speed, event) {
    simSpeed = speed;
    if (event) {
      document.querySelectorAll('.sim-speed-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  }

  // 시뮬레이션의 한 프레임(idx 위치)을 화면에 반영한다 — 자동재생
  // 인터벌과 스크럽 바 드래그 양쪽에서 공통으로 쓰는 렌더 함수.
  // mapViewOpts로 자동재생은 부드럽게(animate:true), 스크럽 드래그는
  // 즉시(animate:false) 반영하도록 구분한다.
  function renderSimFrame(idx, mapViewOpts) {
    if (!currentPoints || idx < 0 || idx >= currentPoints.length) return;
    const pt = currentPoints[idx];
    const lat = pt.lat;
    const lon = pt.lon;

    const aheadPt = findPointAheadByDistance(currentPoints, cumulativeDistances, idx, 20);
    if (aheadPt) {
      gpsMovementHeading = calculateBearing(lat, lon, aheadPt.lat, aheadPt.lon);
    }

    // 실제 GPS 추적과 동일한 방향 화살표 마커를 사용한다 — 예전엔
    // 단순 원형 점만 그려서 시뮬레이션 중 "내 위치 화살표가 안
    // 보인다"는 문제가 있었다.
    if (!simMarker) {
      const icon = L.divIcon({
        className: 'custom-gps-icon',
        html: createGpsIconHtml(gpsMovementHeading),
        iconSize: [80, 80],
        iconAnchor: [40, 40]
      });
      simMarker = L.marker([lat, lon], { icon, zIndexOffset: 1000 }).addTo(map);
    } else {
      simMarker.setLatLng([lat, lon]);
    }
    if (gpsMovementHeading !== null) renderGpsArrow(gpsMovementHeading);

    lastKnownPos = { lat, lon };
    isCurrentlyStopped = false;
    isOffTrailState = false;

    // ⚠️ updateNavigationToast를 지도뷰 갱신보다 먼저 호출해야 한다 —
    // 구간이 바뀌는 프레임에 updateNavigationToast 내부에서
    // applySegmentRotation이 mapRotationDeg를 새 구간 방향으로 갱신하는데,
    // 순서가 반대이면 applyMapViewWithOffset이 아직 옛 mapRotationDeg
    // (한 프레임 지연된 값)로 오프셋을 계산해 지도 회전과 중심 오프셋
    // 방향이 어긋나 구간 시작점이 화면 엉뚱한 곳으로 튀는 버그가 있었다.
    updateNavigationToast(5, 0, idx, pt);

    const currentZoom = Math.max(map.getZoom(), 15);
    applyMapViewWithOffset(lat, lon, currentZoom, mapViewOpts);
  }

  // --- 🎬 구간 탐색(스크럽) 바 ---
  let simScrubDragging = false;

  function updateSimScrubHandle() {
    const handle = document.getElementById('simScrubHandle');
    const fill = document.getElementById('simScrubFill');
    if (!handle || !fill || !currentPoints || currentPoints.length < 2) return;
    const progress = simIndex / (currentPoints.length - 1); // 0(들머리) ~ 1(날머리)
    // 트랙 가로축: 왼쪽=들머리(0%), 오른쪽=날머리(100%) — 손가락으로
    // "오른쪽으로 밀수록 코스 뒷부분"이라는 직관과 맞춘다.
    handle.style.left = `${progress * 100}%`;
    fill.style.width = `${progress * 100}%`;
  }

  function simScrubIndexFromClientX(clientX) {
    const track = document.getElementById('simScrubTrack');
    if (!track || !currentPoints || currentPoints.length < 2) return null;
    const rect = track.getBoundingClientRect();
    let progress = (clientX - rect.left) / rect.width;
    progress = Math.max(0, Math.min(1, progress));
    return Math.round(progress * (currentPoints.length - 1));
  }

  function handleSimScrubStart(evt) {
    if (!simInterval) return; // 시뮬레이션이 켜져 있을 때만 동작
    simScrubDragging = true;
    const point = evt.touches ? evt.touches[0] : evt;
    const idx = simScrubIndexFromClientX(point.clientX);
    if (idx !== null) {
      simIndex = idx;
      renderSimFrame(simIndex, { animate: false });
      updateSimScrubHandle();
    }
    evt.preventDefault();
  }

  function handleSimScrubMove(evt) {
    if (!simScrubDragging) return;
    const point = evt.touches ? evt.touches[0] : evt;
    const idx = simScrubIndexFromClientX(point.clientX);
    if (idx !== null) {
      simIndex = idx;
      renderSimFrame(simIndex, { animate: false });
      updateSimScrubHandle();
    }
    evt.preventDefault();
  }

  function handleSimScrubEnd() {
    simScrubDragging = false;
  }

  function initSimScrubEvents() {
    const track = document.getElementById('simScrubTrack');
    if (!track || track._simScrubBound) return;
    track._simScrubBound = true;
    track.addEventListener('touchstart', handleSimScrubStart, { passive: false });
    window.addEventListener('touchmove', handleSimScrubMove, { passive: false });
    window.addEventListener('touchend', handleSimScrubEnd);
    track.addEventListener('mousedown', handleSimScrubStart);
    window.addEventListener('mousemove', handleSimScrubMove);
    window.addEventListener('mouseup', handleSimScrubEnd);
  }

  // 재생 중 "일시정지"인지 여부 — simInterval이 null이어도 이 값이
  // true면 "재생을 잠시 멈춘 것"이고, toggleSimulation()의 종료 처리
  // (마커 제거, 구간회전 해제 등)는 아직 실행하지 않은 상태다.
  let isSimPaused = false;

  function toggleSimulation() {
    if (!currentPoints || currentPoints.length < 2) {
      alert('먼저 등산로 코스를 불러와주세요.');
      return;
    }
    const btn = document.getElementById('simBtn');
    const pauseBtn = document.getElementById('simPauseBtn');
    const speedOpts = document.getElementById('simSpeedOptions');

    // 재생 중이거나(simInterval) 일시정지 중(isSimPaused)이면 완전 종료.
    if (simInterval || isSimPaused) {
      if (simInterval) clearInterval(simInterval);
      simInterval = null;
      isSimPaused = false;
      btn.innerText = '▶️';
      btn.classList.remove('active');
      pauseBtn.style.display = 'none';
      pauseBtn.innerText = '⏸️';
      speedOpts.style.display = 'none';
      if (simMarker) {
        map.removeLayer(simMarker);
        simMarker = null;
      }
      showHeadingArrow = false;
      const toast = document.getElementById('gpsToast');
      toast.style.display = 'none';
      showToastBadge('🛑 따라가기 미리보기 모드를 종료했습니다.');
      const scrubTrack = document.getElementById('simScrubTrack');
      if (scrubTrack) scrubTrack.classList.remove('active');
      // 🧭 구간회전도 시뮬레이션과 함께 종료 — 실제 GPS 켜짐 상태가
      // 아니므로 지도를 북쪽 고정으로 되돌린다.
      const mapEl = document.getElementById('map');
      isSegmentRotationMode = false;
      currentRotationOriginDist = null;
      mapRotationDeg = 0;
      appliedMapRotationDeg = 0;
      updateRouteBadgeRotation();
      if (mapEl) { mapEl.classList.remove('heading-up'); mapEl.style.transform = ''; }
      setTimeout(() => map.invalidateSize({ animate: false }), 520);
      return;
    }

    if (watchId !== null) stopGpsTracking(); // 켜져있던 진짜 GPS 중단

    // simBtn(왼쪽)은 이제 "완전 종료" 전용 버튼이다 — 일시정지는
    // simPauseBtn이 따로 담당하므로, 재생 중에도 ⏸️가 아니라 종료를
    // 뜻하는 🛑로 표시해 두 버튼의 아이콘이 겹치지 않게 한다.
    btn.innerText = '🛑';
    btn.classList.add('active');
    pauseBtn.style.display = 'flex';
    speedOpts.style.display = 'flex';
    simIndex = 0;
    // createGpsIconHtml은 showHeadingArrow가 true일 때만 방향 화살표를
    // 그린다 — 실제 GPS(startGpsTracking)만 이 값을 켰고 시뮬레이션은
    // 전혀 건드리지 않아, 파란 점만 보이고 방향 콘이 안 보이던
    // 근본 원인이었다.
    showHeadingArrow = true;

    // 🧭 구간회전 미리보기 — 실제 GPS를 켜지 않아도 시뮬레이션 중에는
    // 구간 heading-up이 동작해야 배포 전 동작을 확인할 수 있다. 원래
    // isHeadingUp(GPS 켜짐 버튼)에만 연동돼 있었는데, toggleSimulation은
    // 그 버튼을 거치지 않아 이 상태가 켜지지 않던 문제를 수정.
    {
      const mapEl = document.getElementById('map');
      isSegmentRotationMode = true;
      currentRotationOriginDist = null;
      if (mapEl) mapEl.classList.add('heading-up');
    }
    showToastBadge('▶️ 모의 주행 (따라가기) 시작\n산행 전 전체 경로를 미리 따라가 봅니다.');

    const toast = document.getElementById('gpsToast');
    toast.style.display = 'block';
    toast.className = 'gps-toast';

    const scrubTrack = document.getElementById('simScrubTrack');
    if (scrubTrack) scrubTrack.classList.add('active');
    initSimScrubEvents();
    updateSimScrubHandle();

    // #map 크기가 100% -> 120vh로 바뀌는 걸 Leaflet이 자동 감지하지
    // 못해 지도 절반이 빈 회색으로 보이는 문제 — invalidateSize로 강제
    // 재계산해야 한다(실기기 시뮬레이션에서 실측 확인된 버그).
    setTimeout(() => map.invalidateSize({ animate: false }), 520);
    // 더 부드러운 이동을 위해 250ms 단위 갱신 (초당 4프레임)
    startSimInterval();
  }

  // 250ms 인터벌로 시뮬레이션 프레임을 진행시키는 공용 로직 — 최초
  // 재생 시작(toggleSimulation)과 일시정지 후 재개(toggleSimulationPause)
  // 양쪽에서 동일하게 재사용한다.
  function startSimInterval() {
    simInterval = setInterval(() => {
      if (!currentPoints || simIndex >= currentPoints.length) {
        toggleSimulation();
        return;
      }
      renderSimFrame(simIndex, { animate: true, duration: 0.25 });
      updateSimScrubHandle();

      // 속도 조절 (250ms당 이동 거리 기준)
      // 0.5x: 초당 8m (0.25초당 2m) - 세밀하게 살펴볼 때
      // 1x: 초당 16m (0.25초당 4m) - 편안한 시야
      // 2x: 초당 40m (0.25초당 10m)
      // 3x: 초당 80m (0.25초당 20m)
      // 4x: 초당 160m (0.25초당 40m)
      // 5x: 초당 320m (0.25초당 80m)
      let stepDistanceM = 4;
      if (simSpeed === 0.5) stepDistanceM = 2;
      else if (simSpeed === 2) stepDistanceM = 10;
      else if (simSpeed === 3) stepDistanceM = 20;
      else if (simSpeed === 4) stepDistanceM = 40;
      else if (simSpeed === 5) stepDistanceM = 80;

      let nextIndex = simIndex + 1;
      const startDist = cumulativeDistances[simIndex] || 0;
      while (nextIndex < currentPoints.length) {
        const currentDist = cumulativeDistances[nextIndex] || 0;
        if (currentDist - startDist >= stepDistanceM) break;
        nextIndex++;
      }
      simIndex = nextIndex;
    }, 250);
  }

  // 시뮬레이션 재생 중 "일시정지 ↔ 재개" 토글 — toggleSimulation()의
  // 시작/완전종료와는 별개 상태다. 일시정지 중에는 simInterval을 완전히
  // 지워 CPU를 아끼되, isSimPaused=true로 남겨 마커/구간회전 등은
  // 그대로 유지한다. 재개 시 같은 simIndex부터 startSimInterval()로
  // 인터벌만 다시 건다.
  function toggleSimulationPause() {
    if (!isSimPaused && !simInterval) return; // 재생 중도 일시정지 중도 아니면 무시
    const pauseBtn = document.getElementById('simPauseBtn');

    if (simInterval) {
      // 재생 중 -> 일시정지
      clearInterval(simInterval);
      simInterval = null;
      isSimPaused = true;
      if (pauseBtn) pauseBtn.innerText = '▶️';
      showToastBadge('⏸️ 일시정지했습니다.');
      // ⚠️ clearInterval은 다음 프레임 실행만 막을 뿐, 이미 진행 중이던
      // 지도 회전 CSS 트랜지션(최대 0.5초)은 멈추지 않는다 — 그 상태로
      // 두면 일시정지 직후 잠깐 동안은 화면에 보이는 각도와
      // mapRotationDeg가 어긋나 그 사이 드래그하면 손가락 방향과 지도가
      // 맞지 않았다(finishMapRotationTransitionNow 정의부 참고). 일시정지
      // 시점에 트랜지션을 즉시 완료시켜, "정지 상태 = 지도가 완전히
      // 멈춰 있다"를 항상 보장한다.
      finishMapRotationTransitionNow();
      return;
    }

    // 일시정지 중 -> 재개
    isSimPaused = false;
    if (pauseBtn) pauseBtn.innerText = '⏸️';
    showToastBadge('▶️ 이어서 재생합니다.');
    startSimInterval();
  }
  window.toggleSimulationPause = toggleSimulationPause;

  // 실시간 GPS 내 위치 추적 (확대 지도, 길찾기 회전 모드, 나침반 방향 빔, 등산로 복귀 가이드)
  function toggleGPS() {
    if (simInterval !== null || isSimPaused) toggleSimulation(); // 시뮬레이션 중(재생/일시정지)이면 끄기
    // 🔋 절전 모드 중엔 watchId가 null이라도 "GPS가 완전히 꺼진 것"이
    // 아니다 — 사용자가 버튼을 누르면 절전을 해제하고 즉시 재개한다
    // (startGpsTracking처럼 화면을 통째로 새로 초기화하지 않는다).
    if (isGpsSleeping) {
      exitGpsSleep('사용자가 직접 재개');
      return;
    }
    if (watchId !== null) {
      stopGpsTracking();
    } else {
      startGpsTracking();
    }
  }

  function stopGpsTracking() {
    const btn = document.getElementById('gpsBtn');
    const toast = document.getElementById('gpsToast');
    setHeadingUpMode(false, true);
    showHeadingArrow = false;
    releaseWakeLock();
    stopSleepMonitor(); // 🔋 절전 감시 타이머도 함께 정리 — 안 하면 GPS를 완전히 끈 뒤에도 백그라운드에서 계속 돔
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    stopCompass();
    if (userGpsMarker) { map.removeLayer(userGpsMarker); userGpsMarker = null; }
    if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
    btn.innerText = '📍';
    btn.classList.remove('active');
    toast.style.display = 'none';
    hideBottomDirectionArrow();
    showToastBadge('📍 내 위치 추적을 종료했습니다.');

    // [회전 검증 디버그 로그 자동 저장]
    if (directionDebugLogger.isLogging) {
      directionDebugLogger.stop();
      directionDebugLogger.exportCSV();
    }
  }

  // handleGpsPositionUpdate(아래)와 startGpsTracking 양쪽에서 쓰는
  // "이번이 GPS 시작 후 첫 픽스인가" 플래그 — 콜백을 이름 붙은 함수로
  // 분리하면서 함수 지역변수였던 것을 모듈 스코프로 옮겼다.
  let isFirstFix = true;

  function startGpsTracking() {
    const btn = document.getElementById('gpsBtn');
    const toast = document.getElementById('gpsToast');

    if (!navigator.geolocation) {
      alert('이 브라우저에서는 내 위치 기능을 사용할 수 없어요.\n\n📱 스마트폰 기본 브라우저(예: 삼성 인터넷, 크롬, Safari)로 다시 열어 주세요.');
      return;
    }

    // [회전 검증 디버그 로그 시작]
    directionDebugLogger.start();

    showHeadingArrow = true;

    // GPS를 새로 켤 때마다 필터를 초기화한다. 이전에 종료했던 위치의
    // 필터 상태가 남아있으면, 완전히 새로운 위치에서 다시 시작할 때
    // "예전 위치 → 새 위치"로 수렴하는 과도기 동안 오히려 부자연스럽게
    // 흔들리거나 지연될 수 있다.
    gpsFilterEngine.reset();
    // 방향값도 함께 초기화한다. 이걸 빠뜨리면 이전 세션에서 마지막으로
    // 확정됐던 방향값이 그대로 남아있어, GPS를 껐다 다시 켰을 때 안내가
    // 엉뚱한 각도에서 시작되는 재현성 버그의 원인이 되었다.
    gpsMovementHeading = null;
    isCurrentlyStopped = false;
    lastAlertedMilestoneKey = null;

    // 브라우저는 사용자가 직접 화면을 누른 순간에만 소리 재생을 허용한다.
    // 나중에 산속에서 이탈했을 때 소리가 안 나는 걸 막기 위해,
    // [내 위치] 버튼을 누른 지금 오디오를 미리 열어둔다.
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}

    btn.innerText = '🧭';
    btn.classList.add('active');
    requestWakeLock();
    toast.style.display = 'block';
    toast.className = 'gps-toast';
    toast.innerText = '📡 GPS 수신 중...';
    showToastBadge('📍 [내 위치 켜짐]\n화면이 자동으로 꺼지지 않습니다.');

    isFirstFix = true;

    watchId = navigator.geolocation.watchPosition(
      handleGpsPositionUpdate,
      handleGpsError,
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );

    startSleepMonitor();
  }

  // GPS 위치/에러 콜백을 이름 붙은 함수로 분리해둔다 — startGpsTracking()
  // 최초 시작뿐 아니라, 절전 모드에서 깨어날 때(restartWatchPositionOnly)
  // 도 동일한 콜백을 그대로 재사용해야 하기 때문이다(watchPosition을
  // 호출할 때마다 매번 새 익명 함수를 정의하면 두 경로의 로직이 어긋날
  // 위험이 있다).
  function handleGpsPositionUpdate(pos) {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const accuracy = Math.round(pos.coords.accuracy);
        lastKnownPos = { lat, lon }; // 화면 표시·이탈판정용 — 지연 없는 원시 좌표를 그대로 사용

        // 📡 GpsFilterEngine에 원시 픽스를 넣으면, 표준 파이프라인이
        // (1)오차 필터 → (2)정지/이동 판정 → (3)좌표 스무딩+방위각
        // 히스테리시스를 전부 내부에서 처리한 결과를 반환한다.
        // 반환값이 null이면 이번 픽스는 신뢰할 수 없어(오차 초과 또는
        // 너무 빠른 중복 수신) 버려진 것이므로 이번 갱신은 건너뛴다.
        const result = gpsFilterEngine.process({
          latitude: lat,
          longitude: lon,
          accuracy: accuracy,
          speed: pos.coords.speed,
          heading: pos.coords.heading,
          timestamp: Date.now()
        });

        if (!result) {
          // 신뢰할 수 없는 픽스 — 방향/거리 갱신 없이 다음 수신을 기다린다.
          return;
        }

        const wasStoppedBefore = isCurrentlyStopped;
        isCurrentlyStopped = result.isStopped;

        // 🔋 정지 진입/해제 시각 추적 — 절전 모드 진입 타이머(handleSleepTimerTick)
        // 가 이 시각 기준으로 5분 경과를 판정한다.
        if (isCurrentlyStopped && !wasStoppedBefore) {
          stopEnteredAt = Date.now();
        } else if (!isCurrentlyStopped) {
          stopEnteredAt = null;
        }

        // 줌 자동 전환(정지/이동 상태에 따른 확대/축소)은 제거했다 —
        // 정지 판정이 갈림길 근처에서 불안정하게 흔들리면 줌도 같이
        // 흔들려 오히려 혼란을 줬다. 화면의 확대/축소 버튼으로 사용자가
        // 직접 조절한다. 나중에 별도로 다시 설계할 수 있다.

        // 왕복 겹침 구간에서 올바른 트랙 세그먼트를 찾을 때(nearestPointOnTrail
        // 내부의 방향 하드필터) 쓸 최신 이동 방향.
        latestMovementBearingForTrailMatch = (!result.isStopped && result.bearing !== null)
          ? result.bearing
          : gpsMovementHeading;

        // 등산로(선분)까지의 최단거리 탐색 — 점까지의 거리가 아니라
        // 점들을 이은 산길 자체까지의 거리를 재야 GPX 점 간격이 넓은
        // 구간에서 산길 위에 서 있는데도 이탈로 오판되지 않는다.
        const nearest = nearestPointOnTrail(lat, lon, currentPoints);
        const minDistanceM = nearest.distance;
        const nearestPoint = nearest.point;
        const nearestIdx = nearest.index;

        // 코스 시작(들머리) 근처인지 — 첫 원점이 아직 한 번도 안 잡힌
        // 상태(currentRotationOriginDist===null, v75의 "방향 일치 전
        // 보류"와 같은 개념)이고 누적거리도 짧으면, 아직 GPS 이동방향이
        // 안정되지 않은 구간으로 보고 이탈 판정 기준을 완화한다.
        const traveledDistForEntry = cumulativeDistances[nearestIdx] || 0;
        const isNearTrailhead = isSegmentRotationMode && currentRotationOriginDist === null && traveledDistForEntry < TRAILHEAD_ENTRY_DISTANCE_M;
        updateOffTrailHysteresis(minDistanceM, accuracy, isNearTrailhead);

        // ⭐ 전면 재설계(2026-09-14): GPX가 경로 전체를 이미 알고 있으므로
        // "내가 지금 어느 방향을 보는가"는 더 이상 필요 없다. 정지/이동
        // 여부와 무관하게 GPS 이동방향(result.bearing)이 나올 때만 내 위치
        // 마커 화살표를 갱신하고, 갈림길 안내(다음 갈림길까지 거리 +
        // 미리 계산된 회전각)는 updateNavigationToast가 전담한다.
        if (!result.isStopped && result.bearing !== null) {
          gpsMovementHeading = result.bearing;
          lastGpsMoveTime = Date.now();
          // 내 위치 마커(userGpsMarker)는 Leaflet 마커라 #map의 자식
          // 레이어 안에 있다 — 구간 heading-up이 켜져 #map이
          // rotate(-mapRotationDeg)만큼 이미 돌아가 있으면, 화살표도
          // 그 회전을 부모로부터 그대로 물려받는다(자식 DOM 회전은 부모
          // 회전에 "더해지는" 방식으로 합산된다).
          // 화면상 최종 회전 = 부모(-mapRotationDeg) + 자식(적용할 값).
          // 우리가 원하는 최종 화면 회전은 절대방위 gpsMovementHeading이
          // "지도가 mapRotationDeg만큼 회전한 만큼" 어긋나 보이는 것이므로
          // (gpsMovementHeading - mapRotationDeg)이고, 이를 만족하는
          // 자식 회전값을 역산하면 정확히 gpsMovementHeading 그 자체가
          // 나온다(부모의 -mapRotationDeg와 상쇄됨) — 즉 renderGpsArrow에
          // 넘길 값은 회전 모드 여부와 무관하게 항상 result.bearing으로
          // 동일하다. 순수 계산으로 검증 완료(scratchpad/verify_headingup_rotation.js).
          renderGpsArrow(result.bearing);
        }

        // ⚠️ updateNavigationToast를 마커 생성/지도뷰 갱신보다 먼저
        // 호출해야 한다 — 구간이 바뀌는 프레임에 이 함수 내부에서
        // applySegmentRotation이 mapRotationDeg를 새 구간 방향으로
        // 갱신하는데, 순서가 반대이면 화살표 보정 등이 옛 값(한 프레임
        // 지연)을 참조하게 된다.
        updateNavigationToast(accuracy, minDistanceM, nearestIdx, nearestPoint);

        // 마커 생성 또는 이동
        if (!userGpsMarker) {
          const gpsIcon = L.divIcon({
            className: 'custom-gps-icon',
            html: createGpsIconHtml(getCurrentAbsHeadingForGuidance()),
            iconSize: [80, 80],
            iconAnchor: [40, 40]
          });
          userGpsMarker = L.marker([lat, lon], { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);
          {
            const z = Math.max(map.getZoom(), 16);
            applyMapViewWithOffset(lat, lon, z, { animate: true });
          }
          // 내 위치를 켜는 순간부터 GPS 켜짐 모드(자동 센터링)와 방향 화살표를 함께 시작한다.
          if (!isHeadingUp) {
            setHeadingUpMode(true, true);
          }
        } else {
          userGpsMarker.setLatLng([lat, lon]);
          if (isFirstFix) {
            const z = Math.max(map.getZoom(), 16);
            applyMapViewWithOffset(lat, lon, z, { animate: true });
          } else if (isHeadingUp && !isMapBeingDragged && !isMapDragReturnPending) {
            // 구간회전 모드에서는 지도 중심이 항상 현재 구간 시작점에
            // 고정된다(applyMapViewWithOffset 내부에서 처리). 단, 사용자가
            // 손가락으로 드래그해 다른 구간을 둘러보는 중이거나
            // (isMapBeingDragged) 손을 뗀 뒤 자동 복귀 유예 시간 중에는
            // (isMapDragReturnPending) GPS 픽스(약 1초 간격)가 화면을 곧바로
            // 원위치로 튕겨버리는 것을 막는다 — 유예 시간이 지나면
            // dragend 핸들러의 타이머가 알아서 복귀시킨다.
            const z = map.getZoom();
            applyMapViewWithOffset(lat, lon, z, { animate: false });
          }
        }
        isFirstFix = false;

        // 갈 방향 안내 (등산로 복귀 가이드 점선)
        if (nearestPoint && minDistanceM > 12) {
          const guideCoords = [[lat, lon], [nearestPoint.lat, nearestPoint.lon]];
          if (!guideLine) {
            guideLine = L.polyline(guideCoords, {
              color: '#00e676',
              weight: 3.5,
              dashArray: '6, 8',
              opacity: 0.95
            }).addTo(map);
          } else {
            guideLine.setLatLngs(guideCoords);
          }
        } else if (guideLine) {
          map.removeLayer(guideLine);
          guideLine = null;
        }
  }

  function handleGpsError() {
    const toast = document.getElementById('gpsToast');
    const btn = document.getElementById('gpsBtn');
    toast.className = 'gps-toast warning';
    toast.innerText = '⚠️ GPS 수신 실패 (위치 권한 확인)';
    btn.innerText = '📍';
    btn.classList.remove('active');
    watchId = null;
    showHeadingArrow = false;
    releaseWakeLock();
    stopCompass();
    if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
    stopSleepMonitor();
  }

  // ════════════════════════════════════════════════════════════════
  // 🔋 배터리 절전 모드
  //
  // 5분 이상 정지 상태가 지속되면(휴식, 식사, 사진 촬영 등) GPS 수신을
  // 잠시 멈춘다. 지도/마커/토스트/웨이크락 등 화면 상태는 그대로 두고
  // navigator.geolocation.watchId만 정리한다 — 사용자가 직접 끄는
  // stopGpsTracking()과 달리 UI 초기화는 하지 않는다.
  //
  // "다시 움직이기 시작했다"는 하이브리드 방식으로 감지한다:
  //  (1) 가속도 센서(devicemotion)의 walkVibrationLevel이 문턱을 넘으면
  //      즉시 GPS 재시작 — 주 경로, 반응이 빠르다.
  //  (2) 센서 권한이 없거나 devicemotion이 멈춘 기기를 위한 안전망으로,
  //      절전 중 SLEEP_WATCHDOG_MS(2분)마다 무조건 한 번씩 GPS를 잠깐
  //      켜서 실제 위치가 바뀌었는지 확인한다. 안 바뀌었으면 다시 절전.
  // ════════════════════════════════════════════════════════════════

  let sleepTickTimerId = null;

  function startSleepMonitor() {
    if (sleepTickTimerId) clearInterval(sleepTickTimerId);
    sleepTickTimerId = setInterval(handleSleepTimerTick, 10000); // 10초마다 정지 지속시간 체크
  }

  function stopSleepMonitor() {
    if (sleepTickTimerId) { clearInterval(sleepTickTimerId); sleepTickTimerId = null; }
    if (sleepWatchdogTimerId) { clearInterval(sleepWatchdogTimerId); sleepWatchdogTimerId = null; }
    isGpsSleeping = false;
    sleepCheckPos = null;
    sleepCheckStartedAt = null;
  }

  function handleSleepTimerTick() {
    if (isGpsSleeping || watchId === null) return; // 이미 절전 중이거나 GPS 자체가 꺼져 있으면 할 일 없음
    if (!isCurrentlyStopped || stopEnteredAt === null) return;
    if (Date.now() - stopEnteredAt >= SLEEP_AFTER_STOPPED_MS) {
      enterGpsSleep();
    }
  }

  function enterGpsSleep() {
    if (isGpsSleeping || watchId === null) return;
    isGpsSleeping = true;
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    showToastBadge('🔋 5분간 움직임이 없어 절전 모드로 전환합니다.\n다시 걸으면 자동으로 위치 추적이 재개됩니다.');

    // watchdog: 진동이 감지되지 않아도 2분마다 한 번씩 스스로 깨어나
    // 실제로 이동했는지 확인한다.
    if (sleepWatchdogTimerId) clearInterval(sleepWatchdogTimerId);
    sleepWatchdogTimerId = setInterval(runSleepWatchdogCheck, SLEEP_WATCHDOG_MS);
  }

  // 진동 감지(devicemotion)로 걷기 시작을 알아챘을 때 호출 — window의
  // devicemotion 리스너(walkVibrationLevel 갱신부)에서 함께 호출한다.
  function wakeGpsFromVibration() {
    if (!isGpsSleeping) return;
    exitGpsSleep('진동 감지');
  }

  // watchdog 주기마다 GPS를 짧게 켜서(약 8초) 실제로 위치가 바뀌었는지
  // 확인한다. 첫 픽스와 비교해 MIN_DISTANCE 이상 벌어지면 "진짜 이동"
  // 으로 보고 절전을 해제하고, 아니면 다시 절전 상태로 돌아간다.
  const SLEEP_WATCHDOG_CHECK_MS = 8000;
  const SLEEP_WATCHDOG_MOVE_THRESHOLD_M = 8;

  function runSleepWatchdogCheck() {
    if (!isGpsSleeping) return; // 이미 진동 감지로 깨어난 경우 등
    sleepCheckPos = null;
    sleepCheckStartedAt = Date.now();

    const checkWatchId = navigator.geolocation.watchPosition(
      pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (!sleepCheckPos) {
          sleepCheckPos = { lat, lon };
          return;
        }
        const movedM = haversineMeters(sleepCheckPos.lat, sleepCheckPos.lon, lat, lon);
        if (movedM >= SLEEP_WATCHDOG_MOVE_THRESHOLD_M) {
          navigator.geolocation.clearWatch(checkWatchId);
          exitGpsSleep('watchdog 이동 확인');
        }
      },
      () => { /* watchdog 확인용 픽스 실패는 조용히 무시 — 다음 주기에 재시도 */ },
      { enableHighAccuracy: true, maximumAge: 0, timeout: SLEEP_WATCHDOG_CHECK_MS }
    );

    // 확인 시간(SLEEP_WATCHDOG_CHECK_MS)이 지나도 못 깨어났으면(정지
    // 유지) 짧게 켰던 GPS를 다시 정리하고 절전 상태를 유지한다.
    setTimeout(() => {
      if (isGpsSleeping) {
        navigator.geolocation.clearWatch(checkWatchId);
      }
    }, SLEEP_WATCHDOG_CHECK_MS + 500);
  }

  // 절전 모드에서 깨어날 때 GPS만 다시 켠다 — startGpsTracking()처럼
  // 마커/토스트/웨이크락/디버그로거까지 전부 새로 초기화하지 않는다
  // (화면은 절전 중에도 그대로 떠 있었으므로 다시 만들 필요가 없다).
  function restartWatchPositionOnly() {
    isFirstFix = false; // 이미 추적 중이던 마커가 있으므로 "최초 진입" 카메라 점프는 하지 않는다
    watchId = navigator.geolocation.watchPosition(
      handleGpsPositionUpdate,
      handleGpsError,
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );
  }

  function exitGpsSleep(reason) {
    if (!isGpsSleeping) return;
    isGpsSleeping = false;
    if (sleepWatchdogTimerId) { clearInterval(sleepWatchdogTimerId); sleepWatchdogTimerId = null; }
    sleepCheckPos = null;
    sleepCheckStartedAt = null;
    stopEnteredAt = null; // 다시 정지 상태가 되더라도 5분을 새로 카운트

    if (watchId === null) {
      // startGpsTracking을 그대로 재사용하면 UI 전체가 "새로 켜는"
      // 상태로 리셋돼버리므로(웨이크락 재요청 등은 무해하지만 마커가
      // 다시 생성되며 잠깐 깜빡일 수 있다), 대신 watchPosition만 다시
      // 건다. startGpsTracking 내부의 콜백 로직을 그대로 재사용하기
      // 위해 restartWatchPositionOnly()를 호출한다.
      restartWatchPositionOnly();
    }
    showToastBadge(`📍 위치 추적을 재개합니다. (${reason})`);
  }

  // 느린 프록시에서 무한정 기다리지 않도록 각 시도마다 제한시간을 둔다.
  // 스마트폰 이동통신망에서는 corsproxy.io 응답이 수십 초씩 걸리는 경우가
  // 실제로 있었는데, 타임아웃이 없으면 다음 단계(더 빠를 수 있는 경로)로
  // 못 넘어가고 그 프록시 하나만 계속 기다리게 된다.
  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  // 외부 서버(네이버 등) 및 깃허브 tracks에서 안전하게 GPX를 가져오는 고성능 로더
  async function fetchGPXFile(targetUrl) {
    let cleanUrl = targetUrl.trim();
    // %25EA 등 이중 인코딩된 URL을 완전 해독 후 올바른 1회 인코딩 적용
    for (let i = 0; i < 3; i++) {
      try {
        const next = decodeURIComponent(cleanUrl);
        if (next === cleanUrl) break;
        cleanUrl = next;
      } catch(e) { break; }
    }
    try {
      cleanUrl = encodeURI(cleanUrl);
    } catch(e) {}

    const errors = [];

    // 1. 직접 다운로드 시도 (GitHub Pages, Raw, CORS 허용 서버 등)
    try {
      const res = await fetchWithTimeout(cleanUrl, 5000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`1) 직접 다운로드: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`1) 직접 다운로드 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`1) 직접 다운로드 실패: ${e.message || '네트워크/CORS 제한'}`);
    }

    // 2. 🌟 핵심 복구 기능: 네이버 블로그 링크가 만료(403)되었을 때
    // URL 속 파일명(예: 남덕유산_20250501.gpx)을 추출하여 우리 tracks 저장소에서 즉시 대체 로드!
    try {
      const match = cleanUrl.match(/([^\/\?#&=:"']+\.gpx)/i);
      if (match && match[1]) {
        let fname = match[1];
        try { fname = decodeURIComponent(fname); } catch(e) {}
        const fallbacks = [
          `./tracks/${encodeURIComponent(fname)}`,
          `https://hjwpro1971.github.io/gaja/tracks/${encodeURIComponent(fname)}`,
          `https://raw.githubusercontent.com/hjwpro1971/gaja/main/tracks/${encodeURIComponent(fname)}`
        ];
        for (const fb of fallbacks) {
          try {
            const res = await fetchWithTimeout(fb, 5000);
            if (res.ok) {
              const text = await res.text();
              if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
                console.log('대체 트랙 저장소에서 복구 성공:', fb);
                return text;
              }
            }
          } catch(e) {}
        }
        errors.push(`2) 저장소 대체 복구: '${fname}' 파일 없음`);
      } else {
        errors.push(`2) 저장소 대체 복구: 파일명 추출 불가`);
      }
    } catch(e) {
      errors.push(`2) 저장소 대체 복구 실패: ${e.message}`);
    }

    // 3. allorigins 공개 프록시 시도
    try {
      const res = await fetchWithTimeout('https://api.allorigins.win/raw?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`3) 공개 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`3) 공개 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`3) 공개 프록시 실패: ${e.message || '타임아웃'}`);
    }

    // 4. 나스 서버 로컬 프록시 시도
    try {
      const res = await fetchWithTimeout('/api/gpx-proxy?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`4) 로컬 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`4) 로컬 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`4) 로컬 프록시 실패: ${e.message || '연결 불가'}`);
    }

    throw new Error('모든 방식으로 등산로 파일을 불러오지 못했습니다.\n[상세 사유]\n' + errors.join('\n'));
  }

  window.addEventListener('DOMContentLoaded', async () => {
    initMap();

    const urlParams = new URLSearchParams(window.location.search);
    const hadGpxUrl = !!(urlParams.get('url') || urlParams.get('file'));
    let gpxUrl = urlParams.get('url') || urlParams.get('file');
    const courseName = urlParams.get('name');
    let decodedCourseName = courseName ? decodeURIComponent(courseName) : '';

    if (!decodedCourseName && gpxUrl) {
      const m = decodeURIComponent(gpxUrl).match(/([^\/\?#&=:"']+\.gpx)/i);
      if (m && m[1]) {
        decodedCourseName = m[1].replace(/\.gpx$/i, '').replace(/_\d{8}$/, '').replace(/_{2,}/g, ' ').replace(/_/g, ' ').trim();
      }
    }
    if (!decodedCourseName) decodedCourseName = '등산로 코스';

    // 페이지 진입 즉시 상단 헤더 및 창 타이틀에 산 이름 반영
    const trailEl = document.getElementById('trailName');
    if (trailEl) trailEl.innerText = '🚩 ' + decodedCourseName;
    let pageTitle = decodedCourseName;
    if (!pageTitle.includes('등산지도') && !pageTitle.includes('등산로') && !pageTitle.includes('지도')) {
      pageTitle += ' 등산지도';
    }
    document.title = pageTitle;
    const appleMeta = document.getElementById('appleAppTitle');
    if (appleMeta) appleMeta.content = pageTitle;

    // 같은 코스를 다시 열 때 매번 외부 프록시를 거쳐 GPX를 재다운로드하지
    // 않도록, url 파라미터가 있으면 먼저 localStorage에 같은 원본 GPX
    // 주소(sourceUrl)로 저장된 좌표가 있는지 찾아본다. 코스명이 아니라
    // 반드시 원본 주소로 비교해야 한다 — "남덕유산_20250501.gpx"와
    // "남덕유산_20251217.gpx"처럼 코스명은 같아도 실제로는 전혀 다른 GPX인
    // 경우가 있어, 이름만 보고 캐시를 재사용하면 엉뚱한 지도가 뜨는 버그가
    // 있었다.
    // 🌟 핵심: 다운받기 전에 캐시에 이미 저장되어 있는지 먼저 체크!
    // 동일한 GPX 파일명 또는 코스명이 이미 있으면 외부 다운로드를 하지 않고 캐시에서 즉시 복원 (0.001초 로딩 & 중복 방지)
    if (gpxUrl) {
      const loadingEl = document.createElement('div');
      loadingEl.id = 'gpxLoadingBadge';
      loadingEl.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.25); backdrop-filter:blur(4px); pointer-events:none;';
      loadingEl.innerText = '🔄 등산 코스 불러오는 중...';
      document.body.appendChild(loadingEl);

      try {
        // 항상 원격 최신본 다운로드를 시도하여 에디터 수정사항이 즉시 반영되도록 함.
        const xml = await fetchGPXFile(gpxUrl);
        const points = parseGPX(xml);
        drawRoute(points, decodedCourseName, gpxUrl);
      } catch(err) {
        console.warn('원격 GPX 다운로드 실패. 오프라인 캐시 폴백 시도:', err);
        // 인터넷이 끊긴 산속이거나 서버 오류 시 로컬 캐시에서 꺼내어 그려준다 (완벽한 오프라인 지원).
        const cached = findSavedRoute(decodedCourseName, gpxUrl);
        if (cached) {
          console.log('오프라인 캐시에서 등산로 복원 완료:', cached.name);
          if (cached.waypoints) cached.points.waypoints = cached.waypoints;
          drawRoute(cached.points, cached.name, cached.sourceUrl || gpxUrl, true);
          
          const fastBadge = document.createElement('div');
          fastBadge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:99999; background:rgba(27,94,32,0.95); color:#ffffff; font-size:13px; font-weight:800; padding:10px 20px; border-radius:24px; box-shadow:0 4px 16px rgba(0,0,0,0.3); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.5s;';
          fastBadge.innerHTML = '⚡ 오프라인 저장된 코스를 열었습니다';
          document.body.appendChild(fastBadge);
          setTimeout(() => {
            fastBadge.style.opacity = '0';
            setTimeout(() => fastBadge.remove(), 500);
          }, 1800);
        } else {
          alert('등산로를 불러오지 못했습니다.\n\n인터넷 연결을 확인하고 다시 시도해 주세요.\n(또는 내 코스 목록에서 열어보세요)');
          showSavedRouteList('저장된 GPX 목록을 불러왔습니다.');
        }
      } finally {
        const badge = document.getElementById('gpxLoadingBadge');
        if (badge) badge.remove();
      }
    } else if (!hadGpxUrl) {
      showSavedRouteList();
    }


  });
</script>
