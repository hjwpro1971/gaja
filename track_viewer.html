      // 이미 화면이 꺼진 채로(드문 경우: 백그라운드 탭에서 이 함수가
      // 호출된 경우) 폴링 중이었다면 즉시 일반 GPS로 되돌린다.
      if (isLowPowerPolling) {
        stopLowPowerPolling();
        startGpsTracking();
      }
    }
    updateLowPowerBtnUI();
  }
  window.toggleLowPowerMode = toggleLowPowerMode;

  // 화면이 꺼질 때(visibilitychange) 일반 GPS를 멈추고 5초 폴링으로
  // 전환한다. lowPowerModeEnabled가 true일 때만 visibilitychange가 호출.
  function startLowPowerPolling() {
    isLowPowerPolling = true;
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    stopSleepMonitor(); // 정지 감지 절전 모드와 저전력 폴링이 동시에 개입하면 혼란스러우므로 저전력 모드 중엔 끔
    if (lowPowerPollTimerId) clearInterval(lowPowerPollTimerId);
    pollOnceForLowPower(); // 전환 즉시 1회 먼저 갱신
    lowPowerPollTimerId = setInterval(pollOnceForLowPower, LOW_POWER_POLL_INTERVAL_MS);
  }

  // 5초 폴링을 멈춘다 — lowPowerModeEnabled(설정) 자체는 건드리지 않는다
  // (화면이 다시 켜져 일반 GPS로 복귀할 때도 이 함수만 호출되고, 설정은
  // 다음에 화면이 또 꺼질 때를 위해 그대로 유지되어야 하므로).
  function stopLowPowerPolling() {
    isLowPowerPolling = false;
    if (lowPowerPollTimerId) { clearInterval(lowPowerPollTimerId); lowPowerPollTimerId = null; }
  }

  function pollOnceForLowPower() {
    if (!isLowPowerPolling) return;
    navigator.geolocation.getCurrentPosition(
      handleGpsPositionUpdate,
      handleLowPowerPollError,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  }

  // 저전력 폴링(5초 간격 단발 getCurrentPosition) 전용 에러 핸들러 —
  // 사용자 재현: "gps 수신 실패라는 메세지가 안 나오다가 나와"(화면
  // 껐다 켤 때, 저전력 모드). 원래 일반 GPS용 handleGpsError는 "연속
  // 추적(watchPosition)이 완전히 끊겼다"는 심각한 에러로 취급해
  // watchId를 지우고 wakeLock까지 해제하는데, pollOnceForLowPower는
  // 애초에 매번 새로 getCurrentPosition을 단발 호출하는 구조라
  // watchId 자체가 없다 — 신호가 약한 구간(실내 진입 직전, 나무 밀집)
  // 에서 한 번 타임아웃난 것뿐인데도 "GPS 수신 실패" 경고가 뜨고
  // isLowPowerPolling은 안 꺼지니 5초 뒤 다시 폴링해 조용해지는,
  // 정상 동작인데 사용자에게는 원인불명 경고로만 보이는 결함이었다.
  // 저전력 중 일시적 실패는 그냥 이번 픽스만 건너뛰고 다음 5초
  // 폴링에 맡긴다 — 화면/GPS 상태를 아무것도 건드리지 않는다.
  function handleLowPowerPollError() {
    console.warn('⚠️ 저전력 폴링 중 GPS 픽스 실패(다음 폴링에서 재시도)');
  }

  function updateLowPowerBtnUI() {
    const btn = document.getElementById('lowPowerBtn');
    if (!btn) return;
    // ON/OFF는 lowPowerModeEnabled(예약 여부)를 표시한다 — 지금 이 순간
    // 실제로 폴링 중인지(isLowPowerPolling)가 아니라, "화면이 꺼지면
    // 저전력으로 갈 것이다"라는 설정 자체를 보여준다.
    btn.classList.toggle('active', lowPowerModeEnabled);
    btn.innerText = lowPowerModeEnabled ? '🔔' : '🔕';
  }

  // handleGpsPositionUpdate(아래)와 startGpsTracking 양쪽에서 쓰는
  // "이번이 GPS 시작 후 첫 픽스인가" 플래그 — 콜백을 이름 붙은 함수로
  // 분리하면서 함수 지역변수였던 것을 모듈 스코프로 옮겼다.
  let isFirstFix = true;

  // 🚀 등산 시작 확인 버튼(사용자 지시): 코스를 열면(drawRoute 직후,
  // 외부 링크 진입/메뉴 선택 진입 모두 공통) 산행지 이름 바로 아래에
  // 뜨고, GPS가 꺼진 상태에서 🎯(내 위치) 버튼을 눌러도 같은 버튼이
  // 다시 뜬다. 사용자가 직접 누를 때까지 타임아웃 없이 계속 표시된다
  // (2026-09-25 수정 — 처음엔 5초 후 자동으로 사라졌으나, "🎯 버튼을
  // 눌러 확인 버튼을 다시 띄우고 그걸 또 눌러 GPS를 켜는 경우, 사용자
  // 입장에선 타이밍 맞추기 어렵다"는 지적으로 제거). GPS가 이미 켜져
  // 있을 때(산행 중)는 이 오버레이를 띄우지 않고 기존 toggleGPS
  // 동작(끄기)을 그대로 유지한다.
  function showStartHikeOverlay() {
    const overlay = document.getElementById('startHikeOverlay');
    if (!overlay) return;
    overlay.style.display = 'flex';
  }
  window.showStartHikeOverlay = showStartHikeOverlay;

  function hideStartHikeOverlay() {
    const overlay = document.getElementById('startHikeOverlay');
    if (overlay) overlay.style.display = 'none';
  }

  // 사용자가 "🚀 등산 시작" 버튼을 실제로 눌렀을 때만 호출된다.
  function confirmStartHike() {
    hideStartHikeOverlay();
    // 🏁 산행 세션 시작 — 이 버튼을 누른 순간부터 "🏁 등산 완료"를
    // 명시적으로 누르기 전까지는 같은 코스 재진입 시 이 확인 버튼을
    // 다시 띄우지 않는다(drawRoute()의 세션 복귀 분기 참고).
    startHikingSession(currentRouteKey);
    startGpsTracking();
  }
  window.confirmStartHike = confirmStartHike;

  function startGpsTracking() {
    const btn = document.getElementById('gpsBtn');
    const toast = document.getElementById('gpsToast');

    if (!navigator.geolocation) {
      alert('이 브라우저에서는 내 위치 기능을 사용할 수 없어요.\n\n📱 스마트폰 기본 브라우저(예: 삼성 인터넷, 크롬, Safari)로 다시 열어 주세요.');
      return;
    }

    showHeadingArrow = true;

    // GPS를 새로 켤 때마다 필터를 초기화한다. 이전에 종료했던 위치의
    // 필터 상태가 남아있으면, 완전히 새로운 위치에서 다시 시작할 때
    // "예전 위치 → 새 위치"로 수렴하는 과도기 동안 오히려 부자연스럽게
    // 흔들리거나 지연될 수 있다.
    gpsFilterEngine.reset();
    // 방향값도 함께 초기화한다. 이걸 빠뜨리면 이전 세션에서 마지막으로
    // 확정됐던 방향값이 그대로 남아있어, GPS를 껐다 다시 켰을 때 안내가
    // 엉뚱한 각도에서 시작되는 재현성 버그의 원인이 되었다.
    gpsMovementHeading = null;
    isCurrentlyStopped = false;
    lastAlertedMilestoneKey = null;
    remainingBeepThresholds = null;
    // 🧭 trackDirection(isReversingOnTrail)도 함께 초기화한다(대원칙
    // 6번: GPS를 새로 잡으면 이전 방향 상태를 신뢰하지 않는다) — 예전엔
    // 이 함수가 이 리셋을 빠뜨리고 있어서, GPS를 껐다가 왕복 코스 중간
    // 지점에서 다시 켜면 직전 세션의 순/역방향 이력이 새 세션까지
    // 이어져 방향이 어긋날 수 있었다.
    resetTrackDirectionState();
    resetTrailSearchWindow();
    // 🧭 지도 회전(가자맵 대원칙 재설계, updateGajaMap/100m 게이트)도
    // GPS 재시작 시 기준점만 초기화한다 — mapRotationDeg/appliedMapRotationDeg
    // 자체는 리셋하지 않아도 최단경로 계산으로 다음 픽스에서 바로 정확한
    // 방향으로 스냅된다(shortestAngleDiff 기준).
    resetGajaMapRotationState();

    // 🧭 구간회전 모드를 여기서 미리 켜둔다(2026-09-21, #11). 원래는
    // handleGpsPositionUpdate의 첫 마커 생성 시점(setHeadingUpMode 호출)
    // 에서야 isSegmentRotationMode가 true로 바뀌었는데, 그 코드보다
    // updateNavigationToast → updateSegmentRotationTrigger 호출이 항상
    // 먼저 실행되는 순서라, 첫 GPS 픽스에서는 isSegmentRotationMode가
    // 아직 false라 조용히 리턴돼버려 "GPS 잡히자마자 즉시 코스 방향으로
    // 영점/화살표 확정"이 실제로는 두 번째 픽스에야 일어났다 — 갈림길
    // 근처에서 앱을 막 켰을 때 화살표가 안 뜨는 것으로 체감되는 원인.
    // 여기서 미리 세팅해두면 첫 픽스부터 곧바로 동작한다.
    isSegmentRotationMode = true;
    currentRotationOriginDist = null;
    firstOriginFixCount = 0;

    // 브라우저는 사용자가 직접 화면을 누른 순간에만 소리 재생을 허용한다.
    // 나중에 산속에서 이탈했을 때 소리가 안 나는 걸 막기 위해,
    // [내 위치] 버튼을 누른 지금 오디오를 미리 열어둔다.
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}

    btn.innerText = '🧭';
    btn.classList.add('active');
    requestWakeLock();
    toast.style.display = 'block';
    toast.className = 'gps-toast';
    toast.innerText = '📡 GPS 수신 중...';
    showToastBadge('📍 [내 위치 켜짐]\n화면이 자동으로 꺼지지 않습니다.');

    // 📡 화면 중앙 GPS 수신 대기 오버레이(#1) — 첫 픽스를 받으면
    // handleGpsPositionUpdate의 마커 생성 분기에서 자동으로 숨겨진다.
    const waitingOverlay = document.getElementById('gpsWaitingOverlay');
    if (waitingOverlay) waitingOverlay.style.display = 'flex';

    isFirstFix = true;

    // 🔌 네이티브 앱(gaja-app, 포그라운드서비스_작업매뉴얼.md)에서는
    // window.AndroidBridge가 주입되어 있다 — 이 경우 웹표준
    // navigator.geolocation.watchPosition 대신 Kotlin의
    // LocationForegroundService가 위치를 공급한다(화면이 꺼져도 계속
    // 동작). 위치는 handleNativeLocationUpdate -> handleGpsPositionUpdate
    // 경로로 그대로 들어온다. 두 GPS 소스를 동시에 켜면 배터리만
    // 낭비되므로 택일한다.
    // ⚠️ watchId는 이 파일 전체에서 "GPS 추적 중" 여부를 나타내는
    // 범용 플래그로도 쓰인다(watchId !== null 체크가 여러 곳에 있음).
    // 네이티브 경로도 이 관례를 따르기 위해 'native'라는 문자열을
    // watchId에 넣어둔다 — navigator.geolocation.clearWatch()에 숫자가
    // 아닌 값을 넘겨도 표준상 조용히 무시되므로 stopGpsTracking()의
    // clearWatch(watchId) 호출도 안전하다.
    if (isNativeApp()) {
      watchId = 'native';
      try { window.AndroidBridge.startForegroundLocation(); } catch(e) {}
    } else {
      watchId = navigator.geolocation.watchPosition(
        handleGpsPositionUpdate,
        handleGpsError,
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    startSleepMonitor();
  }

  // GPS 위치/에러 콜백을 이름 붙은 함수로 분리해둔다 — startGpsTracking()
  // 최초 시작뿐 아니라, 절전 모드에서 깨어날 때(restartWatchPositionOnly)
  // 도 동일한 콜백을 그대로 재사용해야 하기 때문이다(watchPosition을
  // 호출할 때마다 매번 새 익명 함수를 정의하면 두 경로의 로직이 어긋날
  // 위험이 있다).
  // 🔌 네이티브(안드로이드 Foreground Service)에서 위치를 받는 통로.
  // Kotlin 쪽 MainActivity가 WebView에 window.AndroidBridge를 JavaScript
  // Interface로 등록해두면(포그라운드서비스_작업매뉴얼.md 4-3), 이 앱이
  // TWA 껍데기가 아니라 그 네이티브 프로젝트(gaja-app)로 빌드된 것임을
  // 알 수 있다. GPS 위치는 여전히 이 함수(handleNativeLocationUpdate)로
  // 들어온다 — 웹표준 navigator.geolocation의 pos 객체와 같은 모양
  // (pos.coords.latitude 등)으로 감싸서 기존 handleGpsPositionUpdate를
  // 그대로 재사용한다. GitHub Pages로 배포된 일반 웹/PWA에서는
  // window.AndroidBridge가 없으므로 isNativeApp()이 false를 반환하고,
  // 이 함수도 호출되지 않아 기존 동작에 영향 없음.
  function isNativeApp() {
    return typeof window.AndroidBridge !== 'undefined' && window.AndroidBridge !== null;
  }

  window.handleNativeLocationUpdate = function(lat, lon, accuracy, speed, bearing) {
    const fakePos = {
      coords: {
        latitude: lat,
        longitude: lon,
        accuracy: accuracy,
        speed: speed,
        heading: bearing
      }
    };
    handleGpsPositionUpdate(fakePos);
  };

  // ===================================================================
  // 🪧 이정표 안내판 근접 모달 (2026-09-26)
  //
  // 왜 만들었나: 갈림길 등 이정표 지점의 라벨은 지도 마커에 짧게만
  // 표시되는데("삼불봉고개" 한 단어), 실제 산행 중엔 그 안내판에 실제로
  // 적힌 전체 목적지 문구를 폰 화면에서 크게 보고 싶다는 요청 — GPS가
  // 이정표 좌표 10m 이내로 들어오면 화면 상단에 모달로 자세히 표시하고,
  // 25m 밖으로 벗어나면 자동으로 사라진다(들쭉날쭉한 GPS로 깜빡이는 것
  // 방지 — hideThreshold와 같은 원리로 진입/이탈 임계값을 다르게 둠).
  //
  // 데이터 출처: nas-tools의 mountain_poi.db(산림청 100대명산 실측 GPX의
  // wpt 중 category=SIGN). 산 이름으로 먼저 좁히지 않고 이정표 전체를
  // 가져와 좌표 거리만으로 판정한다 — "밀양_재약산_A코스"처럼 파일명이
  // 산 이름으로 시작하지 않는 코스도 항상 동작하게 하기 위함(gpx-map.html
  // 의 fetchAllSignpostsFromDB()와 같은 이유).
  //
  // https 페이지에서 http 전용 nas-tools를 직접 부르면 Mixed Content로
  // 막히므로 상대경로 "/api/poi"만 쓴다(Y:\.gaja-conf\tls.conf의
  // ProxyPass /api/ 를 거치게 한다). GitHub Pages처럼 이 프록시가 없는
  // 배포본에서는 fetch가 실패하며, catch에서 조용히 넘어가 GPS 안내 자체
  // (구간회전, 방향 화살표 등 이 기능과 무관한 다른 기능)에는 영향이
  // 없도록 만들었다.
  // ===================================================================
  const POI_PROXIMITY_ENTER_M = 10; // 이 거리 이내로 들어오면 모달 표시
  const POI_PROXIMITY_EXIT_M = 25;  // 이 거리보다 멀어지면 모달 닫힘
  let _poiSignpostCache = null; // 전체 이정표 목록(1회 조회 후 재사용)
  let _poiSignpostFetchAttempted = false;
  let _activeProximityPoi = null; // 현재 모달이 떠 있는 이정표(진입/이탈 판정용)
  let _poiModalManuallyDismissedKey = null; // ✕로 방금 닫은 지점 — 같은 진입 동안 재등장 안 함

  async function fetchCoursePoiSignposts() {
    if (_poiSignpostFetchAttempted) return _poiSignpostCache;
    _poiSignpostFetchAttempted = true;
    try {
      const res = await fetch('/api/poi?category=SIGN');
      if (!res.ok) return null;
      const data = await res.json();
      _poiSignpostCache = data.items || [];
      return _poiSignpostCache;
    } catch (e) {
      return null; // 서버가 잠깐 안 떠 있어도 GPS 안내 자체는 계속 동작해야 한다
    }
  }

  // 🐛 2026-09-26 수정(사용자 지적: "이정표 안내판이 하단에 모달 형식으로
  // 나타났다가.. 밑에 있으니 방향알림 화살표가 안 보여. 상단 알림판에
  // 이정표 근처에 가면 나타나는 하단 모달을 상단 알림판 위치로 이동해서
  // 이 모달이 나타날때 상단 알림판 대신 하게 해줘. 이 모달이 사라지면
  // 상단 알림판이 다시 보이면 돼") — 하단 고정(bottom:20px)이던 위치를
  // 상단 알림판(.gps-toast, top:68px)과 같은 자리로 옮기고, 이정표 모달이
  // 떠 있는 동안은 상단 알림판(#gpsToast)을 숨긴다. updateNavigationToast는
  // toast.style.display==='none'이면 텍스트 갱신만 건너뛰고 나머지 로직
  // (구간 회전 트리거 등)은 그대로 실행되므로, 잠깐 숨겨도 안내 로직
  // 자체에는 영향이 없다 — display만 토글하는 것으로 안전하다.
  // 🐛 2026-09-26 수정(사용자 재현: "알림판 사라지고 난 후 상단토스트가
  // 안 보여") — display:'none'으로 숨겼더니, updateNavigationToast가
  // `if (!toast || toast.style.display === 'none') return;`로 display가
  // 'none'인 동안은 텍스트 갱신 자체를 통째로 건너뛰고 있었다(단순히
  // "화면 표시만 스킵"이 아니라 이후 로직 전체가 return되는 조기
  // 종료문). 그 결과 이정표 모달이 떠 있던 동안 gpsToast의 내용이 전혀
  // 갱신되지 않다가, 모달이 닫혀 display를 복원해도 오래된(또는
  // 최초라면 비어있는) 텍스트만 보이거나 실질적으로 안 보이는 것처럼
  // 느껴졌다. display 대신 visibility:hidden을 써서 "화면에만 안
  // 보이게" 하고, updateNavigationToast의 display==='none' 체크는
  // 통과시켜 내용 갱신은 계속 정상적으로 일어나게 한다 — 모달이 사라지는
  // 순간엔 이미 최신 안내 문구가 그대로 채워져 있어 즉시 보인다.
  function setTopToastHiddenByPoi(hidden) {
    const toast = document.getElementById('gpsToast');
    if (!toast) return;
    toast.style.visibility = hidden ? 'hidden' : '';
  }

  function showPoiProximityModal(poi) {
    let modal = document.getElementById('poiProximityModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'poiProximityModal';
      // 상단 알림판(.gps-toast)과 같은 위치(top:68px, left/right:12px)에
      // 표시해 상단 알림판을 완전히 대신한다 — 하단 방향 화살표를 가리던
      // 문제를 없앤다.
      modal.style.cssText = 'position:absolute; top:68px; left:12px; right:12px; z-index:999; background:rgba(17,24,20,0.96); color:#fff; border-radius:16px; padding:10px 16px; box-shadow:0 4px 16px rgba(0,0,0,0.18); backdrop-filter:blur(8px); display:flex; align-items:flex-start; gap:10px;';
      document.body.appendChild(modal);
    }

    const destinations = [poi.signpost1, poi.signpost2, poi.signpost3, poi.signpost4]
      .map(s => (s || '').split(';')[0].trim())
      .filter(Boolean)
      .filter(d => d !== 'NA'); // 원본 데이터에 목적지가 비어 "NA"로만 채워진 항목은 제외
    const bodyText = destinations.length > 0 ? destinations.join(' · ') : '안내판';

    modal.innerHTML = `
      <div style="font-size:22px; line-height:1; margin-top:2px;">🪧</div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:11px; font-weight:700; color:#a5d6a7; margin-bottom:3px;">이정표 안내판</div>
        <div style="font-size:15px; font-weight:700; line-height:1.4; word-break:keep-all;">${bodyText}</div>
      </div>
      <button onclick="window.__dismissPoiProximityModal && window.__dismissPoiProximityModal()"
        style="background:rgba(255,255,255,0.12); border:none; color:#fff; width:26px; height:26px; border-radius:50%; font-size:14px; cursor:pointer; flex-shrink:0;">✕</button>
    `;
    modal.style.display = 'flex';
    setTopToastHiddenByPoi(true);
  }

  // GPS가 이 지점을 벗어나서(POI_PROXIMITY_EXIT_M 밖으로) 자동으로 닫히는
  // 경우. 완전히 벗어났다가 다시 들어오면(왕복 코스 등) 다시 떠야 하므로
  // 수동 닫기 기록(_poiModalManuallyDismissedKey)도 함께 초기화한다.
  function hidePoiProximityModalOnExit() {
    const modal = document.getElementById('poiProximityModal');
    if (modal) modal.style.display = 'none';
    _activeProximityPoi = null;
    _poiModalManuallyDismissedKey = null;
    setTopToastHiddenByPoi(false);
  }

  // ✕ 버튼으로 사용자가 직접 닫는 경우. 화면만 숨기고 _activeProximityPoi는
  // 일부러 그대로 둔다 — updatePoiProximity의 이탈 판정(아래 if문)이 계속
  // 그 지점과의 거리를 추적해야, 실제로 벗어나는 순간
  // hidePoiProximityModalOnExit()가 자동으로 불려 dismiss 기록도 함께
  // 풀린다. 여기서 _activeProximityPoi까지 지워버리면 "아직 반경 안에
  // 있다"는 사실 자체를 잃어버려, 벗어난 적이 없는데도 dismiss 기록이
  // 영영 안 풀리는 버그가 생긴다.
  function dismissPoiProximityModal() {
    const modal = document.getElementById('poiProximityModal');
    if (modal) modal.style.display = 'none';
    if (_activeProximityPoi) {
      _poiModalManuallyDismissedKey = _activeProximityPoi.id != null
        ? String(_activeProximityPoi.id) : (_activeProximityPoi.lat + ',' + _activeProximityPoi.lon);
    }
    setTopToastHiddenByPoi(false);
  }
  window.__dismissPoiProximityModal = dismissPoiProximityModal;

  // GPS 콜백(handleGpsPositionUpdate)과 시뮬레이션(renderSimFrame) 양쪽에서
  // 매 위치 갱신마다 호출한다. await 없이 fire-and-forget으로 불러도 안전
  // 하도록, 호출부에서는 결과를 기다리지 않는다.
  async function updatePoiProximity(lat, lon) {
    const signs = await fetchCoursePoiSignposts();
    if (!signs || signs.length === 0) return;

    // 이미 모달이 떠 있는 지점이 있으면 그 지점과의 거리부터 확인 —
    // 매번 전체를 다시 훑는 대신 "이탈했는지"만 먼저 본다.
    if (_activeProximityPoi) {
      const d = haversineMeters(lat, lon, _activeProximityPoi.lat, _activeProximityPoi.lon);
      if (d > POI_PROXIMITY_EXIT_M) {
        hidePoiProximityModalOnExit();
      } else {
        return; // 아직 그 지점 근처 — 다시 그릴 필요 없음(깜빡임 방지)
      }
    }

    // 새로 진입할 지점을 찾는다. 여러 지점이 동시에 10m 이내일 가능성은
    // 낮지만, 있다면 더 가까운 쪽을 우선한다.
    let nearest = null, nearestD = Infinity;
    for (const s of signs) {
      const d = haversineMeters(lat, lon, s.lat, s.lon);
      if (d <= POI_PROXIMITY_ENTER_M && d < nearestD) {
        nearest = s; nearestD = d;
      }
    }
    if (!nearest) return;

    const key = nearest.id != null ? String(nearest.id) : (nearest.lat + ',' + nearest.lon);
    if (key === _poiModalManuallyDismissedKey) return; // 사용자가 방금 ✕로 닫은 지점은 같은 진입 동안 재등장 안 함

    _activeProximityPoi = nearest;
    showPoiProximityModal(nearest);
  }

  // 거리 계산은 이 파일에 이미 있는 haversineMeters(아래 2044행 부근)를
  // 그대로 재사용한다 — 새로 선언하지 않음(중복 방지).

  function handleGpsPositionUpdate(pos) {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const accuracy = Math.round(pos.coords.accuracy);
        lastKnownPos = { lat, lon }; // 화면 표시·이탈판정용 — 지연 없는 원시 좌표를 그대로 사용

        // 이정표 근접 모달은 화면 회전/정지판정 파이프라인과 무관하게
        // "GPS가 실제로 그 좌표 10m 이내에 왔는지"만 보면 되므로, 아래
        // 필터링 전의 원시 좌표를 그대로 쓴다. await 없이 fire-and-forget
        // 으로 호출해 GPS 콜백 자체를 막지 않는다 — 실패해도 화면 회전 등
        // 나머지 안내 기능에는 영향이 없다.
        updatePoiProximity(lat, lon);

        // 📡 GpsFilterEngine에 원시 픽스를 넣으면, 표준 파이프라인이
        // (1)오차 필터 → (2)정지/이동 판정 → (3)좌표 스무딩+방위각
        // 히스테리시스를 전부 내부에서 처리한 결과를 반환한다.
        // 반환값이 null이면 이번 픽스는 신뢰할 수 없어(오차 초과 또는
        // 너무 빠른 중복 수신) 버려진 것이므로 이번 갱신은 건너뛴다.
        const result = gpsFilterEngine.process({
          latitude: lat,
          longitude: lon,
          accuracy: accuracy,
          speed: pos.coords.speed,
          heading: pos.coords.heading,
          timestamp: Date.now()
        });

        // 🐛 2026-09-25 수정(사용자 재현: "아파트 단지에서 내 위치는
        // 움직이는데 지도 회전/이동거리가 0.00km에 계속 고정됨") — 예전엔
        // result가 null이면(accuracy가 MAX_ACCURACY=15m 초과, 또는 너무
        // 빠른 중복 수신) 이 아래 트랙 매칭(nearestPointOnTrail)·지도
        // 회전·이동거리 계산 전체를 통째로 return해 건너뛰었다. 건물
        // 밀집 지역은 GPS 오차가 15m를 자주 넘어(실측 재현: 도심
        // 아파트단지) 이 조기 return이 사실상 상시 발동해, 화면 마커
        // (lastKnownPos, 필터 결과와 무관하게 항상 갱신됨)만 움직이고
        // 트랙 매칭 이하 전부가 영구히 멈춰 보였다. GpsFilterEngine은
        // "정지/이동 판정"과 "방위각 스무딩"(다른 로직, 예: 절전 타이머,
        // isReversingOnTrail 왕복 판정 등)에만 쓰는 보조 신호로 좁히고,
        // 트랙 매칭·지도 회전·이동거리는 항상 원시 좌표(lat, lon)로
        // 계속 진행한다 — 정확도가 나쁠수록 위치가 다소 흔들릴 수는
        // 있지만, "전혀 안 움직이는 것"보다는 낫다(사용자 확정).
        if (result) {
          const wasStoppedBefore = isCurrentlyStopped;
          isCurrentlyStopped = result.isStopped;

          // 🔋 정지 진입/해제 시각 추적 — 절전 모드 진입 타이머(handleSleepTimerTick)
          // 가 이 시각 기준으로 5분 경과를 판정한다.
          if (isCurrentlyStopped && !wasStoppedBefore) {
            stopEnteredAt = Date.now();
          } else if (!isCurrentlyStopped) {
            stopEnteredAt = null;
          }
        }

        // 줌 자동 전환(정지/이동 상태에 따른 확대/축소)은 제거했다 —
        // 정지 판정이 갈림길 근처에서 불안정하게 흔들리면 줌도 같이
        // 흔들려 오히려 혼란을 줬다. 화면의 확대/축소 버튼으로 사용자가
        // 직접 조절한다. 나중에 별도로 다시 설계할 수 있다.

        // 🧭 대원칙 재정렬: 왕복 겹침 구간 판별은 이제 findNearestInRange
        // 내부에서 isReversingOnTrail(GPX 인덱스 이력)과 currentSegmentBearings
        // (GPX 점 순서)만으로 이뤄지므로, 여기서 GPS 이동방위각(result.bearing)을
        // 별도로 넘겨줄 필요가 없어졌다.

        // 등산로(선분)까지의 최단거리 탐색 — 점까지의 거리가 아니라
        // 점들을 이은 산길 자체까지의 거리를 재야 GPX 점 간격이 넓은
        // 구간에서 산길 위에 서 있는데도 이탈로 오판되지 않는다.
        const nearest = nearestPointOnTrail(lat, lon, currentPoints);
        const minDistanceM = nearest.distance;
        const nearestPoint = nearest.point;
        const nearestIdx = nearest.index;

        // 🧭 WAYFINDING_MODE 진행 갱신(2026-09-23) — 활성 중이면 목적지
        // 거리/도착 판정/녹색선을 여기서 전담한다. 이탈 판정
        // (updateOffTrailHysteresis)이나 갈림길 자동 안내
        // (updateNavigationToast, 아래에서 호출됨)와 동시에 화면에 뜨면
        // 서로 다른 안내가 겹쳐 혼란스러우므로, WAYFINDING 활성 중에는
        // 그 둘을 건드리지 않고 이 함수만 진행시킨다.
        if (isWayfindActive) {
          updateWayfindingProgress(lat, lon, nearestIdx);
        }

        // 코스 시작(들머리) 근처인지 — 첫 원점이 아직 한 번도 안 잡힌
        // 상태(currentRotationOriginDist===null, v75의 "방향 일치 전
        // 보류"와 같은 개념)이고 누적거리도 짧으면, 아직 GPS 이동방향이
        // 안정되지 않은 구간으로 보고 이탈 판정 기준을 완화한다.
        const traveledDistForEntry = cumulativeDistances[nearestIdx] || 0;
        const isNearTrailhead = isSegmentRotationMode && currentRotationOriginDist === null && traveledDistForEntry < TRAILHEAD_ENTRY_DISTANCE_M;
        updateOffTrailHysteresis(minDistanceM, accuracy, isNearTrailhead);

        // ⭐ 전면 재설계(2026-09-14): GPX가 경로 전체를 이미 알고 있으므로
        // "내가 지금 어느 방향을 보는가"는 더 이상 필요 없다. 정지/이동
        // 여부와 무관하게 GPS 이동방향(result.bearing)이 나올 때만 내 위치
        // 마커 화살표를 갱신하고, 갈림길 안내(다음 갈림길까지 거리 +
        // 미리 계산된 회전각)는 updateNavigationToast가 전담한다.
        if (result && !result.isStopped && result.bearing !== null) {
          gpsMovementHeading = result.bearing;
        }

        // 🧭 화살표 방향 + 지도 전체 회전 — 2026-09-25 재설계(사용자
        // 지시: "이 알림과 내가 가는 방향의 지도가 일치하게 하면 돼...
        // 위치 화살표도 항상 내 앞으로 나와야 해"). 대원칙: GPX index를
        // 이미 알고 있으므로 "내가 지금 어디서 어디로 가는지"는 매 픽스
        // 즉시 확정된다(moveDirectionSign) — 방향점 도착까지 기다리거나
        // (구간회전), 재확인 스트릭을 쌓거나(재획득 게이트) 할 이유가
        // 없다. 화살표와 지도 회전은 항상 computeArrowHeading의 같은
        // 반환값 하나를 공유한다(대원칙: 지도와 화살표는 동일한 방향
        // 데이터를 쓴다). nearestPoint를 함께 넘겨 들머리가 아닌 코스
        // 중간 지점에서 시작해도 정확한 지점을 가리키게 한다.
        //
        // ⚠️ 예전(2026-09-24)엔 "매 픽스 즉시 회전"이 국지적으로 굽는
        // 구간(지그재그, 스위치백)마다 지도를 계속 흔든다는 문제가
        // 있어 구간회전(방향점 도착 시에만)으로 되돌렸었다. 그런데
        // 그 대안이 "원점 확정까지 3픽스 대기 + GPS 재획득 게이트"를
        // 낳아 오히려 "언제 회전하는지 예측 불가능"이라는 더 큰 문제를
        // 만들었다(사용자 재현: "들머리 지나서 다음 지점으로 가는데
        // 지도가 회전이 안 되고 그냥 옆으로 가는 거군"). 이번엔 떨림
        // 자체를 최소 이동거리 안전장치로만 억제한다 — applySegmentRotation
        // 은 직전 회전 판정 이후 실제로 ROTATION_MIN_MOVE_M 이상
        // 이동했을 때만 새로 호출되고, 그보다 짧으면(제자리 서성임,
        // GPS 노이즈) 직전 회전값을 그대로 유지한다.
        // 🗺️ 가자맵 대원칙 재설계 2단계(2026-09-25) — 위 computeArrowHeading/
        // applyLiveMapRotation(GPX index 증감 기반, 5m마다 사실상 즉시
        // 회전)을 새 구조(computeArrowHeadingV2/updateGajaMap, 지명
        // 구간 + 100m 갱신 게이트)로 교체한다. 구간이 아직 확정 안 됐으면
        // (코스 진입 전) 위에서 이미 계산한 nearestIdx로 첫 구간을
        // 역산한다 — 매 픽스 재역산하지 않도록 getCurrentSection()이
        // null일 때만 수행.
        if (!getCurrentSection()) {
          resolveInitialSection(nearestIdx);
        }
        const gajaMapResult = updateGajaMap(lat, lon);
        const routeDistanceForArrow = gajaMapResult && gajaMapResult.proj ? gajaMapResult.proj.routeDistance : traveledDistForEntry;
        const arrowHeading = computeArrowHeadingV2(lat, lon, routeDistanceForArrow);
        if (arrowHeading !== null) {
          renderGpsArrow(arrowHeading);
          lastArrowHeadingForGuidance = arrowHeading; // GPS 마커 아이콘 회전도 이 값을 씀(getCurrentAbsHeadingForGuidance)
        }

        // ⚠️ updateNavigationToast를 마커 생성/지도뷰 갱신보다 먼저
        // 호출해야 한다 — 구간이 바뀌는 프레임에 이 함수 내부에서
        // applySegmentRotation이 mapRotationDeg를 새 구간 방향으로
        // 갱신하는데, 순서가 반대이면 화살표 보정 등이 옛 값(한 프레임
        // 지연)을 참조하게 된다.
        updateNavigationToast(accuracy, minDistanceM, nearestIdx, nearestPoint, arrowHeading);

        // 마커 생성 또는 이동
        if (!userGpsMarker) {
          const gpsIcon = L.divIcon({
            className: 'custom-gps-icon',
            html: createGpsIconHtml(getCurrentAbsHeadingForGuidance()),
            iconSize: [80, 80],
            iconAnchor: [40, 40]
          });
          userGpsMarker = L.marker([lat, lon], { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);
          {
            const z = getPreferredGpsZoom();
            applyMapViewWithOffset(lat, lon, z, { animate: true });
          }
          // 내 위치를 켜는 순간부터 GPS 켜짐 모드(자동 센터링)와 방향 화살표를 함께 시작한다.
          if (!isHeadingUp) {
            setHeadingUpMode(true, true);
          }
          // 📡 첫 GPS 픽스를 받아 내 위치가 확정됐으므로 수신 대기
          // 오버레이를 자동으로 숨긴다(#1).
          const waitingOverlayDone = document.getElementById('gpsWaitingOverlay');
          if (waitingOverlayDone) waitingOverlayDone.style.display = 'none';
        } else {
          userGpsMarker.setLatLng([lat, lon]);
          if (isFirstFix) {
            const z = getPreferredGpsZoom();
            applyMapViewWithOffset(lat, lon, z, { animate: true });
          } else if (isHeadingUp && !isMapBeingDragged && !isMapDragReturnPending) {
            // 구간회전 모드에서는 지도 중심이 항상 현재 구간 시작점에
            // 고정된다(applyMapViewWithOffset 내부에서 처리). 단, 사용자가
            // 손가락으로 드래그해 다른 구간을 둘러보는 중이거나
            // (isMapBeingDragged) 손을 뗀 뒤 자동 복귀 유예 시간 중에는
            // (isMapDragReturnPending) GPS 픽스(약 1초 간격)가 화면을 곧바로
            // 원위치로 튕겨버리는 것을 막는다 — 유예 시간이 지나면
            // dragend 핸들러의 타이머가 알아서 복귀시킨다.
            const z = map.getZoom();
            applyMapViewWithOffset(lat, lon, z, { animate: false });
          }
        }
        isFirstFix = false;

        // 갈 방향 안내 (등산로 복귀 가이드 점선) — WAYFINDING_MODE가
        // 활성 중이면 guideLine은 updateWayfindingProgress가 전담하므로
        // 여기서는 건드리지 않는다(서로 다른 목적지를 그리는 충돌 방지).
        if (isWayfindActive) {
          // no-op — updateWayfindingProgress가 이미 위에서 처리함
        } else if (nearestPoint && minDistanceM > 12) {
          const guideCoords = [[lat, lon], [nearestPoint.lat, nearestPoint.lon]];
          if (!guideLine) {
            guideLine = L.polyline(guideCoords, {
              color: '#00e676',
              weight: 3.5,
              dashArray: '6, 8',
              opacity: 0.95
            }).addTo(map);
          } else {
            guideLine.setLatLngs(guideCoords);
          }
        } else if (guideLine) {
          map.removeLayer(guideLine);
          guideLine = null;
        }
  }

  function handleGpsError() {
    const toast = document.getElementById('gpsToast');
    const btn = document.getElementById('gpsBtn');
    toast.className = 'gps-toast warning';
    toast.innerText = '⚠️ GPS 수신 실패 (위치 권한 확인)';
    btn.innerText = '📍';
    btn.classList.remove('active');
    watchId = null;
    showHeadingArrow = false;
    releaseWakeLock();
    stopCompass();
    if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
    stopSleepMonitor();
    // 📡 수신 실패로 첫 픽스를 영영 못 받으면 대기 오버레이가 화면에
    // 계속 남아 지도를 가리게 되므로 여기서도 숨긴다(#1).
    const waitingOverlayErr = document.getElementById('gpsWaitingOverlay');
    if (waitingOverlayErr) waitingOverlayErr.style.display = 'none';
  }

  // ════════════════════════════════════════════════════════════════
  // 🔋 배터리 절전 모드
  //
  // 5분 이상 정지 상태가 지속되면(휴식, 식사, 사진 촬영 등) GPS 수신을
  // 잠시 멈춘다. 지도/마커/토스트/웨이크락 등 화면 상태는 그대로 두고
  // navigator.geolocation.watchId만 정리한다 — 사용자가 직접 끄는
  // stopGpsTracking()과 달리 UI 초기화는 하지 않는다.
  //
  // "다시 움직이기 시작했다"는 하이브리드 방식으로 감지한다:
  //  (1) 가속도 센서(devicemotion)의 walkVibrationLevel이 문턱을 넘으면
  //      즉시 GPS 재시작 — 주 경로, 반응이 빠르다.
  //  (2) 센서 권한이 없거나 devicemotion이 멈춘 기기를 위한 안전망으로,
  //      절전 중 SLEEP_WATCHDOG_MS(2분)마다 무조건 한 번씩 GPS를 잠깐
  //      켜서 실제 위치가 바뀌었는지 확인한다. 안 바뀌었으면 다시 절전.
  // ════════════════════════════════════════════════════════════════

  let sleepTickTimerId = null;

  function startSleepMonitor() {
    if (sleepTickTimerId) clearInterval(sleepTickTimerId);
    sleepTickTimerId = setInterval(handleSleepTimerTick, 10000); // 10초마다 정지 지속시간 체크
  }

  function stopSleepMonitor() {
    if (sleepTickTimerId) { clearInterval(sleepTickTimerId); sleepTickTimerId = null; }
    if (sleepWatchdogTimerId) { clearInterval(sleepWatchdogTimerId); sleepWatchdogTimerId = null; }
    isGpsSleeping = false;
    sleepCheckPos = null;
    sleepCheckStartedAt = null;
  }

  function handleSleepTimerTick() {
    // 🔌 네이티브 앱은 Foreground Service가 화면 꺼짐과 무관하게 항상
    // 정상 GPS를 공급해야 하는 게 이번 작업의 목적이므로, 정지 시
    // watchPosition을 멈추는 이 절전 로직(웹표준 GPS 전용 최적화)은
    // 건너뛴다 — clearWatch(watchId)가 'native' 문자열에는 실효가
    // 없어 절전 진입은 이름뿐이고, 재개 시 restartWatchPositionOnly가
    // 엉뚱하게 웹표준 GPS를 새로 켜려 시도하는 사고를 막는다.
    if (isNativeApp()) return;
    if (isGpsSleeping || watchId === null) return; // 이미 절전 중이거나 GPS 자체가 꺼져 있으면 할 일 없음
    if (!isCurrentlyStopped || stopEnteredAt === null) return;
    if (Date.now() - stopEnteredAt >= SLEEP_AFTER_STOPPED_MS) {
      enterGpsSleep();
    }
  }

  function enterGpsSleep() {
    if (isGpsSleeping || watchId === null) return;
    isGpsSleeping = true;
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    showToastBadge('🔋 5분간 움직임이 없어 절전 모드로 전환합니다.\n다시 걸으면 자동으로 위치 추적이 재개됩니다.');

    // watchdog: 진동이 감지되지 않아도 2분마다 한 번씩 스스로 깨어나
    // 실제로 이동했는지 확인한다.
    if (sleepWatchdogTimerId) clearInterval(sleepWatchdogTimerId);
    sleepWatchdogTimerId = setInterval(runSleepWatchdogCheck, SLEEP_WATCHDOG_MS);
  }

  // 진동 감지(devicemotion)로 걷기 시작을 알아챘을 때 호출 — window의
  // devicemotion 리스너(walkVibrationLevel 갱신부)에서 함께 호출한다.
  function wakeGpsFromVibration() {
    if (!isGpsSleeping) return;
    exitGpsSleep('진동 감지');
  }

  // watchdog 주기마다 GPS를 짧게 켜서(약 8초) 실제로 위치가 바뀌었는지
  // 확인한다. 첫 픽스와 비교해 MIN_DISTANCE 이상 벌어지면 "진짜 이동"
  // 으로 보고 절전을 해제하고, 아니면 다시 절전 상태로 돌아간다.
  const SLEEP_WATCHDOG_CHECK_MS = 8000;
  const SLEEP_WATCHDOG_MOVE_THRESHOLD_M = 8;

  function runSleepWatchdogCheck() {
    if (!isGpsSleeping) return; // 이미 진동 감지로 깨어난 경우 등
    sleepCheckPos = null;
    sleepCheckStartedAt = Date.now();

    const checkWatchId = navigator.geolocation.watchPosition(
      pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (!sleepCheckPos) {
          sleepCheckPos = { lat, lon };
          return;
        }
        const movedM = haversineMeters(sleepCheckPos.lat, sleepCheckPos.lon, lat, lon);
        if (movedM >= SLEEP_WATCHDOG_MOVE_THRESHOLD_M) {
          navigator.geolocation.clearWatch(checkWatchId);
          exitGpsSleep('watchdog 이동 확인');
        }
      },
      () => { /* watchdog 확인용 픽스 실패는 조용히 무시 — 다음 주기에 재시도 */ },
      { enableHighAccuracy: true, maximumAge: 0, timeout: SLEEP_WATCHDOG_CHECK_MS }
    );

    // 확인 시간(SLEEP_WATCHDOG_CHECK_MS)이 지나도 못 깨어났으면(정지
    // 유지) 짧게 켰던 GPS를 다시 정리하고 절전 상태를 유지한다.
    setTimeout(() => {
      if (isGpsSleeping) {
        navigator.geolocation.clearWatch(checkWatchId);
      }
    }, SLEEP_WATCHDOG_CHECK_MS + 500);
  }

  // 절전 모드에서 깨어날 때 GPS만 다시 켠다 — startGpsTracking()처럼
  // 마커/토스트/웨이크락/디버그로거까지 전부 새로 초기화하지 않는다
  // (화면은 절전 중에도 그대로 떠 있었으므로 다시 만들 필요가 없다).
  function restartWatchPositionOnly() {
    isFirstFix = false; // 이미 추적 중이던 마커가 있으므로 "최초 진입" 카메라 점프는 하지 않는다
    watchId = navigator.geolocation.watchPosition(
      handleGpsPositionUpdate,
      handleGpsError,
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );
  }

  function exitGpsSleep(reason) {
    if (!isGpsSleeping) return;
    isGpsSleeping = false;
    if (sleepWatchdogTimerId) { clearInterval(sleepWatchdogTimerId); sleepWatchdogTimerId = null; }
    sleepCheckPos = null;
    sleepCheckStartedAt = null;
    stopEnteredAt = null; // 다시 정지 상태가 되더라도 5분을 새로 카운트

    if (watchId === null) {
      // startGpsTracking을 그대로 재사용하면 UI 전체가 "새로 켜는"
      // 상태로 리셋돼버리므로(웨이크락 재요청 등은 무해하지만 마커가
      // 다시 생성되며 잠깐 깜빡일 수 있다), 대신 watchPosition만 다시
      // 건다. startGpsTracking 내부의 콜백 로직을 그대로 재사용하기
      // 위해 restartWatchPositionOnly()를 호출한다.
      restartWatchPositionOnly();
    }
    showToastBadge(`📍 위치 추적을 재개합니다. (${reason})`);
  }

  // 느린 프록시에서 무한정 기다리지 않도록 각 시도마다 제한시간을 둔다.
  // 스마트폰 이동통신망에서는 corsproxy.io 응답이 수십 초씩 걸리는 경우가
  // 실제로 있었는데, 타임아웃이 없으면 다음 단계(더 빠를 수 있는 경로)로
  // 못 넘어가고 그 프록시 하나만 계속 기다리게 된다.
  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  // 외부 서버(네이버 등) 및 깃허브 tracks에서 안전하게 GPX를 가져오는 고성능 로더
  async function fetchGPXFile(targetUrl) {
    let cleanUrl = targetUrl.trim();
    // %25EA 등 이중 인코딩된 URL을 완전 해독 후 올바른 1회 인코딩 적용
    for (let i = 0; i < 3; i++) {
      try {
        const next = decodeURIComponent(cleanUrl);
        if (next === cleanUrl) break;
        cleanUrl = next;
      } catch(e) { break; }
    }
    try {
      cleanUrl = encodeURI(cleanUrl);
    } catch(e) {}

    const errors = [];

    // 1. 직접 다운로드 시도 (GitHub Pages, Raw, CORS 허용 서버 등)
    try {
      const res = await fetchWithTimeout(cleanUrl, 5000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`1) 직접 다운로드: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`1) 직접 다운로드 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`1) 직접 다운로드 실패: ${e.message || '네트워크/CORS 제한'}`);
    }

    // 2. 🌟 핵심 복구 기능: 네이버 블로그 링크가 만료(403)되었을 때
    // URL 속 파일명(예: 남덕유산_20250501.gpx)을 추출하여 우리 tracks 저장소에서 즉시 대체 로드!
    try {
      const match = cleanUrl.match(/([^\/\?#&=:"']+\.gpx)/i);
      if (match && match[1]) {
        let fname = match[1];
        try { fname = decodeURIComponent(fname); } catch(e) {}
        const fallbacks = [
          `./tracks/${encodeURIComponent(fname)}`,
          `https://hjwpro1971.github.io/gaja/tracks/${encodeURIComponent(fname)}`,
          `https://raw.githubusercontent.com/hjwpro1971/gaja/main/tracks/${encodeURIComponent(fname)}`
        ];
        for (const fb of fallbacks) {
          try {
            const res = await fetchWithTimeout(fb, 5000);
            if (res.ok) {
              const text = await res.text();
              if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
                console.log('대체 트랙 저장소에서 복구 성공:', fb);
                return text;
              }
            }
          } catch(e) {}
        }
        errors.push(`2) 저장소 대체 복구: '${fname}' 파일 없음`);
      } else {
        errors.push(`2) 저장소 대체 복구: 파일명 추출 불가`);
      }
    } catch(e) {
      errors.push(`2) 저장소 대체 복구 실패: ${e.message}`);
    }

    // 3. allorigins 공개 프록시 시도
    try {
      const res = await fetchWithTimeout('https://api.allorigins.win/raw?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`3) 공개 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`3) 공개 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`3) 공개 프록시 실패: ${e.message || '타임아웃'}`);
    }

    // 4. 나스 서버 로컬 프록시 시도
    try {
      const res = await fetchWithTimeout('/api/gpx-proxy?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`4) 로컬 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`4) 로컬 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`4) 로컬 프록시 실패: ${e.message || '연결 불가'}`);
    }

    throw new Error('모든 방식으로 등산로 파일을 불러오지 못했습니다.\n[상세 사유]\n' + errors.join('\n'));
  }

  // 📌 하단 구석 버전 뱃지 채우기 — window.__GAJA_CACHE_NAME(헤드 인라인
  // 스크립트가 이미 세팅)에서 "vNNN" 부분만 뽑아 짧게 표시한다. 클릭하면
  // 전체 캐시 이름과 빌드 문자열을 토스트로 보여줘, 사용자가 "이게 최신
  // 버전이 맞는지" 스크린샷으로 쉽게 공유할 수 있게 한다.
  function showVersionDetail() {
    const full = window.__GAJA_CACHE_NAME || '알 수 없음';
    if (typeof showToastBadge === 'function') {
      showToastBadge(`🔖 현재 버전: ${full}`);
    } else {
      alert('현재 버전: ' + full);
    }
  }
  window.showVersionDetail = showVersionDetail;

  window.addEventListener('DOMContentLoaded', async () => {
    initMap();

    // 📌 버전 뱃지 텍스트 채우기 — 'gaja-trail-cache-v117' -> 'v117'
    const versionBadgeEl = document.getElementById('appVersionBadge');
    if (versionBadgeEl) {
      const full = window.__GAJA_CACHE_NAME || '';
      const m = full.match(/v\d+$/);
      versionBadgeEl.innerText = m ? m[0] : full;
    }


    const urlParams = new URLSearchParams(window.location.search);
    const hadGpxUrl = !!(urlParams.get('url') || urlParams.get('file'));
    let gpxUrl = urlParams.get('url') || urlParams.get('file');
    const courseName = urlParams.get('name');
    let decodedCourseName = courseName ? decodeURIComponent(courseName) : '';

    // 🔁 URL에 코스 쿼리가 없으면(=홈 화면 아이콘이 쿼리 없는 URL로
    // 고정되어 있는 경우 등) "마지막으로 연 코스"를 자동으로 이어서
    // 연다 — saveLastOpenedCourse 정의부 주석 참고. 이 값으로 gpxUrl을
    // 채워두면 바로 아래 "if (gpxUrl) { ... }" 정상 로드 경로가 그대로
    // 재사용된다(별도 분기를 새로 만들지 않음).
    if (!hadGpxUrl) {
      const lastCourse = loadLastOpenedCourse();
      if (lastCourse && lastCourse.sourceUrl) {
        gpxUrl = lastCourse.sourceUrl;
        decodedCourseName = lastCourse.name || '';
      }
    }

    if (!decodedCourseName && gpxUrl) {
      const m = decodeURIComponent(gpxUrl).match(/([^\/\?#&=:"']+\.gpx)/i);
      if (m && m[1]) {
        decodedCourseName = m[1].replace(/\.gpx$/i, '').replace(/_\d{8}$/, '').replace(/_{2,}/g, ' ').replace(/_/g, ' ').trim();
      }
    }
    if (!decodedCourseName) decodedCourseName = '등산로 코스';

    // 페이지 진입 즉시 상단 헤더 및 창 타이틀에 산 이름 반영
    const trailEl = document.getElementById('trailName');
    if (trailEl) trailEl.innerText = '🚩 ' + decodedCourseName;
    let pageTitle = decodedCourseName;
    if (!pageTitle.includes('등산지도') && !pageTitle.includes('등산로') && !pageTitle.includes('지도')) {
      pageTitle += ' 등산지도';
    }
    document.title = pageTitle;
    const appleMeta = document.getElementById('appleAppTitle');
    if (appleMeta) appleMeta.content = pageTitle;

    // 같은 코스를 다시 열 때 매번 외부 프록시를 거쳐 GPX를 재다운로드하지
    // 않도록, url 파라미터가 있으면 먼저 localStorage에 같은 원본 GPX
    // 주소(sourceUrl)로 저장된 좌표가 있는지 찾아본다. 코스명이 아니라
    // 반드시 원본 주소로 비교해야 한다 — "남덕유산_20250501.gpx"와
    // "남덕유산_20251217.gpx"처럼 코스명은 같아도 실제로는 전혀 다른 GPX인
    // 경우가 있어, 이름만 보고 캐시를 재사용하면 엉뚱한 지도가 뜨는 버그가
    // 있었다.
    // 🌟 핵심: 다운받기 전에 캐시에 이미 저장되어 있는지 먼저 체크!
    // 동일한 GPX 파일명 또는 코스명이 이미 있으면 외부 다운로드를 하지 않고 캐시에서 즉시 복원 (0.001초 로딩 & 중복 방지)
    if (gpxUrl) {
      const loadingEl = document.createElement('div');
      loadingEl.id = 'gpxLoadingBadge';
      loadingEl.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.25); backdrop-filter:blur(4px); pointer-events:none;';
      loadingEl.innerText = '🔄 등산 코스 불러오는 중...';
      document.body.appendChild(loadingEl);

      try {
        // 항상 원격 최신본 다운로드를 시도하여 에디터 수정사항이 즉시 반영되도록 함.
        const xml = await fetchGPXFile(gpxUrl);
        const points = parseGPX(xml);
        drawRoute(points, decodedCourseName, gpxUrl);
      } catch(err) {
        console.warn('원격 GPX 다운로드 실패. 오프라인 캐시 폴백 시도:', err);
        // 인터넷이 끊긴 산속이거나 서버 오류 시 로컬 캐시에서 꺼내어 그려준다 (완벽한 오프라인 지원).
        const cached = findSavedRoute(decodedCourseName, gpxUrl);
        if (cached) {
          console.log('오프라인 캐시에서 등산로 복원 완료:', cached.name);
          if (cached.waypoints) cached.points.waypoints = cached.waypoints;
          drawRoute(cached.points, cached.name, cached.sourceUrl || gpxUrl, true);
          
          const fastBadge = document.createElement('div');
          fastBadge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:99999; background:rgba(27,94,32,0.95); color:#ffffff; font-size:13px; font-weight:800; padding:10px 20px; border-radius:24px; box-shadow:0 4px 16px rgba(0,0,0,0.3); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.5s;';
          fastBadge.innerHTML = '⚡ 오프라인 저장된 코스를 열었습니다';
          document.body.appendChild(fastBadge);
          setTimeout(() => {
            fastBadge.style.opacity = '0';
            setTimeout(() => fastBadge.remove(), 500);
          }, 1800);
        } else {
          alert('등산로를 불러오지 못했습니다.\n\n인터넷 연결을 확인하고 다시 시도해 주세요.\n(또는 내 코스 목록에서 열어보세요)');
          showSavedRouteList('저장된 GPX 목록을 불러왔습니다.');
        }
      } finally {
        const badge = document.getElementById('gpxLoadingBadge');
        if (badge) badge.remove();
      }
      // ⚠️ 여기서 GPS를 다시 켜려 하지 않는다 — drawRoute()가 코스를
      // 그릴 때 이미 "watchId===null이면 startGpsTracking()"으로 GPS를
      // 자동 시작한다(3172행 부근, "opt-in을 뒤집었다" 주석 참고).
      // 한때 이 자리에 loadGpsWasOnState() 체크로 GPS를 한 번 더 켜는
      // 코드가 있었는데, drawRoute의 자동시작과 중복되어
      // watchPosition이 두 번 걸리는 버그였다(실측: watchId가 1이 아닌
      // 2로 나옴) — 제거함.
    } else if (!hadGpxUrl) {
      showSavedRouteList();
    }


  });
</script>
