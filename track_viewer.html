  // 점(사용자 위치)에서 등산로 선분(GPX의 연속된 두 점을 잇는 선)까지의
  // 최단거리를 미터로 계산한다. GPX는 점(waypoint)들의 나열이라, 점까지의
  // 거리만 재면 점 간격이 넓은 구간(30~40m씩 떨어진 경우가 실제로 있다)에서는
  // 산길 정중앙에 서 있어도 "가장 가까운 점"까지 30m 넘게 떨어진 것으로
  // 잘못 계산되어 실제로는 이탈이 아닌데 이탈로 오판했다. 점이 아니라
  // 산길 자체(선분)까지의 거리를 재야 이 문제가 없다.
  //
  // 등산로 규모(길어야 수 km)에서는 위경도를 평면으로 근사해도 오차가
  // 무시할 만큼 작으므로, 매 GPS 갱신마다 무거운 구면삼각법을 반복하는 대신
  // 등장방형 투영(위도 1도=111320m, 경도는 위도의 cos만큼 보정)으로
  // 로컬 평면 좌표를 만들어 계산한다.
  function pointToSegmentMeters(plat, plon, alat, alon, blat, blon) {
    const latRef = plat * Math.PI / 180;
    const mPerDegLat = 111320;
    const mPerDegLon = 111320 * Math.cos(latRef);

    const px = (plon - alon) * mPerDegLon;
    const py = (plat - alat) * mPerDegLat;
    const bx = (blon - alon) * mPerDegLon;
    const by = (blat - alat) * mPerDegLat;

    const segLenSq = bx * bx + by * by;
    let t = segLenSq > 0 ? (px * bx + py * by) / segLenSq : 0;
    t = Math.max(0, Math.min(1, t));

    const closestX = bx * t;
    const closestY = by * t;
    const dx = px - closestX;
    const dy = py - closestY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // 🧭 "다음 index로만 전진" 트랙 매칭(2026-09-25, 사용자 지시)의
  // trackFromLockedIndex()가 "이 점이 세그먼트의 몇 %(t) 지점에
  // 투영되는가"를 함께 필요로 해서, pointToSegmentMeters와 동일한 계산을
  // 중복하지 않고 { distance, t }를 함께 반환하는 버전을 별도로 둔다.
  // 기존 pointToSegmentMeters(숫자 하나만 반환)의 호출부는 전혀 건드리지
  // 않는다 — findNearestInRange(SEARCHING 전용, 수정 없음)가 그대로 쓴다.
  function pointToSegmentMetersWithT(plat, plon, alat, alon, blat, blon) {
    const latRef = plat * Math.PI / 180;
    const mPerDegLat = 111320;
    const mPerDegLon = 111320 * Math.cos(latRef);

    const px = (plon - alon) * mPerDegLon;
    const py = (plat - alat) * mPerDegLat;
    const bx = (blon - alon) * mPerDegLon;
    const by = (blat - alat) * mPerDegLat;

    const segLenSq = bx * bx + by * by;
    let t = segLenSq > 0 ? (px * bx + py * by) / segLenSq : 0;
    t = Math.max(0, Math.min(1, t));

    const closestX = bx * t;
    const closestY = by * t;
    const dx = px - closestX;
    const dy = py - closestY;
    return { distance: Math.sqrt(dx * dx + dy * dy), t, segLenM: Math.sqrt(segLenSq) };
  }

  // 왕복(원점회귀) 코스에서는 같은 좌표 부근에 "갈 때"와 "올 때" 두 개의
  // 선분이 겹쳐 있어, 매번 전역 탐색을 하면 엉뚱하게 반대쪽(이미 지나온
  // 반대 방향 구간)이 최근접점으로 잡힐 수 있다. 직전에 찾은 인덱스
  // 근처만 우선 탐색하면 이 문제가 없고, 계산량도 크게 줄어든다.
  let lastNearestIdx = -1; // 슬라이딩 윈도우의 중심 — GPS 갱신마다 갱신됨
  const TRAIL_WINDOW_RADIUS = 60; // 직전 인덱스 앞뒤 60개 포인트 범위만 우선 탐색(SEARCHING 모드 전용)
  const TRAIL_FALLBACK_THRESHOLD_M = 50; // 윈도우 내 최단거리가 이보다 크면 전역 재탐색(SEARCHING 모드 전용)

  // ════════════════════════════════════════════════════════════════
  // 🧭 "다음 index로만 전진" 트랙 매칭 재설계(2026-09-25, 사용자 지시:
  // "누적거리 때문에 문제가 되는게 아니야? 그냥 좌표값을 기준으로 하면
  // 안 돼? 들머리 0 다음 좌표1 다음좌표2,... 이런식으로 하면 돼잖아" →
  // "다음 index로만 전진 규칙을 강하게 건다") — 근본 원인: GPX 점 간격
  // (실측 중앙값 7m, 평균 15m)이 실제 GPS 오차(15~30m, 건물/숲/계곡은
  // 더 큼)보다 작거나 비슷해서, "지금 좌표에서 가장 가까운 선분"을 매
  // 픽스 앞뒤 TRAIL_WINDOW_RADIUS(60개 점) 범위에서 다시 찾는 기존
  // 방식은 오차가 조금만 섞여도 엉뚱한(특히 왕복 코스의 반대편) 지점을
  // 고를 수 있다. 사용자가 (당시) GPS 오차 주입 디버그 시뮬레이션(±25m,
  // 이후 제거됨 — 시뮬레이션/실제 GPS 완전 분리 참고)으로 직접 재현해
  // "가장 가까운 점까지 510m" 같은 명백한 오매칭을 확인했다.
  //
  // 해법: 정상 추적 중(LOCKED)에는 다음 픽스의 후보를 "지금 있는 index
  // N"과 "바로 다음 점 N+1"뿐으로 강하게 제한한다 — 왕복 코스의 반대편
  // 세그먼트는 index 자체가 전혀 다르므로 애초에 후보에 들지 못해
  // 오매칭이 구조적으로 사라진다. 코스 진입 전이나 GPS가 크게 튀어
  // N/N+1 둘 다에서 멀어진 예외 상황(SEARCHING)에서만 기존 윈도우→전역
  // 탐색(방향 페널티 포함, findNearestInRange)을 그대로 재사용한다 —
  // 그 로직은 삭제하지 않고 "예외 경로"로 격하시킨 것뿐이다.
  let trailTrackingMode = 'SEARCHING'; // 'SEARCHING'(재탐색) | 'LOCKED'(N/N+1만 추적)
  let offCandidateStreak = 0; // LOCKED 상태에서 N/N+1 둘 다 비정상적으로 멀었던 연속 픽스 수
  const LOCK_REACQUIRE_DIST_M = TRAIL_FALLBACK_THRESHOLD_M; // 이 거리(m) 넘으면 재탐색 후보로 — 기존 50m 폴백값 재사용(이미 실측 튜닝된 값)
  const LOCK_REACQUIRE_STREAK = 3; // 1회성 GPS 튐에 반응하지 않기 위한 연속 확인 횟수(약 3초, TRACK_DIRECTION_CONFIRM_STREAK와 동일 철학)
  // N → N+1로 "확정 전진"했다고 인정하는 두 조건.
  //
  // 🐛 2026-09-25 수정(사용자 재현: "들머리 잡았는데 이동해도 이동거리가
  // 그대로 0이야" — 실제 GPX(test_수목원.gpx) 첫 세그먼트가 89m로 김)
  // — 예전엔 "세그먼트를 50%(SEGMENT_ADVANCE_MIN_T) 이상 지나야 전진"
  // 조건이 비율 기준이라, 세그먼트가 89m처럼 길면 "약 44.5m를 걸어야"로
  // 해석됐다. Node.js 재현으로 실측: 89m 세그먼트에서 44m(49%)까지는
  // advanced=false로 index가 0에 그대로 묶여 이동거리도 0.00km로 표시됨을
  // 확인했다.
  //
  // ⚠️ 첫 시도로 비율 조건을 완전히 없애고 거리 마진(SEGMENT_ADVANCE_
  // MIN_MARGIN_M) 조건만 남겼더니 더 심각한 결함이 나왔다 — 사용자가
  // 경로 위(직선상)를 정확히 걸으면 segN.distance(현재 세그먼트까지
  // 수직거리)가 항상 0이라 "segNext.distance + 3 < 0"이 수학적으로
  // 절대 성립할 수 없어, 아예 영원히 전진을 못 하게 됐다(Node.js
  // 재현으로 확인). 거리 마진 조건은 "경로에서 벗어나 있을 때"만
  // 의미가 있고, "경로 위를 똑바로 걷는 정상 케이스"는 비율(정확히는
  // 절대거리로 환산한 진행거리)로만 판정 가능하다는 것을 이 실패로
  // 확인했다.
  //
  // 최종 해법: 비율(t) 대신 "세그먼트를 따라 실제로 걸은 절대거리"
  // (t * segLenM, pointToSegmentMetersWithT가 함께 반환하는 세그먼트
  // 실측 길이)가 SEGMENT_ADVANCE_MIN_ABS_M을 넘으면 전진 — 짧은
  // 세그먼트(GPX 점 간격 중앙값 7m대)에서는 기존 50%와 비슷하게
  // 여전히 민감하게 반응하고, 긴 세그먼트(89m 등)에서는 그 비율만큼
  // 기다리지 않고 절대거리 기준으로 훨씬 빨리 전진한다. 거리 마진
  // 조건은 "경로에서 벗어난 상태"의 보조 판정으로 그대로 유지한다.
  const SEGMENT_ADVANCE_MIN_ABS_M = 15; // 세그먼트를 따라 이만큼(m) 걸으면 전진(GPX 점 간격 실측 중앙값의 약 2배)
  const SEGMENT_ADVANCE_MIN_MARGIN_M = 3; // 또는 N+1 세그먼트가 N보다 이만큼 더 가까움(경로 이탈 시 보조 판정)

  // ════════════════════════════════════════════════════════════════
  // 🧭 가자맵 대원칙 재통합(2026-09-24) — track_viewer.html과 같은
  // 폴더의 gajamap.md("가자맵 절대 대원칙") 참고. 예전엔 방향 판단이
  // matchingTrend(트랙 매칭 전용, 확정 인덱스 10개를 모아 5칸 이상
  // 벌어져야 전환하는 느린 추세)와 isReversingOnTrail(사용자 안내용,
  // updateReversingState가 traveledDist 증감 + gpsMovementHeading
  // 보강으로 갱신하는 빠른 히스테리시스) 두 갈래로 나뉘어 있었다.
  // 같은 질문("지금 순방향인가 역방향인가")을 서로 다른 입력·속도로
  // 두 번 답하다 보니 "지도는 맞는데 화살표는 반대" 같은 불일치가
  // 실사용에서 재현됐다(사용자 재현: "GPS 인덱스가 감소인지 증가인지
  // 구분을 전혀 못 해. 어떨 때는 잘 잡고 어떨 때는 아예 반대로 잡아").
  //
  // 이제 단일 진실 공급원은 trackDirection 하나뿐이다 — nearestIdx의
  // 증감만으로 갱신되고(updateTrackDirection, nearestPointOnTrail 안에서
  // 호출), GPS 이동방위각/나침반/자이로/mapRotationDeg는 이 판정에
  // 전혀 관여하지 않는다(대원칙 2·3번). isReversingOnTrail은 변수명과
  // 기존 13곳의 참조를 그대로 유지하되(영향 범위 최소화), 이제
  // trackDirection의 거울일 뿐이다 — 값을 직접 대입하는 지점은
  // updateTrackDirection 단 한 곳으로 좁혔다(예전엔 updateReversingState
  // 와 첫 원점 확정 로직 두 곳에서 각각 건드렸다).
  //
  // trackDirection은 findNearestInRange의 왕복 구간 매칭 페널티에도
  // 재사용된다(예전 matchingTrend의 역할) — 단, "이전에 확정된"
  // trackDirection만 보조 정보로 참조하고, 이번 픽스의 매칭 결과로
  // 이번 픽스의 trackDirection을 재계산하지 않는다(순환 차단, 아래
  // updateTrackDirection이 매칭 이후에만 호출되는 순서로 보장).
  const MIN_INDEX_DELTA = 1; // index가 이만큼만 움직여도 방향 후보로 인정
  // GPX 포인트 간격 실측(계룡산 5봉코스 GPX: 중앙값 7m, 평균 15m)이
  // 한 GPS 픽스당 실제 이동거리(도보 초속 ~1~1.3m, watchPosition
  // maximumAge 1초 기준)보다 훨씬 커서, 픽스 1회만으로 index가 1칸도
  // 안 움직이는 경우가 흔하다 — 그래서 MIN_INDEX_DELTA=1(움직이면
  // 무조건 후보)로도 노이즈에 크게 취약하지 않다. 대신 CONFIRM_STREAK
  // (연속 확인 횟수)로 GPS 튐 한 번에 뒤집히지 않게 막는다.
  const TRACK_DIRECTION_CONFIRM_STREAK = 3;
  let trackDirectionCandidate = null; // 'forward' | 'backward' — 아직 확정 전 후보
  let trackDirectionCandidateStreak = 0;
  let lastConfirmedTrackIdx = null; // trackDirection 판정 전용 인덱스 이력(lastNearestIdx와 별개 — 리셋 시점이 다를 수 있음)
  // 🧭 순방향/역방향 단일 상태 — 지도 회전, 화살표, 갈림길 안내, 왕복
  // 매칭 페널티가 전부 이 값 하나만 읽는다(대원칙 10번: 지도와 화살표는
  // 동일한 방향 데이터를 사용해야 한다). 값을 대입하는 지점은
  // updateTrackDirection 단 한 곳뿐이다 — 변수 선언 위치를 그 함수
  // 바로 옆으로 옮겨(예전엔 updateReversingState 근처에 있었다) 어디서
  // 갱신되는지 한눈에 보이게 한다.
  let isReversingOnTrail = false;

  // nearestPointOnTrail이 이번 픽스의 nearestIdx를 확정한 "직후"에만
  // 호출한다 — trackDirection이 이번 픽스의 매칭 결과에 영향을 주지
  // 않도록(순환 차단) 순서를 지킨다.
  function updateTrackDirection(nearestIdx) {
    if (lastConfirmedTrackIdx === null) {
      lastConfirmedTrackIdx = nearestIdx;
      return;
    }
    const rawDelta = nearestIdx - lastConfirmedTrackIdx;
    lastConfirmedTrackIdx = nearestIdx;
    if (Math.abs(rawDelta) < MIN_INDEX_DELTA) return; // 노이즈(제자리 흔들림) — 후보에 반영하지 않음

    const candidate = rawDelta > 0 ? 'forward' : 'backward';
    if (candidate === trackDirectionCandidate) {
      trackDirectionCandidateStreak++;
    } else {
      trackDirectionCandidate = candidate;
      trackDirectionCandidateStreak = 1;
    }
    if (trackDirectionCandidateStreak >= TRACK_DIRECTION_CONFIRM_STREAK) {
      isReversingOnTrail = (trackDirectionCandidate === 'backward');
      updateGpsMarkerWarningStyle();
    }
  }

  // GPS 재획득/포그라운드 복귀 등 "새 GPS 상태에서 처음부터 다시
  // 계산해야 하는" 모든 지점에서 이 함수 하나만 호출한다(대원칙 6·7번:
  // 이전 방향 상태를 새 판단의 기준으로 쓰지 않는다). 예전엔
  // isReversingOnTrail/lastTraveledDistForReverse/reverseDecreaseStreak
  // 를 호출부마다 각각 따로 초기화해 누락 위험이 있었다.
  function resetTrackDirectionState() {
    isReversingOnTrail = false;
    trackDirectionCandidate = null;
    trackDirectionCandidateStreak = 0;
    lastConfirmedTrackIdx = null;
    moveDirectionSign = 1;
    lastMoveDirectionIdx = null;
  }

  // ════════════════════════════════════════════════════════════════
  // 🧭 2026-09-24 지도 회전 재설계(사용자 지시): "역방향 판정에 대한
  // 것을 없애려고 해. 단순 gpx index 의 증가냐 감소냐에 따라서 지도를
  // 회전하고... 지도에선 그냥 내가 가는 방향을 항상 앞으로 보여주고"
  //
  // isReversingOnTrail(위, TRACK_DIRECTION_CONFIRM_STREAK=3회 연속
  // 확인 후에만 바뀌는 값)은 "지금 왕복 코스의 올라가는 구간인지
  // 내려오는 구간인지"를 사용자에게 안내하기 위한 값으로, 하단 경로
  // 알람(findNextMilestone 등)에서는 계속 그대로 쓴다(왕복 시 다음
  // 목표를 코스 순서상 앞/뒤 어느 쪽에서 찾을지 알아야 하므로).
  //
  // 반면 지도 회전·내 위치 화살표는 "지금 실제로 이동 중인 방향"만
  // 그대로 화면 위로 보여주면 되므로, 3회 확인을 기다릴 필요가 없다
  // (오히려 그 지연 때문에 "화살표가 실제 진행방향과 다르다"는 재현이
  // 나왔었다). moveDirectionSign은 매 픽스 "직전 nearestIdx → 이번
  // nearestIdx"의 부호를 지연 없이 그대로 반영한다 — index 변화가
  // 없는(제자리 정지) 픽스에서는 직전 값을 그대로 유지한다.
  let moveDirectionSign = 1; // 1(index 증가 방향) | -1(index 감소 방향)
  let lastMoveDirectionIdx = null;
  // justReacquired: SEARCHING→LOCKED 재획득이 이번 픽스에 막 일어났으면
  // true — index가 옛 위치에서 새 위치로 (오매칭 수정으로) 크게 점프한
  // 것일 수 있으므로, 그 delta를 "실제 이동 방향"으로 오인하지 않도록
  // 이번 한 번은 방향 판정을 건너뛰고 기준점만 새로 잡는다.
  //
  // 🐛 2026-09-25 수정(사용자 재현: "🧪 오차 주입하면 화살표가 가끔
  // 180도까지 회전") — 이 함수는 SEARCHING(예외 경로/시뮬레이션 전용,
  // LOCKED는 별도 경로에서 항상 +1로 고정됨)에서만 쓰이는데, delta
  // 부호 1회만으로 즉시 반영해 완충이 전혀 없었다. GPS 오차(또는 🧪
  // 주입 오차)가 매칭 index를 1~2칸 정도 순간적으로 흔들면(점 간격이
  // 좁은 구간에서 흔함), 그 노이즈만으로 moveDirectionSign이 즉시
  // 반전돼 화살표가 180도 튀었다. delta가 MOVE_DIRECTION_NOISE_IDX
  // (2칸) 이하인 역방향 흔들림은 노이즈로 보고 무시하고, 실제 이동에
  // 해당하는 크기(3칸 이상)만 방향 전환으로 인정한다 — 진짜 turnaround
  // (정상 도착 후 반대로 돌아서는 등)는 실제로 여러 칸 연속 이동하므로
  // 여전히 즉시 반영된다.
  const MOVE_DIRECTION_NOISE_IDX = 2;
  function updateMoveDirection(nearestIdx, justReacquired) {
    if (lastMoveDirectionIdx === null || justReacquired) {
      lastMoveDirectionIdx = nearestIdx;
      return;
    }
    const delta = nearestIdx - lastMoveDirectionIdx;
    if (Math.abs(delta) <= MOVE_DIRECTION_NOISE_IDX) return; // 노이즈 — 기준점도 직전 값 유지, 다음 픽스와 계속 비교
    lastMoveDirectionIdx = nearestIdx;
    moveDirectionSign = delta > 0 ? 1 : -1;
  }

  // 실제로 걷는 방향은 항상 하나뿐이다 — GPX 상에 막다른 길을 왕복하는
  // 구간이 있어 "가는 길"과 "오는 길" 좌표가 거의 겹치더라도, 사용자
  // 입장에서는 둘 중 하나로 애매할 이유가 없다. 그런데 순수 최단거리
  // 비교만으로는 GPS 오차 1~2m 차이로도 반대편 세그먼트를 골라버릴 수
  // 있었다 — "순방향으로 잘 걷고 있는데 역방향으로 오판"되는 근본
  // 원인이었다.
  //
  // ⚠️ 하드 필터(완전 제외)였던 이전 버전은 "가는 길/오는 길이 별도
  // 좌표열로 겹쳐 있는 왕복 코스"만 전제하고 있었는데, 편도(단일) 트랙
  // 하나를 실제로 왕복해서 걷는 코스에서는 정반대 결과를 냈다. 완전
  // 제외 대신 "페널티"로 완화한다: 방향이 REVERSE_SEGMENT_EXCLUDE_DEG
  // (90도) 이상 어긋나는 세그먼트는 실제 거리에 REVERSE_SEGMENT_PENALTY_M
  // 만큼 가산해 비교한다. 페널티 판정 재료는 isReversingOnTrail(위
  // updateTrackDirection이 관리하는 단일 방향 상태)과 각 세그먼트 고유의
  // 진행방향(currentSegmentBearings[i], GPX 점 순서 자체에서 나온 값)뿐
  // — GPS 이동방위각은 전혀 섞이지 않는다.
  const REVERSE_SEGMENT_EXCLUDE_DEG = 90;
  const REVERSE_SEGMENT_PENALTY_M = 30;
  // 이 길이(m)보다 짧은 세그먼트는 GPS가 한 자리에서 서성이며 찍힌 노이즈로
  // 보고, 그 방위각을 왕복구간 방향 페널티 판별에 쓰지 않는다
  // (findNearestInRange 참고). 실측: 남덕유산 서봉 왕복구간에서 반경
  // 1~2m 안에 방위각이 0~360도로 요동하는 포인트가 다수 있었다.
  const MIN_SEGMENT_LEN_FOR_BEARING_M = 3;

  // 주어진 인덱스 범위 [startIdx, endIdx) 안에서만 최근접 선분을 찾는 내부 함수
  function findNearestInRange(lat, lon, points, startIdx, endIdx) {
    let minScore = Infinity; // 방향 페널티가 포함된 "선택용" 점수
    let nearestActualDist = Infinity; // 페널티 없는 실제 거리(이탈 판정 등에 쓸 값)
    let nearestPoint = points[startIdx] || points[0];
    let nearestIdx = startIdx;
    // 🐛 자기강화 루프 방지(사용자 재현: "갈림길 지나면서 지도 회전이
    // 정반대", "GPS 껐다 켜니 그때서야 방향이 일치") — 아래 페널티는
    // isReversingOnTrail을 입력으로 쓰는데, isReversingOnTrail 자체는
    // 이 함수의 매칭 결과(nearestIdx)로 결정된다. 한 번 방향이 잘못
    // 확정되면 그 페널티가 계속 같은 방향의 세그먼트를 선호하도록
    // 유도해 틀린 판정을 스스로 강화하는 폐루프가 될 수 있다(특히
    // 방향점 밀집 구간에서 GPS가 서성이며 index가 짧게 흔들릴 때
    // 트리거되기 쉬움). 이를 끊기 위해 "페널티 없는 순수 최단거리
    // 기준" 결과를 별도로 함께 추적해 반환한다 — 화면 표시/이탈 판정은
    // 페널티가 반영된 값을 그대로 쓰되, 왕복 방향 판정(updateTrackDirection)
    // 만은 이 오염되지 않은 rawNearestIdx를 입력으로 삼는다.
    let rawMinDist = Infinity;
    let rawNearestIdx = startIdx;

    // 진행방향과 REVERSE_SEGMENT_EXCLUDE_DEG(90도) 이상 어긋나는 세그먼트는
    // 완전히 제외하지 않고 점수에 페널티만 더한다 — 편도 트랙을 역방향
    // 으로 걸을 때도 "지금 서 있는 바로 그 트랙"이 여전히 선택될 수
    // 있게 하기 위함(REVERSE_SEGMENT_EXCLUDE_DEG 정의부 주석 참고).
    for (let i = startIdx; i < endIdx; i++) {
      const a = points[i];
      const b = points[i + 1];

      const d = pointToSegmentMeters(lat, lon, a.lat, a.lon, b.lat, b.lon);
      // 🐛 오프바이원(off-by-one) 매칭 지연 수정(사용자 재현: "시뮬레이션
      // 해도 내 위치 화살표가 가는 방향 반대로 나와") — GPS 좌표가 GPX
      // 트랙포인트와 정확히(또는 거의) 일치하면, 그 점은 "들어오는
      // 선분(index-1, 끝점)"과 "나가는 선분(index, 시작점)" 양쪽에서
      // 거리가 사실상 0으로 동점이 된다. i를 오름차순으로 스캔하며
      // "완전히 더 작을 때만(<)" 갱신하면 먼저 만나는 들어오는 선분이
      // 계속 유지되고 나가는 선분으로 절대 안 넘어간다 — nearestIdx가
      // 실제 위치보다 항상 한 칸 뒤처지는 구조적 지연이 생겼다. 이
      // 지연된 위치를 기준으로 computeArrowHeading이 "15m 앞"을 계산하면,
      // 코스가 급하게 꺾이는 구간(스위치백)에서는 그 15m 앞이 방금
      // 지나온 급커브 반대편(뒤쪽)을 가리켜 화살표가 90~180도 반대로
      // 튀었다(실측 검증: 계룡산 5봉코스 idx=12에서 오차 179.7도).
      // 정확히 같은 지점(EPSILON_M 이내 동점)일 때는 "나가는 선분"
      // (더 큰 index, 진행방향)을 우선하도록 허용오차 비교로 고친다 —
      // i가 오름차순으로 증가하므로, "명확히 더 가깝거나(<)" 또는
      // "동점 범위 안(<=  d + EPSILON)"이면 갱신해 더 큰 index가
      // 이기도록 한다. 일반적인(거리 차이가 뚜렷한) 경우는 기존처럼
      // 더 가까운 쪽이 그대로 선택되므로 다른 동작에 영향이 없다.
      const RAW_TIE_EPSILON_M = 0.01;
      if (d < rawMinDist + RAW_TIE_EPSILON_M) {
        rawMinDist = Math.min(d, rawMinDist);
        rawNearestIdx = i;
      }
      // 🗺️ 가자맵 대원칙 재설계(2026-09-25) — 예전엔 여기서
      // isReversingOnTrail(왕복 겹침 구간의 가는 길/오는 길 구분용)
      // 기반 방향 페널티를 더했다. 이제 이 함수는 "구간 미확정 시(코스
      // 진입 전) 전역 탐색 전용"으로만 쓰인다 — 구간이 확정된 이후의
      // 정상 추적은 projectOntoCurrentSection이 애초에 현재 구간 범위
      // 안에서만 탐색하므로 왕복 반대편이 후보에 들 수조차 없다(방향
      // 페널티가 막던 문제가 구조적으로 사라짐). "역방향"이라는 개념
      // 자체를 지도 방향 결정에서 없앤다는 대원칙에 따라 페널티 로직을
      // 제거하고 순수 최단거리 비교만 남긴다.
      const score = d;

      // 위 rawNearestIdx와 동일한 이유로 동점(EPSILON_M 이내) 허용 비교 —
      // 방향 페널티가 섞인 score라도, 각 세그먼트 자체의 페널티 유무는
      // 이 작은 오차 범위로 뒤집히지 않으므로(페널티 단위가 30m로 훨씬
      // 크다) 안전하다.
      const SCORE_TIE_EPSILON_M = 0.01;
      if (score < minScore + SCORE_TIE_EPSILON_M) {
        minScore = Math.min(score, minScore);
        nearestActualDist = d;
        nearestIdx = i;
        const dA = haversineMeters(lat, lon, a.lat, a.lon);
        const dB = haversineMeters(lat, lon, b.lat, b.lon);
        nearestPoint = dA <= dB ? a : b;
      }
    }

    return { distance: nearestActualDist, point: nearestPoint, index: nearestIdx, rawIndex: rawNearestIdx };
  }

  // 🧭 LOCKED 모드 전용 — 현재 확정 index N에서 "N에 머무는가, N+1로
  // 넘어갔는가"만 판단한다. findNearestInRange와 달리 방향 페널티를
  // 전혀 쓰지 않는다 — 후보가 N/N+1 두 개뿐이라 왕복 코스의 반대편
  // 세그먼트(페널티가 원래 막으려던 대상)가 애초에 후보에 들 수 없기
  // 때문이다. N이 트랙의 마지막 세그먼트면(N+1 세그먼트가 없음) N에만
  // 머문다.
  function trackFromLockedIndex(lat, lon, points, N) {
    const maxIdx = points.length - 2;
    const a = points[N], b = points[N + 1];
    const segN = pointToSegmentMetersWithT(lat, lon, a.lat, a.lon, b.lat, b.lon);

    let segNext = null;
    if (N + 1 <= maxIdx) {
      const c = points[N + 1], d = points[N + 2];
      segNext = pointToSegmentMetersWithT(lat, lon, c.lat, c.lon, d.lat, d.lon);
    }

    let chosenIdx = N;
    let chosenDist = segN.distance;
    let chosenT = segN.t;

    // 짧은 세그먼트(GPX 점 간격이 촘촘한 구간, 실측 중앙값 7m대)에서는
    // SEGMENT_ADVANCE_MIN_ABS_M(15m)이 세그먼트 길이보다 커서 끝까지
    // 걸어도 전진 못 하는 회귀가 있었다(Node.js 재현으로 확인) —
    // 세그먼트 자체보다 긴 절대거리를 요구할 수 없으므로, 임계값을
    // 세그먼트 길이의 90%로 캡을 씌운다. 짧은 세그먼트는 사실상 "거의
    // 끝(90%)까지 가면 전진"으로, 긴 세그먼트(89m 등)는 기존대로 15m
    // 걸으면 전진으로 동작한다.
    const advanceThresholdM = Math.min(SEGMENT_ADVANCE_MIN_ABS_M, segN.segLenM * 0.9);
    const advanced = segNext && (
      segN.t * segN.segLenM >= advanceThresholdM ||
      segNext.distance + SEGMENT_ADVANCE_MIN_MARGIN_M < segN.distance
    );
    if (advanced) {
      chosenIdx = N + 1;
      chosenDist = segNext.distance;
      chosenT = segNext.t;
    }

    const bestOfTwo = Math.min(segN.distance, segNext ? segNext.distance : Infinity);
    const chosenA = points[chosenIdx], chosenB = points[chosenIdx + 1];
    const point = {
      lat: chosenA.lat + (chosenB.lat - chosenA.lat) * chosenT,
      lon: chosenA.lon + (chosenB.lon - chosenA.lon) * chosenT
    };

    // advanced: 이번 픽스에 N에서 N+1로 실제로 전진했는지 — 이 함수는
    // 구조상 "머무름" 또는 "전진"만 판정하고 절대 후진 신호를 내지
    // 않는다(사용자 지시: 다음 index로만 전진). moveDirectionSign은
    // 이제 이 판정을 그대로 쓴다(아래 nearestPointOnTrail 참고) — 예전
    // 처럼 "직전 확정 index와의 delta"로 재계산하면, 코스 최초 진입이나
    // SEARCHING→LOCKED 재획득 직후처럼 "직전 값"이 없거나 신뢰할 수
    // 없는 시점에 moveDirectionSign이 갱신되지 않고 스테일 값(초기값
    // 1 또는 이전 상태)으로 남아, 실제 진행 방향과 반대로 화살표가
    // 나오는 버그가 있었다(사용자 재현: "index는 잘 잡는데 화살표가
    // 진행 반대방향으로 나옴").
    return { index: chosenIdx, distance: chosenDist, bestOfTwo, point, advanced };
  }

  // 사용자 위치에서 GPX 트랙 전체(점들을 이은 선분들)까지의 최단거리와,
  // 그 최단점이 속한 선분의 시작 인덱스를 함께 구한다. 점이 1개뿐이면
  // 선분을 만들 수 없으므로 그 점까지의 거리로 대체한다.
  //
  // 탐색 전략: 직전 위치(lastNearestIdx) 주변 윈도우를 먼저 확인하고,
  // 그 안에서 거리가 너무 멀면(50m 초과 — 갑자기 멀리 벗어났거나 이제
  // 막 시작한 경우) 전체 트랙을 다시 훑는 전역 탐색으로 안전하게 전환한다.
  // 이렇게 하면 왕복 코스에서 반대편 구간으로 잘못 붙는 문제를 막으면서도,
  // 사용자가 크게 우회하거나 중간에 새로 진입해도 위치를 영영 놓치지 않는다.
  function nearestPointOnTrail(lat, lon, points) {
    if (!points || points.length === 0) {
      lastNearestIdx = -1;
      trailTrackingMode = 'SEARCHING';
      return { distance: 999999, point: null, index: -1 };
    }
    if (points.length === 1) {
      lastNearestIdx = 0;
      return { distance: haversineMeters(lat, lon, points[0].lat, points[0].lon), point: points[0], index: 0 };
    }

    const maxIdx = points.length - 2; // 선분 시작 인덱스의 최댓값 (i, i+1 쌍이므로)
    let result;
    let justReacquired = false; // 이번 픽스에 SEARCHING→LOCKED 전환이 막 일어났는지

    // 🧭 이 함수는 실제 GPS 추적 전용이다(2026-09-25, 사용자 지시:
    // "시뮬레이션과 실제 GPS는 완전히 분리해줘" — 이전엔 isSimulationMode
    // 분기로 시뮬레이션도 이 함수를 공유했으나, "따라가기 배속 재생 중
    // 화살표가 반대로 나온다"는 재현 이후 시뮬레이션 전용 사본
    // (nearestPointOnTrailForSim, 아래 별도 정의)으로 완전히 분리했다.
    // 이제 이 함수를 수정해도 시뮬레이션에는 전혀 영향을 주지 않는다.
    //
    // 🧭 LOCKED: 정상 추적 중(실제 GPS 전용) — N/N+1 두 후보만 본다
    // (trackFromLockedIndex 정의부 주석 참고). 둘 다 비정상적으로
    // 멀어진 상태가 LOCK_REACQUIRE_STREAK(3픽스) 연속되면 SEARCHING으로
    // 전환한다 — 1회성 GPS 튐에는 반응하지 않기 위한 완충이다(이 3픽스
    // 동안은 이전 LOCKED 결과를 그대로 쓰므로, "즉시 튐"은 막아도
    // "몇 초간 튐"까지는 못 막는다).
    if (trailTrackingMode === 'LOCKED' && lastNearestIdx >= 0) {
      const locked = trackFromLockedIndex(lat, lon, points, lastNearestIdx);
      if (locked.bestOfTwo > LOCK_REACQUIRE_DIST_M) {
        offCandidateStreak++;
      } else {
        offCandidateStreak = 0;
      }
      if (offCandidateStreak >= LOCK_REACQUIRE_STREAK) {
        trailTrackingMode = 'SEARCHING'; // 아래 SEARCHING 분기로 폴스루
      } else {
        result = { distance: locked.distance, point: locked.point, index: locked.index, rawIndex: locked.index };
      }
    }

    // 🧭 SEARCHING: 코스 진입 전(lastNearestIdx===-1) 또는 LOCKED에서
    // 방금 이탈 판정된 경우 — 기존 윈도우→전역 탐색(방향 페널티 포함)을
    // 그대로 재사용한다. 삭제하지 않고 "예외 경로"로 남겨둔 것뿐이다.
    if (!result) {
      if (lastNearestIdx >= 0) {
        // 1차: 직전 위치 주변 윈도우만 탐색 (빠르고, 왕복 구간 혼선 방지)
        const startIdx = Math.max(0, lastNearestIdx - TRAIL_WINDOW_RADIUS);
        const endIdx = Math.min(maxIdx, lastNearestIdx + TRAIL_WINDOW_RADIUS);
        result = findNearestInRange(lat, lon, points, startIdx, endIdx);

        // 2차: 윈도우 안에서 찾은 결과가 너무 멀면(50m 초과) 안전장치로
        // 전역 탐색으로 재전환 — 사용자가 크게 이탈했다가 다른 지점으로
        // 복귀했거나, 처음 GPS를 켠 시점일 수 있다.
        if (result.distance > TRAIL_FALLBACK_THRESHOLD_M) {
          result = findNearestInRange(lat, lon, points, 0, maxIdx);
        }
      } else {
        // 최초 1회는 윈도우 기준점이 없으므로 전역 탐색
        result = findNearestInRange(lat, lon, points, 0, maxIdx);
      }

      // 재탐색 결과가 다시 신뢰할 만한 거리(LOCK_REACQUIRE_DIST_M) 이내로
      // 들어오면 즉시 LOCKED로 복귀한다.
      if (result.distance <= LOCK_REACQUIRE_DIST_M) {
        trailTrackingMode = 'LOCKED';
        offCandidateStreak = 0;
        justReacquired = true;
      }
    }

    lastNearestIdx = result.index;

    // 🧭 두 방향 신호를 각각 갱신 — 둘 다 이번에 "확정된" lastNearestIdx를
    // 넘기고, 이번 호출의 매칭 결과가 이번 호출의 방향 판단에 섞이지
    // 않도록 매칭 이후에만 호출한다(순환 차단).
    //   - updateTrackDirection(isReversingOnTrail): 왕복 안내용, 3회
    //     연속 확인 후에만 전환(느리지만 안정적) — 하단 경로 알람에서 씀.
    //     🐛 자기강화 루프 방지: result.index(방향 페널티가 반영된 값)가
    //     아니라 result.rawIndex(페널티 없는 순수 최단거리 결과)를
    //     넘긴다 — isReversingOnTrail 자체가 그 페널티의 입력이므로,
    //     페널티가 반영된 결과로 방향을 재판정하면 한 번 잘못 뒤집힌
    //     값이 스스로를 계속 강화하는 폐루프가 된다(findNearestInRange
    //     정의부 rawNearestIdx 주석 참고). LOCKED 결과는 rawIndex가
    //     없으므로 index를 그대로 쓴다(페널티 자체가 없어 오염 문제가
    //     없음).
    //   - updateMoveDirection(moveDirectionSign): 지도 회전/화살표용,
    //     지연 없이 즉시 반영 — "역방향 판정 없이 실제 이동 방향만".
    //     화면에 보이는 안정화된 위치(lastNearestIdx)를 그대로 쓴다.
    //     단, 이번 픽스에 SEARCHING→LOCKED 재획득이 막 일어났으면
    //     (justReacquired) 직전 확정 index와의 delta 계산 대신, 재탐색
    //     결과가 곧바로 신뢰할 수 있는 기준점이 되므로 그 자리에서
    //     새로 시작한다(updateMoveDirection이 처리).
    //
    // 🐛 2026-09-25 수정(사용자 재현: "index는 잘 잡는데 화살표가 진행
    // 반대방향으로 나옴") — LOCKED 결과(result.advanced가 존재)는
    // trackFromLockedIndex가 이미 "N에 머물렀는지, N+1로 전진했는지"를
    // 직접 판정해뒀다(이 함수는 구조상 후진을 절대 반환하지 않는다).
    // 예전처럼 이 정보를 버리고 "직전 확정 lastMoveDirectionIdx와의
    // delta"를 다시 계산하면, 코스 최초 진입/재획득 직후처럼 "직전
    // 값"이 아직 없거나 신뢰 못 할 시점엔 moveDirectionSign이 갱신되지
    // 않고 초기값(1) 또는 스테일 값으로 남아 실제 진행 방향과 반대로
    // 나올 수 있었다. LOCKED로 매칭된 이상(result.advanced가 존재)
    // trackFromLockedIndex가 절대 후진을 반환하지 않으므로, 머무름/
    // 전진 여부와 무관하게 항상 +1(다음 index 방향)로 고정한다(아래
    // 2026-09-25 추가 수정 참고 — 처음엔 "전진일 때만 교정"으로
    // 했다가, 머무름이 몇 픽스 이어지는 동안 스테일 값이 남는 걸
    // 실행 검증으로 확인해 무조건 고정으로 강화했다). SEARCHING
    // (재탐색) 결과는 정의상 직접 판정이 없으므로 기존 delta 기반
    // 로직을 그대로 쓴다.
    updateTrackDirection(result.rawIndex !== undefined ? result.rawIndex : result.index);
    if (result.advanced !== undefined) {
      // 🐛 2026-09-25 추가 수정 — "전진(advanced)"일 때만 +1로 교정하면,
      // 세그먼트 초반(머무름, t<0.5)에 머무는 몇 픽스 동안은 스테일 값이
      // 그대로 남아 화살표가 계속 반대로 보일 수 있었다(실행 검증으로
      // 확인). trackFromLockedIndex는 구조상 N→N+1 전진 또는 N 머무름만
      // 반환하고 절대 후진을 반환하지 않으므로, LOCKED로 매칭된 이상
      // moveDirectionSign이 -1일 이유가 아예 없다 — 전진 여부와 무관하게
      // 항상 +1로 고정한다.
      moveDirectionSign = 1;
      lastMoveDirectionIdx = lastNearestIdx; // delta 기준점도 함께 동기화(다음 SEARCHING 전환 대비)
    } else {
      updateMoveDirection(lastNearestIdx, justReacquired);
    }

    return result;
  }

  // 코스별 전체 누적거리 배열 — currentPoints가 바뀔 때마다 다시 계산해둔다.
  // 매번 새로 계산하면 GPS 갱신마다(초당 1회) 전체 배열을 순회해야 해서
  // 비효율적이므로, drawRoute에서 한 번만 만들어 캐시해둔다.
  let cumulativeDistances = [];
  let currentMilestones = []; // cumulativeDistances[i] = 시작점부터 points[i]까지의 누적 거리(m)
  let currentSegmentBearings = []; // currentSegmentBearings[i] = points[i]->points[i+1] 방향(도) — 내 위치 화살표 전용
  let segmentLengths = []; // segmentLengths[i] = points[i]->points[i+1] 실제 거리(m) — 방향 페널티에서 "방향 미정의 구간" 판별용

  
  // GPX 경유지/지명을 경로상 누적거리(distanceM)에 매핑
  function buildMilestones(points, waypoints, cumDistances) {
    if (!points || !points.length) return [];
    const totalDistM = (cumDistances && cumDistances.length) ? cumDistances[cumDistances.length - 1] : 0;
    const list = [];
    // ⚠️ 중복 판정은 "이름"이 아니라 "좌표"로 해야 한다. "갈림길", "쉼터"
    // 같은 이름은 한 코스 안에서 여러 번 반복되는 게 흔한데, 이름만으로
    // 중복 제거하면 실제로 서로 다른 지점인 두 번째 이후 "갈림길"들이
    // 통째로 안내에서 빠지는 버그가 있었다(연인산 코스 실측: 웨이포인트
    // 11개 중 "갈림길" 이름 6개가 스킵되어 마일스톤이 5개로 줄었다).
    // 좌표를 적당히 반올림해 키로 쓰면, 완전히 같은 지점을 가리키는 진짜
    // 중복 항목(예: GPX 편집 중 실수로 두 번 찍힌 경우)만 걸러내고, 이름이
    // 같아도 좌표가 다른 지점은 각각 별개로 등록된다.
    const seen = new Set();

    if (waypoints && waypoints.length > 0) {
      waypoints.forEach(w => {
        const n = (w.name || '').trim();
        if (!n) return;
        const coordKey = w.lat.toFixed(5) + ',' + w.lon.toFixed(5); // 약 1m 단위 반올림
        if (seen.has(coordKey)) return;
        seen.add(coordKey);

        // ↩️ 왕복(원점회귀) 코스는 GPX 트랙이 올라가는 구간과 내려오는
        // 구간을 별도 좌표열로 기록한다(nearestPointOnTrail의 방향
        // 하드필터가 전제하는 구조) — 즉 같은 갈림길이라도 트랙상으로는
        // "가까운 세그먼트가 두 곳"이다. 예전엔 전체 트랙에서 최단거리
        // 하나만 찾아 매칭했기 때문에, 실제로 그 갈림길을 반대 방향으로
        // 지날 때는 매칭된 세그먼트가 멀어 안내가 아예 안 나왔다.
        // WAYPOINT_MATCH_RADIUS_M 이내에 있는 모든 근접 세그먼트를 찾고
        // (같은 왕복 왕/복 구간이 서로 어느 정도 떨어져 있다는 전제로
        // ROUNDTRIP_CLUSTER_GAP_M 이상 차이나는 것끼리 별도 클러스터로
        // 묶어), 클러스터마다 마일스톤을 하나씩 만든다 — 올라갈 때도
        // 내려갈 때도 똑같이 안내 대상이 된다.
        const WAYPOINT_MATCH_RADIUS_M = 30;
        const ROUNDTRIP_CLUSTER_GAP_M = 50; // 이 거리(코스 진행거리 기준) 이상 떨어지면 별개 왕복 구간으로 간주

        let globalMinD = Infinity;
        for (let i = 0; i < points.length - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = pointToSegmentMeters(w.lat, w.lon, a.lat, a.lon, b.lat, b.lon);
          if (d < globalMinD) globalMinD = d;
        }
        // 경로 선(트랙)에서 너무 멀리 떨어져 있는 지명은
        // 사용자가 경로를 우회했거나 가지 않는 곳이므로 안내에서 제외 (100m 기준)
        if (globalMinD > 100 && !n.includes('들머리') && !n.includes('날머리')) {
          return;
        }

        // 후보 세그먼트 수집: globalMinD 대비 WAYPOINT_MATCH_RADIUS_M 이내로
        // 근접한 모든 세그먼트(왕복이면 양쪽 다 여기 걸림).
        const matchThreshold = Math.max(globalMinD, WAYPOINT_MATCH_RADIUS_M);
        const candidates = [];
        for (let i = 0; i < points.length - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = pointToSegmentMeters(w.lat, w.lon, a.lat, a.lon, b.lat, b.lon);
          if (d <= matchThreshold) candidates.push({ idx: i, dist: d });
        }
        // 코스 진행거리(cumDistances) 기준으로 정렬 후, ROUNDTRIP_CLUSTER_GAP_M
        // 이상 떨어진 지점끼리 별도 클러스터로 나눈다.
        candidates.sort((c1, c2) => (cumDistances[c1.idx] || 0) - (cumDistances[c2.idx] || 0));
        const clusters = [];
        candidates.forEach(c => {
          const cDist = cumDistances[c.idx] || 0;
          const lastCluster = clusters[clusters.length - 1];
          if (lastCluster && (cDist - lastCluster.lastDist) <= ROUNDTRIP_CLUSTER_GAP_M) {
            lastCluster.lastDist = cDist;
            if (c.dist < lastCluster.best.dist) lastCluster.best = c;
          } else {
            clusters.push({ best: c, lastDist: cDist });
          }
        });

        let icon = '📍';
        let color = '#2e7d32';
        // 🐛 2026-09-25 수정(사용자 재현: "남덕유산 서봉 왕복 GPX 실제
        // 재생 검증 — 서봉 정상부에서 화면 회전이 125도까지 어긋남" →
        // "거긴 내가 여기저기 들러봐서 그래. 서봉에선 그냥 유턴 단순하게
        // 해") — 정상류 지점은 실측 GPS 궤적이 정상석 주변을 배회하며
        // 찍혀(짧은 지그재그 구간) computeArrowHeading의 15m 앞보기가
        // 급격히 흔들릴 수 있다. isPeak 플래그를 마일스톤에 남겨,
        // computeArrowHeading이 이 지점 근처에서는 세밀한 방향 대신
        // "진행방향이 반대로 바뀌었는지"만 보는 단순 유턴 모드로 전환한다.
        const isPeak = n.endsWith('봉') || n.endsWith('산') || n.includes('정상') || n.includes('최고지점');
        if (n.includes('들머리') || n.includes('출발')) {
          icon = '🚩'; color = '#1976d2';
        } else if (n.includes('날머리') || n.includes('도착')) {
          icon = '🏁'; color = '#d32f2f';
        } else if (isPeak) {
          icon = '⛰️'; color = '#e65100';
        } else if (n.endsWith('재') || n.endsWith('령') || n.endsWith('고개')) {
          icon = '🏔️'; color = '#00838f';
        } else if (n.endsWith('사') || n.endsWith('암') || n.includes('절')) {
          icon = '⛩️'; color = '#c2185b';
        } else if (n.includes('삼거리') || n.includes('사거리') || n.includes('갈림길') || n.includes('분기')) {
          icon = '🔀'; color = '#6a1b9a';
        }

        // 방향 안내(하단 화살표/텍스트)는 웨이포인트의 원본 좌표가 아니라
        // 트랙에 매칭된 좌표(trailLat/trailLon)를 써야 한다 — 웨이포인트가
        // 실제 등산로에서 떨어진 지점(정상석, 전망대 등)이면 원본 좌표로
        // 직선 방향을 계산했을 때 실제 등산로 진행 방향과 다른 방향을
        // 가리킬 수 있다. name/거리 표시용 lat/lon은 원본을 유지하되,
        // 방향 계산 전용 필드를 별도로 둔다.
        //
        // 🐛 2026-09-25 수정(가자맵 대원칙 재설계 2단계 검증 중 발견): 들머리/
        // 날머리는 "코스의 시작"/"코스의 끝"을 뜻하는 유일한 지점이어야
        // 하는데, 위 왕복 클러스터링은 이름 있는 지점이 가는 길/오는 길에
        // 각각 나타나는 걸 전제로 한다. 날머리 좌표가 들머리와 가까우면
        // (원점회귀 코스) 코스 진행 중 우연히 그 좌표 WAYPOINT_MATCH_RADIUS_M
        // 이내를 스쳐가는 세그먼트가 시작 직후에도 잡혀, 진짜 종점과는
        // 별개로 "가짜 날머리" 클러스터가 코스 초반에 생겼다(남덕유산 실측:
        // 종점 8462m와 별도로 298m 지점에도 "날머리" 마일스톤이 잡힘).
        // resolveInitialSection이 지명 순서로 다음 구간을 결정하는 새 구조
        // (currentMilestoneIdx/nextMilestoneIdx)에서는 이 가짜 클러스터가
        // 첫 구간 자체를 완전히 잘못 확정시켜 지도 방향이 영구히 고정되는
        // 치명적 결과로 이어진다. 들머리/날머리는 클러스터링 없이 "코스
        // 시작/끝에 가장 가까운 클러스터 단 하나"만 남긴다.
        let selectedClusters = clusters;
        if (n.includes('들머리') || n.includes('출발')) {
          selectedClusters = clusters.length
            ? [clusters.reduce((a, b) => (cumDistances[a.best.idx] || 0) <= (cumDistances[b.best.idx] || 0) ? a : b)]
            : clusters;
        } else if (n.includes('날머리') || n.includes('도착')) {
          selectedClusters = clusters.length
            ? [clusters.reduce((a, b) => (cumDistances[a.best.idx] || 0) >= (cumDistances[b.best.idx] || 0) ? a : b)]
            : clusters;
        }
        selectedClusters.forEach(cluster => {
          const nearestIdx = cluster.best.idx;
          const distM = (cumDistances && cumDistances[nearestIdx] !== undefined) ? cumDistances[nearestIdx] : 0;
          const trailPt = points[nearestIdx];
          list.push({
            name: n, lat: w.lat, lon: w.lon, ele: w.ele, distanceM: distM, icon, color,
            trailLat: trailPt.lat, trailLon: trailPt.lon, isPeak,
          });
        });
      });
    }

    const hasAnyWaypoint = waypoints && waypoints.length > 0;

    // 최고지점(정상) 자동 감지 — 예전엔 웨이포인트가 아예 없는 GPX에서만
    // 동작했는데, 웨이포인트는 있지만(예: 들머리/갈림길만 찍혀있고)
    // "정상"이 빠진 왕복 코스가 실제로 있었다. 왕복 코스에서 정상은
    // U턴 지점이라 turnAngle이 180도(급회전)로 계산되어야 "여기서
    // 되돌아가세요" 화살표가 뜨는데, 마일스톤 자체가 없으면 애초에
    // turnAngle 계산 대상에서 빠진다 — 웨이포인트 유무와 무관하게
    // "정상" 계열 이름이 하나도 없으면 항상 자동 보완한다.
    const hasPeak = list.some(m => m.name.endsWith('봉') || m.name.endsWith('산') || m.name.includes('정상') || m.name.includes('최고지점'));
    if (!hasPeak) {
      const withEle = points.filter(p => p.ele !== null && !isNaN(p.ele));
      if (withEle.length > 0) {
        const peak = withEle.reduce((a, b) => b.ele > a.ele ? b : a);
        const peakIdx = points.indexOf(peak);
        const peakDistM = (cumDistances && cumDistances[peakIdx] !== undefined) ? cumDistances[peakIdx] : (totalDistM / 2);
        list.push({
          name: `정상 (${Math.round(peak.ele)}m)`,
          lat: peak.lat,
          lon: peak.lon,
          ele: peak.ele,
          distanceM: peakDistM,
          icon: '⛰️',
          color: '#e65100',
          trailLat: peak.lat, // 트랙 자체의 점이라 원본 좌표가 곧 트랙 좌표
          trailLon: peak.lon,
          isPeak: true,
        });
      }
    }

    if (!hasAnyWaypoint) {
      // 들머리 / 날머리가 없으면 기본 추가
      if (!list.some(m => m.name.includes('들머리') || m.name.includes('출발'))) {
        const startPt = points[0];
        list.push({ name: '들머리', lat: startPt.lat, lon: startPt.lon, distanceM: 0, icon: '🚩', color: '#1976d2', trailLat: startPt.lat, trailLon: startPt.lon });
      }
      if (!list.some(m => m.name.includes('날머리') || m.name.includes('도착'))) {
        const endPt = points[points.length - 1];
        list.push({ name: '날머리', lat: endPt.lat, lon: endPt.lon, distanceM: totalDistM, icon: '🏁', color: '#d32f2f', trailLat: endPt.lat, trailLon: endPt.lon });
      }
    }
    
    // 원점회귀 처리: 기존에 웨이포인트로 들어있든, 방금 자동으로 추가되었든
    // 들머리와 날머리가 50m 이내로 매우 가깝다면 하나로 합쳐서 화면 겹침 방지
    const startM = list.find(m => m.name.includes('들머리') || m.name.includes('출발'));
    const endM = list.find(m => m.name.includes('날머리') || m.name.includes('도착'));
    
    if (startM && endM && startM !== endM) {
      const dist = haversineMeters(startM.lat, startM.lon, endM.lat, endM.lon);
      if (dist < 50) {
        startM.name = '들·날머리 (원점회귀)';
        startM.icon = '🔄';
        startM.color = '#7b1fa2'; // 겹침 방지용 보라색 통합 마커
        
        // 날머리를 리스트에서 빼버리면 끝 지점 길안내가 마비되므로, 
        // 화면에서 마커(아이콘)만 겹치지 않게 숨김 처리한다.
        endM.hideMarker = true;
      }
    }

    list.sort((a, b) => a.distanceM - b.distanceM);

    // ⭐ 전면 재설계(2026-09-17): "단일 진행방향 소스" 방식으로 전환 —
    // 코스 로드 시점에 turnAngle(진입/이탈 상대 회전각)을 미리 계산해
    // 두던 이전 방식은 지도 회전 기준(computeSegmentHeading, prevM에서
    // 50m 앞)과 안내 각도 기준(turnAngle, 갈림길 전후 15m)이 서로 다른
    // 지점·다른 계산식을 썼다. 지도가 정확히 회전되어 있어도 안내
    // 각도가 화면과 어긋나고, 짧은 구간(들머리/날머리 근처, 좁은
    // 갈림길 간격)일수록 어긋남이 컸다(사용자 실기기 재현 다수: "경로가
    // 12시가 아니라 1시/9시", "원점을 못 잡음").
    //
    // 이제 turnAngle을 여기서 미리 계산하지 않는다 — 지도 회전과 몇 시
    // 방향 안내 모두, 실시간으로 findNextRotationTarget()/
    // updateSegmentRotationTrigger()가 "현재 화면이 가리키는 방향"과
    // "다음 목표 지점 방향"을 같은 기준(내 위치 → 목표 좌표 직선
    // 방향)으로 매번 계산해 항상 일치시킨다. 자세한 설계는
    // findNextRotationTarget() 정의부 참고.
    return list;
  }

  // ════════════════════════════════════════════════════════════════
  // 🗺️ 가자맵 대원칙 전면 재설계(2026-09-25, 사용자 제공 명세서
  // gajamap_map_origin_redesign.md 기준) — "역방향 판정에 대한 것을
  // 없애려고 해"(09-24)에서 한 걸음 더 나아가, "지도 방향은 GPS
  // 이동방향이 아니라 GPX가 정의한 진행방향(지명 순서)만 따른다"는
  // 원칙으로 재설계한다.
  //
  // 대원칙: A→B→C→B→A 코스에서 구간은 AB/BC/CB/BA 전부 "정상 진행
  // 구간"이다 — "역방향"이라는 개념 자체를 지도 방향 결정에 쓰지
  // 않는다. currentMilestones(2811행에서 distanceM 오름차순 정렬 —
  // 즉 이 배열의 인덱스 순서 자체가 이미 "코스 진행 순서"다)의 인덱스
  // 두 개(현재/다음)만으로 "지금 어느 구간을 걷고 있는지"와 "정방향인지
  // 역방향인지"가 동시에 표현된다 — isReversingOnTrail 같은 별도
  // 상태가 필요 없다. 왕복 코스는 buildMilestones가 이미 같은 이름의
  // 웨이포인트(예: "갈림길5")를 가는 길/오는 길 양쪽에 서로 다른
  // distanceM으로 각각 등록해두므로(2738-2746행 클러스터링 로직),
  // 배열 인덱스만 앞뒤로 훑으면 A→B→...→(종점)→...→B→A가 자연히
  // 표현된다.
  //
  // 이번 단계(1단계)에서는 아래 함수들을 신규로 추가만 하고, 기존
  // handleGpsPositionUpdate 등 호출부는 아직 건드리지 않는다(계획의
  // 3단계 커밋 중 1단계 — 구조만 먼저 추가해 Node.js로 단위 검증한
  // 뒤, 다음 커밋에서 실제로 스위치한다).

  let currentMilestoneIdx = 0; // 확정된 직전 지명의 currentMilestones 인덱스
  let nextMilestoneIdx = 1;    // 다음 목표 지명의 인덱스(currentMilestoneIdx보다 크면 정방향, 작으면 역방향 — 이 부호 자체가 "구간"의 방향)

  // 현재 지명 구간을 반환한다. currentMilestones가 비었거나 아직 구간이
  // 확정 안 됐으면(코스 진입 전) null — 이때는 예외 경로(전역 탐색)를
  // 쓴다(resolveInitialSection 참고).
  function getCurrentSection() {
    const A = currentMilestones[currentMilestoneIdx];
    const B = currentMilestones[nextMilestoneIdx];
    if (!A || !B) return null;
    return { fromMilestone: A, toMilestone: B, isForward: nextMilestoneIdx > currentMilestoneIdx };
  }

  // 목표 지명(B)에 실제로 도착했을 때 호출 — 다음 구간으로 전진한다.
  // 코스 양 끝(index 0 또는 length-1)에 닿으면 진행 부호가 자동으로
  // 반전되어, 왕복 코스의 "되돌아가기"가 별도 판정 없이 자연스럽게
  // 일어난다.
  function advanceSection(arrivedAtIdx) {
    const wasForward = nextMilestoneIdx > currentMilestoneIdx;
    currentMilestoneIdx = arrivedAtIdx;
    let dir = wasForward ? 1 : -1;
    let next = currentMilestoneIdx + dir;
    if (next < 0 || next >= currentMilestones.length) dir = -dir; // 종점 도달 → 자동 반전(왕복)
    nextMilestoneIdx = currentMilestoneIdx + dir;
  }

  // 현재 구간(section)의 두 마일스톤 사이에 해당하는 points 배열
  // 인덱스 범위를 구한다 — milestone.distanceM(이미 cumulativeDistances
  // 기준)을 그 값 이하인 마지막 points 인덱스로 역산한다. 구간이
  // 바뀔 때만 호출되므로 이분탐색 없이 선형탐색으로도 충분히 빠르다.
  function findPointsIndexAtDistance(distances, targetDistM) {
    let idx = 0;
    for (let i = 0; i < distances.length; i++) {
      if (distances[i] <= targetDistM) idx = i; else break;
    }
    return idx;
  }
  function getSectionIndexRange(section) {
    const dFrom = section.fromMilestone.distanceM;
    const dTo = section.toMilestone.distanceM;
    const lo = Math.min(dFrom, dTo), hi = Math.max(dFrom, dTo);
    const idxLo = findPointsIndexAtDistance(cumulativeDistances, lo);
    const idxHi = Math.max(idxLo, findPointsIndexAtDistance(cumulativeDistances, hi));
    return { idxLo, idxHi };
  }

  // 현재 GPS 좌표를 "현재 구간"의 GPX 선분들에만 투영한다 —
  // pointToSegmentMetersWithT(기존, 변경 없음)를 구간 범위 안에서만
  // 돌리므로, 왕복 코스의 반대편(가는 길 vs 오는 길) 세그먼트는 애초에
  // 이 범위 밖이라 후보에 들 수 없다. 이게 예전에 isReversingOnTrail
  // 방향 페널티(findNearestInRange)로 억지로 막던 문제를 구조적으로
  // 없앤다 — 페널티 없이도 반대편으로 오매칭될 수가 없다.
  function projectOntoCurrentSection(lat, lon, section) {
    const { idxLo, idxHi } = getSectionIndexRange(section);
    if (!currentPoints || idxHi <= idxLo) return null;
    let best = null;
    for (let i = idxLo; i < idxHi; i++) {
      const a = currentPoints[i], b = currentPoints[i + 1];
      if (!a || !b) continue;
      const r = pointToSegmentMetersWithT(lat, lon, a.lat, a.lon, b.lat, b.lon);
      if (!best || r.distance < best.distance) best = { ...r, segmentIndex: i };
    }
    if (!best) return null;
    const routeDistance = (cumulativeDistances[best.segmentIndex] || 0) + best.t * best.segLenM;
    const a = currentPoints[best.segmentIndex], b = currentPoints[best.segmentIndex + 1];
    return {
      segmentIndex: best.segmentIndex,
      projectionRatio: best.t,
      projectedLat: a.lat + (b.lat - a.lat) * best.t,
      projectedLon: a.lon + (b.lon - a.lon) * best.t,
      routeDistance,
      distance: best.distance,
    };
  }

  // 구간이 아직 확정 안 된 상태(코스 진입 전, 또는 재획득 시)에서
  // 최초 매칭 결과(전역 탐색으로 찾은 nearestIdx)로 "그 지점이 속한
  // 첫 구간"을 역산해 currentMilestoneIdx/nextMilestoneIdx를 초기화한다.
  function resolveInitialSection(nearestIdx) {
    if (!currentMilestones || currentMilestones.length < 2) {
      currentMilestoneIdx = 0;
      nextMilestoneIdx = Math.min(1, Math.max(0, currentMilestones.length - 1));
      return;
    }
    const dist = cumulativeDistances[nearestIdx] || 0;
    // currentMilestones는 distanceM 오름차순 — dist 이하 중 가장 뒤(가까운) 것이 A
    let i = 0;
    while (i + 1 < currentMilestones.length && currentMilestones[i + 1].distanceM <= dist) i++;
    currentMilestoneIdx = i;
    nextMilestoneIdx = Math.min(i + 1, currentMilestones.length - 1);
  }

  // 🧭 회전/안내 방향 목표 지점 계산 — "단일 진행방향 소스" 설계
  // (2026-09-17 전면 재설계).
  //
  // 이전 방식(코스 로드 시 buildAutoRotationPoints로 회전 트리거를
  // 미리 목록으로 만들어둠 + computeSegmentHeading의 50m lookahead)은
  // 회전 기준 지점과, 갈림길 안내에 쓰는 turnAngle의 기준 지점(전후
  // 15m)이 서로 달라 실기기에서 반복적으로 어긋났다(사용자 재현:
  // "경로가 12시가 아니라 1시/9시", "짧은 구간에서 원점을 못 잡음").
  //
  // ⚠️ v94에서 한 번 "내 현재 위치 → 다음 목표"를 매 픽스 실시간
  // 재계산하는 방식으로 바꿨는데, 이러면 갈림길에 접근하는 동안 계속
  // 그 갈림길을 향해 회전되어 있다 — 사용자 재현: "미리 회전하면
  // 방향이 헷갈려. 갈림길 그 지점이나 지나자마자 회전하는 것." 원점은
  // 항상 "기준점(직전에 도착한 지점)에서 다음 목표를 바라보는 방향"
  // 이어야 하고, 접근하는 동안은 이전 회전값을 그대로 유지해야 한다.
  //
  // 새 설계(v95, v96에서 500m->300m, v103에서 300m->100m로 축소):
  // findNextRotationTarget(originDist, isReversing, maxLookaheadM)은
  // "기준점(originDist, 직전에 도착/통과한 지점)"에서 코스를 따라 최대
  // maxLookaheadM(생략 시 ROTATION_TARGET_MAX_LOOKAHEAD_M=100m) 앞을
  // 보되, 그 사이에 마일스톤(갈림길/봉우리/들날머리)이 있으면 그
  // 지점을, 없으면 정확히 maxLookaheadM 앞 지점을 목표로 삼는다.
  // traveledDist(현재 GPS 위치)는 이 함수에 넘기지 않는다 — 목표는
  // 기준점에서만 파생되고, 실제 위치는 updateSegmentRotationTrigger가
  // "목표에 도달했는지" 판정할 때만 별도로 쓰인다(그래야 접근 중에는
  // 회전이 흔들리지 않는다).
  //
  // ⚠️ v103: 시뮬레이션(renderSimFrame)은 이 기본값(100m)을 쓰지
  // 않고 항상 SIM_ROTATION_TARGET_LOOKAHEAD_M(500m)을 명시적으로
  // 넘긴다(사용자 지시: "시뮬레이션은 위 조건 무시해. 그냥 500m로
  // 원점 잡는 것으로 해 줘") — 실제 GPS는 갈림길 간격이 촘촘한 코스가
  // 많아 100m가 적당하지만, 시뮬레이션은 빠른 속도로 전체 코스를
  // 훑어보는 용도라 100m 간격 자동회전이 너무 잦게 느껴졌다.
  //
  // 지도 회전(applySegmentRotation)과 갈림길 "몇 시 방향" 안내
  // (showUpcomingTurnAlert)는 둘 다 이 함수가 반환하는 좌표만을
  // 원천으로 삼아 자기 시점에 맞는 방향을 계산하므로, 서로 다른
  // 지점을 기준으로 삼는 일 자체가 구조적으로 불가능해진다.
  const ROTATION_TARGET_MAX_LOOKAHEAD_M = 100;
  const SIM_ROTATION_TARGET_LOOKAHEAD_M = 500;
  function findNextRotationTarget(originDist, isReversing, maxLookaheadM) {
    if (!currentPoints || !cumulativeDistances || cumulativeDistances.length < 2) return null;
    const totalDistM = cumulativeDistances[cumulativeDistances.length - 1] || 0;
    if (totalDistM <= 0) return null;
    const lookaheadM = (maxLookaheadM === undefined) ? ROTATION_TARGET_MAX_LOOKAHEAD_M : maxLookaheadM;

    // 기준점(originDist)에서 앞으로 나아가는 방향으로 최대 lookaheadM 지점의 누적거리.
    const maxLookaheadDistM = isReversing
      ? Math.max(0, originDist - lookaheadM)
      : Math.min(totalDistM, originDist + lookaheadM);

    // 그 구간 안에 있는 마일스톤 중, 기준점에서 가장 가까운(=가장 먼저
    // 만나는) 것을 찾는다.
    let nearestMilestone = null;
    if (currentMilestones && currentMilestones.length > 0) {
      currentMilestones.forEach(m => {
        const isAheadInDirection = isReversing
          ? (m.distanceM < originDist && m.distanceM >= maxLookaheadDistM)
          : (m.distanceM > originDist && m.distanceM <= maxLookaheadDistM);
        if (!isAheadInDirection) return;
        if (!nearestMilestone || Math.abs(m.distanceM - originDist) < Math.abs(nearestMilestone.distanceM - originDist)) {
          nearestMilestone = m;
        }
      });
    }
    if (nearestMilestone) {
      return { name: nearestMilestone.name, distanceM: nearestMilestone.distanceM, lat: nearestMilestone.trailLat, lon: nearestMilestone.trailLon, isMilestone: true };
    }

    // 구간 안에 마일스톤이 없으면, 정확히 lookaheadM 앞(또는 코스 끝) 지점.
    const pt = pointAtCumulativeDistance(currentPoints, cumulativeDistances, maxLookaheadDistM);
    if (!pt) return null;
    return { name: '@' + lookaheadM + 'm', distanceM: maxLookaheadDistM, lat: pt.lat, lon: pt.lon, isMilestone: false };
  }

  // 회전각(도, 양수=우회전/음수=좌회전)을 사람이 읽는 안내 문구로 변환.
  // 직진(5도 미만)만 별도 안내가 필요 없으므로 갈림길 알람 대상에서
  // 자연히 제외된다(showUpcomingTurnAlert에서 turnLabel==='직진'이면
  // 스킵) — 예전엔 30도 문턱이라 완만하게 벌어지는 갈림길(Y자형 등)이
  // "직진"으로 분류돼 조용히 넘어갔는데, 실제로는 반대쪽 갈래로 잘못
  // 들어서기 쉬운 지점이라 안내가 필요했다.
  function classifyTurnAngle(angle) {
    const abs = Math.abs(angle);
    if (abs < 5) return '직진';
    if (angle > 0) return abs >= 120 ? '급우회전' : (abs >= 30 ? '우회전' : '약간우회전');
    return abs >= 120 ? '급좌회전' : (abs >= 30 ? '좌회전' : '약간좌회전');
  }

  // 현재 위치(누적거리 기준 traveledDist)를 기준으로 "다음 마일스톤"과
  // "직전 마일스톤"을 찾는다. graceM(기본 15m)만큼 여유를 두어, 이동
  // 중 구간 재정렬이 화면에 보이는 텍스트 안내("갈림길1 → 갈림길2")와
  // 항상 같은 목적지를 가리키도록 통일한다.
  // ⚠️ 지도 회전 트리거는 이 기본 여유값을 쓰지 않는다 — 실기기 테스트
  // 결과 15m 여유 때문에 실제로 갈림길에 도착하기도 전에 지도가 먼저
  // 회전해버려 혼란스럽다는 피드백이 있었다. 회전 판정은 graceM=0으로
  // 별도 호출해 "정확히 지난 뒤"에만 전환되게 한다(updateNavigationToast
  // 내부 참고).
  // isReversing=true면 "코스를 거꾸로(날머리 쪽에서 들머리 쪽으로) 걷는
  // 중"이라는 뜻 — 원점회귀/왕복 코스에서 정상까지 갔다가 같은 길로
  // 되돌아올 때 실제로 벌어지는 상황이다. 이때는 traveledDist 기준
  // "코스 순서상 다음"이 아니라 "코스 순서상 이전" 마일스톤이 사용자가
  // 실제로 다음에 만날 갈림길이므로, prevM/nextM을 뒤바꿔 반환한다.
  // 항상 currentMilestones(화면 안내용)를 쓴다 — 회전 트리거는 별도
  // 함수 findNextRotationTarget이 담당한다(2026-09-17 재설계 이후).
  // 🐛 2026-09-26 수정(사용자 지적: "맵 상 갈림길이 너무 많아서.. 갈림길
  // 에서 갈림길.. 이 좋을까? 큰 지명만 사용할까(들머리, 날머리, 산,
  // 봉우리, 삼거리, 고개, 배재 등, 갈림길 빼고)" → "표시만 바꾸는
  // 안(추천) 나도 이게 좋을것 같아") — 계룡산 5봉코스 실측 기준
  // 마일스톤 26개 중 13개(절반)가 "갈림길"이라, 상단 알림판이 "갈림길
  // → 갈림길 · 0.01km 남음"처럼 정보가 없는 안내를 자주 보여줬다.
  // 방향/구간 판정(getCurrentSection/maybeAdvanceSection/findNextMilestone)
  // 은 100m 게이트가 급커브를 놓치지 않도록 촘촘한 currentMilestones를
  // 그대로 써야 하므로 절대 건드리지 않는다 — 상단 알림판 "표시"에서만
  // 이름이 정확히 "갈림길"인 지점을 건너뛴 별도 목록을 쓴다. "삼거리/
  // 사거리"는 buildMilestones에서 같은 🔀 아이콘으로 묶이지만 이름
  // 자체는 다르므로(사용자 의도: 삼거리는 큰 지명으로 남김) 이름 문자열
  // 로 "갈림길"만 정확히 걸러낸다.
  function isBigLandmarkName(name) {
    return (name || '').trim() !== '갈림길';
  }
  const bigLandmarkMilestonesCache = { source: null, list: null };
  function getBigLandmarkMilestones() {
    if (bigLandmarkMilestonesCache.source === currentMilestones) {
      return bigLandmarkMilestonesCache.list;
    }
    const list = (currentMilestones || []).filter(m => isBigLandmarkName(m.name));
    bigLandmarkMilestonesCache.source = currentMilestones;
    bigLandmarkMilestonesCache.list = list;
    return list;
  }
  // findNextMilestone과 완전히 같은 탐색 로직이지만, 입력 배열만
  // "갈림길을 뺀 큰 지명 목록"으로 바꾼 표시 전용 버전 — 방향 계산에는
  // 쓰지 않는다(updateNavigationToast의 안내 문구 조립에서만 호출).
  function findNextBigLandmark(traveledDist, isReversing, graceM) {
    const source = getBigLandmarkMilestones();
    if (!source || source.length < 2) return null;
    const grace = (graceM === undefined) ? 15 : graceM;
    let prevM = source[0];
    let nextM = source[source.length - 1];
    for (let i = 0; i < source.length; i++) {
      if (source[i].distanceM <= traveledDist + grace) {
        prevM = source[i];
      }
      if (source[i].distanceM > traveledDist) {
        nextM = source[i];
        break;
      }
    }
    if (isReversing) {
      return { prevM: nextM, nextM: prevM };
    }
    return { prevM, nextM };
  }

  function findNextMilestone(traveledDist, isReversing, graceM) {
    const source = currentMilestones;
    if (!source || source.length < 2) return null;
    const grace = (graceM === undefined) ? 15 : graceM;
    let prevM = source[0];
    let nextM = source[source.length - 1];
    // ⚠️ 수정(2026-09-24): nextM(다음에 안내해야 할 지명)은 grace 여유
    // 없이 "내 위치보다 뒤에 있는 첫 지명"으로 찾는다 — grace를 그대로
    // 쓰면 지명 간 거리가 grace(15m)보다 짧거나 비슷할 때, 그 사이에
    // 있는 지명이 nextM으로 한 번도 선택되지 못하고 통째로 건너뛰어져
    // 50/30/10m 안내(showUpcomingTurnAlert)와 화살표가 그 지명에 대해
    // 아예 안 뜨는 문제가 있었다. prevM("방금 지나온 지점" 표시용)만
    // 기존 grace 로직을 유지해 화면 텍스트 전환은 매끄럽게 둔다.
    for (let i = 0; i < source.length; i++) {
      if (source[i].distanceM <= traveledDist + grace) {
        prevM = source[i];
      }
      if (source[i].distanceM > traveledDist) {
        nextM = source[i];
        break;
      }
    }
    if (isReversing) {
      // 코스 순서상 "이전" 마일스톤(prevM)이 되돌아가는 방향으로는
      // "다음" 목표가 된다 — 그 지점의 turnAngle도 진입/이탈 방향이
      // 뒤바뀌므로 화면 표시 시점에 180도 반전해서 써야 한다(호출부
      // showUpcomingTurnAlert 쪽에서 처리).
      return { prevM: nextM, nextM: prevM };
    }
    return { prevM, nextM };
  }

  function buildCumulativeDistances(points) {
    const dists = [0];
    for (let i = 1; i < points.length; i++) {
      const d = haversineMeters(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon);
      dists.push(dists[i-1] + d);
    }
    return dists;
  }

  // 🧭 내 위치 화살표 전용 방향 계산(2026-09-23 재설계) — 나침반/자이로/
  // GPS 이동방위각(raw.heading, GpsFilterEngine의 결과)을 전혀 쓰지 않고,
  // 오직 "현재 매칭된 GPX 선분이 원래 향하는 방향"만 화살표에 쓴다.
  // 코스 로드 시점에 모든 선분(points[i]->points[i+1])의 방향을 미리
  // 계산해두면, 정지 중에도 매번 재계산할 필요 없이 배열 조회만 하면
  // 되고 GPS 튐의 영향을 전혀 받지 않는다(선분 자체가 안 바뀌면 방향도
  // 안 바뀜).
  function buildSegmentBearings(points) {
    const bearings = [];
    // 🧭 세그먼트 길이도 함께 계산해 segmentLengths에 캐시한다 — 정상/갈림길
    // 등에서 GPS가 잠시 서성이며 찍힌 극단적으로 짧은 세그먼트는 방위각이
    // 사실상 무작위(실측: 남덕유산 서봉 왕복구간, 반경 1~2m 안에 30개
    // 포인트가 몰려 방위각이 0~360도 전 범위로 요동함)이므로, 왕복구간
    // 방향 페널티(findNearestInRange) 계산에서 이 길이를 참조해 걸러낸다.
    segmentLengths = [];
    for (let i = 0; i < points.length - 1; i++) {
      bearings.push(calculateBearing(points[i].lat, points[i].lon, points[i+1].lat, points[i+1].lon));
      segmentLengths.push(haversineMeters(points[i].lat, points[i].lon, points[i+1].lat, points[i+1].lon));
    }
    return bearings;
  }

  // 🧭 내 위치 화살표 방향의 단일 진입점(2026-09-23 → 2026-09-24 재설계) —
  // 나침반/자이로/GPS 이동방위각을 전혀 참조하지 않는 원칙은 그대로
  // 유지한다. 화살표 방향은 "현재 내 GPS 좌표 → 코스를 따라
  // ARROW_LOOKAHEAD_M 앞 지점"이다 — 매칭 인덱스가(왕복 구간 등에서)
  // 살짝 흔들려도 화살표는 항상 "지금 서 있는 곳 기준"으로 계산되므로
  // 실제 위치와 무관하게 튀는 문제가 없다.
  //
  // ⚠️ 2026-09-24 재설계(사용자 지시: "역방향 판정에 대한 것을 없애려고
  // 해. 단순 gpx index 의 증가냐 감소냐에 따라서 지도를 회전하고...
  // 지도에선 그냥 내가 가는 방향을 항상 앞으로 보여주고"): "역주행
  // 중이면 반대 방향을 본다"던 예전 분기를 isReversingOnTrail(3회
  // 연속 확인 후에만 전환되는 느린 값, 왕복 안내 전용) 대신
  // moveDirectionSign(지연 없이 즉시 반영되는 "지금 실제 index가
  // 증가/감소 중인지" 부호)으로 교체했다 — "역방향"이라는 별도
  // 판정 개념 자체를 없애고, 그냥 지금 이동 중인 방향을 그대로 앞으로
  // 보여준다는 취지와 일치한다. 하단 경로 알람(다음 방향점까지 몇 시
  // 방향, 왕복 시 올바른 다음 목표 탐색)은 이 변경과 무관하게
  // isReversingOnTrail을 그대로 쓴다(사용자 지시: "하단 경로 알람은
  // 현행 그대로 유지").
  //   ① TRAILHEAD_SEARCH: 아직 트랙에 진입 전 — 현재GPS → 가장 가까운
  //      경로 지점(nearestOnTrailPoint) 방향
  //   ② TRACK_NAVIGATION: 트랙 진입 후 — 현재GPS → 코스를 따라
  //      moveDirectionSign 방향으로 앞선 지점 방향
  //
  // 🐛 2026-09-25 수정(사용자 지시로 예방적 점검 중 발견): ①번 분기가
  // 예전엔 "가장 가까운 경로 지점" 대신 currentPoints[0](GPX 첫 점,
  // 들머리)로 하드코딩돼 있었다. updateTrailheadApproach/토스트(녹색선
  // 안내)는 이미 "코스 전체에서 가장 가까운 지점"(nearestPointOnTrail이
  // 찾은 nearestPoint, 들머리일 수도 코스 중간 지점일 수도 있다)을
  // 향해 안내하도록 재설계돼 있었는데(2026-09-23), 화살표만 여전히
  // 들머리로 고정돼 있어 "등산을 코스 중간에서 시작하면 토스트는 가까운
  // 지점을 가리키는데 화살표는 엉뚱하게 들머리를 가리키는" 불일치가
  // 있었다. nearestOnTrailPoint(호출부가 nearestPointOnTrail로 이미
  // 계산해둔 값)를 넘겨받아 그 지점을 향하도록 통일한다 — 넘기지 않으면
  // (레거시 호출부 호환) currentPoints[0]로 폴백한다.
  const ARROW_LOOKAHEAD_M = 15;
  // 🐛 2026-09-25 수정(사용자 재현: "남덕유산 서봉 왕복 GPX 실제 재생
  // 검증 — 서봉 정상부에서 화면 회전이 최대 125도까지 어긋남" → "거긴
  // 내가 여기저기 들러봐서 그래. 서봉에선 그냥 유턴 단순하게 해") —
  // 정상류 지점은 실측 GPS 궤적이 정상석/전망대 주변을 배회하며 찍혀
  // (실측: 남덕유산 서봉 반경 30m 안에 5개 넘는 점이 지그재그로 몰림)
  // ARROW_LOOKAHEAD_M(15m)이 그 짧고 혼란스러운 구간 안의 좌표를
  // 가리키면서 화면 회전이 급변했다. 정상류 마일스톤(isPeak) 근처
  // (PEAK_SIMPLIFY_RADIUS_M 이내)에서는 15m 대신 PEAK_LOOKAHEAD_M
  // (50m)로 훨씬 더 앞을 보게 해, 정상부의 국지적 배회를 건너뛰고
  // "전체적으로 어느 방향으로 이어지는가"(사실상 유턴 여부)만 반영한다.
  const PEAK_SIMPLIFY_RADIUS_M = 40; // 이 거리 안에서는 단순화 모드
  const PEAK_LOOKAHEAD_M = 50; // 정상 근처 전용 lookahead(15m 대신)
  function isNearPeakMilestone(traveledDist) {
    if (!currentMilestones || currentMilestones.length === 0) return false;
    return currentMilestones.some(m => m.isPeak && Math.abs(traveledDist - m.distanceM) <= PEAK_SIMPLIFY_RADIUS_M);
  }
  function computeArrowHeading(lat, lon, nearestIdx, isNearTrailheadNow, traveledDist, nearestOnTrailPoint) {
    if (isNearTrailheadNow) {
      const target = nearestOnTrailPoint || (currentPoints && currentPoints.length > 0 ? currentPoints[0] : null);
      if (!target) return null;
      return calculateBearing(lat, lon, target.lat, target.lon);
    }
    if (!currentPoints || nearestIdx < 0 || !cumulativeDistances || cumulativeDistances.length < 2) return null;
    const dist = (traveledDist !== undefined && traveledDist !== null) ? traveledDist : (cumulativeDistances[nearestIdx] || 0);
    const lookahead = isNearPeakMilestone(dist) ? PEAK_LOOKAHEAD_M : ARROW_LOOKAHEAD_M;
    const targetDist = dist + moveDirectionSign * lookahead;
    const aheadPt = findPointAheadByDistance(currentPoints, cumulativeDistances, 0, Math.max(0, targetDist));
    if (!aheadPt) return null;
    return calculateBearing(lat, lon, aheadPt.lat, aheadPt.lon);
  }

  // 🗺️ 가자맵 대원칙 재설계(2026-09-25) — computeArrowHeading의 V2.
  // moveDirectionSign(GPX index 증감 기반, 역방향 개념 의존)을 전혀
  // 쓰지 않는다. 오직 projectOntoCurrentSection()이 반환한 routeDistance
  // (현재 구간에 투영된 코스 진행거리) + lookahead만큼 "코스 시작점
  // 기준 절대 누적거리"를 앞으로 더해 그 지점을 향한 방위각을 구한다 —
  // 구간이 역방향(B→A)이어도 routeDistance 자체는 "코스 시작점부터"
  // 이미 정방향으로 누적된 값이므로, findPointAheadByDistance가 항상
  // 앞(코스 진행 방향, fromIdx 이후)으로만 찾는 것과 자연히 맞는다
  // — 역방향 구간을 걸을 때도 "코스가 실제로 이어지는 다음 지점"을
  // 정확히 가리킨다(음수 lookahead 처리가 필요 없다).
  function computeArrowHeadingV2(gpsLat, gpsLon, routeDistance) {
    if (!currentPoints || !cumulativeDistances || cumulativeDistances.length < 2 || routeDistance === null || routeDistance === undefined) return null;
    const lookahead = isNearPeakMilestone(routeDistance) ? PEAK_LOOKAHEAD_M : ARROW_LOOKAHEAD_M;
    const targetPt = pointAtCumulativeDistance(currentPoints, cumulativeDistances, routeDistance + lookahead);
    if (!targetPt) return null;
    return calculateBearing(gpsLat, gpsLon, targetPt.lat, targetPt.lon);
  }

  // 🌊 화면에 그리는 등산로 선(polyline)만 부드럽게 보이도록 Catmull-Rom
  // 스플라인으로 점을 촘촘히 보간한다(#3). GPS 매칭/거리 계산에 쓰는
  // 원본 points/cumulativeDistances는 절대 건드리지 않는다 — 이 함수의
  // 반환값은 오직 L.polyline에 넘기는 시각적 좌표 배열로만 쓰인다.
  //
  // - 점 간격이 이미 촘촘한 구간(SMOOTH_SKIP_DIST_M 미만)은 보간할
  //   필요가 없으므로 건너뛴다 — 이미 부드러운 곳에 불필요한 연산을
  //   하지 않기 위함이자, 촘촘한 지그재그(스위치백)를 스플라인이
  //   과도하게 뭉개 실제 급커브를 완만하게 왜곡하는 것을 막기 위함.
  // - 세그먼트당 SMOOTH_SEGMENTS개로 보간해, 원래 꺾이던 지점들 사이를
  //   부드러운 곡선으로 잇는다. 시작/끝 근방은 접선 추정을 위해 양 옆
  //   점을 그대로 복제(clamped Catmull-Rom)해 경로 밖으로 튀지 않게 한다.
  function smoothPolylinePoints(points) {
    if (!points || points.length < 3) return (points || []).map(p => [p.lat, p.lon]);

    const SMOOTH_SKIP_DIST_M = 8;   // 이미 이만큼 촘촘하면 그 구간은 원본 그대로
    const SMOOTH_SEGMENTS = 6;      // 한 구간을 몇 개의 선분으로 나눠 곡선을 그릴지

    const catmullRom = (p0, p1, p2, p3, t) => {
      const t2 = t * t, t3 = t2 * t;
      return 0.5 * (
        (2 * p1) +
        (-p0 + p2) * t +
        (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
        (-p0 + 3 * p1 - 3 * p2 + p3) * t3
      );
    };

    const result = [];
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? 0 : i - 1];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2 < points.length ? i + 2 : points.length - 1];

      result.push([p1.lat, p1.lon]);

      const segDist = haversineMeters(p1.lat, p1.lon, p2.lat, p2.lon);
      if (segDist < SMOOTH_SKIP_DIST_M) continue; // 이미 촘촘한 구간은 그대로 직선 연결

      for (let s = 1; s < SMOOTH_SEGMENTS; s++) {
        const t = s / SMOOTH_SEGMENTS;
        const lat = catmullRom(p0.lat, p1.lat, p2.lat, p3.lat, t);
        const lon = catmullRom(p0.lon, p1.lon, p2.lon, p3.lon, t);
        result.push([lat, lon]);
      }
    }
    const last = points[points.length - 1];
    result.push([last.lat, last.lon]);
    return result;
  }

  // 지그재그(헤어핀) 구간 오안내 방지용 전방 지점 탐색.
  // "다음 N번째 인덱스"가 아니라 "궤적을 따라 실제로 targetMeters만큼
  // 앞선 좌표"를 찾는다. 인덱스 기준으로는 GPX 점 간격에 따라 5m 앞일
  // 수도 200m 앞일 수도 있고, 급하게 꺾이는 구간에서는 산 반대편 궤적을
  // 가리킬 수 있다 — 누적거리 기준이면 이 문제가 없다.
  function findPointAheadByDistance(points, distances, fromIdx, targetMeters) {
    if (!points || points.length === 0 || fromIdx < 0) return null;
    const fromDist = distances[fromIdx];
    const targetDist = fromDist + targetMeters;

    for (let i = fromIdx; i < points.length - 1; i++) {
      if (distances[i + 1] >= targetDist) {
        // i와 i+1 사이 어딘가 — 선형 보간으로 정확한 지점을 만든다.
        const segStart = distances[i];
        const segEnd = distances[i + 1];
        const segLen = segEnd - segStart;
        const t = segLen > 0 ? (targetDist - segStart) / segLen : 0;
        return {
          lat: points[i].lat + (points[i+1].lat - points[i].lat) * t,
          lon: points[i].lon + (points[i+1].lon - points[i].lon) * t
        };
      }
    }
    // 코스 끝까지 targetMeters가 안 나오면 마지막 점을 반환 (거의 다 왔다는 뜻)
    return points[points.length - 1];
  }

  // 누적거리 기준 절대 위치(코스 시작점부터 targetDistM 지점)의 좌표를 구한다.
  // findPointAheadByDistance(fromIdx=0, targetMeters=targetDistM)와 동일하지만,
  // "현재 위치에서 앞으로 N미터"가 아니라 "코스 시작부터 N미터 지점"이라는
  // 의도를 명확히 하기 위해 별도 이름으로 감싼다 — 이동 중 구간 재정렬의
  // 구간 시작/끝 좌표를 구할 때 쓴다.
  function pointAtCumulativeDistance(points, distances, targetDistM) {
    return findPointAheadByDistance(points, distances, 0, targetDistM);
  }

  // 🐛 2026-09-26 조사(사용자 재현: gps_replay.html로 계룡산 5봉코스
  // idx=43 근처 재생 — 화면에 적용된 회전(235.8°)과 실제 눈앞 10~30m
  // GPX 방향(201~205°)이 30도 넘게 어긋나 "경로가 12시가 아니라 11시로
  // 보인다"). 처음엔 updateGajaMapCore가 "현재 위치 → 100m 앞 딱 한 점"
  // 만으로 bearing을 계산하는 게 원인이라 보고, 30m 간격 표본의 대표
  // 방향(단순 원형평균 → 거리 역가중 원형평균)으로 두 차례 교체를
  // 시도했으나, 둘 다 코스 전체 재검증(1495개 포인트)에서 오히려
  // 어긋남이 커졌다(단순평균 15.6°→44.5°, 가중평균 →64.0°). 코스
  // 전체를 "재중심 직후 화면 방향 vs 실제 다음 10m 방향" 기준으로
  // 측정한 결과, 심각한 어긋남(30도 초과)은 1495프레임 중 단 1개
  // 구간(idx=1440~1443, 약 60~70도, 그마저 급커브가 아니라 완만한
  // 곡선 도로에서 재중심 주기가 살짝 늦게 걸린 경우)뿐이었고, 나머지는
  // 재중심 직후 0~5도로 정확했다가 100m 이동하는 동안 서서히 벌어져
  // (평균 25도, 중앙값 17도) 다음 재중심에서 다시 맞춰지는 정상적인
  // 진동 패턴이었다 — "100m 이동 전까지는 방향을 바꾸지 않는다"는
  // 대원칙(§5) 자체가 만드는 트레이드오프이지 결함이 아니다. 대표방향
  // 계산 함수를 별도로 만들었다가 원복했으므로, 아래 §3/§8이 명시한
  // "100m 앞 한 점 → 방위각" 단일점 방식(updateGajaMapCore)을 그대로
  // 유지한다.
  //
  // 🧭 진행방향 계산의 단일 소스 — GPX 좌표만 사용, 센서 없음.
  // "원점"의 정의: 내 현재 위치에서, 실제로 걸어야 할 다음 목표 지점
  // (findNextRotationTarget이 반환)을 향한 직선 방향이 화면 위(12시)를
  // 향하도록 회전한다. 지도 회전과 갈림길 "몇 시 방향" 안내 모두 이
  // 함수 하나만 거치므로 서로 다른 기준점을 쓸 수 없다(2026-09-17
  // 전면 재설계 — 이전에는 회전 기준(구간 시작점+50m)과 안내 각도
  // 기준(갈림길 전후 15m)이 분리돼 있어 실기기에서 반복적으로
  // 어긋났다).
  function computeGuidanceHeading(fromLat, fromLon, targetLat, targetLon) {
    if (fromLat === undefined || fromLon === undefined || targetLat === undefined || targetLon === undefined) return null;
    if (fromLat === null || fromLon === null || targetLat === null || targetLon === null) return null;
    return calculateBearing(fromLat, fromLon, targetLat, targetLon);
  }

  // 🧭 구간회전 모드의 지도 중심 배치 — v68에서 "화면 정중앙 = 구간
  // 시작점"으로 고정했더니, 그 구간을 실제로 걷는 동안 지도가 전혀
  // 안 움직여 내 위치가 화면 밖으로 나가버리는 문제가 있었다(실기기
  // 재현). 구간 전환처럼 드문 이벤트에만 스냅해야 하는 건 "회전각"
  // 뿐이고, 지도 중심 자체는 걸음마다(매 픽스) 계속 내 위치를 따라가야
  // 한다 — v65 이전 방식(setView를 항상 내 위치로)으로 되돌린다.
  //
  // "내 위치가 화면 정중앙이면 앞길이 위쪽 절반만 보인다"는 문제는
  // 픽셀 오프셋 계산(panBy) 대신 CSS 쪽에서 해결한다: #map.heading-up의
  // top을 50%가 아니라 70%로 내려(위 CSS 참고) 회전축(=setView 중심
  // =내 위치) 자체를 화면 하단쪽에 배치했다. 그래서 여기서는 오프셋
  // 계산 없이 항상 내 위치로 그냥 setView하면 된다.
  function applyMapViewWithOffset(lat, lon, zoom, viewOpts) {
    // 🧭 길찾기 모드(isWayfindActive) 중에는 지도 중심을 완전히 고정한다
    // — 그 상태에서 오직 회전(나침반/손가락)만 걸리는 게 설계 의도다
    // (사용자 요청: "그 점은 고정이 되어야 해. 지도가 그 점을 중심으로
    // 회전을 하는 거야"). 이 체크가 없으면 GPS/시뮬레이션 픽스가
    // 계속 들어올 때마다 setView로 지도 중심이 재조정되면서, 동시에
    // 나침반 회전도 걸려 지도가 상하좌우로 제멋대로 움직이는 것처럼
    // 보였다(내 위치와 화살표 시작점이 계속 어긋나던 원인).
    if (isWayfindActive) return;
    // 구간회전 모드에서는 setView를 항상 즉시(animate:false) 반영한다 —
    // 시뮬레이션이 250ms 인터벌로 이 함수를 반복 호출하는데, 애니메이션
    // 있는 setView가 겹쳐 호출되면 지도가 흔들리며 계속 움직이는
    // 문제가 있었다(v65->v66에서 겪은 setView/panBy 충돌과 같은 계열).
    const opts = isSegmentRotationMode ? { animate: false } : viewOpts;

    // 🧭 "영점을 잡을 때도 있고 안 잡을 때도 있다"(2026-09-21, 사용자
    // 신고) 원인 수정: 이 setView가 fitRoute() 직후처럼 줌 레벨이 실제로
    // 바뀌는 시점(GPS 첫 픽스로 확대할 때 등)에 걸리면, 코드상으로는
    // "프로그램이 화면을 재배치한 것"인데도 fitRoute()와 달리
    // isProgrammaticZoomInProgress로 감싸지 않아 zoomstart/zoomend
    // 핸들러가 이를 "사용자가 직접 핀치줌한 것"으로 오판했다. 그러면
    // isMapDragReturnPending이 켜져 7초간 updateSegmentRotationTrigger
    // (영점 판정)가 완전히 막힌다 — 마침 이 setView 이전 줌과 이후 줌이
    // 우연히 같으면(zoomend 미발생) 영점이 잡히고 다르면 안 잡히는
    // 식으로 재현이 들쭉날쭉했다. fitRoute()와 동일하게 감싸 근본 차단.
    // animate:false인 setView는 moveend를 동기적으로(같은 호출 스택 안에서)
    // 발생시킬 수 있다 — 리스너를 setView 호출 "전"에 등록해야
    // 놓치지 않는다(fitRoute()는 애니메이션이 있어 비동기라 순서가
    // 상관없었지만, 여기는 opts.animate가 false일 수 있어 순서가 중요).
    isProgrammaticZoomInProgress = true;
    map.once('moveend', () => {
      isProgrammaticZoomInProgress = false;
    });
    map.setView([lat, lon], zoom, opts);
  }

  // 지도(#map)를 bearingDeg가 화면 위쪽을 향하도록 CSS 회전시킨다.
  // 부호는 이 함수 한 곳에서만 결정한다 — #map은 항상 rotate(-mapRotationDeg)로
  // 걸리고, 드래그 보정(rotateDragDelta)과 내 위치 화살표 보정
  // (handleGpsPositionUpdate 내부)은 이 mapRotationDeg 값을 참조만 할 뿐
  // 부호를 다시 결정하지 않는다("반전 후 다시 반전"하는 이중 계산을 피하기
  // 위해 과거 구현(커밋 4305106 이전)이 명시했던 원칙을 그대로 따른다).
  // CSS의 rotate()는 "최단 경로"라는 개념이 없다 — 이전 값이 -10deg이고
  // 새 값이 -350deg면, 실제로는 반대방향으로 20도만 돌면 되는데도
  // 브라우저는 산술적으로 340도를 그대로 돌아버린다(구간이 바뀔 때마다
  // 거의 한 바퀴씩 회전하는 것처럼 보였던 원인). CSS에 대입하는 각도
  // 자체를 "누적값"으로 관리해, 매번 이전 각도에서 최단 경로(-180~180
  // 범위 내 차이)만큼만 더해지도록 한다.
  let appliedMapRotationDeg = 0; // CSS에 실제로 대입해온 누적 회전값(360도 넘게 쌓일 수 있음)
  function applySegmentRotation(bearingDeg) {
    const mapEl = document.getElementById('map');
    if (!mapEl || bearingDeg === null || isNaN(bearingDeg)) return;
    const delta = shortestAngleDiff(bearingDeg, mapRotationDeg);
    appliedMapRotationDeg += delta; // 이전 CSS값 기준 최단 경로만큼만 누적
    mapEl.style.transform = `translate(-50%, -50%) rotate(${-appliedMapRotationDeg}deg)`;
    mapRotationDeg = bearingDeg;
    // 갈림길/봉우리 라벨은 #map의 자식이라 부모 회전을 그대로 물려받는다.
    // 라벨 DOM에 +appliedMapRotationDeg만큼 반대로 역회전을 걸어 최종
    // 화면 회전을 0으로 상쇄시켜, 지도가 회전해도 라벨 텍스트는 항상
    // 화면 기준 수평으로 보이게 한다(밀집 구간에서 라벨이 비스듬히
    // 돌아가며 서로 겹쳐 안 보이던 문제의 수정).
    updateRouteBadgeRotation();
  }

  // 🗺️ 가자맵 대원칙 재설계(2026-09-25) — applyLiveMapRotation(5m마다
  // 사실상 즉시 회전)을 대체할 100m 갱신 게이트. 명세: "지도 원점을
  // 매 GPS 업데이트마다 변경하지 않는다 — 최초 GPS 확정 / 약 100m
  // 이동 / 지명 구간 변경 / 백그라운드 복귀 시에만 재설정한다."
  // (이번 커밋은 함수만 추가 — 실제 handleGpsPositionUpdate 스위치는
  // 다음 커밋에서 한다.)
  let lastRecenterDistance = null;
  const RECENTER_DISTANCE_M = 100;
  function shouldRecenterBy100m(routeDistance) {
    if (lastRecenterDistance === null) return true; // 최초 GPS 확정
    return Math.abs(routeDistance - lastRecenterDistance) >= RECENTER_DISTANCE_M;
  }
  // GPS 재시작/코스 재로드/백그라운드 복귀 시 이 기준점을 초기화해야,
  // 다음 updateGajaMap 호출이 "이전 세션의 routeDistance"와 비교해
  // 부당하게 억제되지 않고 무조건 재계산한다(옛 resetLiveMapRotationState
  // 를 대체 — lastLiveRotationDist/ROTATION_MIN_MOVE_M은 죽은 코드가 되어
  // 제거했고, 이제 지도 회전 기준점은 lastRecenterDistance 하나뿐이다).
  function resetGajaMapRotationState() {
    lastRecenterDistance = null;
  }

  // 🐛 2026-09-25 수정(사용자 지적: "구간에서 내가 어디에 있든 그 구간을
  // 가는 연속성이 있지. AB 구간이면 AB 구간이야.. 구간이 쉽게 변경이 안
  // 돼") — advanceSection(구간 전진) 자체는 1단계에서 정의만 해두고
  // 실제로는 어디서도 호출하지 않고 있었다. 그 결과 구간이 코스 진입
  // 이후 영원히 첫 구간에 고정되는 결함이 있었다(계룡산 5봉코스 1495개
  // 실측 포인트 재생 검증으로 발견 — 구간 전환이 0회였음). 여기서
  // "목표 지명(B)의 절대 누적거리에 실제로 도달했는가"를 routeDistance
  // (구간과 무관한 코스 시작점 기준 절대 누적거리)로 판정해 전진시킨다.
  // 순간 좌표 하나로 "B 반경 20m 이내"를 판정하지 않는 이유: GPS 튐
  // 한 프레임으로 B 근처를 스치기만 해도 구간이 넘어가 버리면 "쉽게
  // 변경 안 된다"는 원칙이 깨진다. 대신 "B의 routeDistance를 실제로
  // SECTION_ADVANCE_MARGIN_M만큼 지나쳤다"는 더 강한 조건(단순 근접이
  // 아니라 실제 통과)으로 좁혀 안전판을 둔다.
  const SECTION_ADVANCE_MARGIN_M = 15;
  function maybeAdvanceSection(section, proj) {
    if (!section || !proj) return false;
    const targetDist = section.toMilestone.distanceM;
    const passedForward = section.isForward && proj.routeDistance >= targetDist - SECTION_ADVANCE_MARGIN_M;
    const passedBackward = !section.isForward && proj.routeDistance <= targetDist + SECTION_ADVANCE_MARGIN_M;
    if (!passedForward && !passedBackward) return false;
    const arrivedMilestoneIdx = currentMilestones.findIndex(m => m === section.toMilestone);
    advanceSection(arrivedMilestoneIdx >= 0 ? arrivedMilestoneIdx : nextMilestoneIdx);
    return true;
  }

  // 명세의 핵심 함수: 현재 GPS → 현재 구간 → 구간 투영 → 100m 앞
  // 목표점 → 방위각 → 그 방향을 화면 12시로(applySegmentRotation).
  // isOffTrailState/이탈 여부를 인자로도 클로저로도 전혀 참조하지
  // 않는다 — 이탈 상태가 지도 방향에 영향을 주는 경로 자체가 이
  // 함수의 시그니처 안에 존재할 수 없다(명세 "이탈 상태가 지도 방향을
  // 변경하게 하지 않는다"를 구조적으로 보장).
  function updateGajaMap(gpsLat, gpsLon) {
    const section = getCurrentSection();
    if (!section) return null; // 구간 미확정 — 호출부가 resolveInitialSection으로 먼저 확정해야 함
    const proj = projectOntoCurrentSection(gpsLat, gpsLon, section);
    if (!proj) return null;

    // 구간 목표 지점을 실제로 지나쳤으면 다음 구간으로 전진 — 회전
    // 게이트(100m) 판정보다 먼저 해야, 전진 직후 새 구간 기준으로
    // shouldRecenterBy100m/목표점 계산이 이뤄진다.
    if (maybeAdvanceSection(section, proj)) {
      const newSection = getCurrentSection();
      if (!newSection) return { section, proj, recentered: false };
      const newProj = projectOntoCurrentSection(gpsLat, gpsLon, newSection);
      if (!newProj) return { section: newSection, proj, recentered: false };
      return updateGajaMapCore(newSection, newProj, gpsLat, gpsLon);
    }
    return updateGajaMapCore(section, proj, gpsLat, gpsLon);
  }

  function updateGajaMapCore(section, proj, gpsLat, gpsLon) {
    // 🐛 2026-09-26 수정(사용자 지적: "등산시작 버튼 클릭 후 GPS가 연결
    // 되고 내가 어디에서 어디로 가고 있는지 판정이 나면 그때가 시작점이야.
    // 그 점하고 다음 구간 시작점하고 12시 방향으로 경로가 오게 해야
    // 해.. 그래야 100m 이동전까지 방향을 바꾸지 않는다에 대한 왜곡이
    // 해소가 될 것 같아" → 이어서 "다음 구간 시작점"의 의미를 확인 질문한
    // 결과: "눈앞 진행방향"으로 확정됨, 먼 마일스톤 지명이 아님) —
    // 최초 GPS 확정(lastRecenterDistance===null) 시점에도 그 이후와
    // 똑같이 "100m 앞 한 점"을 목표로 삼고 있었다. 코스 시작 직후엔
    // 아직 100m를 걷지도 않았는데 100m나 떨어진 먼 목표를 보고 방향을
    // 정하다 보니, 첫 화면부터 눈앞 경로와 어긋나 보였다(들머리 근처는
    // 특히 방향이 자주 꺾여 이 어긋남이 더 크게 드러남).
    //
    // 🐛 1차 시도(section.toMilestone 방향)의 실패: 목표를 "구간의 최종
    // 목표 지명"으로 잡았더니, 계룡산 검증에서 목표 지명이 1469m나 멀리
    // 있어 실제 눈앞 10m 방향과 136도나 어긋났다 — 사용자 확인 결과
    // "다음 구간 시작점"은 먼 마일스톤이 아니라 "눈앞 진행방향"을
    // 뜻했다. computeArrowHeadingV2(화살표)가 이미 쓰는 ARROW_LOOKAHEAD_M
    // (15m, 정상류는 PEAK_LOOKAHEAD_M 50m)과 같은 가까운 lookahead로
    // 최초 확정 목표를 잡는다 — 화살표와 지도 회전이 최초 확정 순간부터
    // 같은 값을 공유해(명세 §23 "지도=GPX방향, 화살표=GPX방향") 자연히
    // 일치한다. 최초 이후(100m 경과로 재중심하는 매 시점)는 원래대로
    // "100m 앞"을 그대로 유지한다 — §3/§8의 100m 목표는 "코스 중간을
    // 안정적으로 걷는 동안"에 대한 규칙이지, 시작 순간까지 포함하는
    // 규칙이 아니었다는 재해석이다.
    const isInitialFix = lastRecenterDistance === null;
    if (!isInitialFix && !shouldRecenterBy100m(proj.routeDistance)) {
      return { section, proj, recentered: false };
    }

    const lookaheadM = isInitialFix
      ? (isNearPeakMilestone(proj.routeDistance) ? PEAK_LOOKAHEAD_M : ARROW_LOOKAHEAD_M)
      : RECENTER_DISTANCE_M;
    const targetPt = pointAtCumulativeDistance(currentPoints, cumulativeDistances, proj.routeDistance + lookaheadM);
    if (!targetPt) return { section, proj, recentered: false };
    const bearing = calculateBearing(gpsLat, gpsLon, targetPt.lat, targetPt.lon);
    applySegmentRotation(bearing); // 기존 함수 그대로 — translate(-50%,-50%) 등 위치 보정 그대로 보존됨
    lastRecenterDistance = proj.routeDistance;
    return { section, proj, recentered: true, bearing };
  }

  // 🗺️ 백그라운드/포그라운드 복귀·손가락 드래그 종료·홈 버튼을 하나로
  // 통일하는 재계산 진입점(명세 19·21항: "기존 회전값을 그대로 신뢰
  // 하지 않는다", "드래그 종료 후 자동복귀 시 새로 계산한다" — 예전
  // 코드는 이 세 지점에서 각각 "기존 mapRotationDeg를 그대로 재적용"
  // 하거나 개별적으로 리셋했는데, 그 패턴 자체가 명세 위반이었다).
  // lastRecenterDistance를 강제로 리셋해 다음 updateGajaMap 호출이
  // 무조건 재계산(recentered:true)하도록 만든다.
  function recalculateGajaMapFromScratch(reason) {
    if (!lastKnownPos) return;
    lastRecenterDistance = null;
    if (!getCurrentSection()) {
      const nearest = findNearestInRange(lastKnownPos.lat, lastKnownPos.lon, currentPoints, 0, Math.max(0, (currentPoints ? currentPoints.length : 1) - 2));
      if (nearest) resolveInitialSection(nearest.index);
    }
    updateGajaMap(lastKnownPos.lat, lastKnownPos.lon);
  }

  // routeBadgeEls의 모든 라벨 DOM에 현재 appliedMapRotationDeg만큼
  // 역회전을 다시 적용한다 — applySegmentRotation이 회전할 때, 그리고
  // 구간회전 모드가 꺼져 지도가 북쪽 고정(0도)으로 복귀할 때 둘 다
  // 호출해 라벨이 항상 실제 지도 회전과 정확히 반대값을 유지하게 한다.
  function updateRouteBadgeRotation() {
    routeBadgeEls.forEach(marker => {
      const el = marker.getElement && marker.getElement();
      if (!el) return;
      const badge = el.querySelector('.route-badge');
      if (badge) badge.style.transform = `rotate(${appliedMapRotationDeg}deg)`;
    });
  }

  // 상대 각도를 시계 방향(1시~12시) 및 방향 화살표로 변환 — 현재는
  // 직접 호출부가 없지만(재설계로 turnLabel/turnAngle 방식으로 대체),
  // 향후 "길찾기 모드"(별도 설계 예정)에서 재사용할 수 있어 남겨둔다.
  function angleDiffToClockDirection(angleDiff) {
    const norm = ((angleDiff % 360) + 360) % 360; // 0 ~ 360도 정규화
    if (norm >= 345 || norm < 15) return { clock: '12시 방향 (직진)', arrow: '⬆️' };
    if (norm >= 15 && norm < 45) return { clock: '1시 방향', arrow: '↗️' };
    if (norm >= 45 && norm < 75) return { clock: '2시 방향', arrow: '↗️' };
    if (norm >= 75 && norm < 105) return { clock: '3시 방향 (우회전)', arrow: '➡️' };
    if (norm >= 105 && norm < 135) return { clock: '4시 방향', arrow: '↘️' };
    if (norm >= 135 && norm < 165) return { clock: '5시 방향', arrow: '↘️' };
    if (norm >= 165 && norm < 195) return { clock: '6시 방향 (되돌아가기)', arrow: '⬇️' };
    if (norm >= 195 && norm < 225) return { clock: '7시 방향', arrow: '↙️' };
    if (norm >= 225 && norm < 255) return { clock: '8시 방향', arrow: '↙️' };
    if (norm >= 255 && norm < 285) return { clock: '9시 방향 (좌회전)', arrow: '⬅️' };
    if (norm >= 285 && norm < 315) return { clock: '10시 방향', arrow: '↖️' };
    if (norm >= 315 && norm < 345) return { clock: '11시 방향', arrow: '↖️' };
    return { clock: '12시 방향', arrow: '⬆️' };
  }

  // 방위각 차이를 "오른쪽/왼쪽" 쉬운 말로 변환 — 이탈 시 복귀 방향 안내용.
  // ⚠️ "왼쪽으로 많이"처럼 방향·정도만 말하고 동사(행동)가 빠지면
  // 사용자가 "그래서 뭘 어쩌라는 거지?"로 받아들인다(사용자 재현:
  // "19m 벗어났다. 왼쪽으로 많이.. ?? 이게 무슨 말이지.. 어찌라고?").
  // 항상 "~쪽으로 [돌아서/방향을 트세요]"처럼 완결된 지시문으로
  // 끝내야 한다.
  function angleDiffToPlainKorean(angleDiff) {
    const abs = Math.abs(angleDiff);
    const side = angleDiff >= 0 ? '오른쪽' : '왼쪽';
    if (abs <= 15) return '그대로 직진하세요';
    if (abs <= 45) return `${side}으로 조금 방향을 트세요`;
    if (abs <= 100) return `${side}으로 방향을 트세요`;
    return `${side}으로 크게 돌아서 경로를 찾으세요`;
  }

  // ===================================================================
  // 🧭 WAYFINDING_MODE(2026-09-23 전면 재설계) — 명세 8~11번.
  // 나침반/자이로/손가락 회전 다이얼을 전혀 쓰지 않는다. GPX 위에
  // 이미 등록된 주요지점(currentMilestones — 갈림길/봉우리/지명)만을
  // 목적지 후보로 쓴다. "GPX 전체에서 가장 가까운 좌표"로 직선 안내하는
  // 방식은 절벽/계곡 건너편을 가리킬 수 있어 금지(명세 16번 금지1).
  //
  // 목적지 선택: 현재 누적거리(traveledDist)보다 앞서 있는 주요지점 중
  // 가장 가까운 것 — 기존 findNextMilestone과 동일한 방식(사용자 확정).
  // 도착하면 자동으로 그 다음 주요지점으로 넘어간다.
  //
  // isWayfindActive는 기존 파일 전역에서 "지도 중심을 고정할지"를
  // 판단하는 플래그로 이미 여러 곳(applyMapViewWithOffset,
  // updateSegmentRotationTrigger)에서 참조되고 있어 이름을 그대로
  // 재사용한다 — WAYFINDING_MODE 진입/종료와 동일한 생명주기를 갖는다.
  let isWayfindActive = false;
  let wayfindingTargetMilestone = null; // 현재 안내 중인 목적지 주요지점 객체
  const WAYFINDING_ARRIVAL_RADIUS_M = 15; // 목적지 도착 판정 거리

  // 현재 누적거리(traveledDist)보다 앞서 있는 주요지점 중 가장 가까운
  // 것을 찾는다 — findNextMilestone과 동일한 "누적거리 기준" 원칙을
  // 따르되, WAYFINDING 전용으로 별도 구현한다(findNextMilestone은 화면
  // 상단 토스트의 prevM/nextM 쌍을 반환하는 다른 용도라 그대로 재사용하면
  // 혼선이 생긴다).
  function findNextWaypointMilestone(traveledDist) {
    if (!currentMilestones || currentMilestones.length === 0) return null;
    let best = null;
    currentMilestones.forEach(m => {
      if (m.distanceM > traveledDist) {
        if (!best || m.distanceM < best.distanceM) best = m;
      }
    });
    return best;
  }

  // 현재 위치 기준으로 목적지를 갱신하고, 도착했으면 다음 주요지점으로
  // 자동 전환한다. handleGpsPositionUpdate에서 매 픽스마다 호출한다.
  // 🐛 2026-09-25: 하단 패널(wayfindingPanel, 목적지명·거리·복귀 버튼)을
  // 제거하면서, 그 패널 전용이던 RETURN_TO_ORIGIN(들머리 복귀) 진입점도
  // 함께 제거했다 — getWayfindingTargetPoint/isReturnToOriginMode 분기,
  // 패널 DOM 텍스트 갱신 코드도 함께 정리. 녹색 안내선(guideLine) 자체는
  // 그대로 유지된다.
  function updateWayfindingProgress(lat, lon, nearestIdx) {
    if (!isWayfindActive) return;

    if (!wayfindingTargetMilestone) {
      // 최초 진입 시 첫 목적지를 정한다.
      const traveledDist = (cumulativeDistances && nearestIdx >= 0) ? (cumulativeDistances[nearestIdx] || 0) : 0;
      wayfindingTargetMilestone = findNextWaypointMilestone(traveledDist);
    }

    const target = wayfindingTargetMilestone;
    if (!target) {
      // 더 이상 안내할 주요지점이 없음(날머리를 지났거나 마지막 지점).
      if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
      return;
    }

    const distToTarget = haversineMeters(lat, lon, target.lat, target.lon);

    // 목적지까지 녹색 안내선(명세 10번) — 기존 guideLine(이탈 시 등산로
    // 복귀용 점선)을 그대로 재사용한다. 용도는 다르지만 "현재 위치 →
    // 목표 좌표"를 잇는 녹색 점선이라는 모양은 동일하다.
    const guideCoords = [[lat, lon], [target.lat, target.lon]];
    if (!guideLine) {
      guideLine = L.polyline(guideCoords, {
        color: '#00e676', weight: 3.5, dashArray: '6, 8', opacity: 0.95
      }).addTo(map);
    } else {
      guideLine.setLatLngs(guideCoords);
    }

    // 도착 판정 → 다음 목적지 자동 전환(명세 11번).
    if (distToTarget <= WAYFINDING_ARRIVAL_RADIUS_M) {
      const traveledDist = (cumulativeDistances && nearestIdx >= 0) ? (cumulativeDistances[nearestIdx] || 0) : 0;
      const nextTarget = findNextWaypointMilestone(traveledDist);
      if (nextTarget && nextTarget !== wayfindingTargetMilestone) {
        showToastBadge(`✅ ${wayfindingTargetMilestone ? wayfindingTargetMilestone.name : ''} 도착 — 다음: ${nextTarget.name}`);
      }
      wayfindingTargetMilestone = nextTarget;
    }
  }

  // 우측 하단 🔍 버튼 — 사용자가 직접 눌러야 진입(수동 진입, 사용자 확정).
  // 🐛 2026-09-25 수정(사용자 지시: "길찾기모드 돋보기 아이콘 클릭하면
  // 하단에 나오는 메세지 없애줘" → "계속 떠있는 하단 패널 전체" →
  // "아이콘 on off 기능"): 하단에 계속 떠있던 wayfindingPanel(다음
  // 목표 거리 + 복귀/종료 버튼)을 완전히 제거했다. on/off 표시는
  // 기존처럼 🔍 버튼 자체의 .active 클래스(진한 배경)만으로 하고,
  // 켜기/끄기 모두 이 아이콘 재클릭으로 토글한다(toggleWayfindingMode).
  // 패널에만 있던 "🔄 복귀"(들머리로 되돌아가기) 버튼은 이 패널과 함께
  // 제거됐다 — 쓸 UI 자리가 없어졌고, 왕복 코스의 자동 역주행 감지
  // (isReversingOnTrail)가 방향 안내는 별도로 계속 담당한다.
  function openWayfindingMode() {
    if (!currentMilestones || currentMilestones.length === 0) {
      alert('이 코스에는 안내할 주요 지점(갈림길/봉우리/지명)이 없습니다.');
      return;
    }
    if (!lastKnownPos) {
      alert('현재 위치를 아직 확인할 수 없어요.\n[내 위치] 버튼을 먼저 눌러주세요.');
      return;
    }
    isWayfindActive = true;
    wayfindingTargetMilestone = null; // updateWayfindingProgress가 다음 픽스에서 첫 목적지를 정함
    const btn = document.getElementById('wayfindBtn');
    if (btn) btn.classList.add('active');
    showToastBadge('🔍 길찾기 모드 시작\n다음 주요 지점까지 녹색선으로 안내합니다.');
  }
  window.openWayfindingMode = openWayfindingMode;

  // 🔍 길찾기 버튼 토글(2026-09-23 추가) — 꺼진 상태에서 누르면 열고,
  // 켜진 상태에서 누르면 닫는다. openWayfindingMode/closeWayfindingMode
  // 각각의 기존 검증·정리 로직은 그대로 두고, 이 함수는 현재
  // isWayfindActive 값만 보고 둘 중 하나로 분기한다.
  function toggleWayfindingMode() {
    if (isWayfindActive) {
      closeWayfindingMode();
    } else {
      openWayfindingMode();
    }
  }
  window.toggleWayfindingMode = toggleWayfindingMode;

  function closeWayfindingMode() {
    isWayfindActive = false;
    wayfindingTargetMilestone = null;
    // 🔍 상단 토글 버튼도 함께 꺼진 상태(비활성 배경)로 되돌린다 —
    // 이 함수가 (1)버튼 재클릭으로 토글되거나 (2)날머리/들머리 자동
    // 도착으로 호출되거나 어느 경로로 닫히든 버튼 표시가 항상 실제
    // 상태(isWayfindActive)와 일치하게 한다.
    const btn = document.getElementById('wayfindBtn');
    if (btn) btn.classList.remove('active');
    if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
  }
  window.closeWayfindingMode = closeWayfindingMode;


  // 코스를 새로 열거나 바꿀 때 윈도우 기준점을 초기화한다.
  // 이걸 안 하면 이전 코스에서 남은 인덱스를 기준으로 새 코스를 윈도우
  // 탐색하게 되어 엉뚱한 결과가 나올 수 있다.
  function resetTrailSearchWindow() {
    lastNearestIdx = -1;
    // 🧭 LOCKED 상태로 남아있으면 다음 nearestPointOnTrail 호출이 옛
    // 코스/옛 위치 기준 N/N+1만 계속 보게 된다 — 반드시 SEARCHING으로
    // 되돌려 전역 재탐색부터 다시 시작하게 한다.
    trailTrackingMode = 'SEARCHING';
    offCandidateStreak = 0;
    // trackDirection 상태도 함께 초기화 — 이전 코스/이전 위치의 이력이
    // 새 코스의 방향 판별에 섞여 들어가면 안 된다.
    resetTrackDirectionState();
  }

  // 타일 좌표 계산 함수
  function latLonToTile(lat, lon, zoom) {
    const latRad = lat * Math.PI / 180;
    const n = Math.pow(2, zoom);
    const x = Math.floor((lon + 180) / 360 * n);
    const y = Math.floor((1 - Math.asinh(Math.tan(latRad)) / Math.PI) / 2 * n);
    return { x, y };
  }

  function getTilesForBounds(minLat, maxLat, minLon, maxLon, zoom) {
    const p1 = latLonToTile(maxLat, minLon, zoom);
    const p2 = latLonToTile(minLat, maxLon, zoom);
    const minX = Math.min(p1.x, p2.x);
    const maxX = Math.max(p1.x, p2.x);
    const minY = Math.min(p1.y, p2.y);
    const maxY = Math.max(p1.y, p2.y);

    const tiles = [];
    for (let x = minX; x <= maxX; x++) {
      for (let y = minY; y <= maxY; y++) {
        tiles.push({ z: zoom, x, y });
      }
    }
    return tiles;
  }

  // GPX 파싱
  function parseGPX(xmlText) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, 'application/xml');
    const trkpts = Array.from(xml.getElementsByTagName('trkpt'));
    if (!trkpts.length) throw new Error('트랙 좌표를 찾을 수 없습니다.');

    const points = trkpts.map(pt => {
      const lat = parseFloat(pt.getAttribute('lat'));
      const lon = parseFloat(pt.getAttribute('lon'));
      const eleEl = pt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      const timeEl = pt.getElementsByTagName('time')[0];
      const time = timeEl ? new Date(timeEl.textContent) : null;
      return { lat, lon, ele, time };
    }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));

    const cleanedPoints = removeGpxSpikes(points);
    const wpts = Array.from(xml.getElementsByTagName('wpt')).map(wpt => {
      const lat = parseFloat(wpt.getAttribute('lat'));
      const lon = parseFloat(wpt.getAttribute('lon'));
      const nameEl = wpt.getElementsByTagName('name')[0];
      const name = nameEl ? nameEl.textContent.trim() : '';
      const eleEl = wpt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      return { lat, lon, name, ele };
    }).filter(w => !isNaN(w.lat) && !isNaN(w.lon) && w.name);
    cleanedPoints.waypoints = wpts;
    return cleanedPoints;
  }

  // 개선 5: GPX 파일 자체에 기록 당시 GPS 오차로 생긴 "스파이크"(실제
  // 등산로는 완만한데 좌표 하나가 뾰족하게 튀어나온 지점)를 걸러낸다.
  // 이런 스파이크는 실시간 GPS 노이즈와 달리 파일에 이미 박제되어 있어
  // 매번 그 지점을 지날 때마다 방향 계산이 똑같이 틀어지는 원인이었다.
  //
  // 판정 기준: 연속된 세 점(A-B-C)에서 A→B 방향과 B→C 방향이 급격히
  // 꺾이면서(150도 이상, 거의 되돌아오는 수준) 동시에 B가 A-C 직선에서
  // 비정상적으로 멀리 떨어져 있으면(스파이크 폭 대비 A-C 거리가 매우
  // 짧음) 스파이크로 간주해 B를 제거한다. 실제 등산로의 급한 코너(정상,
  // 갈림길 등)는 A-C 거리 자체가 어느 정도 되므로 이 조건에 잘 안 걸린다.
  function removeGpxSpikes(points) {
    if (!points || points.length < 3) return points;

    const SPIKE_ANGLE_THRESHOLD = 150; // 이 각도(deg) 이상 급격히 꺾이면 의심
    const SPIKE_MAX_AC_DIST_M = 15;    // A-C 거리가 이보다 짧으면 "제자리에서 튄" 스파이크로 판정

    const result = [points[0]];
    for (let i = 1; i < points.length - 1; i++) {
      const a = result[result.length - 1];
      const b = points[i];
      const c = points[i + 1];

      const bearingAB = calculateBearing(a.lat, a.lon, b.lat, b.lon);
      const bearingBC = calculateBearing(b.lat, b.lon, c.lat, c.lon);
      const turnAngle = Math.abs(shortestAngleDiff(bearingBC, bearingAB));
      const distAC = haversineMeters(a.lat, a.lon, c.lat, c.lon);

      const isSpike = turnAngle >= SPIKE_ANGLE_THRESHOLD && distAC <= SPIKE_MAX_AC_DIST_M;
      if (isSpike) {
        console.warn(`⚠️ GPX 스파이크 감지 및 제거: 인덱스 ${i}, 꺾인각 ${turnAngle.toFixed(1)}°, A-C거리 ${distAC.toFixed(1)}m`);
        continue; // b를 건너뛰고 result에 넣지 않음
      }
      result.push(b);
    }
    result.push(points[points.length - 1]);
    return result;
  }

  // 산에서 여러 코스를 오프라인으로 골라볼 수 있도록 배열로 보관하되,
  // 같은 GPX 파일이나 같은 코스는 반드시 1개만 유지하며 최신 내용으로 갱신(upsert)한다.
  const SAVED_ROUTES_KEY = 'saved_hiking_routes_v2';
  // 3 -> 10으로 상향(2026-09-21, #2). 산행 준비하며 여러 코스를 검토하는
  // 사용 패턴에서, 정작 실제로 갈 코스가 목록에서 밀려나 오프라인 타일까지
  // 함께 삭제되는 문제가 있었다(cleanupEvictedCourseTiles가 밀려난 코스의
  // 캐시를 정리) — 집에서 미리 다운로드해뒀는데도 산에서 지도가 안 뜨는
  // 것으로 체감됐다. 좌표 데이터+타일 캐시 모두 코스당 용량이 크지 않아
  // 10개로 늘려도 저장공간 부담은 미미하다.
  const MAX_SAVED_ROUTES = 10;

  function extractGpxFileName(str) {
    if (!str) return '';
    try { str = decodeURIComponent(str); } catch(e) {}
    const m = str.match(/([^\/\?#&=:"']+\.gpx)/i);
    return m ? m[1].toLowerCase().replace(/\.gpx$/i, '').trim() : '';
  }

  function normalizeCourseKey(name, url) {
    const file = extractGpxFileName(url) || extractGpxFileName(name);
    if (file) {
      return file.replace(/[_-\s]+/g, '').toLowerCase();
    }
    if (name) {
      let n = name;
      try { n = decodeURIComponent(n); } catch(e) {}
      return n.replace(/^🚩\s*/, '')
              .replace(/등산지도|등산로|지도/g, '')
              .replace(/[_-\s]+/g, '')
              .toLowerCase()
              .trim();
    }
    return '';
  }

  function isSameRoute(a, b) {
    if (!a || !b) return false;
    if (a.sourceUrl && b.sourceUrl && a.sourceUrl === b.sourceUrl) return true;
    const keyA = normalizeCourseKey(a.name, a.sourceUrl);
    const keyB = normalizeCourseKey(b.name, b.sourceUrl);
    if (keyA && keyB && keyA === keyB) return true;
    return false;
  }

  function loadSavedRoutes() {
    try {
      const raw = localStorage.getItem(SAVED_ROUTES_KEY);
      const list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) return [];

      // 기존 저장 목록에 동일 코스가 중복 누적된 경우 최신 1개만 남기고 자동 정리
      const unique = [];
      list.forEach(item => {
        if (!unique.some(u => isSameRoute(u, item))) {
          unique.push(item);
        }
      });
      let isModified = unique.length !== list.length;
      if (unique.length > MAX_SAVED_ROUTES) {
        unique.length = MAX_SAVED_ROUTES;
        isModified = true;
      }
      
      if (isModified) {
        localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(unique));
        // 정리된 초과 코스가 있다면 캐시된 지도 타일(이미지)도 비워줌
        if (typeof cleanupEvictedCourseTiles === 'function') {
          cleanupEvictedCourseTiles().catch(() => {});
        }
      }
      return unique;
    } catch(e) { return []; }
  }

  // 🔁 "마지막으로 연 코스"를 별도로 기억해둔다 — 홈 화면 아이콘이
  // 자동으로 그 코스를 이어서 열게 하기 위해서다.
  //
