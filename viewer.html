  <title>gajago 등산지도</title>
  <script>
    // 스마트폰 바탕화면(PWA) 구버전 캐시 즉시 탈출 & 최신 코드 자동 활성화
    (function() {
      const APP_BUILD = 'v20260907_0535';
      try {
        if (localStorage.getItem('gajago_app_build') !== APP_BUILD) {
          localStorage.setItem('gajago_app_build', APP_BUILD);
          if ('caches' in window) {
            caches.keys().then(keys => {
              keys.filter(k => k !== 'gaja-trail-cache-v4').forEach(k => caches.delete(k));
            });
          }
          if (!sessionStorage.getItem('gajago_reloaded_flag')) {
            sessionStorage.setItem('gajago_reloaded_flag', '1');
            window.location.reload();
            return;
          }
        }
      } catch(e) {}
    })();

    (function() {
      try {
        const p = new URLSearchParams(window.location.search);
        let n = p.get('name') || p.get('title');
        let u = p.get('url') || p.get('file');
        if (!n && u) {
          const m = decodeURIComponent(u).match(/([^\/\?#&=:"']+\.gpx)/i);
          if (m && m[1]) {
            n = m[1].replace(/\.gpx$/i, '').replace(/_\d{8}$/, '').replace(/_{2,}/g, ' ').replace(/_/g, ' ').trim();
          }
        }
        if (n) {
          let name = decodeURIComponent(n).trim();
          if (!name.includes('등산지도') && !name.includes('등산로') && !name.includes('지도')) {
            name = name + ' 등산지도';
          }
          document.title = name;
          const meta = document.getElementById('appleAppTitle');
          if (meta) meta.content = name;
        }
      } catch(e) {}
    })();
  </script>

  <!-- 로컬 캐시 가능한 Leaflet 오픈소스 지도 엔진 -->
  <link rel="stylesheet" href="./leaflet.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 상단 헤더 바 */

<!-- 지도 레이어 선택 메뉴 -->

  <div class="layer-item selected" id="lyrTerrain" onclick="switchLayer('terrain')">⛰️ 네이버 지형도(등고선)</div>
  <div class="layer-item" id="lyrBasic" onclick="switchLayer('basic')">🧭 네이버 일반지도</div>

<!-- 저장된 코스 목록 모달 (오프라인 코스 선택 전용) -->

    <div style="margin-top: 16px; font-size: 12px; color: #2e7d32; font-weight: 700; text-align: center;">👣 Crafted by <b>gajago</b></div>
    <!-- 저장된 코스 목록이 있을 때 아래에 표시 -->

<!-- 플로팅 GPS 상태 뱃지 (내 위치 켰을 때만 표시) -->
<div class="gps-toast" id="gpsToast"></div>

<script>
  // 1. PWA 서비스 워커 등록 (산속 오프라인 지도 캐싱 지원 및 최신 자동 새로고침)
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=5')
        .then(reg => {
          reg.update(); // 최신 버전 감지 즉시 백그라운드 갱신
          console.log('PWA ServiceWorker 등록 및 갱신 완료:', reg.scope);
        })
        .catch(err => console.warn('PWA ServiceWorker 등록 알림:', err));
    });
  }

  let map = null;
  let currentLayer = null;
  let polyline = null;
  let markers = [];
  let currentPoints = [];
  let userGpsMarker = null;
  let watchId = null;
  let currentHeading = null;
  let lastKnownPos = null;
  let prevGpsPos = null;
  let isCompassActive = false;
  let guideLine = null; // 등산로 연결 점선 가이드

  function getKoreanDirection(deg) {
    const dirs = ['북(N)', '북동(NE)', '동(E)', '남동(SE)', '남(S)', '남서(SW)', '서(W)', '북서(NW)'];
    const idx = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
    return dirs[idx];
  }

  function getKoreanDirectionShort(deg) {
    const dirs = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
    const idx = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
    return dirs[idx];
  }

  function calculateBearing(lat1, lon1, lat2, lon2) {
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
              Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
    let brng = Math.atan2(y, x) * 180 / Math.PI;
    return (brng + 360) % 360;
  }

  let smoothedHeading = null;
  let continuousHeading = 0;   // 360도 경계 스핀 방지용 연속 각도
  let lastToastUpdate = 0;

  function shortestAngleDiff(target, current) {
    let diff = (target - current) % 360;
    if (diff < -180) diff += 360;
    if (diff > 180) diff -= 360;
    return diff;
  }

  function updateHeadingDisplay(heading, rotAngle) {
    if (heading === null || isNaN(heading)) return;
    currentHeading = ((heading % 360) + 360) % 360;
    const continuousRot = rotAngle !== undefined ? rotAngle : currentHeading;

    // 1. 지도 위 내 위치 파란 점의 전방 조명 빔 & 화살표 회전 (연속 각도로 스핀 방지)
    const wrapper = document.getElementById('gpsHeadingWrapper');
    if (wrapper) {
      wrapper.style.transform = `rotate(${continuousRot}deg)`;
    }

    // 2. 🧭 화면 우측 플로팅 나침반 바늘 회전 (-continuousRot: 바늘의 빨간 N극이 항상 북쪽을 가리킴)
    const dial = document.getElementById('compassDial');
    if (dial) {
      dial.style.transform = `rotate(${-continuousRot}deg)`;
    }
    const degEl = document.getElementById('compassDeg');
    if (degEl) {
      degEl.innerText = getKoreanDirectionShort(currentHeading);
    }

    // 3. GPS 활성화 중이면 하단 상태 토스트 갱신 (텍스트 깜빡임 방지: 0.3초마다 갱신)
    const now = Date.now();
    if (watchId !== null && now - lastToastUpdate > 300) {
      lastToastUpdate = now;
      const toast = document.getElementById('gpsToast');
      if (toast && toast.style.display !== 'none' && !toast.innerText.includes('이탈')) {
        const headStr = `${getKoreanDirection(currentHeading)} (${Math.round(currentHeading)}°)`;
        toast.innerText = `🧭 진행방향: ${headStr} · 등산로 진행 중`;
      }
    }
  }

  // 나침반 센서 이벤트 (지수 이동 평균 필터 + 1.2도 미세 노이즈 무시로 어지러운 떨림 100% 제거)
  function handleOrientation(e) {
    let heading = null;
    // iOS Safari
    if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
      heading = e.webkitCompassHeading;
    } 
    // Android Chrome / Samsung Internet
    else if (e.alpha !== undefined && e.alpha !== null) {
      heading = (360 - e.alpha) % 360;
    }
    if (heading === null || isNaN(heading)) return;

    // 첫 시작 시 초기화
    if (smoothedHeading === null) {
      smoothedHeading = heading;
      continuousHeading = heading;
      updateHeadingDisplay(smoothedHeading, continuousHeading);
      return;
    }

    // 최단 각도 오차 계산 (-180 ~ +180)
    const diff = shortestAngleDiff(heading, smoothedHeading);

    // ⭐ 핵심 개선: 1.2도 이하의 미세한 손떨림 및 센서 전기 노이즈는 완전히 무시하여 바늘을 차분하게 안정화!
    if (Math.abs(diff) < 1.2) {
      return;
    }

    // 지수 가중 평활화 필터 (고급 오일 감쇠 나침반처럼 부드럽고 묵직하게 회전)
    const filterFactor = 0.18;
    continuousHeading += diff * filterFactor;
    smoothedHeading = ((continuousHeading % 360) + 360) % 360;

    updateHeadingDisplay(smoothedHeading, continuousHeading);
  }

  function initCompass() {
    if (isCompassActive) return;
    isCompassActive = true;

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {

        .then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        })
        .catch(() => {});
    } else {
      window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      window.addEventListener('deviceorientation', handleOrientation, true);
    }
  }

  // 버전 번호를 고정한다. 온라인일 때마다 최신 버전을 새로 받아오면, 이전에
  // 저장해둔 오프라인 타일 캐시의 URL(버전 포함)과 새 요청 URL이 달라져
  // 캐시가 있어도 매번 다시 다운로드하는 문제가 있었다. 네이버 타일 서버의
  // 버전 문자열은 실제로 거의 바뀌지 않으므로 고정값으로 캐시 재사용을
  // 보장하고, 버전이 바뀌어 지도가 깨지는 게 확인되면 이 값만 수동으로
  // 갱신한다.
  const naverTileVersion = '1788514292';

  // 2. 지도 초기화

  function switchLayer(type) {

    layerItems.forEach(el => el.classList.remove('selected'));

  // 두 좌표 간 거리 계산 (미터)
  function haversineMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // 타일 좌표 계산 함수
  function latLonToTile(lat, lon, zoom) {
    const latRad = lat * Math.PI / 180;
    const n = Math.pow(2, zoom);
    const x = Math.floor((lon + 180) / 360 * n);
    const y = Math.floor((1 - Math.asinh(Math.tan(latRad)) / Math.PI) / 2 * n);
    return { x, y };
  }

  function getTilesForBounds(minLat, maxLat, minLon, maxLon, zoom) {
    const p1 = latLonToTile(maxLat, minLon, zoom);
    const p2 = latLonToTile(minLat, maxLon, zoom);
    const minX = Math.min(p1.x, p2.x);
    const maxX = Math.max(p1.x, p2.x);
    const minY = Math.min(p1.y, p2.y);
    const maxY = Math.max(p1.y, p2.y);

    const tiles = [];
    for (let x = minX; x <= maxX; x++) {
      for (let y = minY; y <= maxY; y++) {
        tiles.push({ z: zoom, x, y });
      }
    }
    return tiles;
  }

  // GPX 파싱
  function parseGPX(xmlText) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlText, 'application/xml');
    const trkpts = Array.from(xml.getElementsByTagName('trkpt'));
    if (!trkpts.length) throw new Error('트랙 좌표를 찾을 수 없습니다.');

    return trkpts.map(pt => {
      const lat = parseFloat(pt.getAttribute('lat'));
      const lon = parseFloat(pt.getAttribute('lon'));
      const eleEl = pt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      const timeEl = pt.getElementsByTagName('time')[0];
      const time = timeEl ? new Date(timeEl.textContent) : null;
      return { lat, lon, ele, time };
    }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
  }

  // 산에서 여러 코스를 오프라인으로 골라볼 수 있도록 배열로 보관하되,
  // 같은 GPX 파일이나 같은 코스는 반드시 1개만 유지하며 최신 내용으로 갱신(upsert)한다.
  const SAVED_ROUTES_KEY = 'saved_hiking_routes_v1';
  const MAX_SAVED_ROUTES = 5;

  function extractGpxFileName(str) {
    if (!str) return '';
    try { str = decodeURIComponent(str); } catch(e) {}
    const m = str.match(/([^\/\?#&=:"']+\.gpx)/i);
    return m ? m[1].toLowerCase().replace(/\.gpx$/i, '').trim() : '';
  }

  function normalizeCourseKey(name, url) {
    const file = extractGpxFileName(url) || extractGpxFileName(name);
    if (file) {
      return file.replace(/[_-\s]+/g, '').toLowerCase();
    }
    if (name) {
      let n = name;
      try { n = decodeURIComponent(n); } catch(e) {}
      return n.replace(/^🚩\s*/, '')
              .replace(/등산지도|등산로|지도/g, '')
              .replace(/[_-\s]+/g, '')
              .toLowerCase()
              .trim();
    }
    return '';
  }

  function isSameRoute(a, b) {
    if (!a || !b) return false;
    if (a.sourceUrl && b.sourceUrl && a.sourceUrl === b.sourceUrl) return true;
    const keyA = normalizeCourseKey(a.name, a.sourceUrl);
    const keyB = normalizeCourseKey(b.name, b.sourceUrl);
    if (keyA && keyB && keyA === keyB) return true;
    return false;
  }

  function loadSavedRoutes() {
    try {
      const raw = localStorage.getItem(SAVED_ROUTES_KEY);
      const list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) return [];

      // 기존 저장 목록에 동일 코스가 중복 누적된 경우 최신 1개만 남기고 자동 정리
      const unique = [];
      list.forEach(item => {
        if (!unique.some(u => isSameRoute(u, item))) {
          unique.push(item);
        }
      });
      if (unique.length !== list.length) {
        localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(unique));
      }
      return unique;
    } catch(e) { return []; }
  }

  function saveRouteToStorage(courseName, sourceUrl, points) {
    try {
      const newRoute = {
        name: courseName,
        sourceUrl: sourceUrl || null,
        points: points,
        savedAt: Date.now()
      };
      let list = loadSavedRoutes();
      // 같은 코스가 이미 있으면 기존 항목을 모두 제거하고 최신으로 맨 앞에 1개만 등록
      list = list.filter(r => !isSameRoute(r, newRoute));
      list.unshift(newRoute);
      if (list.length > MAX_SAVED_ROUTES) list = list.slice(0, MAX_SAVED_ROUTES);
      localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(list));
    } catch(e) {
      try {
        let list = loadSavedRoutes();
        list = list.slice(0, Math.ceil(list.length / 2));
        const newRoute = { name: courseName, sourceUrl: sourceUrl || null, points: points, savedAt: Date.now() };
        list = list.filter(r => !isSameRoute(r, newRoute));
        list.unshift(newRoute);
        localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(list));
      } catch(e2) {}
    }
  }

  function findSavedRoute(courseName, url) {
    const target = { name: courseName, sourceUrl: url };
    return loadSavedRoutes().find(r => isSameRoute(r, target)) || null;
  }

  // 경로 그리기
  // sourceUrl: 로컬 저장소 키로 쓰는 GPX 원본 주소. 코스명(courseName)만으로는
  // 서로 다른 GPX가 같은 이름으로 뽑혀 캐시가 뒤섞이는 문제가 있었다 —
  // 반드시 원본 URL로 구분해야 한다.
  function drawRoute(points, courseName, sourceUrl, isFromCache) {
    if (!map || !points.length) return;
    currentPoints = points;

    if (polyline) map.removeLayer(polyline);
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const latlngs = points.map(p => [p.lat, p.lon]);

    // 깔끔하고 선명한 등산로 빨간선
    polyline = L.polyline(latlngs, {
      color: '#d32f2f',
      weight: 5,
      opacity: 0.95
    }).addTo(map);

    fitRoute();

    const start = points[0];
    const end = points[points.length - 1];

    const makeBadge = (lat, lon, title, bg) => {
      const icon = L.divIcon({
        className: 'custom-badge-icon',
        html: `<div class="route-badge" style="background:${bg};">${title}</div>`,
        iconAnchor: [30, 12]
      });
      return L.marker([lat, lon], { icon }).addTo(map);
    };

    markers.push(makeBadge(start.lat, start.lon, '🚩 들머리', '#1976d2'));
    markers.push(makeBadge(end.lat, end.lon, '🏁 날머리', '#d32f2f'));

    const withEle = points.filter(p => p.ele !== null);
    if (withEle.length) {
      const peak = withEle.reduce((a, b) => b.ele > a.ele ? b : a);
      markers.push(makeBadge(peak.lat, peak.lon, `⛰️ 정상 (${Math.round(peak.ele)}m)`, '#e65100'));
    }

    // 거리 및 고도 정보 계산 생략 (지도 화면 극대화)

    if (courseName) {
      document.getElementById('trailName').innerText = '🚩 ' + courseName;
      let cleanTitle = courseName.replace(/^🚩\s*/, '').trim();
      if (!cleanTitle.includes('등산지도') && !cleanTitle.includes('등산로') && !cleanTitle.includes('지도')) {
        cleanTitle += ' 등산지도';
      }
      document.title = cleanTitle;
      const meta = document.getElementById('appleAppTitle');
      if (meta) meta.content = cleanTitle;
    }

    // 로컬 저장소에 코스 좌표 영구 보관 (산속에서 재접속 시 0.01초 만에 즉시 복원,
    // 여러 코스를 동시에 보관해 오프라인 상태에서도 목록에서 골라볼 수 있다)
    saveRouteToStorage(courseName, sourceUrl, points);

    document.getElementById('emptyModal').style.display = 'none';

    // 지도가 열리는 즉시 백그라운드에서 오프라인 등산지도 자동 캐시 저장!
    if (!isFromCache) {
      autoSaveOfflineMap(points);
    }
  }

  // 코스를 화면 시각적 정중앙에 정확히 배치 (상단 헤더 여백 보정)
  function fitRoute() {
    if (!map || !polyline) return;
    map.fitBounds(polyline.getBounds(), {
      paddingTopLeft: [40, 85],
      paddingBottomRight: [40, 45]
    });
  }

  // 지도가 열리면 자동으로 주변 지형도 타일을 백그라운드 캐싱 (산속 통신두절 대비)
  let isSavingCache = false;
  async function autoSaveOfflineMap(points) {
    if (isSavingCache || !points || !points.length) return;
    isSavingCache = true;

    // 상단 자동 저장 미니 알림 뱃지
    let badge = document.getElementById('offlineAutoBadge');
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'offlineAutoBadge';
      badge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#ffffff; font-size:12px; font-weight:700; padding:8px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.2); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.6s ease;';
      document.body.appendChild(badge);
    }
    badge.style.opacity = '1';
    badge.innerText = '💾 오프라인 등산지도 자동 저장 중... (0%)';

    // 경로의 기하학적 중심 계산
    let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
    points.forEach(p => {
      if (p.lat < minLat) minLat = p.lat;
      if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon;
      if (p.lon > maxLon) maxLon = p.lon;
    });

    const centerLat = (minLat + maxLat) / 2;
    const centerLon = (minLon + maxLon) / 2;

    // 위도 및 경도 방향의 실제 거리(km) 계산
    const latDistKm = (maxLat - minLat) * 111.0;
    const lonDistKm = (maxLon - minLon) * 111.0 * Math.cos(centerLat * Math.PI / 180);

    // 한쪽으로 치우치지 않도록 더 긴 축 기준으로 동서남북 사방 동일 반경(정사각형 대칭) 설정
    const maxHalfKm = Math.max(latDistKm, lonDistKm) / 2.0;
    const padKm = 1.6; // 사방 균일 여유 마진 (약 1.6km)
    const radiusKm = maxHalfKm + padKm;

    const dLat = radiusKm / 111.0;
    const dLon = radiusKm / (111.0 * Math.cos(centerLat * Math.PI / 180));

    const symMinLat = centerLat - dLat;
    const symMaxLat = centerLat + dLat;
    const symMinLon = centerLon - dLon;
    const symMaxLon = centerLon + dLon;

    // 사방 대칭 정사각형 영역으로 줌 13~17 타일 목록 생성
    const tileUrls = [];
    for (let z = 13; z <= 17; z++) {
      const tiles = getTilesForBounds(symMinLat, symMaxLat, symMinLon, symMaxLon, z);
      tiles.forEach(t => {
        tileUrls.push(`https://map.pstatic.net/nrb/styles/terrain/${naverTileVersion}/${t.z}/${t.x}/${t.y}.png`);
      });
    }

    const total = tileUrls.length;

    try {
      const cache = await caches.open('gaja-trail-cache-v5');
      await cache.addAll(['./viewer.html', './leaflet.js', './leaflet.css']).catch(() => {});

      let completed = 0;
      let failedCount = 0;
      const batchSize = 12;
      for (let i = 0; i < tileUrls.length; i += batchSize) {
        const batch = tileUrls.slice(i, i + batchSize);
        await Promise.all(batch.map(async url => {
          try {
            const match = await cache.match(url);
            if (!match) {
              const res = await fetch(url, { mode: 'cors' });
              if (res.ok) {
                await cache.put(url, res);
              } else {
                failedCount++;
              }
            }
          } catch(e) {
            failedCount++;
          }
          completed++;
        }));
        const pct = Math.round((completed / total) * 100);
        badge.innerText = `💾 오프라인 등산지도 자동 저장 중... (${pct}%)`;
      }

      if (failedCount === 0) {
        badge.innerText = '✅ 오프라인 등산지도 저장 완료! (산속 통신두절 대비)';
        badge.style.background = 'rgba(46,125,50,0.95)';
      } else {
        badge.innerText = `⚠️ 오프라인 저장 완료 (일부 타일 ${failedCount}개 실패 — 오프라인 시 해당 구간 미표시될 수 있음)`;
        badge.style.background = 'rgba(230,81,0,0.95)';
      }
      setTimeout(() => {
        badge.style.opacity = '0';
        setTimeout(() => badge.remove(), 600);
      }, 3000);
    } catch(err) {
      console.warn('오프라인 캐시 자동 저장 실패:', err);
      badge.remove();
    }
  }

  // 모달 닫기
  function closeModal() {
    const modal = document.getElementById('emptyModal');
    if (modal) modal.style.display = 'none';
  }

  // 🌟 저장된 등산로 코스 목록 팝업 열기 (전역 함수로 언제든지 즉시 호출 가능)
  function showSavedRouteList(message) {
    const routes = loadSavedRoutes();
    const modal = document.getElementById('emptyModal');
    if (!modal) return;
    const desc = document.getElementById('modalDesc');
    const listEl = document.getElementById('savedRouteList');

    if (!routes || routes.length === 0) {
      if (desc) desc.innerHTML = message || '현재 오프라인으로 저장된 등산로 코스가 없습니다.<br><br>💡 GPX 파일을 열거나 블로그 등산지도 링크를 누르시면 자동으로 저장됩니다.';
      if (listEl) {
        listEl.innerHTML = '';
        listEl.style.display = 'none';
      }
      modal.style.display = 'flex';
      return;
    }

    if (desc) desc.innerHTML = message || '저장된 코스를 터치하시면 오프라인 지도로 즉시 열립니다.';
    if (listEl) {
      listEl.innerHTML = routes.map((r, i) => {
        const dateStr = r.savedAt ? new Date(r.savedAt).toLocaleDateString('ko-KR') : '';
        const safeName = (r.name || '등산 코스').replace(/</g, '&lt;');
        return `
          <div class="saved-route-item" onclick="openSavedRouteByIndex(${i})">
            <div class="saved-route-info">
              <div class="saved-route-name">⛰️ ${safeName}</div>
              <div class="saved-route-date">저장일: ${dateStr}</div>
            </div>
            <button type="button" class="saved-route-del" onclick="deleteSavedRouteByIndex(event, ${i})" title="이 코스 삭제">
              🗑️
            </button>
          </div>
        `;
      }).join('');
      listEl.style.display = 'flex';
    }
    modal.style.display = 'flex';
  }
  window.showSavedRouteList = showSavedRouteList;

  function openSavedRouteByIndex(index) {
    const routes = loadSavedRoutes();
    const r = routes[index];
    if (!r) return;
    closeModal();
    drawRoute(r.points, r.name, r.sourceUrl);
  }
  window.openSavedRouteByIndex = openSavedRouteByIndex;

  function deleteSavedRouteByIndex(event, index) {
    if (event) event.stopPropagation();
    const routes = loadSavedRoutes();
    const target = routes[index];
    const targetName = target ? target.name : '이 코스';
    if (confirm(`'${targetName}' 코스를 저장 목록에서 삭제하시겠습니까?`)) {
      routes.splice(index, 1);
      localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(routes));
      showSavedRouteList();
    }
  }
  window.deleteSavedRouteByIndex = deleteSavedRouteByIndex;

  // PC 드래그 앤 드롭(Drag & Drop) 파일 열기 지원
  window.addEventListener('dragover', (e) => {
    e.preventDefault();
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      const file = e.dataTransfer.files[0];
      if (file.name.toLowerCase().endsWith('.gpx')) {
        const fakeEvt = { target: { files: [file] } };
        onFileSelected(fakeEvt);
      } else {
        alert('.gpx 등산로 파일만 열 수 있습니다.');
      }
    }
  });

  function onFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;

    const courseName = file.name.replace(/\.gpx$/i, '').replace(/_/g, ' ');
    const sourceUrl = 'file:' + file.name;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const points = parseGPX(evt.target.result);
        closeModal();
        drawRoute(points, courseName, sourceUrl);
      } catch(err) {
        alert('GPX 파일 오류: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // 실시간 GPS 내 위치 추적 (확대 지도, 나침반 방향 빔, 등산로 복귀 가이드)
  function toggleGPS() {
    const btn = document.getElementById('gpsBtn');
    const toast = document.getElementById('gpsToast');

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      stopCompass();
      if (userGpsMarker) { map.removeLayer(userGpsMarker); userGpsMarker = null; }
      if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
      btn.classList.remove('active');
      toast.style.display = 'none';
      return;
    }

    if (!navigator.geolocation) {
      alert('스마트폰 GPS 기능을 지원하지 않는 브라우저입니다.');
      return;
    }

    // 나침반 센서 즉시 활성화 (사용자 클릭 직후이므로 모바일 권한 부여 성공)
    initCompass();

    btn.classList.add('active');
    toast.style.display = 'block';
    toast.className = 'gps-toast';
    toast.innerText = '📡 위성 GPS 신호 및 나침반 방향 수신 중...';

    let isFirstFix = true;

    watchId = navigator.geolocation.watchPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const accuracy = Math.round(pos.coords.accuracy);
        lastKnownPos = { lat, lon };

        // GPS 이동 방향이 지원되면 우선 반영
        if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
          updateHeadingDisplay(pos.coords.heading);
        } else if (prevGpsPos) {
          const moveDist = haversineMeters(prevGpsPos.lat, prevGpsPos.lon, lat, lon);
          if (moveDist > 2.5) {
            const moveHeading = calculateBearing(prevGpsPos.lat, prevGpsPos.lon, lat, lon);
            updateHeadingDisplay(moveHeading);
          }
        }
        prevGpsPos = { lat, lon };

        // 등산로 상 가장 가까운 지점 탐색
        let minDistanceM = 999999;
        let nearestPoint = null;
        if (currentPoints && currentPoints.length > 0) {
          for (let i = 0; i < currentPoints.length; i++) {
            const p = currentPoints[i];
            const d = haversineMeters(lat, lon, p.lat, p.lon);
            if (d < minDistanceM) {
              minDistanceM = d;
              nearestPoint = p;
            }
          }
        }

        // 마커 생성 또는 이동
        if (!userGpsMarker) {
          const gpsIcon = L.divIcon({
            className: 'custom-gps-icon',
            html: createGpsIconHtml(currentHeading),
            iconSize: [80, 80],
            iconAnchor: [40, 40]
          });
          userGpsMarker = L.marker([lat, lon], { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);
          // ⭐ 핵심 기능: 일반 등산 GPX 앱처럼 내 위치로 즉시 이동하고 상세 등산로(줌 16)로 시원하게 확대!
          map.setView([lat, lon], Math.max(map.getZoom(), 16), { animate: true });
        } else {
          userGpsMarker.setLatLng([lat, lon]);
          if (isFirstFix) {
            map.setView([lat, lon], Math.max(map.getZoom(), 16), { animate: true });
          }
        }
        isFirstFix = false;

        // ⭐ 갈 방향 안내 (등산로를 찾아가는 가이드 점선 표시)
        if (nearestPoint && minDistanceM > 12) {
          const guideCoords = [[lat, lon], [nearestPoint.lat, nearestPoint.lon]];
          if (!guideLine) {
            guideLine = L.polyline(guideCoords, {
              color: '#00e676',
              weight: 3.5,
              dashArray: '6, 8',
              opacity: 0.95
            }).addTo(map);
          } else {
            guideLine.setLatLngs(guideCoords);
          }
        } else if (guideLine) {
          map.removeLayer(guideLine);
          guideLine = null;
        }

        // 진행 방향 텍스트 계산
        const headStr = currentHeading !== null ? `${getKoreanDirection(currentHeading)} (${Math.round(currentHeading)}°)` : '방향 측정 중';

        if (nearestPoint && minDistanceM > 35) {
          const toTrailBearing = calculateBearing(lat, lon, nearestPoint.lat, nearestPoint.lon);
          const toTrailDir = getKoreanDirection(toTrailBearing);
          toast.className = 'gps-toast warning';
          toast.innerText = `⚠️ 코스 이탈 (${Math.round(minDistanceM)}m) 👉 복귀 방향: ${toTrailDir}쪽 [녹색 점선]`;
        } else {
          toast.className = 'gps-toast';
          toast.innerText = `🧭 나아갈 방향: ${headStr} · 등산로 정상 진행 중 (±${accuracy}m)`;
        }
      },
      err => {
        toast.className = 'gps-toast warning';
        toast.innerText = '⚠️ GPS 신호 수신 실패 (스마트폰 위치 권한 허용 필요)';
        btn.classList.remove('active');
        watchId = null;
        stopCompass();
        if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
      },
      { enableHighAccuracy: true, maximumAge: 2000 }
    );
  }

  // 느린 프록시에서 무한정 기다리지 않도록 각 시도마다 제한시간을 둔다.
  // 스마트폰 이동통신망에서는 corsproxy.io 응답이 수십 초씩 걸리는 경우가
  // 실제로 있었는데, 타임아웃이 없으면 다음 단계(더 빠를 수 있는 경로)로
  // 못 넘어가고 그 프록시 하나만 계속 기다리게 된다.
  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  // 외부 서버(네이버 등) 및 깃허브 tracks에서 안전하게 GPX를 가져오는 고성능 로더
  async function fetchGPXFile(targetUrl) {
    let cleanUrl = targetUrl.trim();
    // %25EA 등 이중 인코딩된 URL을 완전 해독 후 올바른 1회 인코딩 적용
    for (let i = 0; i < 3; i++) {
      try {
        const next = decodeURIComponent(cleanUrl);
        if (next === cleanUrl) break;
        cleanUrl = next;
      } catch(e) { break; }
    }
    try {
      cleanUrl = encodeURI(cleanUrl);
    } catch(e) {}

    const errors = [];

    // 1. 직접 다운로드 시도 (GitHub Pages, Raw, CORS 허용 서버 등)
    try {
      const res = await fetchWithTimeout(cleanUrl, 5000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`1) 직접 다운로드: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`1) 직접 다운로드 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`1) 직접 다운로드 실패: ${e.message || '네트워크/CORS 제한'}`);
    }

    // 2. 🌟 핵심 복구 기능: 네이버 블로그 링크가 만료(403)되었을 때
    // URL 속 파일명(예: 남덕유산_20250501.gpx)을 추출하여 우리 tracks 저장소에서 즉시 대체 로드!
    try {
      const match = cleanUrl.match(/([^\/\?#&=:"']+\.gpx)/i);
      if (match && match[1]) {
        let fname = match[1];
        try { fname = decodeURIComponent(fname); } catch(e) {}
        const fallbacks = [
          `./tracks/${encodeURIComponent(fname)}`,
          `https://hjwpro1971.github.io/gaja/tracks/${encodeURIComponent(fname)}`,
          `https://raw.githubusercontent.com/hjwpro1971/gaja/main/tracks/${encodeURIComponent(fname)}`
        ];
        for (const fb of fallbacks) {
          try {
            const res = await fetchWithTimeout(fb, 5000);
            if (res.ok) {
              const text = await res.text();
              if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
                console.log('대체 트랙 저장소에서 복구 성공:', fb);
                return text;
              }
            }
          } catch(e) {}
        }
        errors.push(`2) 저장소 대체 복구: '${fname}' 파일 없음`);
      } else {
        errors.push(`2) 저장소 대체 복구: 파일명 추출 불가`);
      }
    } catch(e) {
      errors.push(`2) 저장소 대체 복구 실패: ${e.message}`);
    }

    // 3. allorigins 공개 프록시 시도
    try {
      const res = await fetchWithTimeout('https://api.allorigins.win/raw?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`3) 공개 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`3) 공개 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`3) 공개 프록시 실패: ${e.message || '타임아웃'}`);
    }

    // 4. 나스 서버 로컬 프록시 시도
    try {
      const res = await fetchWithTimeout('/api/gpx-proxy?url=' + encodeURIComponent(cleanUrl), 6000);
      if (res.ok) {
        const text = await res.text();
        if (text && (text.includes('<trkpt') || text.includes('<gpx') || text.includes('<wpt'))) {
          return text;
        }
        errors.push(`4) 로컬 프록시: 정상 GPX 아님 (HTTP ${res.status})`);
      } else {
        errors.push(`4) 로컬 프록시 실패: HTTP ${res.status}`);
      }
    } catch(e) {
      errors.push(`4) 로컬 프록시 실패: ${e.message || '연결 불가'}`);
    }

    throw new Error('모든 방식으로 등산로 파일을 불러오지 못했습니다.\n[상세 사유]\n' + errors.join('\n'));
  }

  window.addEventListener('DOMContentLoaded', async () => {
    initMap();

    const urlParams = new URLSearchParams(window.location.search);
    const hadGpxUrl = !!(urlParams.get('url') || urlParams.get('file'));
    let gpxUrl = urlParams.get('url') || urlParams.get('file');
    const courseName = urlParams.get('name');
    let decodedCourseName = courseName ? decodeURIComponent(courseName) : '';

    if (!decodedCourseName && gpxUrl) {
      const m = decodeURIComponent(gpxUrl).match(/([^\/\?#&=:"']+\.gpx)/i);
      if (m && m[1]) {
        decodedCourseName = m[1].replace(/\.gpx$/i, '').replace(/_\d{8}$/, '').replace(/_{2,}/g, ' ').replace(/_/g, ' ').trim();
      }
    }
    if (!decodedCourseName) decodedCourseName = '등산로 코스';

    // 페이지 진입 즉시 상단 헤더 및 창 타이틀에 산 이름 반영
    const trailEl = document.getElementById('trailName');
    if (trailEl) trailEl.innerText = '🚩 ' + decodedCourseName;
    let pageTitle = decodedCourseName;
    if (!pageTitle.includes('등산지도') && !pageTitle.includes('등산로') && !pageTitle.includes('지도')) {
      pageTitle += ' 등산지도';
    }
    document.title = pageTitle;
    const appleMeta = document.getElementById('appleAppTitle');
    if (appleMeta) appleMeta.content = pageTitle;

    // 같은 코스를 다시 열 때 매번 외부 프록시를 거쳐 GPX를 재다운로드하지
    // 않도록, url 파라미터가 있으면 먼저 localStorage에 같은 원본 GPX
    // 주소(sourceUrl)로 저장된 좌표가 있는지 찾아본다. 코스명이 아니라
    // 반드시 원본 주소로 비교해야 한다 — "남덕유산_20250501.gpx"와
    // "남덕유산_20251217.gpx"처럼 코스명은 같아도 실제로는 전혀 다른 GPX인
    // 경우가 있어, 이름만 보고 캐시를 재사용하면 엉뚱한 지도가 뜨는 버그가
    // 있었다.
    // 🌟 핵심: 다운받기 전에 캐시에 이미 저장되어 있는지 먼저 체크!
    // 동일한 GPX 파일명 또는 코스명이 이미 있으면 외부 다운로드를 하지 않고 캐시에서 즉시 복원 (0.001초 로딩 & 중복 방지)
    if (gpxUrl || decodedCourseName) {
      const cached = findSavedRoute(decodedCourseName, gpxUrl);
      if (cached) {
        console.log('⚡ 이미 저장된 등산로 코스가 캐시에 있어 외부 다운로드를 생략하고 즉시 엽니다:', cached.name);
        drawRoute(cached.points, cached.name, cached.sourceUrl || gpxUrl, true); // isFromCache = true
        gpxUrl = null; // 외부 다운로드 생략

        // 상단에 캐시 즉시 복원 완료 안내 뱃지 1.8초간 표시
        const fastBadge = document.createElement('div');
        fastBadge.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:99999; background:rgba(27,94,32,0.95); color:#ffffff; font-size:13px; font-weight:800; padding:10px 20px; border-radius:24px; box-shadow:0 4px 16px rgba(0,0,0,0.3); backdrop-filter:blur(4px); pointer-events:none; transition:opacity 0.5s;';
        fastBadge.innerHTML = '⚡ 저장된 코스로 즉시 열었습니다 (다운로드 생략)';
        document.body.appendChild(fastBadge);
        setTimeout(() => {
          fastBadge.style.opacity = '0';
          setTimeout(() => fastBadge.remove(), 500);
        }, 1800);
      }
    }

    if (gpxUrl) {
      // 로딩 안내 뱃지 화면 상단 표시
      const loadingEl = document.createElement('div');
      loadingEl.id = 'gpxLoadingBadge';
      loadingEl.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:9999; background:rgba(27,94,32,0.92); color:#fff; font-size:13px; font-weight:700; padding:10px 18px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.25); backdrop-filter:blur(4px); pointer-events:none;';
      loadingEl.innerText = '⏳ 등산로 코스를 불러오는 중입니다...';
      document.body.appendChild(loadingEl);

      try {
        const xml = await fetchGPXFile(gpxUrl);
        const points = parseGPX(xml);
        drawRoute(points, decodedCourseName, gpxUrl);
        if (document.getElementById('gpxLoadingBadge')) {
          document.getElementById('gpxLoadingBadge').remove();
        }
      } catch(err) {
        console.warn('자동 GPX 다운로드 실패:', err);
        if (document.getElementById('gpxLoadingBadge')) {
          document.getElementById('gpxLoadingBadge').remove();
        }
        alert('⚠️ 등산로 GPX 파일을 불러오지 못했습니다.\n\n원인: ' + err.message + '\n\n💡 네이버 블로그 다운로드 링크는 생성 후 시간이 지나면 네이버 보안 정책상 주소가 만료됩니다.\n[등산로 지도 링크 생성기]에서 영구 보관된 코스를 선택하시거나 새 링크를 확인해 주세요.');
        showSavedRouteList('⚠️ GPX 파일을 불러오지 못했습니다.');
      }
    } else if (!hadGpxUrl) {
      // url 파라미터 없이 열린 경우(즐겨찾기 등) — 저장된 코스 목록을 보여준다.
      // 산속에서 완전히 오프라인이어도 이전에 저장해둔 여러 코스 중 하나를
      // 골라 바로 열어볼 수 있어야 한다는 게 이 기능의 목적이다.
      showSavedRouteList();
    }


  });
</script>
