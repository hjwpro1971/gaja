    if (progressRatio < progressRatioThreshold) {
      return 'pass'; // 명확한 정상 통과(급커브 등) — 진행비율 자체가 낮으면 의심의 여지가 적다
    }

    // 진입 직전 구간의 진행방위각 vs 이탈 직후 구간의 진행방위각
    const beforeEntryIdx = Math.max(0, entryIdx - 1);
    const afterExitIdx = Math.min(points.length - 1, exitIdx + 1);
    if (beforeEntryIdx === entryIdx || afterExitIdx === exitIdx) {
      // 트랙 맨 앞/뒤라 전후 구간을 비교할 수 없는 애매한 경우 —
      // 'turnaround'로 묶어 보존하고 사용자 확인 대상에 포함시킨다.
      return 'turnaround';
    }
    const inBearing = calcBearingDeg(points[beforeEntryIdx].lat, points[beforeEntryIdx].lon, entryPt.lat, entryPt.lon);
    const outBearing = calcBearingDeg(exitPt.lat, exitPt.lon, points[afterExitIdx].lat, points[afterExitIdx].lon);
    const dirDiff = shortestAngleDiffDeg(inBearing, outBearing);

    return dirDiff >= directionDiffThresholdDeg ? 'turnaround' : 'loiter';
  }

  // 🐛 2026-10-02 수정(사용자 지시: "서봉 정점 좌표를 기준으로 해.
  // 거기서 유턴을 하던지 더 진행을하던지.. 모든 기준점이 될거야") —
  // findStationaryClusters(연속 반경 탐욕적 탐색)는 사람이 waypoint
  // 주변을 "넓게"(반경을 살짝 들락날락하며) 서성이면, 그 배회 전체를
  // 하나로 못 묶고 여러 조각(대부분 'pass'로 오분류)으로 쪼갰다
  // (실측: 서봉 근처 250개 점 중 145개만 압축되고 나머지는 "짧은
  // 급커브"로 오판됨 — radiusM을 8m→20m로 넓혀도 마찬가지였다, 탐색
  // 방식 자체의 한계였기 때문).
  //
  // waypoint 좌표를 기준점으로 고정하면 이 문제가 구조적으로 사라진다
  // — "이 waypoint로부터 반경 R 이내에 있는 모든 점"을 좌표 거리로
  // 직접 찾으므로, 중간에 살짝 반경을 벗어났다 들어와도 끊기지 않는다
  // (waypoint 1개 자체가 고정 중심이므로 "연속"일 필요가 없다).
  //
  // 🐛 2026-10-02 추가(사용자 실측 지적) — 남덕유산 서봉 실측에서,
  // waypoint 좌표 자체는 트랙과 2.9m로 정확히 일치했지만 실제 서성인
  // 범위(지그재그 중심)는 그 좌표에서 30m나 떨어져 있어 반경 20m로는
  // 다 못 잡았다. 반경을 무작정 넓히면 바로 다음 갈림길(실측: 서봉에서
  // 불과 52개 포인트/약 72m 뒤)과 반경이 겹쳐 서로 다른 지점의 서성임이
  // 하나로 뒤섞일 위험이 있다. 그래서 각 waypoint의 탐색 반경 상한을
  // "트랙 위에서 그 waypoint와 가장 가까운 지점부터, 앞뒤로 가장 가까운
  // 다른 waypoint까지 거리의 절반"으로 동적 제한한다 — 두 waypoint
  // 사이에서 항상 중간 지점까지만 각자 담당하므로 반경을 넓혀도 서로
  // 침범하지 않는다.
  function findWaypointCentricClusters(points, waypoints, radiusM) {
    const wpts = (waypoints || []).filter(w => w && typeof w.lat === 'number' && typeof w.lon === 'number');
    if (wpts.length === 0 || points.length === 0) return [];

    // 각 waypoint의 트랙 위 최근접 idx(코스 진행 순서 비교용)를 미리 구한다.
    const wptNearestIdx = wpts.map(w => {
      let best = 0, bestD = Infinity;
      for (let i = 0; i < points.length; i++) {
        const d = calcDistanceM(points[i].lat, points[i].lon, w.lat, w.lon);
        if (d < bestD) { bestD = d; best = i; }
      }
      return best;
    });
    // 트랙 순서(idx) 기준으로 정렬된 waypoint 인덱스 배열
    const order = wpts.map((_, i) => i).sort((a, b) => wptNearestIdx[a] - wptNearestIdx[b]);

    const clusters = [];
    order.forEach((wi, orderPos) => {
      const w = wpts[wi];
      const myIdx = wptNearestIdx[wi];
      // 🐛 2026-10-02 수정(사용자 실측 지적) — "절반"으로 상한을 두면
      // 두 waypoint 사이가 짧을 때(실측: 서봉~다음갈림길 49m) 실제
      // 서성임 범위(30.3m)를 여전히 다 못 잡는 경우가 있었다. "절반"
      // 대신 "다음/이전 waypoint 도달 직전까지 전체"를 상한으로 쓴다
      // — 두 waypoint가 동시에 서로의 구간을 넓게 탐색해 겹치더라도,
      // 아래(merged 병합) 로직이 겹치는 범위를 하나로 합쳐 처리하므로
      // 문제가 없다(겹침 자체가 "두 지점 사이 전체가 느린 헤맴 구간"
      // 이었다는 뜻이고, 그 경우 하나로 합쳐 판정하는 것이 맞다).
      let effectiveRadius = radiusM;
      if (orderPos > 0) {
        const prevIdx = wptNearestIdx[order[orderPos - 1]];
        const dPrev = calcDistanceM(points[prevIdx].lat, points[prevIdx].lon, points[myIdx].lat, points[myIdx].lon);
        effectiveRadius = Math.min(effectiveRadius, dPrev);
      }
      if (orderPos < order.length - 1) {
        const nextIdx = wptNearestIdx[order[orderPos + 1]];
        const dNext = calcDistanceM(points[myIdx].lat, points[myIdx].lon, points[nextIdx].lat, points[nextIdx].lon);
        effectiveRadius = Math.min(effectiveRadius, dNext);
      }

      const near = [];
      for (let i = 0; i < points.length; i++) {
        if (calcDistanceM(points[i].lat, points[i].lon, w.lat, w.lon) <= effectiveRadius) near.push(i);
      }
      if (near.length === 0) return;
      // 왕복 코스에서 같은 이름 waypoint가 가는 길/오는 길 양쪽에
      // 매칭되면 인덱스가 멀리 떨어진 그룹으로 나뉜다 — 그룹별로
      // 별도 클러스터를 만든다(resampleByDistance의 왕복 처리와 동일 원칙).
      let groupStart = 0;
      for (let k = 1; k <= near.length; k++) {
        const isGroupEnd = k === near.length || (near[k] - near[k - 1]) > 10;
        if (isGroupEnd) {
          clusters.push({ startIdx: near[groupStart], endIdx: near[k - 1], waypoint: w });
          groupStart = k;
        }
      }
    });
    // startIdx 기준 정렬 후, 겹치는 범위(서로 다른 waypoint가 같은
    // 구간을 가리키는 경우)는 병합한다.
    clusters.sort((a, b) => a.startIdx - b.startIdx);
    const merged = [];
    clusters.forEach(c => {
      const last = merged[merged.length - 1];
      if (last && c.startIdx <= last.endIdx + 1) {
        last.endIdx = Math.max(last.endIdx, c.endIdx);
      } else {
        merged.push({ startIdx: c.startIdx, endIdx: c.endIdx, waypoint: c.waypoint });
      }
    });
    return merged;
  }

  // ① 서성임/배회 압축 — waypoint(지명) 좌표를 기준점으로 삼아 그
  // 반경 안의 모든 trkpt를 하나의 클러스터로 묶고(findWaypointCentricClusters),
  // 'loiter'로 분류된 클러스터만 "진입점 → 대표점(클러스터 내부 좌표
  // 평균) → 이탈점" 3점으로 치환한다. 'pass'/'turnaround'는 원본
  // 그대로 보존한다. waypoint가 없는 구간은 이 함수의 자동 압축
  // 대상이 아니다 — flagLingeringSegments(하이라이트만, 비파괴)로
  // 사용자에게 보여주고 직접 정리하게 한다.
  // 대표점은 그 클러스터를 만든 waypoint 좌표로 스냅한다(정상 지점
  // 자체가 사라지지 않도록) — waypoint가 기준점이었으므로 이미 정확한
  // 위치이고 좌표 평균과 재탐색할 필요가 없다.
  // radiusM 기본값 40m — 실측(서봉)에서 waypoint 좌표와 실제 서성임
  // 중심이 최대 30m까지 떨어질 수 있음을 확인해 여유를 둔다. 바로
  // 위 findWaypointCentricClusters가 "인접 waypoint까지 거리의 절반"
  // 으로 상한을 추가로 거므로, 갈림길이 촘촘한 구간에서도 40m가
  // 그대로 적용되지 않고 자동으로 좁혀진다.
  function compressStationaryClusters(points, radiusM = 40, minPointsInCluster = 5, waypointsForSnap = importedGpxWpts) {
    const PROGRESS_RATIO_THRESHOLD = 2.0;
    const DIRECTION_DIFF_THRESHOLD_DEG = 90;

    const clusters = findWaypointCentricClusters(points, waypointsForSnap, radiusM)
      .filter(c => (c.endIdx - c.startIdx + 1) >= minPointsInCluster);
    const result = [];
    let cursor = 0;
    let compressedCount = 0;

    clusters.forEach(cluster => {
      const kind = classifyCluster(points, cluster, PROGRESS_RATIO_THRESHOLD, DIRECTION_DIFF_THRESHOLD_DEG);
      if (kind !== 'loiter') return; // pass/turnaround는 압축 대상에서 제외(원본 그대로 다음 루프에서 복사됨)

      const { startIdx, endIdx } = cluster;
      // cursor부터 startIdx-1(진입점 포함)까지는 원본 그대로 복사
      for (let k = cursor; k < startIdx; k++) result.push(points[k]);

      // 고도(ele)는 클러스터 내부(startIdx~endIdx) 평균을 쓴다(좌표만 waypoint로 스냅, 고도는 평균이 더 정확).
      let sumEle = 0, eleCount = 0;
      for (let k = startIdx; k <= endIdx; k++) {
        if (points[k].ele !== null && points[k].ele !== undefined && !isNaN(points[k].ele)) {
          sumEle += points[k].ele;
          eleCount++;
        }
      }
      const n = endIdx - startIdx + 1;
      const repEle = eleCount > 0 ? sumEle / eleCount : null;
      // 대표점은 좌표 평균이 아니라 이 클러스터의 기준이 된 waypoint
      // 좌표로 직접 스냅한다 — waypoint 자체가 이미 "정확한 지점"이므로
      // 평균을 또 구해 재탐색할 필요가 없다.
      const repLat = cluster.waypoint.lat, repLon = cluster.waypoint.lon;

      // 진입점은 이미 위 루프에서 result에 들어갔으므로, 여기서는
      // 대표점만 추가하고 이탈점은 다음 cursor 위치(endIdx+1)에서
      // 자연스럽게 원본 그대로 포함된다.
      result.push({ lat: repLat, lon: repLon, ele: repEle, time: points[startIdx].time || null });
      compressedCount += (n - 1); // 대표점 1개로 n개를 줄였으므로 n-1개 감소
      cursor = endIdx + 1;
    });
    for (let k = cursor; k < points.length; k++) result.push(points[k]);

    return { points: result, compressedCount, clusterCount: clusters.filter(c => classifyCluster(points, c, PROGRESS_RATIO_THRESHOLD, DIRECTION_DIFF_THRESHOLD_DEG) === 'loiter').length };
  }

  // ② 갈림길 헤맴 구간 탐지 — 삭제하지 않고 범위만 반환한다(비파괴).
  // 호출부가 이 결과로 지도에 하이라이트를 그린다.
  //
  // 🐛 2026-10-02 수정(사용자 지시: "애매한 데는 그냥 끝점에서
  // 유턴으로 해. 유턴부분은 수정을 수동으로 할께") — classifyCluster가
  // 이제 애매한 경우를 'pass'가 아니라 'turnaround'로 묶으므로,
  // "헤맴"으로 보고할 대상도 'loiter'뿐 아니라 'turnaround'까지
  // 포함한다 — 둘 다 "자동 압축은 안 했지만 사용자가 눈으로 확인은
  // 해야 할 구간"이기 때문이다. waypoint 기반(compressStationaryClusters
  // 와 같은 좌표 자체 탐색)도 함께 봐서, waypoint 반경 안에서 걸러진
  // 애매한 구간도 놓치지 않는다.
  function flagLingeringSegments(points, radiusM = 15, minPointsInCluster = 8, waypoints = importedGpxWpts) {
    const PROGRESS_RATIO_THRESHOLD = 2.0;
    const DIRECTION_DIFF_THRESHOLD_DEG = 90;

    const coordClusters = findStationaryClusters(points, radiusM, minPointsInCluster);
    const wptClusters = findWaypointCentricClusters(points, waypoints, Math.max(radiusM, 40));

    const flagged = [...coordClusters, ...wptClusters]
      .filter(c => {
        const kind = classifyCluster(points, c, PROGRESS_RATIO_THRESHOLD, DIRECTION_DIFF_THRESHOLD_DEG);
        return kind === 'loiter' || kind === 'turnaround';
      })
      .map(c => ({ startIdx: Math.max(0, c.startIdx - 1), endIdx: Math.min(points.length - 1, c.endIdx + 1) }));

    // 겹치거나 인접한 범위는 하나로 병합해 하이라이트가 중복되지 않게 한다.
    flagged.sort((a, b) => a.startIdx - b.startIdx);
    const merged = [];
    flagged.forEach(r => {
      const last = merged[merged.length - 1];
      if (last && r.startIdx <= last.endIdx + 1) {
        last.endIdx = Math.max(last.endIdx, r.endIdx);
      } else {
        merged.push({ startIdx: r.startIdx, endIdx: r.endIdx });
      }
    });
    return merged;
  }

  // ③ 균등 간격 재샘플링 — 전체 points를 원본 순서 그대로, 누적거리
  // 기준 intervalM 간격으로 선형 보간해 재생성한다. 왕복이라고 트랙을
  // 앞뒤로 나누거나 좌표 중복을 걸러내는 전처리는 하지 않는다 — 원본
  // points를 처음부터 끝까지 한 번만 훑는 단일 패스다.
  //
  // forcedKeepPoints(기본 importedGpxWpts)는 "waypoint 1개 → 가장
  // 가까운 지점 1개"가 아니라 "waypoint 1개 → 그 좌표에 해당하는 모든
  // routeDistance 위치"로 강제 삽입한다. 왕복 코스에서 같은 waypoint가
  // 트랙 위 서로 다른 두 지점(가는 길/오는 길)에 나타나면 두 위치 모두
  // 보존해야 하므로, "가장 가까운 것 1개만 찾기"는 절대 하지 않는다.
  function resampleByDistance(points, intervalM = 5, forcedKeepPoints = importedGpxWpts) {
    if (points.length < 2) return points.slice();

    // 1) 각 원본 점의 누적거리(routeDistance)를 미리 계산해둔다.
    const cum = [0];
    for (let i = 1; i < points.length; i++) {
      cum.push(cum[i - 1] + calcDistanceM(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon));
    }
    const totalM = cum[cum.length - 1];

    // 2) forcedKeepPoints(waypoint) 1개당, 전체 트랙을 훑어 매칭 반경
    //    (30m, track_viewer.html의 WAYPOINT_MATCH_RADIUS_M과 동일 원칙)
    //    안에 드는 "모든" 근접 구간을 별도 클러스터로 모아, 각 클러스터의
    //    최근접 지점의 routeDistance를 강제 삽입 대상으로 수집한다.
    const WPT_MATCH_RADIUS_M = 30;
    const WPT_CLUSTER_INDEX_GAP = 10; // track_viewer.html의 ROUNDTRIP_CLUSTER_INDEX_GAP과 동일 원칙(왕복 가는 길/오는 길 구분)
    const forcedDistances = new Set();
    (forcedKeepPoints || []).forEach(w => {
      const near = [];
      for (let i = 0; i < points.length; i++) {
        const d = calcDistanceM(points[i].lat, points[i].lon, w.lat, w.lon);
        if (d <= WPT_MATCH_RADIUS_M) near.push(i);
      }
      if (near.length === 0) return;
      // near를 인덱스 간격으로 클러스터링 — 같은 이름 waypoint가 왕복
      // 가는 길/오는 길 양쪽에 매칭되면 서로 멀리 떨어진 인덱스 그룹이
      // 생기므로, 그룹별로 "그 그룹 안에서 w와 가장 가까운 점" 1개씩만 뽑는다.
      let groupStart = 0;
      for (let k = 1; k <= near.length; k++) {
        const isGroupEnd = k === near.length || (near[k] - near[k - 1]) > WPT_CLUSTER_INDEX_GAP;
        if (isGroupEnd) {
          let bestIdx = near[groupStart], bestD = Infinity;
          for (let g = groupStart; g < k; g++) {
            const d = calcDistanceM(points[near[g]].lat, points[near[g]].lon, w.lat, w.lon);
            if (d < bestD) { bestD = d; bestIdx = near[g]; }
          }
          forcedDistances.add(cum[bestIdx]);
          groupStart = k;
        }
      }
    });

    // 3) 보간 유틸: 누적거리 targetM에 해당하는 좌표를 cum 배열에서 찾아 선형보간
    function interpAt(targetM) {
      if (targetM <= 0) return points[0];
      if (targetM >= totalM) return points[points.length - 1];
      let lo = 0, hi = cum.length - 1;
      while (lo < hi - 1) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] <= targetM) lo = mid; else hi = mid;
      }
      const segLen = cum[hi] - cum[lo];
      const t = segLen > 0 ? (targetM - cum[lo]) / segLen : 0;
      const a = points[lo], b = points[hi];
      const ele = (a.ele !== null && a.ele !== undefined && b.ele !== null && b.ele !== undefined && !isNaN(a.ele) && !isNaN(b.ele))
        ? a.ele + (b.ele - a.ele) * t
        : (a.ele !== null && a.ele !== undefined ? a.ele : null);
      return {
        lat: a.lat + (b.lat - a.lat) * t,
        lon: a.lon + (b.lon - a.lon) * t,
        ele,
        time: t < 0.5 ? (a.time || null) : (b.time || null),
      };
    }

    // 4) 목표 누적거리 집합을 만든다: 5m 간격 격자 + forcedDistances(waypoint 위치) 합집합.
    const targets = new Set();
    targets.add(0);
    for (let d = intervalM; d < totalM; d += intervalM) targets.add(Math.round(d * 1000) / 1000);
    targets.add(Math.round(totalM * 1000) / 1000);
    forcedDistances.forEach(d => targets.add(Math.round(d * 1000) / 1000));

    const sortedTargets = Array.from(targets).sort((a, b) => a - b);
    return sortedTargets.map(interpAt);
  }

  // 🧹 박스로 지정한 범위를 강제로 정제한다 — "정제 미리보기"(①
  // compressStationaryClusters)는 waypoint 중심 자동 판정이라
  // classifyCluster가 'turnaround'(애매함)로 분류하면 압축하지 않고
  // 보존한다("⚠️ 헤맴 구간 찾기"로 노출되는 이유). 하지만 사용자가
  // 지도를 보고 "여기는 명백히 왔다갔다한 서성임이다"라고 이미
  // 판단했다면, 그 자동 판정을 건너뛰고 박스 안 전체를 "진입점 →
  // 대표점(좌표 평균) → 이탈점" 3점으로 강제 압축한 뒤, 전체 트랙을
  // 5m 간격으로 재샘플링한다(resampleByDistance는 전체 points를
  // 받아야 forcedKeepPoints/왕복 처리가 일관되므로, 압축은 박스
  // 범위에만 적용하고 재샘플링은 항상 전체에 적용한다).
  //
  // 🐛 2026-10-07 추가(사용자 신고: "정제 미리보기 버튼 클릭후
  // 헤맴구간을 클릭하면 나오는 곳이야" — 조망대 근처에서 지그재그로
  // 왔다갔다한 구간이 자동 정제 후에도 여전히 "헤맴 구간"으로 남아
  // 수동으로 노드를 지우고 있었음) — 일정 범위를 사람이 직접 지정해
  // 강제로 정제하는 기능을 추가했다.
  function applyBoxCleanup(latlng1, latlng2, isLeftToRight) {
    if (allTrailPoints.length === 0) return;

    const idxList = findBoxSelectedIdx(latlng1, latlng2, isLeftToRight);
    if (idxList.length === 0) {
      showToast('🧹 박스 안에 정제할 점이 없습니다.');
      return;
    }
    const startIdx = Math.min(...idxList);
    const endIdx = Math.max(...idxList);
    // 진입점/이탈점까지 포함해 최소 4개 점(진입+내부1개 이상+이탈)은
    // 있어야 압축할 의미가 있다.
    if (endIdx - startIdx + 1 < 3) {
      showToast('🧹 선택 범위가 너무 작습니다. 서성인 구간을 더 넓게 선택해주세요.');
      return;
    }

    saveHistory();
    const before = allTrailPoints.length;

    const entryIdx = Math.max(0, startIdx - 1);
    const exitIdx = Math.min(allTrailPoints.length - 1, endIdx + 1);

    // 대표점 좌표: 박스 안(entryIdx~exitIdx) 좌표 평균. 가까운 waypoint
    // (30m 이내)가 있으면 compressStationaryClusters와 동일하게 그
    // 좌표로 스냅해 지명 지점 자체가 사라지지 않게 한다.
    let sumLat = 0, sumLon = 0, sumEle = 0, eleCount = 0, n = 0;
    for (let k = entryIdx; k <= exitIdx; k++) {
      sumLat += allTrailPoints[k].lat;
      sumLon += allTrailPoints[k].lon;
      if (allTrailPoints[k].ele !== null && allTrailPoints[k].ele !== undefined && !isNaN(allTrailPoints[k].ele)) {
        sumEle += allTrailPoints[k].ele;
        eleCount++;
      }
      n++;
    }
    let repLat = sumLat / n, repLon = sumLon / n;
    const repEle = eleCount > 0 ? sumEle / eleCount : null;
    const nearWpt = (importedGpxWpts || []).find(w => calcDistanceM(repLat, repLon, w.lat, w.lon) <= 30);
    if (nearWpt) { repLat = nearWpt.lat; repLon = nearWpt.lon; }

    const compressed = [];
    for (let k = 0; k < entryIdx; k++) compressed.push(allTrailPoints[k]);
    compressed.push(allTrailPoints[entryIdx]);
    compressed.push({ lat: repLat, lon: repLon, ele: repEle, time: allTrailPoints[startIdx].time || null });
    compressed.push(allTrailPoints[exitIdx]);
    for (let k = exitIdx + 1; k < allTrailPoints.length; k++) compressed.push(allTrailPoints[k]);

    const resampled = resampleByDistance(compressed);
    allTrailPoints = resampled;
    renderTrailAndHandles();
    updateTrailStats();
    showToast(`🧹 선택 구간 강제 정제: ${endIdx - startIdx + 1}개 점 압축 · ${before}개 → ${allTrailPoints.length}개로 재샘플링`);
  }

  // "🧹 정제 미리보기" 버튼 핸들러 — ①서성임 압축 → ③5m 재샘플링
  // 순서로 적용한다. saveHistory()로 되돌리기 가능하게 하고, 결과는
  // allTrailPoints에 바로 반영한다(저장은 별도로 "GPX 저장" 버튼을
  // 눌러야 함 — 이 버튼은 저장을 자동으로 하지 않는다).
  function onClickCleanupPreview() {
    if (allTrailPoints.length < 2) {
      showToast('🧹 정제할 경로가 없습니다. 먼저 경로를 만들어주세요.');
      return;
    }
    saveHistory();
    const before = allTrailPoints.length;
    const { points: compressed, compressedCount, clusterCount } = compressStationaryClusters(allTrailPoints);
    const resampled = resampleByDistance(compressed);
    allTrailPoints = resampled;
    renderTrailAndHandles();
    updateTrailStats();
    showToast(`🧹 정제 완료: 서성임 ${clusterCount}곳 압축(-${compressedCount}점) · ${before}개 → ${allTrailPoints.length}개로 재샘플링`);
  }

  // "⚠️ 헤맴 구간 찾기" 버튼 핸들러 — allTrailPoints를 바꾸지 않고
  // 지도에 노란색으로 하이라이트만 한다(비파괴). 확인 후 기존 박스
  // 선택 삭제/재라우팅으로 직접 정리한다.
  function onClickFindLingeringSegments() {
    lingeringLines.forEach(l => map.removeLayer(l));
    lingeringLines = [];

    if (allTrailPoints.length < 2) {
      showToast('⚠️ 확인할 경로가 없습니다.');
      return;
    }
    const ranges = flagLingeringSegments(allTrailPoints);
    ranges.forEach(({ startIdx, endIdx }) => {
      const seg = allTrailPoints.slice(startIdx, endIdx + 1).map(p => [p.lat, p.lon]);
      if (seg.length < 2) return;
      const line = L.polyline(seg, {
        color: '#fbc02d',
        weight: 8,
        opacity: 0.85,
        dashArray: '4, 10',
        interactive: false
      }).addTo(map);
      lingeringLines.push(line);
    });
    showToast(ranges.length > 0
      ? `⚠️ 헤맴 의심 구간 ${ranges.length}곳을 지도에 노란색으로 표시했습니다. 박스 선택 삭제로 직접 정리하세요.`
      : '✅ 헤맴 의심 구간을 찾지 못했습니다.');
  }

  // 평균 도보 속도(km/h) — updateTrailStats()의 예상 시간 계산과 동일한
  // 기준(2.5km/h)을 재사용한다. 점 대부분이 lat/lon/ele만 갖고 있고
  // 실측 시간(p.time)이 없어(직접 그리기, OSRM/BRouter/공공데이터 결과
  // 모두 시간 정보 없음), 지금까지는 저장 시점의 현재 시각을 모든 점에
  // 똑같이 채워 넣고 있었다 — 그러면 인접 점 사이 시간차가 항상 0이 되어,
  // GPS 시뮬레이터가 속도를 계산할 때 노드 간격이 넓은(성긴) 구간일수록
  // "그 거리를 순식간에 이동"한 것처럼 비정상적으로 빠르게 나온다
  // (2026-09-20 실사용 신고: "노드점이 긴 구간은 속도가 빨라").
  const GPX_EXPORT_WALK_SPEED_KMH = 2.5;

  // 각 점까지의 누적 거리를 평균 속도로 나눠, "그 지점을 지났을 시각"을
  // 시작 시각에 더해 순차적으로 부여한다. 실측 시간(p.time)이 있는 점은
  // 그대로 존중하고, 없는 점만 이렇게 추정해 채운다.
  function assignWalkingTimes(points, startTime) {
    let cumulativeM = 0;
    return points.map((p, idx) => {
      if (p.time) return p; // 실측 시간이 있으면 건드리지 않는다
      if (idx > 0) {
        cumulativeM += calcDistanceM(points[idx - 1].lat, points[idx - 1].lon, p.lat, p.lon);
      }
      const elapsedSec = (cumulativeM / 1000) / GPX_EXPORT_WALK_SPEED_KMH * 3600;
      const estimatedTime = new Date(startTime.getTime() + elapsedSec * 1000);
      return Object.assign({}, p, { time: estimatedTime.toISOString() });
    });
  }

  // 실제 GPX 파일 쓰기 (검증 통과 또는 사용자가 "그래도 저장" 선택 시에만 호출)
  // GPX XML 문자열 생성 (파일 저장 / 텔레그램 전송 공용)
  function buildGpxXml(courseName) {
    const now = new Date().toISOString();
    const startTime = new Date();

    // 불러온 GPX에 지명(<wpt>, gpx-map.html이 만든 것)이 있었다면 수정
    // 없이 그대로 다시 써준다 — gpx_editor는 궤적(trkpt)만 편집하는
    // 도구이므로 지명 자체를 건드리지 않는다. 이게 없으면 gpx-map에서
    // 애써 편집한 지명이 gpx_editor를 한 번 거칠 때마다 사라져, gpx-map이
    // 다시 불러올 때 지명을 전부 자동 재검색해버렸다(2026-09-21 신고).
    let wptsXml = '';
    importedGpxWpts.forEach(w => {
      const safeName = (w.name || '').replace(/[<>&"']/g, s => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' })[s]);
      const eleTag = (w.ele !== null && w.ele !== undefined && !isNaN(w.ele)) ? `\n    <ele>${w.ele}</ele>` : '';
      wptsXml += `  <wpt lat="${w.lat.toFixed(6)}" lon="${w.lon.toFixed(6)}">
    <name>${safeName}</name>${eleTag}
  </wpt>\n`;
    });

    let trkpts = '';
    const pointsForExport = assignWalkingTimes(dedupeConsecutivePoints(allTrailPoints), startTime);
    pointsForExport.forEach(p => {
      const eleTag = (p.ele !== null && p.ele !== undefined && !isNaN(p.ele)) ? `\n        <ele>${p.ele}</ele>` : '';
      const timeStr = p.time ? (p.time instanceof Date ? p.time.toISOString() : p.time) : now;
      trkpts += `      <trkpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}">${eleTag}
        <time>${timeStr}</time>
      </trkpt>\n`;
    });

    return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="gajago (https://hjwpro1971.github.io/gaja)" xmlns="http://www.topografix.com/GPX/1/1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    <name>${courseName}</name>
    <time>${now}</time>
  </metadata>
${wptsXml}  <trk>
    <name>${courseName}</name>
    <trkseg>
${trkpts}    </trkseg>
  </trk>
</gpx>`;
  }

  // 🐛 2026-10-04 수정(사용자 지시: "gps-map,gpx-editor 저장시 기존
  // 이름으로 저장 가능하게 해" → "뒤에 1,2,3 첨자가 붙어서 그래" →
  // "덮어쓰기") — a.download 방식은 브라우저가 전적으로 저장 경로를
  // 결정하는데, 다운로드 폴더에 같은 이름의 파일이 이미 있으면 Chrome
  // 등이 사용자에게 묻지 않고 자동으로 "파일명 (1).gpx"처럼 첨자를
  // 붙여버린다 — 기존 파일을 덮어쓸 방법이 없었다. File System Access
  // API(showSaveFilePicker)를 쓰면 저장 대화상자가 떠서, 사용자가 기존
  // 파일을 직접 선택해 진짜로 덮어쓸 수 있다. Chrome/Edge(데스크톱)만
  // 지원하므로, 없는 환경(Safari/Firefox/대부분의 모바일)은 기존
  // a.click() 다운로드 방식으로 조용히 폴백한다.
  async function writeGpxFile() {
    let courseName = document.getElementById('courseNameInput').value.trim();
    if (!courseName) courseName = '나만의_등산로_코스';

    const gpxXml = buildGpxXml(courseName);
    const blob = new Blob([gpxXml], { type: 'application/gpx+xml;charset=utf-8' });

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: `${courseName}.gpx`,
          types: [{ description: 'GPX 파일', accept: { 'application/gpx+xml': ['.gpx'] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        showToast(`🎉 실제 산길이 담긴 '${courseName}.gpx' (${allTrailPoints.length}개 좌표) 저장이 완료되었습니다!`);
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return; // 사용자가 저장 대화상자를 취소함
        console.warn('showSaveFilePicker 저장 실패, 기존 다운로드 방식으로 폴백:', err);
        // 아래로 떨어져 기존 방식으로 계속 진행
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${courseName}.gpx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast(`🎉 실제 산길이 담긴 '${courseName}.gpx' (${allTrailPoints.length}개 좌표) 저장이 완료되었습니다!`);
  }

  // 🤖 산길샘 검증용: GPX 파일을 텔레그램으로 전송 (NAS 서버가 봇 토큰을 대신 관리)
  // 이 페이지는 gaja-tools(8444)에서 서빙되고 nas-tools 서버는 8991 포트라
  // 다른 오리진이므로 절대 주소로 호출하며, 서버 쪽에 CORS를 열어뒀다.
  async function sendGpxToTelegram() {
    if (waypoints.length < 2) {
      alert('먼저 지도 위에 경유지를 2개 이상 찍어주세요.');
      return;
    }
    if (allTrailPoints.length === 0) {
      await createTrailRoute();
    }
    if (allTrailPoints.length < 2) {
      alert('등산로 코스가 정상적으로 생성되지 않았습니다.');
      return;
    }
    let courseName = document.getElementById('courseNameInput').value.trim();
    if (!courseName) courseName = '나만의_등산로_코스';

    const confirmed = confirm(`📤 [텔레그램으로 GPX 전송]\n\n코스명: ${courseName}\n좌표 수: ${allTrailPoints.length}개\n\n산길샘 검증용으로 GPX 파일을 텔레그램으로 보내시겠습니까?`);
    if (!confirmed) return;

    const btn = document.getElementById('btnSendTelegram');
    const origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '⏳';

    try {
      const gpxXml = buildGpxXml(courseName);
      const gpxBase64 = btoa(unescape(encodeURIComponent(gpxXml)));
      const filename = courseName.replace(/[\\/:*?"<>|]/g, '_') + '.gpx';

      const res = await fetch('http://192.168.219.119:8991/api/gpx-file-notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gpxBase64, filename, courseName })
      });
      const data = await res.json();
      if (data.ok) {
        btn.innerHTML = '✅';
        showToast('🎉 텔레그램으로 GPX 파일이 전송되었습니다! 산길샘에서 확인해보세요.');
      } else {
        throw new Error(data.message || '전송 실패');
      }
    } catch(err) {
      alert('텔레그램 전송 중 오류: ' + err.message + '\n(NAS에서 이 페이지를 열었을 때만 동작합니다)');
      btn.innerHTML = origHtml;
    } finally {
      setTimeout(() => {
        btn.innerHTML = '📤';
        btn.disabled = false;
      }, 2500);
    }
  }

  // 마지막 경유지 1개 취소 (Undo)
  function undoLastPoint() {
    if (waypoints.length === 0) {
      showToast('취소할 경유지가 없습니다.');
      return;
    }
    waypoints.pop();
    allTrailPoints = [];
    if (trailPolyline) { map.removeLayer(trailPolyline); trailPolyline = null; }
    if (trailPolylineHit) { map.removeLayer(trailPolylineHit); trailPolylineHit = null; }
    renderWaypoints();
    document.getElementById('btnCreateTrail').innerText = '🥾 등산로 만들기';
    showToast('마지막 경유지를 취소했습니다.');
  }

  // 전체 초기화
  // 🔃 전체 경로 방향 반전 — 두 GPX를 이어붙였는데 뒤쪽 트랙이 반대
  // 방향으로 기록되어 있는 경우를 위한 기능(2026-09-21 요청: "트랙 2가
  // 역방향인지 확인하고 필요하면 반전"). 단순히 배열만 뒤집으면 안 된다 —
  // gapAfter: true는 "이 점과 다음 점 사이가 끊김"이라는 뜻이라, 순서가
  // 뒤집히면 그 경계가 반대쪽으로 옮겨져야 의미가 유지된다. 원본에서
  // points[i].gapAfter가 있으면 그 끊김은 points[i]~points[i+1] 사이였고,
  // 뒤집은 배열에서 그 경계는 reversed[N-1-i]와 reversed[N-2-i] 사이이므로
  // reversed[N-2-i]에 gapAfter를 옮겨 찍는다. source(어떤 라우터가 이
  // 구간을 만들었는지)는 점 자체에 붙은 속성이라 순서와 무관하게 그대로
  // 유지된다.
  function reverseTrailDirection() {
    if (allTrailPoints.length < 2) return;
    if (!confirm('🔃 전체 경로의 방향을 반전할까요?\n\n들머리와 날머리가 서로 바뀌고, 점 순서가 거꾸로 뒤집힙니다.')) return;

    saveHistory();
    const n = allTrailPoints.length;
    const reversed = allTrailPoints.slice().reverse().map(p => {
      const copy = Object.assign({}, p);
      delete copy.gapAfter;
      return copy;
    });
    allTrailPoints.forEach((p, i) => {
      if (p.gapAfter && i < n - 1) {
        reversed[n - 2 - i].gapAfter = true;
      }
    });
    allTrailPoints = reversed;
    waypoints = [allTrailPoints[0], allTrailPoints[allTrailPoints.length - 1]];

    renderWaypoints();
    renderTrailAndHandles();
    updateTrailStats();
    showToast('🔃 경로 방향을 반전했습니다. 들머리·날머리가 바뀌었습니다.');
  }

  // 🔁 2026-10-04 추가(사용자 지시: "gpx-editor에서 왕복이라는 걸 표시
  // 하게 하고 들머리, 날머리를 동시에 잡게 하면 될 것 같은데 즉 편도인데
  // 내가 편도왕복이라고 클릭하면 날머리가 들머리와 일치하게 하는거야")
  // — 실제로 왕복(원점회귀)인 코스인데 트랙 좌표(allTrailPoints)는 편도
  // (들머리→반환점)로만 그려진 GPX에, "이 코스는 왕복이다"는 표시를
  // 남기는 기능. 트랙 좌표 자체는 전혀 건드리지 않는다(복귀 구간을
  // 복사해 붙이지 않음 — 그러면 파일만 커지고, 나중에 가는 길만 고치고
  // 복사된 오는 길은 안 고쳐지는 어긋남 사고가 날 수 있다, 설악산C1
  // 사례 참고). track_viewer.html의 buildMilestones가 이미 "들머리/
  // 날머리가 50m 이내로 가까우면 들·날머리(원점회귀)로 자동 병합"하는
  // 로직을 갖고 있으므로, 날머리 waypoint 좌표를 들머리와 동일하게
  // 맞춰주기만 하면 GPS 실사용 경로(advanceSection의 왕복 자동 반전)와
  // 미리보기(startSimInterval의 반전 재생, 별도 수정분) 양쪽 모두
  // "이건 왕복 코스"라고 올바르게 인식한다.
  function markAsRoundTrip() {
    if (!allTrailPoints || allTrailPoints.length < 2) {
      showToast('⚠️ 먼저 경로를 만들어주세요.');
      return;
    }
    const startPt = allTrailPoints[0];
    let deulmeori = importedGpxWpts.find(w => (w.name || '').includes('들머리') || (w.name || '').includes('출발'));
    if (!deulmeori) {
      deulmeori = { lat: startPt.lat, lon: startPt.lon, name: '들머리', ele: startPt.ele };
      importedGpxWpts.push(deulmeori);
    }
    // 🐛 2026-10-04 수정 — 날머리 좌표를 들머리와 "완전히 동일"하게
    // 만들면, track_viewer.html의 buildMilestones가 쓰는 좌표 기반
    // 중복 제거(1m 반올림 좌표를 키로 Set에 넣고 두 번째부터는 통째로
    // 스킵)에 걸려 "날머리" 웨이포인트 자체가 list에 아예 안 들어가는
    // 역설이 생겼다(Node.js 재현으로 확인 — 결과적으로 자동 보완 로직이
    // 다시 끼어들어 코스 끝점을 날머리로 쓰면서 편도왕복 표시가 무력화
    // 됨). 완전히 같은 좌표 대신 약 2m만 살짝 어긋나게 만든다 — 그
    // 1m 반올림 중복 판정은 피하면서, buildMilestones의 "들·날머리가
    // 50m 이내면 들·날머리(원점회귀)로 자동 병합"하는 로직에는 그대로
    // 걸려 의도한 대로 병합된다.
    const TINY_OFFSET_DEG = 0.00002; // 위도 기준 약 2.2m
    let nalmeori = importedGpxWpts.find(w => (w.name || '').includes('날머리') || (w.name || '').includes('도착'));
    if (!nalmeori) {
      nalmeori = { lat: deulmeori.lat + TINY_OFFSET_DEG, lon: deulmeori.lon, name: '날머리', ele: deulmeori.ele };
      importedGpxWpts.push(nalmeori);
    } else {
      nalmeori.lat = deulmeori.lat + TINY_OFFSET_DEG;
      nalmeori.lon = deulmeori.lon;
      nalmeori.ele = deulmeori.ele;
    }
    saveHistory();
    autosaveEditorState();
    showToast('🔁 편도왕복으로 표시했습니다. 날머리를 들머리와 같은 지점으로 맞췄습니다.\n저장하면 track_viewer가 반환점에서 자동으로 되돌아오는 코스로 인식합니다.');
  }
  window.markAsRoundTrip = markAsRoundTrip;

  // 🪢 2026-10-04 추가(사용자 지시: "gpx-editor에서 gpx를 불러왔는데 편도왕복인데
  // 올라갈 때/내려올 때 데이터가 2줄이야. 그냥 1줄로 만들고 싶어") — 실제로
  // 왕복 산행을 기록한 GPX는 같은 길이 가는 선/오는 선으로 두 번 들어 있다.
  // 반환점(들머리에서 직선거리가 가장 먼 점)까지만 남기고 뒤쪽 복귀 구간을
  // 잘라 한 줄로 만든다. 복귀 구간이 가는 길과 실제로 겹치는지(되돌아오는
  // 점의 80% 이상이 가는 선에서 40m 이내)를 먼저 확인해, 겹치지 않는 종주/
  // 순환 코스를 실수로 반토막 내지 않도록 막는다. 실행 취소(Ctrl+Z) 가능.
  function mergeOutAndBackToSingleLine() {
    if (!allTrailPoints || allTrailPoints.length < 4) {
      showToast('⚠️ 합칠 경로가 없습니다. GPX를 먼저 불러오세요.');
      return;
    }
    const pts = allTrailPoints;
    const start = pts[0];
    let turnIdx = 0, maxD = -1;
    pts.forEach((p, i) => {
      const d = calcDistanceM(start.lat, start.lon, p.lat, p.lon);
      if (d > maxD) { maxD = d; turnIdx = i; }
    });
    if (turnIdx < 1 || turnIdx >= pts.length - 2) {
      showToast('⚠️ 반환점을 찾지 못했습니다(경로 끝이 이미 가장 먼 지점입니다). 이미 한 줄이면 합칠 필요가 없습니다.');
      return;
    }
    const outPts = pts.slice(0, turnIdx + 1);
    const backPts = pts.slice(turnIdx + 1);
    const MATCH_M = 40;
    let matched = 0;
    backPts.forEach(bp => {
      let best = Infinity;
      for (let i = 0; i < outPts.length; i++) {
        const d = calcDistanceM(bp.lat, bp.lon, outPts[i].lat, outPts[i].lon);
        if (d < best) best = d;
        if (best <= MATCH_M) break;
      }
      if (best <= MATCH_M) matched++;
    });
    const ratio = matched / backPts.length;
    if (ratio < 0.8) {
      showToast('⚠️ 되돌아오는 구간이 가는 길과 ' + Math.round(ratio * 100) + '%만 겹칩니다. 같은 길을 왕복한 코스가 아니라서 합치지 않았습니다.');
      return;
    }
    if (!confirm('🪢 왕복 한 줄로 합칠까요?\n\n'
      + '들머리에서 가장 먼 지점(' + Math.round(maxD) + 'm, ' + (turnIdx + 1) + '번째 점)을 반환점으로 보고,\n'
      + '그 뒤 ' + backPts.length + '개 점(되돌아오는 구간, ' + Math.round(ratio * 100) + '% 겹침)을 지웁니다.\n'
      + '(Ctrl+Z로 되돌릴 수 있습니다)')) return;

    saveHistory();
    const kept = outPts.map(p => Object.assign({}, p));
    delete kept[kept.length - 1].gapAfter;
    allTrailPoints = kept;
    waypoints = [allTrailPoints[0], allTrailPoints[allTrailPoints.length - 1]];
    renderWaypoints();
    renderTrailAndHandles();
    updateTrailStats();
    fitRoute();
    showToast('🪢 왕복을 한 줄로 합쳤습니다. (' + pts.length + ' → ' + kept.length + '개 점)\n왕복 코스로 쓰려면 🔁 편도왕복을 눌러 저장하세요.');
  }
  window.mergeOutAndBackToSingleLine = mergeOutAndBackToSingleLine;

  function clearAllPoints() {
    if (waypoints.length === 0) return;
    if (!confirm('정말 모든 경유지를 지우고 새로 시작하시겠습니까?')) return;
    waypoints = [];
    allTrailPoints = [];
    importedGpxWpts = [];
    if (guideLine) { map.removeLayer(guideLine); guideLine = null; }
    if (trailPolyline) { map.removeLayer(trailPolyline); trailPolyline = null; }
    if (trailPolylineHit) { map.removeLayer(trailPolylineHit); trailPolylineHit = null; }
    markerLayers.forEach(m => map.removeLayer(m));
    markerLayers = [];

    // 검증 관련 상태 및 레이어도 함께 초기화
    fallbackRanges = [];
    fallbackLines.forEach(l => map.removeLayer(l));
    fallbackLines = [];
    anomalyMarkers.forEach(m => map.removeLayer(m));
    anomalyMarkers = [];
    closeValidationPanel();

    document.getElementById('totalDist').innerText = '0.0 km';
    document.getElementById('pointCount').innerText = '0 개';
    document.getElementById('estTime').innerText = '0분';
    document.getElementById('btnCreateTrail').innerText = '🥾 등산로 만들기';

    clearAutosavedEditorState(); // 사용자가 직접 누른 명시적 초기화 — 자동 복원 대상에서도 지운다
    showToast('모든 경유지가 초기화되었습니다.');
  }

  // 전체 코스 화면에 맞추기
  function fitRoute() {
    if (trailPolyline && allTrailPoints.length > 0) {
      map.fitBounds(trailPolyline.getBounds(), { padding: [60, 60] });
    } else if (guideLine && waypoints.length > 0) {
      map.fitBounds(guideLine.getBounds(), { padding: [60, 60] });
    } else {
      showToast('그려진 코스가 없습니다.');
    }
  }

  // 산 / 지명 검색 (동명산 구분)
  async function searchLocation() {
    const q = document.getElementById('searchInput').value.trim();
    const dropdown = document.getElementById('searchResultsDropdown');
    if (!q) {
      dropdown.style.display = 'none';
      return;
    }

    const cleanQ = q.replace(/\s+/g, '');
    let matchedList = [];

    MOUNTAIN_PRESETS.forEach(item => {
      const matchName = item.name.replace(/\s+/g, '').includes(cleanQ);
      const matchKw = item.kw.some(k => cleanQ.includes(k) || k.includes(cleanQ));
      const matchRegion = item.region.replace(/\s+/g, '').includes(cleanQ);
      if (matchName || matchKw || matchRegion) {
        matchedList.push({
          title: item.name,
          region: item.region,
          lat: item.lat,
          lon: item.lon
        });
      }
    });

    dropdown.innerHTML = '<div class="res-empty">🔍 검색 중입니다...</div>';
    dropdown.style.display = 'flex';

    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ' 대한민국')}&countrycodes=kr&limit=6&addressdetails=1`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.length > 0) {
        data.forEach(d => {
          const parts = d.display_name.split(',').map(s => s.trim());
          const placeName = parts[0];
          const lat = parseFloat(d.lat);
          const lon = parseFloat(d.lon);
          const isDup = matchedList.some(m => calcDistanceKm(m.lat, m.lon, lat, lon) < 1.0);
          if (!isDup) {
            let regStr = parts.slice(1).reverse().join(' ');
            if (d.address) {
              const addr = d.address;
              const province = addr.province || addr.state || '';
              const city = addr.city || addr.county || addr.district || '';
              const sub = addr.suburb || addr.town || addr.village || '';
              regStr = [province, city, sub].filter(Boolean).join(' ');
            }
            matchedList.push({
              title: placeName,
              region: regStr || '대한민국',
              lat: lat,
              lon: lon
            });
          }
        });
      }
    } catch(err) {
      console.warn('온라인 검색 지연:', err);
    }

    renderSearchResults(matchedList);
  }

  function renderSearchResults(list) {
    const dropdown = document.getElementById('searchResultsDropdown');
    if (!list || list.length === 0) {
      dropdown.innerHTML = '<div class="res-empty">검색 결과가 없습니다.<br>산 이름이나 지역명을 다시 확인해주세요.</div>';
      dropdown.style.display = 'flex';
      return;
    }

    dropdown.innerHTML = '';
    list.slice(0, 8).forEach(item => {
      const el = document.createElement('div');
      el.className = 'search-result-item';
      el.innerHTML = `
        <div class="res-title">⛰️ ${item.title}</div>
        <div class="res-region">📍 ${item.region}</div>
      `;
      el.onclick = (e) => { e.stopPropagation(); selectLocation(item.lat, item.lon, item.title, item.region); };
      dropdown.appendChild(el);
    });
    dropdown.style.display = 'flex';
  }

  function selectLocation(lat, lon, title, region) {
    const targetLat = parseFloat(lat);
    const targetLon = parseFloat(lon);
    if (isNaN(targetLat) || isNaN(targetLon)) {
      alert('위치 좌표를 확인할 수 없습니다.');
      return;
    }
    if (map) {
      map.setView([targetLat, targetLon], 14);
    }
    const dropdown = document.getElementById('searchResultsDropdown');
    if (dropdown) dropdown.style.display = 'none';

    const nameInput = document.getElementById('courseNameInput');
    if (nameInput) {
      const curVal = nameInput.value ? nameInput.value.trim() : '';
      if (!curVal || curVal.includes('나만의')) {
        const cleanTitle = title.replace(/\s*\([^)]*\)/g, '').trim().replace(/\s+/g, '_');
        nameInput.value = `${cleanTitle}_코스`;
        autoSizeCourseNameInput();
      }
    }

    showToast(`📍 [${title}]\n${region}(으)로 이동했습니다.`);
  }

  document.addEventListener('click', (e) => {
    const container = document.getElementById('searchContainer');
    if (container && !container.contains(e.target)) {
      const dropdown = document.getElementById('searchResultsDropdown');
      if (dropdown) dropdown.style.display = 'none';
    }
  });

  // track_viewer.html(GPS 내비게이션 뷰어)의 스키마와 동일하게 저장
  // (saved_hiking_routes_v2) — 2026-10-02: viewer_pc.html을 더 이상
  // 쓰지 않아 "뷰어로 테스트" 버튼이 track_viewer.html을 열도록 바뀌면서
  // 저장소 키도 track_viewer.html과 맞췄다(기존 v1은 viewer_pc.html
  // 전용이라 track_viewer.html이 못 읽었음).
  const SAVED_ROUTES_KEY = 'saved_hiking_routes_v2';
  const MAX_SAVED_ROUTES = 10;

  function loadSavedRoutes() {
    try {
      const raw = localStorage.getItem(SAVED_ROUTES_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch(e) { return []; }
  }

  function saveRouteToViewerStorage(courseName, sourceKey, points) {
    try {
      let list = loadSavedRoutes();
      if (sourceKey) list = list.filter(r => r.sourceUrl !== sourceKey);
      list.unshift({
        name: courseName,
        sourceUrl: sourceKey,
        points: points,
        waypoints: points.waypoints || [],
        savedAt: Date.now()
      });
      if (list.length > MAX_SAVED_ROUTES) list = list.slice(0, MAX_SAVED_ROUTES);
      localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(list));
    } catch(e) {
      try {
        let list = loadSavedRoutes();
        list = list.slice(0, Math.ceil(list.length / 2));
        list.unshift({ name: courseName, sourceUrl: sourceKey, points: points, waypoints: points.waypoints || [], savedAt: Date.now() });
        localStorage.setItem(SAVED_ROUTES_KEY, JSON.stringify(list));
      } catch(e2) {}
    }
  }

  // 편집 중인 코스를 localStorage(saved_hiking_routes_v2)에 저장하고
  // 그 sourceKey를 반환한다 — previewInViewer/previewInGpsReplay가
  // 공통으로 쓰는 준비 단계. 실패 사유가 있으면 null을 반환한다(이미
  // alert로 사용자에게 안내한 뒤).
  async function prepareEditorCourseForViewer() {
    if (waypoints.length < 2) {
      alert('먼저 경유지를 2개 이상 찍어주세요.');
      return null;
    }

    if (allTrailPoints.length === 0) {
      await createTrailRoute();
    }

    // 끊긴 지점(gapAfter)이 남아있으면 뷰어는 그 표시를 모르고 그대로
    // 이어서 그리므로, 저장 전에 다시 이을지 사용자에게 확인시킨다.
    const hasGap = allTrailPoints.some(p => p.gapAfter);
    if (hasGap) {
      const proceed = confirm('🟡 아직 다시 잇지 않은 끊긴 지점이 있습니다.\n\n이대로 저장하면 그 구간이 직선으로 이어진 것처럼 보일 수 있습니다.\n\n그래도 계속 저장할까요? (노란 점을 눌러 먼저 이어주는 것을 권장합니다)');
      if (!proceed) return null;
    }

    let courseName = document.getElementById('courseNameInput').value.trim();
    if (!courseName) courseName = '직접 제작한 등산로';

    try {
      // editor:접두사를 부여하여 동일 이름으로 다시 테스트 시 중복 슬롯 소진 없이 갱신(upsert)
      const sourceKey = 'editor:' + courseName;
      const pointsToSave = allTrailPoints.map(p => ({
        lat: p.lat,
        lon: p.lon,
        ele: (p.ele !== undefined ? p.ele : null),
        time: p.time || null
      }));
      // 🐛 2026-10-02 수정(사용자 재현: "gps_replay.html에서 지명이 왜
      // 안 나와? 지명이 나와야지 회전 방향 검증을 할 수 있어") — 지명
      // (갈림길/봉우리 등)의 실제 소스는 waypoints(사용자가 지도에 찍은
      // 경로 생성용 점, {lat,lon}만 있고 이름이 없다)가 아니라
      // importedGpxWpts(기존 GPX를 불러왔을 때 들어있던 <wpt>,
      // {lat,lon,name,ele})다 — gpx_editor.html은 궤적(trkpt)만 편집하고
      // 지명 자체는 건드리지 않는 도구라는 설계(buildGpxXml 정의부
      // 주석 참고). pointsToSave는 평범한 배열이라 .waypoints 속성이
      // 없었던 탓에 saveRouteToViewerStorage의 points.waypoints가 항상
      // 빈 배열로 저장되고 있었다.
      pointsToSave.waypoints = importedGpxWpts;
      saveRouteToViewerStorage(courseName, sourceKey, pointsToSave);
      return { courseName, sourceKey };
    } catch(e) {
      alert('뷰어 연동 중 오류: ' + e.message);
      return null;
    }
  }

  // 내 뷰어(track_viewer.html)로 바로 테스트 — 2026-10-02: viewer_pc.html을
  // 더 이상 쓰지 않아 track_viewer.html을 직접 연다. track_viewer.html은
  // ?url=<sourceKey>가 실제 GPX 파일로 fetch되지 않으면(editor: 접두사는
  // 애초에 그런 URL이 아님) localStorage(findSavedRoute)로 자동 폴백해
  // 방금 저장한 좌표를 그대로 그린다(track_viewer.html DOMContentLoaded
  // 핸들러의 fetchGPXFile 실패 분기 참고).
  async function previewInViewer() {
    const prepared = await prepareEditorCourseForViewer();
    if (!prepared) return;
    const { courseName, sourceKey } = prepared;
    const viewerUrl = './track_viewer.html?url=' + encodeURIComponent(sourceKey) + '&name=' + encodeURIComponent(courseName);
    window.open(viewerUrl, '_blank');
  }

  // 📡 GPS 재생 테스트(gps_replay.html)로 바로 연결 — 사용자 지시
  // (2026-10-02): "gpx-editor에서 생성한 gpx맵을 여기서 test 하고
  // 싶어". previewInViewer와 동일하게 localStorage(saved_hiking_routes_v2)
  // 에 저장한 뒤, gps_replay.html에 ?source=<sourceKey>를 넘긴다 —
  // gps_replay.html은 이 파라미터가 있으면 GPX 파일 URL을 fetch하지
  // 않고 바로 localStorage에서 좌표를 읽어 재생 준비를 마친다(일반
  // ?gpx=<url> 입력 경로와는 별개의 분기, gps_replay.html의
  // initFromQuery/loadCourse 정의부 참고).
  async function previewInGpsReplay() {
    const prepared = await prepareEditorCourseForViewer();
    if (!prepared) return;
    const { courseName, sourceKey } = prepared;
    const replayUrl = './gps_replay.html?source=' + encodeURIComponent(sourceKey) + '&name=' + encodeURIComponent(courseName);
    window.open(replayUrl, '_blank');
  }

  // 🔗 두 GPX를 이어붙였을 때, 트랙1 끝부분과 트랙2 시작부분이 실제로는
  // 같은 길을 걸은 겹침 구간(예: 갈림길에서 왕복)인 경우가 흔하다.
  // joinIdx(이어붙이기 직전 트랙1의 마지막 점 인덱스)에서 시작해, 트랙1
  // 쪽은 인덱스를 하나씩 줄이고 트랙2 쪽은 하나씩 늘리며 바깥으로 함께
  // 확장한다(그리디) — 두 점이 OVERLAP_MAX_GAP_M 이내로 가까운 동안만
  // 계속 확장하고, 처음으로 멀어지는 순간 멈춘다. 이렇게 "가장 멀리까지
  // 함께 가까운 상태가 유지되는 지점"을 찾아야, 왕복 겹침 구간 전체가
  // 제거된다 — 단순히 "가장 가까운 점 쌍 1개"만 찾으면, joinIdx 바로
  // 옆(이어붙인 이음매 자체)이 우연히 최소 거리로 뽑혀 정작 왕복 구간은
  // 하나도 못 지우는 문제가 있었다(로컬 시뮬레이션으로 확인). 확장이
  // 전혀 안 되면(처음부터 이미 멀면) 실제로 안 겹치는 것으로 보고
  // 아무것도 하지 않는다 — 기존 "끊어진 채로 이어붙이고 사용자가 직접
  // 정리"하는 흐름으로 폴백(2026-09-21 요청: "겹치는 부분 자동 처리").
  const OVERLAP_SEARCH_RANGE = 60;   // joinIdx 앞뒤로 이만큼까지만 확장한다
  const OVERLAP_MAX_GAP_M = 30;      // 이보다 가까워야 "겹친다"고 판단

  function trimOverlapAtJoin(joinIdx) {
    const n = allTrailPoints.length;
    const track1Start = Math.max(0, joinIdx - OVERLAP_SEARCH_RANGE);
    const track2End = Math.min(n - 1, joinIdx + 1 + OVERLAP_SEARCH_RANGE);

    let best = null; // { i1, i2 } — 지금까지 확장에 성공한 가장 바깥쪽 쌍
    let i1 = joinIdx, i2 = joinIdx + 1;
    while (i1 >= track1Start && i2 <= track2End) {
      const p1 = allTrailPoints[i1], p2 = allTrailPoints[i2];
      const d = calcDistanceM(p1.lat, p1.lon, p2.lat, p2.lon);
      if (d > OVERLAP_MAX_GAP_M) break;
      best = { i1, i2 };
      i1--; i2++;
    }

    if (!best) return 0;

    // best.i1(트랙1 쪽 겹침 지점) 뒤와 best.i2(트랙2 쪽 겹침 지점) 앞
    // 사이의 잉여 점들을 지운다 — 남는 두 점(i1, i2)은 서로 30m 이내로
    // 가까우므로 그 사이는 사실상 "같은 지점"으로 보고 이어 그린다.
    const removedCount = best.i2 - best.i1 - 1;
    if (removedCount <= 0) return 0;
    allTrailPoints.splice(best.i1 + 1, removedCount);
    return removedCount;
  }

  // 기존 GPX 파일 불러오기
  function parseGpxTrkpts(text) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'text/xml');
    const trkpts = Array.from(xml.querySelectorAll('trkpt'));
    if (!trkpts.length) throw new Error('GPX 파일 안에 트랙 포인트가 없습니다.');

    return trkpts.map(pt => {
      const lat = parseFloat(pt.getAttribute('lat'));
      const lon = parseFloat(pt.getAttribute('lon'));
      const eleEl = pt.querySelector('ele') || pt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      const timeEl = pt.querySelector('time') || pt.getElementsByTagName('time')[0];
      const time = timeEl ? timeEl.textContent.trim() : null;
      return {
        lat,
        lon,
        ele: (ele !== null && !isNaN(ele) ? ele : null),
        time: time || null
      };
    }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
  }

  // GPX 안의 <wpt>(지명 마커, gpx-map.html이 만듦)를 그대로 읽어둔다.
  // gpx_editor는 이 값을 편집하거나 화면에 쓰지 않고, 저장 시 그대로
  // 다시 내보내기만 한다(importedGpxWpts 선언부 주석 참고).
  function parseGpxWpts(text) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, 'text/xml');
    const wpts = Array.from(xml.querySelectorAll('wpt'));
    return wpts.map(wpt => {
      const lat = parseFloat(wpt.getAttribute('lat'));
      const lon = parseFloat(wpt.getAttribute('lon'));
      const nameEl = wpt.querySelector('name') || wpt.getElementsByTagName('name')[0];
      const name = nameEl ? nameEl.textContent.trim() : '';
      const eleEl = wpt.querySelector('ele') || wpt.getElementsByTagName('ele')[0];
      const ele = eleEl ? parseFloat(eleEl.textContent) : null;
      return { lat, lon, name, ele: (ele !== null && !isNaN(ele)) ? ele : null };
    }).filter(w => !isNaN(w.lat) && !isNaN(w.lon) && w.name);
  }

  function importGPX(e) {
    const file = e.target.files[0];
    if (!file) return;

    const courseName = file.name.replace(/\.gpx$/i, '').replace(/_/g, ' ');

    const reader = new FileReader();
    reader.onload = async function(evt) {
      try {
        const newPoints = parseGpxTrkpts(evt.target.result);
        const newWpts = parseGpxWpts(evt.target.result);

        // 이미 궤적이 있으면 "새로 시작"할지 "GPX 2개를 합치기 위해 끝에 이어붙일지" 물어본다
        let appendMode = false;
        if (allTrailPoints.length > 0) {
          appendMode = confirm(`📂 이미 만들어진 등산로가 있습니다.\n\n[확인] = 지금 궤적 끝에 '${courseName}'를 끊어진 채로 이어붙입니다 (두 GPX를 합칠 때 사용, 이어붙인 뒤 끝점·시작점을 직접 맞추거나 🔁 박스 재라우팅으로 연결하세요)\n[취소] = 기존 내용을 지우고 '${courseName}'로 새로 시작합니다`);
        }

        if (appendMode) {
          saveHistory();
          const joinIdx = allTrailPoints.length - 1; // 이어붙이기 직전, 트랙1의 마지막 점 인덱스
          allTrailPoints = allTrailPoints.concat(newPoints);
          waypoints = [allTrailPoints[0], allTrailPoints[allTrailPoints.length - 1]];
          // 두 GPX를 합치는 경우, 지명(wpt)도 양쪽을 그대로 합쳐서 들고 있는다.
          importedGpxWpts = importedGpxWpts.concat(newWpts);

          const trimmed = trimOverlapAtJoin(joinIdx);
          if (trimmed > 0) {
            showToast(`📂 '${courseName}'를 이어붙이고, 겹치는 구간의 잉여 점 ${trimmed}개를 자동으로 정리했습니다.`);
          } else {
            showToast(`📂 '${courseName}'를 기존 궤적 끝에 이어붙였습니다. 두 파일 사이는 끊어진 상태입니다 — 점을 드래그하거나 🔁 박스 구간 재라우팅으로 연결하세요.`);
          }
        } else {
          importedGpxWpts = newWpts;
          document.getElementById('courseNameInput').value = courseName;
          autoSizeCourseNameInput();

          allTrailPoints = newPoints;
          waypoints = [allTrailPoints[0], allTrailPoints[allTrailPoints.length - 1]];

          // 외부 GPX는 fallback 이력을 알 수 없으므로 검증 상태를 초기화
          fallbackRanges = [];
          fallbackLines.forEach(l => map.removeLayer(l));
          fallbackLines = [];
          anomalyMarkers.forEach(m => map.removeLayer(m));
          anomalyMarkers = [];
          closeValidationPanel();

          saveHistory();
          showToast(`📂 '${courseName}' GPX를 불러왔습니다!\n점을 드래그하거나 우클릭하여 자유롭게 수정하세요.`);
        }

        renderWaypoints();

        if (!trailPolyline) {
          trailPolyline = L.polyline([], {
            color: '#d32f2f',
            weight: 6,
            opacity: 0.95,
            interactive: false
          }).addTo(map);
        }
        trailPolyline.setLatLngs(trailPointsToSegments(allTrailPoints));
        map.fitBounds(trailPolyline.getBounds(), { padding: [60, 60] });

        setEditMode('editTrail');

        // 불러온 GPX의 고도값을 보완(결측 시)하고, 계단식으로 튀지 않도록 항상 스무딩한다
        showToast('⏳ 고도 정보를 정리하는 중입니다...');
        allTrailPoints = await fillMissingElevations(allTrailPoints);
        trailPolyline.setLatLngs(trailPointsToSegments(allTrailPoints));
        showToast('✅ 고도 정보 처리가 완료되었습니다.');
      } catch(err) {
        alert('GPX 불러오기 오류: ' + err.message);
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  }

  // gpx_editor.html이 https(8444)로 열리는데 hikingbot API는 http(8000)라
  // 브라우저가 혼합 콘텐츠(Mixed Content)로 차단하는 문제가 있었다. Apache
  // 리버스 프록시(tls.conf의 /segments/ 등 규칙)가 같은 출처(8444)에서
  // hikingbot_container로 중계해주므로, 절대 주소 대신 빈 문자열(상대
  // 경로)을 쓴다 — 이러면 어떤 호스트로 접속해도(https든 http든) 항상
  // 지금 페이지와 같은 출처로 요청이 나간다. "등산로 만들기"가 공공데이터
  // 트랙을 우선 시도할 때(fetchTrailSegment) 이 상수를 쓴다.
  const HIKINGBOT_API_BASE = '';

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    t.style.opacity = '1';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.style.opacity = '0';
      setTimeout(() => { t.style.display = 'none'; }, 400);
    }, 2800);
  }

  // ==========================================
  // 상태 변수 및 실행 취소/다시 실행 스택
  // ==========================================
  let currentEditMode = 'waypoint'; // 'waypoint', 'editTrail', 'delete', 'append'
  let vertexMarkerGroup = null;
  let undoStack = [];
  let redoStack = [];

  function saveHistory() {
    undoStack.push({
      allTrailPoints: JSON.parse(JSON.stringify(allTrailPoints)),
      waypoints: JSON.parse(JSON.stringify(waypoints))
    });
    if (undoStack.length > 40) undoStack.shift();
    redoStack = [];
  }

  function undoHistory() {
    if (undoStack.length === 0) {
      if (waypoints.length > 0) {
        undoLastPoint();
        return;
      }
      showToast('↩️ 더 이상 되돌릴 작업이 없습니다.');
      return;
    }
    redoStack.push({
      allTrailPoints: JSON.parse(JSON.stringify(allTrailPoints)),
      waypoints: JSON.parse(JSON.stringify(waypoints))
    });

    const prev = undoStack.pop();
    allTrailPoints = prev.allTrailPoints;
    waypoints = prev.waypoints;

    renderWaypoints();
    renderTrailAndHandles();
    updateTrailStats();
    showToast('↩️ 이전 상태로 되돌렸습니다. (Undo)');
  }

  function redoHistory() {
    if (redoStack.length === 0) {
      showToast('↪️ 다시 실행할 작업이 없습니다.');
      return;
    }
    undoStack.push({
      allTrailPoints: JSON.parse(JSON.stringify(allTrailPoints)),
      waypoints: JSON.parse(JSON.stringify(waypoints))
    });

    const next = redoStack.pop();
    allTrailPoints = next.allTrailPoints;
    waypoints = next.waypoints;

    renderWaypoints();
    renderTrailAndHandles();
    updateTrailStats();
    showToast('↪️ 다시 실행했습니다. (Redo)');
  }

  // 키보드 단축키 지원 (Ctrl + Z, Ctrl + Y)
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) {
        redoHistory();
      } else {
        undoHistory();
      }
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      redoHistory();
    }
  });

  // 편집 모드 변경
  function setEditMode(mode) {
    // segmentDelete 모드를 벗어나거나 다시 들어올 때는 이전에 찍어둔
    // 시작점을 남겨두지 않는다 — 다른 모드를 거쳐 돌아왔을 때 잊고 있던
    // 시작점 기준으로 엉뚱한 범위가 삭제되는 것을 막는다.
    if (currentEditMode === 'segmentDelete' && mode !== 'segmentDelete') {
      segmentDeleteStartIdx = null;
    }
    if (mode === 'segmentDelete') {
      segmentDeleteStartIdx = null;
    }
    // connect도 같은 이유로 첫 클릭(시작점)을 리셋한다.
    if (currentEditMode === 'connect' && mode !== 'connect') {
      connectStartIdx = null;
    }
    if (mode === 'connect') {
      connectStartIdx = null;
    }
    // append도 같은 이유로 모드를 벗어나거나 다시 들어올 때 기준점을
    // 리셋한다 — 잊고 있던 기준점 뒤에 엉뚱하게 점이 끼워지는 것을 막는다.
    if (currentEditMode === 'append' && mode !== 'append') {
      appendAfterIdx = null;
    }
    if (mode === 'append') {
      appendAfterIdx = null;
    }
    // 박스 재라우팅 미리보기가 떠 있는 채로 다른 모드로 나가면, 적용도
    // 취소도 안 한 낡은 미리보기가 화면에 계속 남을 수 있다 — 모드를
    // 벗어나는 시점에 원래 경로는 건드리지 않고 미리보기만 정리한다.
    if (currentEditMode === 'boxRelink' && mode !== 'boxRelink' && boxRelinkPreviewState) {
      clearBoxRelinkPreview();
    }
    // 구간 후보 비교도 같은 이유로, 모드를 벗어나면 후보 미리보기를 정리한다.
    if (currentEditMode === 'boxCandidates' && mode !== 'boxCandidates' && boxCandidatesState) {
      clearBoxCandidatesPreview();
    }
    currentEditMode = mode;
    document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));

    const activeBtn = {
      'waypoint': document.getElementById('btnModeWaypoint'),
      'editTrail': document.getElementById('btnModeEditTrail'),
      'delete': document.getElementById('btnModeDelete'),
      'append': document.getElementById('btnModeAppend'),
      'boxDelete': document.getElementById('btnModeBoxDelete'),
      'boxRelink': document.getElementById('btnModeBoxRelink'),
      'segmentDelete': document.getElementById('btnModeSegmentDelete'),
      'connect': document.getElementById('btnModeConnect'),
      'boxCandidates': document.getElementById('btnModeBoxCandidates'),
      'boxCleanup': document.getElementById('btnModeBoxCleanup')
    }[mode];
    if (activeBtn) activeBtn.classList.add('active');

    // 박스 선택 모드에서는 지도 자체 드래그(패닝)를 막고 사각형 드래그로만 조작
    if (mode === 'boxDelete' || mode === 'boxRelink' || mode === 'boxCandidates' || mode === 'boxCleanup') {
      map.dragging.disable();
    } else {
      map.dragging.enable();
    }

    // editTrail 모드에서만 트랙 출처 색상 오버레이를 보여준다 — 다른
    // 모드로 나가면(waypoint는 renderTrailAndHandles를 아예 안 거치므로
    // 특히) 여기서 확실히 지워야 오버레이가 화면에 남지 않는다.
    if (mode !== 'editTrail') {
      sourceOverlayLines.forEach(l => map.removeLayer(l));
      sourceOverlayLines = [];
    }

    // 모드 전환에 따른 안내 및 레이어 갱신
    if (mode === 'waypoint') {
      if (vertexMarkerGroup) vertexMarkerGroup.clearLayers();
      showToast('📍 [경유지 찍기 모드]\n지도 위를 마우스로 클릭하여 경유지를 추가하세요. 이미 찍힌 경유지는 드래그하여 옮길 수 있습니다.');
    } else if (mode === 'editTrail') {
      if (allTrailPoints.length === 0 && waypoints.length >= 2) {
        createTrailRoute().then(() => renderTrailAndHandles());
      } else {
        renderTrailAndHandles();
      }
      showToast('✏️ [궤적 직접 수정 모드]\n- 흰색 점을 드래그하여 원하는 등산로로 옮기세요.\n- 빨간색 선 위를 클릭하면 새로운 점이 추가됩니다.\n- 점 위에서 마우스 우클릭 시 삭제됩니다.\n- 색선(파랑:공공데이터ㅣ보라:OSRMㅣ청록:BRouterㅣ노랑 점선:직선)으로 트랙 출처를 구분해 보여줍니다.');
    } else if (mode === 'delete') {
      renderTrailAndHandles();
      showToast('✂️ [점 삭제 지우개 모드]\n지우고 싶은 점을 마우스로 클릭하면 쏙쏙 삭제되며 등산로가 매끄럽게 연결됩니다.');
    } else if (mode === 'append') {
      renderTrailAndHandles();
      showToast('➕ [이어그리기 모드]\n먼저 기준으로 삼을 흰 점을 클릭하세요(초록색으로 표시됩니다). 그 다음부터 지도를 클릭하면 기준점 바로 뒤에 새 점이 계속 추가됩니다.');
    } else if (mode === 'boxDelete') {
      renderTrailAndHandles();
      showToast('🔲 [박스 선택 삭제 모드]\n왼쪽→오른쪽 드래그: 박스에 걸치기만 해도 삭제(크로싱)\n오른쪽→왼쪽 드래그: 박스 안에 완전히 들어간 점만 삭제(윈도우)');
    } else if (mode === 'boxRelink') {
      renderTrailAndHandles();
      showToast('🔁 [박스 구간 재라우팅 모드]\n박스로 감싼 구간만 양 끝을 고정하고 실제 산길로 다시 연결합니다.\n박스 밖의 나머지 경로는 전혀 바뀌지 않습니다.');
    } else if (mode === 'segmentDelete') {
      renderTrailAndHandles();
      showToast('🗑️ [경로 조각 구간 삭제 모드]\n지울 구간의 시작점을 클릭하면 보라색으로 표시됩니다. 이어서 끝점을 클릭하면 그 사이 점이 전부 지워집니다.\n(시작점을 다시 클릭하면 선택 취소)');
    } else if (mode === 'boxCandidates') {
      renderTrailAndHandles();
      showToast('🧭 [구간 후보 비교 모드 — 실험적]\n박스로 구간을 감싸면, 내 DB에서 그 구간을 잇는 서로 다른 경로 후보를 모두 찾아 색이 다른 점선으로 보여줍니다. 원하는 후보를 클릭해 선택한 뒤 적용하세요.');
    } else if (mode === 'boxCleanup') {
      renderTrailAndHandles();
      showToast('🧽 [박스 구간 강제 정제 모드]\n"🧹 정제 미리보기"가 애매하다고 보존해 "⚠️ 헤맴 구간"으로 남은 지그재그/서성임을, 박스로 감싼 범위만큼 무조건 진입점→대표점→이탈점으로 압축하고 전체를 5m 간격으로 재샘플링합니다.');
    }
  }

  // 선분과 점 사이의 거리 계산 (선 위 클릭 시 가장 가까운 세그먼트 찾기)
  function sqr(x) { return x * x; }
  function dist2(v, w) { return sqr(v.lat - w.lat) + sqr(v.lon - w.lon); }
  function distToSegmentSquared(p, v, w) {
    const l2 = dist2(v, w);
    if (l2 === 0) return dist2(p, v);
    let t = ((p.lat - v.lat) * (w.lat - v.lat) + (p.lon - v.lon) * (w.lon - v.lon)) / l2;
    t = Math.max(0, Math.min(1, t));
    return dist2(p, { lat: v.lat + t * (w.lat - v.lat), lon: v.lon + t * (w.lon - v.lon) });
  }

  function findClosestSegmentIndex(lat, lon) {
    let minD = Infinity;
    let bestIdx = 0;
    for (let i = 0; i < allTrailPoints.length - 1; i++) {
      const p1 = allTrailPoints[i];
      const p2 = allTrailPoints[i + 1];
      const d = distToSegmentSquared({ lat, lon }, p1, p2);
      if (d < minD) {
        minD = d;
        bestIdx = i;
      }
    }
    return bestIdx;
  }

  // 점 삭제 함수
  function deletePoint(index) {
    if (allTrailPoints.length <= 2) {
      alert('등산로는 최소 2개 이상의 점이 있어야 합니다.');
      return;
    }
    saveHistory();
    // 이 점이 gapAfter를 갖고 있었다면(끊긴 지점 자체), 삭제 후 그 앞뒤가
    // 배열상 인접해지면서 gap 표시가 사라져 직선으로 도로 이어진 것처럼
    // 보인다. 바로 앞 점으로 끊김 표시를 넘겨 계속 끊긴 상태를 유지한다.
    if (allTrailPoints[index].gapAfter && index > 0) {
      allTrailPoints[index - 1].gapAfter = true;
    }
    allTrailPoints.splice(index, 1);
    renderTrailAndHandles();
    updateTrailStats();
    showToast(`✂️ ${index + 1}번째 점을 삭제했습니다. 앞뒤 등산로가 연결되었습니다.`);
  }

  // 🗑️ 경로 조각 삭제 모드: 시작점과 끝점을 각각 클릭해 범위를 지정하면
  // 그 사이(양 끝 포함) 노드를 전부 지운다. gap(끊긴 지점) 경계와 무관하게
  // 사용자가 직접 지정한 두 점 사이만 지운다 — 이전에는 클릭한 점이 속한
  // gap~gap 전체 구간을 자동으로 찾아 지웠는데, 사용자가 "노란 끊긴
  // 지점부터 내가 클릭한 곳까지만" 지우려 해도 그 조각 전체(엉뚱하게 더
  // 넓은 범위)가 삭제되는 문제가 있었다.
  let connectStartIdx = null; // ⑧ 끊긴 점 연결 모드 — 첫 번째 클릭(시작점) 대기 중인 인덱스

  // 끊긴 두 점(gapAfter로 갈라진 구간의 양쪽)을 순서대로 클릭하면, 그
  // 사이의 모든 gapAfter를 지워 즉시 직선으로 잇는다(2026-09-20 요청 —
  // "구간 지우고 새 점을 만들었는데 그 끝점을 연결하고 싶다"). segmentDelete
  // 모드와 동일한 2클릭 패턴을 따른다. 좌표는 이미 있으므로 gapAfter만
  // 지우면 trailPointsToSegments가 자동으로 직선으로 이어 그린다 — 새로운
  // 점을 만들지 않는다.
  function connectClickAt(pointIdx) {
    if (connectStartIdx === null) {
      connectStartIdx = pointIdx;
      renderTrailAndHandles();
      showToast(`🔗 시작점(${pointIdx + 1}번)을 선택했습니다. 이을 끝점을 클릭하세요. (다시 시작점을 클릭하면 취소)`);
      return;
    }

    if (pointIdx === connectStartIdx) {
      connectStartIdx = null;
      renderTrailAndHandles();
      showToast('🔗 시작점 선택을 취소했습니다.');
      return;
    }

    const start = Math.min(connectStartIdx, pointIdx);
    const end = Math.max(connectStartIdx, pointIdx);
    connectStartIdx = null;

    const hasGap = allTrailPoints.slice(start, end).some(p => p.gapAfter);
    if (!hasGap) {
      showToast('🔗 두 점 사이에 끊긴 구간이 없습니다 — 이미 이어져 있습니다.');
      renderTrailAndHandles();
      return;
    }
    saveHistory();
    for (let i = start; i < end; i++) {
      delete allTrailPoints[i].gapAfter;
    }
    renderTrailAndHandles();
    updateTrailStats();
    showToast('🔗 두 점을 직선으로 이었습니다.');
  }

  let segmentDeleteStartIdx = null; // 첫 번째 클릭(시작점) 대기 중인 인덱스

  function segmentDeleteClickAt(pointIdx) {
    if (segmentDeleteStartIdx === null) {
      segmentDeleteStartIdx = pointIdx;
      renderTrailAndHandles(); // 시작점을 강조 표시하기 위해 다시 그림
      showToast(`🗑️ 시작점(${pointIdx + 1}번)을 선택했습니다. 끝점을 클릭하세요. (다시 시작점을 클릭하면 취소)`);
      return;
    }

    if (pointIdx === segmentDeleteStartIdx) {
      segmentDeleteStartIdx = null;
      renderTrailAndHandles();
      showToast('🗑️ 시작점 선택을 취소했습니다.');
      return;
    }

    const start = Math.min(segmentDeleteStartIdx, pointIdx);
    const end = Math.max(segmentDeleteStartIdx, pointIdx);
    segmentDeleteStartIdx = null;
    deleteSegmentRange(start, end);
  }

  // start~end(양 끝 포함) 노드를 지운다. 지워진 자리 양 끝이 둘 다
  // 남으면(중간 구간 삭제) 박스 삭제와 동일하게 기본적으로 끊긴 채로
  // 남긴다 — 직선으로 자동 봉합되지 않도록 앞쪽 남는 점에 gapAfter를 찍는다.
  function deleteSegmentRange(start, end) {
    const count = end - start + 1;
    if (allTrailPoints.length - count < 2) {
      alert('이 구간을 지우면 남는 점이 너무 적습니다. 등산로는 최소 2개 이상의 점이 있어야 합니다.');
      renderTrailAndHandles();
      return;
    }
    const confirmed = confirm(`🗑️ 선택한 구간(점 ${count}개)을 지울까요?\n\n연결된 직선도 함께 사라지고, 다시 잇지 않습니다.`);
    if (!confirmed) { renderTrailAndHandles(); return; }

    const beforePoint = start > 0 ? allTrailPoints[start - 1] : null;
    const afterPoint = end < allTrailPoints.length - 1 ? allTrailPoints[end + 1] : null;

    saveHistory();
    if (beforePoint && afterPoint) {
      beforePoint.gapAfter = true;
    }
    allTrailPoints.splice(start, count);
    renderTrailAndHandles();
    updateTrailStats();
    showToast(`🗑️ 선택한 구간(점 ${count}개)을 지웠습니다.`);
  }

  // 등산로 궤적 및 핸들 마커 렌더링
  function renderTrailAndHandles() {
    if (!trailPolyline) {
      trailPolyline = L.polyline([], {
        color: '#d32f2f',
        weight: 6,
        opacity: 0.95,
        interactive: true
      }).addTo(map);
    }

    // Leaflet은 폴리라인의 클릭 판정 영역을 weight(픽셀)만큼만 잡는다 —
    // 화면에 보이는 선 굵기(6px) 그대로 클릭해야 해서, 실제로는 선
    // 근처에 가까이 가도 커서가 손 모양으로 안 바뀌는 경우가 많았다
    // (2026-09-21 신고). 눈에는 안 보이는 투명하고 훨씬 굵은(24px)
    // 히트 영역 레이어를 선 위에 겹쳐 그려서, 시각적으로는 그대로
    // 6px 선이지만 클릭은 그 주변 넉넉한 범위에서도 인식되게 한다.
    // trailPolyline 자체는 createTrailRoute() 등 다른 곳에서
    // interactive:false로 먼저 만들어지는 경우가 있어(초기 경로 생성
    // 직후), trailPolyline의 존재 여부가 아니라 trailPolylineHit의
    // 존재 여부로 독립적으로 판단해야 히트 레이어가 누락되지 않는다.
    if (!trailPolylineHit) {
      trailPolylineHit = L.polyline([], {
        color: '#000000',
        weight: 24,
        opacity: 0,
        interactive: true
      }).addTo(map);

      const handleTrailClick = (e) => {
        if (currentEditMode === 'editTrail' || currentEditMode === 'waypoint') {
          const clickLat = e.latlng.lat;
          const clickLon = e.latlng.lng;
          const insertIdx = findClosestSegmentIndex(clickLat, clickLon);
          saveHistory();
          allTrailPoints.splice(insertIdx + 1, 0, { lat: clickLat, lon: clickLon });
          renderTrailAndHandles();
          updateTrailStats();
          showToast('📍 선 위에 새로운 점이 삽입되었습니다! 드래그하여 위치를 조정하세요.');
        } else if (currentEditMode === 'segmentDelete') {
          const insertIdx = findClosestSegmentIndex(e.latlng.lat, e.latlng.lng);
          segmentDeleteClickAt(insertIdx);
        }
      };
      // 빨간 선 클릭 시 새로운 중간 점 삽입! (보이는 선과 투명 히트 영역 둘 다에 등록)
      trailPolyline.on('click', handleTrailClick);
      trailPolylineHit.on('click', handleTrailClick);
    }

    trailPolyline.setLatLngs(trailPointsToSegments(allTrailPoints));
    if (trailPolylineHit) trailPolylineHit.setLatLngs(trailPointsToSegments(allTrailPoints));

    if (!vertexMarkerGroup) {
      vertexMarkerGroup = L.layerGroup().addTo(map);
    }
    vertexMarkerGroup.clearLayers();

    if (currentEditMode === 'waypoint') {
      return; // 경유지 모드일 때는 궤적 점 핸들 숨김
    }

    if (!allTrailPoints || allTrailPoints.length === 0) return;

    // 현재 화면(지도 바운드)에 보이는 점들만 고속 렌더링 (대용량 GPX도 60 FPS 유지)
    const bounds = map.getBounds().pad(0.15);
    const visibleIdx = [];
    allTrailPoints.forEach((pt, idx) => {
      if (bounds.contains([pt.lat, pt.lon])) visibleIdx.push(idx);
    });

    // 화면에 보이는 점이 너무 많으면(마커+이벤트리스너 과다 생성으로 버벅임 발생) 일정 간격으로만 핸들 표시
    const MAX_VISIBLE_HANDLES = 300;
    const stride = Math.max(1, Math.ceil(visibleIdx.length / MAX_VISIBLE_HANDLES));

    const lastPointIdx = allTrailPoints.length - 1;
    visibleIdx.forEach((idx, i) => {
      // stride로 건너뛰는 점이라도, 방금 선택한 조각삭제 시작점/이어그리기
      // 기준점만은 항상 그린다 — 샘플링에 걸려 화면에서 사라지면 사용자가
      // 어디를 골랐는지 잊는다. 경로의 진짜 마지막 점도 항상 그린다 —
      // stride에 걸려 화면에서 사라지면, 그 근처의 다른(끝점이 아닌) 점이
      // 마치 끝점인 것처럼 보이는 자리에 찍혀 있어 사용자가 "끝점인 줄
      // 알고" 클릭한 게 실제로는 끝점이 아닌 혼란이 있었다(2026-09-20 신고).
      const isAppendAfter = (currentEditMode === 'append' && idx === appendAfterIdx);
      const isLastPoint = (idx === lastPointIdx);
      const pt = allTrailPoints[idx];
      const hasSnapStatus = pt.snapStatus === 'matched' || pt.snapStatus === 'unmatched';
      // 재매칭 직후에는 어느 점이 매칭/미매칭됐는지가 이 렌더의 핵심
      // 정보이므로, stride 샘플링으로 건너뛰는 점이라도 표시한다.
      const isConnectStart = (currentEditMode === 'connect' && idx === connectStartIdx);
      if (i % stride !== 0 && !(currentEditMode === 'segmentDelete' && idx === segmentDeleteStartIdx) && !isConnectStart && !isAppendAfter && !isLastPoint && !hasSnapStatus) return;

      const isDelete = (currentEditMode === 'delete');
      const isSegDeleteStart = (currentEditMode === 'segmentDelete' && idx === segmentDeleteStartIdx);
      const snapStyle = pt.snapStatus === 'matched' ? 'background:#43a047;border-color:#1b5e20;'
        : pt.snapStatus === 'unmatched' ? 'background:#e53935;border-color:#b71c1c;'
        : '';
      const highlightStyle = isSegDeleteStart ? 'background:#8e24aa;border-color:#4a148c;transform:scale(1.6);'
        : isConnectStart ? 'background:#0288d1;border-color:#01579b;transform:scale(1.6);'
        : isAppendAfter ? 'background:#43a047;border-color:#1b5e20;transform:scale(1.6);'
        : isLastPoint ? 'background:#1976d2;border-color:#0d47a1;transform:scale(1.4);'
        : snapStyle;
      const snapTitleSuffix = pt.snapStatus === 'matched' ? ' — 🟢 공공데이터 매칭됨'
        : pt.snapStatus === 'unmatched' ? ' — 🔴 공공데이터 매칭 안 됨'
        : '';
      const titleText = (isLastPoint ? `🏁 ${idx + 1}번 점 (경로의 마지막 점)` : `${idx + 1}번 점 (드래그: 이동 / 우클릭: 삭제)`) + snapTitleSuffix;
      const iconHtml = `<div class="trail-vertex-handle ${isDelete ? 'delete-mode' : ''}" style="${highlightStyle}" title="${titleText}"></div>`;
      const vIcon = L.divIcon({
        className: 'custom-vertex-icon',
        html: iconHtml,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      const m = L.marker([pt.lat, pt.lon], {
        icon: vIcon,
        draggable: (currentEditMode === 'editTrail'),
        zIndexOffset: 600
      });

      // 점 드래그 실시간 선 갱신
      m.on('drag', (e) => {
        const pos = e.target.getLatLng();
        // gapAfter(끊김 표시)는 유지한 채 좌표만 갱신 — 통째로 새 객체로
        // 바꾸면 이 점이 갖고 있던 끊김 표시가 조용히 사라진다.
        allTrailPoints[idx] = Object.assign({}, allTrailPoints[idx], { lat: pos.lat, lon: pos.lng });
        trailPolyline.setLatLngs(trailPointsToSegments(allTrailPoints));
      });

      // 드래그 완료 시 히스토리 저장
      m.on('dragend', () => {
        saveHistory();
        updateTrailStats();
        showToast(`📍 ${idx + 1}번째 점을 이동했습니다.`);
      });

      // 마우스 우클릭 시 점 즉시 삭제
      m.on('contextmenu', (e) => {
        L.DomEvent.stopPropagation(e);
        deletePoint(idx);
      });

      // 삭제 모드일 때 클릭 시 삭제
      m.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        if (currentEditMode === 'delete') {
          deletePoint(idx);
        } else if (currentEditMode === 'segmentDelete') {
          segmentDeleteClickAt(idx);
        } else if (currentEditMode === 'connect') {
          connectClickAt(idx);
        } else if (currentEditMode === 'append') {
          appendAfterIdx = idx;
          renderTrailAndHandles(); // 기준점 강조 표시 갱신
          showToast(`➕ ${idx}번 점을 기준점으로 선택했습니다. 이어서 지도를 클릭하면 이 점 뒤에 새 점이 추가됩니다.`);
        }
      });

      vertexMarkerGroup.addLayer(m);
    });

    renderSourceOverlay();
  }

  // 트랙 출처(공공데이터/OSRM/BRouter/직선)를 색으로 구분해 보여주는 얇은
  // 오버레이 선. 편집 모드(editTrail)에서만 그린다 — 평소에는 시각적
  // 소음이라 숨겨두고, 실제로 구간을 다듬을 때만 "이 구간이 어디서 왔는지"
  // 확인할 수 있으면 충분하다. 기존 빨간 메인 선(trailPolyline) 위에
  // 얇게 덧그려 메인 선 색은 그대로 유지한다.
  let sourceOverlayLines = [];
  function renderSourceOverlay() {
    sourceOverlayLines.forEach(l => map.removeLayer(l));
    sourceOverlayLines = [];

    if (currentEditMode !== 'editTrail') return;
    if (!allTrailPoints || allTrailPoints.length < 2) return;

    // source가 바뀌는 지점(또는 gapAfter로 끊기는 지점)마다 조각을 나눠
    // 각 조각을 해당 출처 색으로 그린다. source가 없는 점(예: 외부 GPX
    // 불러오기로 만들어져 출처를 알 수 없는 구간)은 덧칠하지 않고 건너뛴다.
    let currentSource = null;
    let currentCoords = [];
    const flush = () => {
      if (currentSource && currentCoords.length >= 2) {
        const meta = TRAIL_SOURCE_META[currentSource];
        if (meta) {
          sourceOverlayLines.push(L.polyline(currentCoords, {
            color: meta.color,
            weight: 3,
            opacity: 0.9,
            dashArray: currentSource === 'straight' ? '4, 8' : null,
            interactive: false
          }).addTo(map));
        }
      }
      currentCoords = [];
    };

    allTrailPoints.forEach((p, idx) => {
      if (p.source !== currentSource) {
        flush();
        currentSource = p.source;
        // 조각 경계에서 선이 끊겨 보이지 않도록, 직전 점을 새 조각의
        // 시작점으로 포함시킨다(이미 push된 좌표라도 다시 시작점으로 씀).
        const prev = allTrailPoints[idx - 1];
        if (prev && !prev.gapAfter) currentCoords.push([prev.lat, prev.lon]);
      }
      currentCoords.push([p.lat, p.lon]);
      if (p.gapAfter) {
        flush();
        currentSource = null;
      }
    });
    flush();
  }

// moveend handler moved into initMap

  // 통계 갱신
  function updateTrailStats() {
    // 편집 동작(점 추가/삭제/이동, 경유지 변경 등) 끝에는 거의 항상 이
    // 함수가 호출되므로, 여기 한 곳에 자동저장을 걸어두면 개별 편집
    // 함수마다 저장 호출을 따로 추가하지 않아도 빠짐없이 저장된다.
    //
    // 재매칭(🔄) 직후 표시한 snapStatus(초록/빨강) 색은 예전엔 "다음
    // 편집이 발생하면" 여기서 전부 무효화했으나, 점 하나만 삭제/이동해도
    // 나머지 점들의 색상 구분까지 통째로 사라져 불편하다는 신고로
    // 제거했다(2026-09-20). 이제 색은 재매칭(🔄) 버튼을 다시 눌러야만
    // 갱신되고, 그 전까지는 어떤 편집을 해도 그대로 유지된다.
    autosaveEditorState();

    if (!allTrailPoints || allTrailPoints.length < 2) {
      return;
    }
    let totalKm = 0.0;
    for (let i = 1; i < allTrailPoints.length; i++) {
      if (allTrailPoints[i-1].gapAfter) continue; // 끊긴 구간은 실제로 걷지 않으므로 거리에 넣지 않는다
      totalKm += calcDistanceKm(allTrailPoints[i-1].lat, allTrailPoints[i-1].lon, allTrailPoints[i].lat, allTrailPoints[i].lon);
    }
    const hours = totalKm / 2.5;
    const h = Math.floor(hours);
    const m = Math.round((hours - h) * 60);
    const timeStr = h > 0 ? `${h}시간 ${m}분` : `${m}분`;

    document.getElementById('totalDist').innerText = `${totalKm.toFixed(2)} km`;
    document.getElementById('estTime').innerText = timeStr;
    document.getElementById('pointCount').innerText = `${allTrailPoints.length} 개 (완성)`;
  }

  // ==========================================
  // 🔍 산길샘 반영 전 안전 검증 기능
  // ==========================================

  // Haversine 거리를 "미터" 단위로 반환 (km 계산기 재사용)
  function calcDistanceM(lat1, lon1, lat2, lon2) {
    return calcDistanceKm(lat1, lon1, lat2, lon2) * 1000;
  }

  // ① Fallback(직선) 구간을 지도에 노란 점선으로 하이라이트
  function renderFallbackHighlights() {
    fallbackLines.forEach(l => map.removeLayer(l));
    fallbackLines = [];

    fallbackRanges.forEach(([startIdx, endIdx]) => {
      const seg = allTrailPoints.slice(startIdx, endIdx + 1).map(p => [p.lat, p.lon]);
      if (seg.length < 2) return;
      const line = L.polyline(seg, {
        color: '#fbc02d',
        weight: 8,
        opacity: 0.85,
        dashArray: '4, 10',
        interactive: false
      }).addTo(map);
      fallbackLines.push(line);
    });
  }

  // ③ 인접 좌표 간 급격한 거리 이상치 탐지
  function detectDistanceAnomalies() {
    const anomalies = [];
    for (let i = 1; i < allTrailPoints.length; i++) {
      const d = calcDistanceM(allTrailPoints[i-1].lat, allTrailPoints[i-1].lon, allTrailPoints[i].lat, allTrailPoints[i].lon);
      if (d >= ANOMALY_JUMP_METERS) {
        anomalies.push({ index: i, meters: d });
      }
    }
    return anomalies;
  }

  function renderAnomalyMarkers(anomalies) {
    anomalyMarkers.forEach(m => map.removeLayer(m));
    anomalyMarkers = [];

    anomalies.forEach(a => {
      const pt = allTrailPoints[a.index];
      const icon = L.divIcon({
        className: 'custom-badge-icon',
        html: `<div class="route-badge" style="background:#e65100;">⚠️ ${Math.round(a.meters)}m 도약</div>`,
        iconAnchor: [30, 12]
      });
      const m = L.marker([pt.lat, pt.lon], { icon }).addTo(map);
      anomalyMarkers.push(m);
    });
  }

  // 검증 결과 요약 데이터 수집 (버튼 클릭 / 저장 직전 공용)
  function collectValidationSummary() {
    const anomalies = detectDistanceAnomalies();

    let warnCount = 0;
    if (fallbackRanges.length > 0) warnCount++;
    if (anomalies.length > 0) warnCount++;

    return { fallbackCount: fallbackRanges.length, anomalies, warnCount };
  }

  // 🔍 버튼 클릭 시: fallback/고도/이상치 3가지 항목을 재검사해 패널에 표시
  async function runValidation() {
    if (allTrailPoints.length < 2) {
      showToast('먼저 등산로를 만들어 주세요.');
      return;
    }
    const btn = document.getElementById('btnRunValidation');
    btn.innerText = '⏳';

    renderFallbackHighlights();
    const anomalies = detectDistanceAnomalies();
    renderAnomalyMarkers(anomalies);

    const summary = collectValidationSummary();
    renderValidationPanel(summary);
    btn.innerText = '🛡️';
  }

  function renderValidationPanel(summary) {
    const body = document.getElementById('validationBody');
    const rows = [];

    rows.push(summary.fallbackCount > 0
      ? `<div class="validation-item warn">⚠️ 직선 대체 구간 ${summary.fallbackCount}건 — 지도의 노란 점선을 확인하세요.</div>`
      : `<div class="validation-item ok">✅ 모든 구간이 실제 산길 데이터로 연결됨</div>`);

    rows.push(summary.anomalies.length > 0
      ? `<div class="validation-item warn">⚠️ 급격한 도약 지점 ${summary.anomalies.length}건 (지도의 주황 마커) — 경로가 튄 구간입니다.</div>`
      : `<div class="validation-item ok">✅ 급격한 좌표 도약 없음</div>`);

    body.innerHTML = rows.join('');
    document.getElementById('validationPanel').style.display = 'flex';
  }

  function closeValidationPanel() {
    document.getElementById('validationPanel').style.display = 'none';
  }

  // 저장 직전 확인 모달
  let pendingExportSummary = null;

  function openConfirmOverlay(summary) {
    const body = document.getElementById('confirmBody');
    const lines = [];
    if (summary.fallbackCount > 0) lines.push(`• 직선 대체 구간 ${summary.fallbackCount}건`);
    if (summary.anomalies.length > 0) lines.push(`• 급격한 도약 지점 ${summary.anomalies.length}건`);
    body.innerHTML = lines.map(l => `<div>${l}</div>`).join('');
    document.getElementById('confirmOverlay').style.display = 'flex';
  }

  function cancelExportGPX() {
    document.getElementById('confirmOverlay').style.display = 'none';
    pendingExportSummary = null;
    runValidation();
  }

  function confirmExportGPX() {
    document.getElementById('confirmOverlay').style.display = 'none';
    pendingExportSummary = null;
    writeGpxFile();
  }

  // 코스 이름 입력창을 입력한 글자 수에 맞춰 자동으로 넓힌다 (최소 6자, CSS의 max-width가 상한을 잡음)
  function autoSizeCourseNameInput() {
    const input = document.getElementById('courseNameInput');
    if (!input) return;
    const len = input.value ? input.value.length : 0;
    input.size = Math.max(6, len + 1);
  }

  // 📌 이 페이지는 서비스워커가 없어(track_viewer.html과 달리) GitHub
  // Pages 기본 HTTP 캐시에만 의존한다 — 배포해도 핸드폰이 한동안 구버전을
  // 그대로 쓸 수 있다. 매번 배포할 때 이 문자열만 올리면, 화면 좌측 하단
  // 뱃지로 "지금 핸드폰이 최신 코드를 받았는지"를 바로 확인할 수 있다.
  const GPX_EDITOR_VERSION = 'v4';

  window.addEventListener('DOMContentLoaded', () => {
    initMap();
    restoreAutosavedEditorState();
    const versionBadgeEl = document.getElementById('editorVersionBadge');
    if (versionBadgeEl) versionBadgeEl.innerText = GPX_EDITOR_VERSION;
    if (waypoints.length === 0) {
      showToast('💡 1. 마우스로 경유지를 찍고 ➡️ 2. [등산로 만들기]를 클릭하세요!');
    }
  });
</script>

</body>
