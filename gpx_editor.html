<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>등산로 GPX 제작기 - 마우스로 찍고 등산로 만들기</title>

  <!-- Leaflet 지도 엔진 -->
  <link rel="stylesheet" href="./leaflet.css">
  <script src="./leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
      background: #1e293b;
    }

    /* 📌 2026-10-04 추가(사용자 재현: "편도왕복" 버튼을 눌렀는데도 저장된
       GPX에 날머리가 안 들어감 — gpx_editor.html은 track_viewer.html과
       달리 서비스워커가 없어 GitHub Pages 기본 HTTP 캐시에만 의존하므로,
       "지금 핸드폰이 받은 코드가 최신인지"를 확인할 방법 자체가 없었다.
       track_viewer.html의 #appVersionBadge와 동일한 패턴으로, 화면
       좌측 하단에 작은 버전 번호를 항상 띄워 사용자가 스크린샷으로
       "이게 최신 코드가 맞는지" 바로 확인할 수 있게 한다. */
    #editorVersionBadge {
      position: fixed; left: 8px; bottom: 6px; z-index: 9000;
      font-size: 10px; color: rgba(255,255,255,0.5); background: rgba(0,0,0,0.3);
      padding: 2px 6px; border-radius: 8px; pointer-events: none;
      font-family: monospace; user-select: none;
    }

    #map {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;
      cursor: crosshair; /* 마우스 커서 조준선 */
    }

    /* 상단 헤더 바 (아이콘 중심, 최소 폭) */
    .top-header {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      display: flex; align-items: center; pointer-events: none;
    }
    .header-panel {
      pointer-events: auto; max-width: calc(100vw - 20px);
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
      padding: 6px 8px; border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15); border: 1.5px solid #81c784;
      display: flex; gap: 6px; align-items: center;
    }
    .brand-icon { font-size: 18px; flex-shrink: 0; }
    .input-course-name {
      /* size 속성(글자수)으로 기본 폭을 잡고, JS가 입력값 길이에 맞춰 size를 갱신해
         타이핑한 만큼 자동으로 넓어지게 함. 화면 밖으로 넘치지 않도록 상한만 CSS로 제한 */
      min-width: 90px; max-width: min(320px, calc(100vw - 130px));
      padding: 6px 9px; font-size: 12.5px; font-weight: 700;
      border: 1.5px solid #a5d6a7; border-radius: 9px; outline: none;
      background: #f1f8e9; color: #1b5e20;
    }
    .input-course-name:focus { border-color: #2e7d32; background: #ffffff; }

    .header-actions {
      display: flex; gap: 4px; align-items: center; pointer-events: auto; flex-shrink: 0;
    }
    .btn-icon-action {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      font-size: 15px; border-radius: 9px; border: 1px solid #cbd5e1; background: #f8fafc;
      color: #334155; cursor: pointer; text-decoration: none; transition: all 0.15s;
    }
    .btn-icon-action:hover { background: #f1f5f9; }
    .btn-icon-action:active { transform: scale(0.92); }
    .btn-icon-action.primary {
      background: #1b5e20; border-color: #1b5e20; color: #fff;
      box-shadow: 0 2px 8px rgba(27,94,32,0.4);
    }
    .btn-icon-action.primary:hover { background: #2e7d32; }

    /* 산 / 지명 검색창 및 결과 드롭다운 */
    .search-box {
      position: absolute; top: 58px; left: 10px; z-index: 1000;
      display: flex; flex-direction: column; pointer-events: auto;
    }
    .search-input-row {
      display: flex; gap: 6px; align-items: center;
    }
    .input-search {
      width: 170px; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
      border-radius: 9px; border: 1.5px solid #c8e6c9; background: rgba(255,255,255,0.95);
      box-shadow: 0 3px 12px rgba(0,0,0,0.12); outline: none;
    }
    .input-search:focus { width: 210px; border-color: #2e7d32; }
    .btn-search {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: #2e7d32; color: #fff; font-size: 14px;
      border: none; border-radius: 9px; cursor: pointer; box-shadow: 0 3px 10px rgba(46,125,50,0.3);
    }

    .search-results-dropdown {
      margin-top: 6px; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px);
      border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.22); border: 1.5px solid #81c784;
      max-height: 290px; overflow-y: auto; display: none; flex-direction: column; width: 310px;
    }
    .search-result-item {
      padding: 10px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: all 0.15s;
      text-align: left;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover, .search-result-item:active {
      background: #e8f5e9; border-left: 4px solid #2e7d32;
    }
    .res-title {
      font-size: 13.5px; font-weight: 800; color: #1b5e20; margin-bottom: 3px;
      display: flex; align-items: center; gap: 5px;
    }
    .res-region {
      font-size: 11.5px; font-weight: 600; color: #64748b;
    }
    .res-empty {
      padding: 14px; font-size: 13px; color: #64748b; text-align: center;
    }

    /* 하단 통계 및 핵심 조작 패널 (한 줄, 좁은 화면에선 가로 스크롤) */
    .bottom-panel {
      position: absolute; bottom: 12px; left: 12px; right: 12px; z-index: 1000;
      pointer-events: auto; display: flex; flex-direction: row; align-items: center;
      justify-content: center; gap: 8px; flex-wrap: nowrap;
      overflow-x: auto; padding-bottom: 2px;
    }

    /* 🌟 핵심 버튼: [ 🥾 등산로 만들기 ] */
    .btn-create-trail {
      pointer-events: auto;
      padding: 10px 22px; font-size: 13.5px; font-weight: 900; color: #ffffff;
      background: linear-gradient(135deg, #e65100, #bf360c);
      border: 2px solid #ffffff; border-radius: 24px;
      box-shadow: 0 4px 16px rgba(191, 54, 12, 0.4); cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: all 0.2s;
      animation: pulseBtn 2s infinite; white-space: nowrap; flex-shrink: 0;
    }
    .btn-create-trail:active { transform: scale(0.94); }
    .btn-create-trail.loading {
      background: #475569; border-color: #94a3b8; animation: none; cursor: wait;
    }
    @keyframes pulseBtn {
      0% { box-shadow: 0 0 0 0 rgba(230, 81, 0, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(230, 81, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(230, 81, 0, 0); }
    }

    .status-card {
      pointer-events: auto; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
      padding: 6px 14px; border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18); border: 1.5px solid #c8e6c9;
      display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; justify-content: center;
      flex-shrink: 0;
    }
    .stat-item {
      display: flex; flex-direction: column; align-items: center;
    }
    .stat-label { font-size: 9.5px; font-weight: 700; color: #64748b; }
    .stat-val { font-size: 14px; font-weight: 900; color: #1b5e20; }

    .control-divider { width: 1px; height: 22px; background: #cbd5e1; }

    /* 우측 플로팅 버튼 */
    .fab-col {
      position: absolute; right: 10px; top: 58px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px;
    }
    .fab-btn {
      width: 36px; height: 36px; border-radius: 50%; background: #ffffff;
      border: 1.5px solid #c8e6c9; box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      display: flex; justify-content: center; align-items: center;
      font-size: 15px; cursor: pointer; color: #2e7d32; transition: all 0.2s;
    }
    .fab-btn:active { transform: scale(0.92); }

    .layer-menu {
      position: absolute; right: 54px; top: 58px; z-index: 1000;
      background: #ffffff; border-radius: 12px; padding: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2); border: 1px solid #c8e6c9;
      display: none; flex-direction: column; gap: 6px; min-width: 170px;
    }
    .layer-item {
      padding: 8px 12px; font-size: 13px; font-weight: 700; color: #333;
      border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .layer-item.selected { background: #e8f5e9; color: #1b5e20; }
    .layer-item:hover { background: #f1f8e9; }

    /* 마커 뱃지 */
    .route-badge {
      color: #ffffff; font-size: 11px; font-weight: bold; padding: 3px 8px;
      border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.35); white-space: nowrap;
      pointer-events: none;
    }

    /* 알림 토스트 */
    .toast {
      position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 9999;
      background: rgba(15, 23, 42, 0.95); color: #ffffff; font-size: 13.5px; font-weight: 700;
      padding: 10px 22px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      backdrop-filter: blur(4px); pointer-events: none; transition: opacity 0.4s ease;
      display: none; text-align: center; max-width: 90%;
    }
    /* 🌟 편집 모드 툴바 (아이콘 전용, 툴팁으로 설명) */
    .edit-toolbar {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      padding: 5px 8px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      border: 1.5px solid #81c784;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: nowrap;
      justify-content: center;
      flex-shrink: 0;
    }
    .tool-mode-group {
      display: flex;
      gap: 3px;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 11px;
    }
    .btn-mode {
      width: 34px; height: 34px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #475569;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-mode:hover { background: #e2e8f0; }
    .btn-mode.active {
      background: #1b5e20;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(27,94,32,0.35);
    }
    .tool-actions-sub {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .btn-sub-tool {
      width: 30px; height: 30px;
      font-size: 13.5px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-sub-tool:hover { background: #f8fafc; }
    .btn-sub-tool.danger { color: #dc2626; border-color: #fca5a5; }
    .btn-sub-tool.danger:hover { background: #fee2e2; }

    /* 🔲 CAD 방식 박스 선택 사각형 */
    .box-select-rect {
      position: absolute; z-index: 1500; pointer-events: none;
      border-width: 2px; box-sizing: border-box;
    }

    /* 궤적 점 수정 핸들 마커 */
    .custom-vertex-icon {
      overflow: visible !important;
    }
    .trail-vertex-handle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #d32f2f;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      cursor: grab;
      transition: transform 0.1s, background-color 0.15s;
    }
    .trail-vertex-handle:hover {
      transform: scale(1.4);
      background: #ffcdd2;
      border-color: #b71c1c;
    }
    .trail-vertex-handle:active {
      cursor: grabbing;
      transform: scale(1.2);
    }
    .trail-vertex-handle.delete-mode {
      border-color: #e53935;
      background: #ffebee;
      cursor: pointer;
    }
    .trail-vertex-handle.delete-mode:hover {
      background: #d32f2f;
      transform: scale(1.5);
    }

    /* 🔍 검증 결과 패널 */
    .validation-panel {
      position: absolute; right: 54px; top: 58px; z-index: 1000;
      width: 300px; max-height: 60vh; background: rgba(255,255,255,0.98);
      backdrop-filter: blur(10px); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.22);
      border: 1.5px solid #81c784; display: flex; flex-direction: column; overflow: hidden;
    }
    .validation-header {
      padding: 10px 14px; background: #1b5e20; color: #fff; font-size: 13.5px; font-weight: 800;
      display: flex; align-items: center; justify-content: space-between;
    }
    .validation-close {
      background: transparent; border: none; color: #fff; font-size: 15px; cursor: pointer;
    }
    .validation-body {
      padding: 10px 14px; overflow-y: auto; font-size: 12.5px; color: #334155;
    }
    .validation-item {
      display: flex; align-items: flex-start; gap: 6px; padding: 7px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .validation-item:last-child { border-bottom: none; }
    .validation-item.ok { color: #2e7d32; }
    .validation-item.warn { color: #e65100; font-weight: 700; }
    .validation-item .v-link {
      text-decoration: underline; cursor: pointer; color: #1976d2; font-weight: 700;
    }

    /* 저장 전 확인 모달 */
    .confirm-overlay {
      position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .confirm-modal {
      width: 92%; max-width: 380px; background: #fff; border-radius: 16px; padding: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .confirm-title { font-size: 15px; font-weight: 900; color: #bf360c; margin-bottom: 10px; }
    .confirm-body { font-size: 13px; color: #334155; line-height: 1.6; max-height: 40vh; overflow-y: auto; }
    .confirm-note { margin-top: 10px; font-size: 11.5px; color: #dc2626; font-weight: 700; }
    .confirm-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }

    /* 🔁 박스 재라우팅 미리보기 액션바 */
    .box-relink-preview-bar {
      position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%);
      z-index: 1500; background: #fff; border-radius: 14px; padding: 10px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 8px;
      font-size: 12.5px; max-width: min(92vw, 520px); flex-wrap: wrap; justify-content: center;
    }
    .box-relink-preview-bar #boxRelinkPreviewLabel {
      font-weight: 700; color: #1565c0; margin-right: 2px;
      white-space: normal; overflow-wrap: break-word;
    }
    /* .btn-sub-tool은 원래 30x30 정사각형 아이콘 버튼용이라, 여기처럼
       "✅ 이걸로 교체"류 긴 텍스트 라벨을 넣으면 폭이 강제로 눌려 글자가
       겹쳐 보였다(2026-09-20 실사용 신고). 이 액션바 버튼만 폭을 내용에
       맞춰 자동으로 늘어나도록 별도 클래스로 덮어쓴다.
    */
    .box-relink-preview-bar .btn-sub-tool {
      width: auto; height: auto; padding: 6px 10px; white-space: nowrap; font-size: 12.5px;
    }
  </style>
</head>
<body>

<div id="editorVersionBadge"></div>
<div id="map"></div>

<!-- 상단 헤더 (아이콘 중심, 최소 폭) -->
<div class="top-header">
  <div class="header-panel">
    <span class="brand-icon" title="등산로 GPX 제작기">⛰️</span>
    <input type="text" id="courseNameInput" class="input-course-name" placeholder="코스 이름" size="6" oninput="autoSizeCourseNameInput()">
    <div class="header-actions">
      <button class="btn-icon-action primary" onclick="exportGPX()" title="GPX 파일 저장">💾</button>
      <button class="btn-icon-action" onclick="previewInViewer()" title="뷰어로 테스트">🚀</button>
      <button class="btn-icon-action" onclick="previewInGpsReplay()" title="GPS 재생 테스트 (gps_replay.html)">📡</button>
      <button class="btn-icon-action" id="btnSendTelegram" onclick="sendGpxToTelegram()" title="텔레그램으로 GPX 전송 (산길샘 검증용, NAS에서 열었을 때만 동작)">📤</button>
      <a href="./gpx_maker.html" class="btn-icon-action" title="블로그 링크 생성기">🔗</a>
    </div>
  </div>
</div>

<!-- 산 / 지명 검색창 (동명산 구분 & 지역명 선택 지원) -->
<div class="search-box" id="searchContainer">
  <div class="search-input-row">
    <input type="text" id="searchInput" class="input-search" placeholder="산 이름 검색" onkeypress="if(event.key==='Enter') searchLocation()" onfocus="if(this.value.trim()) searchLocation()">
    <button class="btn-search" onclick="searchLocation()" title="검색">🔍</button>
  </div>
  <div class="search-results-dropdown" id="searchResultsDropdown"></div>
</div>

<!-- 우측 플로팅 버튼 -->
<div class="fab-col">
  <button class="fab-btn" onclick="toggleLayerMenu()" title="지도 변경">🗺️</button>
  <button class="fab-btn" onclick="fitRoute()" title="전체 코스 한눈에">🔍</button>
  <label for="importGpxInput" class="fab-btn" title="기존 GPX 파일 불러와서 이어그리기" style="cursor: pointer;">
    📂
    <input type="file" id="importGpxInput" accept=".gpx" style="display: none;" onchange="importGPX(event)">
  </label>
  <button class="fab-btn" id="btnRunValidation" onclick="runValidation()" title="산길샘 반영 전 안전 검증 (Fallback/고도/이상치)">🛡️</button>
</div>

<!-- 검증 결과 패널 -->
<div class="validation-panel" id="validationPanel" style="display:none;">
  <div class="validation-header">
    <span>🔍 검증 결과</span>
    <button class="validation-close" onclick="closeValidationPanel()">✕</button>
  </div>
  <div class="validation-body" id="validationBody"></div>
</div>

<!-- 🔁 박스 재라우팅 미리보기 액션바 — 후보 경로를 지도에 파란 점선으로
     먼저 보여주고, 사용자가 "적용"을 누르기 전까지는 원래 그린 경로를
     건드리지 않는다(2026-09-20: 공공데이터가 항상 1순위 정답이 아니므로
     사용자가 직접 비교해서 고를 수 있어야 한다는 신고 반영). -->
<div class="box-relink-preview-bar" id="boxRelinkPreviewBar" style="display:none;">
  <span id="boxRelinkPreviewLabel">🔁 후보 미리보기</span>
  <button class="btn-sub-tool" onclick="applyBoxRelinkPreview()">✅ 이걸로 교체</button>
  <button class="btn-sub-tool" onclick="tryNextBoxRelinkCandidate()">🔁 다음 후보</button>
  <button class="btn-sub-tool danger" onclick="cancelBoxRelinkPreview()">❌ 취소</button>
</div>

<!-- 🧭 구간 후보 비교(실험적) 액션바 — 색이 다른 점선 여러 개를 동시에
     지도에 그려 보여주고, 그중 하나를 클릭해 선택한 뒤에만 적용한다. -->
<div class="box-relink-preview-bar" id="boxCandidatesBar" style="display:none;">
  <span id="boxCandidatesLabel">🧭 후보 비교 중</span>
  <button class="btn-sub-tool" id="btnApplyBoxCandidates" onclick="applyBoxCandidatesSelection()" disabled>✅ 선택한 후보로 교체</button>
  <button class="btn-sub-tool danger" onclick="cancelBoxCandidatesPreview()">❌ 취소</button>
</div>

<!-- 저장 전 확인 모달 -->

  // 하나뿐이라 기존과 동일하게 이어진 선 하나로 그려진다.
  function trailPointsToSegments(points) {
    const segments = [];
    let current = [];
    points.forEach(p => {
      current.push([p.lat, p.lon]);
      if (p.gapAfter) {
        segments.push(current);
        current = [];
      }
    });
    if (current.length > 0) segments.push(current);
    return segments;
  }

        // 저장하면 gpx-map.html에서 편집한 지명이 통째로 날아간다
        // (신고: "gpx map, gpx editor, gpx map으로 저장 불러오기 하면서

        courseName: (document.getElementById('courseNameInput') || {}).value || '',

      }));
    } catch (e) {} // 저장 용량 초과 등은 자동저장 실패로 조용히 넘어간다 — 편집 자체를 막을 이유는 아니다
  }
  function clearAutosavedEditorState() {
    try { localStorage.removeItem(EDITOR_AUTOSAVE_KEY); } catch (e) {}
  }
  function restoreAutosavedEditorState() {
    let saved = null;
    try {
      const raw = localStorage.getItem(EDITOR_AUTOSAVE_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) {}
    if (!saved || (!saved.waypoints || saved.waypoints.length === 0) && (!saved.allTrailPoints || saved.allTrailPoints.length === 0)) return;

    waypoints = saved.waypoints || [];
    allTrailPoints = saved.allTrailPoints || [];
    importedGpxWpts = saved.importedGpxWpts || [];
    if (saved.courseName) {

  }
  let markerLayers = [];    // 경유지 뱃지 및 마커들
  let isCalculating = false;// 등산로 계산 중 상태
  let naverTileVersion = '1788514292';
  let currentLayerType = 'terrain'; // switchLayer가 마지막으로 그린 레이어 타입 — 버전 갱신 후 재적용에 사용

  const TRAIL_SOURCE_META = {

  };

  // 공공데이터 자동 매칭(박스 재라우팅의 1순위 시도, 재매칭 2차 자동 시도)에
  // 공통으로 쓰는 엄격한 스냅 허용 거리. 서버 기본값(300m)을 그대로 쓰면
  // 사용자가 지정/편집한 구간의 고정점이 실측 트랙에서 수백 m 떨어져
  // 있어도 그 먼 트랙으로 스냅돼, "내가 그린 경로가 무시되고 엉뚱한 곳

  // 60m로 완화한다.
  const STRICT_PUBLIC_DATA_SNAP_DIST_M = 60;

  // 재매칭 2차 자동시도가 반환한 공공데이터 경로를 그대로 받아쓰기 전에
  // 검증하는 최대 이격 거리. STRICT_PUBLIC_DATA_SNAP_DIST_M은 구간의 양
  // 끝점만 검사하므로, 끝점은 가까워도 중간 경로가 그래프 최단경로를 타고
  // 엉뚱한 능선/사면으로 크게 우회하는 사례를 못 막았다(2026-09-20 실사용
  // 신고 — 재약산 하단 구간에서 사용자가 그린 궤적과 전혀 다른 길로 매칭됨).
  // 원본 구간의 각 점에서 새 경로까지의 최대 거리가 이 값을 넘으면 그
  // 통짜 결과는 폐기한다.
  const MAX_ROUTE_DEVIATION_M = 120;

  function maxDeviationFromOriginal(originalPts, candidatePts) {
    let maxDev = 0;
    originalPts.forEach(op => {
      let nearest = Infinity;
      candidatePts.forEach(cp => {
        const d = calcDistanceM(op.lat, op.lon, cp.lat, cp.lon);
        if (d < nearest) nearest = d;
      });
      if (nearest > maxDev) maxDev = nearest;
    });
    return maxDev;
  }

  // 🔄 재매칭(snapTrailToPublicData) 직후 노드를 초록/빨강으로 표시하는

  let appendAfterIdx = null;

  // 최신 네이버 타일 버전 조회.

  // 않으므로, 첫 레이어는 항상 위 초기값(구버전)으로 그려진다. 네이버가
  // 타일 버전을 교체하면 그 구버전 URL이 400을 반환해 지도가 전부 회색으로
  // 나오는데, 이전에는 초기값이 우연히 최신이라 드러나지 않았을 뿐이다.

  fetch('https://map.pstatic.net/nrb/styles/terrain.json?fmt=png')

      }
    })
    .catch(() => {});

  function initMap() {

        if (appendAfterIdx === null) {

  // ==========================================
  // 🔲 CAD 방식 박스 선택 삭제
  // 왼쪽→오른쪽 드래그: 박스에 "걸치기만" 해도 포함(크로싱)
  // 오른쪽→왼쪽 드래그: 박스 안에 "완전히 들어간" 점만 포함(윈도우)
  // ==========================================
  let boxSelectStart = null;   // 드래그 시작 컨테이너 좌표 {x, y}
  let boxSelectRect = null;    // 드래그 중 표시되는 사각형 DOM
  let boxSelectActive = false;

  function initBoxSelect() {
    const container = map.getContainer();

    container.addEventListener('mousedown', (e) => {
      if (currentEditMode !== 'boxDelete' && currentEditMode !== 'boxRelink' && currentEditMode !== 'boxCandidates' && currentEditMode !== 'boxCleanup') return;
      if (e.button !== 0) return;
      boxSelectActive = true;
      map.dragging.disable();
      const rect = container.getBoundingClientRect();
      boxSelectStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      boxSelectRect = document.createElement('div');
      boxSelectRect.className = 'box-select-rect';
      container.appendChild(boxSelectRect);
      updateBoxSelectRect(boxSelectStart.x, boxSelectStart.y, false);
    });

    container.addEventListener('mousemove', (e) => {
      if (!boxSelectActive || !boxSelectStart) return;
      const rect = container.getBoundingClientRect();
      const curX = e.clientX - rect.left;
      const curY = e.clientY - rect.top;
      const isLeftToRight = curX >= boxSelectStart.x;
      updateBoxSelectRect(curX, curY, isLeftToRight);
    });

    window.addEventListener('mouseup', (e) => {
      if (!boxSelectActive) return;
      boxSelectActive = false;
      map.dragging.enable();

      const rect = container.getBoundingClientRect();
      const endX = e.clientX - rect.left;
      const endY = e.clientY - rect.top;
      const isLeftToRight = endX >= boxSelectStart.x;

      const p1 = map.containerPointToLatLng([boxSelectStart.x, boxSelectStart.y]);
      const p2 = map.containerPointToLatLng([endX, endY]);

      if (boxSelectRect) { boxSelectRect.remove(); boxSelectRect = null; }
      boxSelectStart = null;

      if (currentEditMode === 'boxRelink') {
        applyBoxRelink(p1, p2, isLeftToRight);
      } else if (currentEditMode === 'boxCandidates') {
        applyBoxCandidates(p1, p2, isLeftToRight);
      } else if (currentEditMode === 'boxCleanup') {
        applyBoxCleanup(p1, p2, isLeftToRight);
      } else {
        applyBoxDelete(p1, p2, isLeftToRight);
      }
    });
  }

  function updateBoxSelectRect(curX, curY, isLeftToRight) {
    if (!boxSelectRect || !boxSelectStart) return;
    const x = Math.min(boxSelectStart.x, curX);
    const y = Math.min(boxSelectStart.y, curY);
    const w = Math.abs(curX - boxSelectStart.x);
    const h = Math.abs(curY - boxSelectStart.y);
    boxSelectRect.style.left = x + 'px';
    boxSelectRect.style.top = y + 'px';
    boxSelectRect.style.width = w + 'px';
    boxSelectRect.style.height = h + 'px';
    // 왼쪽→오른쪽(크로싱): 파란 실선, 오른쪽→왼쪽(윈도우): 초록 점선 (CAD 관례와 동일)
    if (isLeftToRight) {
      boxSelectRect.style.borderStyle = 'solid';
      boxSelectRect.style.borderColor = '#1976d2';
      boxSelectRect.style.background = 'rgba(25, 118, 210, 0.12)';
    } else {
      boxSelectRect.style.borderStyle = 'dashed';
      boxSelectRect.style.borderColor = '#2e7d32';
      boxSelectRect.style.background = 'rgba(46, 125, 50, 0.12)';
    }
  }

  // 박스(latlng1~latlng2) 안에 걸리는 allTrailPoints 인덱스 목록을 구한다 (삭제/재라우팅 공용)
  function findBoxSelectedIdx(latlng1, latlng2, isLeftToRight) {
    const south = Math.min(latlng1.lat, latlng2.lat);
    const north = Math.max(latlng1.lat, latlng2.lat);
    const west = Math.min(latlng1.lng, latlng2.lng);
    const east = Math.max(latlng1.lng, latlng2.lng);

    // 너무 작은 드래그(실수 클릭)는 무시
    if ((north - south) < 1e-7 && (east - west) < 1e-7) return [];

    const containsPoint = (p) => p.lat >= south && p.lat <= north && p.lon >= west && p.lon <= east;

    let idxList = [];
    if (isLeftToRight) {
      // 크로싱: 점 자체가 박스 안에 있거나, 그 점을 지나는 앞/뒤 선분이 박스를 스쳐도 포함
      allTrailPoints.forEach((p, idx) => {
        if (containsPoint(p)) { idxList.push(idx); return; }
        const prev = allTrailPoints[idx - 1];
        const next = allTrailPoints[idx + 1];
        if ((prev && segmentIntersectsBox(prev, p, south, west, north, east)) ||
            (next && segmentIntersectsBox(p, next, south, west, north, east))) {
          idxList.push(idx);
        }
      });
    } else {
      // 윈도우: 점이 박스 안에 완전히 들어간 경우만
      allTrailPoints.forEach((p, idx) => {
        if (containsPoint(p)) idxList.push(idx);
      });
    }
    return idxList;
  }

  function applyBoxDelete(latlng1, latlng2, isLeftToRight) {
    if (allTrailPoints.length === 0) return;

    const toDeleteIdx = findBoxSelectedIdx(latlng1, latlng2, isLeftToRight);

    if (toDeleteIdx.length === 0) {
      showToast('박스 안에 삭제할 점이 없습니다.');
      return;
    }
    if (allTrailPoints.length - toDeleteIdx.length < 2) {
      alert('등산로는 최소 2개 이상의 점이 있어야 합니다. 선택 범위를 줄여주세요.');
      return;
    }

    // 삭제될 범위 양 끝의 "살아남는" 점(끊긴 구간을 다시 이을 때 필요) 미리 확보
    const minDeleteIdx = Math.min(...toDeleteIdx);
    const maxDeleteIdx = Math.max(...toDeleteIdx);
    const beforePoint = minDeleteIdx > 0 ? allTrailPoints[minDeleteIdx - 1] : null;
    const afterPoint = maxDeleteIdx < allTrailPoints.length - 1 ? allTrailPoints[maxDeleteIdx + 1] : null;

    saveHistory();
    // 삭제로 구간이 끊기면(양 끝이 둘 다 남는 경우) 남는 앞쪽 점에 gapAfter를
    // 찍어둔다 — 그래야 필터링 후 남은 두 점이 배열상 인접해도 직선으로
    // 자동 봉합되지 않고 진짜로 끊어져 그려진다. 다시 잇고 싶으면 "➕
    // 이어그리기"나 "✏️ 궤적 수정" 모드로 직접 새 점을 찍어 그리거나,
    // "🔲 박스 구간 재라우팅"으로 그 틈을 잡아 자동 연결하면 된다.
    if (beforePoint && afterPoint) {
      beforePoint.gapAfter = true;
    }
    const deleteSet = new Set(toDeleteIdx);
    allTrailPoints = allTrailPoints.filter((_, idx) => !deleteSet.has(idx));
    renderTrailAndHandles();
    updateTrailStats();
    if (beforePoint && afterPoint) {
      showToast(`🔲 ${toDeleteIdx.length}개의 점을 삭제하고 끊었습니다. (${isLeftToRight ? '크로싱' : '윈도우'} 선택)`);
    } else {
      showToast(`🔲 ${toDeleteIdx.length}개의 점을 삭제했습니다. (${isLeftToRight ? '크로싱' : '윈도우'} 선택)`);
    }
  }

  // 🔲 박스로 지정한 구간을 재라우팅한다. 박스 밖 양쪽 고정점(before/after)
  // 사이를 통짜로 한 번에 잇는다 — beforePoint → afterPoint 딱 1개 구간.
  //
  // 예전에는 박스 안의 점들을 전부 "반드시 거쳐야 할 경유점"으로 보존해
  // 인접한 쌍마다 개별 구간을 조회했으나(2026-09-20 실사용 신고로 도입),
  // editTrail로 촘촘하게(예: 176개) 그려진 구간을 박스로 잡으면 177개
  // 세그먼트를 순차로(하나씩 await) 조회하느라 몹시 느려지고, 애초에
  // "촘촘한 점 하나하나를 다 강제로 거쳐가라"는 건 사용자 의도가 아니었다
  // (같은 날 재신고: "177개 점을 다 대조하는 거냐, 긴 거리를 짧은 거리로
  // 좁혀가며 비교해야 하는 거 아니냐"). 앞/뒤 고정점만 신뢰할 지점으로
  // 쓰고 그 사이는 실제 산길 데이터(공공데이터/OSRM/BRouter)가 통짜로
  // 다시 채우게 한다 — 박스 안의 세부 점 위치 자체는 더 이상 보존하지
  // 않는다(어차피 그 점들이 부정확해서 재라우팅하는 것이므로).
  //
  // 공공데이터는 "무조건 1순위 정답"이 아니다 — 사용자가 실제로 다녀온
  // 경로가 더 맞을 수도 있다(같은 신고: 능동2봉 구간에서 공공데이터
  // 트랙이 사용자가 그린 경로와 다른 방향을 가리킴). 그래서 후보를 받는
  // 즉시 allTrailPoints를 덮어쓰지 않고, 지도에 파란 점선 미리보기로만
  // 먼저 보여준 뒤, 사용자가 "✅ 이걸로 교체"를 눌러야만 실제로 반영한다.
  // "❌ 취소"를 누르면 원래 그린 경로(경유점 포함)는 전혀 건드리지 않는다.
  let boxRelinkPreviewLayer = null; // 미리보기 파란 점선 레이어
  let boxRelinkPreviewState = null; // { beforeIdx, afterIdx, affectedCount, resultPoints, anyFallback, sourceLabels }

  // 🧭 구간 후보 비교(실험적) 상태
  let boxCandidatesLayers = []; // 후보마다 하나씩, [{ layer, candidate }]
  let boxCandidatesState = null; // { beforeIdx, afterIdx, affectedCount, candidates }
  let boxCandidatesSelectedIdx = null; // 선택된 후보의 candidates 배열 인덱스
  const BOX_CANDIDATES_COLORS = ['#e91e63', '#ff9800', '#4caf50', '#9c27b0', '#00bcd4', '#795548'];

  // 무조건 1순위는 내 DB다 — 사용자가 박스로 지정한 앞/뒤 고정점 좌표를
  // 그대로 서버에 보내면, 그 좌표가 조금만 부정확해도(편집 중 드래그
  // 오차 등) "가장 가까운 실측 트랙도 수백 m 떨어져 있다"며 실패해버린다
  // (2026-09-20 신고 — 재약산~표충사 구간, 실제로는 정상 트랙이 있는데도
  // 고정점이 392m 떨어져 있어 실패로 잘못 보고됨). 재라우팅을 시도하기
  // 전에 먼저 이 두 고정점을 "내 DB에서 가장 가까운 실측 좌표"로 스냅해,
  // 애초에 사용자가 찍은 대략적인 위치가 아니라 실제 산길 위의 정확한
  // 지점을 앵커로 쓴다.
  //
  // /trail/snap-to-public-data(재매칭용)는 처음엔 재사용을 시도했으나,
  // 그 엔드포인트는 수백 개 점을 빠르게 처리하려고 20m 격자(3x3 셀)로만
  // 후보를 좁혀 실질 탐색 반경이 40~60m 안팎이라, max_snap_dist_m을
  // 아무리 크게 줘도 392m처럼 멀리 떨어진 고정점은 못 찾았다(실측 확인:
  // max_snap_dist_m=500을 줘도 snapped:false). 그래서 점이 2개뿐인 박스
  // 재라우팅 전용으로 격자 없이 전수 탐색하는 새 엔드포인트
  // /trail/nearest-user-track-point를 만들어 대신 쓴다.
  // max_snap_dist_m을 너무 크게(예: 500m) 주면, "박스 안 점들을 하나씩
  // 옮겨가며 탐색"하는 의미가 없어진다 — 첫 시도(박스 밖 고정점)가 282m
  // 떨어진 엉뚱한 지점으로도 "찾았다"고 즉시 확정돼버려, 정작 더 가까운
  // 진짜 끊긴 지점 근처의 다른 후보 점은 시도조차 안 하고 지나친다
  // (2026-09-20 실사용 신고 — 재약산/천황재 구간에서 파란 미리보기가
  // 빨간 끝점과 안 만남). STRICT_PUBLIC_DATA_SNAP_DIST_M(60m)과 동일한
  // 엄격도로 맞춰, 각 후보가 딱 붙어야만 채택하고 아니면 다음 후보로
  // 넘어가게 한다.
  const BOX_RELINK_ANCHOR_SNAP_DIST_M = 60;

  async function snapOnePointToUserTrack(p) {
    try {
      const res = await fetch(`${HIKINGBOT_API_BASE}/trail/nearest-user-track-point`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat: p.lat, lon: p.lon, max_snap_dist_m: BOX_RELINK_ANCHOR_SNAP_DIST_M, search_pad_m: 1000 })
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data.snapped ? { lat: data.lat, lon: data.lon, distM: data.dist_m } : null;
    } catch(e) {
      console.warn('고정점 내 DB 스냅 조회 실패:', e);
      return null;
    }
  }

  // 사용자가 박스로 지정한 정확한 경계점이 딱 맞아떨어지길 기대하지 않는다
  // — 그 바깥 고정점이 내 DB와 안 맞으면, 박스 "안쪽"에 이미 찍혀 있는
  // 점들을 순서대로 하나씩 시도해 내 DB와 만나는 지점을 자동으로 찾는다
  // (2026-09-20 요청: "박스 안에 있는 점에 대해서 조사하면 돼. 옆으로
  // 좌표를 한 칸씩 움직여서 내 db에 있는지 찾아"). candidateIdxList는
  // 시도할 인덱스를 우선순위 순서대로 담은 배열 — 시작 쪽은
  // [beforeIdx, minIdx, minIdx+1, ...maxIdx], 끝 쪽은
  // [afterIdx, maxIdx, maxIdx-1, ...minIdx] 순으로 호출한다.
  // 반환: { idx, point } 매칭된 인덱스와 스냅된 좌표, 못 찾으면 null.
  async function findFirstUserTrackMatch(candidateIdxList) {
    for (const idx of candidateIdxList) {
      const snapped = await snapOnePointToUserTrack(allTrailPoints[idx]);
      if (snapped) {
        return { idx, point: Object.assign({}, allTrailPoints[idx], { lat: snapped.lat, lon: snapped.lon }) };
      }
    }
    return null;
  }

  async function applyBoxRelink(latlng1, latlng2, isLeftToRight) {
    if (allTrailPoints.length === 0) return;

    const targetIdx = findBoxSelectedIdx(latlng1, latlng2, isLeftToRight);
    if (targetIdx.length === 0) {
      showToast('박스 안에 재라우팅할 구간이 없습니다.');
      return;
    }

    const minIdx = Math.min(...targetIdx);
    const maxIdx = Math.max(...targetIdx);
    // 코스 전체의 진짜 시작점/끝점은 그 자체를 고정점으로 쓴다(바깥에
    // 별도 고정점이 없으므로) — beforeIdx가 -1이면 minIdx 자신이 시작
    // 고정점, afterIdx가 배열 밖이면 maxIdx 자신이 끝 고정점이 된다.
    // 이 경우 그 고정점 자신은 경유점 체인에서 제외해 중복 교체를 막는다
    // (2026-09-20 신고 전까지는 이 케이스를 아예 막았으나, 시작/끝점이
    // 포함된 구간도 재라우팅할 수 있어야 한다는 요청으로 지원하게 됨).
    const hasBefore = minIdx - 1 >= 0;
    const hasAfter = maxIdx + 1 <= allTrailPoints.length - 1;
    const beforeIdx = hasBefore ? minIdx - 1 : minIdx;
    const afterIdx = hasAfter ? maxIdx + 1 : maxIdx;

    // 박스 밖 고정점(beforeIdx/afterIdx)이 내 DB와 안 맞으면, 박스 "안쪽"에
    // 이미 찍힌 점들을 순서대로 하나씩 시도해 내 DB와 만나는 지점을 찾는다
    // — 사용자가 박스로 정확한 경계를 고르길 기대하지 않는다(2026-09-20
    // 요청). 시작 쪽은 beforeIdx에서 박스 안쪽(minIdx→maxIdx)으로,
    // 끝 쪽은 afterIdx에서 박스 안쪽(maxIdx→minIdx)으로 탐색한다.
    const startCandidates = [beforeIdx];
    for (let i = minIdx; i <= maxIdx; i++) startCandidates.push(i);
    const endCandidates = [afterIdx];
    for (let i = maxIdx; i >= minIdx; i--) endCandidates.push(i);

    showToast('⏳ 내 DB와 맞는 시작 지점을 찾는 중입니다...');
    let startMatch = await findFirstUserTrackMatch(startCandidates);
    if (!startMatch) {
      // 내 DB에 이 근처 데이터가 아예 없으면(트랙 그룹 사이 공백 등), 원래
      // 박스 밖 고정점 좌표를 그대로 써서 OSRM/BRouter로 넘어간다(2026-09-20
      // 확정 — "내 DB가 없으면 재라우팅 자체를 막는다"는 이전 동작 대신,
      // OSM 보행로 데이터를 쓰는 OSRM이 실제 산길에 가까운 경로를 잘 만든다는
      // 게 확인되어, 내 DB 실패를 하드 블로커로 두지 않는다).
      startMatch = { idx: beforeIdx, point: allTrailPoints[beforeIdx] };
    }

    showToast('⏳ 내 DB와 맞는 끝 지점을 찾는 중입니다...');
    // 시작점으로 확정된 지점보다 뒤에 있는 후보만 유효하다(순서가 뒤집히면
    // 안 됨) — startMatch.idx 이후의 후보만 남긴다.
    const validEndCandidates = endCandidates.filter(i => i > startMatch.idx);
    let endMatch = await findFirstUserTrackMatch(validEndCandidates);
    if (!endMatch) {
      endMatch = { idx: afterIdx, point: allTrailPoints[afterIdx] };
    }

    // 확정된 두 지점 사이(그 사이의 원래 점들)만 교체 대상이고, 그 바깥의
    // 원래 점들(예: beforeIdx~startMatch.idx 사이에 있던 점)은 그대로 둔다
    // — 이미 내 DB와 맞다고 확인된 지점 자체를 다시 지우면 안 되므로.
    const finalBeforeIdx = startMatch.idx;
    const finalAfterIdx = endMatch.idx;
    const affectedCount = finalAfterIdx - finalBeforeIdx - 1;
    const chain = [startMatch.point, endMatch.point];

    showToast('⏳ 이 구간의 후보 경로를 찾는 중입니다...');
    try {
      const result = await fetchBoxRelinkChain(chain);
      showBoxRelinkPreview({
        beforeIdx: finalBeforeIdx, afterIdx: finalAfterIdx, affectedCount,
        snappedBeforePoint: startMatch.point, snappedAfterPoint: endMatch.point,
        ...result
      });
    } catch(e) {
      alert('구간 재라우팅 중 오류: ' + e.message);
    }
  }

  // 🧭 구간 후보 비교(실험적) — applyBoxRelink와 동일하게 박스 밖/안에서
  // 내 DB와 맞는 고정점을 자동 탐색하지만(findFirstUserTrackMatch 재사용),
  // 그 뒤로는 경로를 1개만 고르지 않고 /segments/candidates로 "서로 다른
  // GPX 파일이 이 구간을 커버하면 전부" 받아와 색이 다른 점선으로 동시에
  // 보여준다. 2026-09-21 요청 — 갈림길에서 갈라졌다 다시 만나는 구간처럼
  // 실제로 여러 갈래 길이 있는 곳은 시스템이 임의로 하나를 골라버리지
  // 말고 사람이 직접 비교해서 고르게 한다.
  async function applyBoxCandidates(latlng1, latlng2, isLeftToRight) {
    if (allTrailPoints.length === 0) return;

    const targetIdx = findBoxSelectedIdx(latlng1, latlng2, isLeftToRight);
    if (targetIdx.length === 0) {
      showToast('박스 안에 비교할 구간이 없습니다.');
      return;
    }

    const minIdx = Math.min(...targetIdx);
    const maxIdx = Math.max(...targetIdx);
    const hasBefore = minIdx - 1 >= 0;
    const hasAfter = maxIdx + 1 <= allTrailPoints.length - 1;
    const beforeIdx = hasBefore ? minIdx - 1 : minIdx;
    const afterIdx = hasAfter ? maxIdx + 1 : maxIdx;

    const startCandidates = [beforeIdx];
    for (let i = minIdx; i <= maxIdx; i++) startCandidates.push(i);
    const endCandidates = [afterIdx];
    for (let i = maxIdx; i >= minIdx; i--) endCandidates.push(i);

    showToast('⏳ 내 DB와 맞는 시작 지점을 찾는 중입니다...');
    let startMatch = await findFirstUserTrackMatch(startCandidates);
    if (!startMatch) startMatch = { idx: beforeIdx, point: allTrailPoints[beforeIdx] };

    showToast('⏳ 내 DB와 맞는 끝 지점을 찾는 중입니다...');
    const validEndCandidates = endCandidates.filter(i => i > startMatch.idx);
    let endMatch = await findFirstUserTrackMatch(validEndCandidates);
    if (!endMatch) endMatch = { idx: afterIdx, point: allTrailPoints[afterIdx] };

    const finalBeforeIdx = startMatch.idx;
    const finalAfterIdx = endMatch.idx;
    const affectedCount = finalAfterIdx - finalBeforeIdx - 1;

    showToast('⏳ 이 구간의 후보 경로들을 찾는 중입니다...');
    try {
      const res = await fetch(`${HIKINGBOT_API_BASE}/segments/candidates`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          from_lat: startMatch.point.lat, from_lon: startMatch.point.lon,
          to_lat: endMatch.point.lat, to_lon: endMatch.point.lon,
          max_snap_dist_m: 300
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || ('서버 응답 오류: ' + res.status));
      }
      const data = await res.json();
      const candidates = data.candidates.map(c => ({
        points: c.points.map(p => ({ lat: p[0], lon: p[1], ele: p[2] })),
        distanceM: c.distance_m,
        tracks: c.tracks,
      }));
      showBoxCandidatesPreview({
        beforeIdx: finalBeforeIdx, afterIdx: finalAfterIdx, affectedCount,
        snappedBeforePoint: startMatch.point, snappedAfterPoint: endMatch.point,
        candidates,
      });
    } catch(e) {
      showToast('❌ 이 구간에서 내 DB 후보를 찾지 못했습니다: ' + e.message);
    }
  }

  // 후보들을 색이 다른 점선으로 동시에 그리고, 클릭해 선택할 수 있게 한다.
  function showBoxCandidatesPreview(state) {
    boxCandidatesState = state;
    clearBoxCandidatesLayers();
    boxCandidatesSelectedIdx = null;

    state.candidates.forEach((c, idx) => {
      const color = BOX_CANDIDATES_COLORS[idx % BOX_CANDIDATES_COLORS.length];
      const coords = [state.snappedBeforePoint, ...c.points, state.snappedAfterPoint].map(p => [p.lat, p.lon]);
      const layer = L.polyline(coords, {
        color, weight: 5, opacity: 0.85, dashArray: '8, 8', interactive: true
      }).addTo(map);
      layer.on('click', () => selectBoxCandidate(idx));
      boxCandidatesLayers.push({ layer, candidate: c, color });
    });

    document.getElementById('boxCandidatesLabel').innerText =
      `🧭 후보 ${state.candidates.length}개 — 색이 다른 점선을 클릭해 선택하세요`;
    document.getElementById('btnApplyBoxCandidates').disabled = true;
    document.getElementById('boxCandidatesBar').style.display = 'flex';
  }

  function selectBoxCandidate(idx) {
    boxCandidatesSelectedIdx = idx;
    boxCandidatesLayers.forEach((entry, i) => {
      const isSelected = i === idx;
      entry.layer.setStyle({
        weight: isSelected ? 8 : 5,
        opacity: isSelected ? 1 : 0.4,
        dashArray: isSelected ? null : '8, 8',
      });
    });
    const c = boxCandidatesState.candidates[idx];
    document.getElementById('boxCandidatesLabel').innerText =
      `🧭 선택됨: [${c.tracks.join(', ')}] 약 ${(c.distanceM / 1000).toFixed(2)}km`;
    document.getElementById('btnApplyBoxCandidates').disabled = false;
  }

  function clearBoxCandidatesLayers() {
    boxCandidatesLayers.forEach(entry => map.removeLayer(entry.layer));
    boxCandidatesLayers = [];
  }

  function clearBoxCandidatesPreview() {
    clearBoxCandidatesLayers();
    document.getElementById('boxCandidatesBar').style.display = 'none';
    boxCandidatesState = null;
    boxCandidatesSelectedIdx = null;
  }

  // "✅ 선택한 후보로 교체" — applyBoxRelinkPreview와 동일한 패턴으로,
  // 이 시점에만 실제로 allTrailPoints를 바꾼다.
  async function applyBoxCandidatesSelection() {
    if (!boxCandidatesState || boxCandidatesSelectedIdx === null) return;
    const { beforeIdx, afterIdx, affectedCount, snappedBeforePoint, snappedAfterPoint, candidates } = boxCandidatesState;
    const chosen = candidates[boxCandidatesSelectedIdx];

    saveHistory();
    allTrailPoints[beforeIdx] = Object.assign({}, allTrailPoints[beforeIdx], { lat: snappedBeforePoint.lat, lon: snappedBeforePoint.lon });
    allTrailPoints[afterIdx] = Object.assign({}, allTrailPoints[afterIdx], { lat: snappedAfterPoint.lat, lon: snappedAfterPoint.lon });
    chosen.points.forEach(pt => { pt.source = 'public'; });
    allTrailPoints.splice(beforeIdx + 1, affectedCount, ...chosen.points);
    allTrailPoints = await fillMissingElevations(allTrailPoints);
    clearBoxCandidatesPreview();
    renderTrailAndHandles();
    updateTrailStats();
    showToast(`✅ [${chosen.tracks.join(', ')}] 경로로 교체했습니다.`);
  }

  function cancelBoxCandidatesPreview() {
    clearBoxCandidatesPreview();
    showToast('❌ 취소했습니다. 원래 경로가 그대로 유지됩니다.');
  }

  // chain(경유점 배열, 양 끝 포함)의 인접한 쌍마다 구간을 채워 하나로
  // 이어붙인다. 소스 순환(공공데이터→OSRM→BRouter)은 체인 전체에 대해
  // 한 번만 진행한다 — 구간마다 다른 소스가 섞이면 "다음 후보"를 눌렀을
  // 때 어떤 구간이 바뀌는지 사용자가 예측하기 어려워진다.
  // 세그먼트마다 "내 DB 먼저, 실패하면 OSRM → BRouter → 직선" 순으로
  // 자동 폴백한다(2026-09-20 확정 — 이전엔 체인 전체에 소스 1개를 적용해
  // 사용자가 "다음 후보"를 눌러가며 일일이 확인해야 했는데, 내 DB에
  // 데이터가 아예 없는 구간(예: 트랙 그룹 사이 1km+ 공백)에서는 "다음
  // 후보"를 몇 번이나 눌러야 하는 게 비합리적이다 — OSRM이 OSM 자체
  // 보행로 데이터로 라우팅하므로 내 DB가 없어도 실제 산길에 가까운
  // 경로를 잘 만들어준다는 게 실사용으로 확인됐다). "다음 후보" 버튼은
  // 이 자동 결과가 마음에 안 들 때 전체를 다른 단일 소스로 강제
  // 재시도하는 용도로 남겨둔다(tryNextBoxRelinkCandidate).
  async function fetchBoxRelinkChain(chain, forcedSourceKey) {
    const resultPoints = [chain[0]];
    let anyFallback = false;
    let usedUserTrack = false;
    const sourceLabelsUsed = new Set();
    const segCount = chain.length - 1;

    // forcedSourceKey가 있으면("다음 후보") 그 소스 하나만 순수하게
    // 시도하고, 없으면(기본 흐름) 세그먼트마다 공공데이터→OSRM→BRouter
    // 순으로 자동 폴백한다.
    const sourcesToTry = forcedSourceKey
      ? [BOX_RELINK_SOURCES.find(s => s.key === forcedSourceKey)]
      : BOX_RELINK_SOURCES;

    for (let i = 0; i < segCount; i++) {
      const a = chain[i], b = chain[i + 1];
      let segResult = null;
      let usedSource = null;

      for (const source of sourcesToTry) {
        const sourceName = source.key === 'public' ? '공공데이터' : source.key === 'osrm' ? 'OSRM' : 'BRouter';
        showToast(segCount > 1
          ? `⏳ [${sourceName}] 구간 조회 중... (${i + 1}/${segCount})`
          : `⏳ [${sourceName}] 후보 경로를 탐색 중입니다...`);
        const points = await source.fn(a.lat, a.lon, b.lat, b.lon);
        if (points) {
          segResult = points;
          usedSource = source;
          break;
        }
      }

      if (segResult) {
        if (segResult.isUserTrack) usedUserTrack = true;
        sourceLabelsUsed.add(usedSource.key);
        segResult.slice(1).forEach(pt => { pt.source = usedSource.key; resultPoints.push(pt); });
      } else {
        // 이 구간만 직선으로 대체 — 체인의 다른 구간은 그대로 유지
        anyFallback = true;
        sourceLabelsUsed.add('straight');
        const straightPt = { lat: b.lat, lon: b.lon, ele: null, source: 'straight' };
        resultPoints.push(straightPt);
      }
    }

    // 실제로 쓰인 소스들을 조합해 라벨을 만든다. 내 DB가 쓰였으면
    // "내 DB"를 우선 표시하고, 폴백이 섞였으면 그것도 함께 보여준다.
    let sourceLabel;
    if (usedUserTrack && sourceLabelsUsed.size === 1) {
      sourceLabel = '내 DB';
    } else if (usedUserTrack) {
      const others = [...sourceLabelsUsed].filter(k => k !== 'public').map(k => TRAIL_SOURCE_META[k].label);
      sourceLabel = `내 DB + ${others.join('/')}`;
    } else if (sourceLabelsUsed.size === 1) {
      sourceLabel = TRAIL_SOURCE_META[[...sourceLabelsUsed][0]].label;
    } else {
      sourceLabel = [...sourceLabelsUsed].map(k => TRAIL_SOURCE_META[k].label).join(' + ');
    }
    return { resultPoints, anyFallback, sourceLabel };
  }

  // 후보 경로를 실제로 반영하지 않고 파란 점선으로만 지도에 그린다.
  function showBoxRelinkPreview(state) {
    boxRelinkPreviewState = state;
    if (boxRelinkPreviewLayer) { map.removeLayer(boxRelinkPreviewLayer); boxRelinkPreviewLayer = null; }

    const previewCoords = state.resultPoints.map(p => [p.lat, p.lon]);
    boxRelinkPreviewLayer = L.polyline(previewCoords, {
      color: '#1565c0', weight: 5, opacity: 0.9, dashArray: '8, 8', interactive: false
    }).addTo(map);

    const label = state.anyFallback
      ? `🔁 후보: [${state.sourceLabel}] (일부 구간은 직선 대체)`
      : `🔁 후보: [${state.sourceLabel}]`;
    document.getElementById('boxRelinkPreviewLabel').innerText = label;
    document.getElementById('boxRelinkPreviewBar').style.display = 'flex';
  }

  function clearBoxRelinkPreview() {
    if (boxRelinkPreviewLayer) { map.removeLayer(boxRelinkPreviewLayer); boxRelinkPreviewLayer = null; }
    document.getElementById('boxRelinkPreviewBar').style.display = 'none';
    boxRelinkPreviewState = null;
  }

  // "✅ 이걸로 교체" — 이 시점에만 실제로 allTrailPoints를 바꾼다.
  // resultPoints는 양 끝(beforePoint/afterPoint, 내 DB로 스냅된 좌표)을
  // 포함하므로, 배열 교체 시 양 끝은 중복되지 않도록 가운데만 잘라
  // 끼워넣는다. 다만 양 끝 고정점 자체(beforeIdx/afterIdx)도 스냅된
  // 좌표로 갱신한다 — 그러지 않으면 "고정점을 내 DB 실측 좌표로 보정"한
  // 결과가 조회에만 쓰이고 실제로는 버려진다.
  async function applyBoxRelinkPreview() {
    if (!boxRelinkPreviewState) return;
    const { beforeIdx, afterIdx, affectedCount, resultPoints, anyFallback, sourceLabel } = boxRelinkPreviewState;
    const middle = resultPoints.slice(1, -1);

    saveHistory();
    allTrailPoints[beforeIdx] = Object.assign({}, allTrailPoints[beforeIdx], { lat: resultPoints[0].lat, lon: resultPoints[0].lon });
    allTrailPoints[afterIdx] = Object.assign({}, allTrailPoints[afterIdx], { lat: resultPoints[resultPoints.length - 1].lat, lon: resultPoints[resultPoints.length - 1].lon });
    allTrailPoints.splice(beforeIdx + 1, affectedCount, ...middle);
    allTrailPoints = await fillMissingElevations(allTrailPoints);
    clearBoxRelinkPreview();
    boxRelinkAttemptKey = null; // 다음에 이 구간을 다시 재라우팅하면 공공데이터부터 새로 순환
    renderTrailAndHandles();
    updateTrailStats();
    if (anyFallback) {
      showToast(`⚠️ [${sourceLabel}]로 교체했지만 일부 구간은 후보가 없어 직선으로 대체됐습니다. 확인 후 필요하면 직접 수정하세요.`);
    } else {
      showToast(`✅ [${sourceLabel}] 경로로 교체했습니다.`);
    }
  }

  // "🔁 다음 후보" — 기본 흐름(applyBoxRelink)은 세그먼트마다 내 DB→OSRM→
  // BRouter를 자동으로 폴백하지만, 그 결과가 마음에 안 들면 이 버튼으로
  // 전체를 공공데이터/OSRM/BRouter 중 하나로 강제 고정해 순환하며 비교할
  // 수 있다("공공데이터가 항상 정답은 아니다" — 사용자가 직접 그린 경로가
  // 더 맞을 수도 있으므로, 자동 결과를 그대로 받아들이지 않을 선택지를
  // 남겨둔다).
  async function tryNextBoxRelinkCandidate() {
    if (!boxRelinkPreviewState) return;
    const { beforeIdx, afterIdx, affectedCount, snappedBeforePoint, snappedAfterPoint } = boxRelinkPreviewState;

    // applyBoxRelink에서 이미 내 DB와 매칭 확정된 스냅 좌표를 그대로
    // 재사용한다 — allTrailPoints[beforeIdx]를 다시 읽으면 아직 "이걸로
    // 교체"를 누르기 전(스냅 좌표가 배열에 반영되기 전)이라 스냅 전
    // 원본 좌표로 되돌아가버린다.
    const chain = [snappedBeforePoint, snappedAfterPoint];
    const forcedSourceKey = BOX_RELINK_SOURCES[boxRelinkAttemptIdxFor(chain)].key;

    showToast('⏳ 다음 후보를 찾는 중입니다...');
    try {
      const result = await fetchBoxRelinkChain(chain, forcedSourceKey);
      showBoxRelinkPreview({ beforeIdx, afterIdx, affectedCount, snappedBeforePoint, snappedAfterPoint, ...result });
    } catch(e) {
      alert('다음 후보 조회 중 오류: ' + e.message);
    }
  }

  // "❌ 취소" — 원래 그린 경로(경유점 포함)는 전혀 건드리지 않고 미리보기만 지운다.
  function cancelBoxRelinkPreview() {
    clearBoxRelinkPreview();
    boxRelinkAttemptKey = null; // 다음에 이 구간을 다시 열면 공공데이터부터 새로 순환
    showToast('❌ 취소했습니다. 원래 경로가 그대로 유지됩니다.');
  }

  // 박스 재라우팅 전용: 같은 구간(before~after 좌표)에 반복 호출될 때마다
  // 공공데이터 → OSRM → BRouter → 직선 순으로 "다음 후보"를 하나씩 보여준다.
  // 처음 만들기(fetchTrailSegment)처럼 매번 공공데이터부터 자동으로
  // 시도하면, 사용자가 이미 "이 구간은 아니다"라고 판단해 손으로 고친
  // 결과를 되돌릴 방법이 없어진다 — 공공데이터가 항상 정답은 아니다
  // (사용자가 직접 그린 경로가 실제로 더 많이 다니는 길일 수도 있다).
  let boxRelinkAttemptKey = null;   // 마지막으로 재라우팅을 시도한 구간의 식별자
  let boxRelinkAttemptIdx = 0;      // 그 구간에서 몇 번째 소스까지 시도했는지
  // 박스 재라우팅의 공공데이터 시도에도 엄격한 스냅 반경(40m)을 적용한다.
  // 서버 기본값(300m)을 그대로 쓰면, 사용자가 박스로 직접 지정한 구간의
  // 양 끝(고정점) 근처에 실측 트랙이 없어도 수백 m 떨어진 완전히 다른
  // 능선의 트랙으로 스냅돼버려 "내가 그린 경로가 무시되고 엉뚱한 곳으로
  // 튄다"는 현상이 났다(2026-09-20 실사용 신고). 박스 재라우팅은 사용자가
  // 이미 "이 구간"이라고 좁혀 지정한 곳이므로, 그 근처(40m)에 진짜
  // 실측 데이터가 없으면 정직하게 실패시켜 OSRM/BRouter로 넘어가는 게 맞다.
  const BOX_RELINK_SOURCES = [
    { key: 'public', fn: (a, b, c, d) => trySegmentFromPublicData(a, b, c, d, STRICT_PUBLIC_DATA_SNAP_DIST_M) },
    { key: 'osrm', fn: trySegmentFromOsrm },
    { key: 'brouter', fn: trySegmentFromBRouter },
  ];

  // chain(경유점 포함 전체 좌표열)을 식별자로 삼아, 같은 체인에 반복
  // 호출될 때마다 다음 소스를 반환한다("다음 후보" 버튼용 순환 상태).
  // 체인 전체를 키로 써서, 경유점 구성이 조금이라도 다르면(다른 박스
  // 선택) 처음(공공데이터)부터 다시 순환하게 한다.
  function boxRelinkAttemptIdxFor(chain) {
    const key = chain.map(p => `${p.lat.toFixed(6)},${p.lon.toFixed(6)}`).join('->');
    if (key !== boxRelinkAttemptKey) {
      boxRelinkAttemptKey = key;
      boxRelinkAttemptIdx = 0;
    }
    const idx = boxRelinkAttemptIdx;
    boxRelinkAttemptIdx = (boxRelinkAttemptIdx + 1) % BOX_RELINK_SOURCES.length;
    return idx;
  }

  // 선분이 사각형(bbox)과 교차하는지 간단히 판정 (Cohen-Sutherland outcode 방식)
  function segmentIntersectsBox(p1, p2, south, west, north, east) {
    const code = (p) => {
      let c = 0;
      if (p.lon < west) c |= 1;
      else if (p.lon > east) c |= 2;
      if (p.lat < south) c |= 4;
      else if (p.lat > north) c |= 8;
      return c;
    };
    let c1 = code(p1), c2 = code(p2);
    let x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;

    while (true) {
      if ((c1 | c2) === 0) return true;       // 둘 다 박스 안 -> 교차
      if ((c1 & c2) !== 0) return false;      // 같은 방향으로 완전히 밖 -> 교차 없음

      const cOut = c1 !== 0 ? c1 : c2;
      let x, y;
      if (cOut & 8) { x = x1 + (x2 - x1) * (north - y1) / (y2 - y1); y = north; }
      else if (cOut & 4) { x = x1 + (x2 - x1) * (south - y1) / (y2 - y1); y = south; }
      else if (cOut & 2) { y = y1 + (y2 - y1) * (east - x1) / (x2 - x1); x = east; }
      else { y = y1 + (y2 - y1) * (west - x1) / (x2 - x1); x = west; }

      if (cOut === c1) { x1 = x; y1 = y; c1 = code({ lat: y1, lon: x1 }); }
      else { x2 = x; y2 = y; c2 = code({ lat: y2, lon: x2 }); }
    }
  }

  function switchLayer(type) {
    currentLayerType = type;
    if (currentLayer) map.removeLayer(currentLayer);
    document.querySelectorAll('.layer-item').forEach(el => el.classList.remove('selected'));

    let url = '';
    let maxNative = 17;

    if (type === 'terrain') {
      url = `https://map.pstatic.net/nrb/styles/terrain/${naverTileVersion}/{z}/{x}/{y}.png`;
      document.getElementById('lyrTerrain').classList.add('selected');
    } else if (type === 'basic') {
      url = `https://map.pstatic.net/nrb/styles/basic/${naverTileVersion}/{z}/{x}/{y}.png`;
      document.getElementById('lyrBasic').classList.add('selected');
    } else if (type === 'satellite') {
      url = `https://map.pstatic.net/nrb/styles/satellite/${naverTileVersion}/{z}/{x}/{y}.png`;
      document.getElementById('lyrSatellite').classList.add('selected');
    } else if (type === 'opentopo') {
      url = 'https://tile.opentopomap.org/{z}/{x}/{y}.png';
      maxNative = 16;
      document.getElementById('lyrTopo').classList.add('selected');
    }

    currentLayer = L.tileLayer(url, {
      maxZoom: 19,
      maxNativeZoom: maxNative,
      attribution: '© NAVER | 가자go'
    }).addTo(map);

    document.getElementById('layerMenu').style.display = 'none';
  }

  function toggleLayerMenu() {
    const menu = document.getElementById('layerMenu');
    menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
  }

  // 거리 계산 (Haversine 공식, km 단위)
  function calcDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371.0;
    const dLat = (lat2 - lat1) * Math.PI / 180.0;
    const dLon = (lon2 - lon1) * Math.PI / 180.0;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180.0) * Math.cos(lat2 * Math.PI / 180.0) *
              Math.sin(dLon / 2) ** 2;
    return 2.0 * R * Math.asin(Math.sqrt(a));
  }

  // 1단계: 마우스로 경유지 찍기
  function addWaypoint(lat, lon) {
    saveHistory();
    waypoints.push({ lat, lon });

    // 새로운 경유지가 추가되면 기존에 생성했던 등산로는 초기화하고 새로 계산 대기 상태로
    allTrailPoints = [];
    if (trailPolyline) { map.removeLayer(trailPolyline); trailPolyline = null; }
    if (trailPolylineHit) { map.removeLayer(trailPolylineHit); trailPolylineHit = null; }
    autosaveEditorState(); // updateTrailStats()를 거치지 않는 경로라 여기서 직접 저장

    renderWaypoints();

    if (waypoints.length === 1) {
      showToast('🚩 1번째 들머리가 찍혔습니다! 다음 경유지들을 순서대로 마우스로 클릭하세요.');
    } else {
      showToast(`📍 ${waypoints.length}번째 경유지 추가! 경유지 찍기를 완료하면 아래 [🥾 등산로 만들기] 버튼을 누르세요.`);
    }
  }

  // 경유지 마커 및 임시 가이드선 렌더링
  function renderWaypoints() {
    // 기존 마커 정리
    markerLayers.forEach(m => map.removeLayer(m));
    markerLayers = [];

    // 임시 가이드선 (경유지 찍는 중 순서를 보여주는 파란 점선)
    if (!guideLine) {
      guideLine = L.polyline([], {
        color: '#1976d2',
        weight: 3,
        dashArray: '6, 6',
        opacity: 0.7,
        interactive: false
      }).addTo(map);
    }
    const latlngs = waypoints.map(p => [p.lat, p.lon]);
    guideLine.setLatLngs(latlngs);

    // 경유지 뱃지 및 점 표시
    waypoints.forEach((wp, idx) => {
      let badgeTitle = '';
      let badgeBg = '#2e7d32';

      if (idx === 0) {
        badgeTitle = '🚩 1. 들머리';
        badgeBg = '#1976d2';
      } else if (idx === waypoints.length - 1 && waypoints.length > 1) {
        badgeTitle = `🏁 ${idx + 1}. 날머리`;
        badgeBg = '#d32f2f';
      } else {
        badgeTitle = `📍 ${idx + 1}번`;
        badgeBg = '#e65100';
      }

      const icon = L.divIcon({
        className: 'custom-badge-icon',
        html: `<div class="route-badge" style="background:${badgeBg};">${badgeTitle}</div>`,
        iconAnchor: [30, 12]
      });

      const m = L.marker([wp.lat, wp.lon], { icon, draggable: true }).addTo(map);
      m.on('dragend', (e) => {
        saveHistory();
        const pos = e.target.getLatLng();
        waypoints[idx] = { lat: pos.lat, lon: pos.lng };
        renderWaypoints();
        showToast(`📍 ${idx + 1}번 경유지 위치를 변경했습니다.`);
      });
      m.on('contextmenu', (e) => {
        L.DomEvent.stopPropagation(e);
        saveHistory();
        waypoints.splice(idx, 1);
        renderWaypoints();
        showToast(`🗑️ ${idx + 1}번 경유지를 삭제했습니다.`);
      });
      markerLayers.push(m);

      const circle = L.circleMarker([wp.lat, wp.lon], {
        radius: idx === 0 || (idx === waypoints.length - 1 && waypoints.length > 1) ? 7 : 5,
        color: '#ffffff',
        weight: 2.5,
        fillColor: badgeBg,
        fillOpacity: 1,
        interactive: false
      }).addTo(map);
      markerLayers.push(circle);
    });

    document.getElementById('pointCount').innerText = `${waypoints.length} 개`;

    // 아직 등산로 만들기 전에는 임시 직선 거리 표시
    let tempKm = 0.0;
    for (let i = 1; i < waypoints.length; i++) {
      tempKm += calcDistanceKm(waypoints[i-1].lat, waypoints[i-1].lon, waypoints[i].lat, waypoints[i].lon);
    }
    document.getElementById('totalDist').innerText = `${tempKm.toFixed(2)} km (임시)`;
  }

  // 두 지점 사이의 실제 등산로 산길 경로 자동 탐색 (OSRM Foot -> BRouter 백업)
  // 반환값 { points, fallback }: fallback=true면 실제 산길을 못 찾아 직선으로 대체된 구간
  // 개별 소스 하나만 시도하는 함수들. 실패/데이터없음이면 null을 반환한다
  // (throw하지 않음 — 호출부가 다음 소스로 넘어갈지 스스로 판단하게 하기 위함).

  // 공공데이터 실측 트랙 — 한국등산·트레킹지원센터가 배포한 실제 산행
  // 기록(hikingbot)이 이 구간 근처를 지나간다면 그걸 그대로 쓴다.
  async function trySegmentFromPublicData(fromLat, fromLon, toLat, toLon, maxSnapDistM) {
    try {
      const body = { from_lat: fromLat, from_lon: fromLon, to_lat: toLat, to_lon: toLon };
      // 서버 기본값(300m)은 사용자가 박스 재라우팅으로 결과를 직접 보고
      // 승인하는 흐름에는 괜찮지만, 자동 2차 재매칭처럼 확인 없이 그대로
      // 적용되는 흐름에서는 너무 관대하다 — 짧은 구간(175m 안팎)을 이으려는
      // 건데 끝점이 300m까지 떨어진 엉뚱한 다른 능선 실측 트랙으로 스냅될
      // 수 있어, 호출자가 원하면 더 엄격한 값을 넘길 수 있게 한다.
      if (maxSnapDistM !== undefined) body.max_snap_dist_m = maxSnapDistM;
      const segRes = await fetch(`${HIKINGBOT_API_BASE}/segments/between`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (segRes.ok) {
        const segData = await segRes.json();
        if (segData.points && segData.points.length > 1) {
          const points = segData.points.map(p => ({ lat: p[0], lon: p[1], ele: p[2] }));
          // 서버가 "내 DB 우선, 없으면 공공DB" 정책으로 고른 결과라, 이
          // 구간 근처에 사용자 트랙이 있었으면 항상 그것만 쓰였다(is_user_track).
          // 호출자(박스 재라우팅 미리보기)가 "공공데이터"로 뭉뚱그리지 않고
          // "내 DB"로 구분 표시할 수 있도록 함께 반환한다.
          points.isUserTrack = !!segData.is_user_track;
          return points;
        }
      }
    } catch(e) {
      console.warn('공공데이터 구간 조회 실패:', e);
    }
    return null;
  }

  // OSRM Foot (등산로/보행자 고속 라우팅)
  async function trySegmentFromOsrm(fromLat, fromLon, toLat, toLon) {
    try {
      const osrmUrl = `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson`;
      const res = await fetch(osrmUrl);
      if (res.ok) {
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          const coords = data.routes[0].geometry.coordinates;
          if (coords && coords.length > 1) {
            // OSRM foot geometry는 고도를 포함하지 않음 -> ele는 null로 두고 이후 일괄 보완
            return coords.map(c => ({ lat: c[1], lon: c[0], ele: null }));
          }
        }
      }
    } catch(e) {
      console.warn('OSRM Foot 실패:', e);
    }
    return null;
  }

  // BRouter (산악 하이킹 전문 라우팅, hiking-mountain 프로필은 좌표에 고도를 함께 반환)
  async function trySegmentFromBRouter(fromLat, fromLon, toLat, toLon) {
    try {
      const brouterUrl = `https://brouter.de/brouter?lonlats=${fromLon},${fromLat}|${toLon},${toLat}&profile=hiking-mountain&alternativeidx=0&format=geojson`;
      const res = await fetch(brouterUrl);
      if (res.ok) {
        const data = await res.json();
        if (data.features && data.features.length > 0) {
          const coords = data.features[0].geometry.coordinates;
          if (coords && coords.length > 1) {
            // BRouter는 [lon, lat, ele] 3번째 값으로 고도를 함께 준다
            return coords.map(c => ({ lat: c[1], lon: c[0], ele: (c.length > 2 && !isNaN(c[2])) ? c[2] : null }));
          }
        }
      }
    } catch(e) {
      console.warn('BRouter 실패:', e);
    }
    return null;
  }

  // 좌표열(points)의 실제 경로 길이(각 구간 haversine 거리의 합)를 구한다
  // — fetchTrailSegment가 "반환된 경로가 직선거리 대비 비정상적으로
  // 길지 않은지" 검증할 때 쓴다.
  function calcPathLengthM(points) {
    let total = 0;
    for (let i = 1; i < points.length; i++) {
      total += calcDistanceM(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);
    }
    return total;
  }

  // 🐛 2026-10-02 수정(사용자 재현: "gpx-editor에서 산행경로 만들기
  // 하니 도로까지 다 불러와서 만들어.. 내가 찍은 경로만 나오게 해야
  // 하는데", 스크린샷: 설악산 코스에서 경유지와 무관하게 북쪽 해안
  // 도로까지 크게 우회하는 경로가 생성됨) — OSRM(routed-foot)/BRouter
  // 둘 다 공개 라우팅 서버라, 그 구간의 OSM 등산로 데이터가 부실하면
  // "걸어서 갈 수 있는 가장 가까운 길"을 도로까지 포함해 엉뚱하게
  // 멀리 우회한 경로로 반환하는 경우가 실제로 있다. 두 점 사이
  // 직선거리 대비 반환된 경로 길이가 비정상적으로 길면(예: 실제
  // 등산로는 아무리 구불거려도 직선거리의 3배를 잘 안 넘는다) 신뢰하지
  // 않고 버려, 다음 후보(BRouter, 그다음 직선 fallback)로 넘어가게 한다.
  const TRAIL_SEGMENT_MAX_DETOUR_RATIO = 3.0;
  function isSegmentDetourReasonable(points, fromLat, fromLon, toLat, toLon) {
    const straightM = calcDistanceM(fromLat, fromLon, toLat, toLon);
    if (straightM < 30) return true; // 너무 짧은 구간은 비율 자체가 불안정하므로 검증을 건너뛴다
    const pathM = calcPathLengthM(points);
    return pathM <= straightM * TRAIL_SEGMENT_MAX_DETOUR_RATIO;
  }

  // "등산로 만들기"(전체 새로 생성)용 — OSRM → BRouter → 직선 순으로
  // 시도한다. 공공데이터는 여기서 쓰지 않는다(생성 단계에서 자동 매칭하면
  // 사용자가 찍은 점과 무관한 다른 실측 트랙이 섞여 들어오는 문제가 있어,
  // "🔄 편집한 경로를 공공데이터로 재매칭" 버튼에서만 사용하기로 함).
  // trySegmentFromPublicData 자체는 삭제하지 않는다 — 박스 구간 재라우팅
  // (BOX_RELINK_SOURCES)이 여전히 사용 중이다.
  async function fetchTrailSegment(fromLat, fromLon, toLat, toLon) {
    const fromOsrm = await trySegmentFromOsrm(fromLat, fromLon, toLat, toLon);
    if (fromOsrm && isSegmentDetourReasonable(fromOsrm, fromLat, fromLon, toLat, toLon)) {
      return { points: fromOsrm, fallback: false, source: 'osrm' };
    }
    if (fromOsrm) {
      console.warn('OSRM 경로가 직선거리 대비 과도하게 우회함 — 다음 후보로 넘어감', {
        straightM: calcDistanceM(fromLat, fromLon, toLat, toLon),
        pathM: calcPathLengthM(fromOsrm)
      });
    }

    const fromBRouter = await trySegmentFromBRouter(fromLat, fromLon, toLat, toLon);
    if (fromBRouter && isSegmentDetourReasonable(fromBRouter, fromLat, fromLon, toLat, toLon)) {
      return { points: fromBRouter, fallback: false, source: 'brouter' };
    }
    if (fromBRouter) {
      console.warn('BRouter 경로가 직선거리 대비 과도하게 우회함 — 직선으로 대체', {
        straightM: calcDistanceM(fromLat, fromLon, toLat, toLon),
        pathM: calcPathLengthM(fromBRouter)
      });
    }

    // 탐색 실패(또는 둘 다 비정상적으로 우회) 시 직선 2점 반환 (fallback 표시)
    return { points: [{ lat: fromLat, lon: fromLon, ele: null }, { lat: toLat, lon: toLon, ele: null }], fallback: true, source: 'straight' };
  }

  // 예전에는 고도가 없는 좌표를 Open-Elevation(외부 무료 API)로 보완했으나,
  // 그 API가 자주 응답하지 않아(2026-09-20 확인 — TLS 연결부터 실패) "고도값
  // 없는 좌표 N개" 경고가 반복적으로 뜨는 문제가 있었다. 고도는 경로 계산/
  // 매칭 등 앱 로직 어디에도 쓰이지 않고 최종 GPX 파일의 <ele> 태그로만
  // 나가므로, 불안정한 외부 의존성을 없애고 있는 고도값만 매끄럽게 다듬는다
  // (호출부 이름은 기존과 동일하게 유지해 7곳의 호출 지점을 건드리지 않음).
  async function fillMissingElevations(points) {
    return smoothElevations(points);
  }

  // Open-Elevation은 30m 격자(SRTM) DEM이라, 좌표가 그보다 촘촘하면 같은 격자
  // 안의 여러 점이 완전히 같은 고도값을 받아 계단처럼 뚝뚝 끊겨 보인다. GPS
  // 실측 고도 자체도 센서 노이즈로 들쭉날쭉하므로, 이동평균으로 부드러운
  // 곡선을 만든다. 창 크기는 좌표 밀도에 따라 커도 봉우리/골짜기까지
  // 뭉개지지 않도록 홀수·소폭(5)으로 고정한다.
  function smoothElevations(points, windowSize) {
    windowSize = windowSize || 5;
    const half = Math.floor(windowSize / 2);
    const elevations = points.map(p => p.ele);
    const smoothed = elevations.map((ele, i) => {
      if (ele === null || ele === undefined || isNaN(ele)) return ele;
      let sum = 0, count = 0;
      for (let k = -half; k <= half; k++) {
        const j = i + k;
        if (j < 0 || j >= elevations.length) continue;
        const v = elevations[j];
        if (v === null || v === undefined || isNaN(v)) continue;
        sum += v;
        count++;
      }
      return count > 0 ? sum / count : ele;
    });
    points.forEach((p, i) => { p.ele = smoothed[i]; });
    return points;
  }

  // 🥾 버튼 클릭 진입점 — 이미 궤적이 있으면(박스 삭제·직접 수정 등으로 손을 댄 뒤)
  // 재생성 시 그 수정 내용이 전부 사라지고 처음 찍은 경유지 기준으로 새로
  // 라우팅되므로, 사용자가 명시적으로 확인한 경우에만 진행한다.
  function onClickCreateTrailButton() {
    if (allTrailPoints.length > 0) {
      const confirmed = confirm('⚠️ 이미 만들어진 등산로가 있습니다.\n\n다시 만들면 지금까지 손댄 내용이 모두 사라지고, 처음 찍은 경유지 기준으로 산길 전체가 새로 계산됩니다.\n\n💡 일부 구간만 고치고 싶다면 취소한 뒤 "🔁 박스 구간 재라우팅" 모드를 이용하세요 — 그 구간만 바뀌고 나머지는 그대로 유지됩니다.\n💡 지금까지 편집한 경로 전체 모양은 유지하면서 실측 좌표로만 정밀 보정하고 싶다면 취소한 뒤 "🔄 편집한 경로를 공공데이터로 재매칭" 버튼을 쓰세요.\n\n정말 전체를 다시 만드시겠습니까?');
      if (!confirmed) return;
    }
    createTrailRoute();
  }

  // 🌟 2단계: [ 🥾 등산로 만들기 ] 버튼 클릭 시 실제 산길 등산로 자동 생성!
  async function createTrailRoute() {
    if (waypoints.length < 2) {
      alert('지도 위를 마우스로 클릭하여 최소 2개 이상의 경유지(출발점, 도착점)를 먼저 찍어주세요.');
      return;
    }

    const btn = document.getElementById('btnCreateTrail');
    btn.classList.add('loading');
    btn.innerText = '⏳ 계산 중...';
    isCalculating = true;

    showToast('🥾 찍으신 경유지 사이의 실제 등산로 산길을 척척 찾는 중입니다...');

    allTrailPoints = [];
    fallbackRanges = [];

    try {
      // 경유지 사이를 OSRM → BRouter → 직선 순으로만 잇는다(공공데이터는
      // 생성 단계에서 쓰지 않음). 재약산처럼 등산로가 밀집된 지역에서는
      // 공공데이터를 자동 매칭하면 사용자가 찍은 점과 무관한 다른 실측
      // 트랙(케이블카 하단 트랙 등)이 섞여 들어오는 문제가 있었다(2026-09-20
      // 실사용 신고). OSRM/BRouter는 순수하게 두 점 사이만 계산하므로
      // 사용자가 찍은 대로 잘 이어진다. 공공데이터와의 매칭은 편집이 끝난
      // 뒤 "🔄 편집한 경로를 공공데이터로 재매칭" 버튼(snapTrailToPublicData)
      // 에서만 사용자가 원할 때 수행한다.
      for (let i = 0; i < waypoints.length - 1; i++) {
        btn.innerText = `⏳ 계산 중 (${i + 1}/${waypoints.length - 1})`;
        const p1 = waypoints[i];
        const p2 = waypoints[i + 1];

        const { points: segment, fallback, source } = await fetchTrailSegment(p1.lat, p1.lon, p2.lat, p2.lon);
        segment.forEach(pt => { pt.source = source; }); // 편집 모드 색상 구분용 — 삭제/삽입/이동에도 점을 따라다닌다

        const startIdx = allTrailPoints.length === 0 ? 0 : allTrailPoints.length - 1;
        if (i === 0) {
          segment.forEach(pt => allTrailPoints.push(pt));
        } else {
          // 중복 방지
          segment.slice(1).forEach(pt => allTrailPoints.push(pt));
        }
        if (fallback) {
          fallbackRanges.push([startIdx, allTrailPoints.length - 1]);
        }
      }

      // 고도값이 비어있는 좌표(OSRM 구간, 직선 fallback 구간)를 Open-Elevation으로 보완
      btn.innerText = '⏳ 고도 계산 중...';
      allTrailPoints = await fillMissingElevations(allTrailPoints);

      // 가이드선 숨기기
      if (guideLine) { map.removeLayer(guideLine); guideLine = null; }

      // 실제 산길을 따르는 선명한 빨간색 완성 등산로선 렌더링!
      if (!trailPolyline) {
        trailPolyline = L.polyline([], {
          color: '#d32f2f',
          weight: 6,
          opacity: 0.95,
          interactive: false
        }).addTo(map);
      }
      trailPolyline.setLatLngs(trailPointsToSegments(allTrailPoints));

      // 실제 굽이굽이 산길 누적 거리 및 소요 시간 정밀 계산
      let totalKm = 0.0;
      for (let i = 1; i < allTrailPoints.length; i++) {
        totalKm += calcDistanceKm(allTrailPoints[i-1].lat, allTrailPoints[i-1].lon, allTrailPoints[i].lat, allTrailPoints[i].lon);
      }

      const hours = totalKm / 2.5;
      const h = Math.floor(hours);
      const m = Math.round((hours - h) * 60);
      const timeStr = h > 0 ? `${h}시간 ${m}분` : `${m}분`;

      document.getElementById('totalDist').innerText = `${totalKm.toFixed(2)} km`;
      document.getElementById('estTime').innerText = timeStr;

      map.fitBounds(trailPolyline.getBounds(), { padding: [60, 60] });

      saveHistory();
      btn.classList.remove('loading');
      btn.innerText = '✅ 완성! (다시 만들기)';
      setEditMode('editTrail');
      renderFallbackHighlights();
      if (fallbackRanges.length > 0) {
        showToast(`⚠️ ${fallbackRanges.length}개 구간은 실제 산길을 찾지 못해 직선으로 대체됐습니다. 노란 점선 구간을 꼭 확인하세요!`);
      } else {
        showToast(`🎉 등산로가 완성되었습니다!\n잘못된 구간은 점을 마우스로 드래그하거나 우클릭하여 바로 수정하실 수 있습니다.`);
      }
    } catch(err) {
      alert('등산로 계산 중 오류가 발생했습니다: ' + err.message);
      btn.classList.remove('loading');
      btn.innerText = '🥾 등산로 만들기';
    } finally {
      isCalculating = false;
    }
  }

  // 🔄 편집이 끝난 현재 경로(allTrailPoints)를 그대로 유지한 채, 각 점을
  // 근처 공공데이터 실측 좌표로 재매칭한다. "등산로 다시 만들기"와 달리
  // 처음 찍은 경유지 기준으로 그래프를 새로 계산하지 않으므로, 사용자가
  // 손으로 다듬은 경로의 전체 모양과 순서는 그대로 유지된다.
  // 🔄 재매칭 2차 시도 — 1차(점 단위 최근접 스냅, max_snap_dist_m=30)에서
  // 매칭 안 된(빨간) 구간만 골라 그래프 최단경로(trySegmentFromPublicData,
  // /segments/between)로 다시 이어본다. 재약산처럼 실측 데이터가 성긴
  // 지역에서 30m 반경 최근접 스냅으로는 놓치는 실측 트랙(100~300m 떨어진)
  // 이 실제로 있었다(2026-09-20 실사용 신고 반영).
  //
  // "먼저 크게, 실패하면 잘게" 전략을 쓴다: 빨간 연속 구간(run) 전체를
  // 하나의 통짜 조각으로 먼저 시도해, 사용자가 직접 업로드한 긴 실측
  // 트랙(예: 영남 알프스 수 km 종주 기록)이 있으면 한 번에 통째로
  // 커버되게 한다. 그 시도가 실패해야만(그 근처에 커버할 실측 데이터가
  // 아예 없거나, 있어도 그래프 최단경로가 너무 멀리 튀는 경우) 175m
  // 단위로 잘게 쪼개 재시도한다 — 구간이 짧으면 시작/끝이 서로 가까워
  // 케이블카 등 엉뚱한 트랙으로 잘못 이어질 위험이 낮기 때문이다(이건
  // 세분화 단계에서만 필요한 안전장치이지, 통짜 시도 단계에서는 어차피
  // STRICT_PUBLIC_DATA_SNAP_DIST_M로 양 끝점 정확도를 담보하므로 문제
  // 없다).
  const RETRY_CHUNK_TARGET_M = 175;  // 세분화 단계에서만 쓰는 목표 길이
  const MAX_RETRY_CHUNKS = 40;       // 서버 부하/대기시간 상한
  const RETRY_CONCURRENCY = 2;       // 서버 _merge_process_pool의 워커 수(2)에 맞춤

  // snapStatus === 'unmatched'인 점들이 연속으로 이어지는 구간(run)을 찾는다.
  function findUnmatchedRuns(points) {
    const runs = [];
    let runStart = -1;
    for (let i = 0; i < points.length; i++) {
      if (points[i].snapStatus === 'unmatched') {
        if (runStart === -1) runStart = i;
      } else if (runStart !== -1) {
        runs.push([runStart, i - 1]);
        runStart = -1;
      }
    }
    if (runStart !== -1) runs.push([runStart, points.length - 1]);
    return runs;
  }

  // run(연속 unmatched 구간)을 누적 거리 기준으로 재시도 조각들로 쪼갠다.
  // 조각의 양 끝은 항상 "고정점"(matched였거나 run 바깥의 원래 점)이어야
  // applyBoxRelink와 같은 방식으로 안전하게 교체할 수 있다 — run이 배열
  // 맨 앞/끝에 붙어 있으면(바깥 고정점이 없음) 그 run은 통째로 건너뛴다.
  function splitRunIntoChunks(points, run) {
    const [runStart, runEnd] = run;
    if (runStart === 0 || runEnd === points.length - 1) return [];

    const chunks = [];
    let fromIdx = runStart - 1;
    let accM = 0;
    for (let i = runStart; i <= runEnd; i++) {
      accM += calcDistanceM(points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon);
      const isLast = (i === runEnd);
      if (accM >= RETRY_CHUNK_TARGET_M || isLast) {
        const toIdx = i + 1; // run 내부의 다음 분할점이거나, 마지막이면 run 바깥 고정점
        chunks.push({
          fromIdx, toIdx, fromPt: points[fromIdx], toPt: points[toIdx],
          originalPts: points.slice(fromIdx, toIdx + 1),
        });
        fromIdx = toIdx;
        accM = 0;
      }
    }
    return chunks;
  }

  // 여러 비동기 작업을 한 번에 최대 limit개까지만 동시에 실행한다(간단한
  // 동시성 제한 워커 풀). 서버가 그래프 계산을 워커 2개로만 병렬 처리하므로,
  // 그보다 많이 한꺼번에 쏴봐야 서버 큐에서 대기할 뿐이고 다른 사용자의
  // 요청까지 지연시킨다.
  async function runWithConcurrency(items, limit, worker, onProgress) {
    let nextIdx = 0;
    let done = 0;
    async function runOne() {
      while (nextIdx < items.length) {
        const idx = nextIdx++;
        await worker(items[idx], idx);
        done++;
        if (onProgress) onProgress(done, items.length);
      }
    }
    await Promise.all(Array.from({ length: Math.min(limit, items.length) }, runOne));
  }

  async function snapTrailToPublicData() {
    if (allTrailPoints.length === 0) {
      alert('먼저 "🥾 등산로 만들기"로 경로를 만들거나 GPX를 불러온 뒤 사용하세요.');
      return;
    }

    const confirmed = confirm('🔄 지금 경로의 모양과 순서는 그대로 유지하면서, 각 점을 근처 공공데이터 실측 좌표로 정밀 보정할까요?\n\n(근처에 실측 데이터가 없는 구간의 점은 그대로 남습니다)');
    if (!confirmed) return;

    const btn = document.getElementById('btnSnapToPublicData');
    btn.disabled = true;
    btn.innerText = '⏳ 재매칭 중...';
    showToast('🔄 편집된 경로를 공공데이터 실측 좌표로 재매칭하는 중입니다...');

    try {
      const res = await fetch(`${HIKINGBOT_API_BASE}/trail/snap-to-public-data`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          points: allTrailPoints.map(p => ({ lat: p.lat, lon: p.lon })),
          max_snap_dist_m: 30
        })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || ('서버 응답 오류: ' + res.status));
      }
      const data = await res.json();

      saveHistory();
      // gapAfter(끊김 표시)와 source(어떤 라우터가 이 구간을 만들었는지)는
      // 점 개수·순서가 그대로이므로 인덱스 기준으로 그대로 유지한다.
      // snapStatus만 이번 재매칭 결과로 새로 채운다 — 재매칭은 "공공데이터에
      // 얼마나 가까운지"를 보여주는 것이지 source(출처) 자체를 바꾸는 게
      // 아니므로, source를 'public'으로 덮어쓰지 않는다(그러면 점 하나만
      // 스냅 실패해도 소스 오버레이 선이 끊겨 보이는 문제가 생긴다).
      allTrailPoints = data.points.map((p, idx) => {
        const original = allTrailPoints[idx];
        const wasSnapped = data.snapped[idx];
        return {
          lat: p[0], lon: p[1], ele: p[2],
          gapAfter: original.gapAfter,
          source: original.source,
          snapStatus: wasSnapped ? 'matched' : 'unmatched'
        };
      });

      // 2차 시도, 1라운드: 매칭 안 된(빨간) 연속 구간(run) 전체를 하나의
      // 통짜 조각으로 먼저 시도한다. run이 배열 맨 앞/끝에 걸쳐 바깥
      // 고정점이 없으면 그 run은 대상에서 제외된다.
      const runs = findUnmatchedRuns(allTrailPoints);
      const wholeRunChunks = runs
        .filter(run => run[0] > 0 && run[1] < allTrailPoints.length - 1)
        .map(run => ({
          fromIdx: run[0] - 1,
          toIdx: run[1] + 1,
          fromPt: allTrailPoints[run[0] - 1],
          toPt: allTrailPoints[run[1] + 1],
          originalPts: allTrailPoints.slice(run[0] - 1, run[1] + 2),
        }));

      async function tryChunk(chunk) {
        // 2차는 사용자 확인 없이 자동 적용되므로 서버 기본값(300m)보다
        // 훨씬 엄격한 반경(40m)만 허용한다 — 안 그러면 끝점이 최대 300m
        // 까지 떨어진 엉뚱한 다른 실측 트랙으로 스냅되어 오히려 원래
        // (직선/OSRM)보다 나쁜 경로로 바뀌는 문제가 있었다.
        const seg = await trySegmentFromPublicData(chunk.fromPt.lat, chunk.fromPt.lon, chunk.toPt.lat, chunk.toPt.lon, STRICT_PUBLIC_DATA_SNAP_DIST_M);
        if (!seg) return;
        // 끝점만 가까워도 서버가 그래프 최단경로로 중간을 엉뚱한 능선/사면
        // 트랙을 태워 크게 우회시킬 수 있다(2026-09-20 신고 — 재약산 하단
        // 구간에서 사용자가 그린 궤적과 전혀 다른 길로 매칭됨). 원본 구간의
        // 각 점이 새 경로에서 MAX_ROUTE_DEVIATION_M보다 멀리 벗어나면 이
        // 통짜 결과는 버리고(→ 다음 라운드에서 세분화 재시도), 사용자가
        // 그린 궤적을 무시한 채 적용하지 않는다.
        const deviation = maxDeviationFromOriginal(chunk.originalPts, seg);
        if (deviation > MAX_ROUTE_DEVIATION_M) {
          console.warn(`공공데이터 통짜 매칭 거부: 원본 궤적과 최대 ${deviation.toFixed(0)}m 이격`);
          return;
        }
        const middle = seg.slice(1, -1);
        middle.forEach(pt => { pt.source = 'public'; pt.snapStatus = 'matched'; });
        chunk.result = middle;
      }

      if (wholeRunChunks.length > 0) {
        btn.innerText = `⏳ 빨간 구간 통짜 시도 중 (0/${wholeRunChunks.length})...`;
        await runWithConcurrency(wholeRunChunks, RETRY_CONCURRENCY, tryChunk, (done, total) => {
          btn.innerText = `⏳ 빨간 구간 통짜 시도 중 (${done}/${total})...`;
        });
      }

      // 2차 시도, 2라운드: 1라운드에서 통짜로 실패한 run만 175m 단위로
      // 잘게 쪼개 재시도한다. 구간이 짧으면 시작/끝이 서로 가까워
      // 케이블카 등 엉뚱한 트랙으로 잘못 이어질 위험이 낮다.
      const failedRuns = runs.filter((run, i) => {
        const wc = wholeRunChunks.find(c => c.fromIdx === run[0] - 1 && c.toIdx === run[1] + 1);
        return wc && !wc.result; // 1라운드 대상이었는데 실패한 run만
      });
      let subChunks = [];
      failedRuns.forEach(run => { subChunks = subChunks.concat(splitRunIntoChunks(allTrailPoints, run)); });

      let skippedForLimit = 0;
      if (subChunks.length > MAX_RETRY_CHUNKS) {
        skippedForLimit = subChunks.length - MAX_RETRY_CHUNKS;
        subChunks = subChunks.slice(0, MAX_RETRY_CHUNKS);
      }

      if (subChunks.length > 0) {
        btn.innerText = `⏳ 빨간 구간 세분화 재시도 중 (0/${subChunks.length})...`;
        await runWithConcurrency(subChunks, RETRY_CONCURRENCY, tryChunk, (done, total) => {
          btn.innerText = `⏳ 빨간 구간 세분화 재시도 중 (${done}/${total})...`;
        });
      }

      // 배열 변형(splice)은 두 라운드의 조회가 전부 끝난 뒤에야 한다 —
      // fromIdx 내림차순으로 일괄 적용해, 앞쪽 조각을 먼저 바꿔도 아직
      // 처리 안 한 뒤쪽(사실은 배열상 더 앞쪽) 조각의 인덱스가 밀리는
      // 문제를 원천적으로 없앤다. 통짜(wholeRunChunks)와 세분화(subChunks)
      // 결과가 같은 run을 가리키는 경우는 없다(통짜가 성공하면 그 run은
      // 애초에 failedRuns에서 빠지므로 subChunks에 나타나지 않는다) —
      // 겹칠 걱정 없이 두 배열을 그대로 합쳐 정렬한다.
      const chunks = wholeRunChunks.concat(subChunks);
      let improvedCount = 0;
      chunks
        .filter(c => c.result)
        .sort((a, b) => b.fromIdx - a.fromIdx)
        .forEach(c => {
          allTrailPoints.splice(c.fromIdx + 1, c.toIdx - c.fromIdx - 1, ...c.result);
          improvedCount++;
        });

      allTrailPoints = await fillMissingElevations(allTrailPoints);

      renderTrailAndHandles();
      updateTrailStats();
      const finalUnmatched = allTrailPoints.filter(p => p.snapStatus === 'unmatched').length;
      const wholeSuccess = wholeRunChunks.filter(c => c.result).length;
      const subSuccess = subChunks.filter(c => c.result).length;
      let msg = `✅ 1차 ${data.snapped_count}/${data.total_count}개 매칭`;
      if (chunks.length > 0 || skippedForLimit > 0) {
        msg += ` + 2차(통짜 ${wholeSuccess}/${wholeRunChunks.length}, 세분화 ${subSuccess}/${subChunks.length})로 ${improvedCount}개 구간 추가 매칭`;
      }
      msg += `. 남은 미매칭 점: ${finalUnmatched}개`;
      if (skippedForLimit > 0) {
        msg += ` (재시도 대상이 많아 ${skippedForLimit}개 구간은 건너뜀)`;
      }
      showToast(msg);
    } catch(err) {
      // 이전 재매칭에서 남은 표시가 있으면(오류로 이번엔 새로 못 채웠으므로)
      // 낡은 색이 그대로 남지 않도록 지운다.
      let hadStatus = false;
      allTrailPoints.forEach(p => { if (p.snapStatus !== undefined) { delete p.snapStatus; hadStatus = true; } });
      if (hadStatus) renderTrailAndHandles();
      alert('재매칭 중 오류가 발생했습니다: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = '🔄 편집한 경로를 공공데이터로 재매칭';
    }
  }

  // 🌟 3단계: [ 💾 GPX 파일 저장 ] 클릭 시 파일 다운로드
  async function exportGPX() {
    if (waypoints.length < 2) {
      alert('먼저 지도 위에 경유지를 2개 이상 찍어주세요.');
      return;
    }

    // 아직 등산로 만들기 버튼을 안 눌렀다면 자동으로 먼저 생성 후 저장
    if (allTrailPoints.length === 0) {
      await createTrailRoute();
    }

    if (allTrailPoints.length < 2) {
      alert('등산로 코스가 정상적으로 생성되지 않았습니다.');
      return;
    }

    // 저장 직전 자동 재검증 — 미확인 위험 구간이 있으면 저장을 막고 확인창을 띄운다
    const summary = collectValidationSummary();
    if (summary.warnCount > 0) {
      pendingExportSummary = summary;
      openConfirmOverlay(summary);
      return;
    }

    writeGpxFile();
  }

  // 여러 세그먼트(OSRM/BRouter/공공데이터)를 이어붙이는 과정에서 이음매
  // 양쪽에 완전히 같은 좌표가 연속으로 남는 경우가 있다(예: 재약산 코스
  // 실사용 확인 시 735개 중 49개가 이런 중복이었음, 2026-09-20). 경로
  // 모양 자체에는 영향 없이 그냥 같은 지점을 두 번 찍은 것뿐이지만, GPS
  // 내비게이션 앱이 방향 계산 시 0으로 나누는 등 사소한 오류를 낼 수
  // 있어 저장 시점에 걸러낸다. 편집 화면의 allTrailPoints 자체는 건드리지
  // 않고, GPX로 쓸 때만(렌더링 단계에서) 건너뛴다 — 실행취소 이력이나
  // 편집 중 인덱스 참조에 영향을 주지 않기 위함이다.
  function dedupeConsecutivePoints(points) {
    const result = [];
    let prevKey = null;
    points.forEach(p => {
      const key = `${p.lat.toFixed(6)},${p.lon.toFixed(6)}`;
      // gapAfter가 찍힌 점은 좌표가 우연히 직전 점과 같아도 건너뛰지
      // 않는다 — "여기서 끊겼다"는 의미를 담은 점이 사라지면 안 된다
      // (지금 GPX 저장 자체는 gap을 트랙 분리로 반영하지 않지만, 이후
      // 로직이 이 점을 참조할 가능성에 대비한 안전장치).
      if (key === prevKey && !p.gapAfter) return;
      result.push(p);
      prevKey = key;
    });
    return result;
  }

  // ════════════════════════════════════════════════════════════════
  // 🧹 GPX 정제(클린업) — 2026-10-02 추가
  // 가자맵(track_viewer.html)에서 반복된 버그(서봉 정상 지그재그로 인한
  // 하단 안내 깜빡임, 왕복 클러스터링 ROUNDTRIP_CLUSTER_INDEX_GAP을
  // 3→10으로 늘려야 했던 사례)의 공통 원인은 GPX 원본 트랙 자체가 사람이
  // 실제로 서성인/헤맨 GPS 로그를 그대로 담고 있다는 것이었다. 가자맵
  // 쪽에서 이 노이즈를 "견디도록" 계속 땜질하는 대신, GPX 데이터 자체를
  // 정제하는 게 근본적이라는 판단으로 추가한다.
  //
  // 왕복 코스 대원칙(가장 중요): "좌표가 같다 ≠ 같은 위치다". 왕복
  // 코스(A→B→C→B→A)에서 같은 좌표(B)를 두 번 지나가는 것은 GPX 점
  // 순서(=트랙 위 누적거리 위치)가 다른 별개의 노드이고, 둘 다 반드시
  // 보존해야 한다. "좌표가 같은 점을 찾아 하나로 합친다"는 방식은 이
  // 섹션의 어떤 함수에도 절대 쓰지 않는다 — dedupeConsecutivePoints처럼
  // "바로 인접한 두 점이 완전히 같을 때"만 허용된 축약이다.
  // ════════════════════════════════════════════════════════════════

  // 방위각(0~360, 진북 기준 시계방향) — 이 파일엔 기존에 없던 유틸이라
  // track_viewer.html의 calculateBearing과 동일한 공식으로 새로 추가한다.
  function calcBearingDeg(lat1, lon1, lat2, lon2) {
    const toRad = d => d * Math.PI / 180;
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  // 두 방위각의 최단 각도차(0~180)
  function shortestAngleDiffDeg(a, b) {
    let diff = Math.abs(a - b) % 360;
    if (diff > 180) diff = 360 - diff;
    return diff;
  }

  // 반경 radiusM 안에 minPointsInCluster개 이상 몰린 "정체 클러스터"
  // 후보를 찾는다 — ①서성임 압축(compressStationaryClusters)과 ②헤맴
  // 구간 탐지(flagLingeringSegments)가 이 공통 로직을 공유한다.
  // 반환: [{ startIdx, endIdx }] (points 배열 기준, startIdx~endIdx가
  // 클러스터 "내부" 범위 — 진입점은 startIdx-1, 이탈점은 endIdx+1).
  function findStationaryClusters(points, radiusM, minPointsInCluster) {
    const clusters = [];
    let i = 0;
    while (i < points.length) {
      let j = i;
      // i를 중심으로, 반경 안에 계속 머무는 한 j를 넓혀간다(연속 구간 전제).
      let clusterEnd = i;
      for (let k = i + 1; k < points.length; k++) {
        const d = calcDistanceM(points[i].lat, points[i].lon, points[k].lat, points[k].lon);
        if (d > radiusM) break;
        clusterEnd = k;
      }
      const count = clusterEnd - i + 1;
      if (count >= minPointsInCluster) {
        clusters.push({ startIdx: i, endIdx: clusterEnd });
        i = clusterEnd + 1;
      } else {
        i++;
      }
    }
    return clusters;
  }

  // 클러스터 하나를 분류한다: 'pass'(명확한 정상 통과, 보존) |
  // 'loiter'(명확한 제자리 서성임, 자동 압축 대상) | 'turnaround'
  // (그 외 애매한 모든 경우 — 왕복 전환점이든 뭐든 자동 판단하지 않고
  // 보존, 사용자가 flagLingeringSegments로 확인 후 수동 정리).
  //
  // 🐛 2026-10-02 수정(사용자 지시: "결론은 유턴이야. 그렇지? 지금
  // 처럼 애매한 데는 그냥 끝점에서 유턴으로 해. 유턴부분은 수정을
  // 수동으로 할께") — 실측(서봉)에서 "waypoint 전후를 넓게 묶으면
  // 결국 전진이 있어 pass로 분류되지만, 그 안에 실제 서성임이 섞여
  // 있는" 애매한 케이스가 발견됐다. 이런 애매한 경우를 'pass'(자동
  // 보존·조용히 넘어감)로 두면 사용자가 문제를 알아챌 수 없으므로,
  // "명확한 정상 통과"만 'pass'로 남기고 그 외(방향 판정이 불가능한
  // 경계 상황 포함)는 전부 'turnaround'로 묶어 flagLingeringSegments
  // 에 노출시킨다 — 압축은 안 하되 사용자가 반드시 확인하게 만든다.
  // progressRatioThreshold=2.0, directionDiffThreshold=90(도)는 계획서
  // 확정값 — 상수로 분리해 호출부에서 조정 가능하게 둔다.
  function classifyCluster(points, cluster, progressRatioThreshold, directionDiffThresholdDeg) {
    const { startIdx, endIdx } = cluster;
    const entryIdx = Math.max(0, startIdx - 1);
    const exitIdx = Math.min(points.length - 1, endIdx + 1);
    const entryPt = points[entryIdx];
    const exitPt = points[exitIdx];

    // 클러스터 내부(진입점 포함~이탈점 포함) 총 이동거리
    let totalMoveM = 0;
    for (let k = entryIdx; k < exitIdx; k++) {
      totalMoveM += calcDistanceM(points[k].lat, points[k].lon, points[k + 1].lat, points[k + 1].lon);
    }
    const straightM = calcDistanceM(entryPt.lat, entryPt.lon, exitPt.lat, exitPt.lon);
    // 0 나눗셈 방지 — 진입점과 이탈점이 거의 같은 좌표(완전한 유턴)면
    // Infinity로 취급하고, 서성임으로 단정하지 않는다(아래 방향차 판정으로 넘김).
    const progressRatio = straightM < 1 ? Infinity : (totalMoveM / straightM);
